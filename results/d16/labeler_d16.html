in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Latvian Figure Skating Championships > Senior medalists > Ice dance) Alexandr Kirsanov, the 2000 Latvian Champion in ice dance with his partner Barbara Hanley, was returning from the 2025 U.S. Figure Skating Championships with two of his students aboard American Airlines Flight 5342 when their airplane collided with a helicopter upon approach to Ronald Reagan Washington National Airport and plunged into the Potomac River. All aboard were killed, including twenty-eight skaters, coaches, and family members returning from the U.S. Championships.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day."}, {"id": "q016", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What major broadcasting policy initiatives or rules are officially attributed to the regulator during their tenure?", "ev": "(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois."}, {"id": "q017", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which formal investigations, inquiries, or sanctions (if any) have been reported in connection with the cyclist and performance-enhancing substances?", "ev": "(Performance-enhancing substance > Abstract) Performance-enhancing substances (PESs), also known as performance-enhancing drugs (PEDs), are substances that are used to improve any form of activity performance in humans.  Many substances, such as anabolic steroids, can be used to improve athletic performance and build muscle, which in most cases is considered cheating by organized athletic organizations. This usage is often referred to as doping. Athletic performance-enhancing substances are sometimes referred to as ergogenic aids. Cognitive performance-enhancing drugs, commonly called nootropics, are sometimes used by students to improve academic performance. Performance-enhancing substances are also used by military personnel to enhance combat performance.\n\n(Greg LeMond > Abstract) Gregory James LeMond (born June 26, 1961) is an American former road racing cyclist. He won the Tour de France three times, and the Road Race World Championship twice, becoming the only American male to win the former.  LeMond began his professional cycling career in 1981. Two years later, LeMond became the first American male cyclist to win the Road World Championship. He won the Tour de France in 1986, becoming the first non-European professional cyclist to win the men's Tour. LeMond was accidentally shot with pellets and seriously injured while hunting in 1987. Following the shooting, he underwent two surgeries and missed the next two Tours. At the 1989 Tour, LeMond completed an improbable comeback to win in dramatic fashion on the race's final stage. He successfully defended his Tour title the following year, becoming one of only nine riders to win three or more Tours. LeMond retired from competition in December 1994 and was inducted into the United States Bicycling Hall of Fame in 1996. He was the first professional cyclist to sign a million-dollar contract and the first cyclist to appear on the cover of Sports Illustrated.  During his career, LeMond championed several technological advancements in pro cycling, including the introduction of aerodynamic \"triathlon\" handlebars and carbon fiber bicycle frames, which he later marketed through his company LeMond Bicycles. LeMond's other business interests have included restaurants, real estate, and consumer fitness equipment. He is also a vocal opponent of performance-enhancing drug use in cycling and is a founding board member of 1in6, a nonprofit charity that assists male victims of child sex abuse.\n\n(David McCann (cyclist) > Abstract) David McCann (born 17 March 1973 in Belfast) is an Irish former professional road bicycle racer, who rode in the 1996, 2000 and 2012 Olympic Games. He was the Irish national road race champion in 2000, 2001 and 2006, and won the Irish national time trial championships a record 6 times (2001, 2002, 2004, 2005, 2009 & 2010). He last rode for the Synergy Baku Cycling Project, an Azerbaijan-registered UCI Continental team.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Michele Ferrari > Abstract) Michele Ferrari is an Italian physician, cycling coach and author, who is mostly known for his role in supplying bicycle racers with performance-enhancing drugs, notably EPO. His most famous client was Lance Armstrong."}, {"id": "q018", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "In which magazine or platform was Daisuke Igarashi's ocean-themed manga first serialized and during which years?", "ev": "(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(The Sword of Paros > Publication > Manga) Written by Kaoru Kurimoto and illustrated by Yumiko Igarashi, The Sword of Paros was serialized in Kadokawa Shoten 's Monthly Asuka manga magazine from March 1986 to February 1987. The series was collected in three tankōbon volumes.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016.\n\n(Children of the Sea (manga) > Development) The concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind."}, {"id": "q019", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did contemporary critics review Daisuke Igarashi's ocean-themed manga at the time of initial serialization versus after adaptation?", "ev": "(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(Children of the Sea (manga) > Development) The concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\n(List of Umineko When They Cry chapters > Abstract) The manga series Umineko When They Cry is written by Ryukishi07 and illustrated by six different manga artists working separately on different story arcs based on the Umineko: When They Cry visual novel series by 07th Expansion. The first manga, an adaptation of Legend of the Golden Witch illustrated by Kei Natsumi, began serialization in Square Enix 's Gangan Powered magazine in the January 2008 issue. After Gangan Powered was discontinued, the manga was transferred to Square Enix's Monthly Gangan Joker magazine with the debut May 2009 issue, and continued until the publication of the September 2009 issue. Jirō Suzuki drew the adaptation of Turn of the Golden Witch which was serialized between the August 2008 and October 2010 issues of Square Enix's GFantasy. The manga adaptation of Banquet of the Golden Witch is illustrated by Kei Natsumi and was serialized between the October 2009 and July 2011 issues of Gangan Joker. Sōichirō drew the adaptation of Alliance of the Golden Witch, which was serialized in Square Enix's Internet-based magazine Gangan Online between October 1, 2009, and February 2, 2012.  The manga adaptation of End of the Golden Witch is illustrated by Akitaka and was serialized between the November 2010 and December 2012 issues of Gangan Joker. Hinase Momoyama drew the adaptation of Dawn of the Golden Witch, which was serialized between the December 2010 and December 2012 issues of GFantasy. The manga adaptation of Requiem of the Golden Witch is illustrated by Eita Mizuno and started serialization in the May 2011 issue of Square Enix's Monthly Shōnen Gangan. The manga adaptation of Twilight of the Golden Witch is drawn by Kei Natsumi and started serialization in the February 2012 issue of Gangan Joker. A manga titled Umineko: When They Cry Tsubasa, illustrated by Fumi Itō, began serialization in Square Enix's Young Gangan Big on June 25, 2011 and concluded in Big Gangan on April 25, 2013. Four tankōbon volumes of Legend of the Golden Witch were released in Japan between June 2008 and December 2009 under Square Enix's Gangan Comics imprint. 53 volumes have been released over the entire series. Yen Press licensed the series and began releasing omnibuses of two or three volumes in December 2012, and continued releasing these omnibuses mostly every three or four months until June 2020.\n\n(My One-Hit Kill Sister > Media > Manga) A manga adaptation by Kenji Taguchi started serialization online via Shogakukan 's Sunday Webry website on March 6, 2020, as well as the seinen manga magazine Monthly Sunday Gene-X since April 17 of the same year. The series finished on July 28, 2023. Shogakukan collected its chapters in twelve tankōbon volumes, released from July 10, 2020, to September 12, 2023."}, {"id": "q020", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What therapeutic use exemptions, medical treatments, or disclosed medications involving the cyclist have been documented in public records?", "ev": "(Bicycle > Abstract) A bicycle, also called a pedal cycle, bike, push-bike or cycle, is a human-powered or motor-assisted, pedal-driven, single-track vehicle, with two wheels attached to a frame, one behind the other. A bicycle rider is called a cyclist, or bicyclist.  The bicycle was invented in Europe in the 19th century. By the early 21st century, there were more than 1 billion bicycles. Bicycles are the principal means of transport in many regions. They are also popular for recreation, and have been adapted for use as children's toys. Bicycles are used for commuting, shopping, fitness, military and police applications, courier services, bicycle racing, and artistic cycling.  The basic shape and configuration of a typical upright or \"safety\" bicycle, has changed little since the first chain-driven model was developed around 1885. However, many details have been improved, especially since the advent of modern materials and computer-aided design. These have allowed for a proliferation of specialized designs for many types of cycling. In the 21st century, electric bicycles have become popular.  The bicycle's invention has had an enormous effect on society, both in terms of culture and of advancing modern industrial methods. Several components that played a key role in the development of the car were initially invented for use in the bicycle, including ball bearings, pneumatic tires, chain-driven sprockets, and tension-spoked wheels.\n\n(David McCann (cyclist) > Abstract) David McCann (born 17 March 1973 in Belfast) is an Irish former professional road bicycle racer, who rode in the 1996, 2000 and 2012 Olympic Games. He was the Irish national road race champion in 2000, 2001 and 2006, and won the Irish national time trial championships a record 6 times (2001, 2002, 2004, 2005, 2009 & 2010). He last rode for the Synergy Baku Cycling Project, an Azerbaijan-registered UCI Continental team.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard."}, {"id": "q021", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which Sri Lankan political parties and Tamil groups have advocated for greater regional autonomy or federal arrangements for the Northern Province?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the c"}, {"id": "q022", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How many internally displaced persons returned to the Northern Province between 2009 and 2015 according to official records?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Transport > Rail) Sri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.  Most of the railways were developed during the British colonial period.  The railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\n(Northern Province, Sri Lanka > Education) The Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament."}, {"id": "q023", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which major in-ring factions or stables have existed in the promotion and when were they formed and disbanded?", "ev": "(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(Anoaʻi family > Tag teams and stables > The Sons of Samoa) The Sons of Samoa are a tag team currently wrestling in the Puerto Rican wrestling promotion World Wrestling Council and WXW. The team consists of Afa Jr. and L.A. Smooth.  The team was formed at WXW in 1998, briefly as a stable with Samu. The team reformed in April 2009 at a WXW show with Afa Jr. and L.A. Smooth. In 2013, they began wrestling at the WWC promotion in Puerto Rico. At Euphoria 2013, they lost to Thunder and Lightning. They won the WWC World Tag Team Championship from Thunder and Lightning on February 9, before losing the titles back to Thunder and Lightning on March 30 at Camino a la Gloria. However, they won the titles on June 29, 2013, at Summer Madness.\n\n(Ken Mantell > Abstract) Ken Lusk, better known by his ring name Ken Mantell, is an American retired professional wrestler, promoter and booker who competed throughout the National Wrestling Alliance in the 1970s and 80s. He is a former NWA World Junior Heavyweight Champion, having defeated Danny Hodge, and won the NWA World Tag Team Championship with Ron Bass in November 1975. He worked as the booker of World Class Championship Wrestling during its peak years and, as a promoter, formed the Wild West Wrestling promotion, which merged with World Class when he became part-owner in early 1988.\n\n(List of Pro Wrestling Noah personnel > Background) Noah contracts typically range from developmental deals for dojo trainees to full-time contracts. Personnel appear on untelevised live events and on televised events which are aired on various broadcasters or on CyberFight 's own international streaming service, Wrestle Universe.  Personnel is organized by their role in Noah. The performer's ring name is listed on the left and their real name is on the right. This list also acknowledges which stable (referred to by Noah as \"units\") a wrestler is a part of.  As of 2025, there are seven central units in Noah:  In addition to the promotion's seven central units, wrestlers who appear on a part-time basis are also listed.  As Noah has working relationships with WWE, International Wrestling Revolution Group (IWRG) and numerous Japanese promotions, wrestlers from these promotions may appear on Noah events and have their home promotions or stables from their home promotions listed as their affiliated unit.\n\n(Professional wrestling in the United Kingdom > History > 1930s: All-in wrestling) While various styles of amateur wrestling continued as legitimate sports, grappling as a promotional business did not return to Britain until the beginning of the 1930s when the success of the more worked aspects of professional wrestling in America, like gimmickry and showmanship, were introduced to British wrestling. It was with this revival that the more submission -based Catch As Catch Can wrestling style, which had already replaced Greco Roman wrestling as the dominant style of professional wrestling in the United States back in the 1890s, became the new dominant style in Britain. With Lancashire style catch-as-catch-can already a major amateur sport particularly in Northern England, there existed a ready-made source of potential recruits to professional wrestling.  Amateur wrestler, Sir Atholl Oakeley got together with fellow grappler Henry Irslinger to launch one of the first promotions to employ the new style of wrestling which was coined \"All-in\" wrestling. Though, like many wrestlers throughout the business, Oakeley would claim his wrestling was entirely legitimate, his claim was highly du"}, {"id": "q024", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What have been the major venue and touring patterns for the promotion within Japan since 2001?", "ev": "(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986."}, {"id": "q025", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What World Championship titles and years did the cyclist obtain in track team pursuit events?", "ev": "(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Elinor Barker > Life and career > 1994–2012) Elinor Jane Barker was born on 7 September 1994 in Cardiff. The older sister of racing cyclist Megan Barker, Elinor took up cycling with the Maindy Flyers aged ten to avoid swimming classes and later attended Llanishen High School.  In 2011, Barker became the British national junior pursuit champion, finished runner-up in the British national junior scratch race, and claimed silver in the time-trial at the UCI Junior Road World Championships in Copenhagen. At the 2012 UEC U23/Junior European Track Championship, she won gold medals in both the junior individual pursuit and the team pursuit. At the UCI Junior Track Cycling World Championships, she then won silver medals in the individual pursuit and omnium and a bronze in the team pursuit.  Competing in road cycling, she became the junior time trial world champion in 2012, completing the 15.6-kilometre (9.7-mile) course in Valkenburg, Netherlands in 22:26.29, beating Cecilie Uttrup Ludwig of Denmark by 35.87 seconds. That year, she joined the Olympic Development Programme.  Barker competed in the UCI Track Cycling World Cup in October 2012 in Cali, Colombia, where she won a silver medal in the team pursuit while competing for Team SWI Welsh Cycling. The following month, Barker made her debut for Great Britain at the Track Cycling World Cup in Glasgow as a replacement for an ill Joanna Rowsell. Barker, Laura Kenny and Dani King triumphed over Australia in the final. Barker was named Carwyn James Junior Sportswoman of the Year at the 2012 BBC Wales Sports Personality of the Year awards.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Elinor Barker > Abstract) Elinor Jane Barker (born 7 September 1994) is a Welsh road and track cyclist, who has ridden for UCI Women's Team Uno-X Mobility since 2022. As a track cyclist, she is an Olympic champion in the team pursuit and a world champion in the team pursuit, madison, points race, and scratch race disciplines. She has won four Olympic medals (one gold, two silver and one bronze) during her career. Her overall tally of four Olympic medals is a record for a Welsh woman.  In her youth, Barker was the 2012 junior time trial world champion in road cycling. On her debut for Great Britain in November 2012, she was part of the team pursuit side that won gold in the World Cup event in Glasgow. The following year, she triumphed in the team pursuit at both the Track Cycling World Championships and European Track Championships. She helped Great Britain defend their world team pursuit title in 2014, and won a silver and a bronze at that year's Commonwealth Games. Further World and European Championships medals followed in 2015, and Barker won an Olympic gold medal in the team pursuit at the 2016 Summer Olympics.  Barker won her first individual world title in the points race in 2017, won a gold medal in the same discipline at the 2018 Commonwealth Games, and became the scratch race world champion in 2019. She won her second points race world title and a European title in the elimination race in 2020, and a silver in the team pursuit at the delayed 2020 Summer Olympics. Following maternity leave, she won two gold medals at both the European and World Track Cycling Championships in 2023. At the 2024 Olympics, Barker won a bronze medal in the team pursuit and a silver in the madison.  Barker is an Olympic champion, a three-time world champion and seven-time European champion in the team pursuit, as well as a two-time world champion in the points race, a world champion in both the madison and scratch race, a two-time European madison champion, and one-time European elimination race champion. She is also a Commonwealth Games gold medalist in the points race. In her road cycling career, she finished seventh at the Gent-Wevelgem in 2023, and third at the British National Time Trial Championships in 2023 and 2024."}, {"id": "q026", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What prominent public debates or congressional hearings criticized the regulator's standards on indecency, fairness, or political broadcasting?", "ev": "(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(2008 United States presidential debates > Debate schedule > Participants) The Republican nominees were Senator John McCain, and Alaska Governor Sarah Palin. The Democratic nominees were Senators Barack Obama and Joseph Biden. The debates were sponsored by the Commission on Presidential Debates.  On August 2, 2008, Obama accepted the CPD proposal. In his letter, he stated that due to the short period between the conventions and the campaign, that it was \"likely that the four Commission debates will be the sole series of debates\" between the two. McCain criticized Obama for rejecting his town hall proposal. On August 18, 2008, McCain and Obama announced they had agreed to the general CPD framework for the three scheduled presidential debates and the one vice presidential debate.\n\n(Barack Obama \"Joker\" poster > Abstract) The Barack Obama \" Joker \" poster is a manipulated image of Barack Obama, then president of the United States, used by some critics of the Obama administration. The image was created by Firas Alkhateeb in January 2009, and portrays Obama as DC comic book supervillain the Joker, based on the portrayal by Heath Ledger in The Dark Knight (2008). Alkhateeb has said the image was not intended to make a political statement. He uploaded the image to the photo-sharing website Flickr, from where it was downloaded by an unknown individual who added the caption \" socialism \". It was described in 2009 by The Guardian as the \"American right's first successful use of street art \".\n\n(Dinesh D'Souza > Career as author, political commentator, and filmmaker > Filmmaking > 2016: Obama's America film (2012)) D'Souza wrote and co-directed the documentary-style polemical film 2016: Obama's America. Through interviews and reenactments, the film compares the similarities in the lives of D'Souza and President Barack Obama. D'Souza suggested that early influences on Obama affected the decisions he made as president. The film's tagline is \"Love him or hate him, you don't know him.\" The film has been criticized on the grounds that what D'Souza claims to be an investigation of Obama includes considerable projection, speculation, and selective borrowing from Obama's autobiography, to prove D'Souza's own narrative. In a \"Fact Check\" of the film, the Associated Press found that D'Souza provided little or no evidence for most of his claims, noted that several allegations were factually false, and described the film's central thesis as \"almost entirely subjective and a logical stretch at best.\" Scholars have described the film as advancing a conspiracy theory in which Obama is a secret anti-colonialist.  The Obama administration described the film as \"an insidious attempt to dishonestly smear the president\". Later, when D'Souza was indicted for violating election law, D'Souza and his co-producers alleged that he was selectively prosecuted, and that the indictment was politically motivated retribution for the success of the film."}, {"id": "q027", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have there been public controversies or critical debates about the manga's portrayal of indigenous, ecological, or cultural elements related to the sea?", "ev": "(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016.\n\n(Holmes of Kyoto > Media > Manga) Written and illustrated by Ichiha Akizuki, it has been serialized in Futabasha's seinen manga magazine Monthly Action from December 2017 to February 2024, later transferring to Web Action were it completed it's run in August 2025. The chapters were collected into fifteen tankōbon volumes.\n\n(Henshin no News > Abstract) Henshin no News (Japanese: 変身のニュース, Hepburn: Henshin no Nyūsu; \"The News of Transformation\") is a Japanese anthology manga series written and illustrated by Natsujikei Miyazaki. It was serialized in Kodansha 's seinen manga magazine Monthly Morning Two from May 2009 to December 2012, with its chapters collected in a single tankōbon volume."}, {"id": "q028", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Are there published case studies or official reports describing the cyclist's role in shaping team pursuit program structure?", "ev": "(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Cycling at the 1996 Summer Olympics – Men's team pursuit > Abstract) The men's team pursuit event in cycling at the 1996 Summer Olympics competition consisted of matches between two teams of four cyclists. The teams started at opposite ends of the track. They had 16 laps (4 kilometres) in which to catch the other cyclist. If neither was caught before one had gone 16 laps, the times for the distance (based on the third rider of the team to cross the line) were used to determine the victor.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Elinor Barker > Abstract) Elinor Jane Barker (born 7 September 1994) is a Welsh road and track cyclist, who has ridden for UCI Women's Team Uno-X Mobility since 2022. As a track cyclist, she is an Olympic champion in the team pursuit and a world champion in the team pursuit, madison, points race, and scratch race disciplines. She has won four Olympic medals (one gold, two silver and one bronze) during her career. Her overall tally of four Olympic medals is a record for a Welsh woman.  In her youth, Barker was the 2012 junior time trial world champion in road cycling. On her debut for Great Britain in November 2012, she was part of the team pursuit side that won gold in the World Cup event in Glasgow. The following year, she triumphed in the team pursuit at both the Track Cycling World Championships and European Track Championships. She helped Great Britain defend their world team pursuit title in 2014, and won a silver and a bronze at that year's Commonwealth Games. Further World and European Championships medals followed in 2015, and Barker won an Olympic gold medal in the team pursuit at the 2016 Summer Olympics.  Barker won her first individual world title in the points race in 2017, won a gold medal in the same discipline at the 2018 Commonwealth Games, and became the scratch race world champion in 2019. She won her second points race world title and a European title in the elimination race in 2020, and a silver in the team pursuit at the delayed 2020 Summer Olympics. Following maternity leave, she won two gold medals at both the European and World Track Cycling Championships in 2023. At the 2024 Olympics, Barker won a bronze medal in the team pursuit and a silver in the madison.  Barker is an Olympic champion, a three-time world champion and seven-time European champion in the team pursuit, as well as a two-time world champion in the points race, a world champion in both the madison and scratch race, a two-time European madison champion, and one-time European elimination race champion. She is also a Commonwealth Games gold medalist in the points race. In her road cycling career, she finished seventh at the Gent-Wevelgem in 2023, and third at the British National Time Trial Championships in 2023 and 2024."}, {"id": "q029", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which coaching staff, performance directors, or development programs cited the cyclist as influencing their practices?", "ev": "(David McCann (cyclist) > Abstract) David McCann (born 17 March 1973 in Belfast) is an Irish former professional road bicycle racer, who rode in the 1996, 2000 and 2012 Olympic Games. He was the Irish national road race champion in 2000, 2001 and 2006, and won the Irish national time trial championships a record 6 times (2001, 2002, 2004, 2005, 2009 & 2010). He last rode for the Synergy Baku Cycling Project, an Azerbaijan-registered UCI Continental team.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Cycling in Los Angeles > Cycling rules and regulations > Road rules) Cyclists may travel either in the street or on the sidewalk. On the sidewalk they must behave so as not to cause danger to pedestrians (which is an arbitrary judgment that seems to translate into traveling at walking pace). Moreover, in some of the cities within the greater Los Angeles region, it is illegal to cycle on the sidewalk. Cyclists in general should follow the same traffic rules and behavior as motorized vehicles. It is legal for a cyclist to \" take a lane \" within the State of California, and in the case of narrow-width lanes it is advisable to do so.  It is not required to wear a helmet unless the rider is under the age of 18 years. A driver's license is also not required for a cyclist. The bicycle relevant sections of the California Vehicle Code indicate that a cyclist may ride out from the right-hand curb in order to avoid obstacles. This explicit provision, combined with the California Driver's Handbook (which indicates that passing vehicles must ensure 3 feet (0.91 m) minimum safe passing distance), means that certain lanes which are not wide enough for a bicycle and a passing automobile should be occupied by the bicycle until it is safe for the cyclist to pull in to the right and signal the automobile to overtake if there is no other safe-passing lane available for the automobile."}, {"id": "q030", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were the key dates and events in the formation and renaming of Ghana's national cricket governing body?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Inna Mariam Patty > Abstract) Inna Mariam Patty (born 1983), popularly referred to as Inna Patty, is a Ghanaian social entrepreneur, philanthropist and beauty pageant titleholder who was crowned Miss Ghana 2004 and represented Ghana in Miss World 2005 at the Crown of Beauty Theatre in Sanya, China. She is the CEO of Exclusive Events Ghana, the organizers of Miss Ghana since 2011.\n\n(Ghana Football Awards > Abstract) Ghana Football Awards is an annual award scheme organized to recognize the best Ghanaian players playing in and outside of the country and key stakeholders who contribute significantly to the game. Several category of awards are given to the most outstanding performers of the season under review. The awards are presented in July each year at a special gala in Accra, Ghana.\n\n(David Apasara > Abstract) David Apasera is a Ghanaian politician of the Republic of Ghana. He was the Member of Parliament representing Bolgatanga constituency of the Upper East Region of Ghana in the 4th Parliament of the 4th Republic of Ghana. He is a member of the People's National Convention.\n\n(Ahmadiyya in Ghana > Abstract) The Ahmadiyya Muslim community is the second largest group of Islam in Ghana after Sunni Islam. The early rise of the community in Ghana can be traced through a sequence of events beginning roughly at the same time as the birth of the Ahmadiyya movement in 1889 in British India. It was during the early period of the Second Caliphate that the first missionary, Abdul Rahim Nayyar was sent to what was then the Crown colony of Gold Coast in 1921 upon invitation from Sunni Muslims in Saltpond. Having est"}, {"id": "q031", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What measurable effects did the regulator's rules have on media consolidation, minority ownership, or localism in broadcasting?", "ev": "(Federal Communications Commission > Media policy > Media ownership > Diversity) In the second half of 2006, groups such as the National Hispanic Media Coalition, the National Latino Media Council, the National Association of Hispanic Journalists, the National Institute for Latino Policy, the League of United Latin American Citizens (LULAC) and others held town hall meetings in California, New York and Texas on media diversity as its effects Latinos and minority communities. They documented widespread and deeply felt community concerns about the negative effects of media concentration and consolidation on racial-ethnic diversity in staffing and programming. At these Latino town hall meetings, the issue of the FCC's lax monitoring of obscene and pornographic material in Spanish-language radio and the lack of racial and national-origin diversity among Latino staff in Spanish-language television were other major themes.  President Barack Obama appointed Mark Lloyd to the FCC in the newly created post of associate general counsel/chief diversity officer.\n\n(Kirbyjon Caldwell > Relationship with Barack Obama) Caldwell endorsed Barack Obama in the 2008 Democratic primary, supporting him against John McCain in the presidential election. In August 2010, after media reports that 18 percent of Americans thought President Obama was a Muslim, Caldwell told reporters he had known Obama for years as a Christian who prays daily. He described the media questioning Obama's religion as \"a 24-hour noise box committed to presenting the president in a false light\".\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Post–civil rights era in African-American history > Political representation > 2008 presidential election of Barack Obama) In 2008 presidential elections, Illinois senator Barack Obama became the first black presidential nominee of the Democratic Party, the first Black presidential candidate from a major political party. He was elected as the 44th President of the United States on November 4, 2008, and inaugurated on January 20, 2009.  At least 95 percent of African-American voters voted for Obama. Obama won big among young and minority voters, bringing a number of new states to the Democratic electoral column. Obama became the first Democrat since Jimmy Carter to win a popular vote majority. He"}, {"id": "q032", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which foreign promotions and international partners has the 2001-founded promotion formally collaborated or co-promoted events with?", "ev": "(List of Pro Wrestling Noah personnel > Background) Noah contracts typically range from developmental deals for dojo trainees to full-time contracts. Personnel appear on untelevised live events and on televised events which are aired on various broadcasters or on CyberFight 's own international streaming service, Wrestle Universe.  Personnel is organized by their role in Noah. The performer's ring name is listed on the left and their real name is on the right. This list also acknowledges which stable (referred to by Noah as \"units\") a wrestler is a part of.  As of 2025, there are seven central units in Noah:  In addition to the promotion's seven central units, wrestlers who appear on a part-time basis are also listed.  As Noah has working relationships with WWE, International Wrestling Revolution Group (IWRG) and numerous Japanese promotions, wrestlers from these promotions may appear on Noah events and have their home promotions or stables from their home promotions listed as their affiliated unit.\n\n(Total Nonstop Action Wrestling > Partnerships) In early 2006, the promotion began a collaboration with Hermie Sadler 's United Wrestling Federation. The agreement permitted UWF to use the TNA logo on posters and signage, as well as to use the six-sided ring with TNA branding. These shows were mainly promoted as 'UWF/TNA' events. The TNA name agreement ended at the end of 2006, as TNA began to promote their own house show events, though UWF still used a six-sided ring. These events were recorded and released on DVD by Highsports. They would continue to work with United Wrestling Federation and promote independent shows at the same time until 2007. TNA has worked with several wrestling promotions, with championships from those promotions sometimes having been defended at TNA events. Among the organizations TNA has had working relationships with are Mexico's Consejo Mundial de Lucha Libre (CMLL) from 2007 to 2009 and The Crash, Japan's Inoki Genome Federation (IGF), New Japan Pro-Wrestling (NJPW), Wrestle-1 (W-1), Pro Wrestling Noah (Noah), United States' the original Global Force Wrestling (another promotion founded by Jeff Jarrett), OMEGA Championship Wrestling (owned by Matt Hardy, Jeff Hardy and Gregory Helms) and Evolve Wrestling.  The initial relationship with NJPW lasted from 2008 to 2011. Then-known as TNA, the promotion would send wrestlers to participate in NJPW's annual Wrestle Kingdom events, as well as NJPW sending future IWGP Heavyweight Champion Kazuchika Okada on a training excursion to TNA. The relationship would be strained, when IWGP Tag Team Champions Team 3D were held off of a New Japan tour in favor of appearing on Impact Wrestling tapings and Okada was given the gimmick of \"Okato\", where he dressed similar to The Green Hornet 's sidekick Kato. a decision Executive Vice President Scott D'Amore has since apologized for on behalf of the previous regime. In February 2021, Impact would re-establish its relationship with NJPW, with NJPW later forgiving the incidents that happened under the previous regime. This partnership would last until December 2024, when NJPW's contract to air on TNA's co-owned TV home AXS TV expired, and was not renewed.  On March 2, 2014, TNA collaborated with Wrestle-1 in producing the Kaisen: Outbreak supershow in Tokyo, Japan, where three TNA championships were defended. In May 2015, it was reported that the relationship between TNA and Wrestle-1 had ended. Since 2015, the promotion has had a working agreement with Mexico's Lucha Libre AAA Worldwide (AAA) and in 2018, announced a partnership with the AAA-affiliated Lucha Underground, allowing their wrestlers from the show to appear for Impact on a regular basis. In April 2018, the two promotions held Impact vs Lucha Underground from WrestleCon in New Orleans to a sell out crowd. On November 26, 2023, Impact and partner promotion Lucha Libre AAA Worldwide (AAA), co-promoted the Ultra Clash supershow in the Monterrey, Mexico area, marking Impact's first show in Mexico since 2019.  Since 2018, Impact has established working relationships with a number of promotions to co-promote house shows, Twitch specials, the final Impact One Night Only events, and Impact Plus Monthly Specials. These promotions include, Future Stars of Wrestling, Smash Wrestling, AML Wrestling, Superkick'd, Border City Wrestling, WrestleCade, Rocky Mountain Pro, Rockstar Pro Wrestling, Wrestlepro, Wrestling Revolver, RISE, Destiny Wrestling, Big Time Wrestling (California), DEFY Wrestling and House of Hardcore. Impact Wrestling would begin a partnership with All Elite Wrestling (AEW) in December 2020, with its wrestlers and titles appearing on Impact programming. In October 2021, the working relationship between Impact and AEW quietly ended following Bound for Glory.  On the January 7, 2022, episode of SmackDown, it was announced that Knock
