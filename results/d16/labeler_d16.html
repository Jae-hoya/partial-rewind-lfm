rism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Newspaper endorsements for John McCain in the 2008 United States presidential election > Abstract) During the 2008 United States presidential election, newspapers, magazines, and other publications made general election endorsements. As of November 4, 2008, Barack Obama had received more than twice as many publication endorsements as John McCain; in terms of circulation, the ratio was more than 3 to 1, according to the detailed tables below. In summary:  According to Editor & Publisher magazine, as of November 3, 2008, there was 273 newspapers endorsing Barack Obama compared to 172 for John McCain. By comparison, the magazine reported that before election day in 2004, John Kerry received 213 endorsements compared to 205 for George W. Bush.  UWIRE, in its Presidential Scorecard, reported that Barack Obama led John McCain by 86 to 2 in college newspaper endorsements, as of November 4.  The Association of Alternative Newsmedia reported that Barack Obama led John McCain by 57 to 0 in endorsements among its 123 member newspapers as of October 31, 2008.  For a full list of newspapers that have endorsed Barack Obama, see Newspaper endorsements for Barack Obama in the 2008 United States presidential election.  For a summary of endorsements and a list of newspapers that have chosen not to endorse a candidate, see Newspaper endorsements in the 2008 United States presidential election.\n\n(Islamic Society of Baltimore > History > Barack Obama's visit) On December 14, 2015, the White House held three meetings with Muslim leaders to discuss concerns about rising hostility toward religious minorities. They pressed officials to consider then-president Barack Obama to visit a mosque, preferably with former president George W. Bush, which has been requested for years.  On January 28, 2016, mosque officials were informed of a possible visit by Barack Obama, and plans for the visit to the mosque were made official and announced by the White House on January 30. A White House official stated that its purpose is \"to celebrate the contributions Muslim Americans make to our nation and reaffirm the importance of religious freedom to our way of life\".  Barack Obama visited the mosque on February 3, 2016, marking his first presidential visit to a mosque in the United States. He held a round table discussion with Muslim community leaders and made a speech, in which he rejected political rhetoric and violence directed at Muslims, and talked about the role Islam has played in American history.\n\n(Jon Favreau (speechwriter) > Political career > Obama campaign) Obama communications aide Robert Gibbs, who had worked for Kerry's campaign, recommended Favreau to Obama as an excellent writer, and in 2005 he began working for Barack Obama in his U.S. Senate office before joining his presidential campaign as chief speechwriter in 2006. His interview with Obama was on the Senator's first day. Favreau described this his approach to Obama as, \"A speech can broaden the circle of people who care about this stuff. How do you say to the average person that's been hurting: 'I hear you, I'm there?' Even though you've been so disappointed and cynical about politics in the past, and with good reason, we can move in the right direction. Just give me a chance.\"  Favreau led a speechwriting team for the campaign that included Ben Rhodes and Cody Keenan.  He has likened his position to \" Ted Williams 's batting coach\", because of Obama's celebrated abilities as a speaker and writer. Obama senior adviser David Axelrod said of Favreau, \"Barack trusts him... And Barack doesn't trust too many folks with that—the notion of surrendering that much authority over his own words.\" In Obama's own words, Favreau was his \"mind reader\".  Favreau has said that the speeches of Robert F. Kennedy and Michael Gerson have influenced his work, and has expressed admiration for Peggy Noonan 's speechwriting, citing a talk given by Ronald Reagan at Pointe du Hoc as his favorite Noonan speech. Gerson also admires Favreau's work, and sought him out at an Obama New Hampshire campaign rally to speak with the younger speechwriter.  Favreau was the primary writer of Obama's inauguration address of January 2009."}, {"id": "q061", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the primary physiological energy systems and aerobic/anaerobic demands of long-distance mass-start and pursuit speed skating?", "ev": "(Types of inline skates > Urban) Urban skate is an umbrella term created by the industry to describe a type of skate suitable for several niche inline disciplines: freestyle skating, slalom skating, wizard skating, city commuting, and urban skating. These activities take place on relatively flat ground, but the surface may not always be paved or smooth.  Freestyle skating is named after its counterpart in skateboarding, just like aggressive street, park, and vert skating are named after street, park, and vert skateboarding, respectively. Freestyle skating is the art of performing skating tricks on relatively flat ground, free of obstacles. Freestyle slalom skating is a form of freestyle skating where tricks are performed around slalom cones. This is standardized by the International Freestyle Skaters Association (IFSA) and World Skate as freestyle slalom to distinguish it from speed slalom, which is a form of speed skating around cones on flat ground. Freestyle skating requires skates that support rigorous turning and edging maneuvers, with characteristics similar to hockey skates. A rockered setup with 76-80 mm wheels on a relatively short frame is common for freestyle skating.: 15–25  Urban skating and city commuting take the activity to the street. But the term 'street skating' is already taken as a subdiscipline of aggressive skating, for grinding on street obstacles. Thus, this niche market is variously promoted as skating on paved roads or commuting to work on skates. These activities demand longer frames and larger wheels for higher cruising speed, stable tracking, and more comfortable rides on uneven surfaces, similar to speed skates for marathon events. Common wheel setups include 4x80mm, 4x90mm, 4x100mm, 3x100mm, 3x110mm, and 3x125mm.  In terms of skate construction, urban skates overlap with the high-end segment of recreational skates. A hard shell is standard for urban skates. Higher-end models feature hybrid boots with carbon composite shells (endoskeleton) that are heat-moldable. Despite sharing some design goals with hockey skates and speed skates, urban skates are not built like them. Unlike speed skates, urban skates provide strong ankle support with traditional hinged cuffs. Unlike hockey boots, urban boots are not built around a quarter package, nor do they have frames riveted onto them.  Indeed, most urban skate boots support either the 165mm two-point or the Trinity three-point mounting standards, allowing a skater to mount a variety of compatible frames to a boot that best fits them. The same boot can thus be customized with a short frame and average-sized wheels for slalom skating, or with a long frame and large wheels for long-distance road skating.  Both the 165mm and Trinity standards have their heel mounting platforms raised higher than their toe mounting platforms. This difference in height between the raised heel and the lowered toe is known in the shoe industry as a heel-to-toe drop. Such a drop causes a skater to lean forward by default, simulating a slight forward flex. This is similar to the purpose of the hi-lo wheel setup in hockey skates.  Wizard skating is named after the company Wizard Skating, founded by Leon Basin in 2014. Leon and his aggressive inline friends from @Mushroomblading popularized this new form of skating. Leon himself performed flowing footwork from freestyle, slalom, and figure skating while blazing through roads, rolling over curbs, skating up ramps, bashing down stairs, and parkouring on walls. Leon perfected a type of \"Wizard\" skate for this sport, featuring a long frame, large wheels, and a rockered wheel setup. For a skate size of EU43, these Wizard skates are available with either a 4x100mm or a 5x80mm setup. Skaters are increasingly referring to this style as flow skating.  Wizard frames utilize the UFS mounting system from aggressive skates. Wizard frames are thus not compatible with other urban boots where 165mm and Trinity mounting systems dominate. Unlike the flat aggressive frames from which UFS originated, a Wizard frame does include a built-in heel-to-toe drop, similar to 165mm and Trinity systems.\n\n(Types of inline skates > Abstract) Different types of inline skates reflect the specific demands that various skating disciplines place on inline skate design. These disciplines include recreational skating, urban skating, roller hockey, street hockey, speed skating, slalom skating, aggressive skating, and artistic inline skating.\n\n(Types of inline skates > Speed) Speed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318  Speed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11  Because of the need for a deep dorsiflexion, speed skates have no eyelets, buckles, or straps above middle eyelets at 45° angle which is the minimum requirement for proper heel lock. Indeed, speed skates have no shafts and cuffs commonly found in other inline skates. In order for racers to freely flex their foot around ankle bones, speed boots are cut the lowest among all inline skates, around or below the ankle bones.: 17, 34–36 : 308–311  A skater compensates for the lack of lateral ankle support from boots by strengthening muscle support for proper ankle movements such as dorsiflexion, pronation and supination, which are essential for double push strides with aggressive push-offs and precise transitions from outside to inside edges. The removal of shaft and cuff significantly reduces a boot's weight, a key advantage to a skater in a game where a saving of fractional seconds makes a difference.: 75–83 : 3–30, 308–311  A speed skate boot is close-fitting, without much padding, and usually made of leather, carbon fiber, or other strong and lightweight composite materials. For best performance, the boot must conform closely to the shape of the foot to prevent it from moving inside the boot. Thus, most boots are custom-fitted or else heat-moldable.  The frame may be made of aircraft-quality aluminum, magnesium, or possibly lightweight carbon fiber. All frames flex during skating. A stiff frame flexes very little, so it transmits power from the foot to the wheels more directly. A shorter frame navigates tight curves at smaller tracks better but may become wobbly at high speeds. A longer frame provides stable tracking at high speed and increased power transfer, useful for long-distance events.: 311–314 : 18–20  The length and height of a frame determine the number and size of wheels it can accommodate. More wheels and bigger wheels increase mass, making acceleration harder and slower. But once rolling at speed, a skater can more easily maintain top speed given the rotational inertia. In the 1990s, speed skaters preferred a frame with five wheels, usually 80 mm in diameter (i.e. 5x80mm). In the 21st century, wheel size ranges from 90 mm to 125 mm. A setup with four 110 mm wheels (4x110mm) is typical for competitive speed skating, and three 125 mm wheels (3x125mm) for marathon skates at marathon events.: 311–314 : 22, 24, 34–36  Speed skates generally adopt either the 165mm or the 195mm mounting standard for securing a frame to a boot. Short speed frames for short track racing use the 165mm standard, while long frames for marathon use the 195mm standard in order to better accommodate larger wheels. Both of these 2-point mounting standards feature a built-in heel lift that pitches a skater forward, creating forward flex.  Speed skating generally adopts harder wheels than other disciplines. Harder wheels minimize energy lost to elastic hysteresis when a skater's weight deforms wheels upon ground contact. Speed skaters prefer wheels with high rebound, which returns the compression energy back to the skater. Speed wheels have a pointy bullet profile that reduces friction from drags, when a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26  Speed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130\n\n(ISU Short Track Speed Skating World Cup > Abstract) The Short Track Speed Skating World Cup was a series of international short track speed skating competitions, organised yearly by the International Skating Union since the winter of 1998/1999. Every year during the winter, a number of competitions on a number of different distances are held. Skaters can earn points at each competition and the skater who has the most points on a given distance at the end of the series is the winner.  The ISU Short Track Speed Skating World Cup was replaced by ISU Short Track World Tour starting since the 2024-25 season.\n\n(Ivanie Blondin > Career) She began her career competing in short track speed skating while a youth in the Gloucester Concordes skating club. She competed there with fellow Olympian Vincent De Haître, to whom she feels like an older sister. After Blondin failed to qualify in short track for the 2010 Winter Olympics in Vancouver she nearly quit sport. Mike Rivet, her coach in Gloucester, convinced her to switch to long track, a decision in which she says, \"I was ready to quit skating because I was just so discouraged and disappointed with it. I think (the switch) was the best decision I could have ever made.\" As a result, Blondin represented Canada in both the long-distance events at the 2014 Winter Olympics in Sochi as well as the team pursuit event.  Blondin won her first major competitive medal when she placed second in the mass start event at the 2015 World Single Distance Championships. After the race, she said, \"I would have preferred the gold medal, but finishing first at this stage of my career remains a big accomplishment for me, so I'm super pumped with second place. I'm ecstatic with the result, which follows a fantastic season.\""}, {"id": "q062", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "On what exact date was the Japanese professional wrestling promotion founded in 2001 established and who founded it?", "ev": "(Kyushu Pro-Wrestling > Abstract) Kyushu Pro-Wrestling (Japanese: 九州プロレス, Hepburn: Kyūshū Puroresu) is a Japanese professional wrestling promotion based in Fukuoka, the largest city on the Japanese island of Kyushu. The promotion was founded in late 2007 by Kaientai Dojo alumnus Ryota Chikuzen, and officially launched on July 6, 2008. A notable feature of the promotion is that it is the first professional wrestling promotion to operate as a nonprofit organization. The promotion has its own dojo located in an auto repair shop, in Higashi-ku, Fukuoka.  In addition to wrestling matches, the organization also conducts charity activities at nursing homes, facilities for the disabled, children's homes, and preschools, and offers wrestling classes at free schools.\n\n(Wrestling of Darkness 666 > Abstract) Wrestling of Darkness 666 (Japanese: 暗黒プロレス組織666, Hepburn: Ankoku Puroresu Soshiki Toripuru Shikkusu), also known as the Wrestling of Darkness Organization 666 and often referred to simply as 666 or Triple Six, is a Japanese professional wrestling promotion based in Shinjuku, Tokyo, Japan. The promotion was founded in 2003 by Onryo and Qp-Crazy frontman The Crazy SKB.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance.\n\n(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986."}, {"id": "q063", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has the colonial legacy, including access and demographic participation patterns, limited the broader growth of cricket in Ghana?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Alhassan Andani > Abstract) Alhassan Andani (born 24 November 1960) is a Ghanaian economist and grandson of Naa Andani who ruled Dagbon in the colonial era. He is the founder and chairman of Leadership Vision Strategy Africa. Mr.Andani is a former chief executive director of Stanbic bank. He holds the position of Chairman of Council for Scientific & Industrial Research, Chairman of SOS Children's Villages Ghana and serves on the board of Gold Fields Limited. Alhassan Andani is Independent Non-Executive Director of the company. Mr Andani is a former CEO and executive director of Stanbic Bank Ghana; the board chairperson of the Ghana Council for Scientific and Industrial Research (CSIR), a director of SOS Villages Ghana, and has held other corporate directorships in the past. He holds a BSc in (Agriculture), University of Ghana; MA (Banking and Finance), Finafrica Institute in Italy.\n\n(Hassan Ahmed (Ghanaian diplomat) > Abstract) Hassan Ahmed (born 1955) is a Ghanaian diplomat. He has served as Ghana's ambassador to several countries including Iran, Japan and Cuba. He was Head of Office of the UN-AU Hybrid office in Sudan. He is the current Director of Protocol for Nana Akufo-Addo, President of Ghana.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(Kweku Baako Jnr > Abstract) Kweku Baako Jnr is a Ghanaian journalist and the editor-in-chief of the New Crusading Guide newspaper he was also the son of Kofi Baako. He is a frequent panelist on radio shows in Ghana, including Peace FM's weekday morning show and Newsfile, a current affairs programme on Joy FM (Ghana). In 1999 he was awarded the Journalist of the Year by the Ghana Journalists Association. He was polled as the 39th most influential Ghanaian in 2014 by ETV."}, {"id": "q064", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What legal instruments, policy plans, or official reconstruction programs governed rebuilding efforts in the Northern Province?", "ev": "(Northern Province, Sri Lanka > Transport > Rail) Sri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.  Most of the railways were developed during the British colonial period.  The railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\n(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.  In late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\n(Northern Province, Sri Lanka > Education) The Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries."}, {"id": "q065", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What academic or critical disputes exist concerning the limits of the manga's environmental or ethical messaging?", "ev": "(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016.\n\n(Holmes of Kyoto > Media > Manga) Written and illustrated by Ichiha Akizuki, it has been serialized in Futabasha's seinen manga magazine Monthly Action from December 2017 to February 2024, later transferring to Web Action were it completed it's run in August 2025. The chapters were collected into fifteen tankōbon volumes.\n\n(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Henshin no News > Abstract) Henshin no News (Japanese: 変身のニュース, Hepburn: Henshin no Nyūsu; \"The News of Transformation\") is a Japanese anthology manga series written and illustrated by Natsujikei Miyazaki. It was serialized in Kodansha 's seinen manga magazine Monthly Morning Two from May 2009 to December 2012, with its chapters collected in a single tankōbon volume."}, {"id": "q066", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What limitations or constraints (capital requirements, regulatory restrictions) have materially affected the bank's expansion plans?", "ev": "(Citizens Financial Group > Early history) Citizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.  In 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\n(Providence, Rhode Island > Economy) Over one third of Providence's economy is based in trade, transportation, utilities, and educational and health services. As the capital of Rhode Island, the city's economy additionally consists of government services, with approximately 70,000 jobs. The unemployment rate in the city is 5.0% as of August 2022, compared to a national rate of 3.8%.  Prominent companies headquartered in Providence include Fortune 500 Textron, an advanced technologies industrial conglomerate; United Natural Foods, a distributor of natural and organic foods; Fortune 1000 Nortek Incorporated; Gilbane, a construction and real estate company. Other companies with headquarters in the city include Citizens Bank, Virgin Pulse, Ørsted US Offshore Wind, and Providence Equity. Providence is the site of a sectional center facility (SCF), a regional hub for the U.S. Postal Service. Providence is also home to some of toy manufacturer Hasbro 's business operations, although their headquarters are in Pawtucket.  The city is home to the Rhode Island Convention Center, which opened in December 1993. Along with a hotel, the convention center is connected to the Providence Place Mall, a major retail center, through a skywalk."}, {"id": "q067", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which studios, directors, or producers were involved in adapting Daisuke Igarashi's ocean-themed manga into other media?", "ev": "(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(Children of the Sea (manga) > Development) The concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016.\n\n(Holmes of Kyoto > Media > Manga) Written and illustrated by Ichiha Akizuki, it has been serialized in Futabasha's seinen manga magazine Monthly Action from December 2017 to February 2024, later transferring to Web Action were it completed it's run in August 2025. The chapters were collected into fifteen tankōbon volumes."}, {"id": "q068", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have national championship results influenced selection for national teams or funding/support programs in Latvia?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Football in Latvia > Abstract) Football in Latvia is the number one sport based on participation, but the third sport after ice hockey and basketball based on popularity. Many other sports are also more popular than football in Latvia, but in recent years it has gained more popularity. The Latvian Football Federation (Latvian: Latvijas Futbola federācija) is the sport's national governing body. There is a league system, with the Higher League and First League serving as the top leagues in Latvia. The Latvian Second League is composed mostly of amateur teams.  The Latvian Cup is the main national cup competition in the country."}, {"id": "q069", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which notable alumni or talent from the promotion achieved significant success abroad after participation in its programs?", "ev": "(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009."}, {"id": "q070", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which colonial-era representative matches or tours involved teams from the Gold Coast, and what were their outcomes?", "ev": "(Ghana national cricket team > History > Colonial era) CricketArchive records a team representing the Gold Coast, a British colony, as having played its first match in May 1904, against Lagos Colony (in present-day Nigeria). Similar fixtures were played in the following two seasons, with the venue alternating between Lagos and Accra. A team representing the Southern Nigeria Protectorate toured in April 1907. Similar matches were played again in 1911, 1912, and 1913, with the host alternating each year. Although the sport had been introduced by British settlers, representative teams were multiracial from an early stage – the 1912 Gold Coast–Southern Nigeria fixture, the only pre-war match for which a scorecard is available, featured names like Otoo, Sagoe, Agbokpo, and Akufo (for Gold Coast), and Layode and Oseni (for Southern Nigeria). Gold Coast's Otoo took six wickets in Southern Nigeria's second innings, helping Gold Coast to an innings victory. However, European-only matches were introduced around the same time, beginning in 1906 and ending only in 1956, the year before Ghanaian independence. The Gold Coast's leading run-scorer in the inaugural European-only fixture was Gordon Guggisberg, who had earlier played a single first-class match (and was later Governor of the Gold Coast, from 1919 to 1927).  After a long gap, inter-colonial matches resumed in April 1926, when the Gold Coast played the Nigerian national team in Lagos. Gold Coast–Nigeria fixtures, both multiracial and European-only, were played almost annually from 1926 to 1939, and resumed again after World War II. In several years the European-only fixtures were played in provincial cities like Kumasi and Ibadan, although multiracial games were played only in the capitals. Gold Coast sides were occasionally bolstered by players of first-class standard – for instance, Cecil Pullan (Oxford University and Worcestershire) and Michael Green (Gloucestershire and Essex) appeared together in a 1937 match, with Pullan appearing again after the war. The national side played its first match as \"Ghana\" less than a month after Kwame Nkrumah 's independence declaration in March 1957, with annual Ghana–Nigeria matches occurring until 1964.\n\n(Yoruba people > Demographics > Ghana) There exists an old and thriving Yoruba community in Ghana tracing back to more than three centuries of establishment. The presence of Yoruba people in Ghana traces back to before the concept of the modern Ghanaian nation and are therefore Ghanaian citizens by law. The Yoruba communities became established through various waves and layers for centuries before the colonial era. The earliest wave were long distance merchants, artisans, labourers and explorers who settled in both southern and northern Ghanaian locales such as Salaga, Sekondi-Takoradi, Kumasi, Accra (Jamestown, Ngleshie Alata, Tudu), Yendi, Tamale, Kintampo, Nandom. In Ngleshie Alata (A corruption of English ' Alata ', the Fante and Ga word for Yoruba people based on the region where the majority came from) and the area around the James Fort, the Yoruba presence dates back to 1673 when they were employed to build the fort and settled in large numbers on the eastern coastal region. It is on record that the first ' Alata Akutso Mantse ' or Alata division head, a Yoruba speaker named Ojo employed by the Royal African Company ascended an Accra royal stool becoming head of the Alata quarter of James Town in 1748, a position his descendants continue to hold to this very day.  In the popular 18th century Gonja Salaga Slave Market, the Yoruba residents of the town would not allow their fellow countrymen captured and brought to the markets to be sold to the Ashantis who would march them to the coast. Rather, they would barter for the release of the Yoruba captives who would in turn work for their benefactors as tradesmen until they earned their release. This earliest wave was followed by an intermediate wave of slave returnees who were predominantly of Yoruba descent like the Taboms/Agudas who settled along the Ghanaian coast. Then came the third wave who came during the Gold Coast colonial period. By this period, they had firmly entrenched themselves in the country's commerce and distribution systems and constituted a substantial percentage of merchants and traders in the country's large markets as proprietors of wholesale enterprises. They were the largest group of immigrants established in the pre-independence Gold Coast. In 1950 they constituted 15% of traders in Accra, 23% in Kumasi, and over a third in Tamale. They were usually referred to in southern Ghana as Yoruba, Lagosian, Alata, or Anago. It was the early stream of this wave in the 1830s that established places like Accra New Town which was previously known as Lagos town and before then as Araromi.  There is no codification for the Yoruba ethnicity in the most recent Ghanaian censuses but in previous ones, they were considered an indigenous Ghanaian group with origins outside modern Ghana. In the 1960 Ghanaian population census, there were 109,090 Yorubas. Of this figure; 100,560 were Yoruba ' proper ' while 8,530 were Atakpame (Ana). This represented 1.6% of the Ghanaian population.\n\n(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(History of Ghana > British Gold Coast > British rule of the Gold Coast: the colonial era > Economic and social development) The years of British administration of the Gold Coast during the 20th century were an era of significant progress in social, economic, and educational development. Communications and railroads were greatly improved. Poverty fell significantly and Ghanaian peasantry flourished. New crops were introduced. A leading crop that was the result of an introduced crop was coffee. However, most spectacular among these introduced crops was the cocoa tree which had been indigenous to the New World and had been introduced in Africa by the Spanish and Portuguese. Cocoa had been introduced to the Gold Coast in 1879 by Tetteh Quashie. Cocoa tree raising and farming became widely accepted in the eastern part of the Gold Coast. In 1891, the Gold Coast exported 80 lbs of cocoa worth no more than 4 pounds sterling. By the 1920s cocoa exports had passed 200,000 tons and had reached a value of 4.7 million pounds sterling. Cocoa production became a major part of the economy of the Gold coast and later a major part of Ghana's economy.  The colony's earnings increased further from the export of timber and gold. Revenue from export of the colony's natural resources financed internal improvements in infrastructure and social services. The foundation of an educational system more advanced than any other else in West Africa also resulted from mineral export revenue. It was through British-style education that a new Ghanaian elite was created. From beginnings in missionary schools, the early part of the 20th century saw the opening of secondary schools and the country's first institute of higher learning.  Many of the economic and social improvements in the Gold Coast in the early part of the 20th century have been attributed to the Canadian-born Gordon Guggisberg, governor from 1919 to 1927. Within the first six weeks of his governorship, he presented a ten-year development programme to the Legislative Council. He suggested first the improvement of transportation. Then, in order of priority, his prescribed improvements included water supply, drainage, hydroelectric projects, public buildings, town improvements, schools, hospitals, prisons, communication lines, and other services. Guggisberg also set a goal of filling half of the colony's technical positions with Africans as soon as they could be trained. His programme has been described as the most ambitious ever proposed in West Africa up to that time.  The colony assisted Britain in both World War I and World War II. In the ensuing years, however, postwar inflation and instability severely hampered readjustment for returning veterans, who were in the forefront of growing discontent and unrest. Their war service and veterans' associations had broadened their horizons, making it difficult for them to return to the humble and circumscribed positions set aside for Africans by the colonial authorities.\n\n(Ghana Medical Association > History) The earliest medical organisation of medical staff was during the Gold Coast era when the Gold Coast Medical Practitioners Union was formed in 1933. This was founded by three doctors, Frederick Victor Nanka-Bruce who was the president and spokesman, C.E. Reindorf and W.A.C. Nanka-Bruce. J.E. Hutton Mills was the secretary. Following the establishment of an African government under colonial rule in 1951, a Ghana branch of the British Medical Association was formed in January 1953. This also had Nanka-Bruce as its first president. Both associations were merged to form the Ghana Medical Association on 4 January 1958. It was inaugurated by Kwame Nkrumah at the Arden Hall of the Ambassador Hotel in Accra. Charles Easmon was elected as the first president of the GMA."}, {"id": "q071", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has participation in international tournaments or cross-promotional title defenses impacted the promotion's global reputation?", "ev": "(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance' ilver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Football in Latvia > Abstract) Football in Latvia is the number one sport based on participation, but the third sport after ice hockey and basketball based on popularity. Many other sports are also more popular than football in Latvia, but in recent years it has gained more popularity. The Latvian Football Federation (Latvian: Latvijas Futbola federācija) is the sport's national governing body. There is a league system, with the Higher League and First League serving as the top leagues in Latvia. The Latvian Second League is composed mostly of amateur teams.  The Latvian Cup is the main national cup competition in the country.\n\n(Latvian Figure Skating Championships > Senior medalists > Ice dance) Alexandr Kirsanov, the 2000 Latvian Champion in ice dance with his partner Barbara Hanley, was returning from the 2025 U.S. Figure Skating Championships with two of his students aboard American Airlines Flight 5342 when their airplane collided with a helicopter upon approach to Ronald Reagan Washington National Airport and plunged into the Potomac River. All aboard were killed, including twenty-eight skaters, coaches, and family members returning from the U.S. Championships.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day."}, {"id": "q073", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What domestic league formats, selection procedures, and competition mechanisms support elite men's cricket in Ghana?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Brong-Ahafo region > Sports) The region is renowned for producing a lot of elite athletes. Asamoah Gyan, Emmanuel Agyemang-Badu and John Paintsil are just a few of the numerous prominent sports personalities the region has produced. Currently, the region houses three of the 16 teams in the Ghana premier league. Aduana Stars F.C. is the traditional team of the Dormaa Traditional Area and it is based in Dormaa Ahenkro. They were promoted into the league for the first time in 2009 and emerged champions of the Ghana premier league that same year. In 2010 the premier league was won by Berekum Chelsea F.C., a club which is based in Berekum. Aduana Stars won the 2017 Ghanaian Premier League. Bechem United F.C. is the third Ghana Premier League team from the Brong-Ahafo Region.\n\n(Aduana Football Club > Abstract) Aduana Football Club (formerly Aduana Stars F.C) is a professional football club, based in Dormaa Ahenkro, Bono Region, Ghana. The club is competing in the Ghanaian Premier League. It made history by winning the Ghana Premier League at their first attempt with 53 points. It became the ninth club to win the Ghana Premier League in its 54-year-old history.\n\n(Deportivo F.C. > Abstract) Deportivo FC is a Ghanaian professional football team that plays in the 2A Zone of the Ghana Division One League. Zone 2A has seven competing teams from the part of the Ashanti Region, Western Region and the Central Region of Ghana."}, {"id": "q074", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented instances of participant shortages, event cancellations, or category omissions have occurred at Latvian championships?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Andris Teikmanis > Abstract) Andris Teikmanis (29 November 1959; Riga, Latvia) is a Latvian lawyer, politician, and diplomat. He served as first post-soviet Mayor of Riga from 1990 to 1994. In September 2016 he was accredited as the Latvian ambassador to the United States. He previously served as Under Secretary in the Ministry of Foreign Affairs in Riga, and as Latvian ambassador to the Council of Europe, to the Russian Federation, to Germany, and to the United Kingdom, and as non-resident ambassador to Australia and New Zealand.Since August 2019 A. Teikmanis is head of the Chancellery of the President of Latvia Egils Levits.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Betwee
