<script>
const ITEMS = [{"id": "q000", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What aerodynamic or equipment innovations (bike position, components) did the cyclist or team implement for team pursuit?", "ev": "(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Cycling at the 1996 Summer Olympics – Men's team pursuit > Abstract) The men's team pursuit event in cycling at the 1996 Summer Olympics competition consisted of matches between two teams of four cyclists. The teams started at opposite ends of the track. They had 16 laps (4 kilometres) in which to catch the other cyclist. If neither was caught before one had gone 16 laps, the times for the distance (based on the third rider of the team to cross the line) were used to determine the victor.\n\n(Elinor Barker > Abstract) Elinor Jane Barker (born 7 September 1994) is a Welsh road and track cyclist, who has ridden for UCI Women's Team Uno-X Mobility since 2022. As a track cyclist, she is an Olympic champion in the team pursuit and a world champion in the team pursuit, madison, points race, and scratch race disciplines. She has won four Olympic medals (one gold, two silver and one bronze) during her career. Her overall tally of four Olympic medals is a record for a Welsh woman.  In her youth, Barker was the 2012 junior time trial world champion in road cycling. On her debut for Great Britain in November 2012, she was part of the team pursuit side that won gold in the World Cup event in Glasgow. The following year, she triumphed in the team pursuit at both the Track Cycling World Championships and European Track Championships. She helped Great Britain defend their world team pursuit title in 2014, and won a silver and a bronze at that year's Commonwealth Games. Further World and European Championships medals followed in 2015, and Barker won an Olympic gold medal in the team pursuit at the 2016 Summer Olympics.  Barker won her first individual world title in the points race in 2017, won a gold medal in the same discipline at the 2018 Commonwealth Games, and became the scratch race world champion in 2019. She won her second points race world title and a European title in the elimination race in 2020, and a silver in the team pursuit at the delayed 2020 Summer Olympics. Following maternity leave, she won two gold medals at both the European and World Track Cycling Championships in 2023. At the 2024 Olympics, Barker won a bronze medal in the team pursuit and a silver in the madison.  Barker is an Olympic champion, a three-time world champion and seven-time European champion in the team pursuit, as well as a two-time world champion in the points race, a world champion in both the madison and scratch race, a two-time European madison champion, and one-time European elimination race champion. She is also a Commonwealth Games gold medalist in the points race. In her road cycling career, she finished seventh at the Gent-Wevelgem in 2023, and third at the British National Time Trial Championships in 2023 and 2024.\n\n(Henry Hobbs (cyclist) > Career) Hobbs competed at the British Cycling National Track Championships as a 16 year-old in February 2024, and won bronze in the men’s kilometre time trial, clocking a personal best time of 1:02.574, and finishing just four tenths of a second from the gold medal. That week, he was selected to join the British Cycling junior academy.  In August 2024, Hobbs won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships. He also win silver in the 1km time trial and bronze in the team pursuit at the Championships held in Luoyang, China.  Hobbs won the gold medals in the omnium and in the 1km time trial at the 2025 UCI Junior Track Cycling World Championships in Apeldoorn, Netherlands in August 2025. At the championships he also won the silver medal in the team pursuit alongside Rory Gravelle, Max Hinds, Dan Thompson and Albie Jones."}, {"id": "q001", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What licensing, rulemaking, adjudication, or enforcement procedures did the regulator deploy to implement broadcasting policies?", "ev": "(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Barack Obama \"Joker\" poster > Reaction > Protest symbol) The image was adopted by some of Obama's critics and used for posters, T-shirts, bumper stickers, and other merchandise. The image is considered by some a symbol of the Tea Party protest movement. During the September 12, 2009, Taxpayer March on Washington, the largest demonstration against the Obama administration's policies to date, protesters denouncing deficit spending and the America's Affordable Health Choices Act of 2009, dubbed \"Obamacare\" by critics, carried Obama \"Joker\" signs captioned the doctor will see you now.\n\n(Medical cannabis in the United States > Federal policy > Federal enforcement > Obama administration) The presidency of Barack Obama was noted for a strong federal crackdown on medical cannabis during his first term in office, despite early indications that his administration would take a more hands-off approach. During his 2008 campaign for president, Obama expressed support for allowing states to implement their own medical cannabis policies, stating: \"I'm not going to be using Justice Department resources to try to circumvent state laws on this issue.\" These comments were then echoed by the administration in March 2009 when Attorney General Eric Holder stated that only medical cannabis providers \"who violate both federal and state law\" would be targeted for prosecution. Additionally, an October 2009 memo from Deputy Attorney General David Ogden laid out further guidelines for federal enforcement that largely affirmed this hands-off approach. Despite these pronounced intentions of lessened enforcement from the Obama administration, however, an increasing number of raids were conducted during Obama's first two years in office, surpassing even the Bush administration in frequency.  Federal enforcement efforts against medical cannabis were further escalated in early 2011, as a campaign of coercing state and local governments was initiated by the Justice Department. Letters were sent out by U.S. Attorneys to a number of state and city officials, threatening to criminally prosecute these individuals if the implementation of new medical cannabis laws moved forward. Some letters also threatened prosecution of state employees, or even the seizure of state administrative buildings (such as those used for the processing of medical cannabis licenses). In response to outcry and requests for clarification from numerous officials, a new memo was issued by Deputy Attorney General James M. Cole in June 2011. The Cole memo insisted that the 2009 Ogden memo was being adhered to, and that the Ogden memo's protections applied only to individual patients and not commercial operations. As the raids continued following release of the Cole memo, U.S. Attorneys sent out hundreds more letters over the next two years, threatening landlords with criminal prosecution and seizure of property for renting to medical cannabis providers. By June 2013, the total cost of the Obama administration crackdown on medical cannabis had climbed to $289 million, surpassing the previous 8 years of the Bush administration by $100 million. And the number of raids conducted during Obama's first 4 1/2 years had reached 270, in contrast to 260 during Bush's 8 years.  Early in President Obama's second term, in August 2013, the Justice Department issued a new Cole memo setting forth the conditions under which federal law would be enforced. The memo was prompted in particular by the recent legalization of non-medical cannabis in Washington and Colorado, but also addressed enforcement in medical cannabis states. Regarding the medical use of cannabis, the memo was considered to take a significantly more deferential approach towards the states (compared to the 2011 Cole memo), similar in nature to how the 2009 Ogden memo was originally widely interpreted. Federal enforcement efforts were further scaled back with the enactment of the Rohrabacher–Farr amendment in December 2014, although the Justice Department initially continued with a number of prosecutions until a pair of court rulings determined it was interpreting the amendment incorrectly."}, {"id": "q002", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which technical standards, spectrum allocation methods, or broadcasting engineering rules were promulgated under the regulator's direction?", "ev": "(No net loss policy in the United States > No Net Loss policy under past administrations > Barack Obama) Following the lead of the previous three presidential administrations, Barack Obama pledged his commitment to No Net Loss. The Obama administration increased funding of the North American Wetlands Conservation Act to ensure No Net Loss consistency, though funding was cut in the 2011 budget. Obama campaigned to amend the CWA and to extend the Swampbuster program, however these commitments were not carried out. Obama's administration was working with Congress to amend the CWA so isolated wetlands would fall under the Act's protection.\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Jon Favreau (speechwriter) > Political career > Obama campaign) Obama communications aide Robert Gibbs, who had worked for Kerry's campaign, recommended Favreau to Obama as an excellent writer, and in 2005 he began working for Barack Obama in his U.S. Senate office before joining his presidential campaign as chief speechwriter in 2006. His interview with Obama was on the Senator's first day. Favreau described this his approach to Obama as, \"A speech can broaden the circle of people who care about this stuff. How do you say to the average person that's been hurting: 'I hear you, I'm there?' Even though you've been so disappointed and cynical about politics in the past, and with good reason, we can move in the right direction. Just give me a chance.\"  Favreau led a speechwriting team for the campaign that included Ben Rhodes and Cody Keenan.  He has likened his position to \" Ted Williams 's batting coach\", because of Obama's celebrated abilities as a speaker and writer. Obama senior adviser David Axelrod said of Favreau, \"Barack trusts him... And Barack doesn't trust too many folks with that—the notion of surrendering that much authority over his own words.\" In Obama's own words, Favreau was his \"mind reader\".  Favreau has said that the speeches of Robert F. Kennedy and Michael Gerson have influenced his work, and has expressed admiration for Peggy Noonan 's speechwriting, citing a talk given by Ronald Reagan at Pointe du Hoc as his favorite Noonan speech. Gerson also admires Favreau's work, and sought him out at an Obama New Hampshire campaign rally to speak with the younger speechwriter.  Favreau was the primary writer of Obama's inauguration address of January 2009."}, {"id": "q003", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have Japanese media and fan communities criticized the promotion's booking decisions, faction management, or business practices?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance.\n\n(Paulie Gilmore > Abstract) James E. Allen is an American professional wrestler and promoter, best known by his ringname \"Big\" Paulie Gilmore or Gilmorea, who wrestled on the New England independent circuit for the Century Wrestling Alliance, the National Wrestling Alliance, the Millennium Wrestling Federation and the World Wrestling Alliance during the 1990s and early 2000s. He is also the owner of New World Wrestling, a small promotion based in southeastern Massachusetts, which was formerly associated with NWA New England from 2004 to 2005.  He is best remembered as Trooper Gilmore, a popular super heavyweight \" fan favorite \", in both the original Century Wrestling Alliance and NWA New England where he was a main rival of \"heel\" wrestler Tony Rumble. He also won the NWA New England Tag Team Championship with The Outpatient as Criminally Insane and Corporal Robinson as 5-0. He was an ally of MWF Tag Team Champions Todd Hanson & Beau Douglas during their feud with Ox Baker 's MWF stable Ox's Army and, in NWW, twice won the promotion's tag team titles with Jimmy \"Jact\" Cash and Brutus \"the Barber\" Beefcake. He has also been a frequent opponent of King Kong Bundy and Abdullah the Butcher when touring the Northeastern United States.\n\n(Professional wrestling in the United Kingdom > History > 1930s: All-in wrestling) While various styles of amateur wrestling continued as legitimate sports, grappling as a promotional business did not return to Britain until the beginning of the 1930s when the success of the more worked aspects of professional wrestling in America, like gimmickry and showmanship, were introduced to British wrestling. It was with this revival that the more submission -based Catch As Catch Can wrestling style, which had already replaced Greco Roman wrestling as the dominant style of professional wrestling in the United States back in the 1890s, became the new dominant style in Britain. With Lancashire style catch-as-catch-can already a major amateur sport particularly in Northern England, there existed a ready-made source of potential recruits to professional wrestling.  Amateur wrestler, Sir Atholl Oakeley got together with fellow grappler Henry Irslinger to launch one of the first promotions to employ the new style of wrestling which was coined \"All-in\" wrestling. Though, like many wrestlers throughout the business, Oakeley would claim his wrestling was entirely legitimate, his claim was highly dubious. Under the British Wrestling Association banner, Oakeley's promotion took off with wrestlers such as Tommy Mann, Black Butcher Johnson, Jack Pye, Norman \"the Butcher\" Ansell, \"College Boy\", and Jack Sherry on the roster, while Oakeley himself would win a series of matches to be crowned the first British Heavyweight Champion.  The business was reaching one of its highest points at the time, with the best"}, {"id": "q004", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which historical events most significantly altered the administrative boundaries of the Northern Province?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.  In late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\n(Northern Province, Sri Lanka > Education) The Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war."}, {"id": "q005", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What high-profile controversies, scandals, or public criticisms involving the promotion have been reported in Japan since 2001?", "ev": "(Lyubov Aksyonova (MVD) > High-profile situations) According to publicly available sources, there is no information indicating that Lyubov Nesterovna Aksyonova was directly involved in any public scandals. Her service in the internal affairs bodies of the Omsk oblast is characterized as professional, without widely known conflicts or accusations of corruption.  During 2016–2017, when she served as the Acting Head of the Department of the Ministry of Internal Affairs for the Omsk oblast, there were reported personnel and organizational changes, as well as high-profile situations related to investigations of complex criminal cases. However, these circumstances did not turn into scandals involving her. It was also reported that information about a fight between police officers under her control was being investigated, but there were no public negative consequences on her part.\n\n(Lobbying in the United States > Lobbying controversies > Unfavorable image) Generally the image of lobbyists and lobbying in the public sphere is not a positive one, although this is not a universal sentiment. Lobbyists have been described as a \"hired gun\" without principles or positions. Scandals involving lobbying have helped taint the image of the profession, such as ones involving lobbyist Jack Abramoff, and congressmen Randy \"Duke\" Cunningham, and Bob Ney and others, and which featured words such as \"bribery\", \"lobbyist\", \"member of Congress\" and \"prison\" tending to appear together in the same articles. Negative publicity can sully lobbying's image to a great extent: high-profile cases of lobbying fraud such as Abramoff's; dubious father-son exchange-of-favors ties; public officials such as Newt Gingrich being accused and then denying accusations of having done lobbying and earning $1.6 million from \"strategic advice\". There are a variety of reasons why lobbying has acquired a negative image in public consciousness. While there is much disclosure, much of it happens in hard-to-disclose personal meetings, and the resulting secrecy and confidentiality can serve to lower lobbying's status.\n\n(List of professional wrestling attendance records in Japan > Abstract) The following is a list of professional wrestling attendance records in Japan. The list is dominated by the country's largest promotion, New Japan Pro-Wrestling (NJPW). The company was founded by Antonio Inoki in 1972 and had a long rivalry with Giant Baba 's All Japan Pro Wrestling. AJPW set a number of attendance records during its heyday, especially during the 1990s wrestling boom, however, only three of its shows remain on the list as of 2023.  According to this list, 5 events are from NJPW's flagship Wrestling World supercard event, which since 1992's Super Warriors in Tokyo Dome has been held exclusively at the Tokyo Dome which typically has a seating capacity of at least 42,000 people or more. Only six of the attendances listed are non-NJPW events, with the Weekly Pro Wrestling Tokyo Dome Show being an interpromotional event involving over a dozen Japanese promotions. In addition, NJPW has hosted three co-promotional events each with the U.S.-based World Championship Wrestling, two with the Japan-based UWF International, and one with deathmatch promotion Big Japan Pro Wrestling. All but two of the events have been held at the Tokyo Dome in the Japanese capital city of Tokyo, while one has been held at Sun Beach in Atami, Japan and one at Kawasaki Stadium in Kawasaki, Japan.\n\n(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986."}, {"id": "q006", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How frequently have the Latvian national figure skating championships been held and have there been any interruptions?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Figure Skating Championships > Senior medalists > Ice dance) Alexandr Kirsanov, the 2000 Latvian Champion in ice dance with his partner Barbara Hanley, was returning from the 2025 U.S. Figure Skating Championships with two of his students aboard American Airlines Flight 5342 when their airplane collided with a helicopter upon approach to Ronald Reagan Washington National Airport and plunged into the Potomac River. All aboard were killed, including twenty-eight skaters, coaches, and family members returning from the U.S. Championships.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Dutch Figure Skating Championships > Abstract) The Dutch Figure Skating Championships (Dutch: Nederlandse kampioenschappen kunstschaatsen) are an annual figure skating competition organized by the Royal Dutch Skating Federation (Dutch: Koninklijke Nederlandsche Schaatsenrijders Bond) to crown the national champions of the Netherlands. While skating competitions had been held in the Netherlands prior to 1950, official national championships were not held until 1950. Since 2017, the Dutch Championships have been contested as part of the International Challenge Cup, the marquee figure skating competition of the Netherlands. The top Dutch competitors at this international competition are recognized as the Dutch national champions. No competition was held in 2021 due to the COVID-19 pandemic.  Medals are awarded in men's singles, women's singles, pair skating, and ice dance at the senior and junior levels, although not every discipline may be held every year due to a lack of participants. Wouter Toledo holds the record for winning the most Dutch Championship titles in men's singles (with seven), while Karen Venhuizen holds the record in women's singles (with nine). Daria Danilova and Michel Tsiba hold the record in pair skating (with three), and Marie-Louise and Xander Gijtenbeek hold the record in ice dance (with seven).\n\n(Slovenian Figure Skating Championships > Abstract) The Slovenian Figure Skating Championships (Slovene: Prvenstvo Slovenije v umetnostnem drsanju) are an annual figure skating competition organized by the Slovene Skating Union (Slovene: Zveza drsalnih športov Slovenije) to crown the national champions of Slovenia. Slovenia declared its independence from Yugoslavia in June 1991. The Slovene Skating Union was established in December 1991 as a federation of Slovenia's four skating clubs (Celje, Stanko Bloudek, Olimpija Ljubljana, and Jesenice), while a fifth skating club (Labod Bled) was later established. The first national skating championships of the newly independent Slovenia were held in 1992 in Celje. Early on, responsibility for hosting the national championships rotated between three cities: Celje, Ljubljana, and Jesenice. They have been held without interruption since their inception.  Medals are awarded in men's and women's singles at the senior and junior levels, although not every discipline is held every year due to a lack of participants. Gregor Urbas holds the record for winning the most Slovenian Championship titles in men's singles (with ten), while Daša Grm holds the record in women's singles (with nine)."}, {"id": "q007", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What controversies or disputes over national team selection, player eligibility, or diaspora player policies have been recorded?", "ev": "(Abdul-Karim Zito > Abstract) Abdul-Karim Zito is a Ghanaian professional football manager and former player who is the technical director of Ghana Premier League club Ashanti Gold. He was previously manager of fellow league clubs Asante Kotoko, Medeama S.C. and Dreams F.C. and also coached the Ghana national under-20 football team.\n\n(Ibrahim Sunday > Abstract) Ibrahim Sunday (born 22 July 1944) is a Ghanaian former professional football player and coach. A midfielder, he played the majority of his career for Ghanaian club Asante Kotoko, and was also a member of the Ghana national team, participating in two Africa Nations Cup tournaments. In 1971, he won the African Footballer of the Year award. He is the first ever African footballer to appear in the Bundesliga.\n\n(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(NBA G League > Player allocations > Draft) The NBA G League draft occurs each season and is the major source from which teams build their rosters. Team rosters are made up of returning players (players who were on the team during the previous season), players waived by an NBA team who are designated as an ' affiliate player ' to their respective G League affiliate, allocated players (players who have local significance), and drafted players. The eight round draft utilizes a serpentine format, meaning the order alternates in each round; Team A who selected first in Round 1 will select last in Round 2, while Team B who selected last in Round 1 will get the first pick in Round 2. Round 3 was added in 2014.  The league holds an annual Player Invitational, where prospects hope to earn eligibility for the upcoming draft.\n\n(FIBA eligibility rules > Eligibility) Eligibility rules imposed by FIBA on national team players applies to both men and women. A player who seeks to represent a country must hold legal nationality of that country.  In 3x3 basketball, a player is eligible to represent their country if they have the appropriate legal nationality. The eligibility could be proven through a passport obtained at any age.  The method by which a player obtains nationality is generally irrelevant to national team eligibility. The so-called grandparent rule is only used to determine a player's eligibility for a team representing a dependent territory of a sovereign nation, such as Puerto Rico or the US Virgin Islands. In those cases, the player must hold nationality of the applicable sovereign nation, called the \"main territory\" in FIBA regulations (the United States in both named cases), and must have been either:  Additionally, a player can gain eligibility for a dependent territory's team by gaining the nationality of the main territory, plus residing in the dependent territory for at least 4 years.  A player who has competed in an official FIBA competition after reaching age 17 is tied to that country. Those who played for one country before turning 17 may play for a different country if both countries' federations agree, with the FIBA Secretary General deciding if the federations do not agree. FIBA has an exception that allows the Secretary General to authorize a nationality change to a player's \"country of origin\" (i.e., a country where the player has recent ancestral roots) if it is"}, {"id": "q008", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did the regulator use administrative orders, fines, or license revocations as mechanisms to enforce broadcasting compliance?", "ev": "(Barack Obama \"Joker\" poster > Abstract) The Barack Obama \" Joker \" poster is a manipulated image of Barack Obama, then president of the United States, used by some critics of the Obama administration. The image was created by Firas Alkhateeb in January 2009, and portrays Obama as DC comic book supervillain the Joker, based on the portrayal by Heath Ledger in The Dark Knight (2008). Alkhateeb has said the image was not intended to make a political statement. He uploaded the image to the photo-sharing website Flickr, from where it was downloaded by an unknown individual who added the caption \" socialism \". It was described in 2009 by The Guardian as the \"American right's first successful use of street art \".\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Jon Favreau (speechwriter) > Political career > Obama campaign) Obama communications aide Robert Gibbs, who had worked for Kerry's campaign, recommended Favreau to Obama as an excellent writer, and in 2005 he began working for Barack Obama in his U.S. Senate office before joining his presidential campaign as chief speechwriter in 2006. His interview with Obama was on the Senator's first day. Favreau described this his approach to Obama as, \"A speech can broaden the circle of people who care about this stuff. How do you say to the average person that's been hurting: 'I hear you, I'm there?' Even though you've been so disappointed and cynical about politics in the past, and with good reason, we can move in the right direction. Just give me a chance.\"  Favreau led a speechwriting team for the campaign that included Ben Rhodes and Cody Keenan.  He has likened his position to \" Ted Williams 's batting coach\", because of Obama's celebrated abilities as a speaker and writer. Obama senior adviser David Axelrod said of Favreau, \"Barack trusts him... And Barack doesn't trust too many folks with that—the notion of surrendering that much authority over his own words.\" In Obama's own words, Favreau was his \"mind reader\".  Favreau has said that the speeches of Robert F. Kennedy and Michael Gerson have influenced his work, and has expressed admiration for Peggy Noonan 's speechwriting, citing a talk given by Ronald Reagan at Pointe du Hoc as his favorite Noonan speech. Gerson also admires Favreau's work, and sought him out at an Obama New Hampshire campaign rally to speak with the younger speechwriter.  Favreau was the primary writer of Obama's inauguration address of January 2009."}, {"id": "q009", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What awards, nominations, or notable critical recognitions has Daisuke Igarashi's ocean-themed manga received?", "ev": "(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(Children of the Sea (manga) > Development) The concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\n(The Sword of Paros > Publication > Manga) Written by Kaoru Kurimoto and illustrated by Yumiko Igarashi, The Sword of Paros was serialized in Kadokawa Shoten 's Monthly Asuka manga magazine from March 1986 to February 1987. The series was collected in three tankōbon volumes.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016."}, {"id": "q010", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented changes to British national team training protocols have been attributed to the cyclist's methods or results?", "ev": "(David McCann (cyclist) > Abstract) David McCann (born 17 March 1973 in Belfast) is an Irish former professional road bicycle racer, who rode in the 1996, 2000 and 2012 Olympic Games. He was the Irish national road race champion in 2000, 2001 and 2006, and won the Irish national time trial championships a record 6 times (2001, 2002, 2004, 2005, 2009 & 2010). He last rode for the Synergy Baku Cycling Project, an Azerbaijan-registered UCI Continental team.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Henry Hobbs (cyclist) > Career) Hobbs competed at the British Cycling National Track Championships as a 16 year-old in February 2024, and won bronze in the men’s kilometre time trial, clocking a personal best time of 1:02.574, and finishing just four tenths of a second from the gold medal. That week, he was selected to join the British Cycling junior academy.  In August 2024, Hobbs won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships. He also win silver in the 1km time trial and bronze in the team pursuit at the Championships held in Luoyang, China.  Hobbs won the gold medals in the omnium and in the 1km time trial at the 2025 UCI Junior Track Cycling World Championships in Apeldoorn, Netherlands in August 2025. At the championships he also won the silver medal in the team pursuit alongside Rory Gravelle, Max Hinds, Dan Thompson and Albie Jones.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Elinor Barker > Life and career > 1994–2012) Elinor Jane Barker was born on 7 September 1994 in Cardiff. The older sister of racing cyclist Megan Barker, Elinor took up cycling with the Maindy Flyers aged ten to avoid swimming classes and later attended Llanishen High School.  In 2011, Barker became the British national junior pursuit champion, finished runner-up in the British national junior scratch race, and claimed silver in the time-trial at the UCI Junior Road World Championships in Copenhagen. At the 2012 UEC U23/Junior European Track Championship, she won gold medals in both the junior individual pursuit and the team pursuit. At the UCI Junior Track Cycling World Championships, she then won silver medals in the individual pursuit and omnium and a bronze in the team pursuit.  Competing in road cycling, she became the junior time trial world champion in 2012, completing the 15.6-kilometre (9.7-mile) course in Valkenburg, Netherlands in 22:26.29, beating Cecilie Uttrup Ludwig of Denmark by 35.87 seconds. That year, she joined the Olympic Development Programme.  Barker competed in the UCI Track Cycling World Cup in October 2012 in Cali, Colombia, where she won a silver medal in the team pursuit while competing for Team SWI Welsh Cycling. The following month, Barker made her debut for Great Britain at the Track Cycling World Cup in Glasgow as a replacement for an ill Joanna Rowsell. Barker, Laura Kenny and Dani King triumphed over Australia in the final. Barker was named Carwyn James Junior Sportswoman of the Year at the 2012 BBC Wales Sports Personality of the Year awards."}, {"id": "q011", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What international statements or human rights reports have critiqued Sri Lankan handling of autonomy and rights in the Northern Province?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament."}, {"id": "q012", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When did the bank establish a dedicated wealth management division and what services did it initially offer?", "ev": "(Santander Bank > Abstract) Santander Bank, N. A. (/ ˌ s ɑː n t ɑː n ˈ d ɛər /) is an American bank operating as a wholly owned subsidiary of the Spanish Santander Group. It is based in Boston and its principal market is the northeastern United States. It has $57.5 billio\n\n(Citizens Financial Group > Early history) Citizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.  In 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986."}, {"id": "q013", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has the official domestic competition structure for men's cricket in Ghana evolved over time?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member."}, {"id": "q014", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which physiological measures (VO2max, power output, lactate thresholds) were reported as central to the cyclist's training assessments?", "ev": "(David McCann (cyclist) > Abstract) David McCann (born 17 March 1973 in Belfast) is an Irish former professional road bicycle racer, who rode in the 1996, 2000 and 2012 Olympic Games. He was the Irish national road race champion in 2000, 2001 and 2006, and won the Irish national time trial championships a record 6 times (2001, 2002, 2004, 2005, 2009 & 2010). He last rode for the Synergy Baku Cycling Project, an Azerbaijan-registered UCI Continental team.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Cycling at the 1996 Summer Olympics – Men's team pursuit > Abstract) The men's team pursuit event in cycling at the 1996 Summer Olympics competition consisted of matches between two teams of four cyclists. The teams started at opposite ends of the track. They had 16 laps (4 kilometres) in which to catch the other cyclist. If neither was caught before one had gone 16 laps, the times for the distance (based on the third rider of the team to cross the line) were used to determine the victor.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard."}, {"id": "q015", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "In what year was the first Latvian national figure skating championship held?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa
