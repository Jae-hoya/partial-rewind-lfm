outs Champion Mickie James would enter the 2022 Royal Rumble match. Both WWE 's official Twitter account and Impact's website confirmed this soon after, with the former recognizing James as an Impact champion. Two years later, Knockouts Champion Jordynne Grace would enter in the Royal Rumble. In 2024, TNA and WWE began a wider talent exchange, with several TNA wrestlers appearing on WWE's NXT brand, and NXT wrestlers making periodic appearances at TNA events. On January 16, 2025, WWE announced a multi-year partnership with TNA that allows NXT wrestlers and TNA wrestlers to appear in NXT shows, TNA iMPACT!, select WWE Premium Live Events, and TNA pay-per-views.\n\n(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(List of professional wrestling attendance records in Japan > Abstract) The following is a list of professional wrestling attendance records in Japan. The list is dominated by the country's largest promotion, New Japan Pro-Wrestling (NJPW). The company was founded by Antonio Inoki in 1972 and had a long rivalry with Giant Baba 's All Japan Pro Wrestling. AJPW set a number of attendance records during its heyday, especially during the 1990s wrestling boom, however, only three of its shows remain on the list as of 2023.  According to this list, 5 events are from NJPW's flagship Wrestling World supercard event, which since 1992's Super Warriors in Tokyo Dome has been held exclusively at the Tokyo Dome which typically has a seating capacity of at least 42,000 people or more. Only six of the attendances listed are non-NJPW events, with the Weekly Pro Wrestling Tokyo Dome Show being an interpromotional event involving over a dozen Japanese promotions. In addition, NJPW has hosted three co-promotional events each with the U.S.-based World Championship Wrestling, two with the Japan-based UWF International, and one with deathmatch promotion Big Japan Pro Wrestling. All but two of the events have been held at the Tokyo Dome in the Japanese capital city of Tokyo, while one has been held at Sun Beach in Atami, Japan and one at Kawasaki Stadium in Kawasaki, Japan.\n\n(Total Nonstop Action Wrestling > Features > Contracts) TNA wrestlers are forbidden by contract from working for other companies with televised wrestling shows, but are free to perform non-televised work for any other independent wrestling promotions, domestic or international, as well as televised events held by foreign promotions that Impact Wrestling is linked to or has a working relationship with (such as AAA and NOAH). Many Impact wrestlers perform regularly for various promotions on the independent circuit in addition to Impact Wrestling weekly shows. In 2012, the company changed its policy, preventing its talent from appearing at any independent events that are later released on DVD. Top wrestlers have guaranteed contracts, but the majority of the roster are paid on a per appearance basis. Impact wrestlers are classified as independent contractors and are not offered health coverage through the promotion. As of November 2017, Impact Wrestling contracts give the performers complete ownership over all intellectual property associated with their characters."}, {"id": "q033", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did access to public services such as education and healthcare change in the Northern Province following reconstruction?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Transport > Rail) Sri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.  Most of the railways were developed during the British colonial period.  The railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\n(Northern Province, Sri Lanka > Education) The Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Northern Province, Sri Lanka > Transport > Air) Airways and airports are underdeveloped in this province. Jaffna International Airport is the primary airport in the province, once an international airport that had regular passenger flight service to Colombo and Tiruchirappalli, India. It had been under the control of the Sri Lanka Navy and now has been turned into an international airport again with the help of India. Daily flights between Colombo and Chennai, India and Jaffna are available. There are a few small airports and airstrips in Vavuniya and Iranamadu."}, {"id": "q034", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What ICC membership criteria did Ghana meet to achieve associate status and which documents specify those requirements?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Ghana national cricket team > History > 2018-Present) In April 2018, the ICC decided to grant full Twenty20 International (T20I) status to all its members. All Twenty20 matches played between Ghana and other ICC members after 1 January 2019 had the full T20I status. Ghana's first T20I match was against Namibia on 20 May 2019, after finishing top of the North-Western sub-region qualification group, advancing to the Regional Final of the 2018–19 ICC World Twenty20 Africa Qualifier tournament.  In 2021 Ghana was among five teams excluded from the ICC T20I Championship for failing to play enough fixtures in the relevant period, an effect of the COVID-19 pandemic.\n\n(Emmanuel Kabutey Narter-Olaga > Abstract) Emmanuel Kabutey Narter-Olaga (born 1 January 1924) was a Ghanaian politician who was a member of the first parliament of the second Republic of Ghana. He represented the Ada Ghana constituency under the membership of the National Alliance of Liberals.\n\n(Solomon Anso Manson > Abstract) Samuel Anso Manson is a Ghanaian politician and was a member of the first parliament of the second Republic of Ghana. He represented the Dormaa constituency under the membership of the Progress Party (PP)\n\n(Dominic Yaw Amoako > Abstract) Dominic Yaw Amoako is a Ghanaian politician and a member of the 1st Parliament of the 4th republic of Ghana representing Tano North constituency under the membership of the National Democratic Congress."}, {"id": "q035", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has the population of the Northern Province changed between the 1980, 2001, and 2012 Sri Lankan censuses?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Islam in Sri Lanka > Sri Lankan Moors) The Sri Lankan Moors are mostly native speakers of the Tamil language while a few of them speak Sinhala as primary language, and follow Islam as their religion. Sri Lankan Moors comprise 9.30% (2012 Census) of Sri Lanka's population, and constitute the largest ethnic group within the Muslim community in the country.  Islam was spread to Sri Lanka by contacts with the merchant ships operated by the Moor traders between Serendib (Old Persian / Arabic name for Sri Lanka), and various ports in the Arabian Peninsula and North Africa. As per scholars, Sri Lankan Moors are descendant of the Marakkar, Mappilas, Memons and Pathans of South India."}, {"id": "q036", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which Olympic medals did the British cyclist win in team pursuit, and in which years were they awarded?", "ev": "(Elinor Barker > Abstract) Elinor Jane Barker (born 7 September 1994) is a Welsh road and track cyclist, who has ridden for UCI Women's Team Uno-X Mobility since 2022. As a track cyclist, she is an Olympic champion in the team pursuit and a world champion in the team pursuit, madison, points race, and scratch race disciplines. She has won four Olympic medals (one gold, two silver and one bronze) during her career. Her overall tally of four Olympic medals is a record for a Welsh woman.  In her youth, Barker was the 2012 junior time trial world champion in road cycling. On her debut for Great Britain in November 2012, she was part of the team pursuit side that won gold in the World Cup event in Glasgow. The following year, she triumphed in the team pursuit at both the Track Cycling World Championships and European Track Championships. She helped Great Britain defend their world team pursuit title in 2014, and won a silver and a bronze at that year's Commonwealth Games. Further World and European Championships medals followed in 2015, and Barker won an Olympic gold medal in the team pursuit at the 2016 Summer Olympics.  Barker won her first individual world title in the points race in 2017, won a gold medal in the same discipline at the 2018 Commonwealth Games, and became the scratch race world champion in 2019. She won her second points race world title and a European title in the elimination race in 2020, and a silver in the team pursuit at the delayed 2020 Summer Olympics. Following maternity leave, she won two gold medals at both the European and World Track Cycling Championships in 2023. At the 2024 Olympics, Barker won a bronze medal in the team pursuit and a silver in the madison.  Barker is an Olympic champion, a three-time world champion and seven-time European champion in the team pursuit, as well as a two-time world champion in the points race, a world champion in both the madison and scratch race, a two-time European madison champion, and one-time European elimination race champion. She is also a Commonwealth Games gold medalist in the points race. In her road cycling career, she finished seventh at the Gent-Wevelgem in 2023, and third at the British National Time Trial Championships in 2023 and 2024.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Henry Hobbs (cyclist) > Career) Hobbs competed at the British Cycling National Track Championships as a 16 year-old in February 2024, and won bronze in the men’s kilometre time trial, clocking a personal best time of 1:02.574, and finishing just four tenths of a second from the gold medal. That week, he was selected to join the British Cycling junior academy.  In August 2024, Hobbs won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships. He also win silver in the 1km time trial and bronze in the team pursuit at the Championships held in Luoyang, China.  Hobbs won the gold medals in the omnium and in the 1km time trial at the 2025 UCI Junior Track Cycling World Championships in Apeldoorn, Netherlands in August 2025. At the championships he also won the silver medal in the team pursuit alongside Rory Gravelle, Max Hinds, Dan Thompson and Albie Jones.\n\n(Elinor Barker > Life and career > 1994–2012) Elinor Jane Barker was born on 7 September 1994 in Cardiff. The older sister of racing cyclist Megan Barker, Elinor took up cycling with the Maindy Flyers aged ten to avoid swimming classes and later attended Llanishen High School.  In 2011, Barker became the British national junior pursuit champion, finished runner-up in the British national junior scratch race, and claimed silver in the time-trial at the UCI Junior Road World Championships in Copenhagen. At the 2012 UEC U23/Junior European Track Championship, she won gold medals in both the junior individual pursuit and the team pursuit. At the UCI Junior Track Cycling World Championships, she then won silver medals in the individual pursuit and omnium and a bronze in the team pursuit.  Competing in road cycling, she became the junior time trial world champion in 2012, completing the 15.6-kilometre (9.7-mile) course in Valkenburg, Netherlands in 22:26.29, beating Cecilie Uttrup Ludwig of Denmark by 35.87 seconds. That year, she joined the Olympic Development Programme.  Barker competed in the UCI Track Cycling World Cup in October 2012 in Cali, Colombia, where she won a silver medal in the team pursuit while competing for Team SWI Welsh Cycling. The following month, Barker made her debut for Great Britain at the Track Cycling World Cup in Glasgow as a replacement for an ill Joanna Rowsell. Barker, Laura Kenny and Dani King triumphed over Australia in the final. Barker was named Carwyn James Junior Sportswoman of the Year at the 2012 BBC Wales Sports Personality of the Year awards.\n\n(Elinor Barker > Life and career > 2021–2026) In 2021, Barker was part of the British squad that won silver in the team pursuit at the delayed 2020 Summer Olympics in Tokyo. At the time, Barker was pregnant by cyclist Casper von Folsach, whom she married in October 2024. She competed in the qualifying round but was then replaced by Evans in the line-up. Germany beat Great Britain's world record in the final which Barker did not take part in. During the Games she signed a two-year deal to join the Uno-X team from 2022. She was inspired to continue competing after becoming a mother by other professional cyclists that had done so including Lizzie Deignan, Kenny, and Sarah Storey.  Barker took maternity leave after giving birth in March 2022. She was selected by Wales for that year's Commonwealth Games in the road-race. The following year, Barker finished 15th at the Vuelta CV Feminas, before winning two gold medals at the 2023 UEC European Track Championships in Grenchen, her first major track cycling competition since becoming a mother. She triumphed as a member of the quartet that won the team pursuit and also in the madison partnering Archibald.  Barker finished seventh in the Gent–Wevelgem, her best ever finish in a UCI road race. She then finished 16th at the Fleche Wallone, before extending her contract with Uno-X until 2027. Barker also competed in the 2023 Giro Donne (Giro d'Italia Women) where she finished 58th, marking her first ever appearance at a grand tour, and she also finished third in the elite time-trial at the British National Championships. In August, at the 2023 UCI Track Cycling World Championships in Glasgow, Barker won a gold medal in the team pursuit alongside Archibald, Josie Knight and Anna Morris. It was the first time that Great Britain had won the event since 2014. She then won a second gold medal while partnering Evans in the madison.  At the 2024 UCI Track Cycling Nations Cup in Adelaide, Australia, Barker won a silver medal in the team pursuit, and then secured a gold medal in the madison with Archibald. Back on the road, she finished third in the elite time-trial at the British National Championships. At the 2024 Summer Olympics in Paris, Barker won bronze in the team pursuit alongside Knight, Morris and Jess Roberts. She then became the first Welsh woman to win four Olympic medals by securing a silver in the madison with Evans.  In June 2025, after finishing 16th at the British National Road Championships in Ceredigion, Barker ended her racing season early after announcing that she was expecting her second child. The following month, Barker was awarded an honorary degree by Swansea University for her \"outstanding achievements and contribution to international cycling.\" On 2 January 2026, Barker posted on Instagram that she had recently given birth."}, {"id": "q037", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What evidence exists of cricket contributing to social, educational, or economic outcomes in Ghanaian communities?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Yoruba people > Demographics > Ghana) There exists an old and thriving Yoruba community in Ghana tracing back to more than three centuries of establishment. The presence of Yoruba people in Ghana traces back to before the concept of the modern Ghanaian nation and are therefore Ghanaian citizens by law. The Yoruba communities became established through various waves and layers for centuries before the colonial era. The earliest wave were long distance merchants, artisans, labourers and explorers who settled in both southern and northern Ghanaian locales such as Salaga, Sekondi-Takoradi, Kumasi, Accra (Jamestown, Ngleshie Alata, Tudu), Yendi, Tamale, Kintampo, Nandom. In Ngleshie Alata (A corruption of English ' Alata ', the Fante and Ga word for Yoruba people based on the region where the majority came from) and the area around the James Fort, the Yoruba presence dates back to 1673 when they were employed to build the fort and settled in large numbers on the eastern coastal region. It is on record that the first ' Alata Akutso Mantse ' or Alata division head, a Yoruba speaker named Ojo employed by the Royal African Company ascended an Accra royal stool becoming head of the Alata quarter of James Town in 1748, a position his descendants continue to hold to this very day.  In the popular 18th century Gonja Salaga Slave Market, the Yoruba residents of the town would not allow their fellow countrymen captured and brought to the markets to be sold to the Ashantis who would march them to the coast. Rather, they would barter for the release of the Yoruba captives who would in turn work for their benefactors as tradesmen until they earned their release. This earliest wave was followed by an intermediate wave of slave returnees who were predominantly of Yoruba descent like the Taboms/Agudas who settled along the Ghanaian coast. Then came the third wave who came during the Gold Coast colonial period. By this period, they had firmly entrenched themselves in the country's commerce and distribution systems and constituted a substantial percentage of merchants and traders in the country's large markets as proprietors of wholesale enterprises. They were the largest group of immigrants established in the pre-independence Gold Coast. In 1950 they constituted 15% of traders in Accra, 23% in Kumasi, and over a third in Tamale. They were usually referred to in southern Ghana as Yoruba, Lagosian, Alata, or Anago. It was the early stream of this wave in the 1830s that established places like Accra New Town which was previously known as Lagos town and before then as Araromi.  There is no codification for the Yoruba ethnicity in the most recent Ghanaian censuses but in previous ones, they were considered an indigenous Ghanaian group with origins outside modern Ghana. In the 1960 Ghanaian population census, there were 109,090 Yorubas. Of this figure; 100,560 were Yoruba ' proper ' while 8,530 were Atakpame (Ana). This represented 1.6% of the Ghanaian population."}, {"id": "q038", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What governance disputes or controversies (selection, judging, federation decisions) have been reported in Latvian figure skating history?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Andris Teikmanis > Abstract) Andris Teikmanis (29 November 1959; Riga, Latvia) is a Latvian lawyer, politician, and diplomat. He served as first post-soviet Mayor of Riga from 1990 to 1994. In September 2016 he was accredited as the Latvian ambassador to the United States. He previously served as Under Secretary in the Ministry of Foreign Affairs in Riga, and as Latvian ambassador to the Council of Europe, to the Russian Federation, to Germany, and to the United Kingdom, and as non-resident ambassador to Australia and New Zealand.Since August 2019 A. Teikmanis is head of the Chancellery of the President of Latvia Egils Levits.\n\n(Latvian Figure Skating Championships > Senior medalists > Ice dance) Alexandr Kirsanov, the 2000 Latvian Champion in ice dance with his partner Barbara Hanley, was returning from the 2025 U.S. Figure Skating Championships with two of his students aboard American Airlines Flight 5342 when their airplane collided with a helicopter upon approach to Ronald Reagan Washington National Airport and plunged into the Potomac River. All aboard were killed, including twenty-eight skaters, coaches, and family members returning from the U.S. Championships.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved."}, {"id": "q039", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Has the bank been subject to major regulatory enforcement actions, fines, or consent orders and when?", "ev": "(Consumer Credit Act 1974 > Provisions of the act > Part IX: Judicial control > Orders) The courts are allowed to issue enforcement orders for cases where the contract has been infringed upon, except in situations where the contract has not been signed or the terms are not set out in the contract, in which case they are permanently unenforceable. The courts are also prohibited from making enforcement orders where the owner or creditor did not give a copy of the agreement to the debtor or hirer before the contract commenced. Other than this the court is obliged to issue such orders. There are also situations in which orders can be made even when there has been no infringement. These are when the debtor or hirer has died, to recover protected goods without the consent of a debtor and to enforce a land mortgage.  The courts can also make \"time orders\" providing for either payment by the debtor of any sum owed to the creditor, remedying any breach of the agreement by the debtor other than non-payment of money or both. These orders are made at the discretion of the courts after an application for an enforcement order. The time orders can also cover statutory bailment in the case of hire-order or hire-purchase agreements. If the court feels that the property in dispute or acting as security is at risk of damage or deprecation, they can give protection orders preventing the use of the property. This re-enacts section 35 of the Hire-Purchase Act 1965, which was repealed by the Consumer Credit Act.  Other orders are \"special orders\", covered by section 133 of the act. There are two types; return orders and transfer orders. Return orders are orders from the court requiring the return of goods covered by the agreement to the creditor. These orders may be immediate or subject to a delay, and may give the debtor the option to pay the goods value to the creditor if he does not return the goods in time. Transfer orders are orders transferring the creditor's ownership of certain goods to the debtor, ordering the payment of the rest of the goods to the creditor. This can only be done if the debtor pays an amount of money equal or more than one third of the value of the returned goods.\n\n(Providence, Rhode Island > Economy) Over one third of Providence's economy is based in trade, transportation, utilities, and educational and health services. As the capital of Rhode Island, the city's economy additionally consists of government services, with approximately 70,000 jobs. The unemployment rate in the city is 5.0% as of August 2022, compared to a national rate of 3.8%.  Prominent companies headquartered in Providence include Fortune 500 Textron, an advanced technologies industrial conglomerate; United Natural Foods, a distributor of natural and organic foods; Fortune 1000 Nortek Incorporated; Gilbane, a construction and real estate company. Other companies with headquarters in the city include Citizens Bank, Virgin Pulse, Ørsted US Offshore Wind, and Providence Equity. Providence is the site of a sectional center facility (SCF), a regional hub for the U.S. Postal Service. Providence is also home to some of toy manufacturer Hasbro 's business operations, although their headquarters are in Pawtucket.  The city is home to the Rhode Island Convention Center, which opened in December 1993. Along with a hotel, the convention center is connected to the Providence Place Mall, a major retail center, through a skywalk.\n\n(Citizens Financial Group > Early history) Citizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.  In 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\n(Providence, Rhode Island > Sports) Providence is home to the Providence Bruins of the American Hockey League, who play at the Amica Mutual Pavilion. From 1926 to 1972, the AHL's Providence Reds (renamed the Rhode Island Reds in their last years) played at the Rhode Island Auditorium. In 1972, the team relocated to the Providence Civic Center, where they played until moving to Binghamton, New York, in 1977.  The National Football League 's New England Patriots and Major League Soccer 's New England Revolution play in Foxborough, Massachusetts, which is situated halfway between Providence and Boston. Providence was formerly home to two major league franchises: the NFL's Providence Steam Roller in the 1920s and 1930s, and the National Basketball Association 's Providence Steamrollers in the 1940s. The Rhode Island Auditorium also hosted 29 of the 49 boxing fights of Rocky Marciano.  The city's defunct baseball team, the Providence Grays, competed in the National League from 1878 through 1885. The team defeated the New York Metropolitans in baseball's first successful \"world championship series\" in 1884. In 1914, after the Boston Red Sox purchased Babe Ruth from the then-minor league Baltimore Orioles, the team prepared Ruth for the major leagues by sending him to finish the season playing for a minor league team in Providence that was also known as the Grays. Most baseball fans—along with the local media—tend to follow the Boston Red Sox.  Major colleges and universities fielding NCAA Division I athletic teams are Brown University and Providence College. The latter is a member of the Big East Conference. Until 2020, Providence was home to the headquarters of the American Athletic Conference (The American).  Providence has also hosted the alternative sports event Gravity Games from 1999 to 2001, and was also the first host of ESPN 's X Games, known in its first edition as the Extreme Games, in 1995. Providence has its own roller derby league. Formed in 2004, it currently has four teams: the Providence Mob Squad, the Sakonnet River Roller Rats, the Old Money Honeys, and the Rhode Island Riveters.  Providence is also home to the Providence Hurling Club. The Providence Hurling Club was founded in 2015 and competes in the Junior C division of the Boston GAA. Despite being the newest hurling team within the Boston GAA, the Providence Hurling Club has captured two Junior C titles- with the first in 2021 with a win over Hartford and the second in 2023 with a win over Worcester. Home games are held at Pleasant View Elementary School in Providence and playoff matches are held at the Irish Cultural Center in Canton, MA.\n\n(Rhode Island > Culture > Sports > Professional) Two professional minor league teams play in Rhode Island. The Providence Bruins ice hockey team — which won the AHL's Calder Cup during the 1998–99 AHL season — is affiliated with the Boston Bruins, and play at Amica Mutual Pavilion in Providence. The Rhode Island FC, an association football soccer team, began competing in the second tier USL Championship in 2024 at Beirne Stadium at Bryant University, and now play at Centreville Bank Stadium in Pawtucket.  The Pawtucket Red Sox baseball team was a Triple-A International League affiliate of the nearby Boston Red Sox from 1973 to 2020. They played at McCoy Stadium in Pawtucket and had won four league titles, the Governors' Cup, in 1973, 1984, 2012, and 2014. McCoy Stadium also has the distinction of being home to the longest professional baseball game ever played – 33 innings.  The Providence Reds were a hockey team that played in the Canadian-American Hockey League (CAHL) from 1926 to 1936, and the American Hockey League (AHL) from 1936 to 1977, the last season of which they played as the Rhode Island Reds. The team won the Calder Cup in 1938, 1940, 1949, and 1956. The Reds played at the Rhode Island Auditorium, on North Main Street in Providence, Rhode Island from 1926 through 1972, when the team affiliated with the New York Rangers and moved into the newly built Providence Civic Center. The team name came from the state bird, a rooster known as the Rhode Island Red. They moved to New York in 1977, then to Connecticut in 1997, and are now called the Hartford Wolf Pack.  The Reds are the oldest continuously operating minor-league hockey franchise in North America, having fielded a team in one form or another since 1926 in the CAHL. It is also the only AHL franchise to have never missed a season. The AHL returned to Providence in 1992 in the form of the Providence Bruins.  Before the great expansion of athletic teams all over the country, Providence and Rhode Island in general played a great role in supporting teams. The Providence Grays won the first World Championship in baseball history in 1884. The team played their home games at the old Messer Street Field in Providence. The Grays played in the National League from 1878 to 1885. They defeated the New York Metropolitans of the American Association in a best of five-game series at the Polo Grounds in New York. Providence won three straight games to become the first champions in major league baseball history. Babe Ruth played for the minor league Providence Grays of 1914 and hit his only official minor league home run for them before the Grays' parent club, the Boston Red Stockings, recalled him.  Rhode Island has deep history with the sport of soccer where the sport was played as early as 1886 when the state's first organized league would be founded, known as the Rhode Island Football Association (RIFA). One of their teams, the Pawtucket Free Wanderers, would establish themselves as a regional power and win the American Cup in 1893. The first championship game of the U.S. Open Cup was also held in 1914 in Pawtucket's Coates Field to a crowd of 10,000. Later, a team known as Pawtucket Rangers F.C. would win the 1941 edition of the U.S. Open Cup (then National Challenge Cup). The Rhode Island Oceaneers would later be founded, and went on to win the 1974 American Soccer League championship. Other former semiprofessional soccer teams of the modern era include the Rhode Island Stingrays of the USL Premier Development League, and the Rhode Island Reds of the National Premier Soccer League, with both leagues regarded as the fourth tier of American soccer.  The now-defunct professional football team known as the Providence Steamrollers won the 1928 NFL title. They played in a 10,000 person stadium called the Cycledrome. An unrelated basketball team also known as the Providence Steamrollers played in the Basketball Association of America, which would become the National Basketball Association.  Rhode Island's only rugby league team was the Rhode Island Rebellion, a semi-professional team that was a founding member of the USA Rugby League, which was at the time the top competition in the United States for the sport of rugby league. The Rebellion played their home games at Classical High School in Providence."}, {"id": "q040", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did the regulator's initiatives influence citizens' access to broadcast information and patterns of civic engagement?", "ev": "(Shasti Conrad > Career > Obama White House) Conrad worked on both the 2008 and 2012 presidential campaigns of Barack Obama. She then served as a White House Intern in the Office of Urban Affairs in 2009, then later as executive assistant to senior advisor Valerie Jarrett and as assistant within the Office of Public Engagement.\n\n(Phil Weiser > Academic and federal government career > Obama administration) In 2009, President Barack Obama appointed Weiser as Deputy Assistant Attorney General in the Justice Department's Antitrust Division. He took the post in July 2009, taking a leave of absence from the University of Colorado Law School. In 2010, President Obama named him senior advisor for technology and innovation to the National Economic Council Director, and he participated in a series of policy initiatives.\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Julius Genachowski > Obama campaign and transition) For Senator Barack Obama's 2008 Presidential Campaign, Genachowski was Chairperson of the Technology, Media and Telecommunications Policy Working Group, which created the Obama Technology and Innovation Plan. He also advised and guided the Campaign's innovative use of technology and the Internet for grassroots engagement and participation.  After the November election, he co-led the Technology, Innovation, and Government Reform Group for President-Elect Obama 's Transition Team. On January 12, 2009, several news outlets reported that Genachowski would be President-Elect Obama's choice to head the FCC. This was confirmed by a press release on March 3, 2009."}, {"id": "q041", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What official responses, policy changes, or leadership actions did the promotion undertake following major domestic criticisms?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance.\n\n(Professional wrestling in the United Kingdom > History > 1930s: All-in wrestling) While various styles of amateur wrestling continued as legitimate sports, grappling as a promotional business did not return to Britain until the beginning of the 1930s when the success of the more worked aspects of professional wrestling in America, like gimmickry and showmanship, were introduced to British wrestling. It was with this revival that the more submission -based Catch As Catch Can wrestling style, which had already replaced Greco Roman wrestling as the dominant style of professional wrestling in the United States back in the 1890s, became the new dominant style in Britain. With Lancashire style catch-as-catch-can already a major amateur sport particularly in Northern England, there existed a ready-made source of potential recruits to professional wrestling.  Amateur wrestler, Sir Atholl Oakeley got together with fellow grappler Henry Irslinger to launch one of the first promotions to employ the new style of wrestling which was coined \"All-in\" wrestling. Though, like many wrestlers throughout the business, Oakeley would claim his wrestling was entirely legitimate, his claim was highly dubious. Under the British Wrestling Association banner, Oakeley's promotion took off with wrestlers such as Tommy Mann, Black Butcher Johnson, Jack Pye, Norman \"the Butcher\" Ansell, \"College Boy\", and Jack Sherry on the roster, while Oakeley himself would win a series of matches to be crowned the first British Heavyweight Champion.  The business was reaching one of its highest points at the time, with the best"}, {"id": "q042", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which advocacy groups, industry associations, or civic organizations led major opposition campaigns against the regulator's policies?", "ev": "(Elizabeth Warren > Career > Consumer Financial Protection Bureau) Warren was an early advocate for creating a new Consumer Financial Protection Bureau (CFPB). The bureau was established by the Dodd–Frank Wall Street Reform and Consumer Protection Act, signed into law by President Obama in July 2010. In September 2010, Obama named Warren Assistant to the President and Special Advisor to the Secretary of the Treasury on the CFPB to set up the new agency. While liberal groups and consumer advocacy groups urged Obama to formally nominate Warren as the agency's director, financial institutions and Republican members of Congress strongly opposed her, believing she would be an overly zealous regulator. Reportedly convinced that Warren could not win Senate confirmation as the bureau's first director, in January 2012, Obama appointed former Ohio attorney general Richard Cordray to the post in a recess appointment over Republican senators' objections.\n\n(Barack Obama \"Joker\" poster > Reaction > Protest symbol) The image was adopted by some of Obama's critics and used for posters, T-shirts, bumper stickers, and other merchandise. The image is considered by some a symbol of the Tea Party protest movement. During the September 12, 2009, Taxpayer March on Washington, the largest demonstration against the Obama administration's policies to date, protesters denouncing deficit spending and the America's Affordable Health Choices Act of 2009, dubbed \"Obamacare\" by critics, carried Obama \"Joker\" signs captioned the doctor will see you now.\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Kirbyjon Caldwell > Relationship with Barack Obama) Caldwell endorsed Barack Obama in the 2008 Democratic primary, supporting him against John McCain in the presidential election. In August 2010, after media reports that 18 percent of Americans thought President Obama was a Muslim, Caldwell told reporters he had known Obama for years as a Christian who prays daily. He described the media questioning Obama's religion as \"a 24-hour noise box committed to presenting the president in a false light\".\n\n(Newspaper endorsements for John McCain in the 2008 United States presidential election > Abstract) During the 2008 United States presidential election, newspapers, magazines, and other publications made general election endorsements. As of November 4, 2008, Barack Obama had received more than twice as many publication endorsements as John McCain; in terms of circulation, the ratio was more than 3 to 1, according to the detailed tables below. In summary:  According to Editor & Publisher magazine, as of November 3, 2008, there was 273 newspapers endorsing Barack Obama compared to 172 for John McCain. By comparison, the magazine reported that before election day in 2004, John Kerry received 213 endorsements compared to 205 for George W. Bush.  UWIRE, in its Presidential Scorecard, reported that Barack Obama led John McCain by 86 to 2 in college newspaper endorsements, as of November 4.  The Association of Alternative Newsmedia reported that Barack Obama led John McCain by 57 to 0 in endorsements among its 123 member newspapers as of October 31, 2008.  For a full list of newspapers that have endorsed Barack Obama, see Newspaper endorsements for Barack Obama in the 2008 United States presidential election.  For a summary of endorsements and a list of newspapers that have chosen not to endorse a candidate, see Newspaper endorsements in the 2008 United States pr"}, {"id": "q043", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have organizers managed low participant numbers, such as combining categories or inviting guest skaters?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Andris Teikmanis > Abstract) Andris Teikmanis (29 November 1959; Riga, Latvia) is a Latvian lawyer, politician, and diplomat. He served as first post-soviet Mayor of Riga from 1990 to 1994. In September 2016 he was accredited as the Latvian ambassador to the United States. He previously served as Under Secretary in the Ministry of Foreign Affairs in Riga, and as Latvian ambassador to the Council of Europe, to the Russian Federation, to Germany, and to the United Kingdom, and as non-resident ambassador to Australia and New Zealand.Since August 2019 A. Teikmanis is head of the Chancellery of the President of Latvia Egils Levits.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved."}, {"id": "q044", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented infrastructural deficits (grounds, pitches, training facilities) have been reported for cricket in Ghana?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(Takoradi Technical University > Corporate Partnerships > TTE Technical Training Group) The TTE Technical Training Group, a UK technical training school in the oil and gas industries, announced a major partnership in Ghana with Tullow Oil to establish a new training centre aimed at equipping local technicians for work in the oil, gas, manufacturing, and mining industries. The Minister of Education, Professor Jane Naana Poku-Agyemang commissioned a $6 million Technical Training Centre in Takoradi Polytechnic to train Ghanaian students in these fields on 21 June 2013. The centre, named \"Jubilee Technical Training Centre\", was co-sponsored by the Oil Jubilee Partners, Tullow Ghana Limited, Anadarko WCTP Company, Kosmos Energy, Ghana National Petroleum Company, and Sabre Oil/Gas Holding Limited. The centre is the first in West Africa to offer diploma-accredited qualifications to support industry and commerce in Ghana.\n\n(Ahmadiyya in Ghana > History > Late twentieth century) On August 10, 1974, Abdul Wahab Adam was appointed as the Amir (Head) and missionary-in-charge of the Ahmadiyya Muslim Mission of Ghana by the then caliph of the Ahmadiyya movement, Mirza Nasir Ahmad. Adam was the first indigenous Ghanaian to hold this office. In the early part of his ministry, Adam shifted the headquarters of the Ghanaian Ahmadiyya Muslim Community from Saltpond to the capital of the country, Accra. The move came in response to Accra's growing economic and political influence in the country, which strongly contrasts with Saltpond, a small unknown town in coastal Ghana.  During the late twentieth century, the Ahmadi missionaries increasingly diverted their attention towards the Christian populations of the country. A large number of books, fliers and audio cassettes were published to meet the new objective. Articles published and public preaching sessions included titles such as, \"Jesus Will not Come Again\", \"Jesus:Son of God or God?\" and \"50,000 errors in the Bible\". Perhaps as a result of this, the Ahmadi Muslim teachings, and particularly its eschatological doctrines have been the most difficult theological challenge the Ghanaian Christians may have encountered since the late twentieth century. The Ahmadi Muslim missionaries, often seen as successful preachers by some locals, who adopt the Bible and Quran in their preaching efforts, have resulted in many Christian evangelists to adopt the two books as well. Another notable consequence is that, since 1964, the Christian denominations in Ghana have come to increasingly recognize the presence of Muslims as important and noticeable members of the Ghanaian society.  The Ahmadiyya Muslim Community significantly increased its social and humanitarian efforts in Ghana. Perhaps the most decisive was the visit to the Gambia by the then Caliph Mirza Nasir Ahmad, whose visit in 1970 was instrumental in the launch of the Nusrat Jahan Scheme which has been responsible for the establishment of a number of schools and hospitals all over West Africa. It has also been argued that besides the Nusrat Jahan Scheme, local missionaries and leaders boosted their efforts in humanitarian activities as well, to \"restore the glory of Islam.\" While opening the fourth Ahmadiyya hospital in the country in 1971, at Agona Swedru, Central Region, Basharat Ahmad Bashir, a leading Ahmadiyya missionary stated that, \"opening hospitals and educational facilities in the country was part of the programme of the Movement to regain the lost heritage and glory of Islam.\""}, {"id": "q045", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did the cyclist's success affect funding, talent identification, or institutional priorities within British Cycling?", "ev": "(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Henry Hobbs (cyclist) > Career) Hobbs competed at the British Cycling National Track Championships as a 16 year-old in February 2024, and won bronze in the men’s kilometre time trial, clocking a personal best time of 1:02.574, and finishing just four tenths of a second from the gold medal. That week, he was selected to join the British Cycling junior academy.  In August 2024, Hobbs won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships. He also win silver in the 1km time trial and bronze in the team pursuit at the Championships held in Luoyang, China.  Hobbs won the gold medals in the omnium and in the 1km time trial at the 2025 UCI Junior Track Cycling World Championships in Apeldoorn, Netherlands in August 2025. At the championships he also won the silver medal in the team pursuit alongside Rory Gravelle, Max Hinds, Dan Thompson and Albie Jones.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy
