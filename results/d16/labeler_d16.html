was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard.\n\n(Cycling in Los Angeles > Cycling rules and regulations > Road rules) Cyclists may travel either in the street or on the sidewalk. On the sidewalk they must behave so as not to cause danger to pedestrians (which is an arbitrary judgment that seems to translate into traveling at walking pace). Moreover, in some of the cities within the greater Los Angeles region, it is illegal to cycle on the sidewalk. Cyclists in general should follow the same traffic rules and behavior as motorized vehicles. It is legal for a cyclist to \" take a lane \" within the State of California, and in the case of narrow-width lanes it is advisable to do so.  It is not required to wear a helmet unless the rider is under the age of 18 years. A driver's license is also not required for a cyclist. The bicycle relevant sections of the California Vehicle Code indicate that a cyclist may ride out from the right-hand curb in order to avoid obstacles. This explicit provision, combined with the California Driver's Handbook (which indicates that passing vehicles must ensure 3 feet (0.91 m) minimum safe passing distance), means that certain lanes which are not wide enough for a bicycle and a passing automobile should be occupied by the bicycle until it is safe for the cyclist to pull in to the right and signal the automobile to overtake if there is no other safe-passing lane available for the automobile.\n\n(Elinor Barker > Life and career > 1994–2012) Elinor Jane Barker was born on 7 September 1994 in Cardiff. The older sister of racing cyclist Megan Barker, Elinor took up cycling with the Maindy Flyers aged ten to avoid swimming classes and later attended Llanishen High School.  In 2011, Barker became the British national junior pursuit champion, finished runner-up in the British national junior scratch race, and claimed silver in the time-trial at the UCI Junior Road World Championships in Copenhagen. At the 2012 UEC U23/Junior European Track Championship, she won gold medals in both the junior individual pursuit and the team pursuit. At the UCI Junior Track Cycling World Championships, she then won silver medals in the individual pursuit and omnium and a bronze in the team pursuit.  Competing in road cycling, she became the junior time trial world champion in 2012, completing the 15.6-kilometre (9.7-mile) course in Valkenburg, Netherlands in 22:26.29, beating Cecilie Uttrup Ludwig of Denmark by 35.87 seconds. That year, she joined the Olympic Development Programme.  Barker competed in the UCI Track Cycling World Cup in October 2012 in Cali, Colombia, where she won a silver medal in the team pursuit while competing for Team SWI Welsh Cycling. The following month, Barker made her debut for Great Britain at the Track Cycling World Cup in Glasgow as a replacement for an ill Joanna Rowsell. Barker, Laura Kenny and Dani King triumphed over Australia in the final. Barker was named Carwyn James Junior Sportswoman of the Year at the 2012 BBC Wales Sports Personality of the Year awards."}, {"id": "q046", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which statutory authorities and sections of federal communications law did the regulator invoke to justify broadcasting rulemaking?", "ev": "(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Phil Weiser > Academic and federal government career > Obama administration) In 2009, President Barack Obama appointed Weiser as Deputy Assistant Attorney General in the Justice Department's Antitrust Division. He took the post in July 2009, taking a leave of absence from the University of Colorado Law School. In 2010, President Obama named him senior advisor for technology and innovation to the National Economic Council Director, and he participated in a series of policy initiatives.\n\n(Newton N. Minow > Personal life) Minow married Josephine Baskin in 1949. They had three daughters, all trained as lawyers; Nell Minow, shareholder activist and movie critic; Martha L. Minow, law professor and former dean of Harvard Law School; and Mary, a library law expert appointed to the Obama administration. Josephine Baskin Minow died on February 17, 2022, at age 95.  Minow was a great-uncle to Adam Frankel, a speechwriter of his former protege, Barack Obama. Josephine Minow's older sister, Irene, is Frankel's paternal grandmother.  Minow died from a heart attack at home in Chicago, on May 6, 2023, at age 97.\n\n(Breitbart News > Content and coverage > Main sections > \"Big Hollywood\") In 2008, Andrew Breitbart launched the website Big Hollywood, a group blog by individuals working in Hollywood. The site was an outgrowth of Breitbart's \"Big Hollywood\" column in The Washington Times, which included issues faced by conservatives working in Hollywood. In 2009, the site used audio from a conference call to accuse the National Endowment of the Arts of encouraging artists to create work in support of President Barack Obama's domestic policy. The Obama Administration and the NEA were accused of potentially violating the Hatch Act. The White House acknowledged regrets, and the story led to the resignation of a White House appointee, and new federal guidelines for how federal agencies should interact with potential grantees."}, {"id": "q047", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the governance and organizational structure of Ghana's national cricket association and its official roles?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Kweku Baako Jnr > Abstract) Kweku Baako Jnr is a Ghanaian journalist and the editor-in-chief of the New Crusading Guide newspaper he was also the son of Kofi Baako. He is a frequent panelist on radio shows in Ghana, including Peace FM's weekday morning show and Newsfile, a current affairs programme on Joy FM (Ghana). In 1999 he was awarded the Journalist of the Year by the Ghana Journalists Association. He was polled as the 39th most influential Ghanaian in 2014 by ETV.\n\n(David Apasara > Abstract) David Apasera is a Ghanaian politician of the Republic of Ghana. He was the Member of Parliament representing Bolgatanga constituency of the Upper East Region of Ghana in the 4th Parliament of the 4th Republic of Ghana. He is a member of the People's National Convention.\n\n(Ghana national cricket team > History > 2000-2018) A 2000 CricInfo article noted that cricket in Ghana was then confined to the south of the country, played only in the capital and the cities of Kumasi and Obuasi. It was also said to be particularly popular amongst the expatriate British and Indian populations, with the main club league featuring two Indian teams out of four total. Ghana played its first ICC tournament in March 2004, defeating Malawi in a play-off to finish third (of eight teams) in the Africa Affiliates Tournament. That tournament was part of the qualification process for the 2007 World Cup. The inaugural edition of the World Cricket League commenced in 2007, preceded by various regional qualifying tournaments. At the 2006 Africa Division Three qualifier, Ghana placed third behind Mozambique and Sierra Leone, again defeating Malawi in a third-place playoff. The playoff was noted for the performance of Ghanaian player Peter Ananya (a future national captain), who took 7/25 to bowl Malawi out for 41.  Ghana won the 2008 Africa Division Three tournament by defeating Swaziland in the final, having earlier bowled Rwanda out for 23 in their semi-final. They were subsequently promoted to the 2008 Africa Division Two tournament, but could only place fifth from six teams. This was enough, however, for Ghana to maintain its place for the 2010 Division Two event. At that tournament, they placed second to Zambia, securing entry to the 2012 Global Division Eight tournament. The only African side at the eight-team tournament, played in Samoa, Ghana lost only two matches, both to Vanuatu, placing runner-up and qualifying for the 2013 Global Division Seven event. Three of the six sides there were African, the others being Nigeria and Botswana, the hosts. Ghana won only two matches, both against Germany, and were relegated back to the regional tournaments system.  In international Twenty20 cricket, Ghana played its first tournaments in 2011, finishing runner-up to Nigeria in the 2011 Africa Division Two Twenty20 tournament and then fifth in 2011 Division One, both part of qualification for the 2012 World Twenty20. Earlier in the year, Ghana had hosted the Africa Division Three Twenty20, its first time hosting a senior ICC tournament. Ghana placed fourth at the 2012 Africa Division Two Twenty20, failing to qualify for the following year's Division One event. However, they went on to win the 2014 Division Two Twenty20, defeating Zambia on net run rate, and consequently progressing to the 2015 Africa Twenty20 Championship. There, Ghana defeated Tanzania, Botswana, and Uganda (for the first time), finishing fourth behind Uganda on net run rate. Against Uganda (a previous winner of the tournament), Ghana had made only 74/9 from its 20 overs, but managed to bowl Uganda out for 69.  In August 2018, they were included in the 2018 Africa T20 Cup tournament. However, Ghana declined Cricket South Africa's invite to compete in the tournament, and were replaced by Uganda."}, {"id": "q048", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "In what ways did court decisions cite or interpret the regulator's policies in subsequent communications and broadcasting litigation?", "ev": "(Ricki Seidman > Political career > Department of Justice) Subsequently, she was named as a deputy associate attorney general at the U.S. Department of Justice. In 2000, she served as a senior principal at TSD Communications, a position she maintains today. She served as then-Senator Joe Biden 's communications director during the Obama presidential campaign in 2008. In 2009, she advised President Barack Obama during the successful nomination of Sonia Sotomayor to the Supreme Court. In 2021, Seidman rejoined the Department of Justice under the Biden administration.\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(International media reaction to the 2008 United States presidential election > Reflections on Bush) President George W. Bush had been criticized in America and abroad for his foreign policies, including his decisions to invade Iraq and Afghanistan during his eight years in office. After the 2008 election, many international editorials and commentators expressed hope that the new administration would provide a break from the previous administration's foreign policy choices. Peter Hartcher wrote for The Sydney Morning Herald that \"Barack Obama did not materialise from a vacuum. He is America's response to the dramatic failures of George Bush. It was Bush who created the craving for change. Obama has now met that need.\" French historian and conservative Alexandre Adler, writing for Le Figaro, said Obama's victory was a \"miracle\" but \"We shouldn't treat Bush as a pariah.\" Marek Magierowski, writing for Polish newspaper Rzeczpospolita, said Obama's leadership will still be hegemony, just of another kind: \"The problem is that this same America has lost its credibility in recent years. People from Lisbon to Karachi stopped believing in its good intentions and George W. Bush, unfortunately, has a lot to do with that. But Barack Obama now has such a huge capital of trust that he should quickly be able to rebuild its credibility.\" An editorial in the Mexico City daily La Jornada said Obama's election was historic and that \"it would be unfair to ignore the strong and positive political and human differences between the victor in yesterday's election and the man who, for the last eight years, has taken the power of the United States into its worst moral and economic abyss.\" The Toronto Star quipped that Americans craved change after Bush's \"imperial\" presidency.\n\n(Associated Press > Litigation and controversies > Shepard Fairey) In March 2009, the AP counter-sued artist Shepard Fairey over his famous image of Barack Obama, saying the uncredited, uncompensated use of an AP photo violated copyright laws and signaled a threat to journalism. Fairey had sued the AP the previous month over his artwork, titled \"Obama Hope\" and \"Obama Progress\", arguing that he did not violate copyright law because he dramatically changed the image. The artwork, based on an April 2006 picture taken for the AP by Mannie Garcia, was a popular image during the 2008 presidential election and now hangs in the National Portrait Gallery in Washington, D.C. According to the AP's lawsuit filed in federal court in Manhattan, Fairey knowingly \"misappropriated The AP's rights in that image\". The suit asked the court to award the AP profits made off the image and damages. Fairey said he looked forward to \"upholding the free expression rights at stake here\" and disproving the AP's accusations. In January 2011, the suit was settled with neither side declaring their position to be wrong but agreeing to share reproduction rights and profits from Fairey's work.\n\n(Barack Obama \"Joker\" poster > Reaction > Protest symbol) The image was adopted by some of Obama's critics and used for posters, T-shirts, bumper stickers, and other merchandise. The image is considered by some a symbol of the Tea Party protest movement. During the September 12, 2009, Taxpayer March on Washington, the largest demonstration against the Obama administration's policies to date, protesters denouncing deficit spending and the America's Affordable Health Choices Act of 2009, dubbed \"Obamacare\" by critics, carried Obama \"Joker\" signs captioned the doctor will see you now."}, {"id": "q049", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were the major mergers and acquisitions in the bank's history and their dates?", "ev": "(Gulf Cooperation Council > Economy > Mergers and acquisitions) Companies and investors from GCC countries are active in mergers and acquisitions. Since 1999, more than 5,200 transactions with a known value of 573 billion had been announced. Investors include a number of sovereign wealth funds.\n\n(Bristol Bill > Freedom) Out of jail, Bill was arrested in January 1860 in Providence, Rhode Island for breaking into a grocery store and stealing a barrel of flour. Bill jumped bail and was arrested in August in Boston and returned to Rhode Island. He was again arrested for robbing a house in Providence in April 1861.  At one point during this period, going by the name William H. Warburton, Bill was in Providence staying with James Edgeton, who himself had a history of bank robbing. The pair decided to rob the Westminster Bank. On the night of the planned heist, before it began, Bill was arrested as a suspect for a grocery robbery in the possession of burglar's tools. Bill was later released in exchange for cooperation with the Boston Police.\n\n(Citizens Financial Group > Early history) Citizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.  In 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\n(Providence, Rhode Island > Economy) Over one third of Providence's economy is based in trade, transportation, utilities, and educational and health services. As the capital of Rhode Island, the city's economy additionally consists of government services, with approximately 70,000 jobs. The unemployment rate in the city is 5.0% as of August 2022, compared to a national rate of 3.8%.  Prominent companies headquartered in Providence include Fortune 500 Textron, an advanced technologies industrial conglomerate; United Natural Foods, a distributor of natural and organic foods; Fortune 1000 Nortek Incorporated; Gilbane, a construction and real estate company. Other companies with headquarters in the city include Citizens Bank, Virgin Pulse, Ørsted US Offshore Wind, and Providence Equity. Providence is the site of a sectional center facility (SCF), a regional hub for the U.S. Postal Service. Providence is also home to some of toy manufacturer Hasbro 's business operations, although their headquarters are in Pawtucket.  The city is home to the Rhode Island Convention Center, which opened in December 1993. Along with a hotel, the convention center is connected to the Providence Place Mall, a major retail center, through a skywalk.\n\n(Economy of the United States > Mergers and acquisitions) Since 1985 there have been three major waves of mergers and acquisitions in the country. 2017 has been the most active year in terms of number of deals (12,914), whereas 2015 cumulated to the biggest overall value of deals ($24 billion).  The biggest merger deal in U.S. history was the acquisition of Time Warner by America Online Inc. in 2000, where the bid was over $164 billion. Since 2000 acquisitions of U.S. companies by Chinese investors increased by 368%. The other way round—U.S. companies acquiring Chinese Companies—showed a decrease of 25%, with a short upwards trend until 2007."}, {"id": "q050", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have resource limitations (rinks, funding, coaching availability) impacted staging or competitiveness of Latvian national championships?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Andris Teikmanis > Abstract) Andris Teikmanis (29 November 1959; Riga, Latvia) is a Latvian lawyer, politician, and diplomat. He served as first post-soviet Mayor of Riga from 1990 to 1994. In September 2016 he was accredited as the Latvian ambassador to the United States. He previously served as Under Secretary in the Ministry of Foreign Affairs in Riga, and as Latvian ambassador to the Council of Europe, to the Russian Federation, to Germany, and to the United Kingdom, and as non-resident ambassador to Australia and New Zealand.Since August 2019 A. Teikmanis is head of the Chancellery of the President of Latvia Egils Levits.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved."}, {"id": "q051", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which Sri Lankan government ministries and agencies were mandated to coordinate postwar reconstruction in the Northern Province?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\n(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.  In late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors."}, {"id": "q052", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What internal agency limits, judicial constraints, or statutory repeals curtailed the regulator's power over broadcasting standards?", "ev": "(Elizabeth Warren > Career > Consumer Financial Protection Bureau) Warren was an early advocate for creating a new Consumer Financial Protection Bureau (CFPB). The bureau was established by the Dodd–Frank Wall Street Reform and Consumer Protection Act, signed into law by President Obama in July 2010. In September 2010, Obama named Warren Assistant to the President and Special Advisor to the Secretary of the Treasury on the CFPB to set up the new agency. While liberal groups and consumer advocacy groups urged Obama to formally nominate Warren as the agency's director, financial institutions and Republican members of Congress strongly opposed her, believing she would be an overly zealous regulator. Reportedly convinced that Warren could not win Senate confirmation as the bureau's first director, in January 2012, Obama appointed former Ohio attorney general Richard Cordray to the post in a recess appointment over Republican senators' objections.\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\n(Barack Obama \"Joker\" poster > Abstract) The Barack Obama \" Joker \" poster is a manipulated image of Barack Obama, then president of the United States, used by some critics of the Obama administration. The image was created by Firas Alkhateeb in January 2009, and portrays Obama as DC comic book supervillain the Joker, based on the portrayal by Heath Ledger in The Dark Knight (2008). Alkhateeb has said the image was not intended to make a political statement. He uploaded the image to the photo-sharing website Flickr, from where it was downloaded by an unknown individual who added the caption \" socialism \". It was described in 2009 by The Guardian as the \"American right's first successful use of street art \"."}, {"id": "q053", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has the performance of Ghana's men's national team in regional and ICC-sanctioned tournaments changed following development initiatives?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member."}, {"id": "q054", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What official findings, rulings, or exonerations were published regarding the cyclist's involvement in doping controversies?", "ev": "(David McCann (cyclist) > Abstract) David McCann (born 17 March 1973 in Belfast) is an Irish former professional road bicycle racer, who rode in the 1996, 2000 and 2012 Olympic Games. He was the Irish national road race champion in 2000, 2001 and 2006, and won the Irish national time trial championships a record 6 times (2001, 2002, 2004, 2005, 2009 & 2010). He last rode for the Synergy Baku Cycling Project, an Azerbaijan-registered UCI Continental team.\n\n(Henry Hobbs (cyclist) > Abstract) Henry Hobbs (born 20 May 2007) is a British cyclist. He is a three-time junior world champion in track cycling disciplines. He won the individual pursuit at the 2024 UCI Junior Track Cycling World Championships, before winning both the kilometre time trial and the omnium at the 2025 edition in Apeldoorn. He is the 2025 junior European champion in the individual pursuit.\n\n(Alexander Morgan (cyclist) > Abstract) Alexander Morgan (born 18 July 1994) is an Australian male road and track cyclist. At the 2013 UCI Track Cycling World Championships he won the gold medal in the team pursuit event. He also competed and finished 4th in the individual pursuit.\n\n(Cycling at the 1996 Summer Olympics – Men's team pursuit > Abstract) The men's team pursuit event in cycling at the 1996 Summer Olympics competition consisted of matches between two teams of four cyclists. The teams started at opposite ends of the track. They had 16 laps (4 kilometres) in which to catch the other cyclist. If neither was caught before one had gone 16 laps, the times for the distance (based on the third rider of the team to cross the line) were used to determine the victor.\n\n(Ed Clancy > Career) On 17 August 2008, Clancy was a member of the Olympic team pursuit squad which broke the world record in the heats with 3:55.202, beating Russia to the ride-off for silver and gold. The next day, on their way to winning the gold medal, the British team broke their own world record in 3:53.314, beating Denmark by 6.7 seconds.  On 4 April 2012, Clancy was part of the Great Britain team which set a new world record of 3:53.295 in winning the gold medal in the team pursuit at the 2012 World Track Cycling Championships in Melbourne.  After the 2012 Olympic Games, where he set a time of 1:00.981 in the Omnium Kilo Time Trial, British Cycling announced that Clancy would replace Sir Chris Hoy in the Great Britain team for the team sprint event, where he rode in the Man 3 position. Despite finishing 2nd in the Glasgow round of the World Cup, Clancy returned to the endurance team for the 2013 World Championships.  In November 2018, it was announced that Clancy would join the Vitus Pro Cycling Team p/b Brother UK for the 2019 season, after the JLT–Condor team which he had been part of for eight years confirmed that it would be disbanding at the end of the year.  In August 2021, during the delayed 2020 Summer Olympics, Clancy announced his retirement. His final competition was the 2021 UCI Track Champions League, which concluded in December of that year with a double header at the Lee Valley VeloPark.  In February 2023 Clancy was announced as the new active travel commissioner for South Yorkshire, following Dame Sarah Storey and working for South Yorkshire Mayor Oliver Coppard."}, {"id": "q055", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What eligibility and qualification criteria have been applied for skaters to enter the Latvian national championships?", "ev": "(Latvian Figure Skating Championships > History) Latvia – along with Estonia and Lithuania – was annexed by the Soviet Union in 1944, but achieved independence in August 1991. The first national championships held after Latvia's independence took place in Riga in April 1992. Andrejs Vlaščenko won the men's event after his only competition, Konstantin Kostin, withdrew from the competition, Alma Lepina won the women's event, and Jeļena Trocenko and Vasilijs Serkovs won the ice dance event.  Controversy arose after the 1993 Latvian Championships when Andrejs Vlaščenko, who had finished in second place, allegedly refused his silver medal and threw away his diploma. Vlaščenko claimed he gave the medal to his brother, while his coach threw out the diploma. Tatjana Strautmane, president of the Latvian Skating Association, annulled his second-place finish, while the full association's presidium voted to suspend Vlaščenko for the rest of the season. Scandal followed Vlaščenko during his time on the Latvian national team. When members of the team met to sign their contracts with the Latvian Skating Association in June 1993, Vlaščenko was a no-show. The skating federation soon received a letter from the German Ice Skating Union asking that Vlaščenko be released to allow him to compete for Germany. In 1994, it was discovered that Vlaščenko had applied for German citizenship, having been receiving financial assistance from the German skating federation, even while still representing Latvia in international competition, including at the 1994 Winter Olympics.  Figure skating in Latvia has been hampered by a lack of resources, including available ice, financing, and interest from the general public; as well as low enrollment. In 1993, the indoor ice rink at the Daugava Stadium was described as \"very unpleasant\" with concrete showing through the ice surface. The 1994 Latvian Championships featured precisely one man, one woman, one pairs team, and one ice dance team at the senior level. The Latvian Skating Association often invited guest skaters from neighboring countries like Estonia, Lithuania, Finland, and Russia to their national championships in order to fill out the competition. The first artificial ice rink built in Latvia following its independence was the Liepāja Olympic Hall in Liepāja in late 1998. In 2010 and 2017, combined championship competitions were held with Lithuania. In 2012, 2022, and 2023, Latvia hosted an international competition – the Latvian Open (later renamed the Latvian Trophy) – which also served as their national championships. In all of these cases, the top Latvian skaters were recognized as the Latvian Champions.\n\n(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Latvian Figure Skating Championships > Senior medalists > Ice dance) Alexandr Kirsanov, the 2000 Latvian Champion in ice dance with his partner Barbara Hanley, was returning from the 2025 U.S. Figure Skating Championships with two of his students aboard American Airlines Flight 5342 when their airplane collided with a helicopter upon approach to Ronald Reagan Washington National Airport and plunged into the Potomac River. All aboard were killed, including twenty-eight skaters, coaches, and family members returning from the U.S. Championships.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Andris Teikmanis > Abstract) Andris Teikmanis (29 November 1959; Riga, Latvia) is a Latvian lawyer, politician, and diplomat. He served as first post-soviet Mayor of Riga from 1990 to 1994. In September 2016 he was accredited as the Latvian ambassador to the United States. He previously served as Under Secretary in the Ministry of Foreign Affairs in Riga, and as Latvian ambassador to the Council of Europe, to the Russian Federation, to Germany, and to the United Kingdom, and as non-resident ambassador to Australia and New Zealand.Since August 2019 A. Teikmanis is head of the Chancellery of the President of Latvia Egils Levits."}, {"id": "q056", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did serialization venue and adaptation into other media affect the manga's domestic and international readership or sales figures?", "ev": "(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(My One-Hit Kill Sister > Media > Manga) A manga adaptation by Kenji Taguchi started serialization online via Shogakukan 's Sunday Webry website on March 6, 2020, as well as the seinen manga magazine Monthly Sunday Gene-X since April 17 of the same year. The series finished on July 28, 2023. Shogakukan collected its chapters in twelve tankōbon volumes, released from July 10, 2020, to September 12, 2023.\n\n(List of Umineko When They Cry chapters > Abstract) The manga series Umineko When They Cry is written by Ryukishi07 and illustrated by six different manga artists working separately on different story arcs based on the Umineko: When They Cry visual novel series by 07th Expansion. The first manga, an adaptation of Legend of the Golden Witch illustrated by Kei Natsumi, began serialization in Square Enix 's Gangan Powered magazine in the January 2008 issue. After Gangan Powered was discontinued, the manga was transferred to Square Enix's Monthly Gangan Joker magazine with the debut May 2009 issue, and continued until the publication of the September 2009 issue. Jirō Suzuki drew the adaptation of Turn of the Golden Witch which was serialized between the August 2008 and October 2010 issues of Square Enix's GFantasy. The manga adaptation of Banquet of the Golden Witch is illustrated by Kei Natsumi and was serialized between the October 2009 and July 2011 issues of Gangan Joker. Sōichirō drew the adaptation of Alliance of the Golden Witch, which was serialized in Square Enix's Internet-based magazine Gangan Online between October 1, 2009, and February 2, 2012.  The manga adaptation of End of the Golden Witch is illustrated by Akitaka and was serialized between the November 2010 and December 2012 issues of Gangan Joker. Hinase Momoyama drew the adaptation of Dawn of the Golden Witch, which was serialized between the December 2010 and December 2012 issues of GFantasy. The manga adaptation of Requiem of the Golden Witch is illustrated by Eita Mizuno and started serialization in the May 2011 issue of Square Enix's Monthly Shōnen Gangan. The manga adaptation of Twilight of the Golden Witch is drawn by Kei Natsumi and started serialization in the February 2012 issue of Gangan Joker. A manga titled Umineko: When They Cry Tsubasa, illustrated by Fumi Itō, began serialization in Square Enix's Young Gangan Big on June 25, 2011 and concluded in Big Gangan on April 25, 2013. Four tankōbon volumes of Legend of the Golden Witch were released in Japan between June 2008 and December 2009 under Square Enix's Gangan Comics imprint. 53 volumes have been released over the entire series. Yen Press licensed the series and began releasing omnibuses of two or three volumes in December 2012, and continued releasing these omnibuses mostly every three or four months until June 2020.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016.\n\n(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013."}, {"id": "q057", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were the primary land resettlement and demining procedures implemented in the Northern Province after the civil war?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Demographics) The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.  The population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\n(Northern Province, Sri Lanka > Transport > Rail) Sri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.  Most of the railways were developed during the British colonial period.  The railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\n(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.  In late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament."}, {"id": "q058", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What specific art techniques and paneling methods did Daisuke Igarashi use to depict oceanic imagery in the manga?", "ev": "(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Children of the Sea (manga) > Development) The concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\n(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(The Sword of Paros > Publication > Manga) Written by Kaoru Kurimoto and illustrated by Yumiko Igarashi, The Sword of Paros was serialized in Kadokawa Shoten 's Monthly Asuka manga magazine from March 1986 to February 1987. The series was collected in three tankōbon volumes.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016."}, {"id": "q059", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What changes occurred in employment rates and main economic activities in the Northern Province after reconstruction efforts?", "ev": "(Northern Province, Sri Lanka > Transport > Rail) Sri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.  Most of the railways were developed during the British colonial period.  The railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\n(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\n(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.  In late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\n(Northern Province, Sri Lanka > Education) The Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries."}, {"id": "q060", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the full name and official title of the prominent US communications regulator and their dates of service?", "ev": "(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terro
