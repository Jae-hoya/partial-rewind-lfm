ould be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Taipei Mission, Riga > Background) The aim of the representative office is to further bilateral cooperation between Latvia and Taiwan in the fields of economics, culture, education and research. In addition, it offers consular services and the consular jurisdiction of the office also extends to Estonia. Till 2021, the consular jurisdiction of the office also extended to Lithuania, until the opening of the Taiwanese Representative Office in Lithuania that same year.  Latvia and the Republic of China exchanged recognition in August 16, 1923, when the it recognized Latvia de jure. After the Soviet occupation of Latvia in 1940, the ROC was one of the countries that did not recognize the incorporation of the Baltic States into the Soviet Union and de facto recognition continued.  On 21 August 1991, Latvia restored its full independence after the end of the Soviet occupation and on November of the same year, Latvia and Taiwan signed an agreement for the 'mutual establishment of trade missions', while at the same time maintaining diplomatic relations with China. On 29 January 1992, Latvia signed an agreement on the opening of a Taiwanese consulate general in the Latvian capital city of Riga (the Consulate General of the Republic of China in Riga). This policy was allegedly due to Latvian desires of receiving development aid from Taiwan, which, however, did not materialize. In response, China withdrew its ambassador and diplomatic staff from Latvia and froze relations between Latvia. On 17 September 1992, a 25-member delegation headed by Latvian Prime Minister Ivars Godmanis and Foreign Minister of Latvia Jānis Jurkāns made an official visit to Taiwan. During the delegation's visit, Latvia and Taiwan signed agreement for investment-protection and a letter of intent to establish direct flights between the capital cities of Taipei and Riga.  After a new Latvian government under Valdis Birkavs came to power following the 1993 parliamentary election, the Taiwanese consulate general in Riga was closed and Latvia normalized its relations with the People's Republic of China in 1994 due to Latvia receiving very little investment from Taiwan and the conducting of a much larger trade with China. In November 1995, the consulate general was downgraded to the Taipei Mission and in October 1996, it began its operations.  Since March 2022, the office is headed by a representative, currently Andrew H.C. Lee, who previously served as the representative of Taipei Economic and Cultural Office in Brunei.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved."}, {"id": "q077", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What typical funding, sponsorship, and resource-allocation mechanisms do Ghana's cricket administrators use to support operations?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Vodafone > Operations > Africa > Ghana) On 3 July 2008, Vodafone agreed to acquire a 70% stake in Ghana Telecom for $900 million. The acquisition was consummated on 17 August 2008. The same group-led consortium won the second fixed-line licence in Qatar on 15 September 2008.  On 15 April 2009, Ghana Telecom, along with its mobile subsidiary OneTouch, was rebranded as Vodafone Ghana.  In February 2023, Vodafone Group has concluded the sale of its 70% stake in Vodafone Ghana to Telecel Group in a bid to streamline its African portfolio, thus exiting the Ghanaian market."}, {"id": "q078", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented grassroots programs, school initiatives, or community outreach projects have been run by Ghana's cricket body?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Ahmadiyya in Ghana > Abstract) The Ahmadiyya Muslim community is the second largest group of Islam in Ghana after Sunni Islam. The early rise of the community in Ghana can be traced through a sequence of events beginning roughly at the same time as the birth of the Ahmadiyya movement in 1889 in British India. It was during the early period of the Second Caliphate that the first missionary, Abdul Rahim Nayyar was sent to what was then the Crown colony of Gold Coast in 1921 upon invitation from Sunni Muslims in Saltpond. Having established the movement in the country, Nayyar left and was replaced by the first permanent missionary, Al Hajj Fadl-ul-Rahman Hakim in 1922.  The Pew Research Center estimates the total number of Ahmadis in Ghana at 635,000 people, representing roughly 16.5% of Ghana's Muslim population, and roughly 2.5% of Ghana's population as a whole. The estimate is disputed due to the alleged undercounting of Muslims in Ghana (including Ahmadis), the Ahmadiyya Muslim Community estimates a population of two million Ghanaian Ahmadis.\n\n(Buz Stop Boys > Impact and collaborations) Buz Stop Boys has contributed to raising awareness of sanitation challenges in Ghana and encouraging community participation in environmental cleanliness. Their activities have been noted for promoting behavioural change and civic engagement among residents. The team continues to improve environmental sanitation in urban communities across Ghana through regular clean-up exercises and volunteer-driven initiatives. The group conducts clean-up activities multiple times each week, focusing on areas affected by waste accumulation and poor drainage.  The organisation has collaborated with several corporate and community partners to expand its activities. In 2024, it worked with Zoomlion Ghana Limited on sanitation efforts aimed at improving cleanliness in parts of Accra. It has also partnered with tourism and environmental stakeholders, including the Ghana Tourism Authority, to undertake clean-up exercises at public recreational spaces. In addition, the group has received financial and logistical support from private individuals and organisations. In 2025, businessman Dr Kofi Amoah (Citizen Kofi) donated funds to support the group's sanitation activities. The initiative has also attracted international collaboration, including participation in beach clean-up campaigns with external organisations such as Black By God. The group's work has received recognition both locally and internationally. It has been acknowledged in media reports as a grassroots movement addressing sanitation challenges in Ghana, and was reported to be scheduled for international recognition at the 2025 Carnival of Cultures in Berlin.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica."}, {"id": "q079", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What major legal rulings or Supreme Court decisions have affected devolution and provincial council powers in Sri Lanka?", "ev": "(Northern Province, Sri Lanka > History) Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.  The Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.  On 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.  The proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.  The merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.  Much of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.  While the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the c\n\n(Peace talks between the LTTE and the Sri Lankan Government during the Sri Lankan Civil War > Indian-led Peace Initiative (1987–1990)) The Government of India took direct involvement in ending the Sri Lankan Civil War through mediation, peacekeeping, and political agreements from 1987 to 1990. India's hitherto indirect involvement changed in June 1987 with its Operation Poomalai in response to the Sri Lankan Government's Operation Liberation, which led to the signing of the Indo-Sri Lanka Accord on 29 July 1987. Under the accord, the Sri Lankan Government agreed to a mechanism for the devolution of power to the provinces and confined its troops to barracks in the Northern and Eastern provinces. The Indian Government agreed to deploy peacekeepers to oversee the disarmament of the Tamil rebels.  The Indian Peace Keeping Force (IPKF) began arriving in Sri Lanka in July with the mandate to \"guarantee and enforce the cessation of hostilities\", while the Sri Lankan military withdrew to their bases or were redeployed to the south of the island to deal with the JVP insurrection. In keeping with the Indo-Sri Lanka Accord, the Sri Lankan Government had the Thirteenth Amendment to the Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987 passed in Parliament on 14 November 1987, establishing a new system of provincial government with the aim of devolution of power to the provinces.  Initially welcomed by the Tamils, the IPKF soon clashed with the LTTE after the group refused to disarm. From late 1987 onwards, heavy fighting ensued with India deploying over 70,000 troops at its peak. On 13 July 1989, Tamil Nationalist leaders A. Amirthalingam and V. Yogeswaran were assassinated in Colombo. Although casualties among the IPKF mounted, and calls for the withdrawal of the IPKF from both sides of the Sri Lankan conflict grew, Indian prime minister Rajiv Gandhi refused to remove the IPKF from Sri Lanka until his defeat in Indian parliamentary elections in December 1989. The new prime minister V. P. Singh ordered the withdrawal of the IPKF, and their last ship left Sri Lanka on 24 March 1990. In June 1990, the LTTE and Sri Lankan government resumed hostilities, marking the beginning of Eelam War II.\n\n(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Northern Province, Sri Lanka > Governance and politics > Sri Lankan Parliament) First elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament."}, {"id": "q080", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have any government, sporting bodies, or industry organizations issued guidelines or sanctions affecting the promotion's operations?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Pro Wrestling Zero1 > History > As Pro Wrestling Zero-One) The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.  In its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".  On November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.  Since April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.  On September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance."}, {"id": "q081", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When and how was cricket first introduced and played in the Gold Coast (modern Ghana) during the colonial era?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Ghana national cricket team > History > Colonial era) CricketArchive records a team representing the Gold Coast, a British colony, as having played its first match in May 1904, against Lagos Colony (in present-day Nigeria). Similar fixtures were played in the following two seasons, with the venue alternating between Lagos and Accra. A team representing the Southern Nigeria Protectorate toured in April 1907. Similar matches were played again in 1911, 1912, and 1913, with the host alternating each year. Although the sport had been introduced by British settlers, representative teams were multiracial from an early stage – the 1912 Gold Coast–Southern Nigeria fixture, the only pre-war match for which a scorecard is available, featured names like Otoo, Sagoe, Agbokpo, and Akufo (for Gold Coast), and Layode and Oseni (for Southern Nigeria). Gold Coast's Otoo took six wickets in Southern Nigeria's second innings, helping Gold Coast to an innings victory. However, European-only matches were introduced around the same time, beginning in 1906 and ending only in 1956, the year before Ghanaian independence. The Gold Coast's leading run-scorer in the inaugural European-only fixture was Gordon Guggisberg, who had earlier played a single first-class match (and was later Governor of the Gold Coast, from 1919 to 1927).  After a long gap, inter-colonial matches resumed in April 1926, when the Gold Coast played the Nigerian national team in Lagos. Gold Coast–Nigeria fixtures, both multiracial and European-only, were played almost annually from 1926 to 1939, and resumed again after World War II. In several years the European-only fixtures were played in provincial cities like Kumasi and Ibadan, although multiracial games were played only in the capitals. Gold Coast sides were occasionally bolstered by players of first-class standard – for instance, Cecil Pullan (Oxford University and Worcestershire) and Michael Green (Gloucestershire and Essex) appeared together in a 1937 match, with Pullan appearing again after the war. The national side played its first match as \"Ghana\" less than a month after Kwame Nkrumah 's independence declaration in March 1957, with annual Ghana–Nigeria matches occurring until 1964.\n\n(Yoruba people > Demographics > Ghana) There exists an old and thriving Yoruba community in Ghana tracing back to more than three centuries of establishment. The presence of Yoruba people in Ghana traces back to before the concept of the modern Ghanaian nation and are therefore Ghanaian citizens by law. The Yoruba communities became established through various waves and layers for centuries before the colonial era. The earliest wave were long distance merchants, artisans, labourers and explorers who settled in both southern and northern Ghanaian locales such as Salaga, Sekondi-Takoradi, Kumasi, Accra (Jamestown, Ngleshie Alata, Tudu), Yendi, Tamale, Kintampo, Nandom. In Ngleshie Alata (A corruption of English ' Alata ', the Fante and Ga word for Yoruba people based on the region where the majority came from) and the area around the James Fort, the Yoruba presence dates back to 1673 when they were employed to build the fort and settled in large numbers on the eastern coastal region. It is on record that the first ' Alata Akutso Mantse ' or Alata division head, a Yoruba speaker named Ojo employed by the Royal African Company ascended an Accra royal stool becoming head of the Alata quarter of James Town in 1748, a position his descendants continue to hold to this very day.  In the popular 18th century Gonja Salaga Slave Market, the Yoruba residents of the town would not allow their fellow countrymen captured and brought to the markets to be sold to the Ashantis who would march them to the coast. Rather, they would barter for the release of the Yoruba captives who would in turn work for their benefactors as tradesmen until they earned their release. This earliest wave was followed by an intermediate wave of slave returnees who were predominantly of Yoruba descent like the Taboms/Agudas who settled along the Ghanaian coast. Then came the third wave who came during the Gold Coast colonial period. By this period, they had firmly entrenched themselves in the country's commerce and distribution systems and constituted a substantial percentage of merchants and traders in the country's large markets as proprietors of wholesale enterprises. They were the largest group of immigrants established in the pre-independence Gold Coast. In 1950 they constituted 15% of traders in Accra, 23% in Kumasi, and over a third in Tamale. They were usually referred to in southern Ghana as Yoruba, Lagosian, Alata, or Anago. It was the early stream of this wave in the 1830s that established places like Accra New Town which was previously known as Lagos town and before then as Araromi.  There is no codification for the Yoruba ethnicity in the most recent Ghanaian censuses but in previous ones, they were considered an indigenous Ghanaian group with origins outside modern Ghana. In the 1960 Ghanaian population census, there were 109,090 Yorubas. Of this figure; 100,560 were Yoruba ' proper ' while 8,530 were Atakpame (Ana). This represented 1.6% of the Ghanaian population.\n\n(Ghana Medical Association > History) The earliest medical organisation of medical staff was during the Gold Coast era when the Gold Coast Medical Practitioners Union was formed in 1933. This was founded by three doctors, Frederick Victor Nanka-Bruce who was the president and spokesman, C.E. Reindorf and W.A.C. Nanka-Bruce. J.E. Hutton Mills was the secretary. Following the establishment of an African government under colonial rule in 1951, a Ghana branch of the British Medical Association was formed in January 1953. This also had Nanka-Bruce as its first president. Both associations were merged to form the Ghana Medical Association on 4 January 1958. It was inaugurated by Kwame Nkrumah at the Arden Hall of the Ambassador Hotel in Accra. Charles Easmon was elected as the first president of the GMA.\n\n(History of Ghana > British Gold Coast > British rule of the Gold Coast: the colonial era > Economic and social development) The years of British administration of the Gold Coast during the 20th century were an era of significant progress in social, economic, and educational development. Communications and railroads were greatly improved. Poverty fell significantly and Ghanaian peasantry flourished. New crops were introduced. A leading crop that was the result of an introduced crop was coffee. However, most spectacular among these introduced crops was the cocoa tree which had been indigenous to the New World and had been introduced in Africa by the Spanish and Portuguese. Cocoa had been introduced to the Gold Coast in 1879 by Tetteh Quashie. Cocoa tree raising and farming became widely accepted in the eastern part of the Gold Coast. In 1891, the Gold Coast exported 80 lbs of cocoa worth no more than 4 pounds sterling. By the 1920s cocoa exports had passed 200,000 tons and had reached a value of 4.7 million pounds sterling. Cocoa production became a major part of the economy of the Gold coast and later a major part of Ghana's economy.  The colony's earnings increased further from the export of timber and gold. Revenue from export of the colony's natural resources financed internal improvements in infrastructure and social services. The foundation of an educational system more advanced than any other else in West Africa also resulted from mineral export revenue. It was through British-style education that a new Ghanaian elite was created. From beginnings in missionary schools, the early part of the 20th century saw the opening of secondary schools and the country's first institute of higher learning.  Many of the economic and social improvements in the Gold Coast in the early part of the 20th century have been attributed to the Canadian-born Gordon Guggisberg, governor from 1919 to 1927. Within the first six weeks of his governorship, he presented a ten-year development programme to the Legislative Council. He suggested first the improvement of transportation. Then, in order of priority, his prescribed improvements included water supply, drainage, hydroelectric projects, public buildings, town improvements, schools, hospitals, prisons, communication lines, and other services. Guggisberg also set a goal of filling half of the colony's technical positions with Africans as soon as they could be trained. His programme has been described as the most ambitious ever proposed in West Africa up to that time.  The colony assisted Britain in both World War I and World War II. In the ensuing years, however, postwar inflation and instability severely hampered readjustment for returning veterans, who were in the forefront of growing discontent and unrest. Their war service and veterans' associations had broadened their horizons, making it difficult for them to return to the humble and circumscribed positions set aside for Africans by the colonial authorities."}, {"id": "q082", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which major lawsuits or Supreme Court cases challenged the regulator's broadcasting rules and what were their outcomes?", "ev": "(WorldNetDaily > Content > Barack Obama citizenship conspiracy theories) WND has published hundreds of articles promoting \"birther\" conspiracy theories about President Barack Obama's U.S. citizenship, for which it has gained notoriety. It has falsely claimed that Obama is not a natural-born U.S. citizen and thus is not eligible to serve as president. After the 2008 presidential campaign, WND began an online petition to have Obama's Hawaiian birth certificate released to the public and Farah offered a $15,000 award for its release. The website also unsuccessfully urged Supreme Court justices to hear several lawsuits aiming to release Obama's birth certificate. The White House released copies of the president's original long-form birth certificate on April 27, 2011. After the long-form birth certificate was released, Farah refused to pay the promised award and WND continued to promote its conspiracy theory, publishing an article questioning the certificate's authenticity.\n\n(Elena Kagan Supreme Court nomination > Abstract) On May 10, 2010, President Barack Obama announced his selection of Elena Kagan for Associate Justice of the Supreme Court of the United States, to replace retiring Justice John Paul Stevens. Kagan's nomination was confirmed by a 63–37 vote of the United States Senate on August 5, 2010. When nominated, Kagan was Solicitor General of the United States, a position to which Obama had appointed her in March 2009. Kagan was the first Supreme Court nominee since Sandra Day O'Connor in 1981 to not be a sitting circuit court judge and the most recent such nominee as of 2026. She was the first Supreme Court nominee since William Rehnquist and Lewis F. Powell Jr. in 1971 to not be a sitting judge on any court.\n\n(Court-martial of Terry Lakin > Refusal to deploy > Analysis) Salon contributor Alex Koppelman noted that LTC Lakin was not the first US military member to \"become a birther cause celebre\", indicating the cases of Major Stefan F. Cook (Cook v. Good) and Captain Connie Rhodes (Rhodes v. MacDonald). Koppelman explained that neither of these lawsuits succeeded in a ruling on Obama's eligibility to be president. In contrast, since a court case (in this case, a court-martial) was the likely conclusion to Lakin's actions, his attorneys hoped that he could seek President Obama's original birth certificate for use in his defense.  Chris Lawrence, CNN 's Pentagon correspondent, noted in August 2010 that an Opinion Research Corporation poll showed that 27% of \"Americans think President Obama probably or definitely was not born in the United States.\" Lawrence reported that some of the remaining 73% argued that legal cases like Lakin's are fundraising opportunities for \"certain political causes.\"\n\n(Amit Mehta > Abstract) Amit Priyavadan Mehta (born 1971) is an American lawyer and jurist who serves as a United States district judge of the U.S. District Court for the District of Columbia. He was appointed in 2014 by President Barack Obama. In 2021, Mehta became a judge on the United States Foreign Intelligence Surveillance Court.  Mehta presided over cases related to attack on the United States Capitol on January 6, 2021, and the Google antitrust case. In 2022, he rejected efforts by Donald Trump to dismiss lawsuits accusing the former President of legal responsibility in the attacks.\n\n(Newton N. Minow > Contemporary politics) Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.  Minow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.  According to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.  Minow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois."}, {"id": "q083", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the full title and publication date of Daisuke Igarashi's ocean-themed manga?", "ev": "(Children of the Sea (manga) > Media > Manga) Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.  The manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013.\n\n(Sunny (manga) > Abstract) Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.  Sunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\n(The Sword of Paros > Publication > Manga) Written by Kaoru Kurimoto and illustrated by Yumiko Igarashi, The Sword of Paros was serialized in Kadokawa Shoten 's Monthly Asuka manga magazine from March 1986 to February 1987. The series was collected in three tankōbon volumes.\n\n(Children of the Sea (manga) > Development) The concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\n(Sunny (manga) > Media > Manga) Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.  The manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016."}, {"id": "q084", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What financial challenges, funding shortfalls, or sponsor withdrawals have affected Ghana's cricket programs and operations?", "ev": "(Ghana national cricket team > History > West African era) A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(Vodafone > Operations > Africa > Ghana) On 3 July 2008, Vodafone agreed to acquire a 70% stake in Ghana Telecom for $900 million. The acquisition was consummated on 17 August 2008. The same group-led consortium won the second fixed-line licence in Qatar on 15 September 2008.  On 15 April 2009, Ghana Telecom, along with its mobile subsidiary OneTouch, was rebranded as Vodafone Ghana.  In February 2023, Vodafone Group has concluded the sale of its 70% stake in Vodafone Ghana to Telecel Group in a bid to streamline its African portfolio, thus exiting the Ghanaian market.\n\n(Alhassan Suhuyini > Abstract) Alhassan Sayibu Suhuyini (born 12 September 1979) is a Ghanaian broadcast journalist and politician. He belongs to the National Democratic Congress. He is currently a member of the eighth Parliament of the Fourth Republic of Ghana representing Tamale North.  He is a host of two of the station's flagship programs as Ghanaian broadcast journalist who works at Radio Gold in Accra.  He holds a teaching qualification. From Ghana Institute of Management and public Administration He pursued his B.sc. public administration and M.sc. Development Management. He's a Muslim by religion. He also a committee member of land and natural resources. He was member of parliament of the 7th and 8th Republic of Ghana."}, {"id": "q085", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What disputes or debates have arisen regarding selection fairness, regional representation, or Wales’ specific representation within the England and Wales team?", "ev": "(England women's cricket team > Status of Wales) The England women's cricket team, as a part of the England and Wales Cricket Board, represents both England and Wales. Welsh cricketers such as Lynne Thomas have therefore played for England.  Cricket Wales has continually supported the ECB, and the Wales women's national cricket team effectively functions as a domestic team within the women's county cricket structure, competing in the Women's County Championship until 2019 and continuing to compete in the Women's Twenty20 Cup. Wales is included as part of the country's new regional domestic structure and is part of the Western Storm regional hub, as well as being represented by Welsh Fire in The Hundred.  The absence of a Welsh cricket team that compete internationally in men's cricket has led to a number of comments from politicians and debates within the Senedd. It is unclear, however, whether these calls extend to the women's game. Wales did compete internationally in the Women's European Championship in 2005, as the tournament was held in Wales, playing against England and three other European women's cricket sides.\n\n(Meg Lanning > International cricket > 2014–2016: Assumption of captaincy, second World Twenty20 title) On 19 January 2014, Lanning became Australia's youngest-ever captain, standing in for Jodie Fields mid-way through the 2013–14 Women's Ashes. She scored 78 not out from 54 balls in a T20I at Bellerive Oval, although England would go on to win the match by nine wickets and consequently clinch the series.  In February 2014, Lanning was appointed as the full-time captain of Australia's T20 team. In a retrospective interview, she described the decision as \"a bit of a shock because I hadn't really thought too much about leadership or anything like that\". At the 2014 World Twenty20, Lanning was the tournament's top run-scorer, compiling 257 across six innings. During a group stage match against Ireland, she made 126 runs from 65 balls to set a new record for highest individual total in women's T20Is. In the final against England, she scored 44 off 30 to help Australia chase down a target of 106 with seven wickets in hand and 29 balls remaining.  Lanning was confirmed as the national team's captain for all three forms of the game in June 2014. The Sydney Morning Herald reported the appointment as a \"messy captaincy handover\" from incumbent Fields, who subsequently retired from international cricket despite urges from Australian selectors to reconsider.  In the second ODI of the 2015 Women's Ashes, Lanning scored 104 from 98 deliveries and formed a partnership of 132 with Ellyse Perry in a 63-run win. She followed up with another strong performance in the following match, scoring 85 off 89 to help defeat England by 89 runs. Australia went on to secure a series victory in the T20I leg of the tour, marking Lanning's first Ashes triumph as captain.  On 21 March 2016, Lanning was dismissed without scoring for the first time in a Twenty20 International, setting a record for most T20I innings (61) before registering a duck.\n\n(Sri Lankan cricket team in England in 2026 > Abstract) The Sri Lanka cricket team is scheduled to tour England in September 2026 to play the England cricket team. The tour will consist of three One Day International (ODI) and three Twenty20 International (T20I) matches. In July 2025, the England and Wales Cricket Board (ECB) confirmed the fixtures for the tour, as a part of the 2026 home international season.\n\n(List of sports governing bodies in Wales > Volleyball) Sport Wales recognise the Welsh Volleyball Association as the governing body for volleyball in Wales. However, \"With there being no current active Welsh Volleyball Association, all volleyball within Welsh boundaries comes under Volleyball England's jurisdiction.\" Volleyball England aim to have Welsh representation at the 2009 UK School Games, due to be held in Wales the first time – in Cardiff, Newport and Swansea.\n\n(New Zealand women's cricket team in England in 2026 > Abstract) The New Zealand women's cricket team is scheduled to tour England in May 2026 to play the England women's cricket team. The tour will consist of three One Day International (ODI) and three Twenty20 International (T20I) matches. The ODI series will form part of the 2025–2029 ICC Women's Championship. The T20I series will serve as preparation for both teams ahead of the 2026 Women's T20 World Cup. In July 2025, the England and Wales Cricket Board (ECB) confirmed the fixtures for the tour, as a part of the 2026 home international season."}];
const KEY = "d16_answerable_v1";
let ans = {}; try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let i = 0;

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} };

function render() {
  const it = ITEMS[i];
  document.getElementById("pos").textContent = (i + 1) + " / " + ITEMS.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("claim").textContent = it.claim;
  // 문장이 단 인용 표시를 근거에서 강조한다
  const marks = [...new Set((it.claim.match(/\[d[0-9a-z]+\]/g) || []))];
  let ev = esc(it.ev);
  for (const m of marks) ev = ev.split(esc(m)).join("<mark>" + esc(m) + "</mark>");
  document.getElementById("ev").innerHTML = ev;
  document.getElementById("ev").scrollTop = 0;
  const n = Object.keys(ans).length;
  document.getElementById("cnt").innerHTML = n === ITEMS.length
    ? '<span class="done">86건 완료 — 내려받으세요</span>' : ("채움 " + n + " / " + ITEMS.length);
  document.getElementById("pb").style.width = (100 * n / ITEMS.length) + "%";
  document.querySelectorAll("[data-v]").forEach(b =>
    b.classList.toggle("on", ans[it.id] === b.dataset.v));
}
function pick(v) {
  ans[ITEMS[i].id] = v; save();
  if (i < ITEMS.length - 1) i++;           // 고르면 자동으로 다음
  render();
}
document.querySelectorAll("[data-v]").forEach(b =>
  b.onclick = () => pick(b.dataset.v));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < ITEMS.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  const k = ITEMS.findIndex(x => !ans[x.id]);
  if (k < 0) { alert("전부 채웠습니다. CSV 를 내려받으세요."); return; }
  i = k; render();
};
document.onkeydown = e => {
  if (e.key === "1") pick("답있음");
  else if (e.key === "2") pick("답없음");
  else if (e.key === "3") pick("일부");
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["item_id", "human_label"].join(",")]
    .concat(ITEMS.map(x => [q(x.id), q(ans[x.id] || "")].join(",")));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_d16_filled.csv";
  a.click();
};
render();
