e was much higher than previous elections.  This remains the second-best performance by any party in a presidential election in Hawaii after Lyndon Johnson's landslide election in 1964.\n\n(2012 United States presidential election in New York > Abstract) The 2012 United States presidential election in New York took place on November 6, 2012, as part of the 2012 United States presidential election in which all 50 states plus the District of Columbia participated. Voters chose 29 electors to represent them in the Electoral College via a popular vote pitting incumbent Democratic President Barack Obama and his running mate, Vice President Joe Biden, against Republican challenger and former Massachusetts Governor Mitt Romney and his running mate, Congressman Paul Ryan.  Barack Obama carried the state of New York by a landslide margin, winning 63.35% of the vote to Mitt Romney's 35.17%. As in previous elections, the Democratic ticket easily won, for the most part due to racking up very large margins in New York City (which itself comprised over 40% of the state's population) and its metropolitan area. The city alone garnered Obama 1,995,241 votes (81.19% of its vote), and he carried all five boroughs, after losing Staten Island (Richmond County) in 2008. Putnam County, which McCain won in 2008, was the only county in the NYC metropolitan area that Obama lost to Romney. The rest of his votes mostly came from Albany, Buffalo, Ithaca, Rochester, Syracuse, and their respective metropolitan areas, giving him a solid 28.18% lead over Romney. Obama even won in many rural counties. The Republicans won only in some rural parts of upstate and western New York.  New York was 1 of only 6 states to swing in President Obama's favor from 2008 to 2012, giving him the largest percentage of the vote for any presidential candidate in the state since 1964 and the second largest Democratic vote share in the state in history (as well as third most in the state's entire history, behind Warren Harding in 1920 as well). Similar to New Jersey, some news outlets, such as The New York Times, have proposed that Obama's improved performance in these states – as opposed to worsened performances in areas like the Rust Belt – was due to his handling of Hurricane Sandy, which made landfall on October 29. Mayor of New York City Michael Bloomberg, a Republican-turned-Independent, endorsed Obama due to the federal government's handling of the hurricane.  As of the 2024 presidential election, this is the last time the Democratic nominee won the following counties: Cayuga, Cortland, Franklin, Madison, Niagara, Orange, Oswego, Otsego, Richmond (Staten Island), Seneca, St. Lawrence, Suffolk, Sullivan, Warren, and Washington. This is also the last presidential election in New York in which the Democratic nominee won more counties than the Republican nominee. In subsequent elections, despite Republicans winning more counties, they have been unable to break through the huge Democratic advantage in New York City and its suburbs, ensuring that the state has remained solidly blue.\n\n(Newspaper endorsements for John McCain in the 2008 United States presidential election > Abstract) During the 2008 United States presidential election, newspapers, magazines, and other publications made general election endorsements. As of November 4, 2008, Barack Obama had received more than twice as many publication endorsements as John McCain; in terms of circulation, the ratio was more than 3 to 1, according to the detailed tables below. In summary:  According to Editor & Publisher magazine, as of November 3, 2008, there was 273 newspapers endorsing Barack Obama compared to 172 for John McCain. By comparison, the magazine reported that before election day in 2004, John Kerry received 213 endorsements compared to 205 for George W. Bush.  UWIRE, in its Presidential Scorecard, reported that Barack Obama led John McCain by 86 to 2 in college newspaper endorsements, as of November 4.  The Association of Alternative Newsmedia reported that Barack Obama led John McCain by 57 to 0 in endorsements among its 123 member newspapers as of October 31, 2008.  For a full list of newspapers that have endorsed Barack Obama, see Newspaper endorsements for Barack Obama in the 2008 United States presidential election.  For a summary of endorsements and a list of newspapers that have chosen not to endorse a candidate, see Newspaper endorsements in the 2008 United States presidential election."}, {"id": "b033", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were the scale and patterns of displacement, resettlement, or return among the city's residents after periods of conflict?", "ev": "(Timeline of the Kurdistan Workers' Party insurgency (1978–2015) > Abstract) This is the timeline of the Turkish-Kurdish conflict. The Kurdish insurgency is an armed conflict between the Republic of Turkey and various Kurdish insurgent groups, which have demanded separation from Turkey to create an independent Kurdistan, or to have autonomy and greater political and cultural rights for Kurds in Turkey. The main rebel group is the Kurdistan Workers' Party or PKK, which was founded on November 27, 1978, and started a full-scale insurgency on August 15, 1984, when it declared a Kurdish uprising. Apart from some extended ceasefires (most recently during the 2013-2015 Kurdish-Turkish peace process), the conflict has continued to the present day.\n\n(Political positions of Rand Paul > Foreign policy > Kurdistan) Paul opposed the Obama administration's \"One Iraq\" policy (which attempted to preserve Iraq as a union of Kurds, Sunnis and Shiites), and instead has advocated for Kurdish independence: \"I would draw new lines for Kurdistan and I would promise them a country.\" Paul also advocated for an immediate change in the way American weapons had been delivered to the Kurdistan Regional Government: \"The arms are going through Baghdad to get to the Kurds and they're being siphoned off and they're not getting what they need... I think any arms coming from us or coming from any European countries ought to go directly to the Kurds.\"\n\n(Religion in Kurdistan > Religiosity and Kurdish politics > Secularization of Kurdish independence movements) Many Kurds who left Islam often expressed deep disillusionment with the broader Muslim world, claiming that the Muslim world was hypocritical and held double standards for condemning the Kurdish independence movement yet staying silent during periods of mass violence against Kurds, and ignoring the reason Kurds launched separatist revolts in the first place. The secularism of Kurdish nationalism was largely a reaction to the usage of Islam by several Arab, Iranian, and Turkish governments to suppress Kurdish identity.  The PKK stated that the Turkish government weaponizing Islam against Kurdish identity had secularized Kurdistan much more effectively and quickly than decades of socialist propaganda. During the 21st century, Kurds who left Islam because of the actions of Muslims had significantly outnumbered the Kurds who left Islam due to theological disagreements. In the 20th and 21st centuries, several Kurdish secular intellectuals, while explicitly stating their opposition to the suffering of their people, had acknowledged that various state governments weaponizing Islam against Kurds had secularized Kurdistan far beyond the dreams of secular Kurds.\n\n(Kurdistan Region > History > Early struggle for independence (1923–1975)) Before Iraq became an independent state in 1923, the Iraqi Kurds had already begun their independence struggle from the British Mandatory Iraq with the Mahmud Barzanji revolts, which were subsequently crushed by the United Kingdom after a bombing campaign against Kurdish civilians by the Royal Air Force. Nonetheless, the Kurdish struggle persisted and the Barzani tribe had by the early 1920s gained momentum for the Kurdish nationalist cause and would become pivotal in the Kurdish-Iraqi wars throughout the 20th century. In 1943, the Barzani chief Mustafa Barzani began raiding Iraqi police stations in Kurdistan, which led the Baghdad government to deploy 30,000 troops to the region. The Iraqi Kurdish leadership fled to Iran in 1945. There, Mustafa Barzani founded the Kurdistan Democratic Party, and Iran and the Soviet Union began assisting the Kurdish rebels with arms. Israel began assisting the Kurdish rebels in the early 1960s.  From 1961 to 1970, the Kurds fought the Iraqi government in the First Iraqi–Kurdish War, which resulted in the Iraqi–Kurdish Autonomy Agreement. But simultaneously with its promise of Kurdish autonomy, the Iraqi government began ethnic cleansing Kurdish-populated areas, to reduce the size of the autonomous entity which a census would determine. This mistrust provoked the Second Iraqi–Kurdish War between 1974 and 1975, which resulted in a serious defeat for the Iraqi Kurds (see Algiers Accord) and forced all of the rebels to flee once more to Iran.\n\n(Religion in Kurdistan > Religiosity and Kurdish politics > In Iran) The government of Pahlavi Iran was largely indifferent to Islam, but often hostile towards it. The Pahlavi government explicitly stated that Iranian identity was superior to Islam. However, most Kurds in Iran were Sunni Muslims, which was seen as much more foreign than Shia Islam. Kurds were ethnically and religiously marginalized. After the 1979 revolution, Kurds were subjected to systemic discrimination by the state for being mostly Sunni Muslims. Furthermore, Iran attempted to distance Shia Kurds from Sunni Kurds, claiming that Shia Kurds were part of the religious majority of Iran and thus did not need special rights. During the 1980s and 1990s, more Iranian Kurds shifted to secularism. Many Iranian Kurdish opposition groups in exile criticized clericalism, Islamism, and what they called “Shia colonialism” in Kurdistan. Most Kurdish separatist groups in Iran defined martyrdom in nationalistic terms rather than religious. The secular political groups gained support from Iranian Kurds who rejected both the Shia Islam promoted by the Iranian government and the traditional Sunni Islam in Kurdish society."}, {"id": "b034", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the core gameplay mechanics and systems used in Spirit Hunter: Death Mark to generate tension and fear?", "ev": "(Sonic the Hedgehog (1991 video game) > Other versions and rereleases > Compilation releases) With its sequels for the Genesis, Sonic the Hedgehog has been ported for a wide range of home and handheld consoles and personal computers through compilations. The first collection it appeared in was Sonic Compilation (1995) for the Genesis. It has since appeared in Sonic Jam (1997) for the Saturn, Sonic Mega Collection (2002) for the GameCube, Sonic Mega Collection Plus (2004) for the PlayStation 2 and Xbox, Sega Genesis Collection for the PlayStation 2 and PSP, Sonic's Ultimate Genesis Collection (2009) for the Xbox 360 and PlayStation 3, Sonic Classic Collection (2010) for the Nintendo DS, Oculus Arcade for the Oculus Rift, and Sega Genesis Classics (2018) for Windows, PlayStation 4, Xbox One and Nintendo Switch. The 2013 remaster was included in the 2022 compilation Sonic Origins. This remaster saw Amy Rose becoming a playable character in an upgraded version of Origins.\n\n(Rain World > Release) Videocult announced the last phases of development in early 2016. Rain World ' s animation was popularized on social media pre-release and praised by IGN for its \"uncannily fluid character animations\". Primate partially attributed this virality to GIFs, noting a Twitter post retweeted over 15,000 times. A final trailer was posted on March 8, 2017, revealing its release date; Adult Swim Games published Rain World on March 28 for PlayStation 4 and Windows.  In April 2017, the game received an update to marginally alleviate its difficulty. A major content update was planned for release later that year, which would add the local multiplayer arena mode, featuring over 50 rooms, and the Monk and Hunter. The update was released in beta in November for Windows and published officially on December 11, 2017; it was also ported to PlayStation 4 on December 21, 2018. After gauging player interest in January 2018, Videocult ported Rain World to the Nintendo Switch on December 13 in the United States and December 27 in Europe. Limited Run Games released a physical edition for PlayStation 4 later that month. In August 2025, the game was released to the Xbox Game Pass. In January 2022, due to conflicts with Adult Swim Games, Videocult announced that Rain World would be published by Akupara Games from then on after a prolonged legal dispute.  The first DLC pack, titled Rain World: Downpour, added five playable slugcats with individual storylines, over 1000 rooms across ten regions, and three game modes. It is an expansion of the \"More Slugcats\" mod and was developed by nearly 40 community modders over the course of five years. It was released for Windows on January 19, 2023, and for PlayStation 5, Xbox One, and Xbox Series X and Series S on July 11, 2023. Downpour ' s development started before the Monk and Hunter update was released. A major theme of the DLC was the passage of time and how the hostile world transforms as catastrophic events occur, placing the five slugcats' environments across different periods of time. Lead programmer Andrew Marrero intended for the Challenge mode to teach the player the game's mechanics. By offering structured tasks, the mode provides a more controlled environment for practice compared to the \"spontaneous challenges\" of the main gameplay. Lee Moriya, the creator of the Expedition game mode, said that the given quests encouraged the player to do things they would not have done normally. Marrero created Safari mode to allow the player to observe the simulated ecosystem without the stress of surviving or being pursued.  The second DLC, titled Rain World: The Watcher, added new regions, creatures, and a playable slugcat named the Watcher, also called the Nightcat. The DLC was developed by Videocult and modders that worked on Downpour; its marketing adopted alternate reality game puzzle elements for fans to decipher. The DLC was released for Windows on March 28, 2025, with content adapted from community mods. A content update was released on September 25, alongside ports for the Nintendo Switch, PlayStation 4, PlayStation 5, Xbox One, and Xbox Series X/S.\n\n(SteamWorld Dig 2 > Abstract) SteamWorld Dig 2 is an action-adventure platform video game developed and published by Image & Form. It is the fourth installment in the SteamWorld series of games and the direct sequel to 2013's SteamWorld Dig. It was first released in September 2017 for Nintendo Switch, Linux, macOS, Windows, PlayStation 4, and PlayStation Vita. It was later released for Nintendo 3DS in February 2018, for Xbox One in November 2018, for Stadia in March 2020, and for Amazon Luna in October 2020. Publisher Rising Star Games released physical retail copies of the game for the Nintendo Switch and PlayStation 4 in 2018.  The game received positive reviews from critics, with praise for its improvements upon the original, as well as its world and gameplay.\n\n(Crypt of the NecroDancer > Sequels > Cadence of Hyrule) When developing the Switch version of Crypt of the Necrodancer, Brace Yourself Games approached Nintendo about providing downloadable based on Nintendo's properties, specifically The Legend of Zelda. Nintendo proved highly interested in a collaboration, leading to further discussions that resulted in an entirely new crossover game, Cadence of Hyrule - Crypt of the NecroDancer Featuring The Legend of Zelda, based on Crypt' s gameplay mechanics, but taking place within the universe of Zelda.  The crossover was released exclusively for the Nintendo Switch on June 13, 2019. In the main story mode, players play as either Link or Zelda, with Cadence becoming playable later in the game.\n\n(Doctor Who: The Eternity Clock > Abstract) Doctor Who: The Eternity Clock is a 2012 action-adventure video game developed by Supermassive Games and published by BBC Worldwide for the PlayStation 3. It was later ported to the PlayStation Vita and Microsoft Windows. Based on the BBC television series Doctor Who, it was intended to be the first of a series, but it was announced in 2013 that the sequels have been put on hold."}, {"id": "b035", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Were there documented instances of typecasting, limited roles, or gendered role constraints affecting her career?", "ev": "(Anjali Devi > Career > As actress) She was a theatre artiste before venturing into movies, her debut film role was as Lohitasva in \" Raja Harishchandra\" in 1936. Her first film as a heroine was Kashtajeevi by L. V. Prasad in 1940, but that film was abandoned after three reels shooting. Later, C.Pullayya discovered her and gave her the opportunity to star as Mohini in Gollabhama (1947). Based on her acting ability and looks, she became a star overnight in 1947. She eventually acted in more than 350 films, majority of them in Telugu and Tamil films and a few in Hindi, Kannada films as the heroine or in character roles.  She acted in Lava Kusa, a milestone film and the first color film in the Telugu film industry in 1963. She is well known for playing Sita in Lava Kusa and her performances in films like Suvarna Sundari and Anarkali were also appreciated. Brundavanam (1992), Anna Vadina (1993) and Police Alludu (1994) were the last few films of her career. In Balaiah's Police Alludu and Anna Vadina she appeared alongside Brahmanandam. She acted in various roles, such as a damsel, an angel, a dancer, a demon, a goddess, a traditional woman and later in mother roles.\n\n(Vanisri > Abstract) Vanisri (born Rathna Kumari) is an Indian actress known for her works predominantly in Telugu, Tamil, and Kannada films. In a film career spanning 40 years, she has received three Filmfare Awards South, the Nandi Awards and the Tamil Nadu State Film Award.\n\n(Lakshmi (actress) > Early life) Lakshmi was born and raised in Chennai, Tamil Nadu. Her mother Kumari Rukmini was a Tamil actress. Her father, Yaragudipati Varada Rao, was a Telugu producer, director, thespian, screenwriter, editor and actor known for his works predominantly in Telugu, Kannada, Malayalam and Tamil Cinema.\n\n(Meghana Lokesh > Early life and career) Meghana Lokesh was born in Mysore, Karnataka. Her father is an engineer and her mother is a Kannada lecturer. She has a brother who is also an engineer. Meghana has been associated with theatre from very young age. She started her theatre at the age of 8 and performed nearly 270 shows till her degree and Mandya Ramesh was her theatre guru. She started her Television career with supporting role in Kannada television soap opera Devi, which aired on Zee Kannada. Meghana's first lead role was in Kannada Television Series Pavitra Bandhana, where she played the role of Pavitra. Following this, She also worked in other Kannada TV Series named Purushottama, which aired on Zee Kannada.  Her big breakthrough was with the Telugu hit series Sasirekha Parinayam which screened on Star Maa from 2013 to 2016. She also acted in the feature film Idhi Ma Prema Katha opposite Anchor Ravi, which received mixed reviews.  In 2017, she acted in two message-oriented Telugu short films named Emotion and Beautiful Life. Later that year, Meghana started a new Zee Telugu series Kalyana Vaibhogam in which she is portraying the dual role of Manga and Nithya. In 2018, She featured in a film called Ameerpet 2 America. Around the time, She was signed to play a lead role in her third Telugu Soap Opera titled, Raktha Sambandham.\n\n(Pooja Reddy Bora > Career) Pooja Reddy Bora is an Indian actress and model known for her work in Telugu and Kannada cinema. She began her acting career in 2018 with the Kannada film Vedanti, portraying Varsha. She expanded into Telugu cinema with notable roles in Arangetram (2023) and Tatva (2024). Her performance in Odela 2 (2025) further established her presence in the industry.  Beyond films, Pooja Reddy Bora is active in modeling, participating in various fashion events, and photoshoots. She maintains an active presence on Instagram, sharing updates about her work and personal life."}, {"id": "b036", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which regions or constituencies in Wales have consistently supported Welsh Labour across recent decades?", "ev": "(Senedd > Members, constituencies, and electoral system) Initially, the Senedd was elected under the Additional Member System, with forty MSs aelected from single-member constituencies on a plurality voting system (or first past the post) basis, the constituencies being equivalent to those used for the House of Commons and twenty MSs elected from region\n\n(Plaid Cymru > Abstract) Plaid Cymru (English: / p l aɪ d ˈ k ʌ m r i / plyde KUM -ree; Welsh:; lit. ' Party of Wales ', officially Plaid Cymru – the Party of Wales, and often referred to simply as Plaid) is a centre-left to left-wing Welsh nationalist political party in Wales, that supports Welsh independence from the United Kingdom. It campaigns on a platform of social democracy and civic nationalism. The party is a supporter of the European Union and is a member of the European Free Alliance (EFA). The party holds 4 of 32 Welsh seats in the UK House of Commons, 43 of 96 seats in the Senedd, and 200 of 1,234 principal local authority councillors. Plaid was formed in 1925 under the name Plaid Genedlaethol Cymru (' the national party of Wales ') and Gwynfor Evans won the first Westminster seat for the party at the 1966 Carmarthen by-election.  In 1999 (in the first devolved Welsh Assembly election), Plaid Cymru gained considerable ground in traditionally Labour heartlands. These breakthroughs were part of the intentional aim to win more seats in the Welsh valleys and North East Wales, which continues to be an ambition today. The party have mostly been in opposition in the Senedd. Although under the leadership of Ieuan Wyn Jones, the party was part of a coalition as a junior partner with Welsh Labour between 2007 and 2011. Wyn Jones became the deputy First Minister and Minister for the Economy and Transport, alongside other Plaid MSs who also joined the cabinet.  After losses in the 2011 Assembly elections and dropping down to being the third largest party, Wyn Jones stepped down. He was succeeded by Leanne Wood. In the 2016 Assembly elections Wood managed to win her constituency seat of Rhondda meaning the party gained one seat, and became the official opposition once again, although only for a brief period. In 2018 following internal pressure and a leadership contest, Adam Price defeated Wood and was elected the new leader. Following the 2021 Senedd election Plaid formed a co-operation agreement with the Welsh Labour government. In May 2023 Price resigned as leader following the publication of a report which detailed failings by the party to prevent sexual harassment and bullying. In June 2023 Rhun ap Iorwerth was elected unopposed as leader. The party won both its target seats in the 2024 general election, therefore becoming the second largest party representing Wales in the House of Commons.  Plaid Cymru won a plurality in the 2026 Senedd election with 43 out of 96 seats, and are expected to form the next Welsh government, with Rhun ap Iorwerth becoming the first Plaid Cymru First Minister.\n\n(2026 Senedd election > Abstract) An election for the Senedd (Welsh Parliament; Welsh: Senedd Cymru) was held on 7 May 2026, to elect all 96 members to the Senedd. It was the seventh devolved general election since the Senedd (formerly the National Assembly for Wales) was established in 1999. It was the first election following numerous reforms: an increase in the size of the Senedd from 60 members to 96, the adoption of party-list proportional representation, the reduction of the number of constituencies to sixteen, and the shortening of its term from five years to four. The election was held on the same day as local elections in England and elections to the Scottish Parliament.  Welsh Labour lost government and its status as the largest party for the first time since devolution began in 1999, ending a winning streak that had lasted since the 1922 United Kingdom general election and resulting in a historic realignment of Welsh politics. Plaid Cymru emerged as the largest party for the first time with 43 seats, while Reform UK secured second place with 34 seats. Labour was reduced to third place with a historic low of 9 seats. The Welsh Conservatives and the Wales Green Party won 7 and 2 seats respectively, with the Greens entering the Senedd for the first time. With her failure to secure a seat in the constituency of Ceredigion Penfro, First Minister Eluned Morgan became the first leader of a government in the UK to lose their seat while in office.  Turnout was 51.72%, the highest ever for a Welsh devolved election."}, {"id": "b037", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the city's geographical features, location coordinates, and strategic significance near the Iran–Iraq border?", "ev": "(Şırnak > Abstract) Şırnak (Kurdish: Şirnex) is a city in Şırnak District and the capital of Şırnak Province in Turkey. The city is located near the Ibrahim Khalil border crossing with Iraq, which is one of the main links from Turkey to the Kurdistan Region of Iraq. The city is mainly populated by Kurds of the Şirnexî tribe and had a population of 75,932 in 2023. It is considered a historical part of Turkish Kurdistan.\n\n(Foreign relations of Iraq > Separatism > Kurdish question) Iraq is, along with Turkey, Iran, and Syria, one of the main countries where Kurdish populations are concentrated. Their total number varies, according to sources, from 25 to 35 million, including 12 to 15 million in Turkey (20% of the population), 6 million in Iran (8% of the population), 4.7 million in Iraq (15 to 20% of the population), and 2 million in Syria (15%).  Persecuted under Saddam Hussein, the Kurds participated in the 1991 uprising after the Iraqi defeat in the Gulf War, and obtained de facto autonomy helped by a no-fly zone imposed from 1992 to 2003 by the United States and the United Kingdom, legalized by the 2005 Iraqi Constitution which established it as a federal region. On the international scene, the United Nations Security Council mandated a \"United Nations Assistance Mission for Iraq\" (UNAMI) to help the new Iraqi government to \"develop procedures for resolving internal border disputes\".  Nevertheless, despite this federal autonomy, no country in the region (with the exception of Israel) is clearly in favor of the independence of the Iraqi Kurdistan. Kurdish separatism is a particularly sensitive issue for Turkey, which has faced since the 1980s an insurrection by the Kurdistan Workers' Party (PKK) in the southeast of the country that has caused tens of thousands of deaths. Kurdish independence aspirations are to a lesser extent present in Iran, where deadly clashes regularly occur between the Revolutionary Guards and certain Iranian Kurdish groups, including the Kurdistan Democratic Party of Iran. Turkish and Iranian separatist groups also have bases and training camps in northern Iraq, provoking several bombings and armed incursions by these two countries (especially Turkey), condemned by Baghdad as violations of its sovereignty. An ambivalent behavior by the Iraqi government, which also feels threatened by the separatist ambitions of Iraqi Kurds.\n\n(Kurdistan Region > History > Early struggle for independence (1923–1975)) Before Iraq became an independent state in 1923, the Iraqi Kurds had already begun their independence struggle from the British Mandatory Iraq with the Mahmud Barzanji revolts, which were subsequently crushed by the United Kingdom after a bombing campaign against Kurdish civilians by the Royal Air Force. Nonetheless, the Kurdish struggle persisted and the Barzani tribe had by the early 1920s gained momentum for the Kurdish nationalist cause and would become pivotal in the Kurdish-Iraqi wars throughout the 20th century. In 1943, the Barzani chief Mustafa Barzani began raiding Iraqi police stations in Kurdistan, which led the Baghdad government to deploy 30,000 troops to the region. The Iraqi Kurdish leadership fled to Iran in 1945. There, Mustafa Barzani founded the Kurdistan Democratic Party, and Iran and the Soviet Union began assisting the Kurdish rebels with arms. Israel began assisting the Kurdish rebels in the early 1960s.  From 1961 to 1970, the Kurds fought the Iraqi government in the First Iraqi–Kurdish War, which resulted in the Iraqi–Kurdish Autonomy Agreement. But simultaneously with its promise of Kurdish autonomy, the Iraqi government began ethnic cleansing Kurdish-populated areas, to reduce the size of the autonomous entity which a census would determine. This mistrust provoked the Second Iraqi–Kurdish War between 1974 and 1975, which resulted in a serious defeat for the Iraqi Kurds (see Algiers Accord) and forced all of the rebels to flee once more to Iran.\n\n(Kurds in Syria > Abstract) The Kurdish population of Syria is the country's largest ethnic minority, usually estimated at 10% of the Syrian population and 9% of the Kurdish population.  The majority of Syrian Kurds are originally Turkish Kurds who have crossed the border during different events in the 20th century. There are three major centers for the Kurdish population in Syrian, the northern part of the Jazira, the central Euphrates Region around Kobanî and in the west the area around Afrin. All of these are on the Syria-Turkey border, and there are also substantial Kurdish communities in Aleppo and Damascus further south.  During Ba'athist rule, human rights organizations accused the Syrian government of routinely discriminating and harassing Syrian Kurds. Many Kurds seek political autonomy for what they regard as Western Kurdistan, similar to the Kurdistan Regional Government in Iraq, or to be part of an independent state of Kurdistan. In the context of the Syrian Civil War, Kurds established the Autonomous Administration of North and East Syria.\n\n(Kurdistan Region > History > Insurgency and first elections (1975–1992)) The Patriotic Union of Kurdistan (PUK) was founded in 1975 by Jalal Talabani while the Kurdistan Democratic Party (KDP) was slowly recovering from their defeat. The PUK was more popular among left-wing Sorani speakers, while the KDP was more popular among right-wing Kurmanji speakers. The PUK leadership adhered to the Qadiri sect while the KDP leadership adhered to the Naqshbandi. The Kurdish insurgency became entangled in the Iran–Iraq War from 1980 onwards. During the first years of the war in the early 1980s, the Iraqi government tried to accommodate the Kurds in order to focus on the war against Iran. In 1983, the Patriotic Union of Kurdistan agreed to cooperate with Baghdad, but the Kurdistan Democratic Party remained opposed. In 1983, Saddam Hussein signed an autonomy agreement with Jalal Talabani of the PUK, though Saddam later reneged on the agreement.  By 1985, the PUK and KDP had joined forces, and Iraqi Kurdistan saw widespread guerrilla warfare up to the end of the war. On 15 March 1988, PUK forces captured the town of Halabja near the Iranian border and inflicted heavy losses among Iraqi soldiers. The Iraqis retaliated the following day by chemically bombing the town, killing about 5,000 civilians. This led the Americans and the Europeans to implement the Iraqi no-fly zones in March 1991 to protect the Kurds, thereby facilitating Kurdish autonomy amid the vacuum and the first Kurdish elections were consequently held in May 1992, wherein the Kurdistan Democratic Party secured 45.3% of the vote and a majority of seats."}, {"id": "b038", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What prior public offices or professional roles did each 2024 Oregon attorney general candidate hold before running?", "ev": "(1958 Connecticut Attorney General election > Abstract) The 1958 Connecticut Attorney General election took place on November 4, 1958, to elect the Attorney General of Connecticut. Incumbent Republican Attorney General John J. Bracken did not seek re-election. Democratic nominee Albert L. Coles defeated Republican nominee Simon S. Cohen. As of 2026, this was the last time the Attorney General's office of Connecticut changed partisan control.\n\n(2024 Wisconsin elections > Local offices > Kenosha County > Kenosha County district attorney) A regularly scheduled district attorney election was held in Kenosha County, at the Fall general election, November 5, 2024. The incumbent, Mike Graveley, did not run for re-election. In the general election, Republican attorney Xavier Solis defeated deputy district attorney Carli McNeill, running as a Democrat.\n\n(2024 Wisconsin elections > Local offices > Milwaukee County > Milwaukee County district attorney) A regularly scheduled district attorney election was held in Milwaukee County, concurrent with the Fall general election, November 5, 2024. The 18-year incumbent, John T. Chisholm, did not run for re-election and retired at the end of this term. Only one candidate filed to appear on the ballot, Chisholm's deputy, Kent Lovern. Lovern was elected unopposed with 97% of the vote, with the other 3% going to various write-in candidates.\n\n(2024 North Carolina Attorney General election > Abstract) The 2024 North Carolina Attorney General election was held on November 5, 2024, to elect the next attorney general of North Carolina. Democratic congressman Jeff Jackson defeated Republican congressman Dan Bishop. Jackson succeeded Democratic incumbent Josh Stein, who did not seek re-election in order to successfully run for governor.\n\n(2024 Wisconsin elections > Local offices > Waukesha County > Waukesha County district attorney) There was a regularly scheduled district attorney election in Waukesha County, concurrent with the Fall general election, November 5, 2024. The incumbent, Susan Opper, did not run for re-election and retired at the end of this term. Deputy district attorney Lesli Boese defeated deputy district attorney Mike Thurston in the Republican primary and was unopposed in the general election."}, {"id": "b039", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Did participation in 1976 lead to measurable increases in athlete participation or grassroots programs for people with disabilities in Australia?", "ev": "(Australia at the 1988 Winter Paralympics > Athletes) Hans Hinterholzer and Jamie Milner were the two team coaches for the Australian Alpine skiing events at the Innsbruck Paralympics. Australia was fortunate effort to take 5 Paralympic athletes to represent Australia in the 1988 Games in Innsbruck. Each athlete who competed did not qualify for a medal at these games. Four out of five of the Australian athletes competed in the Men's Downhill, Men's Giant Slalom and Men's Slalom apart from David Munk who only participated in the Men's Giant Slalom and Men's Slalom. Each athlete had different classifications ranging from upper body disabilities to lower body disabilities. All classifications of every athlete competing in the Paralympic Games of any sort are done so by the International Paralympic Committee (IPC).  Michael Collins participated in the Men's Downhill LW6/8, Men's Giant Slalom LW6/8 and Men's Slalom. He was ranked 10 out of 23 athletes with a time of 1:18.86 in the Men's Downhill LW6/8. In the Men's Giant Slalom LW6/8 and the Men's Slalom Collins was unable to finish. Michael Collins was classed as an athlete who had upper extremity issues. This can range from a skier being classified in the LW6/8 category if they have paralysis, motor paresis affecting one arm or a single upper arm amputation.  Kyrra Grunnsund represented Australia in five Paralympics. He was the first Australian to compete at both the Summer and Winter Paralympics. He competed in both the Alpine and Cross-country skiing over the course of his career but in the 1988 Winter Paralympic Games he only competed in the Men's Downhill LW4, Men's Giant Slalom LW4 and Men's Slalom LW4. He ranked 13th out of 14 athletes in the Men's Downhill LW4 with a time of 1:19.78. In the Men's Giant Slalom LW4 and Men's Slalom LW4 he did not finish. Kyrra Grunnsund was classified as an athlete who had a disability in one lower extremity. He is a below-the-knee amputee and classed in the LW4 category for the Paralympics.  Evan Hodge competed in the 1988 men's Downhill LW2, Men's Giant Slalom LW2 and Men's Slalom. All three events he qualified and was ranked into the top 15 athletes. His best time was in the Men's Slalom LW2 with a time of 1:34.05 and was ranked 8th out of 33 competitors. Hodge was classified with having severe disability in a lower limb where an amputation or arthrodesis in the leg and hip. Specific skiing and training techniques have been developed for this LW2 skiers that address their disability type and equipment use. A factoring system is used in both para-alpine and para-Nordic to allow different classes to compete against each other when there are not many competitors in one class in a competition.  Michael Milton grew up in a skiing family. At the age of 9 years old, his left leg was amputated above the knee due to bone cancer. After having an amputation, he was more determined to be able to ski again. Milton debuted in the 1992 Tignes-Albertville Winter Paralympics and has an extensive career in both Summer and Winter Paralympic games. He did compete in the 1988 Innsbruck games but did not qualify for a medal in any of the events he competed in. His best ranked event in the 1988 Paralympics was in the Men's Giant Slalom LW2 where he was ranked 11th out of 33 competitors. Like teammate Hodge, Milton was classed in the LW2 category for the Winter Paralympic games.  David Munk is an Australian Paralympic Alpine sit skier. He debuted in the 1992 Winter Paralympics where he won a bronze medal in the Men's Super-G LW11. At the 1988 Winter Paralympics he was unfortunately disqualified from the Men's Giant Slalom LW10 but was able to rank 13th out of 29 competitors in the Men's Slalom LW10. He was classed in the LW10 category due to the little support he had when sitting up right. The International Paralympic Committee defined this para-alpine classification as; a disability in the lower limbs and no sitting balance. Athletes who were classed in this category were given physical equipment adapted to their specific needs.\n\n(Italy at the Paralympics > Abstract) Italy has sent delegations to the Summer Paralympics since the first games in 1960, and to the Winter Paralympics since 1980.  The Paralympic Games are a multi-sport event for athletes with physical and sensorial disabilities. This includes athletes with mobility disabilities, amputations, blindness, and cerebral palsy. The Paralympic Games are held every four years, following the Olympic Games, and are governed by the International Paralympic Committee (IPC)."}, {"id": "b040", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Terminal facilities at Kota Kinabalu International Airport: number of terminals, passenger processing capacity, gates, and major terminal upgrades.", "ev": "(Archdiocese of Kota Kinabalu > Abstract) The Archdiocese of Kota Kinabalu (Latin language: Archdioecesis Kotakinabaluensis; Malay: Keuskupan Agung Kota Kinabalu; Mandarin: 哥打京那巴鲁总教区) is a metropolitan archdiocese of the Latin Church of the Catholic Church in Sabah, Malaysia, on the island of Borneo. The archdiocese is the oldest ecclesiastical territory in Malaysia, with a long history slowly rising along with the Catholic population from a prefecture to an archdiocese. Its cathedral archepiscopal see is Sacred Heart Cathedral, Kota Kinabalu. The patron saint of the archdiocese is St. Joseph, Spouse of the Blessed Virgin Mary.\n\n(Miri > Transportation > Air) Miri Airport (IATA: MYY, ICAO: WBGR) is an important gateway to the northern region of Sarawak. It is located 11 km south of Miri city. It serves as a hub for domestic, international, and rural air services. Miri Airport is the tenth busiest airport in Malaysia and second busiest in Sarawak. It provided services to 2.2 million passengers in 2013. The airport has only one direct international flight to Singapore. It also receives flights from domestic destinations such as Kuala Lumpur, Johor Bahru, Kota Kinabalu, Labuan, Kuching and other major towns in Sarawak. Miri Airport also caters flights to the Sarawak interior such as Bario, Ba'kelalan, Marudi, Lawas, Limbang, and Mukah through MASwings using DHC-6 Twin Otter aircraft.\n\n(Juanda International Airport > Facilities and development > Terminals > Terminal 1) Terminal 1 was officially inaugurated on 7 November 2006 as part of a broader effort to accommodate the growing number of air passengers at Juanda International Airport. The development of the terminal infrastructure required an investment of approximately Rp 1.2 trillion. Funding for the project was sourced in part from a ¥23.2 billion loan provided by the Japan Bank for International Cooperation (JBIC), supplemented by Rp. 236.4 billion from the Indonesian state budget (APBN). The terminal spans 51,500 square meters and is built across three floors. It is equipped with 11 jet bridges to facilitate passenger boarding and disembarkation. The architectural design of Terminal 1 incorporates traditional elements from Sumbanese high-hat roofs, blended with Javanese - Malay architectural styles, reflecting local cultural influences. Terminal 1 exclusively serves all domestic flights operating at Juanda Airport. The terminal is divided into two sub-terminals: Terminal 1A, which handles departures, and Terminal 1B, which is designated for arrivals. To improve access and connectivity, Terminal 1 is directly linked to the Waru–Juanda Toll Road, which commenced operations in 2008 and provides a more efficient route between the airport and Surabaya as well as surrounding areas.  A major expansion of Terminal 1 was completed in October 2021, increasing its annual passenger capacity to 8.7 million. The terminal's total area was expanded to 91,700 square meters, with commercial space growing from 6,250 m 2 to 7,680 m 2. The waiting area was also enlarged to 19,940 m 2 from the previous 16,340 m 2 to enhance passenger comfort. Two children's play areas were added to better serve family travelers. The expansion included upgrades to passenger circulation infrastructure, with the number of escalators increased from six to eight, elevators from six to 16, and travelators from six to 19. The number of departure gates was also raised from 12 to 14, improving the terminal's overall operational efficiency.\n\n(Heydar Aliyev International Airport > Facilities > Terminals) The airport consists of two passenger terminals, with Terminal 1 being the newer one. Terminal 1 primarily serves international flights, handling the majority of the airport's passenger traffic. In contrast, Terminal 2 prioritizes domestic and short-range flights. Due to its role in accommodating international travelers, Terminal 1 is the busier of the two terminals, seeing a higher volume of passengers throughout the year."}, {"id": "b041", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented contributions has the player made to youth development, coaching clinics, or national training curricula?", "ev": "(Carolina Stanley > Abstract) Carolina Stanley (born November 22, 1975, in Buenos Aires) is an Argentine lawyer and politician.  During Mauricio Macri ’s presidency, she served as the Minister of Social Development of the Argentine Nation. Previously, she had been the Minister of Social Development of the City of Buenos Aires.  Since 2021, she has served as General Legal Advisor of the Public Guardian's Office of the Autonomous City of Buenos Aires.\n\n(Guadalupe Tagliaferri > Abstract) Guadalupe Tagliaferri (born 26 June 1974) is an Argentine politician, currently serving as a National Senator for the Autonomous City of Buenos Aires since 2019. She previously served as Minister of Human Development of Buenos Aires in the administration of Chief of Government Horacio Rodríguez Larreta from 2015 to 2019. She belongs to the Republican Proposal (PRO) party.\n\n(Manuel Fresco > Abstract) Manuel Antonio Justo Pastor Pascual Fresco (June 3, 1888 in Navarro, Buenos Aires – November 17, 1971 in Buenos Aires) was an Argentine doctor and Politician, national deputy and governor of Buenos Aires Province between 1936 and 1940 for the conservative National Democratic Party.\n\n(Beyza Karaçam > International career > National beach handball team) Karaçam played for the Turkey women's national beach handball team at the 2018 Summer Youth Olympics in Buenos Aires, Argentina, at the European Women's Beach Handball Championship in 2019 in, Stare Jabłonki, Poland, and 2021 in Varna, Bulgaria.\n\n(Argentinos Juniors > Stadium) The club currently plays in the Estadio Diego Armando Maradona which is also often referred to as La Paternal after the La Paternal district of Buenos Aires where the club is based. The stadium was named after Diego Maradona because he started his career in the Argentinos youth team. Between 1983 and 2003 Argentinos had a groundshare with Ferro Carril Oeste at Estadio Ricardo Etcheverry. The club has had a number of other homes in its history, all based in the city of Buenos Aires."}, {"id": "b042", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What localization and distribution technologies (e.g., translation workflows, international platform launches) supported wider release?", "ev": "(Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! > Abstract) Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! (Japanese: どうも、好きな人に惚れ薬を依頼された魔女です。, Hepburn: Dōmo, Suki na Hito ni Horegusuri o Iraisareta Majo desu) is a Japanese web novel series written by Eiko Mutsuhana. It was originally serialized on the online publication platform Shōsetsuka ni Narō from April 2019 to March 2020, before being published as a light novel by Futabasha under its M Novels f imprint in two volumes featuring illustrations by Vient between October 2019 and March 2020. A manga adaptation illustrated by Kamada began serialization began serialization on Kadokawa 's KadoComi service under its Flos Comic label in August 2020, and has been compiled into six volumes as of February 2026. An anime television series adaptation is set to premiere in 2026.\n\n(Magical Girl Ore > Abstract) Magical Girl Ore (魔法少女俺, Mahō Shōjo Ore; \"Magical Girl Me \") is a Japanese manga series written and illustrated by Icchokusen Mōkon. It began serialization in Fusion Product's Comic Be magazine in 2012, and was collected in two tankōbon volumes. The series was renewed for serialization in the same magazine in 2014. A 12-episode anime television series adaptation animated by Pierrot+ aired from April 2 to June 18, 2018.\n\n(My Love Story with Yamada-kun at Lv999 > Media > Manga) Written and illustrated by Mashiro, the series began serialization on Comic Smart's Ganma! manga website on March 7, 2019. Media Factory is publishing the series in print under their MF Comics imprint. As of November 2024, ten tankōbon volumes have been released.  Mangamo is publishing the series in English digitally simultaneously with its Japanese release, initially under the title Loving Yamada at Lv999!, before changing it to match the anime's title. In June 2023, Mangamo announced that they would release the series in print in collaboration with Penguin Random House 's Inklore imprint. The first volume was released on April 2, 2024.\n\n(Super Robot Wars > History > Localization) The Super Robot Wars series has historically faced considerable challenges regarding international localization as the inclusion of numerous anime and manga properties within a single installment necessitates complex rights and licensing negotiations across various copyright holders. Until the release of Super Robot Wars V, the only entries in the franchise officially localized for English-speaking audiences were those belonging to the Original Generation subseries; these releases, then-branded in English using the franchise's original Japanese name Super Robot Taisen, do not feature the licensed anime or manga properties found in the mainline Super Robot Wars installments.  In early 2016, Bandai Namco have announced that Super Robot Wars OG: Moon Dwellers and Super Robot Wars V will be given an English release for the Southeastern Asian version along with a Chinese translation. In December 2017, Bandai Namco announced that Super Robot Wars X would be released in English for Southeast Asia market in 2018. In November 2018, Bandai Namco announced that Super Robot Wars T will be released in English for Southeast Asian market in 2019. Super Robot Wars 30 has had a global release on the Steam platform in all regions, marking the first time in about 13 years that a Super Robot Wars game was released in such a manner."}, {"id": "b043", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which authors and series exemplify successful transitions from web novel to multi-media franchise?", "ev": "(My One-Hit Kill Sister > Media > Novel) Written by Konoe, My One-Hit Kill Sister was serialized online as a web novel on the user-generated novel publishing site Shōsetsuka ni Narō from December 28, 2019, to June 17, 2023. A print version of the novel has not been released.\n\n(My One-Hit Kill Sister > Abstract) My One-Hit Kill Sister (異世界ワンターンキル姉さん〜姉同伴の異世界生活はじめました〜, Isekai Wan Tān Kiru Nee-san: Ane Dōhan no Isekai Seikatsu Hajimemashita; \"One Turn Kill Sister in Another World: I Started Living in Another World with My Older Sister\") is a Japanese web novel series written by Konoe. It was serialized online on the user-generated novel publishing website Shōsetsuka ni Narō from December 2019 to June 2023. A manga adaptation, illustrated by Kenji Taguchi, was serialized online via Shogakukan 's Sunday Webry website, as well as the seinen manga magazine Monthly Sunday Gene-X, from March 2020 to July 2023. It chapters were collected in twelve tankōbon volumes. An anime television series adaptation by Gekkou aired from April to June 2023.\n\n(The White Cat's Revenge as Plotted from the Dragon King's Lap > Media > Light novel) Written by Kureha, The White Cat's Revenge as Plotted from the Dragon King's Lap was originally serialized on the user-generated novel publishing website Shōsetsuka ni Narō from January 28, 2015, to March 11, 2024. It was later acquired by Frontier Works who began publishing it with illustrations by Yamigo under their ArianRose light novel imprint on October 12, 2016. Eight volumes have been released as of August 9, 2024.  During their panel at Anime NYC 2019, J-Novel Club announced that they had licensed the series for English digital publication. In February 2021, J-Novel Club announced that they would begin releasing print copies in October that same year.\n\n(Shangri-La Frontier > Media > Web novel) The web novel series written by Katarina started on May 19, 2017, on the user-generated novel publishing website Shōsetsuka ni Narō. No printed version of the novel series has been released, despite numerous requests."}, {"id": "b044", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which federal grant programs and funding mechanisms were overseen by the U.S. Department of Transportation during Foxx's tenure?", "ev": "(Transportation Research Board > Funding) Although many activities are requested and funded by Congress and federal agencies, TRB and the National Academies do not receive direct federal appropriations. Programs receive support from state transportation departments, the various administrations of the U.S. Department of Transportation, and other federal agencies, industry associations, and other organizations and individuals interested in the development of transportation.  The Cooperative Research Programs receive funding. The Behavioral Traffic Safety Cooperative Research Program (BTSCRP) facilitates projects with support from the Governors Highway Safety Association. The Airport Cooperative Research Program (ACRP) is sponsored by the Federal Aviation Administration. The National Cooperative Highway Research Program (NCHRP), created in 1962, is sponsored by individual state departments of transportation of the American Association of State Highway and Transportation Officials and the Federal Highway Administration. The Transit Cooperative Research Program (TCRP) is sponsored by the Federal Transit Administration and carried out under a three-way agreement among the National Academy of Sciences, the Transit Development Corporation, Inc., and the American Public Transportation Association.  TRB offers selective research funding through the NCHRP, ACRP, and TCRP. Each of these programs has industry leaders who serve as references during the project.\n\n(University Circle > Construction and expansion projects > Train stations) Both current University Circle train stations were rehabbed and reconstructed by August 2015.  The University Circle-Cedar Rd rapid station underwent a complete rehab, using an ADA -compliant design to include a new rail entry plaza, waiting area, and train loading platform. A new bus terminal was also constructed on the north side of Cedar Road with a pedestrian connection between the bus terminal and the rail station. Secured funding included a $10.5 million grant from the U.S. Department of Transportation and a $2 million grant from the Federal Transit Administration —totaling $12.5 million in federal funds.  The Euclid–East 120th rapid station was relocated in conjunction with the Uptown Project to E.119 St and Mayfield Rd. Funding was received through a $12.5 million grant from the U.S. Department of Transportation, via the Federal Transit Administration. The final cost of the new station was around $17.5 million.\n\n(California Department of Alcohol and Drug Programs > Organization) The Department of Alcohol and Drug Programs is organized into five divisions and eight offices. The department does not have any boards or commissions.  ADP has approximately 326 permanent staff and oversight responsibilities for an average annual budget of more than $600 million. The department manages and administers both state and federal monies, including the federal Substance Abuse Prevention and Treatment (SAPT) Block Grant, a major source of funding. ADP also manages the Drug Medi-Cal benefit program, which has expanded to more than $115 million yearly.\n\n(No net loss policy in the United States > No Net Loss policy under past administrations > Barack Obama) Following the lead of the previous three presidential administrations, Barack Obama pledged his commitment to No Net Loss. The Obama administration increased funding of the North American Wetlands Conservation Act to ensure No Net Loss consistency, though funding was cut in the 2011 budget. Obama campaigned to amend the CWA and to extend the Swampbuster program, however these commitments were not carried out. Obama's administration was working with Congress to amend the CWA so isolated wetlands would fall under the Act's protection.\n\n(Science, technology, engineering, and mathematics > By country > United States > American Competitiveness Initiative) In the State of the Union Address on January 31, 2006, President George W. Bush announced the American Competitiveness Initiative. Bush proposed the initiative to address shortfalls in federal government support of educational development and progress at all academic levels in the STEM fields. In detail, the initiative called for significant increases in federal funding for advanced R&D programs (including a doubling of federal funding support for advanced research in the physical sciences through DOE) and an increase in U.S. higher education graduates within STEM disciplines.  The NASA Means Business competition, sponsored by the Texas Space Grant Consortium, furthers that goal. College students compete to develop promotional plans to encourage students in middle and high school to study STEM subjects and to inspire professors in STEM fields to involve their students in outreach activities that support STEM education.  The National Science Foundation has numerous programs in STEM education, including some for K–12 students such as the ITEST Program that supports The Global Challenge Award ITEST Program. STEM programs have been implemented in some Arizona schools. They implement higher cognitive skills for students and enable them to inquire and use techniques used by professionals in the STEM fields.  Project Lead The Way (PLTW) is a provider of STEM education curricular programs to middle and high schools in the United States. Programs include a high school engineering curriculum called Pathway To Engineering, a high school biomedical sciences program, and a middle school engineering and technology program called Gateway To Technology. PLTW programs have been endorsed by President Barack Obama and United States Secretary of Education Arne Duncan as well as various state, national, and business leaders."}, {"id": "b045", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "On what date was Anthony Foxx nominated and confirmed as U.S. Secretary of Transportation?", "ev": "(Stuart A. Levey > Career > Acting Treasury Secretary) On January 15, 2009 President-elect Barack Obama designated Levey to serve as Acting Treasury Secretary until Obama nominee Timothy Geithner was confirmed to the post. Geithner was confirmed on January 26.\n\n(Elisabeth I. Millard > Abstract) Elisabeth I. Millard (born 1954) is an American diplomat who served as Principal Deputy Assistant Secretary for the State Department's Bureau of European and Eurasian Affairs. She served as the United States Ambassador to Tajikistan from January 2016 until September 2017. She was nominated by President Barack Obama on July 7, 2015, and was confirmed by the Senate November 19, 2015. She previously served as Acting Executive Secretary of the Department of State and as Deputy Executive Secretary of the Department of State.\n\n(Christopher A. Hart > Abstract) Christopher A. Hart is an American lawyer, government official, and pilot. He served as the 13th chairman of the National Transportation Safety Board. He served as Acting NTSB Chairman beginning April 26, 2014, and in June 2014 was nominated by President Barack Obama to serve as Chairman of the NTSB. He was confirmed to serve as chairman on February 5, 2015. Robert Sumwalt succeeded him as chairman in August 2017.\n\n(Ray Mabus > Secretary of the Navy > Appointment) In 2008 Mabus campaigned for Democratic presidential candidate Barack Obama in Mississippi, who was subsequently elected President of the United States. On March 27, 2009, Mabus was nominated by Obama to be appointed Secretary of the Navy. He was sworn in on May 19, 2009, and held a ceremonial swearing in at Washington Navy Yard on June 18, 2009, where he was re-sworn in by the Secretary of Defense Robert Gates.\n\n(Asian Americans in politics > Officeholders > Cabinet) Norman Mineta became the first Asian American Cabinet member when he was appointed secretary of commerce by President Bill Clinton in 2000. He then served as secretary of transportation from 2001 to 2006.  In the George W. Bush Administration, Elaine Chao became the first, and thus far only, Asian American woman to serve as a Cabinet secretary when she became the secretary of labor in 2001, serving until 2009. She has also served as secretary of transportation in the administration of Donald Trump in 2017, serving until her resignation in 2021.  In 2009, President Barack Obama appointed Eric Shinseki to the position of secretary of veterans affairs, which he held until 2014. Shinseki was the first Asian American to hold this position. Steven Chu, the first Asian American to hold the position of secretary of energy, served from 2009 to 2013. Additionally under Obama, Gary Locke served as secretary of commerce from 2009 to 2011.  In 2017, President Donald Trump appointed Nikki Haley the first Indian American to serve in a permanent Cabinet-level position when she was confirmed to the position of ambassador to the United Nations in 2017. She held the position until 2018.  In 2021, Kamala Harris became the highest ranking Asian American to serve in a cabinet as 49th Vice President of the United States. President Joe Biden also appointed Katherine Tai to serve as U.S. Trade Representative, a cabinet-level position."}, {"id": "b046", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented performance limitations or declines occurred after peak relay success, including retirement reasons if applicable?", "ev": "(Libby Trickett > 2005 World Aquatics Championships) In July 2005, at the 2005 World Aquatics Championships in Montreal, Canada, Trickett was one of the form swimmers of the meet. She won the 50-metre freestyle in a time of 24.59 to record her maiden championship at international level. She also achieved a silver medal in the 100-metre butterfly (57.37). She was a member of three relay teams, the 4×100-metre freestyle relay, 4×100-metre medley relay, and the 4×200-metre freestyle relay teams, winning gold (3:37.22), gold (3:57.47) and silver (7:54.00) in the respective events. Fairly new to the 200-metre freestyle event, Trickett got recorded the then fourth fastest time in history clocking 1:57.06 as lead-off swimmer in the final of the 4×200-metre freestyle relay. The time being more than 1.5 seconds faster than the individual gold medallist Solenne Figuès of France (1.58.60). Trickett did not compete in the individual 100-metre freestyle because she placed third in the event at the Australian championship, but her 100-metre freestyle split times were faster than the individual 100-metre freestyle gold medalist and world record holder Jodie Henry, which earned her the honour of swimming in the final of the medley relay. Despite not competing in the individual 100- and 200-metre freestyle, she did finish 2005 ranked number one in the world in both events.  On returning to Australia, Trickett continued her rich vein of form, lowering the 100-metre short course freestyle world record on consecutive nights at the Australian Short Course Championships to 51.70 seconds.  2005 brought a further world record in the short-course 200-metre freestyle at the Sydney, Australia stop of the 2005 FINA World Cup series on 19 November with Trickett recording a time of 1:53.29 to beat the previous record by 0.75 seconds.  However, Trickett regained her 100-metre freestyle world record on 31 January 2006 at the Australian Championships in Melbourne. Her time of 53.42 was 0.1 of a second faster than the previous record held by Henry. On 2 August 2006, German swimmer Britta Steffen broke Trickett's 100-metre freestyle world record at the 2006 European Championships in Budapest, Hungary, with a time of 53.30. Trickett again regained the world record with a time of 52.88 on 27 March 2008 at the 100-metre finals of the Australian Olympic Trials.\n\n(Barbara Krause > Abstract) Barbara Krause (later Wanja, born on 7 July 1959 in East Berlin) is a former freestyle swimmer from East Germany. She was a three-time Olympic gold medalist and eight-time world record holder. At the 1980 Summer Olympics in Moscow, Krause won gold medals in the 100 m and 200 m freestyle and in the 4×100 m freestyle relay.  Her husband, Lutz Wanja, is also a retired German Olympic swimmer."}, {"id": "b047", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What major policy platforms has Welsh Labour emphasized in recent Senedd manifestos (health, education, economy, etc.)?", "ev": "(Plaid Cymru > Abstract) Plaid Cymru (English: / p l aɪ d ˈ k ʌ m r i / plyde KUM -ree; Welsh:; lit. ' Party of Wales ', officially Plaid Cymru – the Party of Wales, and often referred to simply as Plaid) is a centre-left to left-wing Welsh nationalist political party in Wales, that supports Welsh independence from the United Kingdom. It campaigns on a platform of social democracy and civic nationalism. The party is a supporter of the European Union and is a member of the European Free Alliance (EFA). The party holds 4 of 32 Welsh seats in the UK House of Commons, 43 of 96 seats in the Senedd, and 200 of 1,234 principal local authority councillors. Plaid was formed in 1925 under the name Plaid Genedlaethol Cymru (' the national party of Wales ') and Gwynfor Evans won the first Westminster seat for the party at the 1966 Carmarthen by-election.  In 1999 (in the first devolved Welsh Assembly election), Plaid Cymru gained considerable ground in traditionally Labour heartlands. These breakthroughs were part of the intentional aim to win more seats in the Welsh valleys and North East Wales, which continues to be an ambition today. The party have mostly been in opposition in the Senedd. Although under the leadership of Ieuan Wyn Jones, the party was part of a coalition as a junior partner with Welsh Labour between 2007 and 2011. Wyn Jones became the deputy First Minister and Minister for the Economy and Transport, alongside other Plaid MSs who also joined the cabinet.  After losses in the 2011 Assembly elections and dropping down to being the third largest party, Wyn Jones stepped down. He was succeeded by Leanne Wood. In the 2016 Assembly elections Wood managed to win her constituency seat of Rhondda meaning the party gained one seat, and became the official opposition once again, although only for a brief period. In 2018 following internal pressure and a leadership contest, Adam Price defeated Wood and was elected the new leader. Following the 2021 Senedd election Plaid formed a co-operation agreement with the Welsh Labour government. In May 2023 Price resigned as leader following the publication of a report which detailed failings by the party to prevent sexual harassment and bullying. In June 2023 Rhun ap Iorwerth was elected unopposed as leader. The party won both its target seats in the 2024 general election, therefore becoming the second largest party representing Wales in the House of Commons.  Plaid Cymru won a plurality in the 2026 Senedd election with 43 out of 96 seats, and are expected to form the next Welsh government, with Rhun ap Iorwerth becoming the first Plaid Cymru First Minister.\n\n(Lynne Neagle > Political career > Sixth Senedd (2021–present)) Neagle was re-elected at the 2021 Senedd election, with a majority of 5,321 votes. Neagle was appointed as Deputy Minister for Mental Health and Wellbeing by First Minister Mark Drakeford shortly after.  Neagle supported Vaughan Gething in the February-March 2024 Welsh Labour leadership election. After Gething won the leadership election, Neagle was appointed as Cabinet Secretary for Education in the Gething government.  Neagle was elected as MS for the Sir Fynwy Torfaen Senedd constituency at the 2026 Senedd election.\n\n(John Griffiths (Welsh politician) > Political career) He is a former councillor on Gwent County Council and Newport CBC. He is a member of Labour's National Policy Forum, the Co-operative Party, Workers' Educational Association and Full Employment Forum. He is a committed republican, and a member of the ISTC trade union. Griffiths has been a Member of the Senedd for Newport East since 1999. His political interests include economic development, social inclusion, education and Europe.  In the Senedd he was appointed Deputy Minister for Health and Social Care (Older People) from May 2003 until May 2007. In the Third Assembly was appointed Deputy Minister for Education, Culture and the Welsh Language (31 May 2007) and retained that position when the coalition government of Plaid Cymru and Labour was announced on 19 July. John supported Carwyn Jones in the Welsh Labour leadership contest in 2009, and went on to support Mark Drakeford in 2018. He was appointed Counsel General and Leader of the Legislative Programme in the Welsh Assembly in December 2009, a job previously done by First Minister Carwyn Jones.\n\n(Powers and status of Welsh devolution > Powers of the Senedd > Overview) The Senedd has been given law-making powers from the UK Parliament, so it can pass primary legislation, as Acts of Senedd Cymru, that are equivalent in status to Acts of Parliament. However, the Senedd is not sovereign, it cannot legislate on any matter it chooses, but is governed by the powers set out first in the Government of Wales Act 1998, later replaced by the Government of Wales Act 2006, which has been amended by the Wales Act 2014 and Wales Act 2017.  The Senedd now operates on a \"reserved powers model\" set out in the Wales Act 2017, replacing the \"conferred powers model\", with the Senedd allowed to make laws on any matter that is not reserved to the UK Parliament. Laws by the Senedd must not be related to the reserved matters set out in the Schedule 7A of the act and not breach any restrictions set out in Schedule 7B of the same act.  Initially the then assembly had more limited powers than now, but eventually gained full law-making powers of areas such as; agriculture and rural affairs, culture and Welsh language, education, the environment, health and healthcare services, local government, transport (excluding rail infrastructure), and any other policy not reserved to the UK Parliament. (see the lists in the laws below)  The assembly also gained powers to amend certain taxes. While powers such as benefits, defence, foreign affairs, immigration, nuclear energy and major rail infrastructure remain reserved (see Powers and status of Welsh devolution § Schedule 7A - Reserved Matters) to the UK Parliament. This increase in powers over time awarded to the then assembly, led to it renaming itself the Welsh Parliament, or Senedd Cymru, simply the \"Senedd\" in both languages.\n\n(Lynne Neagle > Political career > First and Second Senedds (1999–2007)) Neagle was elected to the Senedd in 1999 as a Labour candidate to represent Torfaen. Neagle was an ally of Alun Michael during his leadership of the Welsh Labour party.  Later in the first term, she was appointed to the role of Chair of the Welsh Labour group in the Senedd. She initially opposed coalition with the Welsh Liberal Democrats, and supported a motion that would have required any coalition from the 2003 Assembly election onward to go to a vote of Welsh Labour members. However, she later said that the \"alternative was worse\" and supported the formation of a coalition.  She was occasionally critical of policy of the Morgan government, including the party's health policy, around a lack of targets and around funding, and the elimination of school league tables.  She was re-elected in 2003 with a majority of 6,964 votes. She was a member of the Standards committee during the Second Assembly."}, {"id": "b048", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What endorsements, ambassador roles, or coaching positions did the swimmer accept that affected swimming programs?", "ev": "(Erica Sullivan (swimmer) > Career > 2020 Summer Olympics) Sullivan qualified to compete at the 2020 Summer Olympics in the 1500-meter freestyle for the USA Olympic swimming team. At the 2020 Olympic Games in Tokyo, Japan, she won the silver medal in the 1500-meter freestyle with a time of 15:41.41, just 4.07 seconds behind gold medalist Katie Ledecky, on July 28, 2021 at the Tokyo Aquatics Center. Sarah Köhler of Germany took the bronze medal with a time of 15:42.91. It was the first occurrence of women competing in the 1500-meter freestyle at the Summer Olympic Games.\n\n(Barbara Krause > Abstract) Barbara Krause (later Wanja, born on 7 July 1959 in East Berlin) is a former freestyle swimmer from East Germany. She was a three-time Olympic gold medalist and eight-time world record holder. At the 1980 Summer Olympics in Moscow, Krause won gold medals in the 100 m and 200 m freestyle and in the 4×100 m freestyle relay.  Her husband, Lutz Wanja, is also a retired German Olympic swimmer.\n\n(Libby Trickett > 2005 World Aquatics Championships) In July 2005, at the 2005 World Aquatics Championships in Montreal, Canada, Trickett was one of the form swimmers of the meet. She won the 50-metre freestyle in a time of 24.59 to record her maiden championship at international level. She also achieved a silver medal in the 100-metre butterfly (57.37). She was a member of three relay teams, the 4×100-metre freestyle relay, 4×100-metre medley relay, and the 4×200-metre freestyle relay teams, winning gold (3:37.22), gold (3:57.47) and silver (7:54.00) in the respective events. Fairly new to the 200-metre freestyle event, Trickett got recorded the then fourth fastest time in history clocking 1:57.06 as lead-off swimmer in the final of the 4×200-metre freestyle relay. The time being more than 1.5 seconds faster than the individual gold medallist Solenne Figuès of France (1.58.60). Trickett did not compete in the individual 100-metre freestyle because she placed third in the event at the Australian championship, but her 100-metre freestyle split times were faster than the individual 100-metre freestyle gold medalist and world record holder Jodie Henry, which earned her the honour of swimming in the final of the medley relay. Despite not competing in the individual 100- and 200-metre freestyle, she did finish 2005 ranked number one in the world in both events.  On returning to Australia, Trickett continued her rich vein of form, lowering the 100-metre short course freestyle world record on consecutive nights at the Australian Short Course Championships to 51.70 seconds.  2005 brought a further world record in the short-course 200-metre freestyle at the Sydney, Australia stop of the 2005 FINA World Cup series on 19 November with Trickett recording a time of 1:53.29 to beat the previous record by 0.75 seconds.  However, Trickett regained her 100-metre freestyle world record on 31 January 2006 at the Australian Championships in Melbourne. Her time of 53.42 was 0.1 of a second faster than the previous record held by Henry. On 2 August 2006, German swimmer Britta Steffen broke Trickett's 100-metre freestyle world record at the 2006 European Championships in Budapest, Hungary, with a time of 53.30. Trickett again regained the world record with a time of 52.88 on 27 March 2008 at the 100-metre finals of the Australian Olympic Trials.\n\n(Relay race > Relays in swimming) A swimming relay of four swimmers usually follows this strategy: second-fastest, third-fastest, slowest, then fastest (anchor). However, it is not uncommon to see either the slowest swimmer racing in the second slot (creating an order of second-fastest, slowest, third-fastest, and then fastest), or an order from slowest to fastest (an order of slowest, third-fastest, second-fastest, fastest).  FINA rules require that a foot of the second, third or fourth swimmer must be contacting the platform while (and before) the incoming teammate is touching the wall; the starting swimmer may already be in motion, however, which saves 0.6–1.0 seconds compared to a regular start. Besides, many swimmers perform better in a relay than in an individual race owing to a team spirit atmosphere. As a result, relay times are typically 2–3 seconds faster than the sum of best times of individual swimmers.  In medley swimming, each swimmer uses a different stroke (in this order): backstroke, breaststroke, butterfly, and freestyle, with the added limitation that the freestyle swimmer cannot use any of the first three strokes. At competitive levels, essentially all freestyle swimmers use the front crawl. Note that this order is different from that for the individual medley, in which a single swimmer swims butterfly, backstroke, breaststroke, and freestyle in a single race, in that order.  The three standard relays raced at the Olympics are the 4 × 100 m freestyle relay, 4 × 200 m freestyle relay and 4 × 100 m medley relay.  Mixed-gendered relays were introduced at the 2014 FINA World Swimming Championships (25 m) (4 × 50 m freestyle and medley) and the 2015 World Aquatics Championships (4 × 100 m freestyle and medley). The event debuted at the 2020 Summer Olympics (4 × 100 m medley).  In open water swimming, mixed-gendered relays were introduced at the 2011 World Aquatics Championships (4 × 1250 m).\n\n(Nicolò Martinenghi > Abstract) Nicolò Martinenghi (Italian:; born 1 August 1999) is an Italian swimmer and the reigning Olympic champion in the 100 metre breaststroke event, having won the gold medal at the 2024 Summer Olympics. He is a two-time world record holder in the 4×50 metre medley relay, swimming breaststroke on both relays. He is the Italian record holder in the 50 metre breaststroke and 100 metre breaststroke (both long course and short course).  In the long course 100 metre breaststroke, Martinenghi won the gold medal at the 2022 World Aquatics Championships and the 2022 European Aquatics Championships, as well as the bronze medal at the 2020 Summer Olympics. In the short course version of the event, he was European champion in 2021 and won silver medals at the 2021 and 2022 World Short Course Championships. In the long course 50 metre breaststrok
