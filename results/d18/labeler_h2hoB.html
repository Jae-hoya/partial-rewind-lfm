amil actress. Her father, Yaragudipati Varada Rao, was a Telugu producer, director, thespian, screenwriter, editor and actor known for his works predominantly in Telugu, Kannada, Malayalam and Tamil Cinema.\n\n(Pooja Reddy Bora > Abstract) Pooja Reddy Bora is an Indian actress and model known for her work in Telugu and Kannada cinema. She has primarily worked in the Telugu film industry and gained recognition for her performance in the 2025 supernatural thriller Odela 2, which also marked her most recent theatrical release."}, {"id": "b017", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How are Welsh Labour candidates for UK Parliament and the Senedd selected under party rules?", "ev": "(2026 Senedd election > Abstract) An election for the Senedd (Welsh Parliament; Welsh: Senedd Cymru) was held on 7 May 2026, to elect all 96 members to the Senedd. It was the seventh devolved general election since the Senedd (formerly the National Assembly for Wales) was established in 1999. It was the first election following numerous reforms: an increase in the size of the Senedd from 60 members to 96, the adoption of party-list proportional representation, the reduction of the number of constituencies to sixteen, and the shortening of its term from five years to four. The election was held on the same day as local elections in England and elections to the Scottish Parliament.  Welsh Labour lost government and its status as the largest party for the first time since devolution began in 1999, ending a winning streak that had lasted since the 1922 United Kingdom general election and resulting in a historic realignment of Welsh politics. Plaid Cymru emerged as the largest party for the first time with 43 seats, while Reform UK secured second place with 34 seats. Labour was reduced to third place with a historic low of 9 seats. The Welsh Conservatives and the Wales Green Party won 7 and 2 seats respectively, with the Greens entering the Senedd for the first time. With her failure to secure a seat in the constituency of Ceredigion Penfro, First Minister Eluned Morgan became the first leader of a government in the UK to lose their seat while in office.  Turnout was 51.72%, the highest ever for a Welsh devolved election.\n\n(Plaid Cymru > Abstract) Plaid Cymru (English: / p l aɪ d ˈ k ʌ m r i / plyde KUM -ree; Welsh:; lit. ' Party of Wales ', officially Plaid Cymru – the Party of Wales, and often referred to simply as Plaid) is a centre-left to left-wing Welsh nationalist political party in Wales, that supports Welsh independence from the United Kingdom. It campaigns on a platform of social democracy and civic nationalism. The party is a supporter of the European Union and is a member of the European Free Alliance (EFA). The party holds 4 of 32 Welsh seats in the UK House of Commons, 43 of 96 seats in the Senedd, and 200 of 1,234 principal local authority councillors. Plaid was formed in 1925 under the name Plaid Genedlaethol Cymru (' the national party of Wales ') and Gwynfor Evans won the first Westminster seat for the party at the 1966 Carmarthen by-election.  In 1999 (in the first devolved Welsh Assembly election), Plaid Cymru gained considerable ground in traditionally Labour heartlands. These breakthroughs were part of the intentional aim to win more seats in the Welsh valleys and North East Wales, which continues to be an ambition today. The party have mostly been in opposition in the Senedd. Although under the leadership of Ieuan Wyn Jones, the party was part of a coalition as a junior partner with Welsh Labour between 2007 and 2011. Wyn Jones became the deputy First Minister and Minister for the Economy and Transport, alongside other Plaid MSs who also joined the cabinet.  After losses in the 2011 Assembly elections and dropping down to being the third largest party, Wyn Jones stepped down. He was succeeded by Leanne Wood. In the 2016 Assembly elections Wood managed to win her constituency seat of Rhondda meaning the party gained one seat, and became the official opposition once again, although only for a brief period. In 2018 following internal pressure and a leadership contest, Adam Price defeated Wood and was elected the new leader. Following the 2021 Senedd election Plaid formed a co-operation agreement with the Welsh Labour government. In May 2023 Price resigned as leader following the publication of a report which detailed failings by the party to prevent sexual harassment and bullying. In June 2023 Rhun ap Iorwerth was elected unopposed as leader. The party won both its target seats in the 2024 general election, therefore becoming the second largest party representing Wales in the House of Commons.  Plaid Cymru won a plurality in the 2026 Senedd election with 43 out of 96 seats, and are expected to form the next Welsh government, with Rhun ap Iorwerth becoming the first Plaid Cymru First Minister.\n\n(Sir Gaerfyrddin (constituency) > Boundaries) A Senedd constituency comprising the boundaries of the UK Parliament constituencies of Caerfyrddin and Llanelli, has been proposed by the Democracy and Boundary Commission Cymru for the 2026 election to the Senedd (Welsh Parliament; Senedd Cymru). It was initially proposed using the English name Carmarthenshire in September 2024, but was renamed to Sir Gâr in December proposals with most constituencies using Welsh-only names. It was then given the Welsh-only name Sir Gaerfyrddin and its boundaries were confirmed in the commission's final recommendations in March 2025. When announcing their candidates, Reform UK used \"Caerfyrddin, Llanelli\" instead, using the names for the pair of UK Parliament constituencies that form it.  It encompasses the entire principal area (county) of Carmarthenshire in South West Wales. The constituency was established in 2026, following the passing of the Senedd Cymru (Members and Elections) Act 2024. The act legislates electoral reform of the Senedd to create 16 larger \"super constituencies\", pairing the 32 UK Parliament constituencies in Wales, and using a new fully proportional voting system, with each constituency electing six Members of the Senedd (MSs) rather than one previously.\n\n(Ceredigion Penfro > Boundaries) A Senedd constituency comprising the boundaries of the UK Parliament constituencies of Ceredigion Preseli and Mid and South Pembrokeshire, has been proposed by the Democracy and Boundary Commission Cymru for the 2026 election to the Senedd (Welsh Parliament; Senedd Cymru). It was initially proposed using the English name Ceredigion and Pembrokeshire in September 2024, but was renamed Ceredigion Penfro in December proposals with most constituencies using Welsh-only names. The Welsh-only name and boundaries were confirmed in the commission's final recommendations in March 2025. When announcing their candidates, Reform UK used \"Ceredigion Preseli, Mid and South Pembrokeshire\" instead, using the English names for the pair of UK Parliament constituencies that form it.  It encompasses the entire principal areas (counties) of Ceredigion and Pembrokeshire in West Wales. The constituency was established in 2026, following the passing of the Senedd Cymru (Members and Elections) Act 2024. The act legislates electoral reform of the Senedd to create 16 larger \"super constituencies\", pairing the 32 UK Parliament constituencies in Wales, and using a new fully proportional voting system, with each constituency electing six Members of the Senedd (MSs) rather than one previously."}, {"id": "b018", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What recurring critical complaints (e.g., template storytelling, gender representation, escapism critiques) are documented about isekai novels?", "ev": "(My One-Hit Kill Sister > Abstract) My One-Hit Kill Sister (異世界ワンターンキル姉さん〜姉同伴の異世界生活はじめました〜, Isekai Wan Tān Kiru Nee-san: Ane Dōhan no Isekai Seikatsu Hajimemashita; \"One Turn Kill Sister in Another World: I Started Living in Another World with My Older Sister\") is a Japanese web novel series written by Konoe. It was serialized online on the user-generated novel publishing website Shōsetsuka ni Narō from December 2019 to June 2023. A manga adaptation, illustrated by Kenji Taguchi, was serialized online via Shogakukan 's Sunday Webry website, as well as the seinen manga magazine Monthly Sunday Gene-X, from March 2020 to July 2023. It chapters were collected in twelve tankōbon volumes. An anime television series adaptation by Gekkou aired from April to June 2023.\n\n(Web novels in South Korea > Platforms > Joara) \"Serialist\" (시리얼리스트; Silieolliseuteu) was launched in November 2000, and \"Ujoa\" (유조아; Yujoa), was launched in March 2001. The web novel Invisible Dragon (투명드래곤; Tumyeongdeuraegon) (2002) attracted significant attention. In June 2003, \"Joara\" (조아라) was officially established.  Joara is South Korea's largest web novel platform, with approximately 140,000 writers. It hosts an average of 2,400 serialized works per day and a total of about 420,000 works. The company operated at a loss for its first eight years but began generating profits in 2009. By 2015, it reported sales of ₩ 12.5 billion. As of 2016, Joara had approximately 1.1 million members and averaged 8.6 million daily users.  Because Joara’s user base has a relatively balanced gender distribution, both fantasy and romance genres are popular. The top 10 works in the “Noblesse” and “Premium” categories are dominated by these genres, while parody and BL genres are popular in the free series category.\n\n(The White Cat's Revenge as Plotted from the Dragon King's Lap > Abstract) The White Cat's Revenge as Plotted from the Dragon King's Lap (復讐を誓った白猫は竜王の膝の上で惰眠をむさぼる, Fukushū o Chikatta Shironeko wa Ryūō no Hiza no Ue de Damin o Musaboru) is a Japanese light novel series written by Kureha and illustrated by Yamigo. It was originally serialized on the user-generated novel publishing website Shōsetsuka ni Narō from January 2015 to March 2024. It was later acquired by Frontier Works who began publishing it under their ArianRose imprint in October 2016. A manga adaptation illustrated by aki began serialization on Kadokawa 's ComicWalker website under the Flos Comic brand in August 2017.\n\n(True Love Fades Away When the Contract Ends > Abstract) True Love Fades Away When the Contract Ends (運命の恋人は期限付き, Unmei no Koibito wa Kigen Tsuki) is a Japanese web novel series written by Kozusu Kobato. It was serialized on the user-generated novel publishing website Shōsetsuka ni Narō between May 2020 and July 2021. A manga adaptation illustrated by Murasaki Shido was serialized in Micro Magazine's Comic Ride web manga magazine between July 2021 and January 2023. It was later transferred to the Comic Ride Ivy web manga magazine in March 2023. A light novel version with illustrations by Fumi Takamura began publication under Micro Magazine's Maple Novels imprint in December 2022.\n\n(The White Cat's Revenge as Plotted from the Dragon King's Lap > Media > Light novel) Written by Kureha, The White Cat's Revenge as Plotted from the Dragon King's Lap was originally serialized on the user-generated novel publishing website Shōsetsuka ni Narō from January 28, 2015, to March 11, 2024. It was later acquired by Frontier Works who began publishing it with illustrations by Yamigo under their ArianRose light novel imprint on October 12, 2016. Eight volumes have been released as of August 9, 2024.  During their panel at Anime NYC 2019, J-Novel Club announced that they had licensed the series for English digital publication. In February 2021, J-Novel Club announced that they would begin releasing print copies in October that same year."}, {"id": "b019", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did the firm's acquisitions influence newsprint wholesale prices or price-setting behavior in target markets?", "ev": "(Prescription drug prices in the United States > Reasons for high prices > Variability and non-transparency) The price of a pharmaceutical drug can depend on many factors: list price, wholesale price, average wholesale price (pharmaceuticals), rebates, supplemental rebates, markups from hospitals, markups for physicians, drug price for inpatients versus outpatients, formulary (pharmacy) tiers, mail order price, biosimilar prices, \"patent expirations, compounds, samples, and many other ways that end up obscuring the reality of the price paid, who pays it, and how all of it influences treatment decisions.\"\n\n(Market power > Abstract) In economics, market power refers to the ability of a firm to influence the price at which it sells a product or service by manipulating either the supply or demand of the product or service to increase economic profit. In other words, market power occurs if a firm does not face a perfectly elastic demand curve and can set its price (P) above marginal cost (MC) without losing revenue. This indicates that the magnitude of market power is associated with the gap between P and MC at a firm's profit maximising level of output. The size of the gap, which encapsulates the firm's level of market dominance, is determined by the residual demand curve's form. A steeper reverse demand indicates higher earnings and more dominance in the market. Such propensities contradict perfectly competitive markets, where market participants have no market power, P = MC and firms earn zero economic profit. Market participants in perfectly competitive markets are consequently referred to as 'price takers', whereas market participants that exhibit market power are referred to as 'price makers' or 'price setters'.  The market power of any individual firm is controlled by multiple factors, including but not limited to, their size, the structure of the market they are involved in, and the barriers to entry for the particular market. A firm with market power has the ability to individually affect either the total quantity or price in the market. This said, market power has been seen to exert more upward pressure on prices due to effects relating to Nash equilibria and profitable deviations that can be made by raising prices. Price makers face a downward-sloping demand curve and as a result, price increases lead to a lower quantity demanded. The decrease in supply creates an economic deadweight loss (DWL) and a decline in consumer surplus. This is viewed as socially undesirable and has implications for welfare and resource allocation as larger firms with high markups negatively effect labour markets by providing lower wages. Perfectly competitive markets do not exhibit such issues as firms set prices that reflect costs, which is to the benefit of the customer. As a result, many countries have antitrust or other legislation intended to limit the ability of firms to accrue market power. Such legislation often regulates mergers and sometimes introduces a judicial power to compel divestiture.  Market power provides firms with the ability to engage in unilateral anti-competitive behavior. As a result, legislation recognises that firms with market power can, in some circumstances, damage the competitive process. In particular, firms with market power are accused of limit pricing, predatory pricing, holding excess capacity and strategic bundling. A firm usually has market power by having a high market share although this alone is not sufficient to establish the possession of significant market power. This is because highly concentrated markets may be contestable if there are no barriers to entry or exit. Invariably, this limits the incumbent firm's ability to raise its price above competitive levels.  If no individual participant in the market has significant market power, anti-competitive conduct can only take place through collusion, or the exercise of a group of participants' collective market power. An example of which was seen in 2007, when British Airways was found to have colluded with Virgin Atlantic between 2004 and 2006, increasing their surcharges per ticket from £5 to £60.  Regulators are able to assess the level of market power and dominance a firm has and measure competition through the use of several tools and indicators. Although market power is extremely difficult to measure, through the use of widely used analytical techniques such as concentration ratios, the Herfindahl-Hirschman index and the Lerner index, regulators are able to oversee and attempt to restore market competitiveness.\n\n(Oligopoly > Modeling oligopolies > Game theoretical models > Bertrand model) The Bertrand model is essentially the Cournot–Nash model, except the strategic variable is price rather than quantity.  Bertrand's model assumes that firms are selling homogeneous products and therefore have the same marginal production costs, and firms will focus on competing in prices simultaneously. After competing in prices for a while, firms would eventually reach an equilibrium where prices would be the same as marginal costs of production. The mechanism behind this model is that even by undercutting just a small increment of its price, a firm would be able to capture the entire market share. Even though empirical studies suggest that firms can easily make much higher profits by agreeing on charging a price higher than marginal costs, highly rational firms would still not be able to stay at a price higher than marginal cost. Whilst Bertrand price competition is a useful abstraction of markets in many settings, due to its lack of ability to capture human behavioural patterns, the approach has been criticised for being inaccurate in predicting prices.  The model assumptions are:  The only Nash equilibrium is P A = P B = MC {\\displaystyle P_{A}=P_{B}={\\text{MC}}}. In this situation, if a firm raises prices, it will lose all its customers. If a firm lowers price, P < MC {\\displaystyle P<{\\text{MC}}}, then it will lose money on every unit sold.  The Bertrand equilibrium is the same as the competitive result. Each firm produces where P = MC {\\displaystyle P={\\text{MC}}}, resulting in zero profits. A generalization of the Bertrand model is the Bertrand–Edgeworth model, which allows for capacity constraints and a more general cost function.\n\n(Electricity market in France > Electricity supply > Wholesale market) Related article: Wholesale electricity prices in France.  On the wholesale market, electricity is traded between producers, electricity suppliers and intermediary traders, before being delivered onto the grid to end customers (individuals or businesses).  Exchanges exist, such as EPEX SPOT for spot products (Paris) and EEX Power Derivatives France for forward products (Leipzig). Trading can also take place over-the-counter, either directly or through a broker. Transactions do not always result in physical delivery, as the product may be bought and then resold.  There are two types of product:  Products are further differentiated according to whether they concern baseload electricity (delivered throughout the day and year) or peak-load electricity (delivered at times of higher consumption, which may require the deployment of specific production capacities).  As forward contracts account for a large proportion of suppliers' supplies, sales tariffs to end consumers are based on forward prices rather than spot prices.  For example, 163 TWh were traded on the intermediated wholesale market in the 2nd quarter of 2011, mainly over-the-counter, with 126 TWh physically injected into the grid. Day-ahead prices quoted on EPEX averaged €49/MWh for baseload and €61.2/MWh for peak, with occasional peaks of almost €300/MWh. Futures prices averaged €59.5/MWh.  Under the effect of falling CO and coal prices, and then oil, wholesale electricity market prices fell below the ARENH price (€42/MWh) from December 2014, then to €38/MWh in January 2015, and the forward price for delivery in 2016 is now just €37/MWh: in Germany, the wholesale price has even fallen below €32/MWh; in November 2014, alternative suppliers' purchases from EDF fell by more than half, to 15.8 TWh, compared with 36.8 TWh a year earlier. What's more, as the regulated tariff has been partly indexed to the wholesale price since autumn 2014, this tariff has risen by much less than expected; these developments will stimulate competition and drive down EDF's market share; the primary beneficiaries of this are large industrial"}, {"id": "b020", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What fan-driven practices (fan translations, fan art, cosplay, doujinshi) are associated with web-originated isekai communities?", "ev": "(My One-Hit Kill Sister > Abstract) My One-Hit Kill Sister (異世界ワンターンキル姉さん〜姉同伴の異世界生活はじめました〜, Isekai Wan Tān Kiru Nee-san: Ane Dōhan no Isekai Seikatsu Hajimemashita; \"One Turn Kill Sister in Another World: I Started Living in Another World with My Older Sister\") is a Japanese web novel series written by Konoe. It was serialized online on the user-generated novel publishing website Shōsetsuka ni Narō from December 2019 to June 2023. A manga adaptation, illustrated by Kenji Taguchi, was serialized online via Shogakukan 's Sunday Webry website, as well as the seinen manga magazine Monthly Sunday Gene-X, from March 2020 to July 2023. It chapters were collected in twelve tankōbon volumes. An anime television series adaptation by Gekkou aired from April to June 2023.\n\n(Clop (erotic fan art) > Abstract) Clop (also referred to as pony porn) is erotic and pornographic fan art, fan fiction, fan films, fan games, and other fan labor based on My Little Pony: Friendship Is Magic, My Little Pony: Equestria Girls, and subsequent generations of the My Little Pony franchise. The term clop derives from the onomatopoeia for a hoofbeat and is a pun on fap, an Internet slang term for masturbation. Related terms include clopfic — a portmanteau of clop and fanfic, for erotic My Little Pony fan fiction — and clopping for the act of masturbating to clop.  The brony fandom (the adult fandom of Friendship Is Magic that emerged on the Internet in the early 2010s) gave rise to clop alongside its other forms of fan works. Variously described as a subset of the brony and furry fandoms, clop has grown into one of the largest bodies of erotic fan content associated with any single media franchise. It spans visual art distributed on imageboards, fan fiction published on Fimfiction, and other fan content, including those generated using artificial intelligence tools. Characters from Friendship Is Magic are among the most frequently tagged on the furry imageboard e621, and the My Little Pony imageboard Derpibooru hosts hundreds of thousands of explicit images.  A source of controversy both within and outside the My Little Pony fandom, clop has been criticized by bronies and outsiders alike for sexualizing children's media; in response, bronies have taken measures to tag such works as explicit on search engines and fan sites. Fans of clop universally distinguish it from zoophilia, as their interest is directed at fictional characters perceived as s"}, {"id": "b021", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which specific policy positions introduced or promoted by the politician were adopted into the party's official platform?", "ev": "(Australian Labor Party National Conference > Notable actions and policy positions > White Australia Policy) The first meeting of the Federal Labor Party in January 1900 (referred to as the Political Labour League) had included a policy of \"total exclusion of coloured and other undesirable races.\" This policy was formalised once again at the subsequent Australian Labor Party Commonwealth Conference in 1902, with \"Maintenance of a White Australia \" being the first item on the party's platform.  By 1921, the policy had developed into \"The cultivation of an Australian sentiment, the maintenance of White Australia, and the development in Australia of an enlightened and self reliant community.\" The 1959 platform included the following explanation for the party's continued support for racially-motivated immigration restrictions:  \"The maintenance of the White Australia policy by the encouragement of the entry of suitable immigrants which shall be strictly regulated so as not to impose any undue strain on the Australian economy or to imperil full employment or Australian industrial conditions through over-competition for available work. Immigration policy should be directed to creating further employment for Australians and opportunities for newcomers by the breaking up of large estates, the expansion of primary and secondary industries, and the promotion of national works.\"  — Australian Labor Party, Federal Platform and Objective (As adopted by the 23rd Commonwealth Conference), 1959  However, by the very next conference in 1961, the following section had been added:  \"Labor welcomes to Australia the people of the countries concerned and will, in friendship, assist to its utmost their assimilation into the Australian nation. Maintenance of a White Australia shall provide the basis for immigration policy. This basis does not represent a racial prejudice or carry any suggestion of racial superiority. The policy rejects the `Asian quota system\" on the grounds that it would make no material impact on overpopulated Asian countries, and would be harsher and more discriminating than the present regulations governing the entry of Asians into Australia for the purposes of trade and education.\"  — Australian Labor Party, Federal Platform and Objective (As adopted by the 24th Commonwealth Conference), 1961  The 1967 conference saw a major overhaul in a number of policy areas, thanks in no small part to the advocacy of progressive party members Gough Whitlam, Don Dunstan and Lionel Murphy. Any reference to \"white Australia\" was removed entirely, and the following section inserted:  \"Convinced that increased population is vital to the future development of Australia, the Australian Labor Party will support and uphold a vigorous and expanding immigration programme administered with sympathy, understanding and tolerance.\"  — Australian Labor Party, Federal Platform and Objective (As adopted by the 27th Commonwealth Conference), 1967  The Whitlam government introduced a number of important national reforms in the area of multiculturalism and immigration, including the Racial Discrimination Act 1975, and this progress continued under successive Labor governments. The Hawke government established the Advisory Council for Multicultural Affairs, the Keating government amended the Racial Discrimination Act to allow determinations of the Australian Human Rights Commission (established to monitor violations of the Act) to be registered by the Federal Court of Australia and given judicial force.  The most recent Australian Labor Party National Platform contains the following sections on Multiculturalism in Australia:  \"41. The Labor Government will develop a new multicultural framework to advance a multicultural Australia, support our cohesive and inclusive multicultural society and ensure settings are fit for purpose to harness the talents of all Australians.  42. Labor is committed to removing barriers to recent migrants’ participation in our economy and society, ensuring that diversity is measured and reflected in social, economic and political participation and that government services reflect the needs of all Australians.  43. Labor is very concerned by the rise of racism and of division, and will continue to oppose those who foster extremism, hatred, ethnic division or incitement to violence. Labor will combat racism with a zero-tolerance approach.\"  — Australian Labor Party, National Platform (As adopted by the 49th National Conference), 2023  The 2023 platform further states: \"Australia is, and will remain, a society of people drawn from a rich variety of cultural, ethnic, linguistic and religious backgrounds. Australia is, and will remain, a multicultural society.\"\n\n(Christian Dürr > Political career > Member of the German Bundestag, 2017–2025) Dürr first became a member of the German Bundestag in the 2017 elections, representing the Delmenhorst – Wesermarsch – Oldenburg-Land district. Within his parliamentary group, he chaired the Bundestag group of FDP parliamentarians from Lower Saxony, Hamburg and Schleswig-Holstein. He also served as one of six deputy chairpersons of the FDP parliamentary group under the leadership of its chairman Christian Lindner, where he oversaw the group's activit"}, {"id": "b022", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What structural industry barriers (e.g., nepotism, distribution limits) were cited as impacting cross-industry actors like her?", "ev": "(Lakshmi (actress) > Early life) Lakshmi was born and raised in Chennai, Tamil Nadu. Her mother Kumari Rukmini was a Tamil actress. Her father, Yaragudipati Varada Rao, was a Telugu producer, director, thespian, screenwriter, editor and actor known for his works predominantly in Telugu, Kannada, Malayalam and Tamil Cinema.\n\n(Pooja Reddy Bora > Abstract) Pooja Reddy Bora is an Indian actress and model known for her work in Telugu and Kannada cinema. She has primarily worked in the Telugu film industry and gained recognition for her performance in the 2025 supernatural thriller Odela 2, which also marked her most recent theatrical release.\n\n(Anjali Devi > Career > As actress) She was a theatre artiste before venturing into movies, her debut film role was as Lohitasva in \" Raja Harishchandra\" in 1936. Her first film as a heroine was Kashtajeevi by L. V. Prasad in 1940, but that film was abandoned after three reels shooting. Later, C.Pullayya discovered her and gave her the opportunity to star as Mohini in Gollabhama (1947). Based on her acting ability and looks, she became a star overnight in 1947. She eventually acted in more than 350 films, majority of them in Telugu and Tamil films and a few in Hindi, Kannada films as the heroine or in character roles.  She acted in Lava Kusa, a milestone film and the first color film in the Telugu film industry in 1963. She is well known for playing Sita in Lava Kusa and her performances in films like Suvarna Sundari and Anarkali were also appreciated. Brundavanam (1992), Anna Vadina (1993) and Police Alludu (1994) were the last few films of her career. In Balaiah's Police Alludu and Anna Vadina she appeared alongside Brahmanandam. She acted in various roles, such as a damsel, an angel, a dancer, a demon, a goddess, a traditional woman and later in mother roles.\n\n(Pooja Reddy Bora > Career) Pooja Reddy Bora is an Indian actress and model known for her work in Telugu and Kannada cinema. She began her acting career in 2018 with the Kannada film Vedanti, portraying Varsha. She expanded into Telugu cinema with notable roles in Arangetram (2023) and Tatva (2024). Her performance in Odela 2 (2025) further established her presence in the industry.  Beyond films, Pooja Reddy Bora is active in modeling, participating in various fashion events, and photoshoots. She maintains an active presence on Instagram, sharing updates about her work and personal life.\n\n(Vanisri > Abstract) Vanisri (born Rathna Kumari) is an Indian actress known for her works predominantly in Telugu, Tamil, and Kannada films. In a film career spanning 40 years, she has received three Filmfare Awards South, the Nandi Awards and the Tamil Nadu State Film Award."}, {"id": "b023", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the reported changes in export revenues for film, fashion, and music attributable to the agency's interventions?", "ev": "(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Trinidad and Tobago > Government and politics > Disaster management and response > Local response) The Ministry of Rural Development and Local Government, along with regional and municipal corporations, are the first responders to major disasters. Each corporation maintains a Disaster Management Unit (DMU) responsible for managing all phases of extreme weather events within their local area. In Tobago, the Tobago Emergency Management Agency (TEMA), under the Tobago House of Assembly, handles disaster and emergency management. The Trinidad and Tobago Fire Service acts as the primary emergency response agency.\n\n(Trinidad and Tobago > Economy > Economic diversification) Trinidad and Tobago, in an effort to undergo economic transformation through diversification, formed InvesTT in 2012 to serve as the country's sole investment promotion agency. This agency is aligned to the Ministry of Trade and Industry and is to be the key agent in growing the country's non-oil and gas sectors significantly and sustainably.\n\n(Trinidad and Tobago > Government and politics > Law enforcement and crime) The primary law enforcement agency of Trinidad and Tobago is the Trinidad and Tobago Police Service under the Ministry of Homeland Security. The current minister is Roger Alexander. On June 13, 2025 the House of Representatives approved a government motion for Acting Senior Superintendent of Police Allister Guevarro to be Commissioner of Police (CoP). Another law enforcement agency is the Trinidad and Tobago Municipal Police Service (TTMPS) under the Ministry of Rural Development and Local Government. They work within the various city, borough, and regional corporations. The current minister is Khadijah Ameen with the current administrator of the TTMPS being Assistant Commissioner of Police (ACP) Wayne Mystar Some other law enforcement agencies include:  Ministry of Defence  Ministry of Justice  Ministry of Homeland Security  Ministry of Finance  Ministry of Agriculture, Land and Fisheries  Ministry of Transport and Civil Aviation"}, {"id": "b024", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which major awards and nominations has she received for work in Kannada, Tamil, or Telugu films?", "ev": "(Vanisri > Abstract) Vanisri (born Rathna Kumari) is an Indian actress known for her works predominantly in Telugu, Tamil, and Kannada films. In a film career spanning 40 years, she has received three Filmfare Awards South, the Nandi Awards and the Tamil Nadu State Film Award.\n\n(Tulasi (actress) > Abstract) P. A. Tulasi (born 20 June 1967) is an Indian actress who primarily works in Telugu, Kannada, and Tamil cinema. Later she appeared in lead actress and supporting actress roles. She has acted in over 300 films in Telugu, Kannada, Tamil, Malayalam, and Bhojpuri languages. She won two Nandi Awards and one Filmfare Award.\n\n(List of awards and nominations received by Fahadh Faasil > Filmfare Awards South) The Filmfare Awards South are annual awards that honour artistic and technical excellence in the Telugu cinema, Tamil cinema, Malayalam cinema and Kannada cinema. They are presented by Filmfare magazine of The Times Group. Fahadh has won four awards from eight nominations.\n\n(List of awards and nominations received by Fahadh Faasil > IIFA Utsavam) The IIFA Utsavam rewards the artistic and technical achievements of the South Indian film industry. The ceremony is organised by Wizcraft International, and represents Tamil cinema, Telugu cinema, Malayalam cinema and Kannada cinema. Fahadh has received five nominations.\n\n(Lakshmi (actress) > Early life) Lakshmi was born and raised in Chennai, Tamil Nadu. Her mother Kumari Rukmini was a Tamil actress. Her father, Yaragudipati Varada Rao, was a Telugu producer, director, thespian, screenwriter, editor and actor known for his works predominantly in Telugu, Kannada, Malayalam and Tamil Cinema."}, {"id": "b025", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What criticisms or limitations have been raised about Welsh Labour's handling of national identity and relations with Plaid Cymru?", "ev": "(Plaid Cymru > Abstract) Plaid Cymru (English: / p l aɪ d ˈ k ʌ m r i / plyde KUM -ree; Welsh:; lit. ' Party of Wales ', officially Plaid Cymru – the Party of Wales, and often referred to simply as Plaid) is a centre-left to left-wing Welsh nationalist political party in Wales, that supports Welsh independence from the United Kingdom. It campaigns on a platform of social democracy and civic nationalism. The party is a supporter of the European Union and is a member of the European Free Alliance (EFA). The party holds 4 of 32 Welsh seats in the UK House of Commons, 43 of 96 seats in the Senedd, and 200 of 1,234 principal local authority councillors. Plaid was formed in 1925 under the name Plaid Genedlaethol Cymru (' the national party of Wales ') and Gwynfor Evans won the first Westminster seat for the party at the 1966 Carmarthen by-election.  In 1999 (in the first devolved Welsh Assembly election), Plaid Cymru gained considerable ground in traditionally Labour heartlands. These breakthroughs were part of the intentional aim to win more seats in the Welsh valleys and North East Wales, which continues to be an ambition today. The party have mostly been in opposition in the Senedd. Although under the leadership of Ieuan Wyn Jones, the party was part of a coalition as a junior partner with Welsh Labour between 2007 and 2011. Wyn Jones became the deputy First Minister and Minister for the Economy and Transport, alongside other Plaid MSs who also joined the cabinet.  After losses in the 2011 Assembly elections and dropping down to being the third largest party, Wyn Jones stepped down. He was succeeded by Leanne Wood. In the 2016 Assembly elections Wood managed to win her constituency seat of Rhondda meaning the party gained one seat, and became the official opposition once again, although only for a brief period. In 2018 following internal pressure and a leadership contest, Adam Price defeated Wood and was elected the new leader. Following the 2021 Senedd election Plaid formed a co-operation agreement with the Welsh Labour government. In May 2023 Price resigned as leader following the publication of a report which detailed failings by the party to prevent sexual harassment and bullying. In June 2023 Rhun ap Iorwerth was elected unopposed as leader. The party won both its target seats in the 2024 general election, therefore becoming the second largest party representing Wales in the House of Commons.  Plaid Cymru won a plurality in the 2026 Senedd election with 43 out of 96 seats, and are expected to form the next Welsh government, with Rhun ap Iorwerth becoming the first Plaid Cymru First Minister.\n\n(Senedd > Composition prior to dissolution > Government formation) Welsh Labour won 30 seats out of 60 in the 2021 Senedd elections. On 9 May 2021 the First Minister, Mark Drakeford MS said \"We have demonstrated over a number of governments that you can govern successfully on 30 seats, but I'm open to working with any party where there is common ground between us.\"  On 22 November 2021, a deal between Welsh Labour and Plaid Cymru was announced. The agreement was not one which saw Plaid\n\n(2026 Senedd election > Background) In the 2021 Senedd election, Welsh Labour won another government with one seat short of a majority. Shortly after, they entered a co-operation agreement with Plaid Cymru, which fell short of a typical coalition or confidence and supply agreement but represented some degree of policy collaboration. At the 2022 Welsh local elections, the Welsh Conservatives suffered losses to Plaid Cymru and Labour.  In December 2023, Mark Drakeford announced he would stand down as First Minister, following the election of his successor. The ensuing Welsh Labour leadership election was won narrowly by Vaughan Gething. The Gething government lasted only until July 2024 due to two distinct scandals relating to allegations of cronyism and allegations that Gething had lied about deleting text messages relating to the COVID-19 pandemic. During this time, Plaid Cymru left the co-operation agreement.  In the midst of this, at the 2024 United Kingdom general election in Wales, Labour won the most seats and the Conservatives were wiped out: losing all their Welsh seats. Later in July, Gething announced he would stand down after a process to select his successor. The following July 2024 Welsh Labour leadership election was uncontested, with Eluned Morgan being elected.  At the UK-wide level, a number of other factors influenced the election, including various issues relating to the Starmer ministry and the ongoing United Kingdom cost-of-living crisis.  In October 2025, Plaid Cymru won the Caerphilly by-election from Labour, who had held the seat since the Senedd's inception in 1999 and its Westminister counterpart since the seat's creation in 1918.  Since the middle of the Gething Government, and continuing through successive events, Welsh Labour's polling performance had declined. Welsh Labour had previously been the most successful political party in the democratic era, having the longest winning streak of any political party. The 2026 vote is correspondingly considered to be seismic for Welsh politics and was touted as the \"most consequential Senedd election since 1999\". It has also attracted \"unprecedented\" interest internationally in Welsh politics, primarily from other European nations. Polls suggested a close race between Plaid Cymru and Reform UK.  The 2026 Senedd election was the first to feature an online elections information platform, vote.wales, managed by the Electoral Management Board for Wales, part of the Democracy and Boundary Commission Cymru.\n\n(2022 Welsh local elections > Background) In the local elections in 2017, 1,271 seats were elected. Welsh Labour won 468 seats, independent candidates won 309 seats, Plaid Cymru won 208 seats, the Welsh Conservatives won 184 seats, and the Welsh Liberal Democrats won 63 seats. Other parties including the Wales Green Party won 22 seats. The 2022 Welsh local elections were initially scheduled for 2021, to give councillors a four-year term, but they were delayed to 2022 to avoid clashing with the 2021 Senedd election. The 2021 Local Government and Elections (Wales) Act permanently changed the term length for councillors from four years to five years.  Ahead of the 2022 elections, eleven of the twenty-two councils in Wales were under no overall control with no single party holding more than half of the seats. Labour controlled seven councils, Independents controlled two councils, and the Conservatives and Plaid Cymru each controlled one council."}, {"id": "b026", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the comic's narrative setting, historical period in Anatolia, and how is that setting described in synopses?", "ev": "(One Piece > Reception > Sales) One Piece is the best-selling manga series in history; in 2012, Oricon, a Japanese company that began its own annual manga sales ranking chart in 2008, reported that the series was the first to sell 100 million copies (the company does not report on sales figures before April 2008). The series had over 300 million copies in circulation by November 2013; over 440 million copies in circulation worldwide by May 2018; 460 million copies by December 2019; 470 million copies by April 2020; and 480 million copies in circulation in forty-three countries worldwide by February 2021. It reached 490 million copies in print worldwide by July 2021. By August 2022, the manga had reached 516.566 million copies in circulation worldwide. By March 2026, it had over 600 million copies in circulation worldwide. By 2004, the brand's merchandise had made more than $1 billion in retail sales in Japan.  One Piece was the best-selling manga series for eleven consecutive years from 2008 until 2018. In 2019, the manga did not top the chart for the first time in twelve years, ranking second in the annual manga sales ranking with over 10.1 million copies sold, although it remained as the best-selling manga by volume in its twelfth consecutive year. It was the third best-selling manga series in 2020, with over 7.7 million copies sold, while volumes 95–97 were the 23rd–25th best-selling manga volumes of 2020, behind the first twenty-two volumes of Demon Slayer: Kimetsu no Yaiba. In 2021, it was the sixth best-selling manga with over 7 million copies sold, while volumes 98, 99, and 100 were the sixth, eighth, and ninth best-selling manga volumes, respectively. It was the fourth best-selling manga series in 2022, with over 10.3 million copies sold; volumes 101–104 were among the 10 best-selling manga volumes of the year. It was the fifth best-selling manga series in the first half of 2023 (period between November 2022 and May 2023), with over 3.5 million copies sold, while volume 105 was the best-selling manga volume from the same period; volume 104 placed nineteenth. Volumes 105–107 were among the best-selling manga volumes of 2023. Volume 108 was Shueisha 's highest first print run manga volume of 2023–2024 (period between April 2023 and March 2024), with 3.2 million copies printed.  Individual volumes of One Piece have broken publishing and sales records in Japan. In 2009, the 56th volume had a print run of 2.85 million, the highest initial print run of any manga by then. The 57th volume had a print run of 3 million in 2010, a record that was broken several times by subsequent volumes. The 60th volume had a first print run of 3.4 million and was the first book to sell over two million copies in its opening week on Oricon book rankings, and later became the first book to sell over three million copies in Oricon's history. In 2012, the 67th volume had an initial print run of 4.05 million, holding the record of the volume with the highest number of copies in the first print. One Piece is the only manga that had an initial print of volumes of above 3 million continuously for more than ten years. In May 2023, it was reported that each of the 105 volumes, published by then, had sold over 1 million copies. Additionally, One Piece is the only work whose volumes have ranked first every year in Oricon's weekly comic chart existence since 2008.  One Piece has also sold well in North America, charting on Publishers Weekly ' s list of best-selling comics for April/May 2007 and numerous times on The New York Times Manga Best Seller list. On ICv2 ' s list of Top 25 Manga Properties Fall 2008 for North America, which is compiled by interviews with retailers and distributors, Nielsen BookScan 's Top 20 Lists of graphic novels and ICv2 ' s own analysis of information provided by Diamond Comic Distributors, One Piece came in fifteenth place. It rose to second place on their Top 25 Manga Properties Q3 2010 list. By August 2022, the manga has sold 2.9 million copies in print in North America (including single volumes and omnibus editions).  In France, One Piece is very popular and has been the best-selling manga since 2011, with over 31.80 million copies sold by August 2022. Its sales alone represented 8.5% of the French manga market by 2021. The first volume had sold more than 1 million copies in France by July 2021. The 100th volume had one of the biggest initial prints ever for a manga in the French market, selling 131,270 copies in just three days, the best-selling manga volume in a week in the country. The manga sold 6,011,536 copies in 2021. This amount represents almost 20% of the total sales in the country; almost one in five volumes of the series was sold in the year.  In Italy, One Piece had 18 million copies in circulation by April 2021, which represents around 22.5% of the series market outside Japan. In September 2021, the limited edition of the ninety-eighth volume ranked first in the best-selling books weekly ranking, marking the first time that a manga reached that achievement.\n\n(Case Closed > Reception > Popularity > Sales) By October 2021, the Case Closed manga had over 250 million copies in circulation worldwide, making it one of the best-selling manga series, having been sold in 25 countries. By January 2023, the manga had over 270 million copies in circulation worldwide. In Japan, individual volumes frequently appear on the lists of best-selling manga. Case Closed was the nineteenth best selling manga in 2011, with 2,120,091 copies sold. Nikkei Entertainment magazine published a list of top 50 manga creators by sales since January 2010, in its September 2011 issue; Gosho Aoyama, the author of Case Closed was ranked sixteenth, with 3,320,000 copies sold. It was the seventeenth best selling manga in 2012, with 2,430,572 copies sold. In 2013, Case Closed became the 24th best selling manga, with 1,966,206 copies sold. In 2024, alongside Space Brothers, Case Closed won the grand prize of Rakuten Kobo 's second E-book Award in the \"Long Seller Comic\" category.  Licensed merchandise based on Detective Conan are sold in Asia. In Japan, Detective Conan licensed merchandise sold ¥2.89 billion in 2003, ¥17.29 billion during 2005 – 2008, and ¥9.03 billion during 2010 – 2012, adding up to at least ¥29.21 billion ($366.08 million) sold in Japan between 2003 and 2012. The first volume of Case Closed appeared thrice in the top ten selling lists, right after its premiere, the same volume has also appeared in the Diamond Comic Distributors 's ranking list. Later-published volumes have appeared on The New York Times Manga Best Sellers lists. Case Closed is one of the best-selling manga in Vietnam, with volumes 93–96, surpassing the 1.5 million digital copies each by 2020."}, {"id": "b027", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What ballot access, voter registration, and absentee voting procedures were in place in Maryland for the 2008 election?", "ev": "(Flagler County, Florida > Presidental results > Voter registration) According to the Secretary of State's office, Republicans are a plurality of registered voters in Flagler County. The last Democrat to win the county was Barack Obama in 2008, and since then it has seen a gradual increase in Republican support in every election. In 2024, Donald Trump performed better in the county than any Republican since Nixon 's 1972 landslide.\n\n(Electoral fraud > Law) Because U.S. states have primary responsibility for conducting elections, including federal elections, many forms of electoral fraud are prosecuted as state crimes. State election offenses include voter impersonation, double voting, ballot stuffing, tampering with voting machines, and fraudulent registration. Penalties vary widely by state and can include fines, imprisonment, loss of voting rights, and disqualification from holding public office.  The U.S. federal government prosecutes electoral crimes including voter intimidation, conspiracy to commit election fraud, bribery, interference with the right to vote, and fraud related to absentee ballots in federal elections.  In France, someone guilty may be fined and/or imprisoned for not more than one year, or two years if the person is a public official.\n\n(2008 United States presidential election in Hawaii > Abstract) The 2008 United States presidential election in Hawaii took place on November 4, 2008, and was part of the 2008 United States presidential election. Voters chose 4 representatives, or electors to the Electoral College, who voted for president and vice president.  Hawaii, Barack Obama 's birth state, gave him 71.9% of the vote with a 45.3% margin of victory in 2008. Prior to the election, all 17 news organizations considered this a state Obama would win, or otherwise considered as a safe blue state. Hawaii has voted Democratic in every presidential election since 1988. Obama's margin of victory in this state is only surpassed by that of the District of Columbia and is the only state that gave either candidate more than 70% of the vote. Turnout in the state was much higher than previous elections.  This remains the second-best performance by any party in a presidential election in Hawaii after Lyndon Johnson's landslide election in 1964.\n\n(2008 United States presidential election in Hawaii > Electors) Technically the voters of Hawaii cast their ballots for electors: representatives to the Electoral College. Hawaii is allocated 4 electors because it has 2 congressional districts and 2 senators. All candidates who appear on the ballot or qualify to receive write-in votes must submit a list of 4 electors, who pledge to vote for their candidate and their running mate. Whoever wins the majority of votes in the state is awarded all 4 electoral votes. Their chosen electors then vote for president and vice president. Although electors are pledged to their candidate and running mate, they are not obligated to vote for them. An elector who votes for someone other than their candidate is known as a faithless elector.  The electors of each state and the District of Columbia met on December 15, 2008, to cast their votes for president and vice president. The Electoral College itself never meets as one body. Instead the electors from each state and the District of Columbia met in their respective capitols.  The following were the members of the Electoral College from the state. All 4 were pledged to Barack Obama and Joe Biden:\n\n(Election law > Abstract) Election law is a branch of public law that relates to the democratic processes, election of representatives and office holders, and referendums, through the regulation of the electoral system, voting rights, ballot access, election management bodies, election campaign, the division of the territory into electoral zones, the procedures for the registration of voters and candidacies, its financing and propaganda, voting, counting of votes, scrutiny, electoral disputes, electoral observation and all contentious matters derived from them. It is a discipline falling at the juncture of constitutional law and political science, and involves \"the politics of law and the law of politics\"."}, {"id": "b028", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "In which year did Bharath make his film debut and in which language was his debut film released?", "ev": "(Jackpot (2013 film) > Abstract) Jackpot is a 2013 Indian Hindi -language comedy thriller film directed by Kaizad Gustad starring Sunny Leone, Naseeruddin Shah, Sachiin J Joshi, and Bharath in the lead roles. This is the Bollywood debut of Tamil actor Bharath. The film was released on 13 December 2013 to highly negative reviews. It had total earnings of ₹ 50 million (US$530,000), according to Box Office India.\n\n(Babu Antony > Career) Early in his career, he started making appearances in roles like Chilambu, Mizhineerppoovukal (1986) in Malayalam. He made a mark through Fazil 's 1986 thriller Poovinu Puthiya Poonthennal. The film was remade into Tamil, Telugu, Kannada and Hindi. Babu reprised his role in all five versions. He made his debut by playing an antagonist in Bharathan 's Chilambu (1987).  In 1987, he appeared for its debut in Tamil cinema with Sathyaraj in Poovizhi Vasalile and then Makkal En Pakkam. Later with Kamal Haasan 's Vrutham (1987) in Malayalam and Per Sollum Pillai in Tamil. With Nizhalgal Ravi, he acted in a horror film, Veendum Lisa which were all commercial successes. He also played with Chiranjeevi in Pasivadi Pranam and Jebu Donga which was later a hit at the box office. He started his career as a villain and later on featured in leading roles with the image of an angry young man.  His debut film in Kannada was Shanti Kranti (1991). His movies like Aparahnam (1991), Gandhari (1993), Rajadhani (1994), Bharanakoodam (1994), Chantha (1995), Special Squad (1995) and Indian Military Intelligence (1995) helped him to build a large audience and fan following for him. Apart from these, he has worked as many different characters such as an ex-terrorist role in Aparahnam, a king's role in Vaishali (1988), an impecunious man in Sayahnam (2000). Uppukandam Brothers (1993) gave a breakthrough for Babu's career in starring roles.  He made his debut in Hindi cine-industry with the movie Hatya in 1988. He is also in Telugu films including Lorry Driver (1990), Sathruvu (1991) and Nippu Ravva (1993). His debut movies in English Made in USA (2005) and Leader (2009) in Sinhala. His other Tamil hits were Anjali (1990), Surieyan (1992), Airport (1993), Attahasam (2004), Vinnaithaandi Varuvaayaa (2010), Kanchana (2011), Aadhi-Bhagavan (2013), Kaaviya Thalaivan (2014), Kaaka Muttai (2015), Adanga Maru (2018), Ponniyin Selvan (2022), Ponniyin Selvan: II (2023) and Leo (2023).\n\n(Sanjay Dutt > Career > Expansion into South Indian films and commercial success in supporting roles (2016–present)) Vidhu Vinod Chopra on 29 September 2016 announced that the third part of Munna Bhai series, starring Dutt in the title role, would begin soon. However, as of 2024, production on the film has still not commenced.  In 2017, following his return to prison in 2013 to serve the remainder of his sentence and his release in 2016, Dutt appeared as the lead in Bhoomi, directed by Omung Kumar. In 2018, he starred in Saheb, Biwi Aur Gangster 3. On 29 June 2018, his biopic Sanju released in which he made a special appearance. He then produced and starred in Prassthanam, which released on 20 September 2019.  Due to the COVID pandemic, Dutt then had four OTT releases. First was Sadak 2, a sequel to his 1991 film Sadak, co starring Alia Bhatt and Aditya Roy Kapur. The trailer for the film became the most disliked trailer of all time, with fans critical of nepotism following the death of Sushant Singh Rajput. The film was universally panned and some claimed it to be one of the worst films in Dutt's career. Then came Netflix release Torbaaz, an action thriller set in Afghanistan. His 2021 release Bhuj: The Pride of India, which featured an ensemble cast consisting of Ajay Devgn, Sonakshi Sinha and Nora Fatehi, also received negative reviews. However, in 2022, Dutt appeared in Toolsidas Junior, a sports drama which won the National Film Award for Best Feature Film in Hindi.  Also in 2022, Dutt made his debut in Kannada cinema as Adheera, the main antagonist in K.G.F: Chapter 2, the sequel to the blockbuster Kannada film, K.G.F: Chapter 1. The movie was a financial success. However, his other 2022 theatrical releases were financial flops - the period epic Shamshera, directed by Karan Malhotra and starring Ranbir Kapoor, in which he again played a key antagonist, and Samrat Prithviraj alongside Akshay Kumar.  In 2023, Dutt performed a cameo in Shah Rukh Khan starrer Jawan and played a key antagonist in Lokesh Kanagaraj 's Leo (2023) alongside Vijay, making his debut in Tamil cinema. Both were huge financial successes. In 2024, he reunited with Raveena Tandon in the digital film Ghudchadi and made his Telugu cinema debut with Puri Jagannadh 's Double iSmart, which was a box office debacle. In 2025, he returned to lead roles, playing the lead in The Bhootnii, which was poorly received and failed at the box office. He next appeared in Housefull 5 in 2025 as Chief Inspector Baba. The film was a commercial success. In the same year, he starred in Baaghi 4 alongside Tiger Shroff, playing the main antagonist. Critics noted that Dutt's role was too brief for him to make an impact. The film was poorly received and underperformed commercially. His last release of 2025 was the action-thriller Dhurandhar, where he played a supporting role. The film went on to become the highest grossing Indian film of 2025 and one of the highest grossing Hindi films of all time. Dutt started the year 2026 with the Telugu film The Raja Saab, which received negative reviews, eventually becoming a box office bomb. Dutt next appeared in Dhurandhar: The Revenge, which also got successful like first part.  Dutt appeared in his Marathi debut in the Marathi - Hindi bilingual Raja Shivaji. He will next appear in Baap, the Kannada film KD - The Devil, an untitled film with Arshad Warsi, his production The Virgin Tree and the big-budget international film The Good Maharaja.\n\n(Kamal Haasan > Film career > 1980–1989) Haasan's films during the 1980s included the 1980 Tamil-language Varumayin Niram Sivappu, the film was simultaneously shot in Telugu as Aakali Rajyam, in which he played an unemployed youth and earned him a first Filmfare Award in Telugu. In 1980 he appeared in the drama film Ullasa Paravaigal, Guru and Maria My Darling. Haasan made his debut in Hindi cinema with Ek Duuje Ke Liye (1981), the remake of his own acted Telugu -language film Maro Charitra directed by K. Balachander (which earned him his first Filmfare Hindi-language nomination). He made his 100th film appearance in 1981 in Raja Paarvai, debuting as a producer. Despite the film's relatively poor box-office performance, his portrayal of a blind session violinist earned him a Filmfare Award. After a year of starring in commercial films, Haasan won the first of three National Awards for Best Actor for his portrayal of a schoolteacher caring for an amnesia patient in Balu Mahendra 's Moondram Pirai, later reprising his role in the Hindi version, Sadma. During this period he focused on Bollywood remakes of his Tamil films, including Yeh To Kamaal Ho Gaya and Zara Si Zindagi. In 1983 he appeared in Sagara Sangamam, directed by K. Viswanath. His portrayal of an alcoholic classical dancer won him his first Nandi Award for Best Actor and his second Filmfare Best Telugu Actor Award.  After 1984's multistarrer Raaj Tilak, Haasan appeared in Saagar (released 1985), winning the Filmfare Best Actor Award and nominated for the Best Supporting Actor award. The film was India's representative for the Best Foreign Language Oscar in 1985. He left Bollywood temporarily after Geraftaar and Dekha Pyar Tumhara to feature in Japanil Kalyanaraman (a sequel to his 1979 Kalyanaraman).  In 1986, Haasan produced the technically brilliant Vikram and collaborated with Kodandarami Reddy for Oka Radha Iddaru Krishnulu and then K. Viswanath in Swathi Muthyam, playing a cognitively disabled person who tries to change society and won him his second Nandi Award for Best Actor. it was India's entry for Best Foreign Language Film at the Academy Awards in 1986. These Tollywood films found him a large audience in Andhra Pradesh, and many of his later Tamil films were dubbed into Telugu.  Following Punnagai Mannan (in which he played two roles, including a satire of Charlie Chaplin as Chaplin Chellappa) and Kadhal Parisu, Haasan appeared in Mani Ratnam 's 1987 film Nayakan. He received his second Indian National Award for his performance; Nayakan was submitted by India as its entry for Best Foreign Language Film at the 1987 Academy Awards, and is on the Time's All-Time 100 Movies list. Haasan appeared in his only dialogueless film to date: Pushpaka Vimana (1987) a black comedy film, in which he played an unemployed youth and earned him a first Filmfare Award in Kannada. In 1988 he appeared Unnal Mudiyum Thambi, Malayalam film Daisy and Sathyaa which were his own productions. Haasan's all four films of 1989 were major success, Apoorva Sagodharargal, where he played a dwarf, then Chanakyan, an original Malayalam film, later Vettri Vizhaa (where he played an amnesiac) and finally Haasan played two parts in Indrudu Chandrudu, winning the Filmfare Best Actor and won him his third Nandi Award for Best Actor for his performance. By the end of the 1980s Haasan was successful in the Malayalam, Kannada, Telugu and Hindi film industries, with Filmfare Awards in each industry and two national awards.\n\n(Sandy (choreographer) > Career > Further career (2019-present)) In 2021, he appeared in the horror film 3:33 as the lead. A reviewer of The Times of India stated, \"The film then throws stuff like semi-evil numbers, mediums who communicate with ghosts and more scenes with Kathir that may or may not be bad dreams, but by then, the film stops being truly scary and turns exhausting\". In 2023, he appeared in the film Leo alongside actor Vijay where Sandy portrays the character of a robber.  In 2022, Sandy was the initial cast for the role Samson in the Kannada film Head Bush which starred Dhananjaya. However he opted out of the role and was replaced by Balu Nagendra.  In 2025, Sandy choreographed the song \" Monica \" for the Tamil film Coolie. Then he made his Malayalam debut in the superheroine film Lokah Chapter 1: Chandra as the antagonist, Inspector Nachiyappa Gowda. It emerged as the highest grossing Malayalam film of all time. He is also playing a role in the Kathanar: The Wild Sorcerer alongside Jayasurya and Anushka Shetty. He also made his Telugu debut in the horror film Kishkindapuri as the antagonist Vishrawaputra.  Sandy also signed a role with Malayalam director Dhananjay Shankar in the action thriller film Bha. Bha. Ba.. In 2026, he announced his lead role in a Tamil alongside Kavin and Priyanka Mohan which is currently undergoing filming and production and is titled #Kavin09."}, {"id": "b029", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have the team's FIFA world rankings changed year-by-year from formation to present?", "ev": "(Refik Šabanadžović > International career > Bosnia and Herzegovina) In March 1993, while the Bosnian War was raging, 27-year-old Šabanadžović took part in two friendly matches as part of \"Bosnia-Herzegovina Humanitarian Stars\" versus K.R.C. Genk and 1. FC Kaiserslautern in Genk and Koblenz, respectively. The hastily arranged team also featured many Bosnian born players who previously played in the Yugoslavia national team such as Faruk Hadžibegić, Safet Sušić, Mehmed Baždarević, Mirsad Baljić, Davor Jozić, Blaž Slišković, Haris Škoro, Semir Tuce, Meho Kodro, Predrag Jurić, and Husref Musemić. Though the matches only had humanitarian character, they were played with FIFA's approval and were widely seen as the first step in the eventual formation of the Bosnia and Herzegovina national football team.  Once the Bosnian national team started playing official matches in late November 1995, Šabanadžović didn't make further appearances.\n\n(List of Bosnia and Herzegovina football champions > List of champions > National Competitions > War in Bosnia and Herzegovina) After the breakup of Yugoslavia, and following proclamation of independence in late winter 1992, the Bosnian Football Association (N/FSBiH) applied for membership with FIFA and UEFA. Meanwhile, due to the outbreak of the Bosnian War in April 1992, no games were played in the 1992–93 season. In late 1993 some parts of the country re-launched football competitions with reduced scope. But just as the country was divided along ethnic lines, so was football.  In 1993, Bosnian Croats launched the Football Federation of Herzeg-Bosnia and its own First League of Herzeg-Bosnia, in which only Croat clubs competed on a parochial scale within the limits of West Herzegovina and few other enclaves. In the same year, Bosnian Serbs organized the First League of the Republika Srpska on a territory held by the Republika Srpska regime. Only football on territory under the control of the Republic of Bosnia and Herzegovina institutions and auspices of the N/FSBiH, at the time consequently with Bosniak majority, apart from a brief competition for the season 1994–95 (won by Čelik), came to a standstill. Competition under N/FSBiH auspices did not resume until the 1995–96 season when the Bosnian First League was officially launched.\n\n(Road signs in Bosnia and Herzegovina > Abstract) Road signs in Bosnia and Herzegovina do not differ much from the rest of Europe, such as Croatia, Slovenia, Serbia and North Macedonia. The Ministry of Transportation of Bosnia and Herzegovina regulates them. Bosnia and Herzegovina drives on the right as with the rest of Europe, except for Cyprus, Ireland, Malta and the United Kingdom. Bosnian and Herzegovinan road signs have two scripts, Latin and Cyrillic script.  The former Yugoslavia had originally signed the Vienna Convention on Road Signs and Signals on November 8, 1968 and ratified it on June 6, 1977. Yugoslavia formerly used a yellow background on warning signs. After the breakup of Yugoslavia when Bosnia and Herzegovina declared its independence in 1992, the country succeeded to the Vienna Convention on January 12, 1994.  Bosnian and Herzegovinan road signs use the SNV typeface.\n\n(Ervin Zukanović > International career) In October 2012, Zukanović received his first senior call up to Bosnia and Herzegovina, for 2014 FIFA World Cup qualifiers against Greece and Lithuania. He debuted against the latter on 16 October.  Zukanović was selected in Bosnia and Herzegovina's preliminary squad for the 2014 FIFA World Cup. He failed to join the team, which had a training camp in the United States, due to visa problems. However, he later blamed the Bosnian FA, which subsequently got him dropped from the team.  He retired from international football on 20 October 2020."}, {"id": "b030", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Who have been the longest-serving head coaches and captains since the team's establishment?", "ev": "(Rusmir Cviko > Managerial career > Bosnia and Herzegovina national teams) From 2004 until 2008, Cviko was a youth National Team coach in the FA of Bosnia and Herzegovina. In 2007, he became one of the coaches of the U21 National Team of Bosnia and Herzegovina. He remained in that position until 2009.  During his tenure at the Bosnian FA, he also served as the head scout of the A National Team of Bosnia and Herzegovina. In 2014, Cviko held the position of coach and scout with the youth National Team in the FA.\n\n(Human rights in Bosnia and Herzegovina > History) Ethnic conflict has been prominent in the Bosnian and Herzegovinian society since the breakup of Yugoslavia. The three main ethnic groups are the Bosniaks, who are predominantly Muslim; the Croats, who are Catholic; and the Serbs, who are Eastern Orthodox. This ethnic conflict resulted in the Bosnian War which took place between 1992 and 1995 following Bosnia and Herzegovina's independence from the Socialist Federal Republic of Yugoslavia. The war resulted in death toll of over 101,000 people. War crimes and human rights violations were perpetrated by all nationalities involved. The largest amount of war crime charges were brought against the Serbs.\n\n(Road signs in Bosnia and Herzegovina > Abstract) Road signs in Bosnia and Herzegovina do not differ much from the rest of Europe, such as Croatia, Slovenia, Serbia and North Macedonia. The Ministry of Transportation of Bosnia and Herzegovina regulates them. Bosnia and Herzegovina drives on the right as with the rest of Europe, except for Cyprus, Ireland, Malta and the United Kingdom. Bosnian and Herzegovinan road signs have two scripts, Latin and Cyrillic script.  The former Yugoslavia had originally signed the Vienna Convention on Road Signs and Signals on November 8, 1968 and ratified it on June 6, 1977. Yugoslavia formerly used a yellow background on warning signs. After the breakup of Yugoslavia when Bosnia and Herzegovina declared its independence in 1992, the country succeeded to the Vienna Convention on January 12, 1994.  Bosnian and Herzegovinan road signs use the SNV typeface.\n\n(Refik Šabanadžović > International career > Bosnia and Herzegovina) In March 1993, while the Bosnian War was raging, 27-year-old Šabanadžović took part in two friendly matches as part of \"Bosnia-Herzegovina Humanitarian Stars\" versus K.R.C. Genk and 1. FC Kaiserslautern in Genk and Koblenz, respectively. The hastily arranged team also featured many Bosnian born players who previously played in the Yugoslavia national team such as Faruk Hadžibegić, Safet Sušić, Mehmed Baždarević, Mirsad Baljić, Davor Jozić, Blaž Slišković, Haris Škoro, Semir Tuce, Meho Kodro, Predrag Jurić, and Husref Musemić. Though the matches only had humanitarian character, they were played with FIFA's approval and were widely seen as the first step in the eventual formation of the Bosnia and Herzegovina national football team.  Once the Bosnian national team started playing official matches in late November 1995, Šabanadžović didn't make further appearances.\n\n(Human rights in Bosnia and Herzegovina > War crimes) Throughout the 1992-1995 Bosnian War, a large number of human rights violations occurred. These included ethnic cleansing, extrajudicial executions, rape and torture. In December 2017, the International Criminal Tribunal for the Former Yugoslavia, the United Nations ’ court created to prosecute war crimes that took place in the Bosnian War, closed. Domestic courts have since been responsible for prosecuting war crimes and crimes against humanity that took place during the war. The United Nations Human Rights Council's Report of the Office of the United Nations High Commissioner for Human Rights Compilation on Bosnia and Herzegovina reported concerns that Bosnia and Herzegovina's domestic courts had been slow to complete prosecution of war crime cases. Victims of rape and torture during the war experience numerous challenges in achieving legal justice, facing up to €5,000 in court fees if their case is not successful."}, {"id": "b031", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What debates or criticisms have arisen about media coverage, visibility, or gender equity related to the Ashbourne Cup?", "ev": "(1992 All-Ireland Senior Camogie Championship > Final) Fiona O'Driscoll got the only goal of the final in the 24th minute and Cork had little to worry about as they led by four points at half time and won by eleven. Desmond Fahy’s evocative intro to the Irish Times report of the final read  One week on, Clonllffe Road was eerily quiet before yesterday’s ALL-Ireland senior camogie final between Cork and Wexford. Some optimistic hawkers were taking advantage of the last opportunity of the year to sell some colours. This, however, is not to detract from what went on inside Croke Park. Cork and Wexford served up an entertaining and, at times, highly skilled final, that deserved a better crowd.\n\n(Emer Dillon > Abstract) Emer Dillon (born 1983 or 1984) is an Irish camogie player. She won several All-Ireland Senior Camogie Championship titles with Cork, including in the 2002, 2005, 2006 and 2009 All-Ireland Senior Camogie Championships. She received a Camogie All-Star Award in 2005, and was also nominated for an All-Star following the 2006 campaign. By 2010, Dillon had retired from inter-county camogie.  At club level, Dillon played camogie with Ballygarvan GAA. She has also played hockey for the Cork Harlequins club, and previously represented Munster and Ireland in the same sport.\n\n(1992 All-Ireland Senior Camogie Championship > Abstract) The 1992 All-Ireland Senior Camogie Championship was the high point of the 1992 season. The championship was won by Cork, who defeated Wexford by a 14-point margin in the final for their third successive success. The match drew an attendance of 4,000.\n\n(Kathleen Buckley > Abstract) Kathleen 'Kitty' Buckley is a former camogie player, five time All Ireland senior medalist and captain of the All Ireland Camogie Championship winning team in 1941. In the final of that year, she scored a record six goals of Cork's seven. She had previously featured on All Ireland senior final panels in 1934 (as a substitute), 1935, 1936, 1939, and 1940.\n\n(Kathleen Buckley > Career) With UCC, she won Ashbourne Cup medals in 1936 and 1937. She was a prolific goalscorer with both club and county, reportedly scoring nine goals for Cork in their 14–0 to 1–1 defeat of Clare in the first round of the championship on the week before Cusack Park, Ennis was opened in 1936, and scoring two goals in the All Ireland final of that year. She scored a goal in the 1938 final, in which Cork were beaten by Dublin, a further goal each in both the 1939 and 1940 finals when Cork beat Galway and in the 1942 replay when Cork lost to Dublin."}, {"id": "b032", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did Maryland's 2008 presidential results compare to its results in the 2004 and 2012 presidential elections?", "ev": "(2008 United States presidential election in Hawaii > Abstract) The 2008 United States presidential election in Hawaii took place on November 4, 2008, and was part of the 2008 United States presidential election. Voters chose 4 representatives, or electors to the Electoral College, who voted for president and vice president.  Hawaii, Barack Obama 's birth state, gave him 71.9% of the vote with a 45.3% margin of victory in 2008. Prior to the election, all 17 news organizations considered this a state Obama would win, or otherwise considered as a safe blue state. Hawaii has voted Democratic in every presidential election since 1988. Obama's margin of victory in this state is only surpassed by that of the District of Columbia and is the only state that gave either candidate more than 70% of the vote. Turnout in the stat
