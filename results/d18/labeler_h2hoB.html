n 2014. He was the first Chairman of the Telangana Sahitya Akademi.\n\n(E. Peddi Reddy > Abstract) Enugala Peddi Reddy is an Indian politician. He was elected to the Andhra Pradesh Legislative Assembly from Huzurabad in the 1994 and 1999 Andhra Pradesh Legislative Assembly election as a member of the Telugu Desam Party. He was sworn in as Minister of State in N. Chandrababu Naidu cabinet from October 1999 to May 2004.  In June 2019, Reddy along with BRS leader A. P. Jithender Reddy, D. K. Aruna, who was a Minister in Andhra Pradesh and former Congress MLC, P. Sudhakar Reddy joined the Bharatiya Janata Party. He left Bharatiya Janata Party (BJP) ahead of Huzurabad bye-election 2021 and joined Telangana Rashtra Samithi (TRS) on 30 June 2021.  E Peddi Reddy left BRS and joined BJP in the presence of Union Tourism Minister G Kishan Reddy in Hyderabad on 29 April 2024.\n\n(Nandini Sidda Reddy > Life > Telangana official roles) In 2014 Nandini Sidha Reddy was a member of a committee to review Telugu language textbooks. A key issue was whether they should be in the spoken Telangana dialect or the traditional \"Sanskritised\" Telugu. In 2015 he was appointed to a Telangana state government committee on the syllabus for recruitment exams. The old syllabus drafted by the Andhra Pradesh Public Service Commission in the united Andhra Pradesh would be replaced by a \"Telangana-centric new syllabus\".  Nandini Sidda Reddy was appointed as the first Chairman of the Telangana Sahitya Akademi formed on 2 May 2017. The academy was established to ensure regular research, analysis, publishing and propagation of the Telugu language. In August 2017 he headed a panel to select an eminent personality eligible for Kaloji Narayana Rao award. His academy was in charge of the World Telugu Conference held in Hyderabad from 15 to 19 December 2017. As of 2020 he was still Chairman of Telangana Cultural Academy."}, {"id": "b087", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What controversies, if any, surrounded evaluations of the player’s career compared to peers when assessing Hall of Fame or all-time status?", "ev": "(Tony Casillas > Early life) Casillas, of Mexican and Cherokee descent, was born in Tulsa, Oklahoma, on October 16, 1963. He attended Tulsa East Central High School where he was an All-State player.  He had a difficult start to his college football ca"}, {"id": "b088", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What post-election criticisms were publicly raised about the attorney general-elect's campaign conduct, conflicts of interest, or qualifications?", "ev": "(1958 Connecticut Attorney General election > Abstract) The 1958 Connecticut Attorney General election took place on November 4, 1958, to elect the Attorney General of Connecticut. Incumbent Republican Attorney General John J. Bracken did not seek re-election. Democratic nominee Albert L. Coles defeated Republican nominee Simon S. Cohen. As of 2026, this was the last time the Attorney General's office of Connecticut changed partisan control.\n\n(2026 Oklahoma Attorney General election > Abstract) The 2026 Oklahoma Attorney General election will be held on November 3, 2026, to elect the Attorney General of Oklahoma. Incumbent Republican attorney general Gentner Drummond, who was elected in 2022 with 73.8% of the vote, declined to seek re-election and is instead running for governor.\n\n(1936 Minnesota Attorney General election > Abstract) The 1936 Minnesota Attorney General election was held on November 3, 1936, in order to elect the attorney general of Minnesota. Farmer–Labor nominee and incumbent attorney general Harry H. Peterson defeated Republican nominee Oscar Youngdahl and Democratic nominee Thomas F. Gallagher.\n\n(1924 Minnesota Attorney General election > Abstract) The 1924 Minnesota Attorney General election was held on November 4, 1924, in order to elect the attorney general of Minnesota. Republican nominee and incumbent attorney general Clifford L. Hilton defeated Farmer–Labor nominee Thomas V. Sullivan and Democratic nominee Robert C. Bell.\n\n(1881 Minnesota Attorney General election > Abstract) The 1881 Minnesota Attorney General election was held on November 8, 1881, in order to elect the attorney general of Minnesota. Republican nominee and incumbent acting attorney general William John Hahn defeated Democratic nominee George N. Baxter, Greenback nominee Joseph McKnight and Prohibition nominee Alfred W. Bangs."}, {"id": "b089", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How were votes weighted between jury panels, international juries, and public televoting across the selection rounds?", "ev": "(Deslocado > Eurovision Song Contest 2025 > Festival da Canção 2025) Festival da Canção 2025 was the national final format organised by Rádio e Televisão de Portugal (RTP) to select the Portuguese representative for the Eurovision Song Contest 2025. The competition saw 20 entries competing across two semi-finals, held between 22 February and 1 March 2025, and a final on 8 March 2025. Each semi-final featured 10 competing entries from which six advanced from each show to complete the 12-song lineup in the final. Results during the semi-finals were determined by votes from a jury panel and public televoting; the first five qualifiers were based on the 50/50 combination of jury and public voting, while the sixth qualifier was determined by a second round of public televoting from the remaining entries. Results during the final were determined by the 50/50 combination of votes from seven regional juries and public televoting. Both the public televote and the juries assigned points from 1–8, 10, and 12 based on the ranking developed by both streams of voting.  Napa was officially announced to compete in Festival da Canção 2025 on 23 January 2025. \" Deslocado \" was drawn to perform eighth in the second semi-final, and was later announced as one of the six qualifiers, winning the semi-final with 20 points. The song performed seventh at the final on 8 March 2025, winning the final with 17 points, scoring the 7 points from the expert jury and 10 points from the public televote.\n\n(Lithuania in the Eurovision Song Contest 2014 > At Eurovision > Voting) Voting during the three shows consisted of 50 percent public televoting and 50 percent from a jury deliberation. The jury consisted of five music industry professionals who were citizens of the country they represent, with their names published before the contest to ensure transparency. This jury was asked to judge each contestant based on: vocal capacity; the stage performance; the song's composition and originality; and the overall impression by the act. In addition, no member of a national jury could be related in any way to any of the competing acts in such a way that they cannot vote impartially and independently. The individual rankings of each jury member were released shortly after the final.  Following the release of the full split voting by the EBU after the conclusion of the competition, it was revealed that Lithuania had placed 11th with both the public televote and the jury vote in the second semi-final. In the public vote, Lithuania scored 41 points, while with the jury vote, Lithuania scored 44 points.  Below is a breakdown of points awarded to Lithuania and awarded by Lithuania in the second semi-final and final of the contest, and the breakdown of the jury voting and televoting conducted during the two shows:\n\n(Moldova in the Eurovision Song Contest 2016 > Before Eurovision > O melodie pentru Europa 2016 > Format) The selection of the competing entries for the national final and ultimately the Moldovan Eurovision entry was initially planned to take place over three rounds. The first round was scheduled to occur on 10 December 2015 where a jury panel was supposed to shortlist fifty entries from the received submissions. Since only 47 valid entries were received at the submission deadline, this round of the selection was cancelled. The second round was a live audition of the 47 entries in front of a jury panel that took place on 19 December 2015. Entries were assessed on criteria such as voice quality, stage presence and strength of the composition. The panel selected 24 semi-finalists to proceed to the third round, the televised national final. 12 semi-finalists competed in each semi-final on 23 and 25 February 2016. Eight songs qualified to the final from each semi-final; seven of the qualifiers qualified based on the combined votes from an expert jury and public televoting results, while the eighth qualifier in each semi-fi"}, {"id": "b090", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How were illustrations produced and integrated (e.g., artist credits, workflow, episode art schedules) for the webtoon adaptation?", "ev": "(Magical Girl Ore > Abstract) Magical Girl Ore (魔法少女俺, Mahō Shōjo Ore; \"Magical Girl Me \") is a Japanese manga series written and illustrated by Icchokusen Mōkon. It began serialization in Fusion Product's Comic Be magazine in 2012, and was collected in two tankōbon volumes. The series was renewed for serialization in the same magazine in 2014. A 12-episode anime television series adaptation animated by Pierrot+ aired from April 2 to June 18, 2018.\n\n(Tower of God > Abstract) Tower of God is a South Korean manhwa released as a webtoon written and illustrated by S.I.U. It has been serialized in Naver Corporation 's webtoon platform Naver Webtoon since June 2010, with the individual chapters collected and published by Young Com in 20 volumes as of January 2026. Tower of God received official English translations by Line Webtoon beginning in July 2014.  It has received several mobile game adaptations and merchandise. In Japan, the web manhwa received an anime television series adaptation by Telecom Animation Film that first premiered on Naver Series On in South Korea, and aired in Japan immediately afterward. It originally aired from April to June 2020. A second season produced by The Answer Studio aired from July to December 2024.\n\n(Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! > Abstract) Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! (Japanese: どうも、好きな人に惚れ薬を依頼された魔女です。, Hepburn: Dōmo, Suki na Hito ni Horegusuri o Iraisareta Majo desu) is a Japanese web novel series written by Eiko Mutsuhana. It was originally serialized on the online publication platform Shōsetsuka ni Narō from April 2019 to March 2020, before being published as a light novel by Futabasha under its M Novels f imprint in two volumes featuring illustrations by Vient between October 2019 and March 2020. A manga adaptation illustrated by Kamada began serialization began serialization on Kadokawa 's KadoComi service under its Flos Comic label in August 2020, and has been compiled into six volumes as of February 2026. An anime television series adaptation is set to premiere in 2026.\n\n(In the Clear Moonlit Dusk > Abstract) In the Clear Moonlit Dusk (Japanese: うるわしの宵の月, Hepburn: Uruwashi no Yoi no Tsuki) is a Japanese manga series written and illustrated by Mika Yamamori. It began serialization in Dessert in July 2020. As of January 2026, the series' individual chapters have been collected into ten volumes. An anime television series adaptation produced by East Fish Studio and Atelier Peuplier aired from January to March 2026. A live-action film adaptation is set to premiere in October 2026.\n\n(Though I Am an Inept Villainess > Abstract) Though I Am an Inept Villainess: Tale of the Butterfly-Rat Body Swap in the Maiden Court is a Japanese light novel series written by Satsuki Nakamura. The series originated on the Shōsetsuka ni Narō website in July 2020, before being published in print with illustrations by YukiKana by Ichijinsha beginning in December 2020. A manga adaptation, illustrated by Ei Ohitsuji, began serialization in Monthly Comic Zero Sum in the same month. An anime television series adaptation produced by Doga Kobo is set to premiere in July 2026."}, {"id": "b091", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What coaching philosophies, training regimens, and technical programs have been documented for the Giza-based volleyball section?", "ev": "(2018 FIVB Women's Volleyball Challenger Cup qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball Challenger Cup qualification acted as the qualifiers section for the 2018 FIVB Women's Volleyball Challenger Cup for national teams that were members of the Asian Volleyball Confederation (AVC). This tournament was held in Almaty, Kazakhstan. The eventual winner earned the right to compete in the 2018 FIVB Women's Volleyball Challenger Cup.\n\n(2018 FIVB Women's Volleyball World Championship qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball World Championship qualification acts as qualifiers for the 2018 FIVB Women's Volleyball World Championship, to be held in Japan, for national teams which are members of the Asian Volleyball Confederation (AVC). A total of 4+1 slots (4 direct slots and 1 host slot) in the final tournament are available for AVC teams.\n\n(Abdulrahman Fawzi Hall > Abstract) Abdulrahman Fawzi Hall is a covered sports arena in Cairo, Egypt. The arena opened in 1986. The arena is the home venue of the Zamalek SC Handball team of the Egyptian Handball League, the Zamalek SC Basketball team of the Egyptian Basketball Super League, and the Zamalek SC Volleyball team of the Egyptian Volleyball League. All three teams are departments of Zamalek Sporting Club, which owns and operates the arena.\n\n(2017 FIVB Beach Volleyball World Tour > Abstract) The 2017 FIVB Beach Volleyball World Tour was the global elite professional beach volleyball circuit organized by the Fédération Internationale de Volleyball (FIVB) for the 2017 beach volleyball season. The 2017 FIVB Beach Volleyball World Tour Calendar comprised three FIVB World Tour 5-star tournaments, two 4-star, four 3-star, four 2-star and six 1-star events, the World Championships and the World Tour Finals, all organised by the FIVB.  The 2017 edition of the Swatch Beach Volleyball FIVB World Tour Finals will be held in Hamburg, Germany from 22 to 27 August.\n\n(FIVB Beach Volleyball World Championships > Abstract) The FIVB Beach Volleyball World Championships is the double-gender world championship for the sport of beach volleyball organized by the Fédération Internationale de Volleyball (FIVB) the sport's global governing body. The first official edition of the event was held in Los Angeles, United States in 1997 and tournaments had been awarded every two years since then. Before 1997, ten unofficial championships not organized by the FIVB were all held in Rio de Janeiro, Brazil between 1987 and 1996. The most recent World Championships took place in Australia in 2025.  Winning the World Championships is considered to be one of the highest honours in international beach volleyball, surpassing the FIVB Beach Volleyball World Tour and being surpassed only by the beach volleyball tournament at the Summer Olympic Games."}, {"id": "b092", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which physiological adaptations (VO2max, lactate threshold, muscle fiber composition) are associated with sprint relay performance in published sources?", "ev": "(Libby Trickett > 2005 World Aquatics Championships) In July 2005, at the 2005 World Aquatics Championships in Montreal, Canada, Trickett was one of the form swimmers of the meet. She won the 50-metre freestyle in a time of 24.59 to record her maiden championship at international level. She also achieved a silver medal in the 100-metre butterfly (57.37). She was a member of three relay teams, the 4×100-metre freestyle relay, 4×100-metre medley relay, and the 4×200-metre freestyle relay teams, winning gold (3:37.22), gold (3:57.47) and silver (7:54.00) in the respective events. Fairly new to the 200-metre freestyle event, Trickett got recorded the then fourth fastest time in history clocking 1:57.06 as lead-off swimmer in the final of the 4×200-metre freestyle relay. The time being more than 1.5 seconds faster than the individual gold medallist Solenne Figuès of France (1.58.60). Trickett did not compete in the individual 100-metre freestyle because she placed third in the event at the Australian championship, but her 100-metre freestyle split times were faster than the individual 100-metre freestyle gold medalist and world record holder Jodie Henry, which earned her the honour of swimming in the final of the medley relay. Despite not competing in the individual 100- and 200-metre freestyle, she did finish 2005 ranked number one in the world in both events.  On returning to Australia, Trickett continued her rich vein of form, lowering the 100-metre short course freestyle world record on consecutive nights at the Australian Short Course Championships to 51.70 seconds.  2005 brought a further world record in the short-course 200-metre freestyle at the Sydney, Australia stop of the 2005 FINA World Cup series on 19 November with Trickett recording a time of 1:53.29 to beat the previous record by 0.75 seconds.  However, Trickett regained her 100-metre freestyle world record on 31 January 2006 at the Australian Championships in Melbourne. Her time of 53.42 was 0.1 of a second faster than the previous record held by Henry. On 2 August 2006, German swimmer Britta Steffen broke Trickett's 100-metre freestyle world record at the 2006 European Championships in Budapest, Hungary, with a time of 53.30. Trickett again regained the world record with a time of 52.88 on 27 March 2008 at the 100-metre finals of the Australian Olympic Trials.\n\n(Barbara Krause > Abstract) Barbara Krause (later Wanja, born on 7 July 1959 in East Berlin) is a former freestyle swimmer from East Germany. She was a three-time Olympic gold medalist and eight-time world record holder. At the 1980 Summer Olympics in Moscow, Krause won gold medals in the 100 m and 200 m freestyle and in the 4×100 m freestyle relay.  Her husband, Lutz Wanja, is also a retired German Olympic swimmer.\n\n(Natalie Coughlin > International career > 2013 World Aquatics Championships) At the 2013 Phillips 66 National Championships, which also served as the selection meet for the World Championships, Coughlin decided to only take up the sprint freestyles and swam the 50 and 100-meter freestyle events. Coughlin qualified for the 50-meter freestyle and the 4×100-meter freestyle relay. Coughlin finished first in the 50-meter freestyle with a 24.97, just ahead of 16-year-old Simone Manuel, who swam a 25.01. With the first-place finish in the 50-meter freestyle, Coughlin ensured herself a relay spot since she had finished 5th in the 100-meter freestyle, with a time of 54.04.  She won a gold medal at the event on the first night of swimming competition in the 4×100 freestyle relay. She went second for team USA and swam her leg in 52.98 seconds; she was one of 6 women in the field of 32 to break the 53-second barrier.  In her final triumph, two months before her 33rd birthday in 2015, she set an American record of 27.51 seconds in the 50-meter backstroke.\n\n(Natalie Coughlin > International career > 2005–2006) At the eleventh World Aquatics Championships in Montreal, Quebec, Coughlin won five medals, including a gold and 2 silvers and 2 bronzes. Coughlin won a gold medal in the women's 200 m freestyle relay and silver medals in the 100 meter medley relay and the 100 m freestyle. She also won bronze medals in the 100 m backstroke and the 100m freestyle relay.  Coughlin worked as an in-studio host for MSNBC during the 2006 Winter Olympics in Turin, Italy.\n\n(Swimming at the 2005 World Aquatics Championships – Women's 4 × 200 metre freestyle relay > Abstract) The Women's 4x200 Freestyle Relay event at the 11th FINA World Aquatics Championships swam on 28 July 2005 in Montreal, Canada  At the start of the event, the existing World (WR) and Championships (CR) records were:"}, {"id": "b093", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which crossover or pan-Indian projects featuring Bharath expanded his audience beyond a single language market?", "ev": "(Jubair Muhammed > Abstract) Jubair Muhammed is an Indian music composer and playback singer who works in Malayalam cinema. Jubair has worked on Malayalam, Tamil, Kannada, Telugu and Hindi language films, Music Videos and Short Films.\n\n(Raghavendra (film) > Abstract) Raghavendra is a 2003 Indian Telugu -language action film directed by Suresh Krishna and written by Posani Krishna Murali. It stars Prabhas, Anshu and Shweta Agarwal. The music was scored by Mani Sharma. It was also dubbed in Hindi as Sanyasi: The Warrior Saint (2008) and Malayalam as Sakthi in spite of being remade by Suresh himself in Hindi as Rocky: The Rebel.\n\n(List of highest-grossing Indian films > Overview) Indian films have been screened in markets around the world since the early 20th century. Since 2003, there are markets in over 90 countries where films from India are screened. During the first decade of the 21st century, there was a steady rise in the ticket price, a tripling in the number of theatres and an increase in the number of prints of a film being released, which led to a large increase in the box office collections.  As of 2014, Hindi cinema represents 43% of the net box office revenue in India, while Telugu and Tamil cinema represent 36%, and other industries constitute 21%. As of 2020, the combined revenue of all other language film industries has surpassed that of the Hindi film industry. By 2021, Telugu cinema became the largest film industry of India in terms of box-office. In 2023, the Hindi film industry accounted for 44% of box office revenue, followed by the Telugu industry at 19% and the Tamil industry at 16%. The Kannada (5%), Malayalam (3%), Bengali, Marathi, Odia, Punjabi, Gujarati and Bhojpuri industries contributed to the remainder, while the foreign film industry made up 9% of the total revenue. In 2024, the Hindi and the Telugu film industries accounted for 40% and 20% of the domestic gross box office revenue respectively, followed by Tamil with 15% share and Malayalam with 10% share.\n\n(Magic Magic 3D > Abstract) Magic Magic 3D is a 2003 Indian Tamil -language children's fantasy film directed by Jose Punnoose. The film stars Suraj Balajee, S. P. Balasubrahmanyam, Tirlok Malik and Pooja Kumar. It was dubbed in Malayalam, Telugu and Hindi, with the Hindi dub being titled as Chota Jadugar (transl. Little Magician). It won the National Film Award for Best Special Effects.\n\n(P. V. Narasimha Rao > Legacy > Literary achievements) Rao was a polyglot and could speak 17 languages. In addition to his mother tongue Telugu, he had an excellent command of 10 Indian languages, Bengali, Gujarati, Hindi, Kannada, Malayalam, Marathi, Odia, Sanskrit, Tamil and Urdu, and also spoke 6 foreign languages including Arabic, English, French, German, Persian and Spanish. Due to his college education in Fergusson College in Pune, then an affiliated college of the University of Mumbai (but now with Pune University), he became a very prolific reader and speaker of Marathi. He translated the great Telugu literary work Veyipadagalu of Kavi Samraat Viswanatha Satyanarayana into Hindi as Sahasraphan. He also translated Hari Narayan Apte's Marathi novel Pan Lakshat Kon Gheto (But Who Pays Attention?) into Telugu. He was also invited to be the chief guest of Akhil Bharatiya Marathi Sahitya Sammelan in 2003, where he gave a speech in Marathi.  In his later life, he wrote his autobiography, The Insider, which depicts his experiences in politics."}, {"id": "b094", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When and how did she begin her career in modeling before entering films?", "ev": "(Vanisri > Abstract) Vanisri (born Rathna Kumari) is an Indian actress known for her works predominantly in Telugu, Tamil, and Kannada films. In a film career spanning 40 years, she has received three Filmfare Awards South, the Nandi Awards and the Tamil Nadu State Film Award.\n\n(Pooja Reddy Bora > Career) Pooja Reddy Bora is an Indian actress and model known for her work in Telugu and Kannada cinema. She began her acting career in 2018 with the Kannada film Vedanti, portraying Varsha. She expanded into Telugu cinema with notable roles in Arangetram (2023) and Tatva (2024). Her performance in Odela 2 (2025) further established her presence in the industry.  Beyond films, Pooja Reddy Bora is active in modeling, participating in various fashion events, and photoshoots. She maintains an active presence on Instagram, sharing updates about her work and personal life.\n\n(Anjali Devi > Career > As actress) She was a theatre artiste before venturing into movies, her debut film role was as Lohitasva in \" Raja Harishchandra\" in 1936. Her first film as a heroine was Kashtajeevi by L. V. Prasad in 1940, but that film was abandoned after three reels shooting. Later, C.Pullayya discovered her and gave her the opportunity to star as Mohini in Gollabhama (1947). Based on her acting ability and looks, she became a star overnight in 1947. She eventually acted in more than 350 films, majority of them in Telugu and Tamil films and a few in Hindi, Kannada films as the heroine or in character roles.  She acted in Lava Kusa, a milestone film and the first color film in the Telugu film industry in 1963. She is well known for playing Sita in Lava Kusa and her performances in films like Suvarna Sundari and Anarkali were also appreciated. Brundavanam (1992), Anna Vadina (1993) and Police Alludu (1994) were the last few films of her career. In Balaiah's Police Alludu and Anna Vadina she appeared alongside Brahmanandam. She acted in various roles, such as a damsel, an angel, a dancer, a demon, a goddess, a traditional woman and later in mother roles.\n\n(Sanjjana > Abstract) Archana Manohar Galrani, known by her stage name as Sanjjana, is an Indian model and actress who predominantly works in Kannada and Telugu films. She made her film debut in the 2005 Telugu film Soggadu. She is known for her role in the Kannada film Ganda Hendathi (2006). She played a supporting role in the 2008 Telugu film Bujjigadu starring Prabhas. In 2017, she played Chandri in the Kannada crime drama Dandupalya 2. In 2025 she participated as a contestant in Telugu reality show Bigg Boss 9 and finished as 4th runner-up of the show.\n\n(Tulasi (actress) > Career) Tulasi made her debut in the Telugu language when she was three months old in 1967. For a song in a film, a baby was needed and Tulasi was placed in the cradle after actress Savitri had requested Tulasi's mother, who was a friend of her. She was featured in a song when she was 3 + 1 ⁄ 2 years old in Jeevanatarangalu and said that she became a full-fledged actor when she was four.  She got married at age 28 to Kannada director Sivamani. She stated, \"I met him in the morning and by evening we tied the knot\". They have one son, Sai Tarun. Tulasi decided to quit acting after getting married, working only occasionally as a voice actor in Telugu films, including ones by Mani Ratnam. When her son was around six years old, she received several mother character roles. She initially declined them all, but finally signed on one Kannada film, Excuse Me, in which she played mother to Divya Spandana and which became a big hit. After that she was doing three films a year in Kannada.  She began to act mainly in mother roles in Telugu and Tamil film industries. Her notable supporting roles include performances in Sasirekha Parinayam, Mr. Perfect, Darling, Srimanthudu, Iddarammayilatho, Nenu Local, Mahanati & Dear Comrade in Telugu and Pillaiyar Theru Kadaisi Veedu, Easan, Mankatha, Sundarapandian, Aadhalal Kadhal Seiveer and Pandiya Naadu in Tamil. Tulasi has said that Aadhalal Kadhal Seiveer, in which she had played mother to Manisha Yadav 's character, changed her life and brought her an \"identity as a screen mother\". Her portrayal of Chellamma in Pannaiyarum Padminiyum was praised too, with critics stating that she was \"brilliant\", and had given her \"career best performance\"."}, {"id": "b095", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What training methods, coaching structures, and preparation programs did Australian Paralympic athletes follow in the lead-up to 1976?", "ev": "(Australia at the 2014 Winter Paralympics > Team Preparation > Pre Games Skiing Accidents) The Australian Paralympic Team suffered two major skiing accidents just prior to the games. Matthew Robinson died after a boarding accident while competing at the IPC Alpine Skiing World Cup, Whilst Robinson's event was not included in the Games, he was an integral member of the Australian Paralympic snowboard team. Less than a day after being named as Australia's flagbearer for the Sochi Paralympics, Cameron Rahles-Rahbula was injured in a large crash during the downhill training run of the 2014 Sochi Winter Paralympic Games on the eve of the opening ceremony. Rahles-Rahbula suffered knee and ankle injuries that forced him to miss his races, but he still hoped to be able to compete in his pet event, the slalom, and in the giant slalom. On 10 March 2014, it was revealed that Rahles-Rahbula has a knee fracture and would not be able to compete in any of his Paralympic events.\n\n(Australia at the 1988 Winter Paralympics > Athletes) Hans Hinterholzer and Jamie Milner were the two team coaches for the Australian Alpine skiing events at the Innsbruck Paralympics. Australia was fortunate effort to take 5 Paralympic athletes to represent Australia in the 1988 Games in Innsbruck. Each athlete who competed did not qualify for a medal at these games. Four out of five of the Australian athletes competed in the Men's Downhill, Men's Giant Slalom and Men's Slalom apart from David Munk who only participated in the Men's Giant Slalom and Men's Slalom. Each athlete had different classifications ranging from upper body disabilities to lower body disabilities. All classifications of every athlete competing in the Paralympic Games of any sort are done so by the International Paralympic Committee (IPC).  Michael Collins participated in the Men's Downhill LW6/8, Men's Giant Slalom LW6/8 and Men's Slalom. He was ranked 10 out of 23 athletes with a time of 1:18.86 in the Men's Downhill LW6/8. In the Men's Giant Slalom LW6/8 and the Men's Slalom Collins was unable to finish. Michael Collins was classed as an athlete who had upper extremity issues. This can range from a skier being classified in the LW6/8 category if they have paralysis, motor paresis affecting one arm or a single upper arm amputation.  Kyrra Grunnsund represented Australia in five Paralympics. He was the first Australian to compete at both the Summer and Winter Paralympics. He competed in both the Alpine and Cross-country skiing over the course of his career but in the 1988 Winter Paralympic Games he only competed in the Men's Downhill LW4, Men's Giant Slalom LW4 and Men's Slalom LW4. He ranked 13th out of 14 athletes in the Men's Downhill LW4 with a time of 1:19.78. In the Men's Giant Slalom LW4 and Men's Slalom LW4 he did not finish. Kyrra Grunnsund was classified as an athlete who had a disability in one lower extremity. He is a below-the-knee amputee and classed in the LW4 category for the Paralympics.  Evan Hodge competed in the 1988 men's Downhill LW2, Men's Giant Slalom LW2 and Men's Slalom. All three events he qualified and was ranked into the top 15 athletes. His best time was in the Men's Slalom LW2 with a time of 1:34.05 and was ranked 8th out of 33 competitors. Hodge was classified with having severe disability in a lower limb where an amputation or arthrodesis in the leg and hip. Specific skiing and training techniques have been developed for this LW2 skiers that address their disability type and equipment use. A factoring system is used in both para-alpine and para-Nordic to allow different classes to compete against each other when there are not many competitors in one class in a competition.  Michael Milton grew up in a skiing family. At the age of 9 years old, his left leg was amputated above the knee due to bone cancer. After having an amputation, he was more determined to be able to ski again. Milton debuted in the 1992 Tignes-Albertville Winter Paralympics and has an extensive career in both Summer and Winter Paralympic games. He did compete in the 1988 Innsbruck games but did not qualify for a medal in any of the events he competed in. His best ranked event in the 1988 Paralympics was in the Men's Giant Slalom LW2 where he was ranked 11th out of 33 competitors. Like teammate Hodge, Milton was classed in the LW2 category for the Winter Paralympic games.  David Munk is an Australian Paralympic Alpine sit skier. He debuted in the 1992 Winter Paralympics where he won a bronze medal in the Men's Super-G LW11. At the 1988 Winter Paralympics he was unfortunately disqualified from the Men's Giant Slalom LW10 but was able to rank 13th out of 29 competitors in the Men's Slalom LW10. He was classed in the LW10 category due to the little support he had when sitting up right. The International Paralympic Committee defined this para-alpine classification as; a disability in the lower limbs and no sitting balance. Athletes who were classed in this category were given physical equipment adapted to their specific needs.\n\n(Italy at the Paralympics > Abstract) Italy has sent delegations to the Summer Paralympics since the first games in 1960, and to the Winter Paralympics since 1980.  The Paralympic Games are a multi-sport event for athletes with physical and sensorial disabilities. This includes athletes with mobility disabilities, amputations, blindness, and cerebral palsy. The Paralympic Games are held every four years, following the Olympic Games, and are governed by the International Paralympic Committee (IPC).\n\n(Refugee Paralympic Team at the 2020 Summer Paralympics > Abstract) The Refugee Paralympic Team, previously the Independent Paralympic Athletes Team, competed at the 2020 Summer Paralympics in Tokyo, Japan, from 24 August to 5 September 2021. The team consisted of six refugee and asylee Paralympic athletes who represent the estimated 82 million refugees in the world. The formation of the team and its six athletes was announced on 30 June 2021 in a joint statement by the IPC and UNHCR. The team had made its debut at the previous edition of the Paralympics that consisted of just two athletes. That team was considered coordinated and was referred to as \"the first\". The team was the first to enter the Japan National Stadium during the Parade of Nations at the opening ceremony."}, {"id": "b096", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Health, noise, and air quality studies or complaints associated with increased operations at Kota Kinabalu International Airport.", "ev": "(Archdiocese of Kota Kinabalu > Abstract) The Archdiocese of Kota Kinabalu (Latin language: Archdioecesis Kotakinabaluensis; Malay: Keuskupan Agung Kota Kinabalu; Mandarin: 哥打京那巴鲁总教区) is a metropolitan archdiocese of the Latin Church of the Catholic Church in Sabah, Malaysia, on the island of Borneo. The archdiocese is the oldest ecclesiastical territory in Malaysia, with a long history slowly rising along with the Catholic population from a prefecture to an archdiocese. Its cathedral archepiscopal see is Sacred Heart Cathedral, Kota Kinabalu. The patron saint of the archdiocese is St. Joseph, Spouse of the Blessed Virgin Mary.\n\n(Miri > Transportation > Air) Miri Airport (IATA: MYY, ICAO: WBGR) is an important gateway to the northern region of Sarawak. It is located 11 km south of Miri city. It serves as a hub for domestic, international, and rural air services. Miri Airport is the tenth busiest airport in Malaysia and second busiest in Sarawak. It provided services to 2.2 million passengers in 2013. The airport has only one direct international flight to Singapore. It also receives flights from domestic destinations such as Kuala Lumpur, Johor Bahru, Kota Kinabalu, Labuan, Kuching and other major towns in Sarawak. Miri Airport also caters flights to the Sarawak interior such as Bario, Ba'kelalan, Marudi, Lawas, Limbang, and Mukah through MASwings using DHC-6 Twin Otter aircraft.\n\n(Tun Fuad Stephens Park > Abstract) Tun Fuad Stephens Park is a recreational park in Bukit Padang, Kota Kinabalu, Sabah, Malaysia. It is built in honour of the late Chief Minister of Sabah Fuad Stephens who perished in the Double Six Tragedy in 1976.\n\n(Archdiocese of Kuala Lumpur > Abstract) The Metropolitan Archdiocese of Kuala Lumpur (Latin: Archidioecesis Kuala Lumpurensis; Malay: Keuskupan Agung Kuala Lumpur; Tamil: கோலாலம்பூர் மறைமாவட்டம்; Mandarin: 吉隆坡总教区) is an ecclesiastical territory or diocese of the Catholic Church in Malaysia. It was erected as the Diocese of Kuala Lumpur by Pope Pius XII on 25 February 1955, and was elevated to the rank of a Metropolitan Archdiocese on 18 December 1972, with the suffragan sees of Malacca-Johor and Penang. It also administers the capital city of Malaysia, Federal Territory of Kuala Lumpur as well as the federal administrative centre of Putrajaya and the urbanised states of Selangor and Negeri Sembilan in the central region as well as Pahang and Terengganu on the East Coast. The archdiocese's Mother Church and thus, seat of its Archbishop, is St. John's Cathedral. It is one of the three Roman Catholic archdioceses in Malaysia, with the ecclesiastical archdioceses of Kota Kinabalu and Kuching, both at the Borneo Islands."}, {"id": "b097", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did cross-border trade, migration, and intermarriage affect artistic styles such as Makonde carving and mask-making?", "ev": "(East African coral coast > Abstract) The East African coral coast is a marine ecoregion along the eastern coast of Africa. It extends along the coasts of Kenya, Tanzania, and northern Mozambique, from Lamu in Kenya (2º30' S) to Angoche in Mozambique (16°14 S). It adjoins the Northern Monsoon Current Coast ecoregion to the north, and the Bight of Sofala/Swamp Coast ecoregion to the south.\n\n(East African coral coast > Major habitat types) Fringing coral reefs extend along much of the coast, extending.5 to 2 km from the shore on the narrow continental shelf. Fringing reefs extend along the coasts of Kenya and Tanzania as far as the Ruvuma River, which forms the Tanzania-Mozambique boundary. The fringing reefs are interrupted by major river mouths, including the Tana and Athi rivers in Kenya and the Rufiji in Tanzania. Unguja Island has a fringing reef along its eastern shore and extending around the southern and northern tips of the island. Mafia Island has a fringing reef along its eastern shore which extends south to the Songo Songo Islands.  Seagrass beds are found in clear, shallow lagoons between the fringing reefs and the shore, and between offshore islands and the mainland.  River mouths are home to the East African mangroves. The Rufiji River delta is the largest mangrove ecosystem on the East African coast, and accounts for half of Tanzania's 55,000 ha of mangroves. Other important mangrove forests in Tanzania are in Lindi and Tanga, at the mouths of the Wami, Ruvu, Matandu and Ruvuma rivers, and on the Mafia Archipelago. Kenya has 52,980 ha of mangroves, over two-thirds of which are concentrated around Lamu. Kilifi and Kwale account for most of the rest.  Fringing reefs are uncommon along the Mozambican coast, limited by freshwater input from numerous rivers, and cold-water upwelling in the Mozambique Channel. Patch reefs are best developed on the Quirimbas Islands, Primeiras and Segundas Archipelago, and Mozambique Island and neighboring islands in Mozambique Bay. Mangroves are found in the many river mouths, and seagrass beds occur in sheltered coastal waters.\n\n(Demographics of Mozambique > Culture) Despite the influence of Islamic coastal traders and European colonizers, the people of Mozambique have largely retained an indigenous culture based on smallscale agriculture. Mozambique's most highly developed art forms have been wood sculpture, for which the Makonde in northern Mozambique are particularly renowned, and dance. The middle and upper classes continue to be heavily influenced by the Portuguese colonial and linguistic heritage."}, {"id": "b098", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which game engine or development tools were used for Spirit Hunter: Death Mark and its ports?", "ev": "(Marvel: Ultimate Alliance > Development and marketing) Most versions of Ultimate Alliance were developed using Vicarious Visions ' Alchemy engine, which was purchased from the now-defunct Intrinsic Graphics in May 2003. Raven Software developed the primary version of the game on the PS2, PS3, Xbox and Xbox 360. Vicarious Visions simultaneously ported the game to the PSP, and later to the Wii to coincide with its launch, and Beenox ported the game to Windows. During early development, Ultimate Alliance used cel-shading technology, similar to Raven's previous Marvel Comics games, X-Men Legends and X-Men Legends II: Rise of Apocalypse; however, this was dropped at some point during development. Barking Lizards Technologies used their Whiptail engine to develop the GBA version independently. The game was originally known as Marvel Legends, and had an internal working title of Marvel Comics RPG. At one point, Link from The Legend of Zelda series and Samus Aran from the Metroid series were planned to be playable characters for the Wii version; however, both characters were removed prior to release. These also led a GameCube port to be cancelled, due to the developers using a modified build running on PlayStation 2 hardware to showcase the characters. The music for the game was composed by Mark Griskey, Chance Thomas and Cris Velasco. Over 50 minutes of music was composed by the trio, including gameplay and cutscene tracks.  Marvel: Ultimate Alliance was first released on October 24, 2006, in North America. Regional releases followed throughout 2006 and 2007. The standard edition of Ultimate Alliance was also released as a companion with Forza Motorsport 2 in specially marked Xbox 360 consoles in 2007. The Gold Edition of the game was released on May 22, 2007, exclusively for the Xbox 360. This version included the two DLC packs available at the time. A 2016 version was released for PlayStation 4, Xbox One, and Microsoft Windows on July 26, 20\n\n(Rain World > Release) Videocult announced the last phases of development in early 2016. Rain World ' s animation was popularized on social media pre-release and praised by IGN for its \"uncannily fluid character animations\". Primate partially attributed this virality to GIFs, noting a Twitter post retweeted over 15,000 times. A final trailer was posted on March 8, 2017, revealing its release date; Adult Swim Games published Rain World on March 28 for PlayStation 4 and Windows.  In April 2017, the game received an update to marginally alleviate its difficulty. A major content update was planned for release later that year, which would add the local multiplayer arena mode, featuring over 50 rooms, and the Monk and Hunter. The update was released in beta in November for Windows and published officially on December 11, 2017; it was also ported to PlayStation 4 on December 21, 2018. After gauging player interest in January 2018, Videocult ported Rain World to the Nintendo Switch on December 13 in the United States and December 27 in Europe. Limited Run Games released a physical edition for PlayStation 4 later that month. In August 2025, the game was released to the Xbox Game Pass. In January 2022, due to conflicts with Adult Swim Games, Videocult announced that Rain World would be published by Akupara Games from then on after a prolonged legal dispute.  The first DLC pack, titled Rain World: Downpour, added five playable slugcats with individual storylines, over 1000 rooms across ten regions, and three game modes. It is an expansion of the \"More Slugcats\" mod and was developed by nearly 40 community modders over the course of five years. It was released for Windows on January 19, 2023, and for PlayStation 5, Xbox One, and Xbox Series X and Series S on July 11, 2023. Downpour ' s development started before the Monk and Hunter update was released. A major theme of the DLC was the passage of time and how the hostile world transforms as catastrophic events occur, placing the five slugcats' environments across different periods of time. Lead programmer Andrew Marrero intended for the Challenge mode to teach the player the game's mechanics. By offering structured tasks, the mode provides a more controlled environment for practice compared to the \"spontaneous challenges\" of the main gameplay. Lee Moriya, the creator of the Expedition game mode, said that the given quests encouraged the player to do things they would not have done normally. Marrero created Safari mode to allow the player to observe the simulated ecosystem without the stress of surviving or being pursued.  The second DLC, titled Rain World: The Watcher, added new regions, creatures, and a playable slugcat named the Watcher, also called the Nightcat. The DLC was developed by Videocult and modders that worked on Downpour; its marketing adopted alternate reality game puzzle elements for fans to decipher. The DLC was released for Windows on March 28, 2025, with content adapted from community mods. A content update was released on September 25, alongside ports for the Nintendo Switch, PlayStation 4, PlayStation 5, Xbox One, and Xbox Series X/S."}, {"id": "b099", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented financial difficulties, sponsorship withdrawals, or funding disputes has the club experienced and when did they occur?", "ev": "(North Hobart Football Club > Abstract) The North Hobart Football Club, nicknamed The Demons, is an Australian rules football club currently competing in the Southern Football League Premier Division. The club was a part of the Tasmanian Football League from the early 1900s until 2001, when it joined the Southern Football League. In 2009, North Hobart was invited into the second reincarnation of the statewide league, where it remained until 2013. After the 2013 season, its position in the league was effectively filled by the Hobart City Football Club. North Hobart returned to the Tasmanian State League in 2018. However, following the cessation of the TSL in 2024, the club rejoined the Southern Football League in 2025  In 2014, the North Hobart Football Club Inc. changed from an incorporated body to a company limited with 100% ownership of the Hobart City Football Club, with the Hobart City Demons now the trading name of North Hobart Football Club Ltd.  On October 9, 2017 the paying members of the Hobart City Demons voted 371-118 in favour of returning the playing name of the club to the North Hobart identity for season 2018 and beyond.  Players to reach Australian Football League level include Paul Williams, Peter 'Percy' Jones, Daryn Cresswell, Chris Bond, James Manson, Jim Wright, Tony Pickett, Colin Garland and several other big names. In total 54 North Hobart players have moved on to play at VFL/AFL level.  In 2005, North Hobart was the first club inducted into the AFL Tasmania Hall of Fame as a Great Club.\n\n(Hobart Town Gazette > Abstract) The Hobart Town Gazette was established in 1816 in Hobart, Van Diemen's Land (known as Tasmania since 1856) as The Hobart Town Gazette and Southern Reporter. In 1821 the name was changed to the Hobart Town Gazette and Van Diemen's Land Advertiser. In 1825 the title was split, with the government authorised publication remaining the Hobart Town Gazette, and the original editor launching the Colonial Times, and Tasmanian Advertiser. From 1882 it was known as the Hobart Gazette and from 1907 as the Tasmanian Government Gazette.\n\n(Bellerive Oval > Abstract) Bellerive Oval (known under naming rights as Ninja Stadium) is an Australian rules football and cricket stadium located in the Hobart suburb of Bellerive. With a combination of seating and standing capacity of 20,000, it is the second-largest stadium in Tasmania (behind York Park in Launceston).  The stadium is the only Tasmanian venue that regularly hosts international cricket matches. It serves as the home ground for the Tasmanian Tigers, Tasmania's state cricket team, and the Hobart Hurricanes, a Big Bash League franchise. It has hosted international Test matches since 1989 and One-Day Internationals (ODIs) since 1988.\n\n(Hawthorn Football Club > Home grounds and training and administrative base > York Park: 2001–present) Since 2001, Hawthorn's has played \"secondary\" home games at York Park (currently also known by the sponsorship name of The University of Tasmania Stadium) in Tasmania. The Hawks have a very successful record at the ground, winning 45 times and losing only thirteen and a draw since games started playing there in 2001. As a result of the agreement with the Tasmanian government, thousands of Melbourne-based Hawthorn supporters have travelled to Tasmania to watch the Hawks play, increasing activity within the local Launceston economy. By the same token, Hawthorn has successfully increased its following in the state, with an estimated 25% of young Tasmanian supporters now barracking for their \"local\" team."}];
const KEY = "h2hoB_v1";
let ans = {}; try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let i = 0;

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} };

function render() {
  const it = ITEMS[i];
  document.getElementById("pos").textContent = (i + 1) + " / " + ITEMS.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("claim").textContent = it.claim;
  // 문장이 단 인용 표시를 근거에서 강조한다
  const marks = [...new Set((it.claim.match(/\[d[0-9a-z]+\]/g) || []))];
  let ev = esc(it.ev);
  for (const m of marks) ev = ev.split(esc(m)).join("<mark>" + esc(m) + "</mark>");
  document.getElementById("ev").innerHTML = ev;
  document.getElementById("ev").scrollTop = 0;
  const n = Object.keys(ans).length;
  document.getElementById("cnt").innerHTML = n === ITEMS.length
    ? '<span class="done">100건 완료 — 내려받으세요</span>' : ("채움 " + n + " / " + ITEMS.length);
  document.getElementById("pb").style.width = (100 * n / ITEMS.length) + "%";
  document.querySelectorAll("[data-v]").forEach(b =>
    b.classList.toggle("on", ans[it.id] === b.dataset.v));
}
function pick(v) {
  ans[ITEMS[i].id] = v; save();
  if (i < ITEMS.length - 1) i++;           // 고르면 자동으로 다음
  render();
}
document.querySelectorAll("[data-v]").forEach(b =>
  b.onclick = () => pick(b.dataset.v));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < ITEMS.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  const k = ITEMS.findIndex(x => !ans[x.id]);
  if (k < 0) { alert("전부 채웠습니다. CSV 를 내려받으세요."); return; }
  i = k; render();
};
document.onkeydown = e => {
  if (e.key === "1") pick("답있음");
  else if (e.key === "2") pick("답없음");
  else if (e.key === "3") pick("일부");
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["item_id", "human_label"].join(",")]
    .concat(ITEMS.map(x => [q(x.id), q(ans[x.id] || "")].join(",")));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_h2hoB_filled.csv";
  a.click();
};
render();
