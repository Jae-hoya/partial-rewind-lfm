e, he was European champion in 2022, World Aquatics Championships silver medalist in 2022, and European Aquatics Championships bronze medalist in 2021. For the short course event, he won a pair of silver medals in 2021 and 2022, one at the 2021 World Short Course Championships and one at the 2022 World Short Course Championships, and a bronze medal in 2021 at the year's European Short Course Championships. He won a gold medal in the 100m breaststroke at Paris 2024."}, {"id": "b049", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which platforms and formats hosted subsequent serializations, and what were the start and end dates on each platform?", "ev": "(Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! > Abstract) Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! (Japanese: どうも、好きな人に惚れ薬を依頼された魔女です。, Hepburn: Dōmo, Suki na Hito ni Horegusuri o Iraisareta Majo desu) is a Japanese web novel series written by Eiko Mutsuhana. It was originally serialized on the online publication platform Shōsetsuka ni Narō from April 2019 to March 2020, before being published as a light novel by Futabasha under its M Novels f imprint in two volumes featuring illustrations by Vient between October 2019 and March 2020. A manga adaptation illustrated by Kamada began serialization began serialization on Kadokawa 's KadoComi service under its Flos Comic label in August 2020, and has been compiled into six volumes as of February 2026. An anime television series adaptation is set to premiere in 2026.\n\n(Magical Girl Ore > Abstract) Magical Girl Ore (魔法少女俺, Mahō Shōjo Ore; \"Magical Girl Me \") is a Japanese manga series written and illustrated by Icchokusen Mōkon. It began serialization in Fusion Product's Comic Be magazine in 2012, and was collected in two tankōbon volumes. The series was renewed for serialization in the same magazine in 2014. A 12-episode anime television series adaptation animated by Pierrot+ aired from April 2 to June 18, 2018.\n\n(Lovely Muco > Media > Manga) Written and illustrated by Takayuki Mizushina, Lovely Muco was serialized in Kodansha 's seinen manga magazine Evening from 12 April 2011 to 23 September 2020. Kodansha collected its chapters in 17 tankōbon volumes, released from 23 April 2012 to 23 November 2020.  At Anime Expo 2022, Kodansha USA announced that they licensed the series for English publication.  A sequel manga, titled Daisuki! Itoshi no Muco, began serialization on Kodansha's Comic Days website began serialization on 10 September 2023. The first volume was released on 12 June 2024.\n\n(Tsugumi Project > Publication) Written and illustrated by ippatu, the series was first published in France by Ki-oon on July 4, 2019. On January 25, 2021, the series began serialization in Kodansha 's Weekly Young Magazine. The series finished on September 15, 2023. The series' individual chapters have been collected into seven tankōbon volumes from June 4, 2021, to November 9, 2023.  At Anime Expo 2022, Kodansha USA announced that they licensed the series for English publication.\n\n(Wind Breaker (manga) > Media > Manga) Written and illustrated by Satoru Nii, the series began serialization on Kodansha 's Magazine Pocket website on January 13, 2021. As of March 2026, the series' individual chapters have been collected in 25 tankōbon volumes.  In March 2022, Kodansha USA announced that they had licensed the series for digital English publication. During their Anime NYC 2022 panel, Kodansha USA announced that they would begin releasing print copies in late 2023."}, {"id": "b050", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What notable critical backlashes or industry criticisms limited Bharath's casting or distribution opportunities in any language?", "ev": "(List of highest-grossing Indian films > Overview) Indian films have been screened in markets around the world since the early 20th century. Since 2003, there are markets in over 90 countries where films from India are screened. During the first decade of the 21st century, there was a steady rise in the ticket price, a tripling in the number of theatres and an increase in the number of prints of a film being released, which led to a large increase in the box office collections.  As of 2014, Hindi cinema represents 43% of the net box office revenue in India, while Telugu and Tamil cinema represent 36%, and other industries constitute 21%. As of 2020, the combined revenue of all other language film industries has surpassed that of the Hindi film industry. By 2021, Telugu cinema became the largest film industry of India in terms of box-office. In 2023, the Hindi film industry accounted for 44% of box office revenue, followed by the Telugu industry at 19% and the Tamil industry at 16%. The Kannada (5%), Malayalam (3%), Bengali, Marathi, Odia, Punjabi, Gujarati and Bhojpuri industries contributed to the remainder, while the foreign film industry made up 9% of the total revenue. In 2024, the Hindi and the Telugu film industries accounted for 40% and 20% of the domestic gross box office revenue respectively, followed by Tamil with 15% share and Malayalam with 10% share.\n\n(Pen Studios > Abstract) Pen Studios (formerly Popular Entertainment Network) is an Indian film production and distribution company established by Dr. Jayantilal Gada on 31 March 1983. Based in Mumbai, it mainly produces and distributes Hindi, Tamil, Telugu and Malayalam films. In 1992, the business was restructured under the name Popular Entertainment Network, and began to acquire video rights for movies to be distributed over various media such as video cassettes, satellites, terrestrial platforms, etc. The company subsequently forayed into theatrical and distribution rights of movies.  In the past few years, Pen Studios has produced films such as Kahaani and Shivaay that have met success at the box office. The company is also expanding into producing more regional content.  Pen India Limited launched a new television channel named WOW. WOW's content library consists of Hindi films and music, Gujarati and Hindi-dubbed (Telugu, Tamil, Malayalam and Kannada) films, and TV series such as Mahabharat.\n\n(Coimbatore > Culture > Language) Tamil is the official language and Kongu Tamil (also called Kangee or Kongalam), a dialect, is predominantly spoken. As per the 2011 census, Tamil is the most spoken language with 710,326 speakers, followed by Telugu (173,136), Malayalam (76,485) and Kannada (43,629). Other languages spoken in the city include Urdu (15,484) and Hindi (13,608). During the 1970s the city witnessed a population explosion as a result of migration fuelled by increased economic growth and job opportunities.\n\n(Jubair Muhammed > Abstract) Jubair Muhammed is an Indian music composer and playback singer who works in Malayalam cinema. Jubair has worked on Malayalam, Tamil, Kannada, Telugu and Hindi language films, Music Videos and Short Films.\n\n(Sarapancharam > Abstract) Sarapancharam (transl. cage of arrows) is a 1979 Indian Malayalam -language drama film written and directed by Hariharan from a story by Malayattoor Ramakrishnan. It stars Jayan, Sheela, and Sathaar and Latha, with P. K. Abraham and Oduvil Unnikrishnan in supporting roles. Jayan played the role of the main antagonist in the film. It was also one of the first notable films of Oduvil Unnikrishnan, who played the role of a lawyer. It was a breakthrough film in Jayan's career.  The story line of the film is loosely based on D. H. Lawrence 's 1928 novel Lady Chatterley's Lover, though there are significant differences in plot and characterisation. The film was the highest-grossing Malayalam film of 1979."}, {"id": "b051", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What commercial products or licensing deals (e.g., print runs, merchandise, international rights) resulted from the series?", "ev": "(Wind Breaker (manga) > Media > Manga) Written and illustrated by Satoru Nii, the series began serialization on Kodansha 's Magazine Pocket website on January 13, 2021. As of March 2026, the series' individual chapters have been collected in 25 tankōbon volumes.  In March 2022, Kodansha USA announced that they had licensed the series for digital English publication. During their Anime NYC 2022 panel, Kodansha USA announced that they would begin releasing print copies in late 2023.\n\n(My Love Story with Yamada-kun at Lv999 > Media > Manga) Written and illustrated by Mashiro, the series began serialization on Comic Smart's Ganma! manga website on March 7, 2019. Media Factory is publishing the series in print under their MF Comics imprint. As of November 2024, ten tankōbon volumes have been released.  Mangamo is publishing the series in English digitally simultaneously with its Japanese release, initially under the title Loving Yamada at Lv999!, before changing it to match the anime's title. In June 2023, Mangamo announced that they would release the series in print in collaboration with Penguin Random House 's Inklore imprint. The first volume was released on April 2, 2024.\n\n(Magical Girl Ore > Abstract) Magical Girl Ore (魔法少女俺, Mahō Shōjo Ore; \"Magical Girl Me \") is a Japanese manga series written and illustrated by Icchokusen Mōkon. It began serialization in Fusion Product's Comic Be magazine in 2012, and was collected in two tankōbon volumes. The series was renewed for serialization in the same magazine in 2014. A 12-episode anime television series adaptation animated by Pierrot+ aired from April 2 to June 18, 2018.\n\n(Full Clearing Another World under a Goddess with Zero Believers > Abstract) Full Clearing Another World under a Goddess with Zero Believers (Japanese: 信者ゼロの女神サマと始める異世界攻略, Hepburn: Shinja Zero no Megami-sama to Hajimeru Isekai Kōryaku; lit. ' The Isekai Walkthrough That Begins With the Goddess Who has Zero Followers ') is a Japanese light novel series written by Isle Ōsaki and illustrated by Tam-U. The series was originally posted as a web novel on the Shōsetsuka ni Narō website in May 2018. Overlap later began publishing the series in print under their Overlap Bunko imprint in March 2019; 12 volumes have been released as of April 2024. A manga adaptation illustrated by Hakuto Shitori began serialization on Overlap's Comic Gardo website in April 2020 and has been compiled into ten tankōbon volumes as of January 2026. An anime television series adaptation has been announced.\n\n(Tsugumi Project > Publication) Written and illustrated by ippatu, the series was first published in France by Ki-oon on July 4, 2019. On January 25, 2021, the series began serialization in Kodansha 's Weekly Young Magazine. The series finished on September 15, 2023. The series' individual chapters have been collected into seven tankōbon volumes from June 4, 2021, to November 9, 2023.  At Anime Expo 2022, Kodansha USA announced that they licensed the series for English publication."}, {"id": "b052", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What legal or statutory limits restrict Newcastle City Council's powers and how have these constraints been applied or challenged?", "ev": "(2021 Newcastle City Council election > Background > History) The Local Government Act 1972 created a two-tier system of metropolitan counties and districts covering Greater Manchester, Merseyside, South Yorkshire, Tyne and Wear, the West Midlands, and West Yorkshire starting in 1974. Newcastle was a district of the Tyne and Wear metropolitan county. The Local Government Act 1985 abolished the metropolitan counties, with metropolitan districts taking on most of their powers as metropolitan boroughs. The North of Tyne Combined Authority was created in 2018 and began electing the mayor of the North of Tyne from 2019, which was given strategic powers covering a region covering some of the same area as the former Tyne and Wear metropolitan county, as well as Northumberland.  Since its creation, Newcastle has variously been under Labour, Liberal Democrat and Conservative control. The Liberal Democrats held a majority of seats on the council from 2004 until 2011, when Labour gained enough seats to control the council. Nick Forbes became leader of the council. Labour continued to gain seats until the 2019 election, when the party lost two seats but continued to have an overall majority.  The Local Government Boundary Commission for England produced new boundaries for Newcastle ahead of the 2018 election, meaning that the 2018 elections were all-out, with all councillors being elected before returning to electing by thirds. Candidates up for re-election in 2021 are those who came second in each ward in 2018.\n\n(Newcastle Airport Metro station > Abstract) Airport (also known as Newcastle Airport) is a Tyne and Wear Metro station, serving Newcastle International Airport in the English city of Newcastle upon Tyne. It opened as a terminus station in 1991, following the opening of the extension from Bank Foot to Airport.\n\n(Whitley Bay > Abstract) Whitley Bay is a seaside town in the North Tyneside borough of Tyne and Wear, England. It was formerly governed as part of Northumberland and has been part of Tyne and Wear since 1974. It is part of the wider Tyneside built-up area, being around 10 miles (16 km) north-east of Newcastle upon Tyne city centre. The population of Whitley Bay at the 2021 census was 38,323.  Two notable landmarks are the Spanish City (a domed building on the seafront) and St Mary's Lighthouse, the latter on a small island near the town.\n\n(2026 Newcastle City Council election > Background) Since the previous council election in 2024, the council fell into no overall control, with the Labour Party remaining the single largest party but losing control of the council. The Liberal Democrats remained the largest opposition.  In August 2025, Jamie Driscoll, former Mayor of the North of Tyne and former Newcastle City Council member, announced he was standing in the election in Monument ward. He said that a progressive alliance of Majority, the Green Party, and independents could win control of Newcastle City Council. In December 2025, Driscoll joined the Green Party.\n\n(Blaydon railway station > Abstract) Blaydon is a railway station on the Tyne Valley Line, which runs between Newcastle and Carlisle via Hexham. The station, situated 5 miles 39 chains (5.49 mi; 8.83 km) west of Newcastle, serves the town of Blaydon, Gateshead in Tyne and Wear, England. It is owned by Network Rail and managed by Northern Trains."}, {"id": "b053", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which web-originated isekai series have been adapted into anime, manga, games, and live-action, and when were those adaptations released?", "ev": "(My One-Hit Kill Sister > Abstract) My One-Hit Kill Sister (異世界ワンターンキル姉さん〜姉同伴の異世界生活はじめました〜, Isekai Wan Tān Kiru Nee-san: Ane Dōhan no Isekai Seikatsu Hajimemashita; \"One Turn Kill Sister in Another World: I Started Living in Another World with My Older Sister\") is a Japanese web novel series written by Konoe. It was serialized online on the user-generated novel publishing website Shōsetsuka ni Narō from December 2019 to June 2023. A manga adaptation, illustrated by Kenji Taguchi, was serialized online via Shogakukan 's Sunday Webry website, as well as the seinen manga magazine Monthly Sunday Gene-X, from March 2020 to July 2023. It chapters were collected in twelve tankōbon volumes. An anime television series adaptation by Gekkou aired from April to June 2023.\n\n(Gintama > Abstract) Gintama (銀魂; lit. ' Silver Soul ') is a Japanese manga series written and illustrated by Hideaki Sorachi. It was serialized in Shueisha 's shōnen manga magazine Weekly Shōnen Jump from December 2003 to September 2018, later in Jump Giga from December 2018 to February 2019, and concluded on the Gintama app, where it ran from May to June 2019. Its chapters were collected in 77 tankōbon volumes. Set in Japan during the Edo period, which has been conquered by aliens named Amanto, the plot follows samurai Gintoki Sakata, who works as a freelancer in his self-established store, \"Yorozuya\", alongside his friends Shinpachi Shimura and Kagura, offering a wide range of services to handle various tasks and odd jobs. After his editor suggested doing a historical series, Sorachi incorporated a science fiction setting to develop characters to his liking.  The series was adapted into an original video animation (OVA) by Sunrise, which was featured at the Jump Festa 2006 Anime Tour in 2005. This was followed by a full 367-episode anime television series, which aired on TV Tokyo from April 2006 to October 2018. The storyline of the series was concluded in the film Gintama: The Very Final, which was released in January 2021. Two other films were released in April 2010 and July 2013, respectively. Besides the anime series, there have been various light novels and video games based on Gintama. A live-action film adaptation was released in July 2017 in Japan by Warner Bros. Pictures.  The manga has been licensed by Viz Media in North America. In addition to publishing the individual volumes of the series, Viz Media serialized its first chapters in its Shonen Jump manga anthology from the January to the May 2007 issues. Viz Media ceased the English-language localization in 2011, with 23 volumes released.  In Japan, the Gintama manga has been popular, with over 73 million copies in circulation by November 2024, making it one of the best-selling manga series of all time. Gintama has been well received by critics and audiences alike, with praise for its comedy and characters, as well as its overarching plot and action choreography.\n\n(List of Dragon Ball Z chapters > Abstract) Dragon Ball Z (originally published in Japan as Dragon Ball chapters 195–519) is the English title for the last two thirds of the Dragon Ball manga, which was written and illustrated by Akira Toriyama. The story follows Son Goku as he discovers that he comes from the extraterrestrial Saiyan warrior race and faces powerful enemies who threaten the inhabitants of earth and the wider universe.  The original series was issued in the magazine Weekly Shōnen Jump. The individual chapters were collected by Shueisha in a series of 42 tankōbon volumes; The first tankōbon was released on September 10, 1985, while the last one was released on August 4, 1995. In 2002, the manga was re-released in a collection of 34 kanzenban, which included a slightly rewritten ending, new covers, and color artwork from its Weekly Shōnen Jump run. There have also been two anime adaptations, both produced by Toei Animation. The first, also named Dragon Ball, adapted the first sixteen volumes of the Japanese manga and the second, Dragon Ball Z, adapted the remaining twenty-six volumes.  The distribution company Viz Media has released all 42 volumes in English in the United States, with volumes seventeen through forty-two renamed \" Dragon Ball Z \" volumes one through twenty-six. Both \"series\" were published since March 1998 (with a re-release of the first ten volumes in 2003); the last volume of the second part was released on June 6, 2006. The first 134 chapters of \" Dragon Ball Z \" were also released across individual comic books, chapters 135-226 made their North American debuts in Shonen Jump magazine, while chapters 227-325 were released exclusively in the graphic novel format. In June 2008, Viz began re-releasing both \"series\" in a wideban format called \"Viz Big Edition\", which is a collection of three volumes in one. On November 4, 2008, a \"Collector's Edition\" of volume one with a hardback was made available. In February 2013, Viz began serializing a fully colored version of the manga in their digital anthology Weekly Shonen Jump, under the title Dragon Ball (Full Color).\n\n(Akira Toriyama > Abstract) Akira Toriyama (Japanese: 鳥山明, Hepburn: Toriyama Akira; April 5, 1955 – March 1, 2024) was a Japanese manga artist and character designer. He is regarded as one of the greatest and most influential authors in the history of manga and created numerous highly influential and popular series, with his most famous and successful project being the Dragon Ball franchise.  Toriyama first achieved mainstream recognition for creating the manga series Dr. Slump, which was serialized in Shueisha 's Weekly Shōnen Jump magazine. He earned the 1981 Shogakukan Manga Award for best shōnen series. Dr. Slump went on to sell over 35 million copies in Japan. It was adapted into an anime, with a second series created in 1997, 13 years after the manga ended. Toriyama wrote and illustrated the Dragon Ball manga from 1984 to 1995. It became one of the best-selling manga series of all time, with 260 million copies sold worldwide, and is considered a key work in increasing manga circulation to its peak in the mid-1980s and mid-1990s. Overseas, Dragon Ball ' s anime adaptations have been credited with boosting anime's international popularity.  Beside his manga works, Toriyama acted as a character designer for numerous video games such as Square Enix 's Dragon Quest series and Chrono Trigger, in addition to Blue Dragon.  In 2019, Toriyama was decorated a Chevalier of the French Ordre des Arts et des Lettres for his contributions to the arts. In October 2024, Toriyama was posthumously inducted into the Harvey Awards Hall of Fame.\n\n(Yusei Matsui > Career) In 2000, with \"Rubbing Dead\" (an unknown manga), he won the fascinating manga award at the 51st manga festival, judged by the public who were surprised by the drawing style.  Neuro: Supernatural Detective was originally serialized in Shueisha 's shōnen manga magazine Weekly Shōnen Jump from February 2005 to April 2009, with its chapters collected in 23 tankōbon (bound volumes). A 25-episode anime television series directed by Hiroshi Kōjina and animated by Madhouse was originally broadcast on Nippon Television from October 2007 to March 2008. In 2011, the anime series was licensed by Viz Media and uploaded to the company's website. Neuro: Supernatural Detective has spawned a light novel, two audio albums, two video games, and other merchandise.  From 2012 to 2016, he produced his new series \" Assassination Classroom \" was serialized in Weekly Shōnen Jump from July 2012 to March 2016, with its chapters collected in 21 tankōbon volumes. It is also adapted into an anime.  The Elusive Samurai was serialized in Weekly Shōnen Jump from January 2021 to February 2026, with its chapters collected in 23 tankōbon volumes as of December 2025. The series won the 69th Shogakukan Manga Award in 2024."}, {"id": "b054", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which notable wrestlers or trainees publicly credit him as an influence or mentor in their careers?", "ev": "(Ten-bell salute > Abstract) In professional wrestling, a ten-bell salute is given to honor a wrestler who has died, especially when the wrestler is a current member of the promotion or a distinguished former member of the promotion. It is the professional wrestling equivalent of a three-volley salute. It is typically given at the beginning of a card, with the current members of the promotion either in the entryway, in the ring and/or around the ring. Both the wrestlers and audience observe a moment of silence while the bell is rung. A memorial video would also be played before a moment of applause would follow.  In Japanese wrestling, ten-bell salutes (“ten-count gongs”) are held not only for deceased wrestlers but also for retiring wrestlers to mark the end of their careers. Retirement ten-count gongs are often preceded with a retirement ceremony for the retiree where they are presented with gifts, flowers and career memorabilia from the active roster, high-ranking officials of the promotion and special guests.\n\n(List of Pro Wrestling Noah personnel > Background) Noah contracts typically range from developmental deals for dojo trainees to full-time contracts. Personnel appear on untelevised live events and on televised events which are aired on various broadcasters or on CyberFight 's own international streaming service, Wrestle Universe.  Personnel is organized by their role in Noah. The performer's ring name is listed on the left and their real name is on the right. This list also acknowledges which stable (referred to by Noah as \"units\") a wrestler is a part of.  As of 2025, there are seven central units in Noah:  In addition to the promotion's seven central units, wrestlers who appear on a part-time basis are also listed.  As Noah has working relationships with WWE, International Wrestling Revolution Group (IWRG) and numerous Japanese promotions, wrestlers from these promotions may appear on Noah events and have their home promotions or stables from their home promotions listed as their affiliated unit.\n\n(Wrestling at the 1912 Summer Olympics – Men's Greco-Roman heavyweight > Abstract) The Greco-Roman heavyweight competition at the 1912 Summer Olympics was part of the wrestling programme.  The competition used a form of double-elimination tournament. Rather than using the brackets that are now standard for double-elimination contests (and which assure that each match is between two competitors with the same number of losses), each wrestler drew a number. Each man would face off against the wrestler with the next number, provided he had not already faced that wrestler and that the wrestler was not from the same nation as him (unless this was necessary to avoid byes).  When only three wrestlers remain (the medalists), the double-elimination halts and a special final round is used to determine the order of the medals.  Heavyweight was the heaviest category, including wrestlers weighing over 82.5 kilograms (181.9 lb).\n\n(Wrestling at the 1912 Summer Olympics – Men's Greco-Roman featherweight > Abstract) The Greco-Roman featherweight competition at the 1912 Summer Olympics was part of the wrestling programme.  The competition used a form of double-elimination tournament. Rather than using the brackets that are now standard for double-elimination contests (and which assure that each match is between two competitors with the same number of losses), each wrestler drew a number. Each man would face off against the wrestler with the next number, provided he had not already faced that wrestler and that the wrestler was not from the same nation as him (unless this was necessary to avoid byes).  When only three wrestlers remain (the medalists), the double-elimination halts and a special final round is used to determine the order of the medals.  Featherweight was the lightest category, including wrestlers weighing up to 60 kilograms (130 lb).\n\n(Wrestling at the 1912 Summer Olympics – Men's Greco-Roman heavyweight > Results > Third round) 11 wrestlers started the third round, 6 with no losses and 5 with one.  3 wrestlers were eliminated, the most possible given that 2 of the 5 matches were between two undefeated wrestlers. 2 survived potential elimination, 1 by eliminating another wrestler and 1 via a bye. 2 received their first loss, while 4 remained undefeated."}, {"id": "b055", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What transport, accommodation, and accreditation systems were implemented for teams, officials, and fans during the tournament?", "ev": "(2026 UEFA Women's Under-17 Championship > Abstract) The 2026 UEFA Women's Under-17 Championship is the 17th edition of the UEFA Women's Under-17 Championship, the annual international youth football championship organised by UEFA for the women's under-17 national teams of Europe. Northern Ireland is hosting the tournament. A total of eight teams are playing in the tournament, with players born on or after 1 January 2009 eligible to participate.  The defending champions are the Netherlands, having won their first title by defeating Norway 2–1 in the 2025 final, but are unable to defend their title as they did not qualify for this tournament.  This tournament also acts as UEFA's qualifier for the 2026 FIFA U-17 Women's World Cup in Morocco, with top five teams qualifying as the UEFA representatives.\n\n(2010 UEFA European Under-17 Championship > Qualification) The final tournament of the 2010 UEFA European Under-17 Championship was preceded by two qualification stages: a qualifying round and an Elite round. During these rounds, 52 national teams competed to determine the eight teams.\n\n(2026 UEFA Women's Under-17 Championship qualification > Abstract) The 2026 UEFA Women's Under-17 Championship qualification was an under-17 women's national football team competition that determined the seven teams joining the automatically qualified host team Northern Ireland in the 2026 UEFA Women's Under-17 Championship final tournament.  Five national teams decided not to participate in the event, and Russia were excluded from the tournament due to the ongoing invasion of Ukraine. Therefore, including hosts Northern Ireland, 49 teams entered this qualification competition. The Round 1 of the qualification was played from 24 September to 2 December 2025, while the Round 2 was played from 26 February to 8 April 2026. Players born on or after 1 January 2009 were eligible to participate.\n\n(AFC U-17 Asian Cup > Abstract) The AFC U-17 Asian Cup, formerly known as the AFC U-16 Championship and AFC U-17 Championship, is a football competition, organised by the Asian Football Confederation (AFC) held once every two years for Asian under-17 teams that also serves as a qualification tournament for the FIFA U-17 World Cup. The top 8 countries qualify to participate in the FIFA U-17 World Cup. Up to 2000, the tournament was for U-16 teams. Between 2002 and 2006 it was held as an under-17 tournament. Between 2008 and 2020, it was switched back to a U-16 Championship. The AFC then returned it to an under-17 tournament starting from 2023. Moreover, the tournament would also be rebranded from the \"AFC U-16 Championship\" to the \"AFC U-17 Asian Cup\".  On 24 May 2024, AFC announced that the tournament will be held annually from 2026.\n\n(2020 COSAFA Under-17 Championship > Abstract) The 2020 COSAFA Under-17 Championship is the 9th edition of the COSAFA U-17 Championship, a football tournament organized by the Council of Southern Africa Football Associations (COSAFA) involving teams from Southern Africa for players aged 17 and below. The tournament is also the qualifier for the 2021 Africa U-17 Cup of Nations, which in turn is the qualifier for the 2021 FIFA U-17 World Cup and will be played on November 19–29 in Nelson Mandela Bay and the two finalists of the tournament will be representing COSAFA in the Africa U-17 Cup of Nations. Initially, it was planned to be played in Malawi in July but was postponed due to the COVID-19 pandemic. After the first four games, (2 in each group), the tournament was re-started as four teams (Comoros, Zimbabwe, Botswana, Eswatini) were disqualified for using over-aged players."}, {"id": "b056", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Were there any formal controversies (disciplinary actions, selection disputes, or appeals) involving the swimmer?", "ev": "(Barbara Krause > Abstract) Barbara Krause (later Wanja, born on 7 July 1959 in East Berlin) is a former freestyle swimmer from East Germany. She was a three-time Olympic gold medalist and eight-time world record holder. At the 1980 Summer Olympics in Moscow, Krause won gold medals in the 100 m and 200 m freestyle and in the 4×100 m freestyle relay.  Her husband, Lutz Wanja, is also a retired German Olympic swimmer.\n\n(Erica Sullivan (swimmer) > Career > 2020 Summer Olympics) Sullivan qualified to compete at the 2020 Summer Olympics in the 1500-meter freestyle for the USA Olympic swimming team. At the 2020 Olympic Games in Tokyo, Japan, she won the silver medal in the 1500-meter freestyle with a time of 15:41.41, just 4.07 seconds behind gold medalist Katie Ledecky, on July 28, 2021 at the Tokyo Aquatics Center. Sarah Köhler of Germany took the bronze medal with a time of 15:42.91. It was the first occurrence of women competing in the 1500-meter freestyle at the Summer Olympic Games.\n\n(Libby Trickett > 2005 World Aquatics Championships) In July 2005, at the 2005 World Aquatics Championships in Montreal, Canada, Trickett was one of the form swimmers of the meet. She won the 50-metre freestyle in a time of 24.59 to record her maiden championship at international level. She also achieved a silver medal in the 100-metre butterfly (57.37). She was a member of three relay teams, the 4×100-metre freestyle relay, 4×100-metre medley relay, and the 4×200-metre freestyle relay teams, winning gold (3:37.22), gold (3:57.47) and silver (7:54.00) in the respective events. Fairly new to the 200-metre freestyle event, Trickett got recorded the then fourth fastest time in history clocking 1:57.06 as lead-off swimmer in the final of the 4×200-metre freestyle relay. The time being more than 1.5 seconds faster than the individual gold medallist Solenne Figuès of France (1.58.60). Trickett did not compete in the individual 100-metre freestyle because she placed third in the event at the Australian championship, but her 100-metre freestyle split times were faster than the individual 100-metre freestyle gold medalist and world record holder Jodie Henry, which earned her the honour of swimming in the final of the medley relay. Despite not competing in the individual 100- and 200-metre freestyle, she did finish 2005 ranked number one in the world in both events.  On returning to Australia, Trickett continued her rich vein of form, lowering the 100-metre short course freestyle world record on consecutive nights at the Australian Short Course Championships to 51.70 seconds.  2005 brought a further world record in the short-course 200-metre freestyle at the Sydney, Australia stop of the 2005 FINA World Cup series on 19 November with Trickett recording a time of 1:53.29 to beat the previous record by 0.75 seconds.  However, Trickett regained her 100-metre freestyle world record on 31 January 2006 at the Australian Championships in Melbourne. Her time of 53.42 was 0.1 of a second faster than the previous record held by Henry. On 2 August 2006, German swimmer Britta Steffen broke Trickett's 100-metre freestyle world record at the 2006 European Championships in Budapest, Hungary, with a time of 53.30. Trickett again regained the world record with a time of 52.88 on 27 March 2008 at the 100-metre finals of the Australian Olympic Trials.\n\n(Relay race > Relays in swimming) A swimming relay of four swimmers usually follows this strategy: second-fastest, third-fastest, slowest, then fastest (anchor). However, it is not uncommon to see either the slowest swimmer racing in the second slot (creating an order of second-fastest, slowest, third-fastest, and then fastest), or an order from slowest to fastest (an order of slowest, third-fastest, second-fastest, fastest).  FINA rules require that a foot of the second, third or fourth swimmer must be contacting the platform while (and before) the incoming teammate is touching the wall; the starting swimmer may already be in motion, however, which saves 0.6–1.0 seconds compared to a regular start. Besides, many swimmers perform better in a relay than in an individual race owing to a team spirit atmosphere. As a result, relay times are typically 2–3 seconds faster than the sum of best times of individual swimmers.  In medley swimming, each swimmer uses a different stroke (in this order): backstroke, breaststroke, butterfly, and freestyle, with the added limitation that the freestyle swimmer cannot use any of the first three strokes. At competitive levels, essentially all freestyle swimmers use the front crawl. Note that this order is different from that for the individual medley, in which a single swimmer swims butterfly, backstroke, breaststroke, and freestyle in a single race, in that order.  The three standard relays raced at the Olympics are the 4 × 100 m freestyle relay, 4 × 200 m freestyle relay and 4 × 100 m medley relay.  Mixed-gendered relays were introduced at the 2014 FINA World Swimming Championships (25 m) (4 × 50 m freestyle and medley) and the 2015 World Aquatics Championships (4 × 100 m freestyle and medley). The event debuted at the 2020 Summer Olympics (4 × 100 m medley).  In open water swimming, mixed-gendered relays were introduced at the 2011 World Aquatics Championships (4 × 1250 m).\n\n(Nicolò Martinenghi > Abstract) Nicolò Martinenghi (Italian:; born 1 August 1999) is an Italian swimmer and the reigning Olympic champion in the 100 metre breaststroke event, having won the gold medal at the 2024 Summer Olympics. He is a two-time world record holder in the 4×50 metre medley relay, swimming breaststroke on both relays. He is the Italian record holder in the 50 metre breaststroke and 100 metre breaststroke (both long course and short course).  In the long course 100 metre breaststroke, Martinenghi won the gold medal at the 2022 World Aquatics Championships and the 2022 European Aquatics Championships, as well as the bronze medal at the 2020 Summer Olympics. In the short course version of the event, he was European champion in 2021 and won silver medals at the 2021 and 2022 World Short Course Championships. In the long course 50 metre breaststroke, he was European champion in 2022, World Aquatics Championships silver medalist in 2022, and European Aquatics Championships bronze medalist in 2021. For the short course event, he won a pair of silver medals in 2021 and 2022, one at the 2021 World Short Course Championships and one at the 2022 World Short Course Championships, and a bronze medal in 2021 at the year's European Short Course Championships. He won a gold medal in the 100m breaststroke at Paris 2024."}, {"id": "b057", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the player's dominant hand, grip style (shakehand or penhold), and typical stance used in matches?", "ev": "(Wang Tao (table tennis) > Abstract) Wang Tao (Chinese: 王涛; born December 13, 1967, in Beijing) is a retired Chinese table tennis player, the current head coach of the Bayi Gongshang club in the China Table Tennis Super League, and a member of the Chinese Olympic Committee.Wang Tao is a left-handed player who utilizes the Shakehand grip, known for using short pimpled rubber on his backhand and regular inverted rubber on his forehand. Due to the special characteristics of short pimpled rubber being able to hit through and resist spin, Wang Tao's play style is unique, as he was able to rely on the quick hitting motion on his backhand to directly attack serves with heavy spin or make controlled shots at wide angles against his opponents. Wang Tao positions himself close to the table, attacking with great speed and surprising his opponents with unexpected shots.  Wang Tao was an influential figure, making great contributions to the revival of Chinese dominance in the sport of table tennis in a time when European countries like Sweden and Austria dominated the world stage (winning the men's team event during the 1995 table tennis world championships).  Wang Tao was mentioned in season 4, episode 8 of the American television series The Office. In the episode, entitled \" The Deposition \", the character Dwight Schrute mentions Wang Tao as one of his table tennis heroes.\n\n(Buenos Aires Visual Plan > Abstract) The Buenos Aires Visual Plan was the first program to establish an organised system of traffic signs in the city of Buenos Aires, developed and implemented between 1971 and 1972. The plan had been thought by the Buenos Aires administration led by then Intendent Saturnino Montero Ruiz and carried out by the design studio managed by architects Guilermo González Ruiz and Ronald Shakespear.  The program, officially named \"Plan for the Design of a Visual Identification System\" (Spanish: Plan para el Diseño de un Sistema de Identificación Visual), is regarded as an avant-garde graphic landmark in the Buenos Aires urban design,  The road signs were later replicated in other cities in Argentina and even in Latin America. The visual plan style has been used as model for future signal systems in Buenos Aires.\n\n(Argentina Davis Cup team > Venues) Argentina played all of their home games at the Buenos Aires Lawn Tennis Club up until 1996. Since then, other venues were used, not only in Buenos Aires, but also in other cities such as Córdoba, Mendoza and Mar del Plata, the city of choice for the 2008 Finals, the only series of this kind Argentina has hosted so far and also their only home series that was not played on clay. Since 2006, Argentina began to play their home matches at the Mary Terán de Weiss Stadium in Buenos Aires.\n\n(Golf equipment > Clothing > Gloves) Golfers also often wear gloves that help grip the club and prevent blistering. Gloves are sold individually and normally worn only on the players' non-dominant hand, but it is not unheard-of for a player to wear gloves on both hands to reduce chafing. The increased grip and control allows for harder swings to be made with more control, increasing distance.\n\n(Harry Vardon > Vardon grip) Vardon was also well known for the Vardon grip, or overlapping grip, the grip most popular among professional golfers. In the Vardon grip, one places the little finger of the trailing hand (the one placed lower on the club – right hand for a right-handed player) in between the index and middle finger on the leading hand (the hand that is higher on the club). The leading-hand thumb should fit in the lifeline of the trailing hand. Vardon actually took up this grip some time after Johnny Laidlay, a champion Scottish amateur player, invented it.  A visual depiction of the Vardon Grip is the logo of South Herts Golf Club where Vardon was the club professional from 1902 until his death in 1937"}, {"id": "b058", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What debates exist among scholars about classification and mutual intelligibility of Makonde dialects across Tanzania and Mozambique?", "ev": "(East African coral coast > Abstract) The East African coral coast is a marine ecoregion along the eastern coast of Africa. It extends along the coasts of Kenya, Tanzania, and northern Mozambique, from Lamu in Kenya (2º30' S) to Angoche in Mozambique (16°14 S). It adjoins the Northern Monsoon Current Coast ecoregion to the north, and the Bight of Sofala/Swamp Coast ecoregion to the south.\n\n(East African coral coast > Major habitat types) Fringing coral reefs extend along much of the coast, extending.5 to 2 km from the shore on the narrow continental shelf. Fringing reefs extend along the coasts of Kenya and Tanzania as far as the Ruvuma River, which forms the Tanzania-Mozambique boundary. The fringing reefs are interrupted by major river mouths, including the Tana and Athi rivers in Kenya and the Rufiji in Tanzania. Unguja Island has a fringing reef along its eastern shore and extending around the southern and northern tips of the island. Mafia Island has a fringing reef along its eastern shore which extends south to the Songo Songo Islands.  Seagrass beds are found in clear, shallow lagoons between the fringing reefs and the shore, and between offshore islands and the mainland.  River mouths are home to the East African mangroves. The Rufiji River delta is the largest mangrove ecosystem on the East African coast, and accounts for half of Tanzania's 55,000 ha of mangroves. Other important mangrove forests in Tanzania are in Lindi and Tanga, at the mouths of the Wami, Ruvu, Matandu and Ruvuma rivers, and on the Mafia Archipelago. Kenya has 52,980 ha of mangroves, over two-thirds of which are concentrated around Lamu. Kilifi and Kwale account for most of the rest.  Fringing reefs are uncommon along the Mozambican coast, limited by freshwater input from numerous rivers, and cold-water upwelling in the Mozambique Channel. Patch reefs are best developed on the Quirimbas Islands, Primeiras and Segundas Archipelago, and Mozambique Island and neighboring islands in Mozambique Bay. Mangroves are found in the many river mouths, and seagrass beds occur in sheltered coastal waters.\n\n(Bidco Africa > Overview) Bidco Africa has manufacturing factories in Kenya, Tanzania and Uganda with over 40 brands distributed across 17 African countries.  In April 2015, Bidco Africa announced plans to quadruple business volume before 2020, by building new manufacturing factories in Mozambique, Madagascar and Ethiopia in addition to existing operations in Kenya, Tanzania, Rwanda and Uganda. In February 2019 the BBC reported Bidco Africa's expansion into the food and beverage category as a move that positions the company to become the leading manufacturer of consumer goods in East Africa with a portfolio of over 40 brands and over 25,000 employees."}, {"id": "b059", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which national teams qualified for and participated in the 2016 FIFA U-20 Women's World Cup?", "ev": "(2026 African U-20 Women's World Cup qualification > Abstract) The 2026 African U-20 Women's World Cup qualification is the 13th edition of the biennial African youth football competition organized by the Confederation of African Football (CAF) to determine which African women's under-20 national teams qualify for the FIFA U-20 Women's World Cup. Players born on or after 1 January 2006 are eligible to compete.  Four teams will qualify for the 2026 FIFA U-20 Women's World Cup in Poland as the CAF representatives.\n\n(Football in Nigeria > National team > Youth) Nigeria 's youth teams won the inaugural FIFA U-17 World Cup in 1985 as well as in 1993, 2007, 2013, 2015. The under-17 team is known as the Golden Eaglets and Under-20 team is known as the \"Flying Eagles\".  Nigeria's Flying Eagles qualified for the first time to represent Africa in the 1983 FIFA World Youth Championship in Mexico. Although Nigeria did not go beyond the first round, they beat the highly rated USSR 1-0 and held the Netherlands to a goalless draw.  In 1985, the under-17 football team went to China and conquered the world in the first ever FIFA U-17 World Championship. The victory took Nigerian youth football to a high pedestal, setting the stage for a respect of Nigeria in international competitions. The under-20 team went to Saudi Arabia for the 1989 FIFA World Youth Championship and lost narrowly in the final to Portugal. The team pulled off the now-legendary \"Miracle of Damman\", erasing a 4–0 deficit to the Soviet Union to tie and then win the match by penalties.In 2007, the under-17 squad were crowned world champions in South Korea for the 3rd time. Nigeria hosted the 1999 FIFA World Youth Championship and the 2009 FIFA U-17 World Cup.\n\n(Chile women's national under-20 football team > History) The Chile women's national under-20 football team represents Chile at women's soccer age of U-20. They have faced Bolivia on 11 May 2004 at Sucre, Bolivia and which lost by 1–9 goals its their biggest defeat as so far. In their South American Under-20 Women's Football Championship competition history the girls finished Fourth-Place in 2010. The team have qualified to the FIFA U-20 Women's World Cup once in 2008 as the host country."}, {"id": "b060", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What governmental inquiries, public protests, or union actions were recorded in response to the firm's restructuring decisions?", "ev": "(Montreal Football Club > Abstract) The Montreal Football Club was a Canadian football team based in Montreal, Quebec, that played in the Quebec Rugby Football Union from 1883 to 1906 and in the Interprovincial Rugby Football Union from 1907 to 1915. The club was a founding member of the QRFU and played in the first football game in Quebec in 1872. The club was dominant in Quebec, winning 12 of the 24 QRFU titles in the years that they played in that league. Montreal also won the first Canadian Dominion Football Championship in 1884, a predecessor of the Grey Cup and again won the championship in their first season in the IRFU in 1907.\n\n(Westmount > History > Merger with Montreal) In 2001, while trying to prevent Westmount from being amalgamated into the city of Montreal, Westmount Mayor Peter Trent and city council asserted that the city was a designated anglophone institution and should not be merged into francophone greater Montreal. In response to this opposition, Municipal Affairs Minister Louise Harel said that Westmount's resistance \"reeked of colonialism\" and that the opposition was an \"ethnic project\", statements for which she would refuse to apologize. When asked for comment, Quebec Premier Bernard Landry said the minister had his full support and that the opposition was little more than Quebec bashing. Several federalist public figures criticized Landry's statement: Jean Charest called it insulting to the intelligence of the citizens of Quebec; Joseph Gabary, president of the Quebec Chapter of the Canadian Jewish Congress, called the language \"crude\"; Alliance Quebec also criticized the premier for singling out the city for special criticism.  On January 1, 2002, as part of the 2002–2006 municipal reorganization of Montreal, Westmount was merged into the city of Montreal and became a borough. However, after a change of government and a 2004 referendum, it was re-constituted as an independent city on January 1, 2006. It is now one of fifteen independent cities on the Island of Montreal, and the only one that directly borders the downtown core.  Nevertheless, it remains part of the urban agglomeration of Montreal and the bulk of its municipal taxes go to the Agglomeration Council, which oversees activities common to all municipalities on the Island of Montreal (e.g. police, fire protection, public transit) even after the demerger.\n\n(Trent Schroyer > Discovery and discourse in India) As a member of International Network for Cultural Alternatives to Development, a non-governmental, international solidarity organization based in Montreal, Quebec, Canada, Schroyer helped facilitate gatherings of indigenous leaders in Quebec and south-east Asia. At the Bangalore, India conference in 2000, Siddhartha, from Fireflies Ashram, invited him to bring activists, scholars and students to India to encounter grassroots actions and models for alternatives in south India. From this beginning in 2000 Schroyer founded the Ramapo India semester study abroad program. In 2004 Schroyer brought Ramapo students and activists to the World Social Forum in Mumbai, built around the slogan 'Another World is Possible'.  At Fireflies Ashram, participants engaged in public dialogues about transformative innovations in India such as the ongoing Gandhian legacy, commons actions, alternative economics and inter-religious discourse. Participation in these discourses and visits to many communities revealed that encountering people in their own worlds changes perceptions and structures of feeling. These encounters were expressed in the following presentations:Schroyer gave a talk titled \"On Economic Alternatives\" to the Indian Institute of Journalism & News Media (IIJNM), Bangalore, India in 2008 and another talk to the Indian Institute of Science Campus in Bangalore that same year, titled \"The Fall of Western Certitudes and the Relevance of Ivan Illich\". On March 31,2009, Schroyer presented a paper \"Compassion and Confrontation\" at the University of Madras, Chennai, India.\n\n(Game theory > Well known examples of games > Cournot Competition) The Cournot competition model involves players choosing quantity of a homogenous product to produce independently and simultaneously, where marginal cost can be different for each firm and the firm's payoff is profit. The production costs are public information and the firm aims to find their profit-maximizing quantity based on what they believe the other firm will produce and behave like monopolies. In this game firms want to produce at the monopoly quantity but there is a high incentive to deviate and produce more, which decreases the market-clearing price. For example, firms may be tempted to deviate from the monopoly quantity if there is a low monopoly quantity and high price, with the aim of increasing production to maximize profit. However this option does not provide the highest payoff, as a firm's ability to maximize profits depends on its market share and the elasticity of the market demand. The Cournot equilibrium is reached when each firm operates on their reaction function with no incentive to deviate, as they have the best response "}, {"id": "b061", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What endorsements, brand partnerships, or industry positions did Bharath gain following prominent roles in specific language markets?", "ev": "(List of highest-grossing Indian films > Overview) Indian films have been screened in markets around the world since the early 20th century. Since 2003, there are markets in over 90 countries where films from India are screened. During the first decade of the 21st century, there was a steady rise in the ticket price, a tripling in the number of theatres and an increase in the number of prints of a film being released, which led to a large increase in the box office collections.  As of 2014, Hindi cinema represents 43% of the net box office revenue in India, while Telugu and Tamil cinema represent 36%, and other industries constitute 21%. As of 2020, the combined revenue of all other language film industries has surpassed that of the Hindi film industry. By 2021, Telugu cinema became the largest film industry of India in terms of box-office. In 2023, the Hindi film industry accounted for 44% of box office revenue, followed by the Telugu industry at 19% and the Tamil industry at 16%. The Kannada (5%), Malayalam (3%), Bengali, Marathi, Odia, Punjabi, Gujarati and Bhojpuri industries contributed to the remainder, while the foreign film industry made up 9% of the total revenue. In 2024, the Hindi and the Telugu film industries accounted for 40% and 20% of the domestic gross box office revenue respectively, followed by Tamil with 15% share and Malayalam with 10% share.\n\n(Babu Antony > Career) Early in his career, he started making appearances in roles like Chilambu, Mizhineerppoovukal (1986) in Malayalam. He made a mark through Fazil 's 1986 thriller Poovinu Puthiya Poonthennal. The film was remade into Tamil, Telugu, Kannada and Hindi. Babu reprised his role in all five versions. He made his debut by playing an antagonist in Bharathan 's Chilambu (1987).  In 1987, he appeared for its debut in Tamil cinema with Sathyaraj in Poovizhi Vasalile and then Makkal En Pakkam. Later with Kamal Haasan 's Vrutham (1987) in Malayalam and Per Sollum Pillai in Tamil. With Nizhalgal Ravi, he acted in a horror film, Veendum Lisa which were all commercial successes. He also played with Chiranjeevi in Pasivadi Pranam and Jebu Donga which was later a hit at the box office. He started his career as a villain and later on featured in leading roles with the image of an angry young man.  His debut film in Kannada was Shanti Kranti (1991). His movies like Aparahnam (1991), Gandhari (1993), Rajadhani (1994), Bharanakoodam (1994), Chantha (1995), Special Squad (1995) and Indian Military Intelligence (1995) helped him to build a large audience and fan following for him. Apart from these, he has worked as many different characters such as an ex-terrorist role in Aparahnam, a king's role in Vaishali (1988), an impecunious man in Sayahnam (2000). Uppukandam Brothers (1993) gave a breakthrough for Babu's career in starring roles.  He made his debut in Hindi cine-industry with the movie Hatya in 1988. He is also in Telugu films including Lorry Driver (1990), Sathruvu (1991) and Nippu Ravva (1993). His debut movies in English Made in USA (2005) and Leader (2009) in Sinhala. His other Tamil hits were Anjali (1990), Surieyan (1992), Airport (1993), Attahasam (2004), Vinnaithaandi Varuvaayaa (2010), Kanchana (2011), Aadhi-Bhagavan (2013), Kaaviya Thalaivan (2014), Kaaka Muttai (2015), Adanga Maru (2018), Ponniyin Selvan (2022), Ponniyin Selvan: II (2023) and Leo (2023).\n\n(Sarapancharam > Box office) This film was commercial success and a breakthrough film in Jayan 's career. The dialogues and body language of Jayan was well received. He began appearing in prominent leading roles thereafter. It was the highest-grossing Malayalam film at that time.\n\n(Jubair Muhammed > Abstract) Jubair Muhammed is an Indian music composer and playback singer who works in Malayalam cinema. Jubair has worked on Malayalam, Tamil, Kannada, Telugu and Hindi language films, Music Videos and Short Films.\n\n(Jackpot (2013 film) > Abstract) Jackpot is a 2013 Indian Hindi -language comedy thriller film directed by Kaizad Gustad starring Sunny Leone, Naseeruddin Shah, Sachiin J Joshi, and Bharath in the lead roles. This is the Bollywood debut of Tamil actor Bharath. The film was released on 13 December 2013 to highly negative reviews. It had total earnings of ₹ 50 million (US$530,000), according to Box Office India."}, {"id": "b062", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What record label, management, or publishing deals were involved with Monika Liu before and after the selection?", "ev": "(Lithuania in the Eurovision Song Contest 2023 > Before Eurovision > Pabandom iš naujo! 2023 > Shows > Final) The final took place on 18 February 2023 and featured the remaining ten entries that qualified from the semi-finals. The final was the only show in the competition to be broadcast live; all other preceding shows were pre-recorded earlier in the week before their airdates. \"So Low\" performed by Rūta Mur and \" Stay \" performed by Monika Linkytė were tied at 22 points each after the combination of the jury vote and the public vote, but since Linkytė received received the most votes from the jury she was declared the winner. In addition to the competing entries, Ukrainian 2023 representative Tvorchi appeared as guests, while Eurovision Song Contest 2019 winner Duncan Laurence and Lithuanian 2022 representative Monika Liu performed as interval acts.\n\n(Lithuania in the Eurovision Song Contest 2014 > Before Eurovision > \"Eurovizijos\" dainų konkurso nacionalinė atranka > Jury members) The Lithuanian jury panel consisted of four members in the elimination shows and the semi-final, and two members in the final. The international jury panel in all shows consisted of three members: Brandon Stone (German music producer and composer), Valerij Prosvirov (Russian producer and record label director) and Liselott Björk (Swedish singer and vocal coach).\n\n(Lithuania in the Eurovision Song Contest 2014 > Abstract) Lithuania was represented at the Eurovision Song Contest 2014 with the song \"Attention\", written by Vilija Matačiūnaitė and Viktoras Vaupšas, and performed by Matačiūnaitė herself. The Lithuanian participating broadcaster, Lithuanian National Radio and Television (LRT), organised the national final \"Eurovizijos\" dainų konkurso nacionalinė atranka (Eurovision Song Contest national selection) in order to select its entry for the contest. The national final took place over 12 weeks and involved 20 artists and 16 songs competing in two different competitive streams. The results of each show were determined by the combination of votes from a jury panel and a public vote, and \"Attention\" performed by Vilija eventually emerged as the winner following the final.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 8 May 2014. Performing during the show in position 7, \"Attention\" was not announced among the top 10 entries of the second semi-final and therefore did not qualify to compete in the final. It was later revealed that Lithuania placed 11th out of the 15 participating countries in the semi-final with 36 points.\n\n(Lithuania in the Eurovision Song Contest 2014 > Before Eurovision > \"Eurovizijos\" dainų konkurso nacionalinė atranka > Song selection > Final) The final of the competition took place on 1 March 2014 and featured the remaining three artists that qualified from the 10th elimination show each performing two songs: a cover of their choice and the winning song selected from the semi-final, \"Attention\". The final was the only show in the competition to be broadcast live; all other preceding shows were pre-recorded earlier in the week before their airdates. Vilija Matačiūnaitė was selected as the winner after gaining the most points from both the jury vote and the public vote. In addition to the performances of the competing artists, Monika Linkytė performed as the interval act.\n\n(Lithuania in the Eurovision Song Contest 2023 > Abstract) Lithuania was represented at the Eurovision Song Contest 2023 with the song \" Stay \" performed by Monika Linkytė. The Lithuanian participating broadcaster, the Lithuanian National Radio and Television (LRT), organised the national final Pabandom iš naujo! 2023 to select its entry for the contest.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 11 May 2023 and was later selected to perform in position 15. At the end of the show, \"Stay\" was announced among the top 10 entries of the second semi-final and hence qualified to compete in the final. It was later revealed that Lithuania placed fourth out of the sixteen participating countries in the semi-final with 110 points. In the final, Lithuania performed in position 22 and placed eleventh out of the 26 participating countries, scoring a total of 127 points."}, {"id": "b063", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How is the club's volleyball section administratively structured, including technical director, coaching staff, and youth academy?", "ev": "(2018 FIVB Women's Volleyball Challenger Cup qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball Challenger Cup qualification acted as the qualifiers section for the 2018 FIVB Women's Volleyball Challenger Cup for national teams that were members of the Asian Volleyball Confederation (AVC). This tournament was held in Almaty, Kazakhstan. The eventual winner earned the right to compete in the 2018 FIVB Women's Volleyball Challenger Cup.\n\n(Abdulrahman Fawzi Hall > Abstract) Abdulrahman Fawzi Hall is a covered sports arena in Cairo, Egypt. The arena opened in 1986. The arena is the home venue of the Zamalek SC Handball team of the Egyptian Handball League, the Zamalek SC Basketball team of the Egyptian Basketball Super League, and the Zamalek SC Volleyball team of the Egyptian Volleyball League. All three teams are departments of Zamalek Sporting Club, which owns and operates the arena.\n\n(Doha > Sports > Volleyball) Doha four times was the host of the official FIVB Volleyball Men's Club World Championship and three times host FIVB Volleyball Women's Club World Championship. Doha also hosted the Asian Volleyball Championship.\n\n(2026 FIVB Volleyball Girls' U17 World Championship > Abstract) The 2026 FIVB Volleyball Girls' U17 World Championship will be the 2nd edition of the FIVB Volleyball Girls' U17 World Championship, the biennial international youth volleyball championship contested by the women's national teams under the age of 17 of the members associations of the Fédération Internationale de Volleyball (FIVB), the sport's global governing body. It will be held in Santiago, Chile from 6 to 16 August 2026.  China are the defending champions having won the inaugural edition in 2024.\n\n(2018 FIVB Women's Volleyball World Championship qualification (AVC) > Abstract) The Asian section of the ssified W2. The W1 classification for wheelchair archers was retained.  The two categories of competition in Paralympic archery in 2016 were:  A third recognised Paralympic archery classification - V1, for visually impaired archers - did not form part of the competition.\n\n(2017 IWBF Asia-Oceania Championships > Abstract) The 2017 Asia Oceania Wheelchair Basketball Championships for men and women were held at the China Disability Sports Training Centre in Beijing, from 23 to 28 October 2017. The men's tournament was won by the Australian Rollers. Iran came second, and Japan overcame Korea in the bronze medal game to come third. In the women's competition, China defeated the Australian Gliders in the gold medal match, while Japan defeated Iran in the bronze medal.\n\n(Wheelchair tennis at the 2020 Summer Paralympics > Abstract) Wheelchair tennis at the 2020 Summer Paralympics in Tokyo, Japan took place at the Ariake Tennis Park from 27 August to 4 September 2021.  The 2020 Summer Olympic and Paralympic Games were postponed to 2021 due to the COVID-19 pandemic. They kept the 2020 name and were held from 24 August to 5 September 2021.  Patrick Selepe became the first disabled umpire to officiate in a wheelchair Paralympic event."}, {"id": "b065", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which of Bharath's films were commercially successful or box-office hits in each language industry?", "ev": "(Babu Antony > Career) Early in his career, he started making appearances in roles like Chilambu, Mizhineerppoovukal (1986) in Malayalam. He made a mark through Fazil 's 1986 thriller Poovinu Puthiya Poonthennal. The film was remade into Tamil, Telugu, Kannada and Hindi. Babu reprised his role in all five versions. He made his debut by playing an antagonist in Bharathan 's Chilambu (1987).  In 1987, he appeared for its debut in Tamil cinema with Sathyaraj in Poovizhi Vasalile and then Makkal En Pakkam. Later with Kamal Haasan 's Vrutham (1987) in Malayalam and Per Sollum Pillai in Tamil. With Nizhalgal Ravi, he acted in a horror film, Veendum Lisa which were all commercial successes. He also played with Chiranjeevi in Pasivadi Pranam and Jebu Donga which was later a hit at the box office. He started his career as a villain and later on featured in leading roles with the image of an angry young man.  His debut film in Kannada was Shanti Kranti (1991). His movies like Aparahnam (1991), Gandhari (1993), Rajadhani (1994), Bharanakoodam (1994), Chantha (1995), Special Squad (1995) and Indian Military Intelligence (1995) helped him to build a large audience and fan following for him. Apart from these, he has worked as many different characters such as an ex-terrorist role in Aparahnam, a king's role in Vaishali (1988), an impecunious man in Sayahnam (2000). Uppukandam Brothers (1993) gave a breakthrough for Babu's career in starring roles.  He made his debut in Hindi cine-industry with the movie Hatya in 1988. He is also in Telugu films including Lorry Driver (1990), Sathruvu (1991) and Nippu Ravva (1993). His debut movies in English Made in USA (2005) and Leader (2009) in Sinhala. His other Tamil hits were Anjali (1990), Surieyan (1992), Airport (1993), Attahasam (2004), Vinnaithaandi Varuvaayaa (2010), Kanchana (2011), Aadhi-Bhagavan (2013), Kaaviya Thalaivan (2014), Kaaka Muttai (2015), Adanga Maru (2018), Ponniyin Selvan (2022), Ponniyin Selvan: II (2023) and Leo (2023).\n\n(Kamal Haasan > Film career > 1980–1989) Haasan's films during the 1980s included the 1980 Tamil-language Varumayin Niram Sivappu, the film was simultaneously shot in Telugu as Aakali Rajyam, in which he played an unemployed youth and earned him a first Filmfare Award in Telugu. In 1980 he appeared in the drama film Ullasa Paravaigal, Guru and Maria My Darling. Haasan made his debut in Hindi cinema with Ek Duuje Ke Liye (1981), the remake of his own acted Telugu -language film Maro Charitra directed by K. Balachander (which earned him his first Filmfare Hindi-language nomination). He made his 100th film appearance in 1981 in Raja Paarvai, debuting as a producer. Despite the film's relatively poor box-office performance, his portrayal of a blind session violinist earned him a Filmfare Award. After a year of starring in commercial films, Haasan won the first of three National Awards for Best Actor for his portrayal of a schoolteacher caring for an amnesia patient in Balu Mahendra 's Moondram Pirai, later reprising his role in the Hindi version, Sadma. During this period he focused on Bollywood remakes of his Tamil films, including Yeh To Kamaal Ho Gaya and Zara Si Zindagi. In 1983 he appeared in Sagara Sangamam, directed by K. Viswanath. His portrayal of an alcoholic classical dancer won him his first Nandi Award for Best Actor and his second Filmfare Best Telugu Actor Award.  After 1984's multistarrer Raaj Tilak, Haasan appeared in Saagar (released 1985), winning the Filmfare Best Actor Award and nominated for the Best Supporting Actor award. The film was India's representative for the Best Foreign Language Oscar in 1985. He left Bollywood temporarily after Geraftaar and Dekha Pyar Tumhara to feature in Japanil Kalyanaraman (a sequel to his 1979 Kalyanaraman).  In 1986, Haasan produced the technically brilliant Vikram and collaborated with Kodandarami Reddy for Oka Radha Iddaru Krishnulu and then K. Viswanath in Swathi Muthyam, playing a cognitively disabled person who tries to change society and won him his second Nandi Award for Best Actor. it was India's entry for Best Foreign Language Film at the Academy Awards in 1986. These Tollywood films found him a large audience in Andhra Pradesh, and many of his later Tamil films were dubbed into Telugu.  Following Punnagai Mannan (in which he played two roles, including a satire of Charlie Chaplin as Chaplin Chellappa) and Kadhal Parisu, Haasan appeared in Mani Ratnam 's 1987 film Nayakan. He received his second Indian National Award for his performance; Nayakan was submitted by India as its entry for Best Foreign Language Film at the 1987 Academy Awards, and is on the Time's All-Time 100 Movies list. Haasan appeared in his only dialogueless film to date: Pushpaka Vimana (1987) a black comedy film, in which he played an unemployed youth and earned him a first Filmfare Award in Kannada. In 1988 he appeared Unnal Mudiyum Thambi, Malayalam film Daisy and Sathyaa which were his own productions. Haasan's all four films of 1989 were major success, Apoorva Sagodharargal, where he played a dwarf, then Chanakyan, an original Malayalam film, later Vettri Vizhaa (where he played an amnesiac) and finally Haasan played two parts in Indrudu Chandrudu, winning the Filmfare Best Actor and won him his third Nandi Award for Best Actor for his performance. By the end of the 1980s Haasan was successful in the Malayalam, Kannada, Telugu and Hindi film industries, with Filmfare Awards in each industry and two national awards.\n\n(Pen Studios > Abstract) Pen Studios (formerly Popular Entertainment Network) is an Indian film production and distribution company established by Dr. Jayantilal Gada on 31 March 1983. Based in Mumbai, it mainly produces and distributes Hindi, Tamil, Telugu and Malayalam films. In 1992, the business was restructured under the name Popular Entertainment Network, and began to acquire video rights for movies to be distributed over various media such as video cassettes, satellites, terrestrial platforms, etc. The company sub\n\n(Jubair Muhammed > Abstract) Jubair Muhammed is an Indian music composer and playback singer who works in Malayalam cinema. Jubair has worked on Malayalam, Tamil, Kannada, Telugu and Hindi language films, Music Videos and Short Films."}, {"id": "b066", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What contested narratives surround Makonde political loyalties and roles during Mozambican independence and the civil war?", "ev": "(Mozambican War of Independence > Abstract) The Mozambican War of Independence was an armed conflict between the guerrilla forces of the Mozambique Liberation Front (FRELIMO) and Portugal. The war officially started on 25 September 1964, and ended with a ceasefire on 8 September 1974, resulting in a negotiated independence in 1975.  Portugal's wars against guerrilla fighters seeking independence in its 400-year-old African territories began in 1961 with Angola. In Mozambique, the conflict erupted in 1964 as a result of unrest and frustration amongst many indigenous Mozambican populations, who perceived foreign rule as exploitation and mistreatment, which served only to further Portuguese economic interests in the region. Many Mozambicans also resented Portugal's policies towards indigenous people, which resulted in discrimination and limited access to Portuguese-style education and skilled employment.  As self-determination movements spread throughout Africa after World War II, many Mozambicans became progressively more nationalistic in outlook, and increasingly frustrated by the nation's continued subservience to foreign rule. For the other side, many enculturated indigenous Africans who were fully integrated into the social organization of Portuguese Mozambique, in particular those from urban centres, reacted to claims of independence with a mixture of discomfort and suspicion. The ethnic Portuguese of the territory, which included most of the ruling authorities, responded with increased military presence and fast-paced development projects.  A mass exile of Mozambique's political intelligentsia to neighboring countries provided havens from which radical Mozambicans could plan actions and foment political unrest in their homeland. The formation of FRELIMO and the support of the Soviet Union and the Communist Bloc through arms and advisers, led to the outbreak of violence that was to last well over a decade.  From a military standpoint, the Portuguese regular army held the upper hand during the conflict against FRELIMO guerrilla forces. Nonetheless, Mozambique succeeded in achieving independence on 25 June 1975, after a civil resistance movement known as the Carnation Revolution backed by portions of the military in Portugal overthrew the Salazar regime, thus ending 470 years of Portuguese colonial rule in the East African region. According to historians of the Revolution, the military coup in Portugal was in part fueled by protests concerning the conduct of Portuguese troops in their treatment of some of the indigenous Mozambican populace. The growing communist influence within the group of Portuguese insurgents who led the military coup and the pressure of the international community in relation to the Portuguese Colonial War were the primary causes of the outcome.\n\n(Mozambican War of Independence > Background > Rise of FRELIMO) Portugal designated Mozambique an overseas territory in 1951 in order to show the world that the colony had greater autonomy. It was called the Overseas Province of Mozambique (Província Ultramarina de Moçambique). Nonetheless, Portugal still maintained strong control over its colony. The increasing number of newly independent African nations after World War II, coupled with the ongoing mistreatment of the indigenous population, encouraged the growth of nationalist sentiment within Mozambique.  Mozambique was marked by large disparities between the wealthy Portuguese and the rural indigenous African population. Poorer whites, including illiterate peasants, were given preference in lower-level urban jobs, where a system of job reservation existed. In the rural areas, Portuguese controlled the trading stores with which African peasants interacted. Being largely illiterate and preserving their local traditions and ways of life, skilled employment opportunities and roles in administration and government were rare for these numerous tribal populations, leaving them few or no opportunities in the urban modern life. Many indigenous peoples saw their culture and tradition being overwhelmed by the alien culture of Portugal. A small educated African class did emerge, but faced substantial discrimination.  Vocal political dissidents opposed to Portuguese rule and claiming independence were typically forced into exile. From the mid-1920s onward, unions and left-wing opposition groups were suppressed within both Portugal and its colonies by the authoritarian Estado Novo regime. The Portuguese government forced black Mozambican farmers to grow rice or cotton for export, providing little for the farmers to support themselves. Many other workers—over 250,000 by 1960—were pressured to work on coal and gold mines in neighboring territories, mainly in South Africa, where they comprised over 30% of black underground miners. By 1950, only 4,353 Mozambicans out of 5,733,000 had been granted the right to vote by the Portuguese colonial government. The rift between Portuguese settlers and Mozambican locals is illustrated in one way by the small number of people with mixed Portuguese and Mozambican heritage (mestiço), numbering only 31,465 in a population of 8–10 million in 1960 according to that year's census.  The Mozambique Liberation Front, or FRELIMO, formally Marxist-Leninist as of 1977 but adherent to such positions since the late 1960s, was formed in Dar es Salaam, Tanzania, on 25 June 1962, under the leadership of sociologist Eduardo Mondlane. It was created during a conference of political figures who had been forced into exile, by the merging of various existing nationalist groups, including the Mozambican African National Union, National African Union of Independent Mozambique and the National Democratic Union of Mozambique which had been formed two years earlier. It was
