<style>

const ITEMS = [{"id": "b000", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What official names has the club used since its founding and in which years did each name apply?", "ev": "(Papua New Guinea national cricket team > Papua New Guinea Cricket Board) Papua New Guinea Cricket Board is the official governing body of the sport of cricket in Papua New Guinea. Its current headquarters is in Port Moresby, Papua New Guinea. Papua New Guinea Cricket Board is Papua New Guinea's representative at the International Cricket Council and is an associate member and has been a member of that body since 1973. It is also a member of the East Asia-Pacific Cricket Council.\n\n(Papua New Guinea > Etymology) Papua is derived from a local term of uncertain origin, that may have referred to at least part of the island now called New Guinea. In 1526 Portuguese explorer Jorge de Menezes named the island Ilhas dos Papuas. The word \"Papua\" has applied to various areas of New Guinea since then, with its inclusion in \"Papua New Guinea\" coming from its use for the Territory of Papua.: 147 : 11  \"New Guinea\" (Nueva Guinea) was the name coined by the Spanish explorer Yñigo Ortiz de Retez. In 1545, he noted the resemblance of the people to those he had earlier seen along the Guinea coast of Africa. Guinea, in its turn, is etymologically derived from the Portuguese word Guiné. The name is one of several toponyms sharing similar etymologies, which likely mean \"of the burnt face\" or similar, in reference to the dark skin of the inhabitants. Its use in the country name comes from German New Guinea, later the Territory of New Guinea, which was united with the territory of Papua.: 147\n\n(Coming of age > Cultural > Papua New Guinea) Kovave is a ceremony to initiate Papua New Guinea boys into adult society. It involves dressing up in a conical hat which has long strands of leaves hanging from the edge, down to below the waist. The name Kovave is also used to describe the head-dress.\n\n(Papua New Guinea national cricket team > Abstract) The Papua New Guinea men's national cricket team, nicknamed the Barramundis, represents Papua New Guinea in international cricket. The team is organised by Cricket PNG, which has been an associate member of the International Cricket Council (ICC) since 1973. Papua New Guinea first gained One-Day International (ODI) status by finishing fourth in the 2014 World Cup Qualifier. Papua New Guinea lost both their ODI and T20I status in March 2018 after losing a playoff match against Nepal during the 2018 Cricket World Cup Qualifier, a result that earned ODI and T20I status for their opponents. On 26 April 2019, Papua New Guinea defeated Oman to secure a top-four finish in the 2019 ICC World Cricket League Division Two and reclaim their ODI status.  Papua New Guinea again lost the ODI status in 2023 after a 117-run defeat against USA.  In April 2018, the ICC decided to grant full Twenty20 International (T20I) status to all its Members. Therefore, all Twenty20 matches played between Papua New Guinea and other ICC members since 1 January 2019 have the full T20I status.\n\n(Kagua-Erave F.C. > History) On 30 December 2018, it was revealed that a side under the name of Kagua Erave from the Southern Highlands had submitted an official application and paid their fee towards participation in the 2019 Papua New Guinea National Soccer League. Players were recruited predominantly from the Kagua-Erave District, following trials in the first weekend of January, and the club was managed by former PNG international Steven Mune. On 15 January 2019, it was reported that the club had received financial support of K 60,000 from two backers ahead of the new season.  The club enjoyed a strong start to the season, winning their opening match against Blue Kumuls 3–1, followed by an 11–1 victory over Enga Laima in their second match in which Neil Hans scored four and Jordan Kaven scored three. The side went on to win all of their five matches in the first half of the season. Their first defeat came on 30 March when they lost 1–0 to Aporo Mai, and this was followed on 13 April by a defeat by the same scoreline against Enga Laima, having qualified for the next stage of the competition on the previous weekend. The side finished top of the conference.  In early May, the club's participation in the playoffs was thrown into doubt, after it was reported that players hadn't been paid. However, the club did eventually take to the field against Northern Conference runners-up Morobe United on 11 May in Goroka, going down 5–0."}, {"id": "b001", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What governmental entities and administrative structures provide municipal and regional services within the county?", "ev": "(Salt Lake Masonic Temple > Usage) The primary function of the building is the performance of the various rituals of the several Masonic organizations in Salt Lake City, and to provide a convenient location for administrative functions of the Utah Masonic family. The building is available for use by non-Masonic entities and persons.\n\n(Government of Orange County, California > Abstract) The government of Orange County operates as a charter county under the California Constitution, California law, and the Charter of the County of Orange. Much of the government of California is in practice the responsibility of county governments such as Orange County. The county government provides countywide services such as elections and voter registration, law enforcement, jails, vital records, property records, tax collection, public health, and social services. In addition the county serves as the local government for all unincorporated areas.  It is composed of the elected five-member Board of Supervisors, several other elected offices and officers including the Sheriff, District Attorney, Assessor/Recorder/County Clerk, and Treasurer/Tax Collector, and numerous county departments and entities under the supervision of the Chief Administrative Officer.  Several chartered municipalities in the county provide their own law enforcement, public safety, libraries, parks and recreation, zoning, and similar services. Other incorporated cities have some or all of these services provided by the County under a contract arrangement. In addition, several entities of the government of California have jurisdiction conterminous with Orange County, such as the Orange County Superior Court.  The county's mission statement is \"Making Orange County a safe, healthy, and fulfilling place to live, work, and play, today and for generations to come, by providing outstanding, cost-effective regional public services.\" Many county government offices are part of the Orange County Civic Center Complex in downtown Santa Ana.\n\n(Provo Municipal Airport > Abstract) Provo Airport (IATA: PVU, ICAO: KPVU, FAA LID: PVU), formerly Provo Municipal Airport, is a public-use airport on east shore of Utah Lake on the southwestern edge of Provo, in Utah County, Utah, United States. It is a small regional airport with domestic flights mainly to destinations in the western United States.\n\n(San Joaquin County, California > Government and policing > County government) The Government of San Joaquin County is defined and authorized under the California Constitution and California law as a general law county. Much of the government of California is in practice the responsibility of county governments, such as the Government of San Joaquin County. The County government provides countywide services such as elections and voter registration, law enforcement, jails, vital records, property records, tax collection, public health, and social services. In addition the County serves as the local government for all unincorporated areas. Some chartered cities such as Stockton and Tracy provide their own municipal services such as police, public safety, libraries, parks and recreation, and zoning. Some other cities arrange to have the County provide some or all of these services on a contract basis.  The County government is composed of the elected five-member four-year-term board of supervisors (BOS), which operates in a legislative, executive, and quasi-judicial capacity; several other elected offices including the Sheriff, District Attorney, and Assessor; and numerous county departments and entities under the supervision of the county administrator.  As of February 2025, the supervisors are:  In addition, several entities of the government of California have jurisdiction conterminous with San Joaquin County, such as the San Joaquin County Superior Court, and the California Department of Corrections and Rehabilitation operates the Deuel Vocational Institution, a state prison in unincorporated San Joaquin County near Tracy.\n\n(Politics of the United States > Local government > Special-purpose local governments) In addition to general-purpose government entities legislating at the state, county, and city level, special-purpose areas may exist as well, provide one or more specific services that are not being supplied by other existing governments. School districts are organized local entities providing public elementary and secondary education which, under state law, have sufficient administrative and fiscal autonomy to qualify as separate governments.  Special districts are authorized by state law to provide designated functions as established in the district's charter or other founding document, and with sufficient administrative and fiscal autonomy to qualify as separate governments; known by a variety of titles, including districts, authorities, boards, commissions, etc., as specified in the enabling state legislation."}, {"id": "b002", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What specific export-promotion programs or initiatives has the agency launched for film, fashion, and music creators?", "ev": "(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Trinidad and Tobago > Economy > Economic diversification) Trinidad and Tobago, in an effort to undergo economic transformation through diversification, formed InvesTT in 2012 to serve as the country's sole investment promotion agency. This agency is aligned to the Ministry of Trade and Industry and is to be the key agent in growing the country's non-oil and gas sectors significantly and sustainably.\n\n(Trinidad and Tobago > Government and politics > Disaster management and response > Local response) The Ministry of Rural Development and Local Government, along with regional and municipal corporations, are the first responders to major disasters. Each corporation maintains a Disaster Management Unit (DMU) responsible for managing all phases of extreme weather events within their local area. In Tobago, the Tobago Emergency Management Agency (TEMA), under the Tobago House of Assembly, handles disaster and emergency management. The Trinidad and Tobago Fire Service acts as the primary emergency response agency.\n\n(Trinidad and Tobago > Government and politics > Law enforcement and crime) The primary law enforcement agency of Trinidad and Tobago is the Trinidad and Tobago Police Service under the Ministry of Homeland Security. The current minister is Roger Alexander. On June 13, 2025 the House of Representatives approved a government motion for Acting Senior Superintendent of Police Allister Guevarro to be Commissioner of Police (CoP). Another law enforcement agency is the Trinidad and Tobago Municipal Police Service (TTMPS) under the Ministry of Rural Development and Local Government. They work within the various city, borough, and regional corporations. The current minister is Khadijah Ameen with the current administrator of the TTMPS being Assistant Commissioner of Police (ACP) Wayne Mystar Some other law enforcement agencies include:  Ministry of Defence  Ministry of Justice  Ministry of Homeland Security  Ministry of Finance  Ministry of Agriculture, Land and Fisheries  Ministry of Transport and Civil Aviation"}, {"id": "b003", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were television viewership figures and public attendance numbers for the multiweek selection events that year?", "ev": "(Lithuania in the Eurovision Song Contest 2014 > Abstract) Lithuania was represented at the Eurovision Song Contest 2014 with the song \"Attention\", written by Vilija Matačiūnaitė and Viktoras Vaupšas, and performed by Matačiūnaitė herself. The Lithuanian participating broadcaster, Lithuanian National Radio and Television (LRT), organised the national final \"Eurovizijos\" dainų konkurso nacionalinė atranka (Eurovision Song Contest national selection) in order to select its entry for the contest. The national final took place over 12 weeks and involved 20 artists and 16 songs competing in two different competitive streams. The results of each show were determined by the combination of votes from a jury panel and a public vote, and \"Attention\" performed by Vilija eventually emerged as the winner following the final.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 8 May 2014. Performing during the show in position 7, \"Attention\" was not announced among the top 10 entries of the second semi-final and therefore did not qualify to compete in the final. It was later revealed that Lithuania placed 11th out of the 15 participating countries in the semi-final with 36 points.\n\n(Lithuania in the Eurovision Song Contest 2014 > Background) Prior to the 2014 contest, Lithuania had participated in the Eurovision Song Contest 14 times since its first entry in 1994. The nation’s best placing in the contest was sixth, which it achieved in 2006 with the song \"We Are the Winners\", performed by LT United. Following the introduction of semi-finals in 2004, Lithuania, to this point, had managed to qualify to the final six times. In the 2013 contest, \"Something\" performed by Andrius Pojavis qualified to the final, where the song scored 17 points and placed 22nd.  For the 2014 contest, the Lithuanian national broadcaster, Lithuanian National Radio and Television (LRT), broadcast the event within Lithuania and organised the selection process for the nation's entry. Other than the internal selection of their debut entry in 1994, Lithuania has selected their entry consistently through a national final procedure. LRT confirmed their intentions to participate at the 2014 Eurovision Song Contest on 3 October 2013 and announced the organization of \"Eurovizijos\" dainų konkurso nacionalinė atranka, which would be the national final to select Lithuania's entry for Copenhagen.\n\n(Lithuania in the Eurovision Song Contest 2023 > Abstract) Lithuania was represented at the Eurovision Song Contest 2023 with the song \" Stay \" performed by Monika Linkytė. The Lithuanian participating broadcaster, the Lithuanian National Radio and Television (LRT), organised the national final Pabandom iš naujo! 2023 to select its entry for the contest.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 11 May 2023 and was later selected to perform in position 15. At the end of the show, \"Stay\" was announced among the top 10 entries of the second semi-final and hence qualified to compete in the final. It was later revealed that Lithuania placed fourth out of the sixteen participating countries in the semi-final with 110 points. In the final, Lithuania performed in position 22 and placed eleventh out of the 26 participating countries, scoring a total of 127 points.\n\n(Lithuania in the Eurovision Song Contest 2014 > Before Eurovision > \"Eurovizijos\" dainų konkurso nacionalinė atranka > Song selection > Semi-final) The semi-final of the competition aired on 23 February 2014 and featured each of the remaining three artists that qualified from the tenth elimination show performing the remaining three potential Eurovision songs. The show was originally scheduled to air on 22 February 2014; however, it was postponed due to LRT broadcasting live coverage of Euromaidan in Ukraine. The members of the Lithuanian jury consisted of Vytenis Pauliukaitis (director), Deivydas Zvonkus (lead singer of the group B'Avarija), Ramūnas Zilnys (music reviewer), and Edmundas Seilius (opera singer). International jury members included Brandon Stone (German music producer and composer), Valerij Prosvirov (Russian producer and record label director), and Liselott Björk (Swedish singer and vocal coach). The combination of the jury vote and the public vote resulted in a tie between two songs with 22 points each: \"Attention\" and \"Take a Look at Me Now\". \"Attention\" was declared the winning song as it received the most votes from the public.\n\n(Lithuania in the Eurovision Song Contest 2014 > At Eurovision > Voting) Voting during the three shows consisted of 50 percent public televoting and 50 percent from a jury deliberation. The jury consisted of five music industry professionals who were citizens of the country they represent, with their names published before the contest to ensure transparency. This jury was asked to judge each contestant based on: vocal capacity; the stage performance; the song's composition and originality; and the overall impression by the act. In addition, no member of a national jury could be related in any way to any of the competing acts in such a way that they cannot vote impartially and independently. The individual rankings of each jury member were released shortly after the final.  Following the release of the full split voting by the EBU after the conclusion of the competition, it was revealed that Lithuania had placed 11th with both the public televote and the jury vote in the second semi-final. In the public vote, Lithuania scored 41 points, while with the jury vote, Lithuania scored 44 points.  Below is a breakdown of points awarded to Lithuania and awarded by Lithuania in the second semi-final and final of the contest, and the breakdown of the jury voting and televoting conducted during the two shows:"}, {"id": "b004", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented audience metrics (e.g., total views, unique readers, circulation figures) were reported during its run?", "ev": "(Magical Girl Ore > Abstract) Magical Girl Ore (魔法少女俺, Mahō Shōjo Ore; \"Magical Girl Me \") is a Japanese manga series written and illustrated by Icchokusen Mōkon. It began serialization in Fusion Product's Comic Be magazine in 2012, and was collected in two tankōbon volumes. The series was renewed for serialization in the same magazine in 2014. A 12-episode anime television series adaptation animated by Pierrot+ aired from April 2 to June 18, 2018.\n\n(Lovely Muco > Media > Manga) Written and illustrated by Takayuki Mizushina, Lovely Muco was serialized in Kodansha 's seinen manga magazine Evening from 12 April 2011 to 23 September 2020. Kodansha collected its chapters in 17 tankōbon volumes, released from 23 April 2012 to 23 November 2020.  At Anime Expo 2022, Kodansha USA announced that they licensed the series for English publication.  A sequel manga, titled Daisuki! Itoshi no Muco, began serialization on Kodansha's Comic Days website began serialization on 10 September 2023. The first volume was released on 12 June 2024.\n\n(Wind Breaker (manga) > Media > Manga) Written and illustrated by Satoru Nii, the series began serialization on Kodansha 's Magazine Pocket website on January 13, 2021. As of March 2026, the series' individual chapters have been collected in 25 tankōbon volumes.  In March 2022, Kodansha USA announced that they had licensed the series for digital English publication. During their Anime NYC 2022 panel, Kodansha USA announced that they would begin releasing print copies in late 2023.\n\n(Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! > Abstract) Hello, I am a Witch, and My Crush Wants Me to Make a Love Potion! (Japanese: どうも、好きな人に惚れ薬を依頼された魔女です。, Hepburn: Dōmo, Suki na Hito ni Horegusuri o Iraisareta Majo desu) is a Japanese web novel series written by Eiko Mutsuhana. It was originally serialized on the online publication platform Shōsetsuka ni Narō from April 2019 to March 2020, before being published as a light novel by Futabasha under its M Novels f imprint in two volumes featuring illustrations by Vient between October 2019 and March 2020. A manga adaptation illustrated by Kamada began serialization began serialization on Kadokawa 's KadoComi service under its Flos Comic label in August 2020, and has been compiled into six volumes as of February 2026. An anime television series adaptation is set to premiere in 2026."}, {"id": "b005", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did the team's qualification for major tournaments affect international perceptions of Bosnian football?", "ev": "(List of Bosnia and Herzegovina football champions > List of champions > National Competitions > War in Bosnia and Herzegovina) After the breakup of Yugoslavia, and following proclamation of independence in late winter 1992, the Bosnian Football Association (N/FSBiH) applied for membership with FIFA and UEFA. Meanwhile, due to the outbreak of the Bosnian War in April 1992, no games were played in the 1992–93 season. In late 1993 some parts of the country re-launched football competitions with reduced scope. But just as the country was divided along ethnic lines, so was football.  In 1993, Bosnian Croats launched the Football Federation of Herzeg-Bosnia and its own First League of Herzeg-Bosnia, in which only Croat clubs competed on a parochial scale within the limits of West Herzegovina and few other enclaves. In the same year, Bosnian Serbs organized the First League of the Republika Srpska on a territory held by the Republika Srpska regime. Only football on territory under the control of the Republic of Bosnia and Herzegovina institutions and auspices of the N/FSBiH, at the time consequently with Bosniak majority, apart from a brief competition for the season 1994–95 (won by Čelik), came to a standstill. Competition under N/FSBiH auspices did not resume until the 1995–96 season when the Bosnian First League was officially launched.\n\n(Refik Šabanadžović > International career > Bosnia and Herzegovina) In March 1993, while the Bosnian War was raging, 27-year-old Šabanadžović took part in two friendly matches as part of \"Bosnia-Herzegovina Humanitarian Stars\" versus K.R.C. Genk and 1. FC Kaiserslautern in Genk and Koblenz, respectively. The hastily arranged team also featured many Bosnian born players who previously played in the Yugoslavia national team such as Faruk Hadžibegić, Safet Sušić, Mehmed Baždarević, Mirsad Baljić, Davor Jozić, Blaž Slišković, Haris Škoro, Semir Tuce, Meho Kodro, Predrag Jurić, and Husref Musemić. Though the matches only had humanitarian character, they were played with FIFA's approval and were widely seen as the first step in the eventual formation of the Bosnia and Herzegovina national football team.  Once the Bosnian national team started playing official matches in late November 1995, Šabanadžović didn't make further appearances.\n\n(Road signs in Bosnia and Herzegovina > Abstract) Road signs in Bosnia and Herzegovina do not differ much from the rest of Europe, such as Croatia, Slovenia, Serbia and North Macedonia. The Ministry of Transportation of Bosnia and Herzegovina regulates them. Bosnia and Herzegovina drives on the right as with the rest of Europe, except for Cyprus, Ireland, Malta and the United Kingdom. Bosnian and Herzegovinan road signs have two scripts, Latin and Cyrillic script.  The former Yugoslavia had originally signed the Vienna Convention on Road Signs and Signals on November 8, 1968 and ratified it on June 6, 1977. Yugoslavia formerly used a yellow background on warning signs. After the breakup of Yugoslavia when Bosnia and Herzegovina declared its independence in 1992, the country succeeded to the Vienna Convention on January 12, 1994.  Bosnian and Herzegovinan road signs use the SNV typeface.\n\n(Zlatko Aleksovski > Abstract) Zlatko Aleksovski (born 8 January 1960) is a former Bosnian Croat prison commander during the Bosnian War who was indicted by the International Criminal Tribunal for the former Yugoslavia and sentenced to seven years imprisonment for unlawful treatment of prisoners in Lašva Valley area in Bosnia and Herzegovina."}, {"id": "b006", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What evaluations or independent studies have identified limitations, unintended consequences, or gaps in the agency's programs for creative sectors?", "ev": "(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Trinidad and Tobago > Economy > Economic diversification) Trinidad and Tobago, in an effort to undergo economic transformation through diversification, formed InvesTT in 2012 to serve as the country's sole investment promotion agency. This agency is aligned to the Ministry of Trade and Industry and is to be the key agent in growing the country's non-oil and gas sectors significantly and sustainably.\n\n(Trinidad and Tobago > Government and politics > Disaster management and response > Local response) The Ministry of Rural Development and Local Government, along with regional and municipal corporations, are the first responders to major disasters. Each corporation maintains a Disaster Management Unit (DMU) responsible for managing all phases of extreme weather events within their local area. In Tobago, the Tobago Emergency Management Agency (TEMA), under the Tobago House of Assembly, handles disaster and emergency management. The Trinidad and Tobago Fire Service acts as the primary emergency response agency.\n\n(Trinidad and Tobago > Government and politics > Law enforcement and crime) The primary law enforcement agency of Trinidad and Tobago is the Trinidad and Tobago Police Service under the Ministry of Homeland Security. The current minister is Roger Alexander. On June 13, 2025 the House of Representatives approved a government motion for Acting Senior Superintendent of Police Allister Guevarro to be Commissioner of Police (CoP). Another law enforcement agency is the Trinidad and Tobago Municipal Police Service (TTMPS) under the Ministry of Rural Development and Local Government. They work within the various city, borough, and regional corporations. The current minister is Khadijah Ameen with the current administrator of the TTMPS being Assistant Commissioner of Police (ACP) Wayne Mystar Some other law enforcement agencies include:  Ministry of Defence  Ministry of Justice  Ministry of Homeland Security  Ministry of Finance  Ministry of Agriculture, Land and Fisheries  Ministry of Transport and Civil Aviation\n\n(Trinidad and Tobago > Economy > Energy policy and climate change) Trinidad and Tobago is the region's leading exporter of oil and gas but imports of fossil fuels provided over 90% of the energy consumed by its CARICOM neighbours in 2008. This vulnerability led CARICOM to develop an Energy Policy which was approved in 2013. This policy is accompanied by the CARICOM Sustainable Energy Roadmap and Strategy (C-SERMS). Under the policy, renewable energy sources are to contribute 20% of the total electricity generation mix in member states by 2017, 28% by 2022 and 47% by 2027.  In 2014 Trinidad and Tobago was the third country in the world which emitted the most CO per capita after Qatar and Curacao according to the World Bank. On average, each inhabitant produced 34.2 metric tons of CO in the atmosphere. In comparison, the world average was 5.0 tons per capita the same year. Over recent years CO emissions have declined, so that in 2021 at 21.01 tonnes per capita, Trinidad and Tobago ranked fourth, after the tiny countries smaller than half a million, such as Curacao, are excluded, and is the only non-Middle East country in the remaining worst seven CO emitters on a per capita basis.  In terms of emissions intensity of economy (defined as CO emissions per unit of GDP), Trinidad and Tobago ranked third globally. Its emissions-source profile is unique amongst the worst CO intensity emitters as the so-called \"other sectors\", which includes: industrial process emissions, agricultural soils and waste, accounts for more than fifty per cent of fossil CO emissions, rather than the power industry, other industrial combustion, transport and buildings sectors.  The Caribbean Industrial Research Institute in Trinidad and Tobago facilitates climate change research and"}, {"id": "b007", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What competitive declines, relegations, or periods of poor performance has the club endured and what reasons were given?", "ev": "(North Hobart Football Club > Abstract) The North Hobart Football Club, nicknamed The Demons, is an Australian rules football club currently competing in the Southern Football League Premier Division. The club was a part of the Tasmanian Football League from the early 1900s until 2001, when it joined the Southern Football League. In 2009, North Hobart was invited into the second reincarnation of the statewide league, where it remained until 2013. After the 2013 season, its position in the league was effectively filled by the Hobart City Football Club. North Hobart returned to the Tasmanian State League in 2018. However, following the cessation of the TSL in 2024, the club rejoined the Southern Football League in 2025  In 2014, the North Hobart Football Club Inc. changed from an incorporated body to a company limited with 100% ownership of the Hobart City Football Club, with the Hobart City Demons now the trading name of North Hobart Football Club Ltd.  On October 9, 2017 the paying members of the Hobart City Demons voted 371-118 in favour of returning the playing name of the club to the North Hobart identity for season 2018 and beyond.  Players to reach Australian Football League level include Paul Williams, Peter 'Percy' Jones, Daryn Cresswell, Chris Bond, James Manson, Jim Wright, Tony Pickett, Colin Garland and several other big names. In total 54 North Hobart players have moved on to play at VFL/AFL level.  In 2005, North Hobart was the first club inducted into the AFL Tasmania Hall of Fame as a Great Club.\n\n(Hobart Town Gazette > Abstract) The Hobart Town Gazette was established in 1816 in Hobart, Van Diemen's Land (known as Tasmania since 1856) as The Hobart Town Gazette and Southern Reporter. In 1821 the name was changed to the Hobart Town Gazette and Van Diemen's Land Advertiser. In 1825 the title was split, with the government authorised publication remaining the Hobart Town Gazette, and the original editor launching the Colonial Times, and Tasmanian Advertiser. From 1882 it was known as the Hobart Gazette and from 1907 as the Tasmanian Government Gazette.\n\n(Bellerive Oval > Abstract) Bellerive Oval (known under naming rights as Ninja Stadium) is an Australian rules football and cricket stadium located in the Hobart suburb of Bellerive. With a combination of seating and standing capacity of 20,000, it is the second-largest stadium in Tasmania (behind York Park in Launceston).  The stadium is the only Tasmanian venue that regularly hosts international cricket matches. It serves as the home ground for the Tasmanian Tigers, Tasmania's state cricket team, and the Hobart Hurricanes, a Big Bash League franchise. It has hosted international Test matches since 1989 and One-Day Internationals (ODIs) since 1988.\n\n(Hobart City High School > Abstract) Hobart City High School is a government co-educational high school in New Town, Hobart. Hobart City High School was formed in 2022 when Ogilvie High School and New Town High School merged. The merged schools were the last of Tasmania's single-sex public schools. Hobart City High caters for approximately 1200 students from Years 7 to 12. It is administered by the Tasmanian Department for Education, Children and Young People.  Hobart City High School has two main campuses called Oglivie and New Town to recognise the previous schools. In 2022, the school's first lead principal was Deb Day. As of 2024, the current lead principal is Britany Roestenburg."}, {"id": "b008", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the club's formal governance structure, including board composition and officer roles, as recorded in official documents?", "ev": "(North Hobart Football Club > Abstract) The North Hobart Football Club, nicknamed The Demons, is an Australian rules football club currently competing in the Southern Football League Premier Division. The club was a part of the Tasmanian Football League from the early 1900s until 2001, when it joined the Southern Football League. In 2009, North Hobart was invited into the second reincarnation of the statewide league, where it remained until 2013. After the 2013 season, its position in the league was effectively filled by the Hobart City Football Club. North Hobart returned to the Tasmanian State League in 2018. However, following the cessation of the TSL in 2024, the club rejoined the Southern Football League in 2025  In 2014, the North Hobart Football Club Inc. changed from an incorporated body to a company limited with 100% ownership of the Hobart City Football Club, with the Hobart City Demons now the trading name of North Hobart Football Club Ltd.  On October 9, 2017 the paying members of the Hobart City Demons voted 371-118 in favour of returning the playing name of the club to the North Hobart identity for season 2018 and beyond.  Players to reach Australian Football League level include Paul Williams, Peter 'Percy' Jones, Daryn Cresswell, Chris Bond, James Manson, Jim Wright, Tony Pickett, Colin Garland and several other big names. In total 54 North Hobart players have moved on to play at VFL/AFL level.  In 2005, North Hobart was the first club inducted into the AFL Tasmania Hall of Fame as a Great Club.\n\n(Don Kay (composer) > Abstract) Donald Henry Kay AM (born 25 January 1933) is an Australian classical composer.  Kay was born on 25 January 1933 in Smithton, Tasmania. He attained a Bachelor of Music degree at the University of Melbourne after which he taught music at Colac High School, Victoria, 1957–59. He then went on to teach music at Peckham Manor Comprehensive School for Boys, London, UK 1959-64 and was director of music there from 1962 to 1964. He studied composition privately at this time with Malcolm Williamson. His first publication was in 1964–65 with Songs of Come and Gone for choir, flute, piano and string orchestra.  Kay returned to Tasmania in 1965 with a young family of two daughters as lecturer of music at the Hobart Teachers College. In 1967 he was appointed Lecturer of composition and music education at Tasmanian Conservatorium of Music. He received his first commission in 1966, Organ Sonata, broadcast on ABC national radio by John Nicholls, the Hobart City Organist, in 1967. Active as a music tutor from the late 1960s to the middle 1970s with the Tasmanian Youth Theatre, Secheron House, Battery Point, Kay also composed a number of scores for production by the Tasmanian Puppet Theatre as well as Theatre Royal professional productions e.g. Richard II (Shakespeare), The Imaginary Invalid (Molière), the Wakefield Miracle Plays (Tasmania Festival, 1970) at that time. In 1984 Kay wrote an opera, The Golden Crane, with a libretto by Gwen Harwood.  During these years Kay was also contributing to Creative Music and arts workshops at National and International conferences for Music and Arts Education. He was appointed Senior Lecturer at the Tasmanian Conservatorium of Music in 1976; elected Dean of Music, University of Tasmania, 1989; and elected Head of the Conservatorium of Music at the University of Tasmania in 1990.  Kay has had over 50 compositions broadcast on ABC national radio and over 60 works publicly performed in Australia, UK, US, Switzerland and Italy from a symphony, to operas, orchestral and choral works to chamber and solo works.  In 1989 Tasmania Symphony - The Legend of Moinee for cello and orchestra was awarded the best composition by a composer resident in Tasmania in the Sounds Australian awards.  In 1990 Dance Concertante for String Orchestra was given a similar award.  Kay's music has been said to involve themes of Tasmanian ecology and Tasmanian history.  In June 1991 Don Kay was appointed a Member of the Order of Australia for his contribution to the arts and particularly to music composition. In 2001 he was awarded a Centenary Medal for an outstanding contribution to music, music education and composing in Tasmania.  He retired from the staff of the Tasmanian Conservatorium of Music in 1998, having served as head of department from 1990 to 1993 and has since been appointed adjunct professor in composition. He now composes full-time.\n\n(Hobart Town Gazette > Abstract) The Hobart Town Gazette was established in 1816 in Hobart, Van Diemen's Land (known as Tasmania since 1856) as The Hobart Town Gazette and Southern Reporter. In 1821 the name was changed to the Hobart Town Gazette and Van Diemen's Land Advertiser. In 1825 the title was split, with the government authorised publication remaining the Hobart Town Gazette, and the original editor launching the Colonial Times, and Tasmanian Advertiser. From 1882 it was known as the Hobart Gazette and from 1907 as the Tasmanian Government Gazette.\n\n(Seth Campbell > Early life and junior football) Campbell was raised in the north-western Tasmanian town of Burnie. He took up football at under 12s level with the Burnie Dockers and went on to play with the club's senior side in 2021. In the same year he played representative under 18 football for the Tasmania Devils in the NAB League and for his state at the AFL Under 17 Championships.  Campbell joined North Launceston in the Tasmanian Football League in 2022, the premier adult men's competition in the state. He scored a 10-goal haul in his third senior game for the club, as part of a 122-victory over North Hobart in mid-August. During the same year he once again played representative under 18 football for the Tasmania Devils in the NAB League, where he kicked 16 goals over 13 matches, including three goals in a win over the NT Thunder in May Campbell also played with the Allies side at the 2022 AFL Under 18 Championships alongside fellow Tasmanian juniors and those from the Australian Capital Territory, New South Wales, Northern Territory and Queensland. He played three matches at the tournament, including a game against South Australia where he recorded 15 disposals and kicked two goals."}, {"id": "b009", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Ground handling, cargo facilities, and navigation aids at Kota Kinabalu International Airport that support airline operations and turnaround times.", "ev": "(Archdiocese of Kota Kinabalu > Abstract) The Archdiocese of Kota Kinabalu (Latin language: Archdioecesis Kotakinabaluensis; Malay: Keuskupan Agung Kota Kinabalu; Mandarin: 哥打京那巴鲁总教区) is a metropolitan archdiocese of the Latin Church of the Catholic Church in Sabah, Malaysia, on the island of Borneo. The archdiocese is the oldest ecclesiastical territory in Malaysia, with a long history slowly rising along with the Catholic population from a prefecture to an archdiocese. Its cathedral archepiscopal see is Sacred Heart Cathedral, Kota Kinabalu. The patron saint of the archdiocese is St. Joseph, Spouse of the Blessed Virgin Mary.\n\n(Miri > Transportation > Air) Miri Airport (IATA: MYY, ICAO: WBGR) is an important gateway to the northern region of Sarawak. It is located 11 km south of Miri city. It serves as a hub for domestic, international, and rural air services. Miri Airport is the tenth busiest airport in Malaysia and second busiest in Sarawak. It provided services to 2.2 million passengers in 2013. The airport has only one direct international flight to Singapore. It also receives flights from domestic destinations such as Kuala Lumpur, Johor Bahru, Kota Kinabalu, Labuan, Kuching and other major towns in Sarawak. Miri Airport also caters flights to the Sarawak interior such as Bario, Ba'kelalan, Marudi, Lawas, Limbang, and Mukah through MASwings using DHC-6 Twin Otter aircraft.\n\n(Tun Fuad Stephens Park > Abstract) Tun Fuad Stephens Park is a recreational park in Bukit Padang, Kota Kinabalu, Sabah, Malaysia. It is built in honour of the late Chief Minister of Sabah Fuad Stephens who perished in the Double Six Tragedy in 1976.\n\n(Archdiocese of Kuala Lumpur > Abstract) The Metropolitan Archdiocese of Kuala Lumpur (Latin: Archidioecesis Kuala Lumpurensis; Malay: Keuskupan Agung Kuala Lumpur; Tamil: கோலாலம்பூர் மறைமாவட்டம்; Mandarin: 吉隆坡总教区) is an ecclesiastical territory or diocese of the Catholic Church in Malaysia. It was erected as the Diocese of Kuala Lumpur by Pope Pius XII on 25 February 1955, and was elevated to the rank of a Metropolitan Archdiocese on 18 December 1972, with the suffragan sees of Malacca-Johor and Penang. It also administers the capital city of Malaysia, Federal Territory of Kuala Lumpur as well as the federal administrative centre of Putrajaya and the urbanised states of Selangor and Negeri Sembilan in the central region as well as Pahang and Terengganu on the East Coast. The archdiocese's Mother Church and thus, seat of its Archbishop, is St. John's Cathedral. It is one of the three Roman Catholic archdioceses in Malaysia, with the ecclesiastical archdioceses of Kota Kinabalu and Kuching, both at the Borneo Islands."}, {"id": "b010", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have there been documented conflicts of interest, procurement controversies, or nepotism allegations involving the agency's leadership?", "ev": "(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Tebogo Malaka > Controversies) Her leadership at IDT has faced scrutiny due to allegations of procurement irregularities and conflict of interest. A forensic report linked to an R836 million oxygen plant tender uncovered significant issues, and investigations revealed over R33 million in contracts were awarded to a company linked to her sister-in-law. In August 2025, Malaka was suspended following a bribery allegation of R60 000 involving a journalist and amid mounting pressure over her role in previous tender decisions. The IDT board emphasized that the suspension is precautionary, with formal investigations ongoing. The Tebogo Malaka family trust claimed that she wasn't aware of the bribery, while Malaka denies allegation.\n\n(Trinidad and Tobago > Government and politics > Disaster management and response > Local response) The Ministry of Rural Development and Local Government, along with regional and municipal corporations, are the first responders to major disasters. Each corporation maintains a Disaster Management Unit (DMU) responsible for managing all phases of extreme weather events within their local area. In Tobago, the Tobago Emergency Management Agency (TEMA), under the Tobago House of Assembly, handles disaster and emergency management. The Trinidad and Tobago Fire Service acts as the primary emergency response agency.\n\n(Trinidad and Tobago > Culture > Sports > Other sports) Netball has long been a popular sport in Trinidad and Tobago, although it has declined in popularity in recent years. At the Netball World Championships they co-won the event in 1979, were runners up in 1987, and second runners up in 1983.  Rugby is played in Trinidad and Tobago and continues to be a popular sport, and horse racing is regularly followed in the country.  The Trinidad and Tobago national baseball team, controlled by the Baseball/Softball Association of Trinidad and Tobago, represents the nation in international competitions. The team is a provisional member of the Pan American Baseball Confederation.  There are a number of 9 and 18-hole golf courses on Trinidad and Tobago. The most established is the St Andrews Golf Club, Maraval in Trinidad (commonly referred to as Moka), and there is a newer course at Trincity, near Piarco Airport called Millennium Lakes. There are 18-hole courses at Chaguramas and Point-a-Pierre and nine-hole courses at Couva and St Madeline. Tobago has two 18-hole courses. The older of the two is at Mount Irvine, with the Magdalena Hotel & Golf Club (formerly Tobago Plantations) being built more recently.  Although a minor sport, bodybuilding is of growing interest in Trinidad and Tobago. Darrem Charles, a former world class body builder, is from Trinidad and Tobago.  Dragonboat is also another water-sport that has been rapidly growing over the years. Introduced in 2006. the fraternity made consistent strides in having more members a part of the TTDBF (Trinidad and Tobago Dragonboat Federation) as well as performing on an international level such as the 10th IDBF World Nations Dragon Boat Championships in Tampa, Florida in the US in 2011.  Claude Noel is a former world champion in professional boxing. He was born in Tobago.  The Trinidad and Tobago Chess Championship was started in 1937, and is an annual national chess championship.\n\n(Trinidad and Tobago > Economy > Economic diversification) Trinidad and Tobago, in an effort to undergo economic transformation through diversification, formed InvesTT in 2012 to serve as the country's sole investment promotion agency. This agency is aligned to the Ministry of Trade and Industry and is to be the key agent in growing the country's non-oil and gas sectors significantly and sustainably."}, {"id": "b011", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What economic or social impacts has the club had on the local Hobart community, such as events hosted or volunteer involvement?", "ev": "(North Hobart Football Club > Abstract) The North Hobart Football Club, nicknamed The Demons, is an Australian rules football club currently competing in the Southern Football League Premier Division. The club was a part of the Tasmanian Football League from the early 1900s until 2001, when it joined the Southern Football League. In 2009, North Hobart was invited into the second reincarnation of the statewide league, where it remained until 2013. After the 2013 season, its position in the league was effectively filled by the Hobart City Football Club. North Hobart returned to the Tasmanian State League in 2018. However, following the cessation of the TSL in 2024, the club rejoined the Southern Football League in 2025  In 2014, the North Hobart Football Club Inc. changed from an incorporated body to a company limited with 100% ownership of the Hobart City Football Club, with the Hobart City Demons now the trading name of North Hobart Football Club Ltd.  On October 9, 2017 the paying members of the Hobart City Demons voted 371-118 in favour of returning the playing name of the club to the North Hobart identity for season 2018 and beyond.  Players to reach Australian Football League level include Paul Williams, Peter 'Percy' Jones, Daryn Cresswell, Chris Bond, James Manson, Jim Wright, Tony Pickett, Colin Garland and several other big names. In total 54 North Hobart players have moved on to play at VFL/AFL level.  In 2005, North Hobart was the first club inducted into the AFL Tasmania Hall of Fame as a Great Club.\n\n(Bellerive Oval > Abstract) Bellerive Oval (known under naming rights as Ninja Stadium) is an Australian rules football and cricket stadium located in the Hobart suburb of Bellerive. With a combination of seating and standing capacity of 20,000, it is the second-largest stadium in Tasmania (behind York Park in Launceston).  The stadium is the only Tasmanian venue that regularly hosts international cricket matches. It serves as the home ground for the Tasmanian Tigers, Tasmania's state cricket team, and the Hobart Hurricanes, a Big Bash League franchise. It has hosted international Test matches since 1989 and One-Day Internationals (ODIs) since 1988.\n\n(Taste of Summer > Abstract) The Taste of Summer Festival, previously known as the Taste of Tasmania, is an annual event held in Hobart, Tasmania, from 27 December to 6 January. The festival includes over 75 stalls featuring local breweries, distilleries, wineries, and eateries, drawing in both locals and tourists from around the globe. Hosted at Princes Wharf Nº1, adjacent to the historic Salamanca Place, the festival coincides with the State's peak of the tourism season. Additionally, Hobart's waterfront is the place where New Year's Eve festivities are celebrated, including the Sydney to Hobart Yacht Race, \"one of the world's greatest, and hardest, offshore races,\" as described by The New York Times. Visitors have the opportunity to taste the Tasmanian cuisine and beverages while enjoying live music and entertainment provided by a diverse selection of interstate performers. The event serves as an example of the significant role tourism plays in the economy of Australia. Beyond offering a platform for displaying local products, Taste of Summer generates socio-economic benefits such as job creation and amplifies the region's food and wine industry. Also, the active participation of the community in organising, managing, and providing entertainment emphasize their role in economic development. The diversity of Taste of Summer allows interconnection within the communities through \"employment, volunteerism, networks and participation.\"\n\n(Hobart Rivulet Platypus > Abstract) Hobart Rivulet Platypus is a volunteer-led conservation organization dedicated to the protection and preservation of the platypus population in the Hobart Rivulet in nipaluna/ Hobart, Palawa/Tasmanian Aboriginal country. Founded on October 5, 2020, by Pete Walsh, the group focuses on direct action, community education, and advocacy to support the urban platypus population.\n\n(Hobart Town Gazette > Abstract) The Hobart Town Gazette was established in 1816 in Hobart, Van Diemen's Land (known as Tasmania since 1856) as The Hobart Town Gazette and Southern Reporter. In 1821 the name was changed to the Hobart Town Gazette and Van Diemen's Land Advertiser. In 1825 the title was split, with the government authorised publication remaining the Hobart Town Gazette, and the original editor launching the Colonial Times, and Tasmanian Advertiser. From 1882 it was known as the Hobart Gazette and from 1907 as the Tasmanian Government Gazette."}, {"id": "b012", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What official party positions and leadership roles has the politician held, with dates?", "ev": "(Gao Yan (politician, born 1958) > Biography) Gao Yan was born in November 1958 in Beijing. She began working in March 1977 and joined the Chinese Communist Party in April 1985. She graduated from Renmin University of China in 1982. Gao began her career in the Ministry of Foreign Trade and Economic Cooperation (MOFTEC), where she held several posts including Deputy Division Director and Director in the General Office. She later served as Deputy Director-General and then Director-General of the General Office of the Ministry of Commerce (MOFCOM), also acting as the Ministry's spokesperson and head of its Information Office.  In August 2003, she was appointed Vice Chairwoman and a member of the Party Leadership Group of the China Council for the Promotion of International Trade (CCPIT). During this period, she concurrently served as China's Government Representative to Expo 2005 Aichi in Japan and as a member of the Organizing Committee for Expo 2010 Shanghai. In August 2006, Gao was appointed Deputy Director of the Liaison Office of the Central People's Government in the Macao Special Administrative Region. In May 2013, she was appointed Vice Minister of Commerce and a member of the Ministry's Party Leadership Group.  In August 2018, Gao became Chairwoman and Party Secretary of the China Council for the Promotion of International Trade. She stepped down from both positions in January 2022. She has also served as a member of the 9th, 10th, and 11th Executive Committees of the All-China Women's Federation.\n\n(Cheng Ying (oncologist) > Career) Cheng spent her entire career at Jilin Cancer Hospital, where she held numerous positions of increasing responsibility, including director, deputy president, president, and party secretary. She was also the director of the Jilin Provincial Cancer Center and the Jilin Provincial Lung Cancer Diagnosis and Treatment Center.  Cheng held several key leadership roles in professional organizations. She served as the vice president of the Chinese Society of Clinical Oncology (CSCO) and was the chairwoman of the CSCO Small Cell Lung Cancer Committee. Additionally, she was the vice-chairman of the Lung Cancer Professional Committee of the Chinese Anti-Cancer Association.  In 2009, she received the Chinese Physician Award, the highest honor for a medical professional in China. In 2014, the Chinese Hospital Association named her an \"Outstanding Hospital President.\"\n\n(Christian Dürr > Abstract) Christian Dürr (born 18 April 1977) is a German politician who has been the Leader of the Free Democratic Party since May 2025, having previously led the parliamentary group of the party in the Bundestag from 2021 to 2025, in whom he served as a member of the Bundestag from 2017 to 2025.\n\n(José Maria de Alpoim > Abstract) José Maria de Alpoim Cerqueira Borges Cabral (Santa Cristina, Mesão Frio, 2 June 1858 - Lisbon, 15 December 1916) was a politician, member of the Progressive Party of Portugal, and later the Republican Party of Portugal, who held various roles during the last years of the constitutional monarchy in Portugal. He was a deputy in the Cortes, Counsel and Peer of the Realm, as well as holding positions in the Ministry of Justice, as well as roles in the First Portuguese Republic.\n\n(Christian Dürr > Political career > Member of the German Bundestag, 2017–2025) Dürr first became a member of the German Bundestag in the 2017 elections, representing the Delmenhorst – Wesermarsch – Oldenburg-Land district. Within his parliamentary group, he chaired the Bundestag group of FDP parliamentarians from Lower Saxony, Hamburg and Schleswig-Holstein. He also served as one of six deputy chairpersons of the FDP parliamentary group under the leadership of its chairman Christian Lindner, where he oversaw the group's activities on finance and budget policy.  Ahead of the 2021 election, Dürr was elected to lead the FDP's campaign in Lower Saxony.  In the negotiations to form a so-called traffic light coalition of the Social Democrats (SPD), the Green Party and the FDP following the 2021 federal elections, Dürr led his party's delegation in the working group on financial regulation and the national budget; his co-chairs from the other parties were Doris Ahnen and Lisa Paus.  In December 2021, Dürr was elected leader of the FDP parliamentary group in the Bundestag, succeeding Christian Lindner. In 2023, he was re-elected by 93 percent of his parliamentary group's members.  On 6 November 2024, the coalition broke. A Bundestag snap election took place on 23 February 2025. The FDP recorded their worst historical result with 4.3%, and lost all representation in the Bundestag (Five percent hurdle). Lindner stepped down as FDP chairman. In mid-March 2025, Dürr announced his candidacy for the party chairmanship and on May 16, 2025, he was elected at a federal party convention. The FDP failed to regain seats in the state parliaments of Baden-Württemberg and in Rhineland-Palatinate (both in March 2026), a clear majority of the FDP Federal Executive Committee voted in an internal meeting to completely restructure the executive committee."}, {"id": "b013", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has the psychologist integrated trauma expertise into investigative, documentation, or rehabilitation procedures in human rights work?", "ev": "(Archdiocese of Kuala Lumpur > History) In 1786, the first church was established in Penang. This led to the formation of Vicariate of Siam and Kedah, which expanded towards the entire Malayan Peninsula and Singapore. The Vicariate of Malaya was formed in 1841. The Church of Visitation was founded in 1848 in Seremban, Negeri Sembilan. This is the first known church to be erected in central Malaya. A historical moment was made in 1888, when the Diocese of Malacca was formed. The first church in Kuala Lumpur was dedicated to St John the evangelist in 1883, and would be later known as St. John's Cathedral, the Mother Church of Kuala Lumpur.  In 1955, the Diocese of Malacca became a Metropolitan Archdiocese, with the newly formed Diocese of Penang and Diocese of Kuala Lumpur as its suffragan sees. Bishop Dominic Vendargon was appointed as the first Bishop of Kuala Lumpur, and was ordained in the same year. In 1972, the Diocese of Kuala Lumpur was elevated into an Archdiocese, with the suffragan dioceses of Penang and Malacca-Johor.  In 1983, Archbishop Dominic Vendargon retired. Bishop Anthony Soter Fernandez of Penang was appointed as the 2nd Archbishop of Kuala Lumpur. When he retired in 2003, he was succeeded by Archbishop Murphy Pakiam who was then the Auxiliary Bishop. On 3 July 2014, the Vatican appointed Most Rev Julian Leow as the 4th Archbishop of Kuala Lumpur, after the resignation of Archbishop Emeritus Murphy Pakiam was accepted by Pope Francis in December 2013. This ending the 59 years of the ethnic Indian domination of the diocese's hierarchy with the election of Leow, an ethnic Chinese. During the consistory on 19 November 2016, Pope Francis installed Archbishop Emeritus Anthony Soter Fernandez as a cardinal, making him the first bishop from Malaysia to be appointed.\n\n(Kuala Lumpur Middle Ring Road 1 > Abstract) Kuala Lumpur Middle Ring Road 1, Federal Route 2 or the stretch of roads including Jalan Tun Razak, Lebuhraya Sultan Iskandar (Lebuhraya Mahameru), Jalan Damansara, Jalan Istana and Jalan Lapangan Terbang is an urban and municipal main ring road in Kuala Lumpur. It is also known as Kuala Lumpur–Petaling Jaya Traffic Dispersal Scheme by the Malaysian Public Works Department (JKR). It is a busy ring road during rush hour time. This ring road is maintained by Dewan Bandaraya Kuala Lumpur or Kuala Lumpur City Hall (DBKL)."}, {"id": "b014", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which directors, cinematographers, or acting coaches has Bharath repeatedly collaborated with across the four film industries?", "ev": "(List of highest-grossing Indian films > Overview) Indian films have been screened in markets around the world since the early 20th century. Since 2003, there are markets in over 90 countries where films from India are screened. During the first decade of the 21st century, there was a steady rise in the ticket price, a tripling in the number of theatres and an increase in the number of prints of a film being released, which led to a large increase in the box office collections.  As of 2014, Hindi cinema represents 43% of the net box office revenue in India, while Telugu and Tamil cinema represent 36%, and other industries constitute 21%. As of 2020, the combined revenue of all other language film industries has surpassed that of the Hindi film industry. By 2021, Telugu cinema became the largest film industry of India in terms of box-office. In 2023, the Hindi film industry accounted for 44% of box office revenue, followed by the Telugu industry at 19% and the Tamil industry at 16%. The Kannada (5%), Malayalam (3%), Bengali, Marathi, Odia, Punjabi, Gujarati and Bhojpuri industries contributed to the remainder, while the foreign film industry made up 9% of the total revenue. In 2024, the Hindi and the Telugu film industries accounted for 40% and 20% of the domestic gross box office revenue respectively, followed by Tamil with 15% share and Malayalam with 10% share.\n\n(Harmann Kaur > Abstract) Harmann Kaur is an Indian celebrity fashion stylist and image consultant known for her work with actors from the Telugu, Tamil, Malayalam, Kannada and Hindi film industries. She has styled several prominent film personalities and has been featured in Indian lifestyle and fashion publications for her contribution to celebrity styling.\n\n(Nassar (actor) > Abstract) Nassar (born Muhammad Hanif; 5 March 1958) is an Indian actor, director, producer, voice artist, singer and politician who mainly works in the Tamil, Telugu and Malayalam film industries. He has also worked in a few Kannada, English, Hindi and Bengali films. He is the incumbent president of the Nadigar Sangam, a trade union for film, television, and stage actors in Tamil Nadu.\n\n(Kerala > Culture > Cinema) Malayalam films carved a niche for themselves in the Indian film industry with the presentation of social themes. Directors from Kerala, like Adoor Gopalakrishnan, Mankada Ravi Varma, G. Aravindan, Bharathan, P. Padmarajan, M.T. Vasudevan Nair, K.G. George, Priyadarshan, John Abraham, Ramu Karyat, K S Sethumadhavan, A. Vincent and Shaji N Karun have made a considerable contribution to the Indian parallel cinema. Kerala has also given birth to numerous actors, such as Mohanlal, Mammootty, Satyan, Prem Nazir, Madhu, Sheela, Sharada, Miss Kumari, Jayan, Adoor Bhasi, Seema, Bharath Gopi, Thilakan, Vijaya Raghavan, Kalabhavan Mani, Indrans, Shobana, Nivin Pauly, Sreenivasan, Urvashi, Manju Warrier, Suresh Gopi, Jayaram, Murali, Shankaradi, Kavya Madhavan, Bhavana Menon, Prithviraj, Parvathy, Jayasurya, Dulquer Salmaan, Oduvil Unnikrishnan, Jagathy Sreekumar, Nedumudi Venu, KPAC Lalitha, Innocent and Fahadh Faasil. Late Malayalam actor Prem Nazir holds the world record for having acted as the protagonist of over 720 movies. Since the 1980s, actors Mohanlal and Mammootty have dominated the movie industry; Mohanlal has won five National Film Awards (four for acting), while Mammootty has three National Film Awards for acting. Malayalam Cinema has produced a few more notable personalities such as K. J. Yesudas, K.S. Chitra, M.G. Sreekumar, Vayalar Rama Varma, V. Madhusoodanan Nair, M.T. Vasudevan Nair and O.N.V. Kurup, the last two mentioned being recipients of Jnanpith award, the highest literary award in India. Resul Pookutty, who is from Kerala, is the only Indian to win an Academy Award for Best Sound Mixing, for the breakthrough film Slumdog Millionaire. As of 2018, Malayalam cinema has got 14 awards for the best actor, 6 for the best actress, 11 for the best film, and 13 for the best film director in the National Film Awards, India.\n\n(Kayadu Lohar > Abstract) Kayadu Lohar (born 11 April 2000) is an Indian actress and model who appears in Malayalam, Tamil and Telugu films. She made her acting debut with the Kannada film Mugilpete (2021), and got breakthrough with the Tamil film Dragon (2025)."}, {"id": "b015", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the formal organizational structure of Welsh Labour, including its relationship with UK Labour headquarters?", "ev": "(2026 Senedd election > Abstract) An election for the Senedd (Welsh Parliament; Welsh: Senedd Cymru) was held on 7 May 2026, to elect all 96 members to the Senedd. It was the seventh devolved general election since the Senedd (formerly the National Assembly for Wales) was established in 1999. It was the first election following numerous reforms: an increase in the size of the Senedd from 60 members to 96, the adoption of party-list proportional representation, the reduction of the number of constituencies to sixteen, and the shortening of its term from five years to four. The election was held on the same day as local elections in England and elections to the Scottish Parliament.  Welsh Labour lost government and its status as the largest party for the first time since devolution began in 1999, ending a winning streak that had lasted since the 1922 United Kingdom general election and resulting in a historic realignment of Welsh politics. Plaid Cymru emerged as the largest party for the first time with 43 seats, while Reform UK secured second place with 34 seats. Labour was reduced to third place with a historic low of 9 seats. The Welsh Conservatives and the Wales Green Party won 7 and 2 seats respectively, with the Greens entering the Senedd for the first time. With her failure to secure a seat in the constituency of Ceredigion Penfro, First Minister Eluned Morgan became the first leader of a government in the UK to lose their seat while in office.  Turnout was 51.72%, the highest ever for a Welsh devolved election.\n\n(2026 Senedd election > Background) In the 2021 Senedd election, Welsh Labour won another government with one seat short of a majority. Shortly after, they entered a co-operation agreement with Plaid Cymru, which fell short of a typical coalition or confidence and supply agreement but represented some degree of policy collaboration. At the 2022 Welsh local elections, the Welsh Conservatives suffered losses to Plaid Cymru and Labour.  In December 2023, Mark Drakeford announced he would stand down as First Minister, following the election of his successor. The ensuing Welsh Labour leadership election was won narrowly by Vaughan Gething. The Gething government lasted only until July 2024 due to two distinct scandals relating to allegations of cronyism and allegations that Gething had lied about deleting text messages relating to the COVID-19 pandemic. During this time, Plaid Cymru left the co-operation agreement.  In the midst of this, at the 2024 United Kingdom general election in Wales, Labour won the most seats and the Conservatives were wiped out: losing all their Welsh seats. Later in July, Gething announced he would stand down after a process to select his successor. The following July 2024 Welsh Labour leadership election was uncontested, with Eluned Morgan being elected.  At the UK-wide level, a number of other factors influenced the election, including various issues relating to the Starmer ministry and the ongoing United Kingdom cost-of-living crisis.  In October 2025, Plaid Cymru won the Caerphilly by-election from Labour, who had held the seat since the Senedd's inception in 1999 and its Westminister counterpart since the seat's creation in 1918.  Since the middle of the Gething Government, and continuing through successive events, Welsh Labour's polling performance had declined. Welsh Labour had previously been the most successful political party in the democratic era, having the longest winning streak of any political party. The 2026 vote is correspondingly considered to be seismic for Welsh politics and was touted as the \"most consequential Senedd election since 1999\". It has also attracted \"unprecedented\" interest internationally in Welsh politics, primarily from other European nations. Polls suggested a close race between Plaid Cymru and Reform UK.  The 2026 Senedd election was the first to feature an online elections information platform, vote.wales, managed by the Electoral Management Board for Wales, part of the Democracy and Boundary Commission Cymru.\n\n(Plaid Cymru > Abstract) Plaid Cymru (English: / p l aɪ d ˈ k ʌ m r i / plyde KUM -ree; Welsh:; lit. ' Party of Wales ', officially Plaid Cymru – the Party of Wales, and often referred to simply as Plaid) is a centre-left to left-wing Welsh nationalist political party in Wales, that supports Welsh independence from the United Kingdom. It campaigns on a platform of social democracy and civic nationalism. The party is a supporter of the European Union and is a member of the European Free Alliance (EFA). The party holds 4 of 32 Welsh seats in the UK House of Commons, 43 of 96 seats in the Senedd, and 200 of 1,234 principal local authority councillors. Plaid was formed in 1925 under the name Plaid Genedlaethol Cymru (' the national party of Wales ') and Gwynfor Evans won the first Westminster seat for the party at the 1966 Carmarthen by-election.  In 1999 (in the first devolved Welsh Assembly election), Plaid Cymru gained considerable ground in traditionally Labour heartlands. These breakthroughs were part of the intentional aim to win more seats in the Welsh valleys and North East Wales, which continues to be an ambition today. The party have mostly been in opposition in the Senedd. Although under the leadership of Ieuan Wyn Jones, the party was part of a coalition as a junior partner with Welsh Labour between 2007 and 2011. Wyn Jones became the deputy First Minister and Minister for the Economy and Transport, alongside other Plaid MSs who also joined the cabinet.  After losses in the 2011 Assembly elections and dropping down to being the third largest party, Wyn Jones stepped down. He was succeeded by Leanne Wood. In the 2016 Assembly elections Wood managed to win her constituency seat of Rhondda meaning the party gained one seat, and became the official opposition once again, although only for a brief period. In 2018 following internal pressure and a leadership contest, Adam Price defeated Wood and was elected the new leader. Following the 2021 Senedd election Plaid formed a co-operation agreement with the Welsh Labour government. In May 2023 Price resigned as leader following the publication of a report which detailed failings by the party to prevent sexual harassment and bullying. In June 2023 Rhun ap Iorwerth was elected unopposed as leader. The party won both its target seats in the 2024 general election, therefore becoming the second largest party representing Wales in the House of Commons.  Plaid Cymru won a plurality in the 2026 Senedd election with 43 out of 96 seats, and are expected to form the next Welsh government, with Rhun ap Iorwerth becoming the first Plaid Cymru First Minister.\n\n(2025 Caerphilly by-election > Analysis) The by-election was held in the run-up to the next Senedd election, due in May 2026. Plaid Cymru have led Caerphilly County Borough Council twice since devolution began in 1999, whilst the Senedd seat has been held by Labour for the duration of the period. The by-election was described as a challenge for Labour by Reform and Plaid Cymru in their heartland. Professor Laura McAllister noted that the result would \"signal fundamental realignment\" in Welsh politics and that the Welsh Labour hegemony in Wales was soon coming to an end.  The Times predicted the Caerphilly by-election to be a close race between Reform UK's Llŷr Powell and Plaid Cymru's Lindsay Whittle, and forecast a Labour loss. Labour MP Nia Griffith said the election would be \"very challenging\" for her party, believing Reform to be Labour's main challenger.  The election left the incumbent Welsh Labour government of Eluned Morgan with a minority of 29 of 59 seats in the Senedd, and the election was discussed as likely making it more difficult for Morgan's government to negotiate the next Welsh budget for 2026 to 2027.\n\n(2026 Welsh Labour leadership election > Abstract) The 2026 Welsh Labour leadership election will be held to elect the next leader of Welsh Labour after First Minister Eluned Morgan failed to win her seat in Ceredigion Penfro in the 2026 Senedd Cymru election and resigned on 8 May 2026. This will be the party's fourth leader in just over two years, after Vaughan Gething and Mark Drakeford. The new leader will not be Welsh First Minister after Labour placed third in the 2026 Senedd election, as it is the first time in its history the party has not won.  On 9 May 2026, Ken Skates was appointed as interim leader of Welsh Labour."}, {"id": "b016", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the birth name, birthdate, and place of the Indian model-turned-actress?", "ev": "(Kumari 21F (2018 film) > Abstract) Kumari 21F is a 2018 Indian Kannada -language romantic drama film directed by Sriman Vedula and starring Pranam Devaraj and Nidhi Kushalappa. The film is a remake of the Telugu film of the same name, which itself is loosely based on the French film Lila Says.\n\n(Vanisri > Abstract) Vanisri (born Rathna Kumari) is an Indian actress known for her works predominantly in Telugu, Tamil, and Kannada films. In a film career spanning 40 years, she has received three Filmfare Awards South, the Nandi Awards and the Tamil Nadu State Film Award.\n\n(Sanjjana > Abstract) Archana Manohar Galrani, known by her stage name as Sanjjana, is an Indian model and actress who predominantly works in Kannada and Telugu films. She made her film debut in the 2005 Telugu film Soggadu. She is known for her role in the Kannada film Ganda Hendathi (2006). She played a supporting role in the 2008 Telugu film Bujjigadu starring Prabhas. In 2017, she played Chandri in the Kannada crime drama Dandupalya 2. In 2025 she participated as a contestant in Telugu reality show Bigg Boss 9 and finished as 4th runner-up of the show.\n\n(Lakshmi (actress) > Early life) Lakshmi was born and raised in Chennai, Tamil Nadu. Her mother Kumari Rukmini was a T
