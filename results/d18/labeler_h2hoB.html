 only in exile that such political movements could develop, due to the strength of Portugal's grip on dissident activity within Mozambique itself.  The United Nations also put pressure on Portugal to move for decolonization. Portugal threatened to withdraw from NATO, which put a stop to pressure from within the NATO bloc, and nationalist groups in Mozambique were forced to turn to Soviet bloc for aid.\n\n(Demographics of Mozambique > Ethnic groups) Mozambique's major ethnic groups encompass numerous subgroups with diverse languages, dialects, cultures, and histories. Many are linked to similar ethnic groups living in inland countries.The estimated 4 million Makua are the largest ethnic group of the country and are dominant in the northern part of the country — the Sena and Shona (mostly Ndau and Manyika) are prominent in the Zambezi valley, and the Shangaan (Tsonga) dominate in southern Mozambique. Other groups include Makonde, Yao, Swahili, Tonga, Chopi, and Nguni (including Zulu). The country is also home to a growing number of white residents, most with Portuguese ancestry. During colonial rule, European residents hailed from every Mozambican province, and at the time of independence the total population was estimated at around 360,000. Most vacated the region after independence in 1975, emigrating to Portugal as retornados. There is also a larger mestiço minority with mixed African and Portuguese heritage. The remaining non-Blacks in Mozambique are primarily Indian Asiatics, who have arrived from Pakistan, Portuguese India, and numerous Arab countries. There are various estimates for the size of Mozambique's Chinese community, ranging from 1,500 to 12,000 as of 2007.\n\n(East African coral coast > Major habitat types) Fringing coral reefs extend along much of the coast, extending.5 to 2 km from the shore on the narrow continental shelf. Fringing reefs extend along the coasts of Kenya and Tanzania as far as the Ruvuma River, which forms the Tanzania-Mozambique boundary. The fringing reefs are interrupted by major river mouths, including the Tana and Athi rivers in Kenya and the Rufiji in Tanzania. Unguja Island has a fringing reef along its eastern shore and extending around the southern and northern tips of the island. Mafia Island has a fringing reef along its eastern shore which extends south to the Songo Songo Islands.  Seagrass beds are found in clear, shallow lagoons between the fringing reefs and the shore, and between offshore islands and the mainland.  River mouths are home to the East African mangroves. The Rufiji River delta is the largest mangrove ecosystem on the East African coast, and accounts for half of Tanzania's 55,000 ha of mangroves. Other important mangrove forests in Tanzania are in Lindi and Tanga, at the mouths of the Wami, Ruvu, Matandu and Ruvuma rivers, and on the Mafia Archipelago. Kenya has 52,980 ha of mangroves, over two-thirds of which are concentrated around Lamu. Kilifi and Kwale account for most of the rest.  Fringing reefs are uncommon along the Mozambican coast, limited by freshwater input from numerous rivers, and cold-water upwelling in the Mozambique Channel. Patch reefs are best developed on the Quirimbas Islands, Primeiras and Segundas Archipelago, and Mozambique Island and neighboring islands in Mozambique Bay. Mangroves are found in the many river mouths, and seagrass beds occur in sheltered coastal waters.\n\n(Mozambican War of Independence > Background > International consciousness and support) Leaders of the Mozambican independence movement were educated abroad and thus brought a focus on the transnational to their liberation efforts. Marcelino dos Santos, the movement's unofficial diplomat, took the lead on international networking between the movement and other countries that provided aid. They read Mao's works and thus adopted Maoist and Marxist–Leninist ideology at an early stage, even though the group's Marxist–Leninist affiliations were not made official until 1977. As such, their approach to the war for independence was rooted in understanding of international liberation struggles, especially those"}, {"id": "b067", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Who have been the head coaches and notable players associated with the Giza-based volleyball section?", "ev": "(2018 FIVB Women's Volleyball Challenger Cup qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball Challenger Cup qualification acted as the qualifiers section for the 2018 FIVB Women's Volleyball Challenger Cup for national teams that were members of the Asian Volleyball Confederation (AVC). This tournament was held in Almaty, Kazakhstan. The eventual winner earned the right to compete in the 2018 FIVB Women's Volleyball Challenger Cup.\n\n(2018 FIVB Women's Volleyball World Championship qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball World Championship qualification acts as qualifiers for the 2018 FIVB Women's Volleyball World Championship, to be held in Japan, for national teams which are members of the Asian Volleyball Confederation (AVC). A total of 4+1 slots (4 direct slots and 1 host slot) in the final tournament are available for AVC teams.\n\n(Abdulrahman Fawzi Hall > Abstract) Abdulrahman Fawzi Hall is a covered sports arena in Cairo, Egypt. The arena opened in 1986. The arena is the home venue of the Zamalek SC Handball team of the Egyptian Handball League, the Zamalek SC Basketball team of the Egyptian Basketball Super League, and the Zamalek SC Volleyball team of the Egyptian Volleyball League. All three teams are departments of Zamalek Sporting Club, which owns and operates the arena."}, {"id": "b068", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What changes in coaching, player recruitment, or youth development systems coincided with major club transitions?", "ev": "(Papua New Guinea national cricket team > Abstract) The Papua New Guinea men's national cricket team, nicknamed the Barramundis, represents Papua New Guinea in international cricket. The team is organised by Cricket PNG, which has been an associate member of the International Cricket Council (ICC) since 1973. Papua New Guinea first gained One-Day International (ODI) status by finishing fourth in the 2014 World Cup Qualifier. Papua New Guinea lost both their ODI and T20I status in March 2018 after losing a playoff match against Nepal during the 2018 Cricket World Cup Qualifier, a result that earned ODI and T20I status for their opponents. On 26 April 2019, Papua New Guinea defeated Oman to secure a top-four finish in the 2019 ICC World Cricket League Division Two and reclaim their ODI status.  Papua New Guinea again lost the ODI status in 2023 after a 117-run defeat against USA.  In April 2018, the ICC decided to grant full Twenty20 International (T20I) status to all its Members. Therefore, all Twenty20 matches played between Papua New Guinea and other ICC members since 1 January 2019 have the full T20I status."}, {"id": "b069", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When did Bosnia and Herzegovina form an independent national men's football team after the breakup of Yugoslavia?", "ev": "(Road signs in Bosnia and Herzegovina > Abstract) Road signs in Bosnia and Herzegovina do not differ much from the rest of Europe, such as Croatia, Slovenia, Serbia and North Macedonia. The Ministry of Transportation of Bosnia and Herzegovina regulates them. Bosnia and Herzegovina drives on the right as with the rest of Europe, except for Cyprus, Ireland, Malta and the United Kingdom. Bosnian and Herzegovinan road signs have two scripts, Latin and Cyrillic script.  The former Yugoslavia had originally signed the Vienna Convention on Road Signs and Signals on November 8, 1968 and ratified it on June 6, 1977. Yugoslavia formerly used a yellow background on warning signs. After the breakup of Yugoslavia when Bosnia and Herzegovina declared its independence in 1992, the country succeeded to the Vienna Convention on January 12, 1994.  Bosnian and Herzegovinan road signs use the SNV typeface.\n\n(List of Bosnia and Herzegovina football champions > List of champions > National Competitions > War in Bosnia and Herzegovina) After the breakup of Yugoslavia, and following proclamation of independence in late winter 1992, the Bosnian Football Association (N/FSBiH) applied for membership with FIFA and UEFA. Meanwhile, due to the outbreak of the Bosnian War in April 1992, no games were played in the 1992–93 season. In late 1993 some parts of the country re-launched football competitions with reduced scope. But just as the country was divided along ethnic lines, so was football.  In 1993, Bosnian Croats launched the Football Federation of Herzeg-Bosnia and its own First League of Herzeg-Bosnia, in which only Croat clubs competed on a parochial scale within the limits of West Herzegovina and few other enclaves. In the same year, Bosnian Serbs organized the First League of the Republika Srpska on a territory held by the Republika Srpska regime. Only football on territory under the control of the Republic of Bosnia and Herzegovina institutions and auspices of the N/FSBiH, at the time consequently with Bosniak majority, apart from a brief competition for the season 1994–95 (won by Čelik), came to a standstill. Competition under N/FSBiH auspices did not resume until the 1995–96 season when the Bosnian First League was officially launched.\n\n(Refik Šabanadžović > International career > Bosnia and Herzegovina) In March 1993, while the Bosnian War was raging, 27-year-old Šabanadžović took part in two friendly matches as part of \"Bosnia-Herzegovina Humanitarian Stars\" versus K.R.C. Genk and 1. FC Kaiserslautern in Genk and Koblenz, respectively. The hastily arranged team also featured many Bosnian born players who previously played in the Yugoslavia national team such as Faruk Hadžibegić, Safet Sušić, Mehmed Baždarević, Mirsad Baljić, Davor Jozić, Blaž Slišković, Haris Škoro, Semir Tuce, Meho Kodro, Predrag Jurić, and Husref Musemić. Though the matches only had humanitarian character, they were played with FIFA's approval and were widely seen as the first step in the eventual formation of the Bosnia and Herzegovina national football team.  Once the Bosnian national team started playing official matches in late November 1995, Šabanadžović didn't make further appearances.\n\n(Human rights in Bosnia and Herzegovina > History) Ethnic conflict has been prominent in the Bosnian and Herzegovinian society since the breakup of Yugoslavia. The three main ethnic groups are the Bosniaks, who are predominantly Muslim; the Croats, who are Catholic; and the Serbs, who are Eastern Orthodox. This ethnic conflict resulted in the Bosnian War which took place between 1992 and 1995 following Bosnia and Herzegovina's independence from the Socialist Federal Republic of Yugoslavia. The war resulted in death toll of over 101,000 people. War crimes and human rights violations were perpetrated by all nationalities involved. The largest amount of war crime charges were brought against the Serbs.\n\n(Marko Marin > Early life) Marin was born in Bosanska Gradiška, SR Bosnia and Herzegovina, SFR Yugoslavia (modern-day Gradiška, Bosnia and Herzegovina) to Bosnian Serb parents, mother Borka Marin and father Ranko Marin. Marin was only two years old when the family moved to Germany in 1991 due to his mother's job. Growing up in Frankfurt, Marin began playing football with local clubs."}, {"id": "b070", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which major mergers and acquisitions involving the firm occurred between 1950 and 2000, and on what dates?", "ev": "(Economy of the United States > Mergers and acquisitions) Since 1985 there have been three major waves of mergers and acquisitions in the country. 2017 has been the most active year in terms of number of deals (12,914), whereas 2015 cumulated to the biggest overall value of deals ($24 billion).  The biggest merger deal in U.S. history was the acquisition of Time Warner by America Online Inc. in 2000, where the bid was over $164 billion. Since 2000 acquisitions of U.S. companies by Chinese investors increased by 368%. The other way round—U.S. companies acquiring Chinese Companies—showed a decrease of 25%, with a short upwards trend until 2007.\n\n(1976 Memorial Cup > Abstract) The 1976 Memorial Cup occurred from May 9 to 16 at the Montreal Forum in Montreal, Quebec. It was the 58th annual Memorial Cup competition and determined the major junior ice hockey champion of the Canadian Hockey League (CHL). Participating teams were the winners of the Ontario Major Junior Hockey League, Quebec Major Junior Hockey League and Western Hockey League which were the Hamilton Fincups, Quebec Remparts and New Westminster Bruins. Hamilton won their second Memorial Cup, and first since changing their name to Fincups, defeating New Westminster in the final game.\n\n(Steven MacKinnon > Early life and education) MacKinnon was born in Charlottetown, Prince Edward Island, and studied business at the Université de Moncton and Queen's University.  In addition to his career in politics, MacKinnon has worked in business and public affairs. From 2007 to 2015, he was Senior Vice-President and National Practice Leader at a global public affairs consultancy firm, where he led teams and major projects in mergers and acquisitions and financial communications."}, {"id": "b071", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What formal or informal qualifications, prior experiences, or mentorships prepared him for training and production work?", "ev": "(Canis Lupus (wrestler) > Professional wrestling career) The wrestler who would later be known as \"Canis Lupus\" was initially trained by Arkangel de la Muerte as part of the Consejo Mundial de Lucha Libre (CMLL) wrestling school located in Mexico City. Due to the secrecy that surrounds enmascarados (\"Masked wrestlers\"), it has not been revealed what ring name he used while training with Arkangel de la Muerte, just that he trained with him but never graduated to working for CMLL itself."}, {"id": "b072", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What structural powers and duties were assigned to Newcastle's municipal corporation under historical charters and statutes?", "ev": "(2021 Newcastle City Council election > Background > History) The Local Government Act 1972 created a two-tier system of metropolitan counties and districts covering Greater Manchester, Merseyside, South Yorkshire, Tyne and Wear, the West Midlands, and West Yorkshire starting in 1974. Newcastle was a district of the Tyne and Wear metropolitan county. The Local Government Act 1985 abolished the metropolitan counties, with metropolitan districts taking on most of their powers as metropolitan boroughs. The North of Tyne Combined Authority was created in 2018 and began electing the mayor of the North of Tyne from 2019, which was given strategic powers covering a region covering some of the same area as the former Tyne and Wear metropolitan county, as well as Northumberland.  Since its creation, Newcastle has variously been under Labour, Liberal Democrat and Conservative control. The Liberal Democrats held a majority of seats on the council from 2004 until 2011, when Labour gained enough seats to control the council. Nick Forbes became leader of the council. Labour continued to gain seats until the 2019 election, when the party lost two seats but continued to have an overall majority.  The Local Government Boundary Commission for England produced new boundaries for Newcastle ahead of the 2018 election, meaning that the 2018 elections were all-out, with all councillors being elected before returning to electing by thirds. Candidates up for re-election in 2021 are those who came second in each ward in 2018.\n\n(Newcastle Airport Metro station > Abstract) Airport (also known as Newcastle Airport) is a Tyne and Wear Metro station, serving Newcastle International Airport in the English city of Newcastle upon Tyne. It opened as a terminus station in 1991, following the opening of the extension from Bank Foot to Airport.\n\n(Blaydon railway station > Abstract) Blaydon is a railway station on the Tyne Valley Line, which runs between Newcastle and Carlisle via Hexham. The station, situated 5 miles 39 chains (5.49 mi; 8.83 km) west of Newcastle, serves the town of Blaydon, Gateshead in Tyne and Wear, England. It is owned by Network Rail and managed by Northern Trains.\n\n(Royal Commission on the Amalgamation of the City and County of London > The commission's report > Powers, duties and property of the old corporation > Ceremonial functions and shrievalty) The new corporation was to succeed \"without breach of continuity\" to the powers and possessions the former City. The lord mayor would continue to enjoy the existing rights and privileges, and it would be lawful for the corporation to vote a sum to meet the costs of the office. The lord mayor and corporation were to retain the right of special access to the Sovereign, and to present petitions to the House of Commons.  The Sheriffs of London would be chosen by the council of the new corporation in the same manner as those of counties corporate under the Municipal Corporations Act 1882.\n\n(Great North Children's Hospital > Abstract) The Great North Children's Hospital (GNCH) is a tertiary referral centre in Newcastle upon Tyne, England. The hospital is managed by the Newcastle upon Tyne Hospitals NHS Foundation Trust and is a teaching hospital for the University of Newcastle upon Tyne. It is one of only 14 such children's hospitals in the United Kingdom."}, {"id": "b073", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When was Kota Kinabalu International Airport originally opened and what major development milestones occurred by decade?", "ev": "(Archdiocese of Kota Kinabalu > Abstract) The Archdiocese of Kota Kinabalu (Latin language: Archdioecesis Kotakinabaluensis; Malay: Keuskupan Agung Kota Kinabalu; Mandarin: 哥打京那巴鲁总教区) is a metropolitan archdiocese of the Latin Church of the Catholic Church in Sabah, Malaysia, on the island of Borneo. The archdiocese is the oldest ecclesiastical territory in Malaysia, with a long history slowly rising along with the Catholic population from a prefecture to an archdiocese. Its cathedral archepiscopal see is Sacred Heart Cathedral, Kota Kinabalu. The patron saint of the archdiocese is St. Joseph, Spouse of the Blessed Virgin Mary.\n\n(Miri > Transportation > Air) Miri Airport (IATA: MYY, ICAO: WBGR) is an important gateway to the northern region of Sarawak. It is located 11 km south of Miri city. It serves as a hub for domestic, international, and rural air services. Miri Airport is the tenth busiest airport in Malaysia and second busiest in Sarawak. It provided services to 2.2 million passengers in 2013. The airport has only one direct international flight to Singapore. It also receives flights from domestic destinations such as Kuala Lumpur, Johor Bahru, Kota Kinabalu, Labuan, Kuching and other major towns in Sarawak. Miri Airport also caters flights to the Sarawak interior such as Bario, Ba'kelalan, Marudi, Lawas, Limbang, and Mukah through MASwings using DHC-6 Twin Otter aircraft.\n\n(Archdiocese of Kota Kinabalu > History) Originally erected on 4 September 1855 as the Apostolic prefecture of Labuan and Borneo, created on territory split off from the then Apostolic Vicariate of Batavia (Java) (including the neighbouring Dutch East Indies).  On 5 February 1927 it was renamed the Apostolic Prefecture of Northern Borneo, and lost territory to form the Apostolic Prefecture of Sarawak (now Dioceses of Kuching, Sibu and Miri).  On 14 February 1952 the prefecture was promoted to Apostolic Vicariate of Jesselton, hence entitled to a titular bishop. On 22 March 1962 its name was changed once more to the Apostolic Vicariate of Kota Kinabalu, after its see.  On 31 May 1976 the vicariate was elevated to a full Diocese of Kota Kinabalu, suffragan in the ecclesiastical province of the Metropolitan Archdiocese of Kuching.  The diocese lost territories twice, to create its present suffragans :  On 23 May 2008, by the papal bull \"Cum Ecclesia Catholica\", the diocese was elevated to Metropolitan Archdiocese, whose ecclesiastical province comprises the above suffragan dioceses, both formerly part of the original territory of the diocese of Kota Kinabalu: the Dioceses of Keningau and Sandakan.  On 21 June 2010, Pope Benedict XVI appointed John Wong Soo Kau, director of the aspirants' formation house in Kota Kinabalu, as Coadjutor Archbishop of Kota Kinabalu. His ordination took place on 1 October 2010 and was installed as the second and current Archbishop of this diocese in 2013. His predecessor, John Lee Hiong Fun-Yit Yaw, has been served as the first Archbishop from 1987 to his retirement on 1 December 2012.\n\n(Tun Fuad Stephens Park > Abstract) Tun Fuad Stephens Park is a recreational park in Bukit Padang, Kota Kinabalu, Sabah, Malaysia. It is built in honour of the late Chief Minister of Sabah Fuad Stephens who perished in the Double Six Tragedy in 1976."}, {"id": "b074", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What precedent cases or past attorney general actions were cited by the candidate as models for implementing their priorities?", "ev": "(1958 Connecticut Attorney General election > Abstract) The 1958 Connecticut Attorney General election took place on November 4, 1958, to elect the Attorney General of Connecticut. Incumbent Republican Attorney General John J. Bracken did not seek re-election. Democratic nominee Albert L. Coles defeated Republican nominee Simon S. Cohen. As of 2026, this was the last time the Attorney General's office of Connecticut changed partisan control.\n\n(1910 Minnesota Attorney General election > General election) On election day, November 8, 1910, Republican nominee George T. Simpson won re-election by a margin of 85,074 votes against his opponent Democratic nominee John M. Freeman, thereby retaining Republican control over the office of attorney general. Simpson was sworn in for his second term on January 4, 1911.\n\n(2002 Maryland Attorney General election > General election) On election day, November 5, 2002, Democratic nominee J. Joseph Curran Jr. won re-election by a margin of 496,543 votes against his opponent Republican nominee Edwin MacVaugh, thereby retaining Democratic control over the office of attorney general. Curran was sworn in for his fifth term on January 3, 2003."}, {"id": "b075", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What impacts have Makonde political alignments had on local governance, representation, and conflict during Mozambican civil war and Tanzanian politics?", "ev": "(Mozambican War of Independence > Abstract) The Mozambican War of Independence was an armed conflict between the guerrilla forces of the Mozambique Liberation Front (FRELIMO) and Portugal. The war officially started on 25 September 1964, and ended with a ceasefire on 8 September 1974, resulting in a negotiated independence in 1975.  Portugal's wars against guerrilla fighters seeking independence in its 400-year-old African territories began in 1961 with Angola. In Mozambique, the conflict erupted in 1964 as a result of unrest and frustration amongst many indigenous Mozambican populations, who perceived foreign rule as exploitation and mistreatment, which served only to further Portuguese economic interests in the region. Many Mozambicans also resented Portugal's policies towards indigenous people, which resulted in discrimination and limited access to Portuguese-style education and skilled employment.  As self-determination movements spread throughout Africa after World War II, many Mozambicans became progressively more nationalistic in outlook, and increasingly frustrated by the nation's continued subservience to foreign rule. For the other side, many enculturated indigenous Africans who were fully integrated into the social organization of Portuguese Mozambique, in particular those from urban centres, reacted to claims of independence with a mixture of discomfort and suspicion. The ethnic Portuguese of the territory, which included most of the ruling authorities, responded with increased military presence and fast-paced development projects.  A mass exile of Mozambique's political intelligentsia to neighboring countries provided havens from which radical Mozambicans could plan actions and foment political unrest in their homeland. The formation of FRELIMO and the support of the Soviet Union and the Communist Bloc through arms and advisers, led to the outbreak of violence that was to last well over a decade.  From a military standpoint, the Portuguese regular army held the upper hand during the conflict against FRELIMO guerrilla forces. Nonetheless, Mozambique succeeded in achieving independence on 25 June 1975, after a civil resistance movement known as the Carnation Revolution backed by portions of the military in Portugal overthrew the Salazar regime, thus ending 470 years of Portuguese colonial rule in the East African region. According to historians of the Revolution, the military coup in Portugal was in part fueled by protests concerning the conduct of Portuguese troops in their treatment of some of the indigenous Mozambican populace. The growing communist influence within the group of Portuguese insurgents who led the military coup and the pressure of the international community in relation to the Portuguese Colonial War were the primary causes of the outcome.\n\n(East African coral coast > Major habitat types) Fringing coral reefs extend along much of the coast, extending.5 to 2 km from the shore on the narrow continental shelf. Fringing reefs extend along the coasts of Kenya and Tanzania as far as the Ruvuma River, which forms the Tanzania-Mozambique boundary. The fringing reefs are interrupted by major river mouths, including the Tana and Athi rivers in Kenya and the Rufiji in Tanzania. Unguja Island has a fringing reef along its eastern shore and extending around the southern and northern tips of the island. Mafia Island has a fringing reef along its eastern shore which extends south to the Songo Songo Islands.  Seagrass beds are found in clear, shallow lagoons between the fringing reefs and the shore, and between offshore islands and the mainland.  River mouths are home to the East African mangroves. The Rufiji River delta is the largest mangrove ecosystem on the East African coast, and accounts for half of Tanzania's 55,000 ha of mangroves. Other important mangrove forests in Tanzania are in Lindi and Tanga, at the mouths of the Wami, Ruvu, Matandu and Ruvuma rivers, and on the Mafia Archipelago. Kenya has 52,980 ha of mangroves, over two-thirds of which are concentrated around Lamu. Kilifi and Kwale account for most of the rest.  Fringing reefs are uncommon along the Mozambican coast, limited by freshwater input from numerous rivers, and cold-water upwelling in the Mozambique Channel. Patch reefs are best developed on the Quirimbas Islands, Primeiras and Segundas Archipelago, and Mozambique Island and neighboring islands in Mozambique Bay. Mangroves are found in the many river mouths, and seagrass beds occur in sheltered coastal waters.\n\n(Mozambican War of Independence > Background > Rise of FRELIMO) Portugal designated Mozambique an overseas territory in 1951 in order to show the world that the colony had greater autonomy. It was called the Overseas Province of Mozambique (Província Ultramarina de Moçambique). Nonetheless, Portugal still maintained strong control over its colony. The increasing number of newly independent African nations after World War II, coupled with the ongoing mistreatment of the indigenous population, encouraged the growth of nationalist sentiment within Mozambique.  Mozambique was marked by large disparities between the wealthy Portuguese and the rural indigenous African population. Poorer whites, including illiterate peasants, were given preference in lower-level urban jobs, where a system of job reservation existed. In the rural areas, Portuguese controlled the trading stores with which African peasants interacted. Being largely illiterate and preserving their local traditions and ways of life, skilled employment opportunities and roles in administration and government were rare for these numerous tribal populations, leaving them few or no opportunities in the urban modern life. Many indigenous peoples saw their culture and tradition being overwhelmed by the alien culture of Portugal. A small educated African class did emerge, but faced substantial discrimination.  Vocal political dissidents opposed to Portuguese rule and claiming independence were typically forced into exile. From the mid-1920s onward, unions and left-wing opposition groups were suppressed within both Portugal and its colonies by the authoritarian Estado Novo regime. The Portuguese government forced black Mozambican farmers to grow rice or cotton for export, providing little for the farmers to support themselves. Many other workers—over 250,000 by 1960—were pressured to work on coal and gold mines in neighboring territories, mainly in South Africa, where they comprised over 30% of black underground miners. By 1950, only 4,353 Mozambicans out of 5,733,000 had been granted the right to vote by the Portuguese colonial government. The rift between Portuguese settlers and Mozambican locals is illustrated in one way by the small number of people with mixed Portuguese and Mozambican heritage (mestiço), numbering only 31,465 in a population of 8–10 million in 1960 according to that year's census.  The Mozambique Liberation Front, or FRELIMO, formally Marxist-Leninist as of 1977 but adherent to such positions since the late 1960s, was formed in Dar es Salaam, Tanzania, on 25 June 1962, under the leadership of sociologist Eduardo Mondlane. It was created during a conference of political figures who had been forced into exile, by the merging of various existing nationalist groups, including the Mozambican African National Union, National African Union of Independent Mozambique and the National Democratic Union of Mozambique which had been formed two years earlier. It was only in exile that such political movements could develop, due to the strength of Portugal's grip on dissident activity within Mozambique itself.  The United Nations also put pressure on Portugal to move for decolonization. Portugal threatened to withdraw from NATO, which put a stop to pressure from within the NATO bloc, and nationalist groups in Mozambique were forced to turn to Soviet bloc for aid.\n\n(Demographics of Mozambique > Ethnic groups) Mozambique's major ethnic groups encompass numerous subgroups with diverse languages, dialects, cultures, and histories. Many are linked to similar ethnic groups living in inland countries.The estimated 4 million Makua are the largest ethnic group of the country and are dominant in the northern part of the country — the Sena and Shona (mostly Ndau and Manyika) are prominent in the Zambezi valley, and the Shangaan (Tsonga) dominate in southern Mozambique. Other groups include Makonde, Yao, Swahili, Tonga, Chopi, and Nguni (including Zulu). The country is also home to a growing number of white residents, most with Portuguese ancestry. During colonial rule, European residents hailed from every Mozambican province, and at the time of independence the total population was estimated at around 360,000. Most vacated the region after independence in 1975, emigrating to Portugal as retornados. There is also a larger mestiço minority with mixed African and Portuguese heritage. The remaining non-Blacks in Mozambique are primarily Indian Asiatics, who have arrived from Pakistan, Portuguese India, and numerous Arab countries. There are various estimates for the size of Mozambique's Chinese community, ranging from 1,500 to 12,000 as of 2007.\n\n(RENAMO > History > Independence and formation) From the early 1960s to the mid-1970s, Portugal fought a series of bitter counter-insurgency conflicts against independence movements in its three primary African colonies— Angola, Mozambique, and Guinea-Bissau. In Mozambique, the armed struggle against colonial rule was spearheaded by the Front for the Liberation of Mozambique (FRELIMO), which was initially formed in exile in neighbouring Tanzania. FRELIMO recruited from Mozambican migrant workers and intellectuals living abroad, where they had been exposed to the emerging popularity of anti-colonial and nationalist causes overseas. Its political programme was anti-colonial, but also anti-traditionalist; FRELIMO leaders planned to wrest social and political power from the Portuguese administration, as well as on the grassroots level from local tribal authorities. The party also envisioned a radical restructuring of post-colonial Mozambican society in accordance with the principles of scientific socialism. In September 1964, FRELIMO initiated an armed insurgency. Its decision to take up arms was influenced by a number of internal and external factors, namely the recent successes of indigenous anti-colonial guerrilla movements in French Indochina and French Algeria, as well as encouragement from contemporary African statesmen such as Ahmed Ben Bella, Gamal Abdel Nasser"}, {"id": "b076", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were the dates, host cities, and venues for the 2016 FIFA U-20 Women's World Cup in Papua New Guinea?", "ev": "(FIFA U-17 Women's World Cup > History) In 2003, after the inaugural success of the 2002 FIFA U-19 Women's World Championship, held in Canada, FIFA proposed adding a second youth tournament for girls. Continental confederations told FIFA it would be difficult to create a second championship, with the age limits in place at the time. Therefore, FIFA created the U-17 Women's World Cup and the U-20 Women's World Championship (renamed the \"U-20 Women's World Cup\" in 2007), the same age groups as its men's youth tournaments. Accordingly, the age limit for the U-19 championship was increased to 20, effective with the 2006 FIFA U-20 Women's World Championship in Russia. FIFA committed to creating a U-17 women's championship, stated to begin in 2008.  The first tournament was held in 2008 in New Zealand from 28 October to 16 November. Four cities hosted matches during the inaugural tournament – North Shore City (North Harbour Stadium), Hamilton (Waikato Stadium), Wellington (Wellington Stadium) and Christchurch (Queen Elizabeth II Park). New Zealand won hosting rights at the same time that Chile received hosting honours for the 2008 FIFA U-20 Women's World Cup.  On 4 April 2020, FIFA announced the decision of postponing the 2020 World Cup which was originally scheduled in five venues to be held from 2 to 21 November in India. The tournament was initially postponed to 2021, subject to further monitoring. On 17 November 2020, FIFA announced that the 2020 edition of the tournament would be cancelled, and India were appointed as hosts of the next edition of the tournament in 2022. However, on 16 August 2022, India were stripped of their hosting rights for 2022 as the All India Football Federation was suspended by FIFA. The rights were given back to India on 26 August 2022 as the AIFF was reinstated by FIFA.  Dominican Republic was selected as host for the 2024 edition on 23 June 2023.  Starting from 2025 the U-17 Women's World Cup and its men's counterpart are held annually. Morocco was selected on 14 March 2024 to host the 2025–2029 editions, becoming the first African country to stage the tournament.\n\n(Sarah Morton (footballer) > Abstract) Sarah Jane Mahina-A-Rangi Morton (born 28 August 1998) is a New Zealand footballer who currently plays for Western Springs as a centre defensive midfielder. She has represented New Zealand at both age group and senior international level.  Morton was a member of the New Zealand U-17 side at the 2014 FIFA U-17 Women's World Cup in Costa Rica, the New Zealand U-20 side at the 2016 FIFA U-20 Women's World Cup in Papua New Guinea, and again at the 2018 FIFA U-20 Women's World Cup in France. Morton is now the captain of the Waterside Karori first team who plays in the Central League. On the 26th of August 2024, Sarah scored a goal against Petone FC to help her team to a 4-2 win. Sarah coaches the Waterside Karori Women’s Third XI and led them to victory in the 2024 Capital Division 4 Women’s League.  Morton made her senior début for the Football Ferns as starting left fullback in a 1–3 loss to Japan on 10 June 2018.\n\n(2020 FIFA U-20 Women's World Cup > Host selection > First round of bidding) On 25 July 2018, FIFA announced that bidding process had begun for the 2020 FIFA U-20 Women's World Cup and the 2020 FIFA U-17 Women's World Cup. A member association was able to bid for both tournaments, with the caveat that two different hosts would be appointed. The following associations declared interest in hosting the event by the deadline of 12 September 2018.  When India was appointed as the host of the U-17 Women's World Cup, they were then no longer eligible to be selected as host of the 2020 FIFA U-20 Women's World Cup.\n\n(2020 FIFA U-20 Women's World Cup > Abstract) The 2020 FIFA U-20 Women's World Cup, was originally going to be the 10th edition of the FIFA U-20 Women's World Cup, the biennial international women's youth football championship contested by the under-20 national teams of the member associations of FIFA, since its inception in 2002 as the FIFA U-19 Women's World Championship (the age limit was raised from 19 to 20 in 2008).  The tournament was originally scheduled to be held in August to September 2020 by Costa Rica and Panama, with the latter hosting its first FIFA tournament; this would have been the first FIFA youth tournament to be hosted by more than one country. However, due to the COVID-19 pandemic, FIFA announced on 3 April 2020 that the tournament would be postponed and rescheduled. On 12 May 2020, FIFA announced that the tournament would be held between 20 January – 6 February 2021, subject to further monitoring. In July 2020, due to COVID-19 concerns with the highest cases and deaths of all Central America, Panama backed out from co-hosting leaving Costa Rica the solo host.  On 17 November 2020, FIFA announced that the 2020 edition of the tournament would be cancelled. Instead, Costa Rica were appointed as hosts of the next edition of the tournament in 2022.  Japan were the defending champions, having won their first title in 2018.\n\n(Women's association football > Youth tournaments) In 2002, FIFA inaugurated a women's youth championship, officially called the FIFA U-19 Women's World Championship. The first event was hosted by Canada. The final was an all- CONCACAF affair, with the United States defeating the host Canada 1–0 with an extra-time golden goal. The second event was held in Thailand in 2004 and won by Germany. The age limit was raised to 20, starting with the 2006 event held in Russia. Demonstrating the increasing global reach of the women's game, the winners of this event were North Korea. The tournament was renamed the FIFA U-20 Women's World Cup since the 2008 edition, which was won by the US in Chile. Japan won the tournament in France in 2018.  In 2008, FIFA instituted an under-17 world championship. The inaugural event, held in New Zealand, was won by North Korea. Spain won this tournament in Uruguay in 2018."}, {"id": "b077", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Statistics or studies linking airport capacity changes at Kota Kinabalu International Airport to local employment and GDP contribution.", "ev": "(Archdiocese of Kota Kinabalu > Abstract) The Archdiocese of Kota Kinabalu (Latin language: Archdioecesis Kotakinabaluensis; Malay: Keuskupan Agung Kota Kinabalu; Mandarin: 哥打京那巴鲁总教区) is a metropolitan archdiocese of the Latin Church of the Catholic Church in Sabah, Malaysia, on the island of Borneo. The archdiocese is the oldest ecclesiastical territory in Malaysia, with a long history slowly rising along with the Catholic population from a prefecture to an archdiocese. Its cathedral archepiscopal see is Sacred Heart Cathedral, Kota Kinabalu. The patron saint of the archdiocese is St. Joseph, Spouse of the Blessed Virgin Mary.\n\n(Miri > Transportation > Air) Miri Airport (IATA: MYY, ICAO: WBGR) is an important gateway to the northern region of Sarawak. It is located 11 km south of Miri city. It serves as a hub for domestic, international, and rural air services. Miri Airport is the tenth busiest airport in Malaysia and second busiest in Sarawak. It provided services to 2.2 million passengers in 2013. The airport has only one direct international flight to Singapore. It also receives flights from domestic destinations such as Kuala Lumpur, Johor Bahru, Kota Kinabalu, Labuan, Kuching and other major towns in Sarawak. Miri Airport also caters flights to the Sarawak interior such as Bario, Ba'kelalan, Marudi, Lawas, Limbang, and Mukah through MASwings using DHC-6 Twin Otter aircraft.\n\n(Tun Fuad Stephens Park > Abstract) Tun Fuad Stephens Park is a recreational park in Bukit Padang, Kota Kinabalu, Sabah, Malaysia. It is built in honour of the late Chief Minister of Sabah Fuad Stephens who perished in the Double Six Tragedy in 1976.\n\n(Archdiocese of Kuala Lumpur > Abstract) The Metropolitan Archdiocese of Kuala Lumpur (Latin: Archidioecesis Kuala Lumpurensis; Malay: Keuskupan Agung Kuala Lumpur; Tamil: கோலாலம்பூர் மறைமாவட்டம்; Mandarin: 吉隆坡总教区) is an ecclesiastical territory or diocese of the Catholic Church in Malaysia. It was erected as the Diocese of Kuala Lumpur by Pope Pius XII on 25 February 1955, and was elevated to the rank of a Metropolitan Archdiocese on 18 December 1972, with the suffragan sees of Malacca-Johor and Penang. It also administers the capital city of Malaysia, Federal Territory of Kuala Lumpur as well as the federal administrative centre of Putrajaya and the urbanised states of Selangor and Negeri Sembilan in the central region as well as Pahang and Terengganu on the East Coast. The archdiocese's Mother Church and thus, seat of its Archbishop, is St. John's Cathedral. It is one of the three Roman Catholic archdioceses in Malaysia, with the ecclesiastical archdioceses of Kota Kinabalu and Kuching, both at the Borneo Islands."}, {"id": "b078", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What awards, nominations, or notable mentions did Spirit Hunter: Death Mark and its sequels receive?", "ev": "(Sonic the Hedgehog (1991 video game) > Other versions and rereleases > Compilation releases) With its sequels for the Genesis, Sonic the Hedgehog has been ported for a wide range of home and handheld consoles and personal computers through compilations. The first collection it appeared in was Sonic Compilation (1995) for the Genesis. It has since appeared in Sonic Jam (1997) for the Saturn, Sonic Mega Collection (2002) for the GameCube, Sonic Mega Collection Plus (2004) for the PlayStation 2 and Xbox, Sega Genesis Collection for the PlayStation 2 and PSP, Sonic's Ultimate Genesis Collection (2009) for the Xbox 360 and PlayStation 3, Sonic Classic Collection (2010) for the Nintendo DS, Oculus Arcade for the Oculus Rift, and Sega Genesis Classics (2018) for Windows, PlayStation 4, Xbox One and Nintendo Switch. The 2013 remaster was included in the 2022 compilation Sonic Origins. This remaster saw Amy Rose becoming a playable character in an upgraded version of Origins.\n\n(Doctor Who: The Eternity Clock > Abstract) Doctor Who: The Eternity Clock is a 2012 action-adventure video game developed by Supermassive Games and published by BBC Worldwide for the PlayStation 3. It was later ported to the PlayStation Vita and Microsoft Windows. Based on the BBC television series Doctor Who, it was intended to be the first of a series, but it was announced in 2013 that the sequels have been put on hold.\n\n(Rock of Ages (video game) > Sequels) A sequel, titled Rock of Ages 2: Bigger & Boulder, which introduces a new four-player multiplayer mode, was released for Microsoft Windows, PlayStation 4 and Xbox One in August 2017, and on Nintendo Switch in May 2019. Rock of Ages III: Make & Break was released 21 July 2020 on Windows, Nintendo Switch, PlayStation 4, and Xbox One, and on 14 August 2020 for Stadia."}, {"id": "b079", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Were there subsequent rule changes, investigations, or official statements from the broadcaster addressing criticisms after that edition?", "ev": "(Lithuania in the Eurovision Song Contest 2014 > Abstract) Lithuania was represented at the Eurovision Song Contest 2014 with the song \"Attention\", written by Vilija Matačiūnaitė and Viktoras Vaupšas, and performed by Matačiūnaitė herself. The Lithuanian participating broadcaster, Lithuanian National Radio and Television (LRT), organised the national final \"Eurovizijos\" dainų konkurso nacionalinė atranka (Eurovision Song Contest national selection) in order to select its entry for the contest. The national final took place over 12 weeks and involved 20 artists and 16 songs competing in two different competitive streams. The results of each show were determined by the combination of votes from a jury panel and a public vote, and \"Attention\" performed by Vilija eventually emerged as the winner following the final.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 8 May 2014. Performing during the show in position 7, \"Attention\" was not announced among the top 10 entries of the second semi-final and therefore did not qualify to compete in the final. It was later revealed that Lithuania placed 11th out of the 15 participating countries in the semi-final with 36 points.\n\n(Lithuania in the Eurovision Song Contest 2023 > Abstract) Lithuania was represented at the Eurovision Song Contest 2023 with the song \" Stay \" performed by Monika Linkytė. The Lithuanian participating broadcaster, the Lithuanian National Radio and Television (LRT), organised the national final Pabandom iš naujo! 2023 to select its entry for the contest.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 11 May 2023 and was later selected to perform in position 15. At the end of the show, \"Stay\" was announced among the top 10 entries of the second semi-final and hence qualified to compete in the final. It was later revealed that Lithuania placed fourth out of the sixteen participating countries in the semi-final with 110 points. In the final, Lithuania performed in position 22 and placed eleventh out of the 26 participating countries, scoring a total of 127 points.\n\n(Lithuania in the Eurovision Song Contest 2009 > Abstract) Lithuania was represented at the Eurovision Song Contest 2009 with the song \"Love\", written and performed by Dmitrij Šavrov under his stage name Sasha Son. The Lithuanian participating broadcaster, Lietuvos radijas ir televizija (LRT), organised the song contest Lietuvos Dainų Daina (Lithuanian Song of Songs) in order to select its entry for the contest. The competition took place over six weeks and involved 36 competing entries. The results of each show were determined by regional televoting. In the final, fourteen entries remained and \"Pasiklydęs žmogus\" performed by Sasha Son was selected as the winner. The song was later translated from Lithuanian to English for the Eurovision Song Contest and was titled \"Love\".  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 14 May 2009. Performing during the show in position 14, \"Love\" was announced among the 10 qualifying entries of the second semi-final and therefore qualified to compete in the final on 16 May. It was later revealed that Lithuania placed ninth out of the 19 participating countries in the semi-final with 66 points. In the final, Lithuania performed in position 1 and placed twenty-third out of the 25 participating countries, scoring 23 points.\n\n(Lithuania in the Eurovision Song Contest 2014 > Before Eurovision > \"Eurovizijos\" dainų konkurso nacionalinė atranka > Jury members) The Lithuanian jury panel consisted of four members in the elimination shows and the semi-final, and two members in the final. The international jury panel in all shows consisted of three members: Brandon Stone (German music producer and composer), Valerij Prosvirov (Russian producer and record label director) and Liselott Björk (Swedish singer and vocal coach).\n\n(Lithuania in the Eurovision Song Contest 2014 > Before Eurovision > \"Eurovizijos\" dainų konkurso nacionalinė atranka > Format) The Lithuanian broadcaster overhauled the format of the national final from that of previous years. The 2014 competition consisted of 12 shows and involved artists competing independently from songs, potentially being paired with any of the songs that were selected for the competition. The rules stated that composers were required to agree to the condition that their song may be offered to an artist they did not originally write the song for. The first show was a jubilee concert, where 15 of the 20 competing artists participated in a celebration of past Lithuanian Eurovision songs, and no elimination took place. From the second to tenth shows, the artists performed covers that related to the theme of that particular show and the potential Eurovision songs. The second and third show consisted of ten artists each and five were eliminated. During each of the fourth to tenth shows, one artist was eliminated, and the remaining three artists advanced in the competition. Starting from the fifth show, the 16 potential Eurovision songs competed on a weekly basis and a total of 13 songs were eliminated following the tenth show, leaving three songs remaining. The eleventh show was the competition's semi-final, where only the winning song was selected from the remaining three songs, while the twelfth show was the final, where the winning artist-song combination was selected from the remaining three artists. The format of the competition was originally set to take place over a ten-week period, where four artists would participate in the final; however, an additional two elimination shows were held after LRT experienced success in the ratings with the elimination shows.  The results of each of the 12 shows were determined by the 50/50 combination of votes from a jury panel and public televoting. The jury votes in all shows consisted of a combination of a Lithuanian jury panel and an international jury panel. From the second show to the semi-final, the members of the Lithuanian panel were required to come to a consensus in order to assign one set of points, which were added to the international panel results. During each show, each member of the international panel assigned points in a descending order with the highest score for their favourite and the lowest score for their least favourite, while the Lithuanian panel assigned a score from 1 to 10 to each artist from the second to the fifth shows and points based on ranking starting from the sixth show. In the final, the Lithuanian and international panels voted together, with each member awarding one set of points based on ranking. The public could vote through telephone and SMS voting, and the ranking developed by both streams of voting was converted to points from 1-8, 10 and 12 and assigned based on the n"}, {"id": "b080", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What regulatory or eligibility disputes with leagues or the national association have affected the club's competition participation?", "ev": "(Kagua-Erave F.C. > History) On 30 December 2018, it was revealed that a side under the name of Kagua Erave from the Southern Highlands had submitted an official application and paid their fee towards participation in the 2019 Papua New Guinea National Soccer League. Players were recruited predominantly from the Kagua-Erave District, following trials in the first weekend of January, and the club was managed by former PNG international Steven Mune. On 15 January 2019, it was reported that the club had received financial support of K 60,000 from two backers ahead of the new season.  The club enjoyed a strong start to the season, winning their opening match against Blue Kumuls 3–1, followed by an 11–1 victory over Enga Laima in their second match in which Neil Hans scored four and Jordan Kaven scored three. The side went on to win all of their five matches in the first half of the season. Their first defeat came on 30 March when they lost 1–0 to Aporo Mai, and this was followed on 13 April by a defeat by the same scoreline against Enga Laima, having qualified for the next stage of the competition on the previous weekend. The side finished top of the conference.  In early May, the club's participation in the playoffs was thrown into doubt, after it was reported that players hadn't been paid. However, the club did eventually take to the field against Northern Conference runners-up Morobe United on 11 May in Goroka, going down 5–0.\n\n(Kagua-Erave F.C. > Abstract) Kagua-Erave FC, sometimes stylised as Kagua Erave FC, is a semi-professional association football club based in the Kagua-Erave District in the Southern Highlands of Papua New Guinea. The club was founded in 2018.  The club competed in the 2019 edition of the Papua New Guinea National Soccer League, having been drawn into the Highlands Conference. The club topped the conference and reached the quarter-finals."}, {"id": "b081", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the demographic distributions of Makonde people in Mozambique and Tanzania from colonial times to present?", "ev": "(East African coral coast > Abstract) The East African coral coast is a marine ecoregion along the eastern coast of Africa. It extends along the coasts of Kenya, Tanzania, and northern Mozambique, from Lamu in Kenya (2º30' S) to Angoche in Mozambique (16°14 S). It adjoins the Northern Monsoon Current Coast ecoregion to the north, and the Bight of Sofala/Swamp Coast ecoregion to the south.\n\n(Demographics of Mozambique > Culture) Despite the influence of Islamic coastal traders and European colonizers, the people of Mozambique have largely retained an indigenous culture based on smallscale agriculture. Mozambique's most highly developed art forms have been wood sculpture, for which the Makonde in northern Mozambique are particularly renowned, and dance. The middle and upper classes continue to be heavily influenced by the Portuguese colonial and linguistic heritage.\n\n(East African coral coast > Major habitat types) Fringing coral reefs extend along much of the coast, extending.5 to 2 km from the shore on the narrow continental shelf. Fringing reefs extend along the coasts of Kenya and Tanzania as far as the Ruvuma River, which forms the Tanzania-Mozambique boundary. The fringing reefs are interrupted by major river mouths, including the Tana and Athi rivers in Kenya and the Rufiji in Tanzania. Unguja Island has a fringing reef along its eastern shore and extending around the southern and northern tips of the island. Mafia Island has a fringing reef along its eastern shore which extends south to the Songo Songo Islands.  Seagrass beds are found in clear, shallow lagoons between the fringing reefs and the shore, and between offshore islands and the mainland.  River mouths are home to the East African mangroves. The Rufiji River delta is the largest mangrove ecosystem on the East African coast, and accounts for half of Tanzania's 55,000 ha of mangroves. Other important mangrove forests in Tanzania are in Lindi and Tanga, at the mouths of the Wami, Ruvu, Matandu and Ruvuma rivers, and on the Mafia Archipelago. Kenya has 52,980 ha of mangroves, over two-thirds of which are concentrated around Lamu. Kilifi and Kwale account for most of the rest.  Fringing reefs are uncommon along the Mozambican coast, limited by freshwater input from numerous rivers, and cold-water upwelling in the Mozambique Channel. Patch reefs are best developed on the Quirimbas Islands, Primeiras and Segundas Archipelago, and Mozambique Island and neighboring islands in Mozambique Bay. Mangroves are found in the many river mouths, and seagrass beds occur in sheltered coastal waters."}, {"id": "b082", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What formal mandate or mission statement defines the agency's role in promoting film, fashion, and music exports?", "ev": "(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Trinidad and Tobago > Government and politics > Military) The Trinidad and Tobago Defence Force (TTDF) is the military organisation responsible for the defence of the twin island Republic of Trinidad and Tobago. It consists of the Regiment, the Coast Guard, the Air Guard and the Defence Force Reserves. Established in 1962 after Trinidad and Tobago's independence from the United Kingdom, the TTDF is one of the largest military forces in the Anglophone Caribbean.  Its mission statement is to \"defend the sovereign good of The Republic of Trinidad and Tobago, contribute to the development of the national community and support the State in the fulfilment of its national and international objectives\". The Defence Force has been engaged in domestic incidents, such as the Black Power Movement of 1970 and Jamaat al Muslimeen coup attempt, and international missions, such as the United Nations Mission in Haiti between 1993 and 1996.  In 2019, Trinidad and Tobago signed the UN treaty on the Prohibition of Nuclear Weapons.  Trinidad and Tobago is the 87th most peaceful country in the world, according to the 2024 Global Peace Index.\n\n(Trinidad and Tobago > Government and politics > Disaster management and response > Local response) The Ministry of Rural Development and Local Government, along with regional and municipal corporations, are the first responders to major disasters. Each corporation maintains a Disaster Management Unit (DMU) responsible for managing all phases of extreme weather events within their local area. In Tobago, the Tobago Emergency Management Agency (TEMA), under the Tobago House of Assembly, handles disaster and emergency management. The Trinidad and Tobago Fire Service acts as the primary emergency response agency.\n\n(Trinidad and Tobago > Economy > Economic diversification) Trinidad and Tobago, in an effort to undergo economic transformation through diversification, formed InvesTT in 2012 to serve as the country's sole investment promotion agency. This agency is aligned to the Ministry of Trade and Industry and is to be the key agent in growing the country's non-oil and gas sectors significantly and sustainably."}, {"id": "b083", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Were there documented concerns about voter suppression, access barriers, or disenfranchisement in Maryland during the 2008 presidential election?", "ev": "(2008 United States presidential election in Hawaii > Abstract) The 2008 United States presidential election in Hawaii took place on November 4, 2008, and was part of the 2008 United States presidential election. Voters chose 4 representatives, or electors to the Electoral College, who voted for president and vice president.  Hawaii, Barack Obama 's birth state, gave him 71.9% of the vote with a 45.3% margin of victory in 2008. Prior to the election, all 17 news organizations considered this a state Obama would win, or otherwise considered as a safe blue state. Hawaii has voted Democratic in every presidential election since 1988. Obama's margin of victory in this state is only surpassed by that of the District of Columbia and is the only state that gave either candidate more than 70% of the vote. Turnout in the state was much higher than previous elections.  This remains the second-best performance by any party in a presidential election in Hawaii after Lyndon Johnson's landslide election in 1964.\n\n(Newspaper endorsements for John McCain in the 2008 United States presidential election > Abstract) During the 2008 United States presidential election, newspapers, magazines, and other publications made general election endorsements. As of November 4, 2008, Barack Obama had received more than twice as many publication endorsements as John McCain; in terms of circulation, the ratio was more than 3 to 1, according to the detailed tables below. In summary:  According to Editor & Publisher magazine, as of November 3, 2008, there was 273 newspapers endorsing Barack Obama compared to 172 for John McCain. By comparison, the magazine reported that before election day in 2004, John Kerry received 213 endorsements compared to 205 for George W. Bush.  UWIRE, in its Presidential Scorecard, reported that Barack Obama led John McCain by 86 to 2 in college newspaper endorsements, as of November 4.  The Association of Alternative Newsmedia reported that Barack Obama led John McCain by 57 to 0 in endorsements among its 123 member newspapers as of October 31, 2008.  For a full list of newspapers that have endorsed Barack Obama, see Newspaper endorsements for Barack Obama in the 2008 United States presidential election.  For a summary of endorsements and a list of newspapers that have chosen not to endorse a candidate, see Newspaper endorsements in the 2008 United States presidential election.\n\n(Flagler County, Florida > Presidental results > Voter registration) According to the Secretary of State's office, Republicans are a plurality of registered voters in Flagler County. The last Democrat to win the county was Barack Obama in 2008, and since then it has seen a gradual increase in Republican support in every election. In 2024, Donald Trump performed better in the county than any Republican since Nixon 's 1972 landslide.\n\n(Bruce Heyman > Political activities) Heyman and his wife were prominent donors to then-Senator Barack Obama beginning in 2007 when they hosted a fundraising event in their home, and came to number among Obama's top fundraisers. In 2012, both he and his wife served on the Obama campaign's National Finance Committee tasked with raising funds for Obama's re-election, together contributing or collecting $1.7 million for his re-election bid.  During the 2020 Presidential Election, the Heymans co-chaired the Biden campaign's American Voter Abroad Initiative and led the outreach group Ambassadors for Biden. In 2024, Heyman has publicly supported Biden's candidacy for re-election and has remained supportive of the American Voter Abroad Initiative.\n\n(Rashida Jones > Personal life > Political views) Jones has campaigned for Democratic Party presidential candidates. Jones campaigned for Democratic candidate John Kerry during the 2004 election, speaking at student rallies and a public gallery in Ohio.  She supported Barack Obama during the 2008 and 2012 presidential campaigns. In 2008, along with Kristen Bell, she visited college campuses in Missouri to discuss the candidates and to encourage voter registration for the Democratic Party. In 2012, she campaigned in Iowa along with Parks and Recreation co-star Adam Scott."}, {"id": "b084", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What facility access problems, membership declines, or recruitment challenges has the club faced and in which periods?", "ev": "(North Hobart Football Club > Abstract) The North Hobart Football Club, nicknamed The Demons, is an Australian rules football club currently competing in the Southern Football League Premier Division. The club was a part of the Tasmanian Football League from the early 1900s until 2001, when it joined the Southern Football League. In 2009, North Hobart was invited into the second reincarnation of the statewide league, where it remained until 2013. After the 2013 season, its position in the league was effectively filled by the Hobart City Football Club. North Hobart returned to the Tasmanian State League in 2018. However, following the cessation of the TSL in 2024, the club rejoined the Southern Football League in 2025  In 2014, the North Hobart Football Club Inc. changed from an incorporated body to a company limited with 100% ownership of the Hobart City Football Club, with the Hobart City Demons now the trading name of North Hobart Football Club Ltd.  On October 9, 2017 the paying members of the Hobart City Demons voted 371-118 in favour of returning the playing name of the club to the North Hobart identity for season 2018 and beyond.  Players to reach Australian Football League level include Paul Williams, Peter 'Percy' Jones, Daryn Cresswell, Chris Bond, James Manson, Jim Wright, Tony Pickett, Colin Garland and several other big names. In total 54 North Hobart players have moved on to play at VFL/AFL level.  In 2005, North Hobart was the first club inducted into the AFL Tasmania Hall of Fame as a Great Club.\n\n(Hawthorn Football Club > Corporate > Relationship with Tasmania) Since 2001, Hawthorn has successfully cultivated a following in Tasmania, where the membership base has increased from 1,000 to more than 9,000. Studies have valued Hawthorn's economic impact in Tasmania and national brand exposure to total $29.5 million in 2014. Since 2006, Hawthorn has increased its presence in the state as part of an agreement with the tourism component of the Tasmanian government, whereby they are contracted to play four games in the state and the Tasmanian government will be the major sponsor for the club. This relationship was renewed for a further period of five years (2012–16) in November 2011. Hawthorn offered to play an additional home game in Tasmania as part of the new deal in 2010. On 31 July 2015, Hawthorn extended their partnership with Tasmania for a further five years. Hawthorn continued to sign extensions to their Tasmanian sponsorships. And again and again for another two years until 2027.\n\n(Hobart Town Gazette > Abstract) The Hobart Town Gazette was established in 1816 in Hobart, Van Diemen's Land (known as Tasmania since 1856) as The Hobart Town Gazette and Southern Reporter. In 1821 the name was changed to the Hobart Town Gazette and Van Diemen's Land Advertiser. In 1825 the title was split, with the government authorised publication remaining the Hobart Town Gazette, and the original editor launching the Colonial Times, and Tasmanian Advertiser. From 1882 it was known as the Hobart Gazette and from 1907 as the Tasmanian Government Gazette.\n\n(Bellerive Oval > Abstract) Bellerive Oval (known under naming rights as Ninja Stadium) is an Australian rules football and cricket stadium located in the Hobart suburb of Bellerive. With a combination of seating and standing capacity of 20,000, it is the second-largest stadium in Tasmania (behind York Park in Launceston).  The stadium is the only Tasmanian venue that regularly hosts international cricket matches. It serves as the home ground for the Tasmanian Tigers, Tasmania's state cricket team, and the Hobart Hurricanes, a Big Bash League franchise. It has hosted international Test matches since 1989 and One-Day Internationals (ODIs) since 1988."}, {"id": "b085", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Were there reported controversies or legal challenges about voting irregularities or election administration in Maryland in 2008?", "ev": "(2008 United States presidential election in Hawaii > Abstract) The 2008 United States presidential election in Hawaii took place on November 4, 2008, and was part of the 2008 United States presidential election. Voters chose 4 representatives, or electors to the Electoral College, who voted for president and vice president.  Hawaii, Barack Obama 's birth state, gave him 71.9% of the vote with a 45.3% margin of victory in 2008. Prior to the election, all 17 news organizations considered this a state Obama would win, or otherwise considered as a safe blue state. Hawaii has voted Democratic in every presidential election since 1988. Obama's margin of victory in this state is only surpassed by that of the District of Columbia and is the only state that gave either candidate more than 70% of the vote. Turnout in the state was much higher than previous elections.  This remains the second-best performance by any party in a presidential election in Hawaii after Lyndon Johnson's landslide election in 1964.\n\n(Newspaper endorsements for John McCain in the 2008 United States presidential election > Abstract) During the 2008 United States presidential election, newspapers, magazines, and other publications made general election endorsements. As of November 4, 2008, Barack Obama had received more than twice as many publication endorsements as John McCain; in terms of circulation, the ratio was more than 3 to 1, according to the detailed tables below. In summary:  According to Editor & Publisher magazine, as of November 3, 2008, there was 273 newspapers endorsing Barack Obama compared to 172 for John McCain. By comparison, the magazine reported that before election day in 2004, John Kerry received 213 endorsements compared to 205 for George W. Bush.  UWIRE, in its Presidential Scorecard, reported that Barack Obama led John McCain by 86 to 2 in college newspaper endorsements, as of November 4.  The Association of Alternative Newsmedia reported that Barack Obama led John McCain by 57 to 0 in endorsements among its 123 member newspapers as of October 31, 2008.  For a full list of newspapers that have endorsed Barack Obama, see Newspaper endorsements for Barack Obama in the 2008 United States presidential election.  For a summary of endorsements and a list of newspapers that have chosen not to endorse a candidate, see Newspaper endorsements in the 2008 United States presidential election.\n\n(2012 United States presidential election in Kentucky > Abstract) The 2012 United States presidential election in Kentucky took place on November 6, 2012, as part of the 2012 General Election in which all 50 states plus the District of Columbia participated. Kentucky voters chose eight electors to represent them in the Electoral College via a popular vote pitting incumbent Democratic President Barack Obama and his running mate, Vice President Joe Biden, against Republican challenger and former Massachusetts Governor Mitt Romney and his running mate, Congressman Paul Ryan.  Romney carried Kentucky by a landslide margin, winning 60.47% of the vote to Obama's 37.78%. This represented a margin of 22.69%, a great improvement for the Republican Party from 2008, when they won with a 16.22% margin. Although Kentucky had been won by Southern Democrat Bill Clinton twice in the 1990s, Obama was seen as a poor cultural fit for the state, and he did not compete here either time he ran. The Romney campaign also attacked Obama's administration as being hostile to the coal industry, historically an important part of the state's economy. Consequently, Obama suffered a historically poor showing in the traditionally staunchly Democratic coalfields of Eastern Kentucky, where many counties that had even voted by wide margins for landslide Democratic losers like George McGovern and Walter Mondale defected to the Republicans in 2012.  Knott County, which had given Clinton 73% of the vote in 1996 and nearly 72% to Mondale in 1984 (despite the latter losing nationally by more than 18 percentage points and only carrying one state), gave Romney 73% of the vote in 2012. Even Elliott County, the only county in the state in which Obama had broken 60% in 2008, barely held on in 2012, giving Obama a narrow plurality win, his only victory in the region, and one of just four county wins in the entire state. This marked the first time since the county's founding that the Democratic nominee won less than 60% of the vote in Elliott County, and would prove to be the conclusion of Elliott's longest-in-the-nation, 140-year Democratic voting streak. The county would flip to the GOP by a landslide margin four years later. Wolfe County, which had returned to the Democratic Party in 2004 and 2008 after casting its first-ever Republican vote for George W. Bush in 2000, went for Romney by over twenty points. As such, Obama became the first Democrat to ever win the White House without carrying Wolfe County since its founding in 1860, Menifee County since its founding in 1869, or Henderson County since the founding of the Republican Party.  The only part of the state where Obama won convincingly was Jefferson County, the most urban and populous county in the state, and home to Louisville. He also eked out a close win in Fayette County, the second-most populous county, home to Lexington. Despite losing five counties he won in 2008, he managed to flip Franklin County, home to the state capital of Frankfort, which he had narrowly lost in 2008. As of the 2024 presidential election, this is the last time that Elliott and Franklin Counties voted for a Democrat in a presidential election. Obama is the only Democrat to ever win two terms without carrying the state at least once.\n\n(2008 United States presidential election in Hawaii > Electors) Technically the voters of Hawaii cast their ballots for electors: representatives to the Electoral College. Hawaii is allocated 4 electors because it has 2 congressional districts and 2 senators. All candidates who appear on the ballot or qualify to receive write-in votes must submit a list of 4 electors, who pledge to vote for their candidate and their running mate. Whoever wins the majority of votes in the state is awarded all 4 electoral votes. Their chosen electors then vote for president and vice president. Although electors are pledged to their candidate and running mate, they are not obligated to vote for them. An elector who votes for someone other than their candidate is known as a faithless elector.  The electors of each state and the District of Columbia met on December 15, 2008, to cast their votes for president and vice president. The Electoral College itself never meets as one body. Instead the electors from each state and the District of Columbia met in their respective capitols.  The following were the members of the Electoral College from the state. All 4 were pledged to Barack Obama and Joe Biden:\n\n(2026 West Bengal election controversies > EVM allegations) The TMC accused the BJP and election authorities of irregularities involving Electronic Voting Machines (EVMs). Allegations were made regarding the handling of EVM strongrooms in Kolkata before vote counting."}, {"id": "b086", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were the economic outcomes in the state (GDP growth, employment rates) correlated with the leader's time in office?", "ev": "(M. Sanjay Kumar > Career) He contested as a Bharat Rashtra Samithi candidate and won the Jagtial seat in the 2023 Telangana Legislative Assembly election defeating T. Jeevan Reddy of Congress by 15,822 votes. In 2018, Jeevan Reddy, then a sitting MLA, lost by a bigger margin of 42,439 votes. Sanjay joined the Congress party on 23 June 2024 in the presence of Telangana Pradesh Congress Committee chief and chief minister A Revanth Reddy.\n\n(Marri Rajasekhar Reddy > Abstract) Marri Rajasekhar Reddy (born 17 June 1970) is an Indian politician from Telangana state. He is a member of the Telangana Legislative Assembly from Malkajgiri Assembly constituency in Medchal Malkajgiri district. He represents Bharat Rashtra Samithi and won the 2023 Telangana Legislative Assembly election.\n\n(Nandini Sidda Reddy > Abstract) Nandini Sidda Reddy (or Sidhareddy, Sidha Reddy; Telugu: నందిని సిధారెడ్డి; born 12 June 1955) is a teacher, writer, poet, songwriter and social activist from the state of Telangana, India. He is known for promoting Telugu culture.Several of his songs have been featured in Telugu language films.He was one of the leaders of the Telangana movement to make Telangana a separate state from Andhra Pradesh, which took place i
