a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26\n\nSpeed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130"}, {"id": "v001", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The province includes the administrative districts of Jaffna, Mannar, Mullaitivu and Vavuniya. [d23777640s1p0] The Vanni Electoral District covers the districts of Mannar, Mullaitivu and Vavuniya. [d5507600s0p0] The province is represented at national level by the Jaffna Electoral District and the Vanni Electoral District which together elect 15 members of parliament. [d23777640s6p0] Jaffna is a major urban centre in the province and hosts the University of Jaffna. [d23777640s13p0][d6033791s5p0]", "ev": "Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.\n\nThe Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.\n\nOn 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.\n\nThe proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.\n\nThe merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.\n\nMuch of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.\n\nWhile the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.\n\nIn late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\nVanni Electoral District (Tamil: வன்னி தேர்தல் மாவட்டம்) is one of the 22 multi-member electoral districts of Sri Lanka created by the 1978 Constitution of Sri Lanka. The district covers the administrative districts of Mannar, Mullaitivu and Vavuniya in the Northern province. The district currently elects 6 of the 225 members of the Sri Lankan Parliament and had 253,058 registered electors in 2014. The district is Sri Lanka's Electorate Number 11.\n\nFirst elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\nThe Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\nThe Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.\n\nSince 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.\n\nThe expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.\n\nSri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing."}, {"id": "v191", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Ghanaan cricketers played international matches as part of the combined West African team after the West Africa Cricket Council formed in 1976 [d6868247s2p0].", "ev": "A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member."}, {"id": "v226", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "She won a silver medal in the Mass start at the 2025 World Single Distances Speed Skating Championships, marking her eighth career mass start medal at the world championships [d41597867s3p0].", "ev": "After results from the 2017–18 ISU Speed Skating World Cup, Blondin pre-qualified for the 2018 Winter Olympics in Pyeongchang, South Korea. She competed in the 3000 m, 5000 m, mass start, and team relay events.\n\nIn 2020, she won the mass start event gold medal at the 2020 World Single Distances Speed Skating Championships at the Utah Olympic Oval in Salt Lake City, United States. This was followed up with the silver medal at the World Allround Speed Skating Championships in March. She was the first Canadian woman to reach the overall podium at that event since 2012 and only the fifth since the event started in 1936.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event."}, {"id": "v255", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "He was moved to centre-half back at the start of the 2004 season and occupied a key defensive role thereafter [d3033893s2p0].", "ev": "Cornes began his AFL career as a key-forward after debuting in 1999 and playing 6 games in his first season. Cornes was a regular in the Power forward line in 2000, booting 22 goals. Between 2000 and 2003 Cornes and Tredrea formed one of the best forward partnerships in the AFL, with Chad playing up the ground demonstrating his great contested marking ability. Despite being one of the best forwards in the game, Cornes was moved into defence at the start of the 2004 season.\n\nCornes began his AFL career as a key-forward after debuting in 1999 and playing 6 games in his first season. Cornes was a regular in the Power forward line in 2000, booting 22 goals. Between 2000 and 2003 Cornes and Tredrea formed one of the best forward partnerships in the AFL, with Chad playing up the ground demonstrating his great contested marking ability. Despite being one of the best forwards in the game, Cornes was moved into defence at the start of the 2004 season.\n\nIn 2004, Cornes was moved to centre-half back. The new position worked wonders as Cornes began to single-handedly dominate games, earning himself his first All-Australian award, and finishing third in the Brownlow medal. The move to centre-half back was a key reason for Port Adelaide's dominance, which culminated in their first Premiership in 2004, defeating the Brisbane Lions by 40 points. He had a key defensive role on Brisbane Lions' forward Jonathan Brown during the Grand Final, restricting him to just one behind for the match.\n\nAfter Port Adelaide's dominance in 2004, Cornes was again used as a key defender to great effect. However, Port Adelaide was unable to repeat its finals' glory of 2004, being eliminated by cross town rivals Adelaide in the first semi-final."}, {"id": "v107", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Andrews was selected as a host pick for the 2025 Skate America and placed fifth overall while earning a new personal best free skate and combined total score [d53528369s12p0].", "ev": "In preparation for the season, Andrews recorded the vocals for the track, \"Turning Page,\" used for her free skate.\n\nAndrews opened her season by competing on the 2025–26 Challenger Series, placing seventh at the 2025 CS Nepela Memorial and twelfth at the 2025 CS Trialeti Trophy.\n\nIn November, Andrews announced that the 2025–26 figure skating season was her last as a singles skater and that she intended to switch disciplines and pursue pair skating beginning with the 2026–27 season. Selected as a host pick for 2025 Skate America, Andrews delivered two clean programs, earning a new personal best free skate and combined total score and placing fifth overall. She subsequently finished fifth at the 2025 CS Tallinn Trophy.\n\nAt the 2026 U.S. Championships in January, Andrews finished in seventh place and was subsequently named to the 2026 Four Continents team.\n\nAt the 2026 Four Continents, Starr finished 8th after the short program, ultimately dropping to 15th overall after the free skate."}, {"id": "v265", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Johnson played primarily for the Seattle Mariners during 1989–1998.[d386384s7p0] Johnson played for the Arizona Diamondbacks during 1999–2004.[d386384s9p0][d386384s12p0] He played 22 seasons for six MLB teams in total.[d386384s0p0]", "ev": "Johnson was sidelined throughout much of the 1996 season with a back injury but rebounded in 1997 with a 20–4 record, 291 strikeouts, and a 2.28 ERA (his personal best). Between May 1994 and October 1997, Johnson went 53–9, including a 16–0 streak that fell one short of the AL record. Johnson had two 19-strikeout starts in 1997, on June 24 and August 8.\n\nAnother colorful All-Star Game moment proceeded in 1997 involving former Expos teammate Larry Walker, then with the Colorado Rockies. When Johnson started a game against the Rockies on June 12, Walker chose not to play, explaining that \"I faced Randy one time in spring training and he almost killed me.\" In the All-Star Game, Walker batted against Johnson, who theatrically threw over his head. Ever adaptable, Walker placed his batting helmet backwards and switched sides in the batters' box to stand right-handed for one pitch. He ended the plate appearance by drawing a walk. The incident momentarily drew mirth and laughter from players in both dugouts, fans, and announcers as well as comparisons to the at bat with Kruk in the 1993 All-Star Game. In spite of garnering a reputation of avoiding Johnson, Walker batted.393 in 28 at bats against him in his career, nearly double the rate of all left-handed batters at.199. When the 1998 season began, Johnson was upset the Mariners would not offer him a contract extension, given his contract was expiring after the season. Though the Mariners initially wanted to keep Johnson, turning down a trade offer from the Los Angeles Dodgers, they fell out of contention, going 8–20 in June. Minutes before the non-waiver trade deadline, on July 31, the Mariners traded Johnson to the Houston Astros for minor leaguers Freddy García, Carlos Guillén, and John Halama. Johnson was a Mariner for nearly nine years, his longest tenure with one team.\n\nJohnson agreed to a four-year contract, with an option for a fifth year, for $52.4 million, with the Arizona Diamondbacks, a second-year franchise, in late 1998. Johnson led the team to the playoffs in 1999 on the strength of a 17–9 record and 2.48 ERA with 364 strikeouts, leading the majors in innings, complete games, and strikeouts. Johnson won the NL Cy Young Award and Warren Spahn Award as the best left-handed pitcher in MLB. Johnson became the third MLB pitcher, after Gaylord Perry and Pedro Martínez, to win the Cy Young Award in both the AL and NL; Martínez won the AL Cy Young in 1999. Johnson finished 2000 with 19 wins, 347 strikeouts and a 2.64 ERA, and won his second consecutive NL Cy Young Award and Warren Spahn Award. The Diamondbacks acquired Curt Schilling from the Phillies in July 2000, and the two aces anchored the Diamondbacks rotation.\n\nOn May 18, 2004, Johnson pitched the 17th perfect game in MLB history. At 40 years of age, he was the oldest pitcher to accomplish this feat. Johnson had 13 strikeouts on his way to a 2–0 victory against the Atlanta Braves. The perfect game made him the fifth pitcher in major league history (after Cy Young, Jim Bunning, Nolan Ryan, and Hideo Nomo) to pitch a no-hitter in both leagues. He also became the fifth pitcher in major league history to throw both a no-hitter and a perfect game in his career (after Young, Bunning, Addie Joss, and Sandy Koufax; since Johnson, Mark Buehrle and Roy Halladay have joined this group).\n\nJohnson struck out Jeff Cirillo of the San Diego Padres on June 29, to become the fourth MLB player to reach 4,000 strikeouts in a career.\n\nHe finished the 2004 season with a 16–14 record, though his poor record was partially due to a lack of run support as his ERA that year was 2.60. Johnson led the majors with 290 strikeouts and finished second to Roger Clemens for the Cy Young Award. In games when Arizona scored at least three runs, Johnson was 13–2. As his team only won 51 games that year, his ratio of winning 31.3% of his team's games was the highest for any starting pitcher since Steve Carlton in 1972 (who won 27 of the Phillies ' 59 wins for an all-time record ratio of 45.8%).\n\nRandall David Johnson (born September 10, 1963), nicknamed \" the Big Unit,\" is an American former professional baseball pitcher who played 22 seasons in Major League Baseball (MLB) (1988–2009) for six teams, primarily the Seattle Mariners and Arizona Diamondbacks.\n\nAt 6 feet 10 inches (2.08 metres) tall, Johnson was the tallest player in MLB history when he entered the league, contributing to his intimidating persona and pitching style. As a player, he was especially known for his overpowering fastball and devastating slider, a combination that remained effective throughout his lengthy career. While he initially struggled with control in his early seasons, Johnson subsequently established himself as one of the most dominant pitchers of his era, leading his league in strikeouts nine times, and in earned run average, winning percentage, and complete games four times each. Along with teammate Curt Schilling, Johnson was one of two World Series Most Valuable Players in 2001; in the Series, Johnson won three games and led the Diamondbacks to a World Series victory over the New York Yankees in the fourth season of the team's existence. He won the pitching Triple Crown in 2002.\n\nJohnson's 303 career victories are the fifth-most by a left-hander in MLB history, while his 4,875 strikeouts place him second all time behind Nolan Ryan and first among left-handers. He recorded 300 strikeouts in a season six different times, a major league record tied with Ryan. Johnson is a ten-time All-Star, won the Cy Young Award five times, and is one of only two pitchers (along with Greg Maddux) to win the award in four consecutive seasons (1999–2002). Johnson won Cy Young Awards in both leagues. He is also one of five pitchers to pitch no-hitters in both leagues, and one of 25 pitchers in history to record a win against all 30 MLB franchises.\n\nJohnson enjoyed a career longevity uncommon to pitchers, with his signature fastball-slider combination remaining effective well into his 40s. Four of his six 300-strikeout seasons occurred after his 35th birthday. On May 18, 2004, at 40 years old, he threw MLB's 17th perfect game, becoming the oldest pitcher to accomplish the feat. Johnson retired at the age of 46, and was elected to the Baseball Hall of Fame in 2015 in his first year of eligibility. He is the first member of the Hall to be depicted in a Diamondbacks uniform on his plaque. Johnson's accomplishments and accolades have led to him being widely regarded as one of the greatest pitchers in baseball history. On August 8, 2015, the Diamondbacks retired Johnson's number 51. On May 2, 2026, the Mariners retired Johnson's number 51, making him one of 12 players in MLB history to have his number retired by multiple MLB teams."}, {"id": "v221", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The bank sold its controlling stake in Banque de Salonique to Yapı Kredi in 1969, leading to multiple subsequent renamings and ownership changes. [d68130333s2p1] İnterbank was taken over by the Savings Deposit Insurance Fund of Turkey in January 1999 and was liquidated during the 2001 Turkish economic crisis. [d68130333s2p1] Scalable Capital expanded from wealth management into brokerage starting in 2020 and launched the European Investor Exchange in December 2024. [d82707812s1p0]", "ev": "In Turkey, the bank's operations were comparatively unaffected during the second world war, thanks to the country's neutrality. The Banque de Salonique opened a new Istanbul branch in Osmanbey in 1958. (The Sultan Hammam branch, meanwhile, was relocated to Eminönü in 1955.): 265 In the 1960s, however, the CFAT lost its core Algerian and Tunisian operations (it renamed itself Société Centrale de Banque in 1963) and its Levantine footprint became increasingly difficult to maintain. It closed the Mersin branch in 1967, and in 1969 sold its controlling stake in Banque de Salonique to Yapı Kredi, which renamed it International Bank for Industry and Commerce (Turkish: Uluslararası Endüstri ve Ticaret Bankası).: 268 Yapı Kredi was then purchased by Çukurova Holding in 1975, and with it, the majority of the shares in Uluslararası. It changed name again to become İnterbank in 1990. In 1996 Çukurova sold its majority stake to Cavit Çağlar 's Nergis Holdings. Eventually İnterbank was taken over by the Savings Deposit Insurance Fund of Turkey in January 1999, and liquidated during the 2001 Turkish economic crisis.\n\nIn Turkey, the bank's operations were comparatively unaffected during the second world war, thanks to the country's neutrality. The Banque de Salonique opened a new Istanbul branch in Osmanbey in 1958. (The Sultan Hammam branch, meanwhile, was relocated to Eminönü in 1955.): 265 In the 1960s, however, the CFAT lost its core Algerian and Tunisian operations (it renamed itself Société Centrale de Banque in 1963) and its Levantine footprint became increasingly difficult to maintain. It closed the Mersin branch in 1967, and in 1969 sold its controlling stake in Banque de Salonique to Yapı Kredi, which renamed it International Bank for Industry and Commerce (Turkish: Uluslararası Endüstri ve Ticaret Bankası).: 268 Yapı Kredi was then purchased by Çukurova Holding in 1975, and with it, the majority of the shares in Uluslararası. It changed name again to become İnterbank in 1990. In 1996 Çukurova sold its majority stake to Cavit Çağlar 's Nergis Holdings. Eventually İnterbank was taken over by the Savings Deposit Insurance Fund of Turkey in January 1999, and liquidated during the 2001 Turkish economic crisis.\n\nScalable Capital was founded in Munich in 2014 by investment banker Erik Podzuweit, Florian Prucker, Adam French and Stefan Mittnik as a startup company.\n\nThe company launched in 2016 as a robo-advisor for automated wealth management and entered the UK market the same year. In 2017, Scalable Capital entered into a partnership with the German bank ING Germany to offer a fully digital investment service to the bank's retail customers. Bloomberg later linked the company's early growth in assets under management to its bank-partnership model, including its cooperation with ING Germany. In 2017, Scalable Capital had become one of the fastest-growing robo-advisors worldwide.\n\nBy May 2018, Bloomberg reported that the company had reached €1 billion in assets under management. and had over 30,000 customers. Starting in 2020, Scalable Capital expanded from wealth management and began offering brokerage.\n\nIn early 2021, the company closed its direct-to-consumer UK service to focus on the German market. At the time, Scalable was active in Germany and Austria and planned launches in France, Italy and Spain. In November 2021, it acquired the ETF information portal justETF.\n\nIn August 2022, the company announced that client assets had surpassed €10 billion. In April 2024, ETF Stream reported that client assets had reached €20 billion and that the customer base had grown to more than one million.\n\nIn December 2024, Scalable Capital and the Hanover Stock Exchange launched the European Investor Exchange (EIX), a new electronic trading venue for retail investors, as part of the company's broader effort to bring more trading and custody functions onto its own infrastructure rather than relying entirely on external partners. The move allowed Scalable to handle trading, clearing, settlement, and custody on one platform.\n\nIn February 2025, Scalable Capital began offering eligible retail investors in Germany access to a BlackRock private equity fund.\n\nDuring the market turmoil in April 2025, the company recorded record trading volumes and fee income, although the Financial Times reported that users also experienced access delays. BaFin later said that the technical disruptions affecting investment service providers in April 2025 had prompted additional supervisory attention to broker resilience.\n\nIn September 2025, the European Central Bank granted Scalable Capital a full banking license, allowing it to offer deposit-taking and lending services directly under the supervision of BaFin and the Bundesbank. The move reduced the company's reliance on partner banks and supported the transition from securities accounts previously held through Baader Bank to Scalable's own infrastructure."}, {"id": "v276", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Consistent release point and deception from his arm angle made pitches look like fastballs until late movement, producing whiffs and swings through pitches [d386384s16p0].", "ev": "In the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nJohnson agreed to a four-year contract, with an option for a fifth year, for $52.4 million, with the Arizona Diamondbacks, a second-year franchise, in late 1998. Johnson led the team to the playoffs in 1999 on the strength of a 17–9 record and 2.48 ERA with 364 strikeouts, leading the majors in innings, complete games, and strikeouts. Johnson won the NL Cy Young Award and Warren Spahn Award as the best left-handed pitcher in MLB. Johnson became the third MLB pitcher, after Gaylord Perry and Pedro Martínez, to win the Cy Young Award in both the AL and NL; Martínez won the AL Cy Young in 1999. Johnson finished 2000 with 19 wins, 347 strikeouts and a 2.64 ERA, and won his second consecutive NL Cy Young Award and Warren Spahn Award. The Diamondbacks acquired Curt Schilling from the Phillies in July 2000, and the two aces anchored the Diamondbacks rotation."}, {"id": "v141", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "England lost the 2014 Women's World Twenty20 final to Australia [d39890344s0p0].", "ev": "The 2014 Women's World Twenty20 was the fourth Women's World Twenty20 competition, taking place in Bangladesh from 23 March to 6 April 2014. The tournament was played in the cities of Sylhet and Dhaka – Cox's Bazar was originally intended to also host matches, but the venue was not available due to ongoing development. The tournament featured 10 teams, rather than the eight at previous tournaments, with all matches in the tournament accorded women's Twenty20 International (T20I) status. Bangladesh and Ireland made their first appearances at the event, which was run concurrently with the men's tournament. Australia won the tournament, beating England in the final by six wickets.\n\nOn 19 January 2014, Lanning became Australia's youngest-ever captain, standing in for Jodie Fields mid-way through the 2013–14 Women's Ashes. She scored 78 not out from 54 balls in a T20I at Bellerive Oval, although England would go on to win the match by nine wickets and consequently clinch the series.\n\nIn February 2014, Lanning was appointed as the full-time captain of Australia's T20 team. In a retrospective interview, she described the decision as \"a bit of a shock because I hadn't really thought too much about leadership or anything like that\". At the 2014 World Twenty20, Lanning was the tournament's top run-scorer, compiling 257 across six innings. During a group stage match against Ireland, she made 126 runs from 65 balls to set a new record for highest individual total in women's T20Is. In the final against England, she scored 44 off 30 to help Australia chase down a target of 106 with seven wickets in hand and 29 balls remaining.\n\nLanning was confirmed as the national team's captain for all three forms of the game in June 2014. The Sydney Morning Herald reported the appointment as a \"messy captaincy handover\" from incumbent Fields, who subsequently retired from international cricket despite urges from Australian selectors to reconsider.\n\nIn the second ODI of the 2015 Women's Ashes, Lanning scored 104 from 98 deliveries and formed a partnership of 132 with Ellyse Perry in a 63-run win. She followed up with another strong performance in the following match, scoring 85 off 89 to help defeat England by 89 runs. Australia went on to secure a series victory in the T20I leg of the tour, marking Lanning's first Ashes triumph as captain.\n\nOn 21 March 2016, Lanning was dismissed without scoring for the first time in a Twenty20 International, setting a record for most T20I innings (61) before registering a duck."}, {"id": "v204", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "In 1871 the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank, which eventually acquired its parent group to form Citizens Trust Company.[d719464s1p0] The bank established Citizens Financial Group as a holding company when it acquired The Greenville Trust Company in 1954.[d719464s1p0] The bank changed status from a mutual savings bank to a federal stock savings bank in 1985.[d719464s1p0] The bank began expansion into other states with entry into Massachusetts in 1986.[d719464s1p0]", "ev": "Citizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.\n\nIn 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\nCitizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.\n\nIn 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\nCitizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.\n\nIn 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\nCitizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.\n\nIn 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986."}, {"id": "v154", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Villiers played and took wickets across multiple domestic competitions including the County Championship, Women's Twenty20 Cup, KSL, Rachael Heyhoe Flint Trophy, Charlotte Edwards Cup and The Hundred, demonstrating these competitions provide regular high-level match opportunities for player development [d61409827s2p0].", "ev": "Villiers began playing age group cricket for Essex in 2012 before making her first-team debut in 2013, in a County Championship match against Yorkshire. She did not bowl in the match, and made 1 run batting at number 11. She made her Twenty20 debut later that season, against Sussex, and went on to play four games in the 2013 Women's Twenty20 Cup.\n\n2015 was a breakthrough season for Villiers, taking 8 wickets at 14.87 in the County Championship and 12 wickets at 6.66 in the Twenty20 Cup. She thereafter became a regular in Essex's side, and in 2018 was selected as part of the Surrey Stars squad for the 2018 Women's Cricket Super League. She played 11 matches in the season, taking 5 wickets at an average of 18.00. Her standout performance came in the final, when she took 3/22 to help her side win their first KSL. Villiers returned to play for the Stars the following season, where she took 5 wickets in 7 matches.\n\nIn 2020, Villiers joined the Sunrisers for the Rachael Heyhoe Flint Trophy. She played 2 games, picking up one wicket as well as scoring 64 against Southern Vipers. In 2021, she took five wickets in the Rachael Heyhoe Flint Trophy, as well as one in the Charlotte Edwards Cup. She also played for Oval Invincibles in The Hundred, scoring 51 runs and taking 6 wickets as the side won the competition. She played eleven matches for Sunrisers in 2022, across the Charlotte Edwards Cup and the Rachael Heyhoe Flint Trophy, and was the joint-second leading wicket-taker across the whole Rachael Heyhoe Flint Trophy, with 12 wickets at an average of 21.83. She also took six wickets for Oval Invincibles in The Hundred as the side won their second title.\n\nIn 2023, she was Sunrisers' leading wicket-taker in the Charlotte Edwards Cup, with 10 wickets at an average of 15.90. She also scored two half-centuries and took 12 wickets in the Rachael Heyhoe Flint Trophy. She also played seven matches for Oval Invincibles in The Hundred.\n\nIn September 2024 Villiers signed a three-year contract with Durham to play in the new domestic county competitions from 2025.\n\nVilliers began playing age group cricket for Essex in 2012 before making her first-team debut in 2013, in a County Championship match against Yorkshire. She did not bowl in the match, and made 1 run batting at number 11. She made her Twenty20 debut later that season, against Sussex, and went on to play four games in the 2013 Women's Twenty20 Cup.\n\n2015 was a breakthrough season for Villiers, taking 8 wickets at 14.87 in the County Championship and 12 wickets at 6.66 in the Twenty20 Cup. She thereafter became a regular in Essex's side, and in 2018 was selected as part of the Surrey Stars squad for the 2018 Women's Cricket Super League. She played 11 matches in the season, taking 5 wickets at an average of 18.00. Her standout performance came in the final, when she took 3/22 to help her side win their first KSL. Villiers returned to play for the Stars the following season, where she took 5 wickets in 7 matches.\n\nIn 2020, Villiers joined the Sunrisers for the Rachael Heyhoe Flint Trophy. She played 2 games, picking up one wicket as well as scoring 64 against Southern Vipers. In 2021, she took five wickets in the Rachael Heyhoe Flint Trophy, as well as one in the Charlotte Edwards Cup. She also played for Oval Invincibles in The Hundred, scoring 51 runs and taking 6 wickets as the side won the competition. She played eleven matches for Sunrisers in 2022, across the Charlotte Edwards Cup and the Rachael Heyhoe Flint Trophy, and was the joint-second leading wicket-taker across the whole Rachael Heyhoe Flint Trophy, with 12 wickets at an average of 21.83. She also took six wickets for Oval Invincibles in The Hundred as the side won their second title.\n\nIn 2023, she was Sunrisers' leading wicket-taker in the Charlotte Edwards Cup, with 10 wickets at an average of 15.90. She also scored two half-centuries and took 12 wickets in the Rachael Heyhoe Flint Trophy. She also played seven matches for Oval Invincibles in The Hundred.\n\nIn September 2024 Villiers signed a three-year contract with Durham to play in the new domestic county competitions from 2025.\n\nVilliers was named in her first England squad for the Women's Twenty20 International series against Australia in July 2019. She made her debut in the 3rd T20I, and took 2-20 from her four overs, dismissing Alyssa Healy and Ashleigh Gardner.\n\nIn November 2019, she was named in England's squad for their series against Pakistan. She played two T20Is, and took two wickets. Villiers went on to play one match in England's 2020 ICC Women's T20 World Cup campaign in Australia, taking 1–30 against the West Indies\n\nOn 18 June 2020, Villiers was named in a squad of 24 players to begin training ahead of international women's fixtures starting in England following the COVID-19 pandemic. She played all five matches in the subsequent series against West Indies, taking 2–10 in the 2nd T20I.\n\nIn 2021, Villiers was named in the squad for England's tour of New Zealand. She played all three T20Is on the tour, taking four wickets including an international career-best of 3/10 in the final match of the series. In June 2021, Villiers was named as in England's Test squad for their one-off match against India. In December 2021, Villiers was named in England's squad for their tour to Australia to contest the Women's Ashes. In February 2022, she was named as one of two reserve players in England's team for the 2022 Women's Cricket World Cup in New Zealand.\n\nVilliers made her One Day International debut for England against Ireland at Stormont in Belfast on 7 September 2024 registering bowling figures of 0/49 from her 10 overs and scoring 13 with the bat."}, {"id": "v065", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The baseline development was completed by around 1994 [d952206s1p0].", "ev": "Work on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other va wever, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since."}, {"id": "v116", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "His programs included level-four step sequences and footwork that were repeatedly noted as high-level elements contributing to his component scores [d9069082s10p0].", "ev": "During the 2015–16 Grand Prix series, Fernández won gold at both of his events, the 2015 Cup of China and 2015 Rostelecom Cup, and qualified for the 2015–16 Grand Prix Final in Barcelona. Second to Hanyu in both segments in Barcelona, he won silver in the Grand Prix Final for the second year in a row. In the free program, he landed his three planned quadruple jumps and scored 201.43 points, becoming the second skater in history to receive over 200 points in this segment.\n\nFernández defended his national title at the Spanish Championships in December 2015, attempting and completing two quadruple jumps in the short program for the first time in his career (a quad toe loop in combination with a triple toe loop, and a quad Salchow).\n\nAt the 2016 European Championships in Bratislava, Fernández successfully landed a quad toe loop-triple toe loop combination, quad Salchow, and triple Axel to score a new personal best of 102.54 points in the short program. With this score, he became only the second man in history to break 100 points in that segment. With a 14-point advantage going into the free skate, Fernández landed three quadruple jumps, but fell on the second triple Axel of the program (which he had just added). He scored 200.23 points, for a combined total of 302.77, becoming the second skater in history to cross the 300 point mark. He finished ahead of silver medalist Oleksii Bychenko by a margin of over 60 points.\n\nEntering the 2016 World Championships in Boston as the defending champion, Fernández opened his short program with a quad toe loop-triple toe loop combination, then fell on his quad Salchow attempt, but recovered to complete a triple Axel, two level-four spins and level-four footwork, scoring 98.52 points and securing second place. After the short program, he could do little practice due to a recurring bursa on the heel of his right foot. On the day of the free skate, the medical team of the event attended to his injury for several hours and helped him to alleviate the problem. Fernández entered the free skate segment with a 12.04 deficit behind Yuzuru Hanyu – the largest point gap at the time between first and second place after the short program in any discipline at a World Championships or Olympic Games under the ISU judging system. Fernández completed a clean free skate, which included three quads (a toe loop and two Salchows, one in combination with a triple toe loop), two triple Axels, four more triples as well as difficult spins and level-four footwork, and scored 216.41, surpassing his personal best in the segment by 14.98 points. He reached a total score of 314.93, also a new personal best. His free skating and total scores were the second and third highest, respectively, under the ISU judging system as of the event. Hanyu made mistakes in his free skate, allowing Fernández to close the point gap and overtake him by a further 19.76 points to become the 2016 World champion.\n\nAccording to a May 2016 news article, Fernández's income from shows is greater than his competitive earnings. When he won his second World title, Spain had 17 ice rinks, compared to a hundred in Toronto, and 300 licensed skaters, compared to about 15,000 in France.\n\nDuring the 2015–16 Grand Prix series, Fernández won gold at both of his events, the 2015 Cup of China and 2015 Rostelecom Cup, and qualified for the 2015–16 Grand Prix Final in Barcelona. Second to Hanyu in both segments in B s income from shows is greater than his competitive earnings. When he won his second World title, Spain had 17 ice rinks, compared to a hundred in Toronto, and 300 licensed skaters, compared to about 15,000 in France."}, {"id": "v039", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The FCC created and filled a chief diversity officer position, reflecting an institutional response to concerns about diversity and local staffing in broadcasting [d55974s19p0].", "ev": "In the second half of 2006, groups such as the National Hispanic Media Coalition, the National Latino Media Council, the National Association of Hispanic Journalists, the National Institute for Latino Policy, the League of United Latin American Citizens (LULAC) and others held town hall meetings in California, New York and Texas on media diversity as its effects Latinos and minority communities. They documented widespread and deeply felt community concerns about the negative effects of media concentration and consolidation on racial-ethnic diversity in staffing and programming. At these Latino town hall meetings, the issue of the FCC's lax monitoring of obscene and pornographic material in Spanish-language radio and the lack of racial and national-origin diversity among Latino staff in Spanish-language television were other major themes.\n\nPresident Barack Obama appointed Mark Lloyd to the FCC in the newly created post of associate general counsel/chief diversity officer.\n\nIn the second half of 2006, groups such as the National Hispanic Media Coalition, the National Latino Media Council, the National Association of Hispanic Journalists, the National Institute for Latino Policy, the League of United Latin American Citizens (LULAC) and others held town hall meetings in California, New York and Texas on media diversity as its effects Latinos and minority communities. They documented widespread and deeply felt community concerns about the negative effects of media concentration and consolidation on racial-ethnic diversity in staffing and programming. At these Latino town hall meetings, the issue of the FCC's lax monitoring of obscene and pornographic material in Spanish-language radio and the lack of racial and national-origin diversity among Latino staff in Spanish-language television were other major themes.\n\nPresident Barack Obama appointed Mark Lloyd to the FCC in the newly created post of associate general counsel/chief diversity officer."}, {"id": "v100", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "S-200 fire-control radars and batteries have been vulnerable to preemptive strikes that degraded their operational effectiveness [d1380590s8p0].", "ev": "Starting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of
