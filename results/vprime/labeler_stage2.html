different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\"."}, {"id": "v289", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Johnson engaged in theatrical on-field interactions, such as throwing over Larry Walker's head in the 1997 All-Star Game, which highlighted contentious or showmanlike exchanges with opponents [d386384s7p0].", "ev": "In the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nJohnson was sidelined throughout much of the 1996 season with a back injury but rebounded in 1997 with a 20–4 record, 291 strikeouts, and a 2.28 ERA (his personal best). Between May 1994 and October 1997, Johnson went 53–9, including a 16–0 streak that fell one short of the AL record. Johnson had two 19-strikeout starts in 1997, on June 24 and August 8.\n\nAnother colorful All-Star Game moment proceeded in 1997 involving former Expos teammate Larry Walker, then with the Colorado Rockies. When Johnson started a game against the Rockies on June 12, Walker chose not to play, explaining that \"I faced Randy one time in spring training and he almost killed me.\" In the All-Star Game, Walker batted against Johnson, who theatrically threw over his head. Ever adaptable, Walker placed his batting helmet backwards and switched sides in the batters' box to stand right-handed for one pitch. He ended the plate appearance by drawing a walk. The incident momentarily drew mirth and laughter from players in both dugouts, fans, and announcers as well as comparisons to the at bat with Kruk in the 1993 All-Star Game. In spite of garnering a reputation of avoiding Johnson, Walker batted.393 in 28 at bats against him in his career, nearly double the rate of all left-handed batters at.199. When the 1998 season began, Johnson was upset the Mariners would not offer him a contract extension, given his contract was expiring after the season. Though the Mariners initially wanted to keep Johnson, turning down a trade offer from the Los Angeles Dodgers, they fell out of contention, going 8–20 in June. Minutes before the non-waiver trade deadline, on July 31, the Mariners traded Johnson to the Houston Astros for minor leaguers Freddy García, Carlos Guillén, and John Halama. Johnson was a Mariner for nearly nine years, his longest tenure with one team."}, {"id": "v130", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The promotion has used storyline devices that award and then revoke titles as part of angles, as when a title was initially forfeited due to an alleged injury and then contested in a match to settle the matter [d30298227s2p0].", "ev": "Angel debuted in the International Wrestling Association on October 16, 2010, joining three other wrestlers in assaults against the incumbent Caribbean Heavyweight Champion, the first contender for that title as well as Dennis Rivera, who held three belts including the IWA Undisputed World Heavyweight Championship, and the mandatory challenger for that title. The group, as well as all of its members, remained nameless during the following weeks, but Angel continued interfering in title matches, ambushing both the Intercontinental Champion and his challenger at Halloween Mayhem, an annual event held by the promotion. He was the first member to be named, being called by his ring name \"Chris Angel\", in an episode of Impacto Total where the group vandalized Savio Vega 's wrestling school. On November 20, 2010, the group identified itself as \"The Academy\" and were officially included in the roster. In this event, Angel once again interrupted a match for the Intercontinental Championship and the IWA's president, Miguel Pérez, Jr., ordered that he would get a title opportunity in his in-ring debut.\n\nThe match was scheduled for Christmas in PR, the promotion's season-closing event. An angle was run where the incumbent champion was injured and the title forfeited and awarded to Angel, without even having to compete once in an official match. However, the decision was revoked shortly afterwards and Savio Vega, former heavyweight champion of the IWA, World Wrestling Council, World Wrestling Association, Wrestling Alliance Revolution and Revolution X-Treme Wrestling, emerged as a surprise contender to compete for the championship. Angel won the match by pin fall, following two of his signature moves on the former World Wrestling Federation Superstar. He closed 2010 by winning Puerto Rico Wrestling's \"Newcomer of the Year\" award, which is selected by popular vote."}, {"id": "v066", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The basic missile is designated R-77 and is also known as izdeliye 170 [d952206s1p0].", "ev": "Work on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nThe Vympel NPO R-77 missile (NATO reporting name: AA-12 Adder) is a Russian active radar homing beyond-visual-range air-to-air missile. It is also known by its export designation RVV-AE. It is the Russian counterpart to the American AIM-120 AMRAAM missile.\n\nThe R-77 was marked by a severely protracted development. Work began in the 1980s, but was not completed before the dissolution of the Soviet Union. For many years, only the RVV-AE model was produced for export customers. Production was further disrupted when the Russo-Ukrainian War resulted in a Ukrainian arms embargo against Russia, severing supply chains. The Russian Aerospace Forces finally entered the R-77-1 (AA-12B) into service in 2015. It was subsequently deployed by Su-35S fighters in Syria on combat air patrols. The export model of the R-77-1 is called RVV-SD.\n\nThe Vympel NPO R-77 missile (NATO reporting name: AA-12 Adder) is a Russian active radar homing beyond-visual-range air-to-air missile. It is also known by its export designation RVV-AE. It is the Russian counterpart to the American AIM-120 AMRAAM missile.\n\nThe R-77 was marked by a severely protracted development. Work began in the 1980s, but was not completed before the dissolution of the Soviet Union. For many years, only the RVV-AE model was produced for export customers. Production was further disrupted when the Russo-Ukrainian War resulted in a Ukrainian arms embargo against Russia, severing supply chains. The Russian Aerospace Forces finally entered the R-77-1 (AA-12B) into service in 2015. It was subsequently deployed by Su-35S fighters in Syria on combat air patrols. The export model of the R-77-1 is called RVV-SD.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukra ": "v052", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Viz Media licensed and serialized the manga online at SigIkki.com and published the English-language tankōbon volumes in North America [d23746608s3p0].", "ev": "Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.\n\nThe manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013."}, {"id": "v099", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "S-200 air-defense sites and equipment were found in a state of disrepair after being overrun, indicating maintenance and operational degradation under combat conditions [d1380590s8p0].", "ev": "Starting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational sta const KEY = "vprime_stage2_v1";
let ans = {}; try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
let i = 0;

const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans)); } catch (e) {} };

function render() {
  const it = ITEMS[i];
  document.getElementById("pos").textContent = (i + 1) + " / " + ITEMS.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("claim").textContent = it.claim;
  // 문장이 단 인용 표시를 근거에서 강조한다
  const marks = [...new Set((it.claim.match(/\[d[0-9a-z]+\]/g) || []))];
  let ev = esc(it.ev);
  for (const m of marks) ev = ev.split(esc(m)).join("<mark>" + esc(m) + "</mark>");
  document.getElementById("ev").innerHTML = ev;
  document.getElementById("ev").scrollTop = 0;
  const n = Object.keys(ans).length;
  document.getElementById("cnt").innerHTML = n === ITEMS.length
    ? '<span class="done">40건 완료 — 내려받으세요</span>' : ("채움 " + n + " / " + ITEMS.length);
  document.getElementById("pb").style.width = (100 * n / ITEMS.length) + "%";
  document.querySelectorAll("[data-v]").forEach(b =>
    b.classList.toggle("on", ans[it.id] === b.dataset.v));
}
function pick(v) {
  ans[ITEMS[i].id] = v; save();
  if (i < ITEMS.length - 1) i++;           // 고르면 자동으로 다음
  render();
}
document.querySelectorAll("[data-v]").forEach(b =>
  b.onclick = () => pick(b.dataset.v));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < ITEMS.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  const k = ITEMS.findIndex(x => !ans[x.id]);
  if (k < 0) { alert("전부 채웠습니다. CSV 를 내려받으세요."); return; }
  i = k; render();
};
document.onkeydown = e => {
  if (e.key === "1") pick("지지");
  else if (e.key === "2") pick("불지지");
  else if (e.key === "3") pick("판단불가");
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["item_id", "human_label"].join(",")]
    .concat(ITEMS.map(x => [q(x.id), q(ans[x.id] || "")].join(",")));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labels_stage2_filled.csv";
  a.click();
};
render();
