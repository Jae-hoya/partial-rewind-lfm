anded hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn January 2007, the Yankees traded Johnson back to the Diamondbacks, almost two years to the day that Arizona had traded him to New York, for Luis Vizcaíno, Alberto González, Steven Jackson, and Ross Ohlendorf. The Yankees' decision to trade Johnson was primarily based on a pre-season conversation he had with Yankees general manager Brian Cashman about the importance of being closer to his family in Phoenix after the death of his brother.\n\nJohnson missed most of April, rehabilitating his injured back before returning on April 24. He allowed six runs in 5 innings and took the loss but struck out seven. He returned to form, and by his tenth start of the season was among the NL's top ten strikeout pitchers. But on July 3, his surgically repaired disc from the previous season was reinjured. Johnson had season-ending surgery on the same disc, this time removing it completely. Reporting that the procedure went \"a little better than expected\", Arizona hoped that Johnson would be ready for the 2008 season.\n\nJohnson made his 2008 debut on April 14 against the San Francisco Giants at AT&T Park, eight months following his back surgery. On June 3, he struck out Mike Cameron of the Milwaukee Brewers for career strikeout number 4,673, surpassing Roger Clemens for second place on the all-time strikeout leaders list. Johnson struck out 8 in the game but allowed six runs as the Diamondbacks lost 7–1. Johnson got his 4,700th career strikeout on July 6. On July 27, Fred Lewis became the first left-handed batter to get four hits against Johnson in a game. In the first at-bat in this game, a fog horn went off as Johnson was releasing his pitch, causing him to throw an eephus pitch which fell for a strike. In his final start of the season, he recorded his 100th career complete game in a 2–1 victory over the Colorado Rockies. He finished the season with an 11–10 record and 3.91 ERA.\n\nIn January 2007, the Yankees traded Johnson back to the Diamondbacks, almost two years to the day that Arizona had traded him to New York, for Luis Vizcaíno, Alberto González, Steven Jackson, and Ross Ohlendorf. The Yankees' decision to trade Johnson was primarily based on a pre-season conversation he had with Yankees general manager Brian Cashman about the importance of being closer to his family in Phoenix after the death of his brother.\n\nJohnson missed most of April, rehabilitating his injured back before returning on April 24. He allowed six runs in 5 innings and took the loss but struck out seven. He returned to form, and by his tenth start of the season was among the NL's top ten strikeout pitchers. But on July 3, his surgically repaired disc from the previous season was reinjured. Johnson had season-ending surgery on the same disc, this time removin igeria's second innings, helping Gold Coast to an innings victory. However, European-only matches were introduced around the same time, beginning in 1906 and ending only in 1956, the year before Ghanaian independence. The Gold Coast's leading run-scorer in the inaugural European-only fixture was Gordon Guggisberg, who had earlier played a single first-class match (and was later Governor of the Gold Coast, from 1919 to 1927).\n\nAfter a long gap, inter-colonial matches resumed in April 1926, when the Gold Coast played the Nigerian national team in Lagos. Gold Coast–Nigeria fixtures, both multiracial and European-only, were played almost annually from 1926 to 1939, and resumed again after World War II. In several years the European-only fixtures were played in provincial cities like Kumasi and Ibadan, although multiracial games were played only in the capitals. Gold Coast sides were occasionally bolstered by players of first-class standard – for instance, Cecil Pullan (Oxford University and Worcestershire) and Michael Green (Gloucestershire and Essex) appeared together in a 1937 match, with Pullan appearing again after the war. The national side played its first match as \"Ghana\" less than a month after Kwame Nkrumah 's independence declaration in March 1957, with annual Ghana–Nigeria matches occurring until 1964."}, {"id": "v030", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "He served as a vice-chairman of the Commission on Presidential Debates.[d1107832s9p0] He served as chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism.[d1107832s9p0]", "ev": "Minow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.\n\nMinow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.\n\nAccording to Michelle Obama 's book Becoming, Minow and his wife \"busted\" then Michelle Robinson and Barack Obama—both still associates at Sidley Austin—on their first date, greeting them \"warmly\" in the popcorn line at the Water Tower Place cinema, before the new couple saw Spike Lee 's movie, Do The Right Thing. Robinson and Obama had wanted to keep their relationship a secret from colleagues at the firm; Minow only \"smiled\" and \"made no comment\" at the fact they were together.\n\nMinow supported Republican Bruce Rauner in the 2014 Illinois gubernatorial election, despite his history in Democratic politics. He said his vote was a response to the poor track record of Democratic governance in Illinois.\n\nMinow co-chaired the 1976 and 1980 presidential debates and was a vice-chairman of the Commission on Presidential Debates. He served on numerous presidential commissions and was chairman of a special advisory committee to the Secretary of Defense on protecting civil liberties in the fight against terrorism. His book on the history of the presidential debates was released in 2008.\n\nMinow was a prominent supporter of Barack Obama 's candidacy for President of the United States. Minow recruited Obama in 1988 to work for his law firm Sidley Austin LLP as a summer associate, where Obama met his future wife Michelle Robinson. Minow pursued Obama on the recommendation of his daughter Martha, who was one of Barack Obama's law professors.\n\nAccording to Michelle Obama 's 0].", "ev": "Cornes began his AFL career as a key-forward after debuting in 1999 and playing 6 games in his first season. Cornes was a regular in the Power forward line in 2000, booting 22 goals. Between 2000 and 2003 Cornes and Tredrea formed one of the best forward partnerships in the AFL, with Chad playing up the ground demonstrating his great contested marking ability. Despite being one of the best forwards in the game, Cornes was moved into defence at the start of the 2004 season.\n\nCornes began his AFL career as a key-forward after debuting in 1999 and playing 6 games in his first season. Cornes was a regular in the Power forward line in 2000, booting 22 goals. Between 2000 and 2003 Cornes and Tredrea formed one of the best forward partnerships in the AFL, with Chad playing up the ground demonstrating his great contested marking ability. Despite being one of the best forwards in the game, Cornes was moved into defence at the start of the 2004 season.\n\nIn 2004, Cornes was moved to centre-half back. The new position worked wonders as Cornes began to single-handedly dominate games, earning himself his first All-Australian award, and finishing third in the Brownlow medal. The move to centre-half back was a key reason for Port Adelaide's dominance, which culminated in their first Premiership in 2004, defeating the Brisbane Lions by 40 points. He had a key defensive role on Brisbane Lions' forward Jonathan Brown during the Grand Final, restricting him to just one behind for the match.\n\nAfter Port Adelaide's dominance in 2004, Cornes was again used as a key defender to great effect. However, Port Adelaide was unable to repeat its finals' glory of 2004, being eliminated by cross town rivals Adelaide in the first semi-final."}, {"id": "v241", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "A stiff frame flexes very little and transmits power from the foot to the wheels more directly [d80357330s5p0].", "ev": "Speed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11\n\nBecause of the need for a deep dorsiflexion, speed skates have no eyelets, buckles, or straps above middle eyelets at 45° angle which is the minimum requirement for proper heel lock. Indeed, speed skates have no shafts and cuffs commonly found in other inline skates. In order for racers to freely flex their foot around ankle bones, speed boots are cut the lowest among all inline skates, around or below the ankle bones.: 17, 34–36 : 308–311\n\nA skater compensates for the lack of lateral ankle support from boots by strengthening muscle support for proper ankle movements such as dorsiflexion, pronation and supination, which are essential for double push strides with aggressive push-offs and precise transitions from outside to inside edges. The removal of shaft and cuff significantly reduces a boot's weight, a key advantage to a skater in a game where a saving of fractional seconds makes a difference.: 75–83 : 3–30, 308–311\n\nA speed skate boot is close-fitting, without much padding, and usually made of leather, carbon fiber, or other strong and lightweight composite materials. For best performance, the boot must conform closely to the shape of the foot to prevent it from moving inside the boot. Thus, most boots are custom-fitted or else heat-moldable.\n\nThe frame may be made of aircraft-quality aluminum, magnesium, or possibly lightweight carbon fiber. All frames flex during skating. A stiff frame flexes very little, so it transmits power from the foot to the wheels more directly. A shorter frame navigates tight curves at smaller tracks better but may become wobbly at high speeds. A longer frame provides stable tracking at high speed and increased power transfer, useful for long-distance events.: 311–314 : 18–20\n\nThe length and height of a frame determine the number and size of wheels it can accommodate. More wheels and bigger wheels increase mass, making acceleration harder and slower. But once rolling at speed, a skater can more easily maintain top speed given the rotational inertia. In the 1990s, speed skaters preferred a frame with five wheels, usually 80 mm in diameter (i.e. 5x80mm). In the 21st century, wheel size ranges from 90 mm to 125 mm. A setup with four 110 mm wheels (4x110mm) is typical for competitive speed skating, and three 125 mm wheels (3x125mm) for marathon skates at marathon events.: 311–314 : 22, 24, 34–36\n\nSpeed skates generally adopt either the 165mm or the 195mm mounting standard for securing a frame to a boot. Short speed frames for short track racing use the 165mm standard, while long frames for marathon use the 195mm standard in order to better accommodate larger wheels. Both of these 2-point mounting standards feature a built-in heel lift that pitches a skater forward, creating forward flex.\n\nSpeed skating generally adopts harder wheels than other disciplines. Harder wheels minimize energy lost to elastic hysteresis when a skater's weight deforms wheels upon ground contact. Speed skaters prefer wheels with high rebound, which returns the compression energy back to the skater. Speed wheels have a pointy bullet profile that reduces friction from drags, when a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26\n\nSpeed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130\n\nSpeed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward lean . In the 1990s, speed skaters preferred a frame with five wheels, usually 80 mm in diameter (i.e. 5x80mm). In the 21st century, wheel size ranges from 90 mm to 125 mm. A setup with four 110 mm wheels (4x110mm) is typical for competitive speed skating, and three 125 mm wheels (3x125mm) for marathon skates at marathon events.: 311–314 : 22, 24, 34–36\n\nSpeed skates generally adopt either the 165mm or the 195mm mounting standard for securing a frame to a boot. Short speed frames for short track racing use the 165mm standard, while long frames for marathon use the 195mm standard in order to better accommodate larger wheels. Both of these 2-point mounting standards feature a built-in heel lift that pitches a skater forward, creating forward flex.\n\nSpeed skating generally adopts harder wheels than other disciplines. Harder wheels minimize energy lost to elastic hysteresis when a skater's weight deforms wheels upon ground contact. Speed skaters prefer wheels with high rebound, which returns the compression energy back to the skater. Speed wheels have a pointy bullet profile that reduces friction from drags, when a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26\n\nSpeed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130"}, {"id": "v074", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The basic R-77 is not thought to have entered Russian Aerospace Forces inventories in significant numbers [d952206s1p0].", "ev": "Work on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) -PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nThe Vympel NPO R-77 missile (NATO reporting name: AA-12 Adder) is a Russian active radar homing beyond-visual-range air-to-air missile. It is also known by its export designation RVV-AE. It is the Russian counterpart to the American AIM-120 AMRAAM missile.\n\nThe R-77 was marked by a severely protracted development. Work began in the 1980s, but was not completed before the dissolution of the Soviet Union. For many years, only the RVV-AE model was produced for export customers. Production was further disrupted when the Russo-Ukrainian War resulted in a Ukrainian arms embargo against Russia, severing supply chains. The Russian Aerospace Forces finally entered the R-77-1 (AA-12B) into service in 2015. It was subsequently deployed by Su-35S fighters in Syria on combat air patrols. The export model of the R-77-1 is called RVV-SD.\n\nThe Vympel NPO R-77 missile (NATO reporting name: AA-12 Adder) is a Russian active radar homing beyond-visual-range air-to-air missile. It is also known by its export designation RVV-AE. It is the Russian counterpart to the American AIM-120 AMRAAM missile.\n\nThe R-77 was marked by a severely protracted development. Work began in the 1980s, but was not completed before the dissolution of the Soviet Union. For many years, only the RVV-AE model was produced for export customers. Production was further disrupted when the Russo-Ukrainian War resulted in a Ukrainian arms embargo against Russia, severing supply chains. The Russian Aerospace Forces finally entered the R-77-1 (AA-12B) into service in 2015. It was subsequently deployed by Su-35S fighters in Syria on combat air patrols. The export model of the R-77-1 is called RVV-SD."}, {"id": "v118", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Riku Miura trained with Takeshi Honda in Japan and traveled to Canada two to three weeks at a time to work with Canadian pair coach Bruno Marcotte [d57879465s2p0].", "ev": "Miura began figure skating in 2011 and was a singles skater until the age of twelve when she decided to try pair skating after meeting Canadian pair skating coach, Bruno Marcotte, at a training seminar he was holding in Japan.\n\nMiura first teamed up with Shoya Ichihashi in 2015. The pair was coached by Takeshi Honda in Japan while also traveling to Canada two to three weeks at a time to work with Marcotte. Miura/Ichihashi would go on to compete at four ISU Championships. This included a tenth-place finish at the 2018 Four Continents Championships and at the 2018 World Junior Championships in Sofia, Bulgaria. Their partnership dissolved following the 2018–19 figure skating season."}, {"id": "v219", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Wealth Management brought together the group's funds management platform, master funds, superannuation, insurance and financial advice business support. [d575530s16p0] Colonial First State, Colonial First State Global Asset Management and CommInsure formed part of Wealth Management. [d575530s16p0] The bank was granted MySuper authority, enabling it to continue to receive default superannuation contributions from 1 January 2014. [d575530s16p0]", "ev": "Wealth Management brings together the Groups funds management platform, master funds, superannuation, insurance and financial advice business support. Colonial First State, Colonial First State Global Asset Management and CommInsure all form part of Wealth Management. CBA has been granted a MySuper authority, enabling it to continue to receive default superannuation contribution from 1 January 2014.\n\nWealth Management brings together the Groups funds management platform, master funds, superannuation, insurance and financial advice business support. Colonial First State, Colonial First State Global Asset Management and CommInsure all form part of Wealth Management. CBA has been granted a MySuper authority, enabling it to continue to receive default superannuation contribution from 1 January 2014.\n\nWealth Management brings together the Groups funds management platform, master funds, superannuation, insurance and financial advice business support. Colonial First State, Colonial First State Global Asset Management and CommInsure all form part of Wealth Management. CBA has been granted a MySuper authority, enabling it to continue to receive default superannuation contribution from 1 January 2014."}, {"id": "v042", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Sunny was serialized in Monthly Ikki from December 2010 until Ikki suspended publication in September 2014, after which it transferred to Monthly Big Comic Spirits from January to July 2015 [d43449646s0p0][d43449646s3p0].", "ev": "Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.\n\nSunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017.\n\nWritten and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.\n\nThe manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016."}, {"id": "v101", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The Soviet Union supplied S-200 missiles to Syria and organized them into multiple long-range surface-to-air missile regiments [d1380590s8p0].", "ev": "Starting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May oncept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\nThe concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind.\n\nThe concept originated from artist Daisuke Igarashi's interest in marine life and his habit of collecting field guides on marine animals. Initially titled Fish Girl, the story was inspired by mermaid mythology and the natural behavior of dugongs, which led Igarashi to imagine children raised by marine creatures. Igarashi sought to balance imaginative storytelling with scientific accuracy, consulting marine mammal researcher Yūko Tajima for factual details, such as the anatomy of sperm whales. Despite being published in a seinen manga magazine, the series was created with a female readership in mind."}, {"id": "v270", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "He used a low three-quarters delivery that was described as nearly sidearm [d386384s16p0].", "ev": "In the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said."}, {"id": "v243", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Speed skating uses harder wheels with high rebound and a bullet profile to minimize energy loss and reduce rolling and drag friction [d80357330s5p0].", "ev": "Speed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11\n\nBecause of the need for a deep dorsiflexion, speed skates have no eyelets, buckles, or straps above middle eyelets at 45° angle which is the minimum requirement for proper heel lock. Indeed, speed skates have no shafts and cuffs commonly found in other inline skates. In order for racers to freely flex their foot around ankle bones, speed boots are cut the lowest among all inline skates, around or below the ankle bones.: 17, 34–36 : 308–311\n\nA skater compensates for the lack of lateral ankle support from boots by strengthening muscle support for proper ankle movements such as dorsiflexion, pronation and supination, which are essential for double push strides with aggressive push-offs and precise transitions from outside to inside edges. The removal of shaft and cuff significantly reduces a boot's weight, a key advantage to a skater in a game where a saving of fractional seconds makes a difference.: 75–83 : 3–30, 308–311\n\nA speed skate boot is close-fitting, without much padding, and usually made of leather, carbon fiber, or other strong and lightweight composite materials. For best performance, the boot must conform closely to the shape of the foot to prevent it from moving inside the boot. Thus, most boots are custom-fitted or else heat-moldable.\n\nThe frame may be made of aircraft-quality aluminum, magnesium, or possibly lightweight carbon fiber. All frames flex during skating. A stiff frame flexes very little, so it transmits power from the foot to the wheels more directly. A shorter frame navigates tight curves at smaller tracks better but may become wobbly at high speeds. A longer frame provides stable tracking at high speed and increased power transfer, useful for long-distance events.: 311–314 : 18–20\n\nThe length and height of a frame determine the number and size of wheels it can accommodate. More wheels and bigger wheels increase mass, making acceleration harder and slower. But once rolling at speed, a skater can more easily maintain top speed given the rotational inertia. In the 1990s, speed skaters preferred a frame with five wheels, usually 80 mm in diameter (i.e. 5x80mm). In the 21st century, wheel size ranges from 90 mm to 125 mm. A setup with four 110 mm wheels (4x110mm) is typical for competitive speed skating, and three 125 mm wheels (3x125mm) for marathon skates at marathon events.: 311–314 : 22, 24, 34–36\n\nSpeed skates generally adopt either the 165mm or the 195mm mounting standard for securing a frame to a boot. Short speed frames for short track racing use the 165mm standard, while long frames for marathon use the 195mm standard in order to better accommodate larger wheels. Both of these 2-point mounting standards feature a built-in heel lift that pitches a skater forward, creating forward flex.\n\nSpeed skating generally adopts harder wheels than other disciplines. Harder wheels minimize energy lost to elastic hysteresis when a skater's weight deforms wheels upon ground contact. Speed skaters prefer wheels with high rebound, which returns the compression energy back to the skater. Speed wheels have a pointy bullet profile that reduces friction from drags, when a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26\n\nSpeed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130\n\nSpeed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80 uires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11\n\nBecause of the need for a deep dorsiflexion, speed skates have no eyelets, buckles, or straps above middle eyelets at 45° angle which is the minimum requirement for proper heel lock. Indeed, speed skates have no shafts and cuffs commonly found in other inline skates. In order for racers to freely flex their foot around ankle bones, speed boots are cut the lowest among all inline skates, around or below the ankle bones.: 17, 34–36 : 308–311\n\nA skater compensates for the lack of lateral ankle support from boots by strengthening muscle support for proper ankle movements such as dorsiflexion, pronation and supination, which are essential for double push strides with aggressive push-offs and precise transitions from outside to inside edges. The removal of shaft and cuff significantly reduces a boot's weight, a key advantage to a skater in a game where a saving of fractional seconds makes a difference.: 75–83 : 3–30, 308–311\n\nA speed skate boot is close-fitting, without much padding, and usually made of leather, carbon fiber, or other strong and lightweight composite materials. For best performance, the boot must conform closely to the shape of the foot to prevent it from moving inside the boot. Thus, most boots are custom-fitted or else heat-moldable.\n\nThe frame may be made of aircraft-quality aluminum, magnesium, or possibly lightweight carbon fiber. All frames flex during skating. A stiff frame flexes very little, so it transmits power from the foot to the wheels more directly. A shorter frame navigates tight curves at smaller tracks better but may become wobbly at high speeds. A longer frame provides stable tracking at high speed and increased power transfer, useful for long-distance events.: 311–314 : 18–20\n\nThe length and height of a frame determine the numb  특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The Northern Province had a population of 1,150,148 in 2024. [d23777640s5p0] The majority of the province's population are Sri Lankan Tamils. [d23777640s5p0] The province contains sizeable Sri Lankan Moor and Sinhalese minorities. [d23777640s5p0]", "ev": "The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.\n\nThe population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\nThe population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.\n\nThe population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\nThe population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.\n\nThe population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war."}, {"id": "v085", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The missile was first publicly seen at the 1992 Moscow Airshow, indicating export availability in the early 1990s [d952206s1p0].", "ev": "Work on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the expo well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since."}, {"id": "v237", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Powerful push-offs produce the farthest displacement of the pushing skate for efficient strides [d80357330s5p0].", "ev": "Speed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11\n\nBecause of the need for a deep dorsiflexion, speed skates have no eyelets, buckles, or straps above middle eyelets at 45° angle which is the minimum requirement for proper heel lock. Indeed, speed skates have no shafts and cuffs commonly found in other inline skates. In order for racers to freely flex their foot around ankle bones, speed boots are cut the lowest among all inline skates, around or below the ankle bones.: 17, 34–36 : 308–311\n\nA skater compensates for the lack of lateral ankle support from boots by strengthening muscle support for proper ankle movements such as dorsiflexion, pronation and supination, which are essential for double push strides with aggressive push-offs and precise transitions from outside to inside edges. The removal of shaft and cuff significantly reduces a boot's weight, a key advantage to a skater in a game where a saving of fractional seconds makes a difference.: 75–83 : 3–30, 308–311\n\nA speed skate boot is close-fitting, without much padding, and usually made of leather, carbon fiber, or other strong and lightweight composite materials. For best performance, the boot must conform closely to the shape of the foot to prevent it from moving inside the boot. Thus, most boots are custom-fitted or else heat-moldable.\n\nThe frame may be made of aircraft-quality aluminum, magnesium, or possibly lightweight carbon fiber. All frames flex during skating. A stiff frame flexes very little, so it transmits power from the foot to the wheels more directly. A shorter frame navigates tight curves at smaller tracks better but may become wobbly at high speeds. A longer frame provides stable tracking at high speed and increased power transfer, useful for long-distance events.: 311–314 : 18–20\n\nThe length and height of a frame determine the number and size of wheels it can accommodate. More wheels and bigger wheels increase mass, making acceleration harder and slower. But once rolling at speed, a skater can more easily maintain top speed given the rotational inertia. In the 1990s, speed skaters preferred a frame with five wheels, usually 80 mm in diameter (i.e. 5x80mm). In the 21st century, wheel size ranges from 90 mm to 125 mm. A setup with four 110 mm wheels (4x110mm) is typical for competitive speed skating, and three 125 mm wheels (3x125mm) for marathon skates at marathon events.: 311–314 : 22, 24, 34–36\n\nSpeed skates generally adopt either the 165mm or the 195mm mounting standard for securing a frame to a boot. Short speed frames for short track racing use the 165mm standard, while long frames for marathon use the 195mm standard in order to better accommodate larger wheels. Both of these 2-point mounting standards feature a built-in heel lift that pitches a skater forward, creating forward flex.\n\nSpeed skating generally adopts harder wheels than other disciplines. Harder wheels minimize energy lost to elastic hysteresis when a skater's weight deforms wheels upon ground contact. Speed skaters prefer wheels with high rebound, which returns the compression energy back to the skater. Speed wheels have a pointy bullet profile that reduces friction from drags, when a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26\n\nSpeed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130\n\nSpeed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11\
