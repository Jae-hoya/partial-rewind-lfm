kōbon volumes in North America [d23746608s3p0].", "ev": "Children of the Sea, written and illustrated by Daisuke Igarashi, was serialized in Shōgakukan 's seinen magazine Monthly Ikki from December 24, 2005, to September 24, 2011. Shōgakukan compiled its chapters into five tankōbon volumes, released from July 30, 2007, to July 30, 2012.\n\nThe manga is licensed in North America by Viz Media, who serialized it online at SigIkki.com and released the five tankōbon volumes from July 21, 2009, to June 18, 2013."}, {"id": "vc013", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The promotion has used storyline devices that award and then revoke titles as part of angles, as when a title was initially forfeited due to an alleged injury and then contested in a match to settle the matter [d30298227s2p0].", "ev": "Angel debuted in the International Wrestling Association on October 16, 2010, joining three other wrestlers in assaults against the incumbent Caribbean Heavyweight Champion, the first contender for that title as well as Dennis Rivera, who held three belts including the IWA Undisputed World Heavyweight Championship, and the mandatory challenger for that title. The group, as well as all of its members, remained nameless during the following weeks, but Angel continued interfering in title matches, ambushing both the Intercontinental Champion and his challenger at Halloween Mayhem, an annual event held by the promotion. He was the first member to be named, being called by his ring name \"Chris Angel\", in an episode of Impacto Total where the group vandalized Savio Vega 's wrestling school. On November 20, 2010, the group identified itself as \"The Academy\" and were officially included in the roster. In this event, Angel once again interrupted a match for the Intercontinental Championship and the IWA's president, Miguel Pérez, Jr., ordered that he would get a title opportunity in his in-ring debut.\n\nThe match was scheduled for Christmas in PR, the promotion's season-closing event. An angle was run where the incumbent champion was injured and the title forfeited and awarded to Angel, without even having to compete once in an official match. However, the decision was revoked shortly afterwards and Savio Vega, former heavyweight champion of the IWA, World Wrestling Council, World Wrestling Association, Wrestling Alliance Revolution and Revolution X-Treme Wrestling, emerged as a surprise contender to compete for the championship. Angel won the match by pin fall, following two of his signature moves on the former World Wrestling Federation Superstar. He closed 2010 by winning Puerto Rico Wrestling's \"Newcomer of the Year\" award, which is selected by popular vote."}, {"id": "vc014", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "CIBC acquired Atlantic Trust, a wealth management unit, in April 2013 to expand its wealth management business [d312912s5p0].", "ev": "In 2000, CIBC signed an agreement with the New York-based Aplettix Inc., a firm specializing in secure transaction systems in the banking sector; although the partnership was later abandoned for alternatives such as VeriSign.\n\nThe early 2000s saw the bank divest from its real estate and investments outside of its business strategy. In 2000, CIBC sold its 10 per cent stake to Rogers Media. CIBC was a minority shareholder in Major League Baseball 's Toronto Blue Jays, with partner Labatt's Breweries from their inception in 1977. The CIBC Leadership Centre in King City, was sold to Benchmark Hospitality in 2001. In 2002, CIBC disbanded Amicus FSB, and sold its assets to E*Trade Bank. Amicus FSB was formed in 1999 in the United States with Winn Dixie and Safeway Inc. under the Marketplace Bank and Safeway Select Bank brands. In the same year, CIBC signed a 10-year agreement with TSYS of Columbus, Georgia to outsource credit card processing operations.\n\nIn 2004, the bank sold Juniper Financial Corporation to Barclays Bank. Juniper Financial was previously acquired by CIBC in 2001. The bank sold EDULINX Canada Corporation to Nelnet Canada Inc., the Canadian unit of Nelnet, Inc., in late 2004. Li Ka Shing was the largest foreign shareholder in the bank for over two decades, but in early 2005 he sold his portion (est. CA$1.2 billion) to establish a Canadian charity, the Li Ka Shing Foundation. CIBC was Li's choice for financing many of his Canadian ventures, like Husky Energy. Li had reportedly backed personal and commercial banking head Holger Kluge to succeed Al Flood as CEO of CIBC in 1999.\n\nCIBC sold its corporate and purchasing credit card business to U.S. Bank Canada in October 2006 which joined it with business charge cards it previously acquired from Royal Bank of Canada. In the same year, CIBC's stock ticker symbol on the New York Stock Exchange changed from BCM to CM to bring it in line with the ticker symbol on the Toronto Stock Exchange.\n\nIn December 2006, CIBC acquired majority control of its publicly held joint venture FirstCaribbean International Bank for just over US$ 1 billion, (Bds$ 2 billion), when it purchased the 43.7% stake owned by Barclays Bank. CIBC rebranded the division CIBC FirstCaribbean International Bank in 2011.\n\nOn February 12, 2009, the Trinidad and Tobago Express reported that CIBC was pursuing discussions to buy CL Financial 's stake in the Republic Bank of Trinidad and Tobago. As part of a \"bail out\" agreement of CL Financial by the government of Trinidad and Tobago during the 2008 financial crisis, the corporation was required to sell Republic and other assets. As of February 2011, CL Financial had yet to agree to a sale.\n\nIn February, 2010 CIBC became the first chartered bank in Canada to launch a mobile banking iPhone App. It surpassed 100,000 downloads in just over one month following launch, with over 1 million client logins to CIBC Mobile Banking since its introduction. Four months later, the bank announced it signed a deal to buy a CA$2.1-billion credit card portfolio from Citigroup 's Citibank Canada MasterCard business. Finally in October of that year, CIBC announced that it would be the first bank in Canada to introduce the internationally used Visa-branded debit card.\n\nIn April 2013, CIBC reached an agreement with Invesco to acquire Atlantic Trust, the company's wealth management unit for US$210 million.\n\nCIBC announced in June 2016 that it would acquire the Chicago-based commercial bank PrivateBancorp for US$3.8 billion. The sale completed in June 2017 and in August PrivateBank announced it would rebrand itself as CIBC Bank USA.\n\nIn April 2017, CIBC, announced it would move its headquarters to the Bay Park Centre under development by Hines Interests Limited Partnership and Ivanhoé Cambridge. Under the terms of its lease, the complex became CIBC Square. On November 1, 2021, CIBC Square became the bank's principal headquarters.\n\nIn November 2018, CBC reported that CIBC was among the top brands used in phishing attacks, with the bank seeing a surge in fake mail attempts that prior quarter by 600%. In March 2025, CIBC became the first major Canadian bank to sign the Canadian government's voluntary code of conduct for generative artificial intelligence. The year prior, CIBC had introduced a number of generative AI pilot programs.\n\nIn 2025, CIBC signaled a strategic shift under incoming CEO Harry Culham, with plans to expand its presence in high-margin areas such as wealth management and U.S. commercial banking.\n\nIn Q3 2025, CIBC reported adjusted net income of C$2.1 billion.\n\nIn 2000, CIBC signed an agreement with the New York-based Aplettix Inc., a firm specializing in secure transaction systems in the banking sector; although the partnership was later abandoned for alternatives such as VeriSign.\n\nThe early 2000s saw the bank divest from its real estate and investments outside of its business strategy. In 2000, CIBC sold its 10 per cent stake to Rogers Media. CIBC was a minority shareholder in Major League Baseball 's Toronto Blue Jays, with partner Labatt's Breweries from their inception in 1977. The CIBC Leadership Centre in King City, was sold to Benchmark Hospitality in 2001. In 2002, CIBC disbanded Amicus FSB, and sold its assets to E*Trade Bank. Amicus FSB was formed in 1999 in the United States with Winn Dixie and Safeway Inc. under the Marketplace Bank and Safeway Select Bank brands. In the same year, CIBC signed a 10-year agreement with TSYS of Columbus, Georgia to outsource credit card processing operations.\n\nIn 2004, the bank sold Juniper Financial Corporation to Barclays Bank. Juniper Financial was previously acquired by CIBC in 2001. The bank sold EDULINX Canada Corporation to Nelnet Canada Inc., the Canadian unit of Nelnet, Inc., in late 2004. Li Ka Shing was the largest foreign shareholder in the bank for over two decades, but in early 2005 he sold his portion (est. CA$1.2 billion) to establish a Canadian charity, the Li Ka Shing Foundation. CIBC was Li's choice for financing many of his Canadian ventures, like Husky Energy. Li had reportedly backed personal and commercial banking head Holger Kluge to succeed Al Flood as CEO of CIBC in 1999.\n\nCIBC sold its corporate and purchasing credit card business to U.S. Bank Canada in October 2006 which joined it with business charge cards it previously acquired from Royal Bank of Canada. In the same year, CIBC's stock ticker symbol on the New York Stock Exchange changed from BCM to CM to bring it in line with the ticker symbol on the Toronto Stock Exchange.\n\nIn December 2006, CIBC acquired majority control of its publicly held joint venture FirstCaribbean International Bank for just over US$ 1 billion, (Bds$ 2 billion), when it purchased the 43.7% stake owned by Barclays Bank. CIBC rebranded the division CIBC FirstCaribbean Inte  as CIBC Bank USA.\n\nIn April 2017, CIBC, announced it would move its headquarters to the Bay Park Centre under development by Hines Interests Limited Partnership and Ivanhoé Cambridge. Under the terms of its lease, the complex became CIBC Square. On November 1, 2021, CIBC Square became the bank's principal headquarters.\n\nIn November 2018, CBC reported that CIBC was among the top brands used in phishing attacks, with the bank seeing a surge in fake mail attempts that prior quarter by 600%. In March 2025, CIBC became the first major Canadian bank to sign the Canadian government's voluntary code of conduct for generative artificial intelligence. The year prior, CIBC had introduced a number of generative AI pilot programs.\n\nIn 2025, CIBC signaled a strategic shift under incoming CEO Harry Culham, with plans to expand its presence in high-margin areas such as wealth management and U.S. commercial banking.\n\nIn Q3 2025, CIBC reported adjusted net income of C$2.1 billion."}, {"id": "vc015", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The bank expanded within Rhode Island by opening a total of 29 branches in the state.[d719464s1p0] The bank later expanded geographically by beginning operations in Massachusetts in 1986.[d719464s1p0]", "ev": "Citizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.\n\nIn 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986.\n\nCitizens was established in 1828 as the High Street Bank in Providence, Rhode Island. In 1871, the Rhode Island legislature gave a second charter to establish the Citizens Savings Bank which eventually acquired its parent group to form Citizens Trust Company. The bank then expanded through Rhode Island, opening a total of 29 branches in that state. It established Citizens Financial Group as a holding company when the bank acquired The Greenville Trust Company in 1954.\n\nIn 1985, Citizens changed status from a mutual savings bank to a federal stock savings bank. Expansion into other states began with Massachusetts in 1986."}, {"id": "vc016", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "He incorporated multiple triple Axels into free programs, including two triple Axels in his clean free skate at the 2016 World Championships [d9069082s10p0].", "ev": "During the 2015–16 Grand Prix series, Fernández won gold at both of his events, the 2015 Cup of China and 2015 Rostelecom Cup, and qualified for the 2015–16 Grand Prix Final in Barcelona. Second to Hanyu in both segments in Barcelona, he won silver in the Grand Prix Final for the second year in a row. In the free program, he landed his three planned quadruple jumps and scored 201.43 points, becoming the second skater in history to receive over 200 points in this segment.\n\nFernández defended his national title at the Spanish Championships in December 2015, attempting and completing two quadruple jumps in the short program for the first time in his career (a quad toe loop in combination with a triple toe loop, and a quad Salchow).\n\nAt the 2016 European Championships in Bratislava, Fernández successfully landed a quad toe loop-triple toe loop combination, quad Salchow, and triple Axel to score a new personal best of 102.54 points in the short program. With this score, he became only the second man in history to break 100 points in that segment. With a 14-point advantage going into the free skate, Fernández landed three quadruple jumps, but fell on the second triple Axel of the program (which he had just added). He scored 200.23 points, for a combined total of 302.77, becoming the second skater in history to cross the 300 point mark. He finished ahead of silver medalist Oleksii Bychenko by a margin of over 60 points.\n\nEntering the 2016 World Championships in Boston as the defending champion, Fernández opened his short program with a quad toe loop-triple toe loop combination, then fell on his quad Salchow attempt, but recovered to complete a triple Axel, two level-four spins and level-four footwork, scoring 98.52 points and securing second place. After the short program, he could do little practice due to a recurring bursa on the heel of his right foot. On the day of the free skate, the medical team of the event attended to his injury for several hours and helped him to alleviate the problem. Fernández entered the free skate segment with a 12.04 deficit behind Yuzuru Hanyu – the largest point gap at the time between first and second place after the short program in any discipline at a World Championships or Olympic Games under the ISU judging system. Fernández completed a clean free skate, which included three quads (a toe loop and two Salchows, one in combination with a triple toe loop), two triple Axels, four more triples as well as difficult spins and level-four footwork, and scored 216.41, surpassing his personal best in the segment by 14.98 points. He reached a total score of 314.93, also a new personal best. His free skating and total scores were the second and third highest, respectively, under the ISU judging system as of the event. Hanyu made mistakes in his free skate, allowing Fernández to close the point gap and overtake him by a further 19.76 points to become the 2016 World champion.\n\nAccording to a May 2016 news article, Fernández's income from shows is greate 때만. 근거 부족은 불지지.", "claim": "An anime film adaptation of Sunny was announced in April 2025 and is being produced by Dwarf Studios with a slated completion in 2029 [d43449646s0p0].", "ev": "Sunny is a Japanese manga series written and illustrated by Taiyō Matsumoto. It was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 2010 to September 2014, when the magazine ceased publication. It was later transferred to Monthly Big Comic Spirits, being serialized from January to July 2015. Its chapters were collected in six wide-ban volumes. The manga was licensed for English release in North America by Viz Media. In April 2025, an anime film adaptation produced by Dwarf Studios was announced, which is slated for completion in 2029.\n\nSunny won the 61st Shogakukan Manga Award in the general category in 2016 and received an Excellence Award at the 20th Japan Media Arts Festival in 2017."}, {"id": "vc018", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The Northern Province had a population of 1,150,148 in 2024. [d23777640s5p0] The majority of the province's population are Sri Lankan Tamils. [d23777640s5p0] The province contains sizeable Sri Lankan Moor and Sinhalese minorities. [d23777640s5p0]", "ev": "The population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.\n\nThe population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\nThe population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.\n\nThe population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war.\n\nThe population of the northern province was 1,150,148 in 2024. The majority of the population are Sri Lankan Tamil, with sizeable Sri Lankan Moor and Sinhalese minorities.\n\nThe population of the province, like that of the Eastern Province, was heavily affected by the civil war. The war killed an estimated 100,000 people. Several hundred thousand Sri Lankan Tamils, possibly as much as one million, emigrated to Western countries during the war. Many Sri Lankan Tamils also moved to the relative safety of the capital city Colombo. Most of the Sri Lankan Moors and Sinhalese who lived in the province fled to other parts of Sri Lanka, though most of them have returned to the province since the end of the civil war."}, {"id": "vc019", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The West Africa Cricket Council lost significance in 2000 when Nigeria applied for separate membership of the ICC.[d6868247s2p0] The West Africa Cricket Council was disbanded in 2003 after its members became ICC members in 2002.[d6868247s2p0]", "ev": "A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member.\n\nA Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member."}, {"id": "vc020", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "County Championship cricket and the Women's Twenty20 Cup have been part of the domestic structure supporting players [d61409827s2p0].", "ev": "Villiers began playing age group cricket for Essex in 2012 before making her first-team debut in 2013, in a County Championship match against Yorkshire. She did not bowl in the match, and made 1 run batting at number 11. She made her Twenty20 debut later that season, against Sussex, and went on to play four games in the 2013 Women's Twenty20 Cup.\n\n2015 was a breakthrough season for Villiers, taking 8 wickets at 14.87 in the County Championship and 12 wickets at 6.66 in the Twenty20 Cup. She thereafter became a regular in Essex's side, and in 2018 was selected as part of the Surrey Stars squad for the 2018 Women's Cricket Super League. She played 11 matches in the season, taking 5 wickets at an average of 18.00. Her standout performance came in the final, when she took 3/22 to help her side win their first KSL. Villiers returned to play for the Stars the following season, where she took 5 wickets in 7 matches.\n\nIn 2020, Villiers joined the Sunrisers for the Rachael Heyhoe Flint Trophy. She played 2 games, picking up one wicket as well as scoring 64 against Southern Vipers. In 2021, she took five wickets in the Rachael Heyhoe Flint Trophy, as well as one in the Charlotte Edwards Cup. She also played for Oval Invincibles in The Hundred, scoring 51 runs and taking 6 wickets as the side won the competition. She played eleven matches for Sunrisers in 2022, across the Charlotte Edwards Cup and the Rachael Heyhoe Flint Trophy, and wa harlotte Edwards Cup. She also played for Oval Invincibles in The Hundred, scoring 51 runs and taking 6 wickets as the side won the competition. She played eleven matches for Sunrisers in 2022, across the Charlotte Edwards Cup and the Rachael Heyhoe Flint Trophy, and was the joint-second leading wicket-taker across the whole Rachael Heyhoe Flint Trophy, with 12 wickets at an average of 21.83. She also took six wickets for Oval Invincibles in The Hundred as the side won their second title.\n\nIn 2023, she was Sunrisers' leading wicket-taker in the Charlotte Edwards Cup, with 10 wickets at an average of 15.90. She also scored two half-centuries and took 12 wickets in the Rachael Heyhoe Flint Trophy. She also played seven matches for Oval Invincibles in The Hundred.\n\nIn September 2024 Villiers signed a three-year contract with Durham to play in the new domestic county competitions from 2025."}, {"id": "vc021", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Ollie Lord is a professional Australian rules footballer playing for the Port Adelaide Football Club in the Australian Football League (AFL). [d80714408s0p0] He was born on 2 January 2002. [d80714408s0p0]", "ev": "Ollie Lord (born 2 January 2002) is a professional Australian rules footballer playing for the Port Adelaide Football Club in the Australian Football League (AFL). Standing at 197cm tall, he mostly plays as a key forward but can also play as a ruckman.\n\nOllie Lord (born 2 January 2002) is a professional Australian rules footballer playing for the Port Adelaide Football Club in the Australian Football League (AFL). Standing at 197cm tall, he mostly plays as a key forward but can also play as a ruckman."}, {"id": "vc022", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Ollie Lord represents the Port Adelaide Football Club in the AFL. [d80714408s0p0] He mostly plays as a key forward. [d80714408s0p0]", "ev": "Ollie Lord (born 2 January 2002) is a professional Australian rules footballer playing for the Port Adelaide Football Club in the Australian Football League (AFL). Standing at 197cm tall, he mostly plays as a key forward but can also play as a ruckman.\n\nOllie Lord (born 2 January 2002) is a professional Australian rules footballer playing for the Port Adelaide Football Club in the Australian Football League (AFL). Standing at 197cm tall, he mostly plays as a key forward but can also play as a ruckman."}, {"id": "vc023", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Johnson engaged in theatrical on-field interactions, such as throwing over Larry Walker's head in the 1997 All-Star Game, which highlighted contentious or showmanlike exchanges with opponents [d386384s7p0].", "ev": "In the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nJohnson was sidelined throughout much of the 1996 season with a back injury but rebounded in 1997 with a 20–4 record, 291 strikeouts, and a 2.28 ERA (his personal best). Between May 1994 and October 1997, Johnson went 53–9, including a 16–0 streak that fell one short of the AL record. Johnson had two 19-strikeout starts in 1997, on June 24 and August 8.\n\nAnother colorful All-Star Game moment proceeded in 1997 involving former Expos teammate Larry Walker, then with the Colorado Rockies. When Johnson started a game against the Rockies on June 12, Walker chose not to play, explaining that \"I faced Randy one time in spring training and he almost killed me.\" In the All-Star Game, Walker batted against Johnson, who theatrically threw over his head. Ever adaptable, Walker placed his batting helmet backwards and switched sides in the batters' box to stand right-handed for one pitch. He ended the plate appearance by drawing a walk. The incident momentarily drew mirth and laughter from players in both dugouts, fans, and announcers as well as comparisons to the at bat with Kruk in the 1993 All-Star Game. In spite of garnering a reputation of avoiding Johnson, Walker batted.393 in 28 at bats against him in his career, nearly double the rate of all left-handed batters at.199. When the 1998 season began, Johnson was upset the Mariners would not offer him a contract extension, given his contract was expiring after the season. Though the Mariners initially wanted to keep Johnson, turning down a trade offer from the Los Angeles Dodgers, they fell out of contention, going 8–20 in June. Minutes before the non-waiver trade deadline, on July 31, the Mariners traded Johnson to the Houston Astros for minor leaguers Freddy García, Carlos Guillén, and John Halama. Johnson was a Mariner for nearly nine years, his longest tenure with one team."}, {"id": "vc024", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "She won the gold medal in the mass start at the 2020 World Single Distances Speed Skating Championships in Salt Lake City, United States [d41597867s2p0].", "ev": "After results from the 2017–18 ISU Speed Skating World Cup, Blondin pre-qualified for the 2018 Winter Olympics in Pyeongchang, South Korea. She competed in the 3000 m, 5000 m, mass start, and team relay events.\n\nIn 2020, she won the mass start event gold medal at the 2020 World Single Distances Speed Skating Championships at the Utah Olympic Oval in Salt Lake City, United States. This was followed up with the silver medal at the World Allround Speed Skating Championships in March. She was the first Canadian woman to reach the overall podium at that event since 2012 and only the fifth since the event started in 1936.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event."}, {"id": "vc025", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Andrews was eighth after the short program at the 2026 Four Continents but dropped to fifteenth overall after the free skate [d53528369s12p0].", "ev": "In preparation for the season, Andrews recorded the vocals for the track, \"Turning Page,\" used for her free skate.\n\nAndrews opened her season by competing on the 2025–26 Challenger Series, –26 Challenger Series, placing seventh at the 2025 CS Nepela Memorial and twelfth at the 2025 CS Trialeti Trophy.\n\nIn November, Andrews announced that the 2025–26 figure skating season was her last as a singles skater and that she intended to switch disciplines and pursue pair skating beginning with the 2026–27 season. Selected as a host pick for 2025 Skate America, Andrews delivered two clean programs, earning a new personal best free skate and combined total score and placing fifth overall. She subsequently finished fifth at the 2025 CS Tallinn Trophy.\n\nAt the 2026 U.S. Championships in January, Andrews finished in seventh place and was subsequently named to the 2026 Four Continents team.\n\nAt the 2026 Four Continents, Starr finished 8th after the short program, ultimately dropping to 15th overall after the free skate.\n\nIn preparation for the season, Andrews recorded the vocals for the track, \"Turning Page,\" used for her free skate.\n\nAndrews opened her season by competing on the 2025–26 Challenger Series, placing seventh at the 2025 CS Nepela Memorial and twelfth at the 2025 CS Trialeti Trophy.\n\nIn November, Andrews announced that the 2025–26 figure skating season was her last as a singles skater and that she intended to switch disciplines and pursue pair skating beginning with the 2026–27 season. Selected as a host pick for 2025 Skate America, Andrews delivered two clean programs, earning a new personal best free skate and combined total score and placing fifth overall. She subsequently finished fifth at the 2025 CS Tallinn Trophy.\n\nAt the 2026 U.S. Championships in January, Andrews finished in seventh place and was subsequently named to the 2026 Four Continents team.\n\nAt the 2026 Four Continents, Starr finished 8th after the short program, ultimately dropping to 15th overall after the free skate."}, {"id": "vc026", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Riku Miura trained with Takeshi Honda in Japan and traveled to Canada two to three weeks at a time to work with Canadian pair coach Bruno Marcotte [d57879465s2p0].", "ev": "Miura began figure skating in 2011 and was a singles skater until the age of twelve when she decided to try pair skating after meeting Canadian pair skating coach, Bruno Marcotte, at a training seminar he was holding in Japan.\n\nMiura first teamed up with Shoya Ichihashi in 2015. The pair was coached by Takeshi Honda in Japan while also traveling to Canada two to three weeks at a time to work with Marcotte. Miura/Ichihashi would go on to compete at four ISU Championships. This included a tenth-place finish at the 2018 Four Continents Championships and at the 2018 World Junior Championships in Sofia, Bulgaria. Their partnership dissolved following the 2018–19 figure skating season."}, {"id": "vc027", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The province includes the administrative districts of Jaffna, Mannar, Mullaitivu and Vavuniya. [d23777640s1p0] The Vanni Electoral District covers the districts of Mannar, Mullaitivu and Vavuniya. [d5507600s0p0] The province is represented at national level by the Jaffna Electoral District and the Vanni Electoral District which together elect 15 members of parliament. [d23777640s6p0] Jaffna is a major urban centre in the province and hosts the University of Jaffna. [d23777640s13p0][d6033791s5p0]", "ev": "Parts of present-day Northern Province were part of the pre-colonial Jaffna kingdom. Other parts were ruled by Vanniar Chieftains who paid tribute to the Jaffna kingdom. The province then came under Portuguese, Dutch and British control. In 1815 the British gained control of the entire island of Ceylon. They divided the island into three ethnic based administrative structures: Low Country Sinhalese, Kandyan Sinhalese and Tamil. The Northern Province was part of the Tamil administration. In 1833, in accordance with the recommendations of the Colebrooke-Cameron Commission, the ethnic based administrative structures were unified into a single administration divided into five geographic provinces. The districts of Jaffna, Mannar, Nuvarakalaviya (present day Anuradhapura District) and Vanni formed the new Northern Province. Nuvarakalaviya was transferred to the newly created North Central Province in 1873.\n\nThe Indo-Lanka Accord signed on 29 July 1987 required the Sri Lankan government to devolve powers to the provinces and, in the interim, to merge the Northern and Eastern provinces into one administrative unit. The accord required a referendum to be held by 31 December 1988 in the Eastern Province to decide whether the merger should be permanent. Crucially, the accord allowed the Sri Lankan president to postpone the referendum at his discretion.\n\nOn 14 November 1987 the Sri Lankan Parliament passed the 13th Amendment to the 1978 Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987, establishing provincial councils. On September 2 and 8 1988 President Jayewardene issued proclamations enabling the Northern and Eastern provinces to be one administrative unit administered by one elected Council. The North Eastern Province was born.\n\nThe proclamations were only meant to be a temporary measure until a referendum was held in the Eastern Province on a permanent merger between the two provinces. However, the referendum was never held and successive Sri Lankan presidents issued proclamations annually extending the life of the \"temporary\" entity.\n\nThe merger was bitterly opposed by Sinhalese nationalists. The new province made up about one fourth of the total area of Sri Lanka. The thought of the rebel Liberation Tigers of Tamil Eelam controlling this province, directly or indirectly, alarmed them greatly. On 14 July 2006, after a long campaign against the merger, the Janatha Vimukthi Peramuna political party filed three separate petitions with the Supreme Court requesting a separate provincial council for the East. On 16 October 2006 the Supreme Court ruled that the proclamations issued by President Jayewardene were null and void and had no legal effect. The North Eastern Province was formally de-merged into the Northern and Eastern provinces on 1 January 2007.\n\nMuch of the Northern Province was under the control of rebel Liberation Tigers of Tamil Eelam for many years during the civil war. The province was fully recaptured by the Sri Lankan military in 2009 with the Battle of Mullaitivu.\n\nWhile the Northern province has seen an era of peace after the end of the war, the scars left by the war still remain. Despite the large amount of infrastructure projects undertaken by the Mahinda Rajapaksa government, at the cost of over $3 billion, the projects have been unable to create new jobs and as a result the province suffers from extreme levels of unemployment.\n\nIn late 2014, then-incumbent President Mahinda Rajapaksa imposed a travel ban to prevent foreigners from traveling to the former war zone in the province. The ban was lifted three months later by the newly elected president Maithripala Sirisena.\n\nVanni Electoral District (Tamil: வன்னி தேர்தல் மாவட்டம்) is one of the 22 multi-member electoral districts of Sri Lanka created by the 1978 Constitution of Sri Lanka. The district covers the administrative districts of Mannar, Mullaitivu and Vavuniya in the Northern province. The district currently elects 6 of the 225 members of the Sri Lankan Parliament and had 253,058 registered electors in 2014. The district is Sri Lanka's Electorate Number 11.\n\nFirst elected representation at provincial level to a legislative came about after the Second Manning Reforms of the Legislative Council of Ceylon which assigned a seat to the Northern Province. With universal adult suffrage been enabled through the Donoughmore Constitution, representatives from the province were elected to parliament. Currently Two Electoral Districts, namely Jaffna Electoral District and Vanni Electoral District which elects 15 of the 225 members of the Sri Lankan Parliament.\n\nThe Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\nThe Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.\n\nSince 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.\n\nThe expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.\n\nSri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing."}, {"id": "vc028", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "S-200 air-defense sites and equipment were found in a state of disrepair after being overrun, indicating maintenance and operational degradation under combat conditions [d1380590s8p0].", "ev": "Starting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed t treat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on th group's funds management platform, master funds, superannuation, insurance and financial advice business support. [d575530s16p0] Colonial First State, Colonial First State Global Asset Management and CommInsure formed part of Wealth Management. [d575530s16p0] The bank was granted MySuper authority, enabling it to continue to receive default superannuation contributions from 1 January 2014. [d575530s16p0]", "ev": "Wealth Management brings together the Groups funds management platform, master funds, superannuation, insurance and financial advice business support. Colonial First State, Colonial First State Global Asset Management and CommInsure all form part of Wealth Management. CBA has been granted a MySuper authority, enabling it to continue to receive default superannuation contribution from 1 January 2014.\n\nWealth Management brings together the Groups funds management platform, master funds, superannuation, insurance and financial advice business support. Colonial First State, Colonial First State Global Asset Management and CommInsure all form part of Wealth Management. CBA has been granted a MySuper authority, enabling it to continue to receive default superannuation contribution from 1 January 2014.\n\nWealth Management brings together the Groups funds management platform, master funds, superannuation, insurance and financial advice business support. Colonial First State, Colonial First State Global Asset Management and CommInsure all form part of Wealth Management. CBA has been granted a MySuper authority, enabling it to continue to receive default superannuation contribution from 1 January 2014."}, {"id": "vc030", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Railway reconstruction and the reopening of Jaffna International Airport improved transport connectivity to and within the Northern Province [d23777640s11p0][d23777640s12p0].", "ev": "The Northern Province has one university, the University of Jaffna which became independent in 1979, previously having been a campus of the University of Sri Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\nThe Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.\n\nSince 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.\n\nThe expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.\n\nSri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\nSri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.\n\nMost of the railways were developed during the British colonial period.\n\nThe railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\nAirways and airports are underdeveloped in this province. Jaffna International Airport is the primary airport in the province, once an international airport that had regular passenger flight service to Colombo and Tiruchirappalli, India. It had been under the control of the Sri Lanka Navy and now has been turned into an international airport again with the help of India. Daily flights between Colombo and Chennai, India and Jaffna are available. There are a few small airports and airstrips in Vavuniya and Iranamadu."}, {"id": "vc031", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Sunny's serialization was affected by the suspension of Monthly Ikki, causing the series to be transferred to Monthly Big Comic Spirits [d43449646s3p0].", "ev": "Written and illustrated by Taiyō Matsumoto, Sunny was serialized in Shogakukan 's seinen manga magazine Monthly Ikki from December 25, 2010, until September 25, 2014, when Ikki suspended its publication. The manga was later transferred to Monthly Big Comic Spirits and serialized from January 27 to July 27, 2015. Shogakukan collected its chapters in six wide-ban volumes, released from August 30, 2011, to October 30, 2015.\n\nThe manga has been licensed for English-language release by Viz Media in 2012. The six volumes were released from May 21, 2013, to November 15, 2016."}, {"id": "vc032", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Speed skate boots are cut low around or below the ankle bones to allow deep dorsiflexion and free flexing of the foot [d80357330s5p0].", "ev": "Speed skates (or race skates) are purpose-built inline skates with a single goal: speed. To this end, speed skates need to enable a racer to generate the most efficient strides and to glide with the least amount of friction. The distance for a race ranges from a few hundred meters to 100 kilometers. And a race may take place indoors on tracks, or outdoors on paved roads. World records for outdoor races exceed 27 miles per hour. For instance, Joey Mantia holds the world record for the outdoor 10-kilometers race from 2009, at 13 minutes and 46.801 seconds.: 3–9, 283–318\n\nSpeed skating differs from other inline disciplines in that a speed skater tilts her body trunk forward for up to 60° when racing, positioning her head far ahead of the skates in order to reduce her body profile with respect to air resistance. A speed skater bends her knees aggressively for up to 80° in a deep-seated squatting position, much more than other disciplines. Such body configuration requires a deep forward leaning of the shin (dorsiflexion) for proper balance. This deep squatting posture produces the most powerful push-offs, with the farthest displacement of the pushing skate.: 5–11\n\nBecause of the need for a deep dorsiflexion, speed skates have no eyelets, buckles, or straps above middle eyelets at 45° angle which is the minimum requirement for proper heel lock. Indeed, speed skates have no shafts and cuffs commonly found in other inline skates. In order for racers to freely flex their foot around ankle bones, speed boots are cut the lowest among all inline skates, around or below the ankle bones.: 17, 34–36 : 308–311\n\nA skater compensates for the lack of lateral ankle support from boots by strengthening muscle support for proper ankle movements such as dorsiflexion, pronation and supination, which are essential for double push strides with aggressive push-offs and precise transitions from outside to inside edges. The removal of shaft and cuff significantly reduces a boot's weight, a key advantage to a skater in a game where a saving of fractional seconds makes a difference.: 75–83 : 3–30, 308–311\n\nA speed skate boot is close-fitting, without much padding, and usually made of leather, carbon fiber, or other strong and lightweight composite materials. For best performance, the boot must conform closely to the shape of the foot to prevent it from moving inside the boot. Thus, most boots are custom-fitted or else heat-moldable.\n\nThe frame may be made of aircraft-quality aluminum, magnesium, or possibly lightweight carbon fiber. All frames flex during skating. A stiff frame flexes very little, so it transmits power from the foot to the wheels more directly. A shorter frame navigates tight curves at smaller tracks better but may become wobbly at high speeds. A longer frame provides stable tracking at high speed and increased power transfer, useful for long-distance events.: 311–314 : 18–20\n\nThe length and height of a frame determine the number and size of wheels it can accommodate. More wheels and bigger wheels increase mass, making acceleration harder and slower. But once rolling at speed, a skater can more easily maintain top speed given the rotational inertia. In the 1990s, speed skaters preferred a frame with five wheels, usually 80 mm in diameter (i.e. 5x80mm). In the 21st century, wheel size ranges from 90 mm to 125 mm. A setup with four 110 mm wheels (4x110mm) is typical for competitive speed skating, and three 125 mm wheels (3x125mm) for marathon skates at marathon events.: 311–314 : 22, 24, 34–36\n\nSpeed skates generally adopt either the 165mm or the 195mm mounting standard for securing a frame to a boot. Short speed frames for short track racing use the 165mm standard, while long frames for marathon use the 195mm standard in order to better accommodate larger wheels. Both of these 2-point mounting standards feature a built-in heel lift that pitches a skater forward, creating forward flex.\n\nSpeed skating generally adopts harder wheels than other disciplines. Harder wheels minimize energy lost to elastic hysteresis when a skater's weight deforms wheels upon ground contact. Speed skaters prefer wheels with high rebound, which returns the compression energy back to the skater. Speed wheels have a pointy bullet profile that reduces friction from drags, when a skate glides and its wheels touch the road upright. The elliptical contour of the bullet profile, however, affords greater contact surface for improved traction and control, when a skate is inclined on an edge during push-offs.: 18–19 : 51–52 : 315–316 : 24–26\n\nSpeed skaters pay close attention to the quality of ball bearings and their periodic maintenance. High-quality bearings with precision ratings are the minimum requirement. Regular cleaning and lubrication of these bearings remove trapped dirt and restore them to their optimal performance, which is essential in the pursuit of ultimate speed.: 128–130\  The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of var
