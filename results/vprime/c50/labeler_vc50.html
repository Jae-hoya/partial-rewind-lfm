.", "claim": "Ghana (as a member of the West Africa Cricket Council) played only as part of the combined West African team which made its international debut at the 1982 ICC Trophy [d6868247s2p0].", "ev": "A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member."}, {"id": "vc035", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "His signature and most effective strikeout pitch was his slider, which had tight late break and velocity in the low 90s that often made hitters think it was a fastball until it broke at the plate [d386384s16p0].", "ev": "In the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\nIn the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.\n\nIn a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said."}, {"id": "vc036", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "She won the mass start gold at the 2020 World Single Distances Speed Skating Championships and won the silver overall at the 2020 World Allround Speed Skating Championships [d41597867s2p0].", "ev": "After results from the 2017–18 ISU Speed Skating World Cup, Blondin pre-qualified for the 2018 Winter Olympics in Pyeongchang, South Korea. She competed in the 3000 m, 5000 m, mass start, and team relay events.\n\nIn 2020, she won the mass start event gold medal at the 2020 World Single Distances Speed Skating Championships at the Utah Olympic Oval in Salt Lake City, United States. This was followed up with the silver medal at the World Allround Speed Skating Championships in March. She was the first Canadian woman to reach the overall podium at that event since 2012 and only the fifth since the event started in 1936.\n\nAfter results from the 2017–18 ISU Speed Skating World Cup, Blondin pre-qualified for the 2018 Winter Olympics in Pyeongchang, South Korea. She competed in the 3000 m, 5000 m, mass start, and team relay events.\n\nIn 2020, she won the mass start event gold medal at the 2020 World Single Distances Speed Skating Championships at the Utah Olympic Oval in Salt Lake City, United States. This was followed up with the silver medal at the World Allround Speed Skating Championships in March. She was the first Canadian woman to reach the overall podium at that event since 2012 and only the fifth since the event started in 1936.\n\nAfter results from the 2017–18 ISU Speed Skating World Cup, Blondin pre-qualified for the 2018 Winter Olympics in Pyeongchang, South Korea. She competed in the 3000 m, 5000 m, mass start, and team relay events.\n\nIn 2020, she won the mass start event gold medal at the 2020 World Single Distances Speed Skating Championships at the Utah Olympic Oval in Salt Lake City, United States. This was followed up with the silver medal at the World Allround Speed Skating Championships in March. She was the first Canadian woman to reach the overall podium at that event since 2012 and only the fifth since the event started in 1936.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event."}, {"id": "vc037", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Cricket was played in the Gold Coast from at least May 1904, when a team representing the Gold Coast played against Lagos Colony [d6868247s1p0].", "ev": "CricketArchive records a team representing the Gold Coast, a British colony, as having played its first match in May 1904, against Lagos Colony (in present-day Nigeria). Similar fixtures were played in the following two seasons, with the venue alternating between Lagos and Accra. A team representing the Southern Nigeria Protectorate toured in April 1907. Similar matches were played again in 1911, 1912, and 1913, with the host alternating each year. Although the sport had been introduced by British settlers, representative teams were multiracial from an early stage – the 1912 Gold Coast–Southern Nigeria fixture, the only pre-war match for which a scorecard is available, featured names like Otoo, Sagoe, Agbokpo, and Akufo (for Gold Coast), and Layode and Oseni (for Southern Nigeria). Gold Coast's Otoo took six wickets in Southern Nigeria's second innings, helping Gold Coast to an innings victory. However, European-only matches were introduced around the same time, beginning in 1906 and ending only in 1956, the year before Ghanaian independence. The Gold Coast's leading run-scorer in the inaugural European-only fixture was Gordon Guggisberg, who had earlier played a single first-class match (and was later Governor of the Gold Coast, from 1919 to 1927).\n\nAfter a long gap, inter-colonial matches resumed in April 1926, when the Gold Coast played the Nigerian national team in Lagos. Gold Coast–Nigeria fixtures, both multiracial and European-only, were played almost annually from 1926 to 1939, and resumed again after World War II. In several years the European-only fixtures were played in provincial cities like Kumasi and Ibadan, although multiracial games were played only in the capitals. Gold Coast sides were occasionally bolstered by players of first-class standard – for instance, Cecil Pullan (Oxford University and Worcestershire) and Michael Green (Gloucestershire and Essex) appeared together in a 1937 match, with Pullan appearing again after the war. The national side played its first match as \"Ghana\" less than a month after Kwame Nkrumah 's independence declaration in March 1957, with annual Ghana–Nigeria matches occurring until 1964."}, {"id": "vc038", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Julius Genachowski was identified and later confirmed as President-Elect Obama's choice to head the FCC, signaling leadership change at the regulator [d20095123s3p0].", "ev": "In the second half of 2006, groups such as the National Hispanic Media Coalition, the National Latino Media Council, the National Association of Hispanic Journalists, the National Institute for Latino Policy, the League of United Latin American Citizens (LULAC) and others held town hall meetings in California, New York and Texas on media diversity as its effects Latinos and minority communities. They documented widespread and deeply felt community concerns about the negative effects of media concentration and consolidation on racial-ethnic diversity in staffing and programming. At these Latino town hall meetings, the issue of the FCC's lax monitoring of obscene and pornographic material in Spanish-language radio and the lack of racial and national-origin diversity among Latino staff in Spanish-language television were other major themes.\n\nPresident Barack Obama appointed Mark Lloyd to the FCC in the newly created post of associate general counsel/chief diversity officer.\n\nIn the second half of 2006, groups such as the National Hispanic Media Coalition, the National Latino Media Council, the National Association of Hispanic Journalists, the National Institute for Latino Policy, the League of United Latin American Citizens (LULAC) and others held town hall meetings in California, New York and Texas on media diversity as its effects Latinos and minority communities. They documented widespread and deeply felt community concerns about the negative effects of media concentration and consolidation on racial-ethnic diversity in staffing and programming. At these Latino town hall meetings, the issue of the FCC's lax monitoring of obscene and pornographic material in Spanish-language radio and the lack of racial and national-origin diversity among Latino staff in Spanish-language television were other major themes.\n\nPresident Barack Obama appointed Mark Lloyd to the FCC in the newly created post of associate general counsel/chief diversity officer.\n\nFor Senator Barack Obama's 2008 Presidential Campaign, Genachowski was Chairperson of the Technology, Media and Telecommunications Policy Working Group, which created the Obama Technology and Innovation Plan. He also advised and guided the Campaign's innovative use of technology and the Internet for grassroots engagement and participation.\n\nAfter the November election, he co-led the Technology, Innovation, and Government Reform Group for President-Elect Obama 's Transition Team. On January 12, 2009, several news outlets reported that Genachowski would be President-Elect Obama's choice to head the FCC. This was confirmed by a press release on March 3, 2009."}, {"id": "vc039", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Since April 2005 Zero1 held yearly pay-per-view events at the Yasukuni Shrine.[d1100501s1p0] The promotion operated its own dojo referred to as the \"Takeshiba Coliseum.\"[d1100501s1p0] In plans announced in 2020 the promotion aimed to hold a show at the Ryōgoku Kokugikan on April 13, 2021 and to make Ryōgoku Kokugikan shows an annual goal.[d1100501s2p0]", "ev": "The promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.\n\nIn its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".\n\nOn November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.\n\nSince April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.\n\nOn September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\nThe promotion was founded by former New Japan Pro-Wrestling (NJPW) star Shinya Hashimoto who was quickly joined by Shinjiro Otani. In 2000, Hashimoto proposed an independent promotion within NJPW called \"New Japan Pro-Wrestling Zero\", but the idea was shot down. When Hashimoto was fired by NJPW in November 2000, he registered the Pro Wrestling Zero-One name.\n\nIn its early years, Zero1 had working agreements with Pro Wrestling Noah (Noah), All Japan Pro Wrestling (AJPW), NJPW, Riki Pro, Hustle, Big Mouth Loud, King's Road, and Dragondoor. These agreements enabled Zero1 wrestlers to challenge for and hold the other promotions' titles. The promotion also operated their own dojo, which was referred to as the \"Takeshiba Coliseum\".\n\nOn November 30, 2004, Shinya Hashimoto gave up ownership of the promotion, telling the press that due to financial problems he had decided to step away from the company. A new parent company \"First On Stage\" was formed consisting of president Yoshiyuki Nakamura, ring announcer Oki Okidata, Shinjiro Otani and a company named Baltic Curry. First On Stage renamed the promotion to Pro Wrestling Zero1-Max, with Otani and Nakamura taking over the promotion's general operations. Among other major changes made to the promotion's structure was the decision to join AWA Superstars of Wrestling (AWA) as the alliance's only Japanese member. Due to their new affiliation with the AWA, the promotion's previous National Wrestling Alliance (NWA) affiliation was given to rival promotion NJPW.\n\nSince April 2005, Zero1 has held yearly pay-per-view events at the Yasukuni Shrine, which is controversial for its relation to World War II. Larger Japanese wrestling promotions like NJPW, AJPW, and Noah have traditionally stayed away from such venues due to their controversial nature.\n\nOn September 12, 2006, Zero1-Max joined 12 other wrestling companies to form the Global Professional Wrestling Alliance (GPWA), a professional wrestling alliance that intended to \"foster an environment of cooperation rather than competition.\" The alliance planned to hold occasional \"Super Shows\" where all member promotions would send wrestlers to compete under the GPWA banner. Noah's CEO Mitsuharu Misawa was inaugurated as the first chairman of the GPWA, while Zero1-Max's Yoshiyuki Nakamura was announced as the alliance's president. The GPWA would later fold in 2009.\n\nIn 2008, the promotion shortened its name to Pro Wrestling Zero1. In 2011, the promotion returned to the NWA as their Japanese territory. In March 2011, NWA presented Zero1 with the NWA Pan-Pacific Premium Heavyweight Championship in celebration of the promotion's tenth anniversary. In July, Daisuke Sekimoto won the Fire Festival to become the first NWA Pan-Pacific Premium Heavyweight champion. Later in 2011, Zero1 left the NWA, renaming their NWA-branded championships to \"New Wrestling Alliance\" championships.\n\nFollowing their 2011 departure from the NWA, Zero1 launched an American affiliate, Zero1 USA, taking over the promotion previously known as NWA Midwest. In 2012, an Australian division of Zero1, known as Zero1 Australia, opened in Adelaide taking over what was previously known as NWA Pro Australia; in 2014 the relationship between Zero1 and Zero1 Australia ended with the Australian-based promotion renaming to Wrestle Rampage. Later in 2012, the Zero1 Hong Kong and Zero1 Mexico branches opened. In 2013, Yoshiyuki Nakamura opened a new division of Zero1 in Belarus.\n\nOn December 17, 2013, Zero1 announced a corporate restructuring taking place at the start of the 2014.\n\nDuring a September 16, 2016 press conference, Dream On Stage was announced as Zero1's new parent company. Also announced was a partnership between Zero1 and Akebono 's Ōdō company. On May 22, 2017, Zero1 partnered with the United Wrestling Network to become the group's official Japanese affiliate. On July 3, 2018, it was announced that the promotion be undergoing a management change, with Yoshitaka Ono stepping down as the CEO. Katsumi Sasazaki would be appointed the representative director and president of the promotion, while Shinjiro Otani took on the chairman of the board position and Masato Tanaka and Kohei Sato split the vice-president role of the promotion.\n\nOn February 1, 2020, Zero1 president Kazuhiro Iwamoto announced that the ownership of the promotion would be transferred from the previous management company Dream On Stage to iFD. Iwamoto additionally announced a plan to reform the promotion, which would include holding a show in the Ryōgoku Kokugikan on April 13, 2021, as part of the promotion's 20th anniversary. A further goal would be holding a show in the Ryogoku Kokugikan annually, while also providing Zero1 wrestlers with fixed contracts and social security.\n\nDuring a hiatus caused by the COVID-19 pandemic, the promotion suffered from severe financial problems. Kazuhiro Iwamoto resigned from his position as president while wrestlers Tatsuhito Takaiwa, Ikuto Hidaka, and Kohei Sato all departed the promotion. In July 2020, it was announced that the company was acquired by Daiko Holdings Group. That same month, they hired former Frontier Martial-Arts Wrestling women's wrestler Megumi Kudo as their general manager.\n\nOn December 27, 2024, during a press conference, it was announced that the promotion was acquired by Studio Backdrop. It was additionally announced that Zero1 affiliate Tochigi Pro-Wrestling would begin operating independently of Zero1 and Masato Tanaka would launch Zero1 Hardcore, a Zero1 affiliate based on hardcore wrestling."}, {"id": "vc040", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Ghana was made an ICC affiliate member in 2003 following the disbanding of the West Africa Cricket Council [d6868247s2p0].", "ev": "A Marylebone Cricket Club (MCC) side toured West Africa during the 1975–76 season, and played two matches at Accra's Achimota School in January 1976 – one against an Accra side and one against the Ghanaian national side. The West Africa Cricket Council was formed later in 1976, with The Gambia and Sierra Leone joining Ghana and Nigeria as members. Consequently, with the exception of the quadrangular West African Championships, first held in 1976, Ghanaian cricketers played international matches only for the combined West African team, which made its international debut at the 1982 ICC Trophy. The West African side at the 1997 ICC Trophy was captained by Edinam Nutsugah, a Ghanaian. At that tournament, another Ghanaian, Daniel Vanderpuje-Orgle, took 5/31 against Israel, one of only four five-wicket hauls at the tournament. However, the West Africa Cricket Council lost significance in 2000, when Nigeria applied for separate membership of the ICC. The council was disbanded in 2003, with its members having become ICC members the previous year – Gambia, Ghana, and Sierra Leone were made affiliate members, and Nigeria an associate member."}, {"id": "vc041", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The baseline development was completed by around 1994 [d952206s1p0].", "ev": "Work on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by stroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since."}, {"id": "vc042", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The bank sold its controlling stake in Banque de Salonique to Yapı Kredi in 1969, leading to multiple subsequent renamings and ownership changes. [d68130333s2p1] İnterbank was taken over by the Savings Deposit Insurance Fund of Turkey in January 1999 and was liquidated during the 2001 Turkish economic crisis. [d68130333s2p1] Scalable Capital expanded from wealth management into brokerage starting in 2020 and launched the European Investor Exchange in December 2024. [d82707812s1p0]", "ev": "In Turkey, the bank's operations were comparatively unaffected during the second world war, thanks to the country's neutrality. The Banque de Salonique opened a new Istanbul branch in Osmanbey in 1958. (The Sultan Hammam branch, meanwhile, was relocated to Eminönü in 1955.): 265 In the 1960s, however, the CFAT lost its core Algerian and Tunisian operations (it renamed itself Société Centrale de Banque in 1963) and its Levantine footprint became increasingly difficult to maintain. It closed the Mersin branch in 1967, and in 1969 sold its controlling stake in Banque de Salonique to Yapı Kredi, which renamed it International Bank for Industry and Commerce (Turkish: Uluslararası Endüstri ve Ticaret Bankası).: 268 Yapı Kredi was then purchased by Çukurova Holding in 1975, and with it, the majority of the shares in Uluslararası. It changed name again to become İnterbank in 1990. In 1996 Çukurova sold its majority stake to Cavit Çağlar 's Nergis Holdings. Eventually İnterbank was taken over by the Savings Deposit Insurance Fund of Turkey in January 1999, and liquidated during the 2001 Turkish economic crisis.\n\nIn Turkey, the bank's operations were comparatively unaffected during the second world war, thanks to the country's neutrality. The Banque de Salonique opened a new Istanbul branch in Osmanbey in 1958. (The Sultan Hammam branch, meanwhile, was relocated to Eminönü in 1955.): 265 In the 1960s, however, the CFAT lost its core Algerian and Tunisian operations (it renamed itself Société Centrale de Banque in 1963) and its Levantine footprint became increasingly difficult to maintain. It closed the Mersin branch in 1967, and in 1969 sold its controlling stake in Banque de Salonique to Yapı Kredi, which renamed it International Bank for Industry and Commerce (Turkish: Uluslararası Endüstri ve Ticaret Bankası).: 268 Yapı Kredi was then purchased by Çukurova Holding in 1975, and with it, the majority of the shares in Uluslararası. It changed name again to become İnterbank in 1990. In 1996 Çukurova sold its majority stake to Cavit Çağlar 's Nergis Holdings. Eventually İnterbank was taken over by the Savings Deposit Insurance Fund of Turkey in January 1999, and liquidated during the 2001 Turkish economic crisis.\n\nScalable Capital was founded in Munich in 2014 by investment banker Erik Podzuweit, Florian Prucker, Adam French and Stefan Mittnik as a startup company.\n\nThe company launched in 2016 as a robo-advisor for automated wealth management and entered the UK market the same year. In 2017, Scalable Capital entered into a partnership with the German bank ING Germany to offer a fully digital investment service to the bank's retail customers. Bloomberg later linked the company's early growth in assets under management to its bank-partnership model, including its cooperation with ING Germany. In 2017, Scalable Capital had become one of the fastest-growing robo-advisors worldwide.\n\nBy May 2018, Bloomberg reported that the company had reached €1 billion in assets under management. and had over 30,000 customers. Starting in 2020, Scalable Capital expanded from wealth management and began offering brokerage.\n\nIn early 2021, the company closed its direct-to-consumer UK service to focus on the German market. At the time, Scalable was active in Germany and Austria and planned launches in France, Italy and Spain. In November 2021, it acquired the ETF information portal justETF.\n\nIn August 2022, the company announced that client assets had surpassed €10 billion. In April 2024, ETF Stream reported that client assets had reached €20 billion and that the customer base had grown to more than one million.\n\nIn December 2024, Scalable Capital and the Hanover Stock Exchange launched the European Investor Exchange (EIX), a new electronic trading venue for retail investors, as part of the company's broader effort to bring more trading and custody functions onto its own infrastructure rather than relying entirely on external partners. The move allowed Scalable to handle trading, clearing, settlement, and custody on one platform.\n\nIn February 2025, Scalable Capital began offering eligible retail investors in Germany access to a BlackRock private equity fund.\n\nDuring the market turmoil in April 2025, the company recorded record trading volumes and fee income, although the Financial Times reported that users also experienced access delays. BaFin later said that the technical disruptions affecting investment service providers in April 2025 had prompted additional supervisory attention to broker resilience.\n\nIn September 2025, the European Central Bank granted Scalable Capital a full banking license, allowing it to offer deposit-taking and lending services directly under the supervision of BaFin and the Bundesbank. The move reduced the company's reliance on partner banks and supported the transition from securities accounts previously held through Baader Bank to Scalable's own infrastructure."}, {"id": "vc043", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "She won a silver medal in the Mass start at the 2025 World Single Distances Speed Skating Championships, marking her eighth career mass start medal at the world championships [d41597867s3p0].", "ev": "After results from the 2017–18 ISU Speed Skating World Cup, Blondin pre-qualified for the 2018 Winter Olympics in Pyeongchang, South Korea. She competed in the 3000 m, 5000 m, mass start, and team relay events.\n\nIn 2020, she won the mass start event gold medal at the 2020 World Single Distances Speed Skating Championships at the Utah Olympic Oval in Salt Lake City, United States. This was followed up with the silver medal at the World Allround Speed Skating Championships in March. She was the first Canadian woman to reach the overall podium at that event since 2012 and only the fifth since the event started in 1936.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event.\n\nIn January 2022, Blondin was named to her third Olympic team. Blondin would go on to win the gold medal as part of the team pursuit event. Blondin next competed in the mass start event at the Olympics, comfortably winning her semifinal to go on to the final. There, with one lap to go, Blondin made her move while following behind Irene Schouten; over the last turn, Blondin led, but Schouten pushed passed her to edge her out for the gold. Blondin happily settled for the silver medal, her second of these games. After the race, she spoke with CBC Sports telling them of her preferred event in the mass start that \"These races, the mass start, it fires me up. I'm a little bit of a fighter, and I'm very competitive, so the fact that girls were pushing me and there was a lot of jostling and pushing and shoving around just fires me up and kinda gets me going.\"\n\nAt the 2025 World Single Distances Speed Skating Championships she won three medals -- silver medals in the Mass start (her eighth career mass start medal at the world championships) and Team sprint events, and bronze in the Team pursuit event."}, {"id": "vc044", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Parts of S-200 systems were pictured in a state of disrepair after air defense sites were overtaken by rebel forces [d1380590s8p0].", "ev": "Starting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other parts of Israel, having lost their target. According to ANNA News, Syria claimed that they had shot down one IAF F-16 aircraft and damaged another. While the Syrian Defense Ministry claimed that an Israeli fighter jet was shot down, which was denied by Israel, Israeli defence minister Avigdor Lieberman threatened to destroy Syrian air defence systems after they fired ground-to-air missiles at Israeli warplanes carrying out strikes. The Jordanian armed forces reported that parts of a missile fell in its territory. There were no casualties in Jordan.\n\nOn October 16, 2017, a Syrian S-200 battery located around 50 kilometers east of Damascus fired a missile at an Israeli Air Force surveillance mission over Lebanon. The IAF responded by attacking the battery and destroying the fire control radar with four bombs. Despite this, the Syrian Defense Ministry said in its statement that the air-defense forces \"directly hit one of the jets, forcing to retreat.\" Israel said that no plane was hit.\n\nOn February 10, 2018, Israel launched an airstrike against targets in Syria with eight fighter aircraft as retaliation for a UAV incursion into Israeli airspace earlier in the day. Syrian air defenses succeeded in shooting down one of the Israeli jets, an F-16I Sufa, with an S-200 missile - this was the first Israeli jet to be shot down in combat since 1982. The jet crashed in the Jezreel Valley, near Harduf. Both the pilot and the navigator managed to eject; one was injured lightly, the other more seriously, but both survived and walked out of the hospital one week later.\n\nOn 10 May 2018, Israeli Air Force launched Operation House of Cards against a number of Iranian and Syrian targets, claiming the destruction of a S-200 radar among different other targets.\n\nOn September 17, 2018, a Russian Il-20M ELINT plane was shot down by a Syrian S-200 surface-to-air missile killing all the 15 servicemen onboard. Four Israeli F-16 fighter jets attacked targets in Syria's Latakia with standoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\".\n\nStarting in January 1983, Syria received supplies of S-200 missiles from the Soviet Union. They were organized into two long range surface-to-air missile regiments, each composed of two battalions of two batteries each for a total of at least 24 launchers. Later in the 1980s, the Soviet Union agreed to supply a third regiment increasing the number of launchers to 40–50.Initially, the missiles were manned by Soviet crews. In April 1984, a U.S. intelligence report cited a Soviet official claiming that training of Syrian personnel was nearly complete and that the transfer of the system to Syrian control was to occur in the near future.\n\nDuring the initial years of the Syrian civil war, parts of the S-200 systems were occasionally spotted when Syrian Air Defense Force sites were overrun by rebel forces. Most notably radars, missiles and other equipment from S-200 systems was pictured in a state of disrepair when rebels overtook the air defense site in Eastern Ghouta in October 2012. On 2 January 2017, the Syrian Army recaptured this air defense base.\n\nStarting with the Russian intervention in the civil war in late 2015, there were new efforts to restore some Syrian S-200 systems. Indeed, on 15 November 2016, the Russian defence minister confirmed that Russian forces repaired Syrian S-200s to operational status. For example, in July 2016, the Syrian Army, with Russian assistance, rebuilt an S-200 site at Kweires airport, near Aleppo. On September 12, 2016, the Israel Defense Forces confirmed that two Syrian S-200 missiles were fired at Israeli aircraft while they were on a mission inside Syrian airspace. The Syrian Defense Ministry claimed that an Israeli jet and a drone were shot down. According to the IDF spokesman's office, the claims are \"total lies,\" and \"at no point was the safety of IDF aircraft compromised.\"\n\nOn March 17, 2017, the Israeli Air Force attacked a number of Syrian armed forces targets near Palmyria in Syria. During the action a number of Syrian S-200 missiles were fired at the Israeli aircraft. One of the Syrian missiles, going ballistic after losing its target, was inbound to a populated area in Israel. The Israeli missile defense fired at least one Arrow missile which intercepted the incoming missile. Two other S-200 missiles landed in other tandoff missiles, after approaching from the Mediterranean Sea, a statement by the Russian defense ministry said on 18 September. “The Israeli pilots used the Russian plane as cover and set it up to be targeted by the Syrian air defense forces. As a consequence, the Il-20, which has radar cross-section much larger than the F-16, was shot down by an S-200 system missile,” the statement said. The Russian ministry stressed that the Israelis must have known that the Russian plane was present in the area, which didn't stop them from “the provocation”. Israel also failed to warn Russia about the planned operation in advance. The warning came a minute before the attack started, which “did not leave time to move the Russian plane to a safe area,” the statement said. On 21 September, an Israeli delegation visiting Moscow stated that the Israeli attack formation did not use the Russian Il-20 as a shield during the attacks, while blaming the incident on the Syrian Air Defense Force which fired missiles for forty minutes while the Israeli attack formation had already left the area. Russian President Vladimir Putin downplayed the incident saying that \"it looks accidental, like a chain of tragic circumstances\"."}, {"id": "vc045", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Factions appear on cards as allied groups that back talent and compete in multi-man matches, exemplified by American Top Team backing Dos Santos and teaming in a trios match on AEW programming [d19940888s10p0].", "ev": "In the summer of 2021, dos Santos began making appearances for the professional wrestling promotion All Elite Wrestling, backing American Top Team head Dan Lambert along with ATT affiliated fighters Andrei Arlovski, Paige VanZant, Austin Vanderford, Dalton Rosta, and Jorge Masvidal. They formed an alliance with Ethan Page and Scorpio Sky, otherwise known as the Men of the Year (both of which have legitimate extensive martial arts backgrounds, with Scorpio Sky having fought in MMA competition). On the 6 October edition of AEW Dynamite, it was announced that Dos Santos would be making his professional wrestling debut on the 15 October edition of AEW Rampage, teaming with Sky and Page to take on Jake Hager, Chris Jericho and Sammy Guevara (The Inner Circle) in a trios match."}, {"id": "vc046", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The missile was first publicly seen at the 1992 Moscow Airshow, indicating export availability in the early 1990s [d952206s1p0].", "ev": "Work on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV-AE have a range of 80 km (50 mi). Vympel did not have adequate funding during the 1990s and the first part of the following decade to support further evolution of the R-77, either for the Russian Air Force or the export market. The basic version of the R-77 is not thought to have entered the Russian Aerospace Forces inventory in significant numbers.\n\nThe R-77 can be used by upgraded Su-27, MiG-29 and MiG-31 variants in Russian Aerospace Forces service. Some variants of the Su-27 in China's People's Liberation Army Air Force, including the domestically produced J-11 variants, can also employ the missile. The newer Su-30MKK has a N001 (Su-27 radar) with a digital bypass channel incorporating a mode allowing it to use R-77s. The export RVV-AE has been sold widely, with China and India placing significant orders for the munition, as was the case for the R-73. The baseline R-77 was designed in the 1980s, with development complete by around 1994. India was the first export customer for the export variant, known as the RVV-AE, with the final batch delivered in 2002.\n\nThere are other variants under development. One has an upgraded motor to extend a range at high altitudes to as much as 120–160 km; it is known as the RVV-AE-PD (P ovyshenoy D alnosti —improved range). This variant has been test-fired and uses a solid-fuel ramjet engine. Its range puts it in the long-range class and is equivalent in range to the AIM-54 Phoenix. In another version of the R-77, a terminal infrared homing seeker is offered. This is in line with the Russian practice of attacking targets by firing pairs of missiles with different homing systems. This complicates end-game defensive actions for the target aircraft, as it needs to successfully defeat two homing systems. If a radar-guided medium-range missile is fired at an enemy jet aircraft outside the non-escape attack zone, the target aircraft may be able to escape through emergency maneuver. But at this moment, in fact, the infrared guidance has an advantage: once the jet aircraft turns to escape, the engine nozzle is exposed, and the infrared characteristics are exposed. This method of attack may not always be available as IR seekers typically have less range and less resistance to poor weather than radar seekers, which may limit the successful use of mixed seeker attacks unless the IR missile is initially directed by radar or some other means.\n\nAnother improvement program was designated the R-77M, which made the missile longer and heavier, making use of a two-stage motor as well as an improved seeker. A further product-improvement of the R-77, designated the R-77M1 and then the R-77-PD, was to feature a ramjet propulsion device. This missile was destined for the MiG 1.44, which was developed for the MFI program. The munition has a laser fuse and an expanding rod warhead that can destroy the variable sized targets. However, due to funding shortage and eventual cancellation of the MiG 1.44, development of this model may have stopped by 1999; no information or announcement regarding the R-77M and R-77-PD has appeared since.\n\nWork on the R-77 began in 1982 by \"Molnija OKB\" in the Ukrainian SSR. After the dissolution of the Soviet Union, the R-77 (Izdelie 170) missiles were produced in Kyiv 's \"Artem\" plant. It represented Ukraine's and later also Russia's first multi-purpose missile for tactical and strategic aircraft for fire-and-forget use against aircraft ranging from hovering helicopters to high-speed, low-altitude aircraft. Gennadiy Sokolovski, general designer of the Vympel Design Bureau, said that the R-77 missile can be used against medium and long range air-to-air missiles such as the AIM-120 AMRAAM and AIM-54 Phoenix, as well as SAMs such as the Patriot. The munition has a laser-triggered proximity fuze and an expanding rod warhead that can destroy targets of various sizes. It can be used against cruise missiles and precision-guided munitions (PGMs). First seen at the 1992 Moscow Airshow (MAKS), the R-77 was immediately nicknamed Amraamski by Western journalists. The basic R-77 is known as the izdeliye 170, while the export variant is known as the izdeliye 190 or RVV-AE. The R-77 and RVV  Lanka since 1974. The university has approximately 7,000 students. The province is known for its institutions of education, many of which were established by Christian missionaries.\n\nThe Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.\n\nSince 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.\n\nThe expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.\n\nSri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\nSri Lanka Railways operates the country's railway network, including the Northern Line and the Mannar Line, in the Northern Province.\n\nMost of the railways were developed during the British colonial period.\n\nThe railway lines between Vavuniya, Jaffna, and Kankesanthurai and between Medawachchiya and Talaimannar were destroyed during the civil war. For a time during reconstruction the Northern Line operated south of Pallai, while the Mannar Line operates between Medawachchiya and Madhu Road, but by 2015 it was reconstructed past Jaffna to its terminus at Kankesanthirai. Both lines are under reconstruction to restore the original network and upgrade the operating technology used.\n\nAirways and airports are underdeveloped in this province. Jaffna International Airport is the primary airport in the province, once an international airport that had regular passenger flight service to Colombo and Tiruchirappalli, India. It had been under the control of the Sri Lanka Navy and now has been turned into an international airport again with the help of India. Daily flights between Colombo and Chennai, India and Jaffna are available. There are a few small airports and airstrips in Vavuniya and Iranamadu."}, {"id": "vc048", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Managers deployed Johnson as the staff ace to anchor rotations, including pairing him with Curt Schilling to form the Diamondbacks' two-ace rotation.[d386384s9p0] Johnson was used as a high-leverage starter whose intensity and execution were credited with elevating his battery, according to his perfect game catcher Robbie Hammock.[d28263789s3p0] Diamondbacks manager Bob Brenly described Johnson's focus and rhythm on nights like his perfect game as maximizing his effectiveness for team outcomes.[d28263789s3p0] Johnson's long outings and ability to record many innings allowed managers to rely on him for deep starts and to reduce strain on the bullpen.[d386384s9p0]", "ev": "Johnson agreed to a four-year contract, with an option for a fifth year, for $52.4 million, with the Arizona Diamondbacks, a second-year franchise, in late 1998. Johnson led the team to the playoffs in 1999 on the strength of a 17–9 record and 2.48 ERA with 364 strikeouts, leading the majors in innings, complete games, and strikeouts. Johnson won the NL Cy Young Award and Warren Spahn Award as the best left-handed pitcher in MLB. Johnson became the third MLB pitcher, after Gaylord Perry and Pedro Martínez, to win the Cy Young Award in both the AL and NL; Martínez won the AL Cy Young in 1999. Johnson finished 2000 with 19 wins, 347 strikeouts and a 2.64 ERA, and won his second consecutive NL Cy Young Award and Warren Spahn Award. The Diamondbacks acquired Curt Schilling from the Phillies in July 2000, and the two aces anchored the Diamondbacks rotation.\n\nRobby Hammock, the catcher of Johnson's perfect game:\n\nEvery time you catch, you feel that something like this has a chance to happen...He's so intense, and it's something he has out there on the mound that makes me that much better.\n\n— Robbie Hammock, May 19, 2004: MLB.com\n\nRobin Yount, the bench coach of the Diamondbacks:\n\nI was part of two no-hitters, one against by Kansas City and Steve Busby and one for us against Baltimore with Juan Nieves. But to see Randy do it was even more remarkable because he's had such an incredible career.\n\n— Robin Yount, May 19, 2004: MLB.com\n\nLuis Gonzalez, left fielder for the Diamondbacks:\n\nSteve Finley and I were part of a no-hitter that Darryl Kile threw when we were all in Houston. But there's no doubt that for Randy to be out there pitching like that — well, nothing can compare to Randy.\n\n— Luis Gonzalez, May 19, 2004: MLB.com\n\nBob Brenly, Diamondbacks manager:\n\nThis is one of those nights where a superior athlete was on top of his game. There was a tremendous rhythm out there. His focus, his concentration, his stuff, everything was as good as it could possibly be.\n\n— Bob Brenly, May 18, 2004: ESPN.com\n\nRobby Hammock, the catcher of Johnson's perfect game:\n\nEvery time you catch, you feel that something like this has a chance to happen...He's so intense, and it's something he has out there on the mound that makes me that much better.\n\n— Robbie Hammock, May 19, 2004: MLB.com\n\nRobin Yount, the bench coach of the Diamondbacks:\n\nI was part of two no-hitters, one against by Kansas City and Steve Busby and one for us against Baltimore with Juan Nieves. But to see Randy do it was even more remarkable because he's had such an incredible career.\n\n— Robin Yount, May 19, 2004: MLB.com\n\nLuis Gonzalez, left fielder for the Diamondbacks:\n\nSteve Finley and I were part of a no-hitter that Darryl Kile threw when we were all in Houston. But there's no doubt that for Randy to be out there pitching like that — well, nothing can compare to Randy.\n\n— Luis Gonzalez, May 19, 2004: MLB.com\n\nBob Brenly, Diamondbacks manager:\n\nThis is one of those nights where a superior athlete was on top of his game. There was a tremendous rhythm out there. His focus, his concentration, his stuff, everything was as good as it could possibly be.\n\n— Bob Brenly, May 18, 2004: ESPN.com\n\nJohnson agreed to a four-year contract, with an option for a fifth year, for $52.4 million, with the Arizona Diamondbacks, a second-year franchise, in late 1998. Johnson led the team to the playoffs in 1999 on the strength of a try { const p = JSON.parse(localStorage.getItem(KEY + "_pos") || "null"); if (p) { si = p[0]; i = p[1]; } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans));
                           localStorage.setItem(KEY + "_pos", JSON.stringify([si, i])); } catch (e) {} };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const filled = s => Object.keys(ans[s.id]).filter(k => s.items.some(x => x.id === k)).length;

function renderTabs() {
  const t = document.getElementById("tabs"); t.innerHTML = "";
  SETS.forEach((s, k) => {
    const b = document.createElement("button");
    const n = filled(s);
    b.className = "tab" + (k === si ? " on" : "") + (n === s.items.length ? " full" : "");
    b.innerHTML = esc(s.name) + '<span class="c">' + n + "/" + s.items.length + "</span>";
    b.onclick = () => { si = k; i = 0; const j = s.items.findIndex(x => !ans[s.id][x.id]); if (j >= 0) i = j; render(); };
    t.appendChild(b);
  });
}
function render() {
  const s = SETS[si], it = s.items[i];
  renderTabs();
  document.getElementById("pos").textContent = s.name + "  " + (i + 1) + " / " + s.items.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("h_claim").textContent = s.h_claim;
  document.getElementById("h_ev").textContent = s.h_ev;
  document.getElementById("claim").textContent = it.claim;
  document.getElementById("ev").textContent = it.ev;
  document.getElementById("ev").scrollTop = 0;
  document.querySelectorAll("[data-k]").forEach(b => {
    const v = s.labels[+b.dataset.k];
    b.querySelector("span").textContent = v;
    b.classList.toggle("on", ans[s.id][it.id] === v);
  });
  const tot = SETS.reduce((a, x) => a + x.items.length, 0), got = SETS.reduce((a, x) => a + filled(x), 0);
  document.getElementById("cnt").innerHTML = got === tot
    ? '<span class="done">전부 완료 — CSV 를 내려받으세요</span>' : ("전체 " + got + " / " + tot);
  document.getElementById("pb").style.width = (100 * got / tot) + "%";
  save();
}
function pick(k) {
  const s = SETS[si];
  ans[s.id][s.items[i].id] = s.labels[k]; save();
  if (i < s.items.length - 1) i++;
  render();
}
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pick(+b.dataset.k));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < SETS[si].items.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  for (let d = 0; d < SETS.length; d++) {
    const k = (si + d) % SETS.length, j = SETS[k].items.findIndex(x => !ans[SETS[k].id][x.id]);
    if (j >= 0) { si = k; i = j; render(); return; }
  }
  alert("전부 채웠습니다. CSV 를 내려받으세요.");
};
document.onkeydown = e => {
  if (e.key === "1") pick(0); else if (e.key === "2") pick(1); else if (e.key === "3") pick(2);
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["set", "item_id", "human_label"].join(",")];
  for (const s of SETS) for (const x of s.items) rows.push([q(s.id), q(x.id), q(ans[s.id][x.id] || "")].join(","));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "labels_vc50_filled.csv"; a.click();
};
render();
</script></body></html>
