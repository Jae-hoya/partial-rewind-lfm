blished. Next, our re-grasping model learns to progressively improve grasps with tactile feedback based on the learned features. This network learns to estimate grasp stability and predict adjustment for the next grasp. Re-grasping thus is performed iteratively until our model identifies a stable grasp. Finally, we demonstrate extensive experimental results on grasping a large set of novel objects using tactile sensing alone. Furthermore, when applied on top of a vision-based policy, our re-grasping model significantly boosts the overall accuracy by 10.6%. We believe this is the first attempt at learning to grasp with only tactile sensing and without any prior object knowledge.\n\nTouch sensing is widely acknowledged to be important for dexterous robotic manipulation, but exploiting tactile sensing for continuous, non-prehensile manipulation is challenging. General purpose control techniques that are able to effectively leverage tactile sensing as well as accurate physics models of contacts and forces remain largely elusive, and it is unclear how to even specify a desired behavior in terms of tactile percepts. In this paper, we take a step towards addressing these issues by combining high-resolution tactile sensing with data-driven modeling using deep neural network dynamics models. We propose deep tactile MPC, a framework for learning to perform tactile servoing from raw tactile sensor inputs, without manual supervision. We show that this method enables a robot equipped with a GelSight-style tactile sensor to manipulate a ball, analog stick, and 20-sided die, learning from unsupervised autonomous interaction and then using the learned tactile predictive model to reposition each object to user-specified configurations, indicated by a goal tactile reading. Videos, visualizations and the code are available here: https://sites.google.com/view/deeptactilempc\n\nThis paper presents a tactile-reactive gripper that integrates a Visuo-Tactile Active Palm (VTAP) and compliant, reconfigurable fingers equipped with tactile array sensors. The design exploits structured finger-palm synergy and multi-modal perception to achieve both robust grasping and fine manipulation. The actuated bi-modal palm seamlessly combines long-range visual localization with contact-rich tactile feedback, substantially extending the system's manipulation capability. To bridge the embodiment gap between human hand motion and the heterogeneous three-finger structure, we further propose a staged, gesture-conditioned retargeting framework for dexterous teleoperation. Extensive experiments validate the system across a range of challenging tasks: reactive grasping of YCB and fragile objects, in-hand syringe reorientation and plunger actuation, singulation of clustered objects down to 3 mm in diameter, and vision-tactile peg-in-hole insertion. Results demonstrate that high manipulation performance can be achieved through coordinated finger-palm interaction and multi-modal sensing, without resorting to high degrees of freedom anthropomorphic designs. The VTAP gripper and its retargeting framework offer a practical reference architecture for dexterous gripper design, manipulation, and contact-rich data collection in support of learning-based approaches. Project webpage: https://yuhochau.github.io/vtap/."}, {"id": "c2v024", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Material and substrate charge defects produce telegraph (bistable) noise that can decohere solid-state degrees of freedom unless actively suppressed [d137670s0p0].", "ev": "Optically levitated nanoparticles are promising candidates for the generation of macroscopic quantum states of mechanical motion. Protocols to generate such states expose the particle to a succession of different potentials. Limited reproducibility of the alignment of these potentials across experimental realizations introduces additional noise. Here, we experimentally investigate and model how such shot-to-shot noise limits the coherence length of a levitated nanoparticle during a state-expansion protocol using a dark, inverted electrical potential. We identify electric stray fields and mechanical instabilities as major sources of shot-to-shot fluctuations. We discuss the resulting experimental requirements for state expansion protocols exploiting inverted potentials.\n\nDue to their exceptional isolation from the environment, magnetically levitated particles are explored as extremely sensitive mechanical sensors. For future gravity experiments on quantum superpositions, such systems need to be cooled close to their ground state. To demonstrate the combination of state of the art vibration isolation, milligram levitated high Q mechanical resonators and position detection with low noise, we present linear feedback cooling of a magnetically levitated gravity sensor to below 2 picometer amplitude and below 10 millikelvin mode temperature for two translational modes (the x- and y-mode) simultaneously. The sensor is a levitating permanent magnet in a type I superconducting trap, where its six resonance frequencies are measured with a superconducting coil coupled to a DC SQUID. This signal is measured with a lock-in amplifier and a feedback signal is sent to a piezoelectric actuator, allowing the cooling of resonant modes at 50.6 and 68.0 Hz simultaneously. These two translational modes have Q factors of $3.8 \\cdot 10^6$ and $5.5 \\cdot 10^6$ respectively. The experiment is mounted inside a dry dilution refrigerator where it is vibrationally attenuated with 110-130 dB at these frequencies. In this work, we discuss future improvements on the setup which may enable quantum ground state cooling on a magnetically levitated particle, that has previously been shown to be a gravitational sensor.\n\nWith the growing efforts in isolating solid-state qubits from external decoherence sources, the origins of noise inherent to the material start to play a relevant role. One representative example are charged impurities in the device material or substrate, which typically produce telegraph noise and can hence be modelled as bistable fluctuators. In order to demonstrate the possibility of the active suppression of the disturbance from a {\\em single} fluctuator, we theoretically implement an elementary bang-bang control protocol. We numerically simulate the random walk of the qubit state on the Bloch sphere with and without bang-bang compensation by means of the stochastic Schr\\\"odinger equation and compare it with an analytical saddle point solution of the corresponding Langevin equation in the long-time limit. We find that the deviation with respect to the noiseless case is significantly reduced when bang-bang pulses are applied, being scaled down approximately by the ratio of the bang-bang period and the typical flipping time of the bistable fluctuation. Our analysis gives not only the effect of bang-bang control on the variance of these deviations, but also their entire distribution. As a result, we expect that bang-bang control works as a high-pass filter on the spectrum of noise sources. This indicates how the influence of $1/f$-noise ubiquitous to the solid state world can be reduced."}, {"id": "c2v036", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Equivariant versions of DQN and SAC have been proposed for rotationally symmetric robotic manipulation problems and demonstrate substantially improved sample efficiency compared to standard algorithms on that class of tasks [d74490s0p0].", "ev": "Reinforcement learning (RL) is widely used for humanoid control, with on-policy methods such as Proximal Policy Optimization (PPO) enabling robust training via large-scale parallel simulation and, in some cases, zero-shot deployment to real robots. However, the low sample efficiency of on-policy algorithms limits safe adaptation to new environments. Although off-policy RL and model-based RL have shown improved sample efficiency, the gap between large-scale pretraining and efficient finetuning on humanoids still exists. In this paper, we find that off-policy Soft Actor-Critic (SAC), with large-batch update and a high Update-To-Data (UTD) ratio, reliably supports large-scale pretraining of humanoid locomotion policies, achieving zero-shot deployment on real robots. For adaptation, we demonstrate that these SAC-pretrained policies can be finetuned in new environments and out-of-distribution tasks using model-based methods. Data collection in the new environment executes a deterministic policy while stochastic exploration is instead confined to a physics-informed world model. This separation mitigates the risks of random exploration during adaptation while preserving exploratory coverage for improvement. Overall, the approach couples the wall-clock efficiency of large-scale simulation during pretraining with the sample efficiency of model-based learning during fine-tuning. For code and videos, see https://lift-humanoid.github.io\n\nAutonomous mechanical thrombectomy (MT) presents substantial challenges due to highly variable vascular geometries and the requirements for accurate, real-time control. While reinforcement learning (RL) has emerged as a promising paradigm for the automation of endovascular navigation, existing approaches often show limited robustness when faced with diverse patient anatomies or extended navigation horizons. In this work, we investigate a world-model-based framework for autonomous endovascular navigation built on TD-MPC2, a model-based RL method that integrates planning and learned dynamics. We evaluate a TD-MPC2 agent trained on multiple navigation tasks across hold out patient-specific vasculatures and benchmark its performance against the state-of-the-art Soft Actor-Critic (SAC) algorithm agent. Both approaches are further validated in vitro using patient-specific vascular phantoms under fluoroscopic guidance. In simulation, TD-MPC2 demonstrates a significantly higher mean success rate than SAC (58% vs. 36%, p < 0.001), and mean tip contact forces of 0.15 N, well below the proposed 1.5 N vessel rupture threshold. Mean success rates for TD-MPC2 (68%) were comparable to SAC (60%) in vitro, but TD-MPC2 achieved superior path ratios (p = 0.017) at the cost of longer procedure times (p < 0.001). Together, these results provide the first demonstration of autonomous MT navigation validated across both hold out in silico data and fluoroscopy-guided in vitro experiments, highlighting the promise of world models for safe and generalizable AI-assisted endovascular interventions.\n\nEquivariant neural networks enforce symmetry within the structure of their convolutional layers, resulting in a substantial improvement in sample efficiency when learning an equivariant or invariant function. Such models are applicable to robotic manipulation learning which can often be formulated as a rotationally symmetric problem. This paper studies equivariant model architectures in the context of $Q$-learning and actor-critic reinforcement learning. We identify equivariant and invariant characteristics of the optimal $Q$-function and the optimal policy and propose equivariant DQN and SAC algorithms that leverage this structure. We present experiments that demonstrate that our equivariant versions of DQN and SAC can be significantly more sample efficient than competing algorithms on an important class of robotic manipulation problems.\n\nThe synergies between Quality-Diversity (QD) and Deep Reinforcement Learning (RL) have led to powerful hybrid QD-RL algorithms that have shown tremendous potential, and brings the best of both fields. However, only a single deep RL algorithm (TD3) has been used in prior hybrid methods despite notable progress made by other RL algorithms. Additionally, there are fundamental differences in the optimization procedures between QD and RL which would benefit from a more principled approach. We propose Generalized Actor-Critic QD-RL, a unified modular framework for actor-critic deep RL methods in the QD-RL setting. This framework provides a path to study insights from Deep RL in the QD-RL setting, which is an important and efficient way to make progress in QD-RL. We introduce two new algorithms, PGA-ME (SAC) and PGA-ME (DroQ) which apply recent advancements in Deep RL to the QD-RL setting, and solves the humanoid environment which was not possible using existing QD-RL algorithms. However, we also find that not all insights from Deep RL can be effectively translated to QD-RL. Critically, this work also demonstrates that the actor-critic models in QD-RL are generally insufficiently trained and performance gains can be achieved without any additional environment evaluations."}, {"id": "c2v023", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Hom-pre-Lie bialgebras are developed within the Hom-Lie cohomology framework and are shown to be equivalent to standard Manin triples and certain matched pairs, providing structural tools for deformation theory in the Hom setting [d55626s0p0].", "ev": "In this paper we introduce the notion of Hom-pre-Lie bialgebra in the general framework of the cohomology theory for Hom-Lie algebras. We show that Hom-pre-Lie bialgebras, standard Manin triples for Hom-pre-Lie algebras and certain matched pairs of Hom-pre-Lie algebras are equivalent. Due to the usage of the cohomology theory, it makes us successfully study the coboundary Hom-pre-Lie bialgebras. The notion of Hom-s-matrix is introduced, by which we can construct Hom-pre-Lie bialgebras naturally. Finally we introduce the notions of Hom-O-operators on Hom-pre-Lie algebras and Hom-L-dendriform algebras, by which we construct Hom-s-matrices.\n\nIn this paper, we develop the deformation theory controlled by pre-Lie algebras; the main tool is a new integration theory for pre-Lie algebras. The main field of application lies in homotopy algebra structures over a Koszul operad; in this case, we provide a homotopical description of the associated Deligne groupoid. This permits us to give a conceptual proof, with complete formulae, of the Homotopy Transfer Theorem by means of gauge action. We provide a clear explanation of this latter ubiquitous result: there are two gauge elements whose action on the original structure restrict its inputs and respectively its output to the homotopy equivalent space. This implies that a homotopy algebra structure transfers uniformly to a trivial structure on its underlying homology if and only if it is gauge trivial; this is the ultimate generalization of the $dd^c$-lemma.\n\nIn this note, we introduce a notion of multi-parameter formal deformations of ternary hom-Nambu-Lie algebras. Within this framework, we construct formal deformations of the three-dimensional Jacobian determinant and of the cross-product in four-dimensional Euclidean space. We also conclude that the previously defined ternary q-Virasoro-Witt algebra is a formal deformation of the ternary Virasoro-Witt algebra."}, {"id": "c2v034", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Two semantic conditions ensuring decidability of path feasibility in string-manipulating programs have been given, along with a decision procedure and complexity characterizations for the general fragment [d47246s0p0].", "ev": "We demonstrate the equivalence of two definitions of a Gibbs measure on a subshift over a countable group, namely a conformal measure and a Gibbs measure in the sense of the Dobrushin-Lanford-Ruelle (DLR) equations. We formulate a more general version of the classical DLR equations with respect to a measurable cocycle, which reduce to the classical equations when the cocycle is induced by an interaction or a potential, and show that a measure satisfying these equations must be conformal. To ensure the consistency of these results with earlier work, we review methods of constructing an interaction from a potential and vice versa, such that the interaction and the potential constructed from it, or vice versa, induce the same cocycle.\n\nWe prove decidability of the boundedness problem for monadic least fixed-point recursion based on positive monadic second-order (MSO) formulae over trees. Given an MSO-formula phi(X,x) that is positive in X, it is decidable whether the fixed-point recursion based on phi is spurious over the class of all trees in the sense that there is some uniform finite bound for the number of iterations phi takes to reach its least fixed point, uniformly across all trees. We also identify the exact complexity of this problem. The proof uses automata-theoretic techniques. This key result extends, by means of model-theoretic interpretations, to show decidability of the boundedness problem for MSO and guarded second-order logic (GSO) over the classes of structures of fixed finite tree-width. Further model-theoretic transfer arguments allow us to derive major known decidability results for boundedness for fragments of first-order logic as well as new ones.\n\nThe problem if a given configuration of a pushdown automaton (PDA) is bisimilar with some (unspecified) finite-state process is shown to be decidable. The decidability is proven in the framework of first-order grammars, which are given by finite sets of labelled rules that rewrite roots of first-order terms. The framework is equivalent to PDA where also deterministic (i.e. alternative-free) epsilon-steps are allowed, i.e. to the model for which S\\'enizergues showed an involved procedure deciding bisimilarity (1998, 2005). Such a procedure is here used as a black-box part of the algorithm. The result extends the decidability of the regularity problem for deterministic PDA that was shown by Stearns (1967), and later improved by Valiant (1975) regarding the complexity. The decidability question for nondeterministic PDA, answered positively here, had been open (as indicated, e.g., by Broadbent and G\\\"oller, 2012).\n\nThe design and implementation of decision procedures for checking path feasibility in string-manipulating programs is an important problem, whose applications include symbolic execution and automated detection of cross-site scripting (XSS) vulnerabilities. A (symbolic) path is a finite sequence of assignments and assertions (i.e. without loops), and checking its feasibility amounts to determining the existence of inputs that yield a successful execution. We give two general semantic conditions which together ensure the decidability of path feasibility: (1) each assertion admits regular monadic decomposition, and (2) each assignment uses a (possibly nondeterministic) function whose inverse relation preserves regularity. We show these conditions are expressive since they are satisfied by a multitude of string operations. They also strictly subsume existing decidable string theories, and most existing benchmarks (e.g. most of Kaluza's, and all of SLOG's, Stranger's, and SLOTH's). We give a simple decision procedure and an extensible architecture of a string solver in that a user may easily incorporate his/her own string functions. We show the general fragment has a tight, but high complexity. To address this, we propose to allow only partial string functions (i.e., prohibit nondeterminism) in condition (2). When nondeterministic functions are needed, we also provide a syntactic fragment that provides a support of nondeterministic functions but can be reduced to an existing solver SLOTH. We provide an efficient implementation of our decision procedure for deterministic partial string functions in a new string solver OSTRICH. It provides built-in support for concatenation, reverse, functional transducers, and replaceall and provides a framework for extensibility to support further string functions. We demonstrate the efficacy of our new solver against other competitive solvers."}, {"id": "c2v011", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Optical recoil heating and radiative scattering are significant for optically levitated particles but can be suppressed using squeezed light to reduce measurement-backaction trade-offs and laser recoil heating by up to ~60–98% depending on mode matching [d79119s0p0].", "ev": "The effect of thermal fluctuations on the behaviuor of a 4-terminal SQUID is investigated. The studied system consists of the Josephson 4-terminal junction with two terminals short-circuited by a superconducting ring and other two form the transport circuit. The behaviour of a 4-terminal SQUID is controlled by external parameters, the applied magnetic flux and the transport current. They determine the voltage in the transport channel and the magnetic flux embraced in the ring. Within the numerical model the noise-rounded current-voltage characteristics and the time dependence of the magnetic flux have been calculated. In some region of the control parameters the 4-terminal SQUID is in the bistable state with two magnetic flux values. The switching of the flux in bistable state produced by the thermal noise or by the transport current is studied.\n\nA current bias dc SQUID behaves as an anharmonic quantum oscillator controlled by a bias current and an applied magnetic flux. We consider here its two level limit consisting of the two lower energy states $| 0 \\right>$ and $| 1 \\right>$. We have measured energy relaxation times and microwave absorption for different bias currents and fluxes in the low microwave power limit. Decoherence times are extracted. The low frequency flux and current noise have been measured independently by analyzing the probability of current switching from the superconducting to the finite voltage state, as a function of applied flux. The high frequency part of the current noise is derived from the electromagnetic environment of the circuit. The decoherence of this quantum circuit can be fully accounted by these current and flux noise sources.\n\nOptically levitated nanoparticles are promising candidates for the generation of macroscopic quantum states of mechanical motion. Protocols to generate such states expose the particle to a succession of different potentials. Limited reproducibility of the alignment of these potentials across experimental realizations introduces additional noise. Here, we experimentally investigate and model how such shot-to-shot noise limits the coherence length of a levitated nanoparticle during a state-expansion protocol using a dark, inverted electrical potential. We identify electric stray fields and mechanical instabilities as major sources of shot-to-shot fluctuations. We discuss the resulting experimental requirements for state expansion protocols exploiting inverted potentials.\n\nDue to their exceptional isolation from the environment, magnetically levitated particles are explored as extremely sensitive mechanical sensors. For future gravity experiments on quantum superpositions, such systems need to be cooled close to their ground state. To demonstrate the combination of state of the art vibration isolation, milligram levitated high Q mechanical resonators and position detection with low noise, we present linear feedback cooling of a magnetically levitated gravity sensor to below 2 picometer amplitude and below 10 millikelvin mode temperature for two translational modes (the x- and y-mode) simultaneously. The sensor is a levitating permanent magnet in a type I superconducting trap, where its six resonance frequencies are measured with a superconducting coil coupled to a DC SQUID. This signal is measured with a lock-in amplifier and a feedback signal is sent to a piezoelectric actuator, allowing the cooling of resonant modes at 50.6 and 68.0 Hz simultaneously. These two translational modes have Q factors of $3.8 \\cdot 10^6$ and $5.5 \\cdot 10^6$ respectively. The experiment is mounted inside a dry dilution refrigerator where it is vibrationally attenuated with 110-130 dB at these frequencies. In this work, we discuss future improvements on the setup which may enable quantum ground state cooling on a magnetically levitated particle, that has previously been shown to be a gravitational sensor.\n\nWe theoretically show that laser recoil heating in free-space levitated optomechanics can be arbitrarily suppressed by shining squeezed light onto an optically trapped nanoparticle. The presence of squeezing modifies the quantum electrodynamical light-matter interaction in a way that enables us to control the amount of information that the scattered light carries about a given mechanical degree of freedom. Moreover, we analyze the trade-off between measurement imprecision and back-action noise and show that optical detection beyond the standard quantum limit can be achieved. We predict that, with state-of-the-art squeezed light sources, laser recoil heating can be reduced by at least 60% by squeezing a single Gaussian mode with an appropriate incidence direction, and by 98% by squeezing a properly mode-matched mode. Our results, which are valid both for motional and librational degrees of freedom, will lead to improved feedback cooling schemes as well as boost the coherence time of optically levitated nanoparticles in the quantum regime.\n\nMicrowave superconducting resonators are extensively studied in fields such as quantum computing and electron spin resonance (ESR) spectroscopy. However, the integration of superconducting resonators with feedback mechanisms to create ultra-low noise oscillators is a relatively unexplored area, and the application of such oscillators in ESR spectroscopy has not yet been demonstrated. In this work, we report the design, fabrication, and application of microwave oscillators based on superconducting resonators for ESR spectroscopy, illustrating an alternative way for the improvement of the performance of oscillator based ESR sensors. Specifically, ESR spectra are obtained by measuring the oscillator's frequency shift induced by the ESR effect as a function of the applied static magnetic field. The oscillators are composed of a single heterojunction bipolar transistor (HBT) or high electron mobility transistor (HEMT) coupled with NbTi or YBa$_2$Cu$_3$O$_7$ (YBCO) superconducting resonators. The fabricated oscillators operate at frequencies of 0.6 and 1.7 GHz and temperatures up to 80 K (for YBCO resonators) and 8 K (for NbTi resonators). The lowest measured frequency noise is about 9 mHz/Hz$^{1/2}$ (-139 dBc/Hz), the best spin sensitivity is about $1\\times10^{10}$ spins/Hz$^{1/2}$, and the best concentration sensitivity is about $3\\times10^{18}$ spins/Hz$^{1/2}$m$^3$. The approach proposed in this work should allow for significantly better spin and concentration sensitivities compared to those achievable with normal conductors, up to operating frequencies, magnetic fields, and temperatures where superconductors exhibit substantially lower effective microwave resistance than normal conductors."}, {"id": "c2v025", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "The category of Hom-Lie-Yamaguti algebras is closed under twisting by self-morphisms, which implements the modification of the Jacobi-type relations via composition with the twist map [d9858s0p0].", "ev": "A twisted generalization of Lie-Yamaguti algebras, called Hom-Lie-Yamaguti algebras, is defined. Hom-Lie-Yamaguti algebras generalize Hom-Lie triple systems (and susequently ternary Hom-Nambu algebras) and Hom-Lie algebras in the same way as Lie-Yamaguti algebras generalize Lie triple systems and Lie algebras. It is shown that the category of Hom-Lie-Yamaguti algebras is closed under twisting by self-morphisms. Constructions of Hom-Lie-Yamaguti algebras from classical Lie-Yamaguti algebras and Malcev algebras are given. It is observed that, when the ternary operation of a Hom-Lie-Yamaguti algebra expresses through its binary one in a specific way, then such a Hom-Lie-Yamaguti algebra is a Hom-Malcev algebra."}, {"id": "c2v037", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "A multiple-input multiple-output (MIMO) wireless system uses multiple transmit and receive antennas to create parallel spatial channels for multiplexing and/or diversity of signals between transmitter and receiver [d5873s0p0] [d119796s0p0].", "ev": "Multiple-input multiple-output (MIMO) techniques allow for multiplexing and/or diversity gain, and will be widely deployed in future wireless systems. In this paper, we propose a MIMO-assisted channel-based authentication scheme, exploiting current channel estimation mechanisms in MIMO systems to detect spoofing attacks with very low overhead. In this scheme, the use of multiple antennas provides extra dimensions of channel estimation data, and thus leads to a \"security gain\" over single-input single-output (SISO) systems. We investigate the security gain of MIMO systems in several system configurations via simulations for a specific real indoor environment using ray-tracing software. We also discuss the effect of increasing the number of transmit and receive antennas on the security gain and contrast that to the diversity/multiplexing gain.\n\nHolographic multiple-input multiple-output (H-MIMO) systems represent a paradigm shift in wireless communications by enabling quasi-continuous apertures. Unlike conventional MIMO systems, H-MIMO with subwavelength antenna spacing operates in both far-field and near-field regimes, where classical discrete Fourier transform (DFT) representations fail to sufficiently capture the channel characteristics. To address this challenge, this article provides an overview of the emerging wavenumber-domain signal processing framework. Specifically, by leveraging spatial Fourier plane-wave decomposition to model H-MIMO channels, the wavenumber domain offers a unified and physically consistent basis for characterizing subwavelength-level spatial correlation and spherical wave propagation. This article first introduces the concept of H-MIMO and the wavenumber representation of H-MIMO channels. Next, it elaborates on wavenumber-domain signal processing technologies reported in the literature, including multiplexing, channel estimation, and waveform designs. Finally, it highlights open challenges and outlines future research directions in wavenumber-domain signal processing for next-generation wireless systems.\n\nIn future sixth-generation (6G) mobile networks, radar sensing is expected to be offered as an additional service to its original purpose of communication. Merging these two functions results in integrated sensing and communication (ISAC) systems. In this context, bistatic ISAC appears as a possibility to exploit the distributed nature of cellular networks while avoiding highly demanding hardware requirements such as full-duplex operation. Recent studies have introduced strategies to perform required synchronization and data exchange between nodes for bistatic ISAC operation, based on orthogonal frequency-division multiplexing (OFDM), however, only for single-input single-output architectures. In this article, a system concept for a bistatic multiple-input multiple-output (MIMO)-OFDM-based ISAC system with beamforming at both transmitter and receiver is proposed, and a distribution synchronization concept to ensure coherence among the different receive channels for direction-of-arrival estimation is presented. After a discussion on the ISAC processing chain, including relevant aspects for practical deployments such as transmitter digital pre-distortion and receiver calibration, a 4x8 MIMO measurement setup at 27.5 GHz and results are presented to validate the proposed system and distribution synchronization concepts.\n\nThe accuracy of channel state information (CSI) acquisition directly affects the performance of millimeter wave (mmWave) communications. In this article, we provide an overview on CSI acquisition, including beam training and channel estimation for mmWave massive multiple-input multiple-output systems. The beam training can avoid the estimation of a high-dimension channel matrix while the channel estimation can flexibly exploit advanced signal processing techniques. In addition to introducing the traditional and machine learning-based approaches in this article, we also compare different approaches in terms of spectral efficiency, computational complexity, and overhead.\n\nWe investigate massive multiple-input-multiple output (MIMO) uplink systems with 1-bit analog-to-digital converters (ADCs) on each receiver antenna. Receivers that rely on 1-bit ADC do not need energy-consuming interfaces such as automatic gain control (AGC). This decreases both ADC building and operational costs. Our design is based on maximal ratio combining (MRC), zero-forcing (ZF), and least squares (LS) detection, taking into account the effects of the 1-bit ADC on channel estimation. Through numerical results, we show good performance of the system in terms of mutual information and symbol error rate (SER). Furthermore, we provide an analytical approach to calculate the mutual information and SER of the MRC receiver. The analytical approach reduces complexity in the sense that a symbol and channel noise vectors Monte Carlo simulation is avoided.\n\nLinear minimum mean-square error (L-MMSE) equalization is among the most popular methods for data detection in massive multi-user multiple-input multiple-output (MU-MIMO) wireless systems. While L-MMSE equalization enables near-optimal spectral efficiency, accurate knowledge of the signal and noise powers is necessary. Furthermore, corresponding VLSI designs must solve linear systems of equations, which requires high arithmetic precision, exhibits stringent data dependencies, and results in high circuit complexity. This paper proposes the first VLSI design of the NOnParametric Equalizer (NOPE), which avoids knowledge of the transmit signal and noise powers, provably delivers the performance of L-MMSE equalization for massive MU-MIMO systems, and is resilient to numerous system and hardware impairments due to its parameter-free nature. Moreover, NOPE avoids computation of a matrix inverse and only requires hardware-friendly matrix-vector multiplications. To showcase the practical advantages of NOPE, we propose a parallel VLSI architecture and provide synthesis results in 28nm CMOS. We demonstrate that NOPE performs on par with existing data detectors for massive MU-MIMO that require accurate knowledge of the signal and noise powers."}, {"id": "c2v038", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Forcing and inner-model techniques are employed to separate and preserve levels of indescribability by forcing combinatorial principles like square where no large-cardinal obstruction exists while preserving other strong cardinals, and by analyzing embeddings, forcing, and Laver-function behavior to control consistency and preservation properties [d11502s0p0][d19655s0p0].", "ev": "We generalise Jensen's result on the incompatibility of subcompactness with square. We show that alpha^+-subcompactness of some cardinal less than or equal to alpha precludes square_alpha, but also that square may be forced to hold everywhere where this obstruction is not present. The forcing also preserves other strong large cardinals. Similar results are also given for stationary reflection, with a corresponding strengthening of the large cardinal assumption involved. Finally, we refine the analysis by considering Schimmerling's hierarchy of weak squares, showing which cases are precluded by alpha^+-subcompactness, and again we demonstrate the optimality of our results by forcing the strongest possible squares under these restrictions to hold.\n\nI analyze the hierarchy of large cardinals between a supercompact cardinal and an almost-huge cardinal. Many of these cardinals are defined by modifying the definition of a high-jump cardinal. A high-jump cardinal is defined as the critical point of an elementary embedding $j: V \\to M$ such that $M$ is closed under sequences of length $\\sup\\set{j(f)(\\kappa) \\st f: \\kappa \\to \\kappa}$. Some of the other cardinals analyzed include the super-high-jump cardinals, almost-high-jump cardinals, Shelah-for-supercompactness cardinals, Woodin-for-supercompactness cardinals, \\Vopenka\\ cardinals, hypercompact cardinals, and enhanced supercompact cardinals. I organize these cardinals in terms of consistency strength and implicational strength. I also analyze the superstrong cardinals, which are weaker than supercompact cardinals but are related to high-jump cardinals. Two of my most important results are as follows. \\begin{itemize} \\item \\Vopenka\\ cardinals are the same as Woodin-for-supercompactness cardinals. \\item There are no excessively hypercompact cardinals. \\end{itemize} Furthermore, I prove some results relating high-jump cardinals to forcing, as well as analyzing Laver functions for super-high-jump cardinals. \\keywords{high-jump cardinals \\and \\Vopenka\\ cardinals \\and Woodin-for-supercompactness cardinals \\and hypercompact cardinals \\and forcing and large cardinals \\and Laver functions}"}, {"id": "c2v015", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "A statistical-mechanics model parameterized by in vitro Klf4 binding energies was predictive of Klf4 occupancy across the entire human genome, demonstrating improved genome-scale interpretation of TF binding [d118634s0p0].", "ev": "Transcription factors (TFs) regulate gene expression by binding to specific genomic loci determined by DNA sequence. Their sequence specificity is commonly summarized by a consensus binding motif. However, eukaryotic genomes contain billions of low-affinity DNA sequences to which TFs associate with a sequence-dependent binding energy. We currently lack insight into how the genomic sequence defines this spectrum of binding energies and the resulting pattern of TF localization. Here, we set out to obtain a quantitative understanding of sequence-dependent TF binding to both motif and non-motif sequences. We achieve this by first pursuing accurate measurements of physical binding energies of the human TF Klf4 to a library of short DNA sequences in a fluorescence-anisotropy-based bulk competitive binding assay. Second, we show that the highly non-linear sequence dependence of Klf4 binding energies can be captured by combining a linear model of binding energies with an Ising model of the coupled recognition of nucleotides by a TF. We find that this statistical mechanics model parametrized by our in vitro measurements captures Klf4 binding patterns on individual long DNA molecules stretched in the optical tweezer, and is predictive for Klf4 occupancy across the entire human genome without additional fit parameters.\n\nThe binding of transcription factors (TFs) is essential for gene expression. One important characteristic is the actual occupancy of a putative binding site in the genome. In this study, we propose an analytical model to predict genomic occupancy that incorporates the preferred target sequence of a TF in the form of a position weight matrix (PWM), DNA accessibility data (in case of eukaryotes), the number of TF molecules expected to be bound specifically to the DNA and a parameter that modulates the specificity of the TF. Given actual occupancy data in form of ChIP-seq profiles, we backwards inferred copy number and specificity for five Drosophila TFs during early embryonic development: Bicoid, Caudal, Giant, Hunchback and Kruppel. Our results suggest that these TFs display thousands of molecules that are specifically bound to the DNA and that, while Bicoid and Caudal display a higher specificity, the other three transcription factors (Giant, Hunchback and Kruppel) display lower specificity in their binding (despite having PWMs with higher information content). This study gives further weight to earlier investigations into TF copy numbers that suggest a significant proportion of molecules are not bound specifically to the DNA.\n\nWe present MEDUSA, an integrative method for learning motif models of transcription factor binding sites by incorporating promoter sequence and gene expression data. We use a modern large-margin machine learning approach, based on boosting, to enable feature selection from the high-dimensional search space of candidate binding sequences while avoiding overfitting. At each iteration of the algorithm, MEDUSA builds a motif model whose presence in the promoter region of a gene, coupled with activity of a regulator in an experiment, is predictive of differential expression. In this way, we learn motifs that are functional and predictive of regulatory response rather than motifs that are simply overrepresented in promoter sequences. Moreover, MEDUSA produces a model of the transcriptional control logic that can predict the expression of any gene in the organism, given the sequence of the promoter region of the target gene and the expression state of a set of known or putative transcription factors and signaling molecules. Each motif model is either a $k$-length sequence, a dimer, or a PSSM that is built by agglomerative probabilistic clustering of sequences with similar boosting loss. By applying MEDUSA to a set of environmental stress response expression data in yeast, we learn motifs whose ability to predict differential expression of target genes outperforms motifs from the TRANSFAC dataset and from a previously published candidate set of PSSMs. We also show that MEDUSA retrieves many experimentally confirmed binding sites associated with environmental stress response from the literature."}, {"id": "c2v008", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Common resampling approaches can mis-estimate lag uncertainty, for example a modified smooth bootstrap was shown to significantly overestimate lag errors in lag estimation problems, so bootstrap choices affect downstream error assessments [d104516s0p0].", "ev": "The optimal fingerprinting method for detection and attribution of climate change is based on a multiple regression where each covariate has measurement error whose covariance matrix is the same as that of the regression error up to a known scale. Inferences about the regression coefficients are critical not only for making statements about detection and attribution but also for quantifying the uncertainty in important outcomes derived from detection and attribution analyses. When there is no errors-in-variables (EIV), the optimal weight matrix in estimating the regression coefficients is the precision matrix of the regression error which, in practice, is never known and has to be estimated from climate model simulations. We construct a weight matrix by inverting a nonlinear shrinkage estimate of the error covariance matrix that minimizes loss functions directly targeting the uncertainty of the resulting regression coefficient estimator. The resulting estimator of the regression coefficients is asymptotically optimal as the sample size of the climate model simulations and the matrix dimension go to infinity together with a limiting ratio. When EIVs are present, the estimator of the regression coefficients based on the proposed weight matrix is asymptotically more efficient than that based on the inverse of the existing linear shrinkage estimator of the error covariance matrix. The performance of the method is confirmed in finite sample simulation studies mimicking realistic situations in terms of the length of the confidence intervals and empirical coverage rates for the regression coefficients. An application to detection and attribution analyses of the mean temperature at different spatial scales illustrates the utility of the method.\n\nPower spectrum estimators are an important tool in efforts to detect the 21 cm brightness temperature fluctuations from neutral hydrogen at early times. An initial detection will likely be statistical in nature, meaning that it will not be possible to make a coherent map of the brightness temperature fluctuations; instead, only their variance will be measured against a background of noise and residual systematic effects. Optimal Quadratic Estimator (OQE)-based methods often apply an inverse covariance weighting to the data. However, inaccurate covariance modelling can lead to reduced sensitivity and, in some cases, severe signal loss. We recently proposed a Bayesian method to jointly estimate the 21 cm fluctuations, their power spectrum, and foreground emission. Instead of requiring a fixed a priori estimate of the covariance, we estimate the covariance as part of the inference. Choices of parametrization, particularly of the foregrounds, are subject to model errors and could lead to biases and other ill effects if not properly controlled. In this paper, we investigate the effects of inaccurate foreground models on 21 cm power spectrum recovery. Using simulated visibilities, we find that, even in the most extreme scenarios tested, our approach is capable of recovering 21 cm delay power spectrum estimates consistent with a known input signal for delays $\\gtrsim300$ ns ($\\sim$88\\% of the available Fourier modes). This is true even when using foreground models derived from modified foreground catalogs containing spatial and spectral perturbations at the quoted level of uncertainty on our foreground catalogs.\n\nWhen inferring parameters from a Gaussian-distributed data set by computing a likelihood, a covariance matrix is needed that describes the data errors and their correlations. If the covariance matrix is not known a priori, it may be estimated and thereby becomes a random object with some intrinsic uncertainty itself. We show how to infer parameters in the presence of such an estimated covariance matrix, by marginalising over the true covariance matrix, conditioned on its estimated value. This leads to a likelihood function that is no longer Gaussian, but rather an adapted version of a multivariate t-distribution, which has the same numerical complexity as the multivariate Gaussian. As expected, marginalisation over the true covariance matrix improves inference when compared with Hartlap et al.'s method, which uses an unbiased estimate of the inverse covariance matrix but still assumes that the likelihood is Gaussian.\n\nGeneralized estimating equations (GEE) are of great importance in analyzing clustered data without full specification of multivariate distributions. A recent approach jointly models the mean, variance, and correlation coefficients of clustered data through three sets of regressions (Luo and Pan, 2022). We observe that these estimating equations, however, are a special case of those of Yan and Fine (2004) which further allows the variance to depend on the mean through a variance function. The proposed variance estimators may be incorrect for the variance and correlation parameters because of a subtle dependence induced by the nested structure of the estimating equations. We characterize model settings where their variance estimation is invalid and show the variance estimators in Yan and Fine (2004) correctly account for such dependence. In addition, we introduce a novel model selection criterion that enables the simultaneous selection of the mean-scale-correlation model. The sandwich variance estimator and the proposed model selection criterion are tested by several simulation studies and real data analysis, which validate its effectiveness in variance estimation and model selection. Our work also extends the R package geepack with the flexibility to apply different working covariance matrices for the variance and correlation structures.\n\nLight-travel-time delays provide one of the most powerful ways of learning about the structure and kinematics of active galactic nuclei (AGNs). Estimating delays from observations of AGN variability presents statistical challenges because the time series are almost invariably irregularly sampled. Correct assessment of errors in lag estimates is important for evaluating results. The most widely used method of determining phase lags has been the interpolated cross-correlation function method introduced by Gaskell and Sparke (1986, GS). It is shown here that the widely used modified smooth bootstrap method of Peterson et al. (1998) significantly overestimates the error in lags derived using the GS, especially for poorly sampled light curves. The remarkably high accuracy claimed for lags obtained by the JAVELIN method of Zu et al. (2011) (more than an order of magnitude improvement for 25% of cases) is spurious and the accuracy no better than the GS method. A related method proposed by Li et al. (2013) suffers from similar but less serious problems. A slightly modified version of the analytic formula of Gaskell and Peterson (1987) gives an easy and accurate way of estimating lag errors for well-sampled, high-quality data. The width of the continuum autocorrelation function is shown to be proportional to the square root of the luminosity. This is useful in planning observing campaigns. The discrete correlation function method is less powerful than the GS method and for many typical situations gives errors in the lag twice as large as those of the GS method."}, {"id": "c2v001", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Tuned regularized estimators derived via covariance fitting provide another practical route to robust parameter estimation [d73361s0p0].", "ev": "Estimating a covariance matrix is an important task in applications where the number of variables is larger than the number of observations. Shrinkage approaches for estimating a high-dimensional covariance matrix are often employed to circumvent the limitations of the sample covariance matrix. A new family of nonparametric Stein-type shrinkage covariance estimators is proposed whose members are written as a convex linear combination of the sample covariance matrix and of a predefined invertible target matrix. Under the Frobenius norm criterion, the optimal shrinkage intensity that defines the best convex linear combination depends on the unobserved covariance matrix and it must be estimated from the data. A simple but effective estimation process that produces nonparametric and consistent estimators of the optimal shrinkage intensity for three popular target matrices is introduced. In simulations, the proposed Stein-type shrinkage covariance matrix estimator based on a scaled identity matrix appeared to be up to 80% more efficient than existing ones in extreme high-dimensional settings. A colon cancer dataset was analyzed to demonstrate the utility of the proposed estimators. A rule of thumb for adhoc selection among the three commonly used target matrices is recommended.\n\nWe consider the problem of finding tuned regularized parameter estimators for linear models. We start by showing that three known optimal linear estimators belong to a wider class of estimators that can be formulated as a solution to a weighted and constrained minimization problem. The optimal weights, however, are typically unknown in many applications. This begs the question, how should we choose the weights using only the data? We propose using the covariance fitting SPICE-methodology to obtain data-adaptive weights and show that the resulting class of estimators yields tuned versions of known regularized estimators - such as ridge regression, LASSO, and regularized least absolute deviation. These theoretical results unify several important estimators under a common umbrella. The resulting tuned estimators are also shown to be practically relevant by means of a number of numerical examples.\n\nEstimation of the covariance matrix has attracted a lot of attention of the statistical research community over the years, partially due to important applications such as Principal Component Analysis. However, frequently used empirical covariance estimator (and its modifications) is very sensitive to outliers in the data. As P. J. Huber wrote in 1964, \"...This raises a question which could have been asked already by Gauss, but which was, as far as I know, only raised a few years ago (notably by Tukey): what happens if the true distribution deviates slightly from the assumed normal one? As is now well known, the sample mean then may have a catastrophically bad performance...\" Motivated by this question, we develop a new estimator of the (element-wise) mean of a random matrix, which includes covariance estimation problem as a special case. Assuming that the entries of a matrix possess only finite second moment, this new estimator admits sub-Gaussian or sub-exponential concentration around the unknown mean in the operator norm. We will explain the key ideas behind our construction, as well as applications to covariance estimation and matrix completion problems.\n\nMultivariate time series with long-dependence are observed in many applications such as finance , geophysics or neuroscience. Many packages provide estimation tools for univariate settings but few are addressing the problem of long-dependence estimation for multivariate settings. The package multiwave is providing efficient estimation procedures for multivariate time series. Two semi-parametric estimation methods of the long-memory exponents and long-run covariance matrix of time series are implemented. The first one is the Fourier-based estimation proposed by [18] and the second one is a wavelet-based estimation described in [4]. The objective of this paper is to provide an overview of the R package multiwave with its practical application perspectives."}, {"id": "c2v035", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Muon reconstruction and trigger software performance in CMS was validated to meet design specifications and be well reproduced by simulation, illustrating the importance of simulation benchmarking for acceptance and efficiency corrections [d43425s0p0].", "ev": "The goals of the ongoing and planned ATLAS muon detector upgrades are to increase the acceptance for precision muon momentum measurement and triggering and to improve the rate capability of the muon chambers in the high-background regions corresponding to the increasing LHC luminosity. Smalldiameter Muon Drift Tube (sMDT) chambers have been developed for these purposes. With half the drift-tube diameter of the current ATLAS Muon Drift Tube (MDT) chambers with 30 mm drift tube diameter and otherwise unchanged operating parameters, the sMDT chambers share all the advantages of the MDTs, but have an about an order of magnitude higher rate capability and can be installed in detector regions where MDT chambers do not fit in. The construction of twelve chambers for the feet regions of the ATLAS detector has been completed for the installation in the winter shutdown 2016/17 of the Large Hadron Collider. The purpose of this upgrade of the ATLAS muon spectrometer is to increase the acceptance for three-point muon track measurement which substantially improves the muon momentum resolution in the regions concerned.\n\nThe CMS muon detector system, muon reconstruction software, and high-level trigger underwent significant changes in 2013-2014 in preparation for running at higher LHC collision energy and instantaneous luminosity. The performance of the modified system is studied using proton-proton collision data at center-of-mass energy $\\sqrt{s}=$ 13 TeV, collected at the LHC in 2015 and 2016. The measured performance parameters, including spatial resolution, efficiency, and timing, are found to meet all design specifications and are well reproduced by simulation. Despite the more challenging running conditions, the modified muon system is found to perform as well as, and in many aspects better than, previously. We dedicate this paper to the memory of Prof. Alberto Benvenuti, whose work was fundamental for the CMS muon detector.\n\nLong-range muons produced in proton-proton collisions at the ATLAS interaction point constitute the primary background for neutrino interaction searches at the SND@LHC experiment. This work presents a comprehensive characterization of the muon flux throughout LHC Run-3, benchmarking Monte Carlo simulations against experimental measurements. Measured and simulated muon rates agree within 10-15% across all Run-3 configurations. Following the substantial background increase in 2024 as a result of a beam optics change, the reversion to nominal optics in 2025 did not restore the 2022-2023 levels due to the unprecedented adoption of horizontal crossing in ATLAS. As enlightened by simulation results, the latter enhanced the contribution of high-angle muons originating from diffractive proton losses in the LHC Dispersion Suppressor region. Their identification enabled the design of mitigation strategies that were experimentally validated. The simulation framework was also applied to the future High-Luminosity LHC configuration, resulting in a considerable muon rate rise, driven by both the planned luminosity increase and the enlarged magnet aperture. Nevertheless, the upgrade from emulsion films to silicon vertex detectors will preserve the efficiency of the experiment even in such a high-rate environment."}, {"id": "c2v006", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Robotic grasping in object-stacking or cluttered scenes (e.g., industrial or service robots like Baxter) is a practical application for target-oriented perception and grasp planning [d46284s0p0].", "ev": "Efficient spatial exploration is a key aspect of search and rescue. In this paper, we present a search algorithm that generates efficient trajectories that optimize the rate at which probability mass is covered by a searcher. This should allow an autonomous vehicle find one or more lost targets as rapidly as possible. We do this by performing non-uniform sampling of the search region. The path generated minimizes the expected time to locate the missing target by visiting high probability regions using non-myopic path generation based on reinforcement learning. We model the target probability distribution using a classic mixture of Gaussians model with means and mixture coefficients tuned according to the location and time of sightings of the lost target. Key features of our search algorithm are the ability to employ a very general non-deterministic action model and the ability to generate action plans for any new probability distribution using the parameters learned on other similar looking distributions. One of the key contributions of this paper is the use of non-uniform state aggregation for policy search in the context of robotics.\n\nDetecting road features is a key enabler for autonomous driving and localization. For instance, a reliable detection of poles which are widespread in road environments can improve localization. Modern deep learning-based perception systems need a significant amount of annotated data. Automatic annotation avoids time-consuming and costly manual annotation. Because automatic methods are prone to errors, managing annotation uncertainty is crucial to ensure a proper learning process. Fusing multiple annotation sources on the same dataset can be an efficient way to reduce the errors. This not only improves the quality of annotations, but also improves the learning of perception models. In this paper, we consider the fusion of three automatic annotation methods in images: feature projection from a high accuracy vector map combined with a lidar, image segmentation and lidar segmentation. Our experimental results demonstrate the significant benefits of multi-modal automatic annotation for pole detection through a comparative evaluation on manually annotated images. Finally, the resulting multi-modal fusion is used to fine-tune an object detection model for pole base detection using unlabeled data, showing overall improvements achieved by enhancing network specialization. The dataset is publicly available.\n\nAutonomous robotic grasping plays an important role in intelligent robotics. However, how to help the robot grasp specific objects in object stacking scenes is still an open problem, because there are two main challenges for autonomous robots: (1)it is a comprehensive task to know what and how to grasp; (2)it is hard to deal with the situations in which the target is hidden or covered by other objects. In this paper, we propose a multi-task convolutional neural network for autonomous robotic grasping, which can help the robot find the target, make the plan for grasping and finally grasp the target step by step in object stacking scenes. We integrate vision-based robotic grasping detection and visual manipulation relationship reasoning in one single deep network and build the autonomous robotic grasping system. Experimental results demonstrate that with our model, Baxter robot can autonomously grasp the target with a success rate of 90.6%, 71.9% and 59.4% in object cluttered scenes, familiar stacking scenes and complex stacking scenes respectively.\n\nSmall-object detection in UAV imagery is challenged by weak visual evidence, ambiguous boundaries, dense object distributions, and complex backgrounds. Effective detection therefore requires long-range contextual information for target-background discrimination while preserving explicit local two-dimensional structures for accurate localization. These requirements arise at different stages of the detection pipeline and are not naturally addressed by a uniform feature-processing strategy. We propose Hybrid Dual-domain Mamba-YOLO (HDMamba-YOLO), a stage-wise heterogeneous SSM-CNN detector organized according to a perception-reconstruction-alignment-interaction rationale. EfficientVMamba-based EVSS establishes long-range contextual perception in the backbone, while PhasePatchMerging2D provides phase-aware hierarchical transitions. DST-Wrapper and Native C3k2-ASSAF then perform perception-to-reconstruction transition and repeated local two-dimensional reconstruction during FPN/PAN aggregation. DySample provides content-adaptive cross-scale resampling, while OS-CVTIA introduces macro-micro interaction and task-specific modulation for localization and classification. On VisDrone2019, HDMamba-YOLO-B achieves 42.737% mAP50 and 25.713% mAP50:95 with 10.042M parameters and 29.879 corrected GFLOPs. HDMamba-YOLO-Lite achieves 41.140% mAP50 and 24.741% mAP50:95 with 5.344M parameters. Under the unified AI-TOD evaluation protocol, HDMamba-YOLO-B obtains 21.621% AP and 47.881% AP50. Controlled ablations further support the stage-wise allocation of state-space perception, convolutional reconstruction, dynamic alignment, and task interaction for UAV small-object detection."}, {"id": "c2v032", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Precision comparisons of V+jet measurements to next-to-leading order perturbative QCD reduce theoretical ambiguities from missing higher orders and thereby sharpen constraints on PDFs and heavy-flavor production mechanisms [d8780s0p0].", "ev": "The parton densities of the proton are of fundamental importance not only for our description of hadronic and nuclear structure, but also for reliable predictions for new heavy particle searches at colliders. At the large partonic momentum fractions required for the production of these particles, the parton distribution functions, in particular the one of the gluon, are unfortunately still badly constrained. In this paper, we investigate the possibility to improve on their determination with new data coming from electroweak vector boson production at large transverse momenta at the LHC with center-of-mass energies of 7, 8 or 14 TeV. We demonstrate that this process is dominated by quark-gluon scattering, that theoretical predictions can be reliably made on the basis of next-to-leading order perturbation theory and its resummation, and that these data should thus be used in global fits. We also point out that the non-perturbative parameters determined from Tevatron run-1 Z-boson data at low p_T describe very well the new LHC data at \\sqrt{s}=7 TeV.\n\nVector boson plus jet production is interesting for Higgs search, beyond the Standard Model physics and provides standard candles for calibration. This is complementary to inclusive jet production measurements which provide precision tests of perturbative QCD. A multitude of W/Z plus heavy and light flavour jet measurements in ppbar collisions at a centre of mass energy of sqrt{s}=1.96TeV is discussed. Next-to-Leading order perturbative QCD predictions and various models are compared to the measurements.\n\nHiggs-boson production in association with W or Z bosons, p pbar -> WH/ZH + X, is the most promising discovery channel for a light Standard Model Higgs particle at the Fermilab Tevatron. We present the calculation of the electroweak O(alpha) corrections to these processes. The corrections decrease the theoretical prediction by up to 5-10%, depending in detail on the Higgs-boson mass and the input-parameter scheme. We update the cross-section prediction for associated WH and ZH production at the Tevatron and at the LHC, including the next-to-leading order electroweak and QCD corrections, and study the theoretical uncertainties induced by factorization and renormalization scale dependences and by the parton distribution functions."}, {"id": "c2v009", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Constructions of novel models (Nairian models) built from strong determinacy or large-cardinal hypotheses produce consequences for iterability and thereby identify obstructions to extending descriptive inner model theory beyond limits of Woodin cardinals, affecting determinacy-related analysis and some determinacy consequences indirectly [d104809s0p0].", "ev": "We construct a variety of inner models exhibiting features usually obtained by forcing over universes with large cardinals. For example, if there is a supercompact cardinal, then there is an inner model with a Laver indestructible supercompact cardinal. If there is a supercompact cardinal, then there is an inner model with a supercompact cardinal \\kappa for which 2^\\kappa=\\kappa^+, another for which 2^\\kappa=\\kappa^++ and another in which the least strongly compact cardinal is supercompact. If there is a strongly compact cardinal, then there is an inner model with a strongly compact cardinal, for which the measurable cardinals are bounded below it and another inner model W with a strongly compact cardinal \\kappa, such that H_{\\kappa^+}^V\\subseteq HOD^W. Similar facts hold for supercompact, measurable and strongly Ramsey cardinals. If a cardinal is supercompact up to a weakly iterable cardinal, then there is an inner model of the Proper Forcing Axiom and another inner model with a supercompact cardinal in which GCH+V=HOD holds. Under the same hypothesis, there is an inner model with level by level equivalence between strong compactness and supercompactness, and indeed, another in which there is level by level inequivalence between strong compactness and supercompactness. If a cardinal is strongly compact up to a weakly iterable cardinal, then there is an inner model in which the least measurable cardinal is strongly compact. If there is a weakly iterable limit \\delta of <\\delta-supercompact cardinals, then there is an inner model with a proper class of Laver-indestructible supercompact cardinals. We describe three general proof methods, which can be used to prove many similar results.\n\nSmallish large cardinals $\\kappa$ are often characterized by the existence of a collection of filters on $\\kappa$, each of which is an ultrafilter on the subsets of $\\kappa$ of some transitive $\\mathrm{ZFC}^-$-model of size $ \\kappa$. We introduce a Mitchell-like order for Ramsey and Ramsey-like cardinals, ordering such collections of small filters. We show that the Mitchell-like order and the resulting notion of rank have all the desirable properties of the Mitchell order on normal measures on a measurable cardinal. The Mitchell-like order behaves robustly with respect to forcing constructions. We show that extensions with cover and approximation properties cannot increase the rank of a Ramsey or Ramsey-like cardinal. We use the results about extensions with cover and approximation properties together with recently developed techniques about soft killing of large-cardinal degrees by forcing to softly kill the ranks of Ramsey and Ramsey-like cardinals.\n\nWe introduce a hierarchy of models of the Axiom of Determinacy called \\emph{Nairian models}. Forcing over the simplest Nairian model, we obtain a model of ${\\sf{ZFC}}+{\\sf{MM^{++}}}(c)+\\neg\\square_{\\omega_3}+\\neg\\square(\\omega_3)$. Then, fixing $n\\in [3, \\omega)$, we design a Nairian model and force over it to produce a model of ${\\sf{ZFC}}+{\\sf{MM^{++}}}(c)+\\forall i\\in [2, n]\\, \\neg\\square(\\omega_i)$. We also build a Nairian model that satisfies ${\\sf{ZF}}+\"\\omega_1$ is a supercompact cardinal.\" We obtain as corollaries of these constructions (1) the consistent failure of the Iterability Conjecture for the Mitchell-Schindler $\\sf{K}^{c}$ construction, (2) the consistent failure of the Iterability Conjecture for the $\\sf{K}^{c}$ construction using $2^{2^{\\dots 2^{\\omega}}}$-complete (for any finite stack of exponents) background extenders, answering a strong version of a question asked by Steel, and (3) a negative answer to Trang's question whether ${\\sf{ZF}}+\"\\omega_1$ is a supercompact cardinal\" is equiconsistent with ${\\sf{ZFC}}+\"$there is a proper class of Woodin cardinals that are limits of Woodin cardinals.\" These corollaries identify obstructions to extending the methods of (descriptive) inner model theory past a Woodin cardinal which is a limit of Woodin cardinals."}, {"id": "c2v022", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Key transmitter and receiver signal-processing tasks include synchronization and distribution/coherence across receive channels, beamforming/precoding, channel state information (CSI) acquisition and channel estimation (including beam training for high-dimensional channels), equalization and inter-symbol-interference mitigation, and symbol detection/decoding [d107402s0p0] [d59366s0p0] [d22816s0p0].", "ev": "Multiple-input multiple-output (MIMO) techniques allow for multiplexing and/or diversity gain, and will be widely deployed in future wireless systems. In this paper, we propose a MIMO-assisted channel-based authentication scheme, exploiting current channel estimation mechanisms in MIMO systems to detect spoofing attacks with very low overhead. In this scheme, the use of multiple antennas provides extra dimensions of channel estimation data, and thus leads to a \"security gain\" over single-input single-output (SISO) systems. We investigate the security gain of MIMO systems in several system configurations via simulations for a specific real indoor environment using ray-tracing software. We also discuss the effect of increasing the number of transmit and receive antennas on the security gain and contrast that to the diversity/multiplexing gain.\n\nHolographic multiple-input multiple-output (H-MIMO) systems represent a paradigm shift in wireless communications by enabling quasi-continuous apertures. Unlike conventional MIMO systems, H-MIMO with subwavelength antenna spacing operates in both far-field and near-field regimes, where classical discrete Fourier transform (DFT) representations fail to sufficiently capture the channel characteristics. To address this challenge, this article provides an overview of the emerging wavenumber-domain signal processing framework. Specifically, by leveraging spatial Fourier plane-wave decomposition to model H-MIMO channels, the wavenumber domain offers a unified and physically consistent basis for characterizing subwavelength-level spatial correlation and spherical wave propagation. This article first introduces the concept of H-MIMO and the wavenumber representation of H-MIMO channels. Next, it elaborates on wavenumber-domain signal processing technologies reported in the literature, including multiplexing, channel estimation, and waveform designs. Finally, it highlights open challenges and outlines future research directions in wavenumber-domain signal processing for next-generation wireless systems.\n\nIn future sixth-generation (6G) mobile networks, radar sensing is expected to be offered as an additional service to its original purpose of communication. Merging these two functions results in integrated sensing and communication (ISAC) systems. In this context, bistatic ISAC appears as a possibility to exploit the distributed nature of cellular networks while avoiding highly demanding hardware requirements such as full-duplex operation. Recent studies have introduced strategies to perform required synchronization and data exchange between nodes for bistatic ISAC operation, based on orthogonal frequency-division multiplexing (OFDM), however, only for single-input single-output architectures. In this article, a system concept for a bistatic multiple-input multiple-output (MIMO)-OFDM-based ISAC system with beamforming at both transmitter and receiver is proposed, and a distribution synchronization concept to ensure coherence among the different receive channels for direction-of-arrival estimation is presented. After a discussion on the ISAC processing chain, including relevant aspects for practical deployments such as transmitter digital pre-distortion and receiver calibration, a 4x8 MIMO measurement setup at 27.5 GHz and results are presented to validate the proposed system and distribution synchronization concepts.\n\nThe accuracy of channel state information (CSI) acquisition directly affects the performance of millimeter wave (mmWave) communications. In this article, we provide an overview on CSI acquisition, including beam training and channel estimation for mmWave massive multiple-input multiple-output systems. The beam training can avoid the estimation of a high-dimension channel matrix while the channel estimation can flexibly exploit advanced signal processing techniques. In addition to introducing the traditional and machine learning-based approaches in this article, we also compare different approaches in terms of spectral efficiency, computational complexity, and overhead.\n\nWe investigate massive multiple-input-multiple output (MIMO) uplink systems with 1-bit analog-to-digital converters (ADCs) on each receiver antenna. Receivers that rely on 1-bit ADC do not need energy-consuming interfaces such as automatic gain control (AGC). This decreases both ADC building and operational costs. Our design is based on maximal ratio combining (MRC), zero-forcing (ZF), and least squares (LS) detection, taking into account the effects of the 1-bit ADC on channel estimation. Through numerical results, we show good performance of the system in terms of mutual information and symbol error rate (SER). Furthermore, we provide an analytical approach to calculate the mutual information and SER of the MRC receiver. The analytical approach reduces complexity in the sense that a symbol and channel noise vectors Monte Carlo simulation is avoided.\n\nLinear minimum mean-square error (L-MMSE) equalization is among the most popular methods for data detection in massive multi-user multiple-input multiple-output (MU-MIMO) wireless systems. While L-MMSE equalization enables near-optimal spectral efficiency, accurate knowledge of the signal and noise powers is necessary. Furthermore, corresponding VLSI designs must solve linear systems of equations, which requires high arithmetic precision, exhibits stringent data dependencies, and results in high circuit complexity. This paper proposes the first VLSI design of the NOnParametric Equalizer (NOPE), which avoids knowledge of the transmit signal and noise powers, provably delivers the performance of L-MMSE equalization for massive MU-MIMO systems, and is resilient to numerous system and hardware impairments due to its parameter-free nature. Moreover, NOPE avoids computation of a matrix inverse and only requires hardware-friendly matrix-vector multiplications. To showcase the practical advantages of NOPE, we propose a parallel VLSI architecture and provide synthesis results in 28nm CMOS. We demonstrate that NOPE performs on par with existing data detectors for massive MU-MIMO that require accurate knowledge of the signal and noise powers."}, {"id": "c2v013", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "A joint multimodal VAE learns a shared latent representation that models multiple data modalities together rather than modeling each modality separately [d84235s0p0].", "ev": "Electron, optical, and scanning probe microscopy methods are generating ever increasing volume of image data containing information on atomic and mesoscale structures and functionalities. This necessitates the development of the machine learning methods for discovery of physical and chemical phenomena from the data, such as manifestations of symmetry breaking in electron and scanning tunneling microscopy images, variability of the nanoparticles. Variational autoencoders (VAEs) are emerging as a powerful paradigm for the unsupervised data analysis, allowing to disentangle the factors of variability and discover optimal parsimonious representation. Here, we summarize recent developments in VAEs, covering the basic principles and intuition behind the VAEs. The invariant VAEs are introduced as an approach to accommodate scale and translation invariances present in imaging data and separate known factors of variations from the ones to be discovered. We further describe the opportunities enabled by the control over VAE architecture, including conditional, semi-supervised, and joint VAEs. Several case studies of VAE applications for toy models and experimental data sets in Scanning Transmission Electron Microscopy are discussed, emphasizing the deep connection between VAE and basic physical principles. All the codes used here are available at https://github.com/saimani5/VAE-tutorials and this article can be used as an application guide when applying these to own data sets."}]}];
const KEY = "c2v_v2";
let ans = {}; try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
