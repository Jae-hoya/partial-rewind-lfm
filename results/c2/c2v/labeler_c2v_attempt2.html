<style>
  :root{--bg:#fbfbfa;--fg:#1a1a19;--mut:#6b6b68;--line:#e0e0dc;--acc:#2b5cab;

  @media (prefers-color-scheme:dark){:root{--bg:#17181a;--fg:#e8e8e6;--mut:#9a9a97;
        --line:#31333a;--acc:#7aa2e8;--ok:#5cc38a;--no:#e08b8b;--unk:#d8c07a;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.65 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 16px;z-index:5}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tab{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);
       background:transparent;color:var(--fg);cursor:pointer}
  .tab.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:600}
  .tab .c{color:var(--mut);font-weight:400;margin-left:4px}
  .tab.full .c{color:var(--ok);font-weight:600}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mut{color:var(--mut);font-size:13px}
  details{margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  summary{cursor:pointer;font-weight:600;font-size:13px}
  details p{margin:8px 0 2px;font-size:13.5px}
  h2{font-size:13px;letter-spacing:.04em;color:var(--mut);margin:22px 0 6px}
  .claim{font-size:19px;line-height:1.6;padding:16px 18px;border-radius:10px;
         border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}
  .ev{white-space:pre-wrap;font-size:14px;max-height:46vh;overflow:auto;padding:14px 16px;
      border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--fg) 3%,transparent)}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
         border-top:1px solid var(--line);padding:10px 16px}
  .btns{max-width:860px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;padding:11px 16px;border-radius:9px;border:1.5px solid var(--line);

  .b1{border-color:var(--ok);color:var(--ok)} .b2{border-color:var(--no);color:var(--no)}
  .b3{border-color:var(--unk);color:var(--unk)}
  .b1.on{background:var(--ok);color:#fff} .b2.on{background:var(--no);color:#fff}
  .b3.on{background:var(--unk);color:#fff}

<script>
const SETS = [{"id": "c2v", "name": "문장 지지 (40)", "labels": ["지지", "불지지", "판단불가"], "h_claim": "문장 (모델이 쓴 답의 한 문장)", "h_ev": "근거 (그 문장이 인용한 글)", "items": [{"id": "c2v014", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Optical and cryogenic techniques for levitated particles allow strong isolation and control of center-of-mass and internal temperatures, which supports precision measurements in vacuum [d37076s0p0].", "ev": "Nonlinearities in multimode mechanical systems can give rise to rich dynamical phenomena with great potential for sensing applications and for future quantum experiments. We demonstrate that the coupled center-of-mass and rotational motion of a Meissner-levitated micromagnet offer a promising platform for nonlinear dynamics, combining low dissipation, magnetic tunability, strong intrinsic Duffing nonlinearities, and nonlinear intermodal couplings. We use this tunability to demonstrate the generation of a mechanical frequency comb in the micromagnet dynamics, realized by parametric excitation of two translational modes followed by cascaded nonlinear frequency mixing, which produces a phononic comb with tunable spacing. At large amplitudes, nonlinear coupling to a low-frequency librational mode of the magnet leads to parametric excitation and phase locking of that mode, generating a dense spectral fine structure at subharmonics of the drive. These results establish levitated micromagnets as a platform for nonlinear multimode mechanics, with potential applications in precision sensing and quantum-limited metrology.\n\nWe propose a scheme to create and transfer thermal squeezed states and random-phase coherent states in a system of two interacting levitated nanoparticles. In this coupled levitated system, we create a thermal squeezed state of motion in one of the nanoparticles by parametrically driving it and then transferring the state to the other nanoparticle with high fidelity. The transfer mechanism is based on inducing a non-reciprocal type of coupling in the system by suitably modulating the phases of the trapping lasers and the inter-particle distance between the levitated nanoparticles. This non-reciprocal coupling creates a unidirectional channel where information flows from one nanoparticle to the other nanoparticle but not vice versa, thereby allowing for transfer of mechanical states between the nanoparticles with high fidelity. We also affirm this transfer mechanism by creating and efficiently transferring a random-phase coherent state in the coupled levitated system. Further, we make use of the feedback nonlinearity and parametric driving to create simultaneous bistability in the coupled levitated system. Our results may have potential applications in quantum information processing, quantum metrology, and in exploring many-body physics under a controlled environment.\n\nThe ability to cool and manipulate levitated nano-particles in vacuum is a promising new tool for exploring macroscopic quantum mechanics\\cite{WanPRL2016,Scala2013,Zhang2013}, precision measurements of forces, \\cite{GambhirPRA2016} and non-equilibrium thermodynamics \\cite{GieselerNatNano2014,MillenNat2014}. The extreme isolation afforded by optical levitation offers a low noise, undamped environment that has to date been used to measure zeptonewton forces \\cite{GambhirPRA2016}, radiation pressure shot noise,\\cite{Jain2016} and to demonstrate the cooling of the centre-of-mass motion \\cite{LiNatPhys2011,Gieseler2012}. Ground state cooling, and the creation and measurement of macroscopic quantum superpositions, are now within reach, but control of both the center-of-mass and internal temperature is required. While cooling the centre-of-mass motion to microKelvin temperatures has now been achieved, the internal temperature has remained at or well above room temperature. Here we demonstrate refrigeration of levitated Yb$^{3+}$:YLF from room temperature to 130 K using anti-Stokes fluorescence cooling, while simultaneously using the optical trapping field to align the crystal to maximise cooling."}, {"id": "c2v026", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "RL methods often require large amounts of interaction data and struggle in low-data regimes unless combined with strong priors or model-based components [d104398s0p0].", "ev": "By combining the agility of legged locomotion with the capabilities of manipulation, loco-manipulation platforms have the potential to perform complex tasks in real-world applications. To this end, state-of-the-art quadrupeds with manipulators, such as the Boston Dynamics Spot, have emerged to provide a capable and robust platform. However, the complexity of loco-manipulation control, as well as the black-box nature of commercial platforms, pose challenges for deriving accurate dynamics models and robust control policies. To address these challenges, we turn to model-based reinforcement learning (RL). We develop a hand-crafted kinematic model of a quadruped-with-arm platform which - employing recent advances in Bayesian Neural Network (BNN)-based learning - we use as a physical prior to efficiently learn an accurate dynamics model from limited data. We then leverage our learned model to derive control policies for loco-manipulation via RL. We demonstrate the effectiveness of our approach on state-of-the-art hardware using the Boston Dynamics Spot, accurately performing dynamic end-effector trajectory tracking even in low data regimes. Project website and videos: https://sites.google.com/view/learning-more-with-less."}, {"id": "c2v033", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Finite-size scaling and construction of improved or 'perfect' actions provide numerical/analytical ways to reduce irrelevant operators and study deformations [d141808s0p0].", "ev": "We calculate lattice renormalisation constants of local and one-link quark operators for overlap fermions and improved gauge actions in one-loop perturbation theory. For the local operators we stout smear the SU(3) links in the fermionic action. Using the popular tadpole improved L\\\"uscher-Weisz actions at $\\beta=8.45$ and $\\beta=8.0$ we present numerical values for the Z factors in the $\\bar{MS}$ scheme (partly as function of the stout smearing strength). We compare various levels of mean field (tadpole) improvement which have been applied to our results.\n\nThe hadron mass spectrum is calculated in lattice QCD using a novel fat-link clover fermion action in which only the irrelevant operators of the fermion action are constructed using smeared links. The simulations are performed on a 16^3 X 32 lattice with a lattice spacing of a=0.125 fm. We compare actions with n=4 and 12 smearing sweeps with a smearing fraction of 0.7. The n=4 Fat Link Irrelevant Clover (FLIC) action provides scaling which is superior to mean-field improvement, and offers advantages over nonperturbative O(a) improvement.\n\nUsing Finite-Size Scaling techniques, we numerically show that the first irrelevant operator of the lattice $\\lambda\\phi^4$ theory in three dimensions is (within errors) completely decoupled at $\\lambda=1.0$. This interesting result also holds in the Thermodynamical Limit, where the renormalized coupling constant shows an extraordinary reduction of the scaling-corrections when compared with the Ising model. It is argued that Finite-Size Scaling analysis can be a competitive method for finding improved actions.\n\nWe investigate coupled dynamics of spinless fermions on a one-dimensional lattice and spins on the links. When the hopping integral and the on-site potential of the fermions depend on the direction of the link spins, the low-energy effective theory predicts that the link spins behave as a dynamical axion field in 1+1 dimensions. The axion field $\\theta$ is coupled to the electric field $E$ as $\\theta E$, through which the link spins rotate in response to the applied electric field or the chemical potential gradient for charge-neutral fermions. This is the inverse phenomenon of Thouless pumping in the Rice-Mele model. After analyzing the dynamics by approximating the link spins with the classical ones and utilizing the axion Lagrangian, we show the full-quantum dynamics using the tensor network method. Even though we do not explicitly introduce the axion Lagrangian in solving the fermion-spin coupled many-body dynamics, the full-quantum results agree well with those with the classical spin approximation, including the dynamics of the axion field and fermion transport. In addition, we find that the quantum correlation between spins accelerates the dynamics of axion fields as the suppression of the expectation values of the link spins allows them to rotate easily. We also propose a possible experimental setup for cold-atomic systems to implement the Hamiltonian in this study.\n\nThe calculation of the finite lattice spacing corrections for I=2 pi-pi scattering is carried out for isotropic and anisotropic Wilson lattice actions. Pion masses and decay constants are also determined in this context. These results correct the phase shift calculated from the lattice, which is connected to the scattering length and effective range in this low energy scattering process. When in terms of the lattice-physical parameters for either Wilson action, these lattice spacing effects first appear at the next-to-leading order counter-terms."}, {"id": "c2v030", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "An alternative estimation approach replaces likelihood-based MSE with a robust kernel-based loss that effectively learns noise behavior by estimating the residual density and maximizing its log-likelihood, improving robustness to heavy-tailed disturbances [d115559s0p0].", "ev": "We propose a novel receiver for orthogonal frequency division multiplexing (OFDM) transmissions in impulsive noise environments. Impulsive noise arises in many modern wireless and wireline communication systems, such as Wi-Fi and powerline communications, due to uncoordinated interference that is much stronger than thermal noise. We first show that the bit-error-rate optimal receiver jointly estimates the propagation channel coefficients, the noise impulses, the finite-alphabet symbols, and the unknown bits. We then propose a near-optimal yet computationally tractable approach to this joint estimation problem using loopy belief propagation. In particular, we merge the recently proposed \"generalized approximate message passing\" (GAMP) algorithm with the forward-backward algorithm and soft-input soft-output decoding using a \"turbo\" approach. Numerical results indicate that the proposed receiver drastically outperforms existing receivers under impulsive noise and comes within 1 dB of the matched-filter bound. Meanwhile, with N tones, the proposed factor-graph-based receiver has only O(N log N) complexity, and it can be parallelized.\n\nIn this paper we study how the choice of loss functions of non-convex optimization problems affects their robustness and optimization landscape, through the study of noisy matrix sensing. In traditional regression tasks, mean squared error (MSE) loss is a common choice, but it can be unreliable for non-Gaussian or heavy-tailed noise. To address this issue, we adopt a robust loss based on nonparametric regression, which uses a kernel-based estimate of the residual density and maximizes the estimated log-likelihood. This robust formulation coincides with the MSE loss under Gaussian errors but remains stable under more general settings. We further examine how this robust loss reshapes the optimization landscape by analyzing the upper-bound of restricted isometry property (RIP) constants for spurious local minima to disappear. Through theoretical and empirical analysis, we show that this new loss excels at handling large noise and remains robust across diverse noise distributions. This work offers initial insights into enhancing the robustness of machine learning tasks through simply changing the loss, guided by an intuitive and broadly applicable analytical framework."}, {"id": "c2v012", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "A levitating permanent magnet in a type I superconducting trap has demonstrated displacement sensitivity below 2 picometers and mode temperatures below 10 millikelvin for translational modes [d124482s0p0].", "ev": "Due to their exceptional isolation from the environment, magnetically levitated particles are explored as extremely sensitive mechanical sensors. For future gravity experiments on quantum superpositions, such systems need to be cooled close to their ground state. To demonstrate the combination of state of the art vibration isolation, milligram levitated high Q mechanical resonators and position detection with low noise, we present linear feedback cooling of a magnetically levitated gravity sensor to below 2 picometer amplitude and below 10 millikelvin mode temperature for two translational modes (the x- and y-mode) simultaneously. The sensor is a levitating permanent magnet in a type I superconducting trap, where its six resonance frequencies are measured with a superconducting coil coupled to a DC SQUID. This signal is measured with a lock-in amplifier and a feedback signal is sent to a piezoelectric actuator, allowing the cooling of resonant modes at 50.6 and 68.0 Hz simultaneously. These two translational modes have Q factors of $3.8 \\cdot 10^6$ and $5.5 \\cdot 10^6$ respectively. The experiment is mounted inside a dry dilution refrigerator where it is vibrationally attenuated with 110-130 dB at these frequencies. In this work, we discuss future improvements on the setup which may enable quantum ground state cooling on a magnetically levitated particle, that has previously been shown to be a gravitational sensor."}, {"id": "c2v004", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Back-action-evading or quantum non-demolition measurement schemes and use of squeezed states can reduce added noise and recoil heating, enabling detection beyond the standard quantum limit in levitated optomechanics [d79119s0p0].", "ev": "We theoretically show that laser recoil heating in free-space levitated optomechanics can be arbitrarily suppressed by shining squeezed light onto an optically trapped nanoparticle. The presence of squeezing modifies the quantum electrodynamical light-matter interaction in a way that enables us to control the amount of information that the scattered light carries about a given mechanical degree of freedom. Moreover, we analyze the trade-off between measurement imprecision and back-action noise and show that optical detection beyond the standard quantum limit can be achieved. We predict that, with state-of-the-art squeezed light sources, laser recoil heating can be reduced by at least 60% by squeezing a single Gaussian mode with an appropriate incidence direction, and by 98% by squeezing a properly mode-matched mode. Our results, which are valid both for motional and librational degrees of freedom, will lead to improved feedback cooling schemes as well as boost the coherence time of optically levitated nanoparticles in the quantum regime."}, {"id": "c2v000", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "R-matrix analyses that include ANC constraints enable consistent extraction of resonance energies and partial widths from combined channels and are used to interpret experimental cross sections in radioactive-beam studies [d18533s0p0].", "ev": "The ratio between the rates of the reactions O-17(\\alpha,n)Ne-20 and O-17(\\alpha,\\gamma)Ne-21 determines whether O-16 is an efficient neutron poison for the s process in massive stars, or if most of the neutrons captured by O-16(n,\\gamma) are recycled into the stellar environment. This ratio is of particular relevance to constrain the s process yields of fast rotating massive stars at low metallicity. Recent results on the (\\alpha,\\gamma) channel have made it necessary to measure the (\\alpha,n) reaction more precisely and investigate the effect of the new data on s process nucleosynthesis in massive stars. We present a new measurement of the O-17(\\alpha, n) reaction using a moderating neutron detector. In addition, the (\\alpha, n_1) channel has been measured independently by observation of the characteristic 1633 keV \\gamma-transition in Ne-20. The reaction cross section was determined with a simultaneous R-matrix fit to both channels. (\\alpha,n) and (\\alpha, \\gamma) resonance strengths of states lying below the covered energy range were estimated using their known properties from the literature. A new O-17(\\alpha,n) reaction rate was deduced for the temperature range 0.1 GK to 10 GK. It was found that in He burning conditions the (\\alpha,\\gamma) channel is strong enough to compete with the neutron channel. This leads to a less efficient neutron recycling compared to a previous suggestion of a very weak (\\alpha,\\gamma) channel. S process calculations using our rates confirm that massive rotating stars do play a significant role in the production of elements up to Sr, but they strongly reduce the s process contribution to heavier elements.\n\nWe have studied the 7Be(p,photon)8B reaction in the Halo effective field theory (EFT) framework. The leading order (LO) results were published in Phys.Rev.C89,051602(2014) after the isospin mirror process, 7Li(n,photon)8Li, was addressed in Phys.Rev.C89,024613(2014). In both calculations, one key step was using the final shallow bound state asymptotic normalization coefficients (ANCs) computed by ab initio methods to fix the EFT couplings. Recently we have developed the next-to-LO (NLO) formalism (to appear soon), which could reproduce other model results by no worse than 1% when the 7Be-p energy was between 0 and 0.5 MeV. In our recent report (arXiv:1507.07239), a different approach from that in Phys.Rev.C89,051602(2014) was used. We applied Bayesian analysis to constrain all the NLO-EFT parameters based on measured S-factors, and found tight constraints on the S-factor at solar energies. Our S(E=0 MeV)= 21.3 + - 0.7 eV b. The uncertainty is half of that previously recommended. In this proceeding, we provide extra details of the Bayesian analysis, including the computed EFT parameters' probability distribution functions (PDFs) and how the choice of input data impacts final results."}, {"id": "c2v019", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "High-dimensional output spaces push decoder likelihood variances toward zero in optimal ELBO limits, which makes standard optimization procedures unstable [d55468s0p0].", "ev": "We prove that the evidence lower bound (ELBO) employed by variational auto-encoders (VAEs) admits non-trivial solutions having constant posterior variances under certain mild conditions, removing the need to learn variances in the encoder. The proof follows from an unexpected journey through an array of topics: the closed form optimal decoder for Gaussian VAEs, a proof that the decoder is always smooth, a proof that the ELBO at its stationary points is equal to the exact log evidence, and the posterior variance is merely part of a stochastic estimator of the decoder Hessian. The penalty incurred from using a constant posterior variance is small under mild conditions, and otherwise discourages large variations in the decoder Hessian. From here we derive a simplified formulation of the ELBO as an expectation over a batch, which we call the Batch Information Lower Bound (BILBO). Despite the use of Gaussians, our analysis is broadly applicable -- it extends to any likelihood function that induces a Riemannian metric. Regarding learned likelihoods, we show that the ELBO is optimal in the limit as the likelihood variances approach zero, where it is equivalent to the change of variables formulation employed in normalizing flow networks. Standard optimization procedures are unstable in this limit, so we propose a bounded Gaussian likelihood that is invariant to the scale of the data using a measure of the aggregate information in a batch, which we call Bounded Aggregate Information Sampling (BAGGINS). Combining the two formulations, we construct VAE networks with only half the outputs of ordinary VAEs (no learned variances), yielding improved ELBO scores and scale invariance in experiments. As we perform our analyses irrespective of any particular network architecture, our reformulations may apply to any VAE implementation.\n\nWhile many approaches to improve VQ-VAE performance focus on codebook size and utilization, the effect of dimensional collapse, where trained VQ-VAE representations live in an extremely low-dimensional subspace (1-2% of full rank), remains unaddressed. We show theoretically and empirically that dimension collapse causes a hard loss lower bound that various codebook improvement techniques fail to surpass. Our analytic framework extends the sequential learning effect of Saxe et al. [2014] by introducing ideas from rate-distortion theory and explains how the latent collapse is caused by the VQ suppressing lower-variance directions. Our theory justifies a simple solution: a \"warm-up phase\" that trains the model as an (unquantized) autoencoder before introducing VQ. On both synthetic experiments and large-scale image (VQGAN) and audio (WavTokenizer) VQ-VAEs, we show that AE Warm-Up successfully restores representation dimension, leading to lower reconstruction and perceptual loss at the same training budget. Across codebook sizes $K \\in$ {$2^{10}, 2^{14}, 2^{16}$}, AE warm-up raises VQGAN codebook effective dimension from 3-5 to 17-19 and reduces rFID by 17-35%; on WavTokenizer at $K \\in$ {$2^{13}, 2^{14}$}, it raises codebook dimension from 4 to 17-19 and improves PESQ by 11-14%. We empirically characterize how warm-up duration governs the achievable final loss. In agreement with experiment, our theoretical analysis predicts downstream performance as a function of warm-up length, enabling an adaptive criterion for switching from AE Warm-up to VQ-VAE training."}, {"id": "c2v005", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Small-noise asymptotic regimes require global conditions that replace classical 'not-in-cutlocus' hypotheses for valid density and volatility asymptotics, implying failure of naive perturbation expansions when those global conditions are violated [d18895s0p0].", "ev": "In the compagnion paper [Marginal density expansions for diffusions and stochastic volatility, part I] we discussed density expansions for multidimensional diffusions $(X^1,...,X^d)$, at fixed time $T$ and projected to their first $l$ coordinates, in the small noise regime. Global conditions were found which replace the well-known \"not-in-cutlocus\" condition known from heat-kernel asymptotics. In the present paper we discuss financial applications; these include tail and implied volatility asymptotics in some correlated stochastic volatility models. In particular, we solve a problem left open by A. Gulisashvili and E.M. Stein (2009).\n\nEven though the Madelung equations are central to many 'classical' approaches to the foundations of quantum mechanics such as Bohmian and stochastic mechanics, no coherent mathematical theory has been developed so far for this system of partial differential equations. Wallstrom prominently raised objections against the Madelung equations, aiming to show that no such theory exists in which the system is well-posed and in which the Schr\\\"odinger equation is recovered without the imposition of an additional 'ad hoc quantization condition'--like the one proposed by Takabayasi. The primary objective of our work is to clarify in which sense Wallstrom's objections are justified and in which sense they are not, with a view on the existing literature. We find that it may be possible to construct a mathematical theory of the Madelung equations which is satisfactory in the aforementioned sense, though more mathematical research is required.\n\nWe investigate Wiener-transformable markets, where the driving process is given by an adapted transformation of a Wiener process. This includes processes with long memory, like fractional Brownian motion and related processes, and, in general, Gaussian processes satisfying certain regularity conditions on their covariance functions. Our choice of markets is motivated by the well-known phenomena of the so-called `constant' and `variable depth' memory observed in real world price processes, for which fractional and multifractional models are the most adequate descriptions. Motivated by integral representation results in general Gaussian setting, we study the conditions under which random variables can be represented as pathwise integrals with respect to the driving process. From financial point of view, it means that we give the conditions of replication of contingent claims on such markets. As an application of our results, we consider the utility maximization problem in our specific setting. Note that the markets under consideration can be both arbitrage and arbitrage-free, and moreover, we give the representation results in terms of bounded strategies."}, {"id": "c2v010", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Standard equivalence notions in one dimension include the equivalence between DLR Gibbs measures and conformal measures defined via cocycles [d57117s0p0].", "ev": "We demonstrate the equivalence of two definitions of a Gibbs measure on a subshift over a countable group, namely a conformal measure and a Gibbs measure in the sense of the Dobrushin-Lanford-Ruelle (DLR) equations. We formulate a more general version of the classical DLR equations with respect to a measurable cocycle, which reduce to the classical equations when the cocycle is induced by an interaction or a potential, and show that a measure satisfying these equations must be conformal. To ensure the consistency of these results with earlier work, we review methods of constructing an interaction from a potential and vice versa, such that the interaction and the potential constructed from it, or vice versa, induce the same cocycle.\n\nWe study the thermodynamic formalism for particular types of sub-additive sequences on a class of subshifts over countable alphabets. The subshifts we consider include factors of irreducible countable Markov shifts under certain conditions. We show the variational principle for topological pressure. We also study conditions for the existence and uniqueness of invariant ergodic Gibbs measures and the uniqueness of equilibrium states. As an application, we extend the theory of factors of (generalized) Gibbs measures on subshifts on finite alphabets to that on certain subshifts over countable alphabets.\n\nIn this note, we point out that infinite-volume Gibbs measures of spin glass models on the hypercube can be identified as random probability measures on the unit ball of a Hilbert space. This simple observation follows from a result of Dovbysh and Sudakov on weakly exchangeable random matrices. Limiting Gibbs measures can then be studied as single well-defined objects. This approach naturally extends the space of Random Overlap Structures as defined by Aizenman, Sims and Starr. We discuss the Ruelle Probability Cascades and the stochastic stability within this framework. As an application, we use an idea of Parisi and Talagrand to prove that if a sequence of finite-volume Gibbs measures satisfies the Ghirlanda-Guerra identities, then the infinite-volume measure must be singular as a measure on a Hilbert space."}, {"id": "c2v018", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Methods exist to construct an interaction from a potential and vice versa so that the constructed interaction and potential induce the same cocycle, ensuring consistency of the formalism [d57117s0p0].", "ev": "We demonstrate the equivalence of two definitions of a Gibbs measure on a subshift over a countable group, namely a conformal measure and a Gibbs measure in the sense of the Dobrushin-Lanford-Ruelle (DLR) equations. We formulate a more general version of the classical DLR equations with respect to a measurable cocycle, which reduce to the classical equations when the cocycle is induced by an interaction or a potential, and show that a measure satisfying these equations must be conformal. To ensure the consistency of these results with earlier work, we review methods of constructing an interaction from a potential and vice versa, such that the interaction and the potential constructed from it, or vice versa, induce the same cocycle."}, {"id": "c2v028", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "A finite gluon mass scale on the lattice screens the force responsible for chiral symmetry breaking and raises the critical coupling for the transition [d143397s0p0].", "ev": "We compute the critical coupling constant for the dynamical chiral-symmetry breaking in a model of quantum chromodynamics, solving numerically the quark self-energy using infrared finite gluon propagators found as solutions of the Schwinger-Dyson equation for the gluon, and one gluon propagator determined in numerical lattice simulations. The gluon mass scale screens the force responsible for the chiral breaking, and the transition occurs only for a larger critical coupling constant than the one obtained with the perturbative propagator. The critical coupling shows a great sensibility to the gluon mass scale variation, as well as to the functional form of the gluon propagator.\n\nUsing lattice perturbation theory at finite temperature, we compute for staggered fermions the one-loop fermionic corrections to the spatial and temporal plaquette couplings as well as the leading $Z_N$ symmetry breaking coupling. Numerical and analytical considerations indicate that the finite temperature corrections to the zero-temperature calculation of A. Hasenfratz and T. DeGrand are small for small values of $\\kappa = {1\\over 2m_F}$, but become significant for intermediate values of $\\kappa$. The effect of these finite temperature corrections is to ruin the agreement of the Hasenfratz-DeGrand calculation with Monte Carlo data. We conjecture that the finite temperature corrections are suppressed nonperturbatively at low temperatures, resolving this apparent disagreement. The $Z_N$ symmetry breaking coupling is small; we argue that it may change the order of the transition while having little effect on the critical value of $\\beta$.\n\nWe study a lattice Nambu-Jona-Lasinio model with interacting staggered fermions in the Kogut-Susskind Hamiltonian formalism. The model has a discrete chiral symmetry but not the usual continuous chiral symmetry. In a strong coupling regime for the four-fermion interaction, we prove that the mass of the fermions is spontaneously generated at sufficiently low non-zero temperatures in the dimensions $\\nu \\ge 3$ of the model and zero temperature in $\\nu \\ge 2$. Due to the phase transition, the discrete chiral symmetry of the model is broken. Our analysis is based on the reflection positivity for fermions and the method of the infrared bound."}, {"id": "c2v016", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Topological observables (topological charge in slices or subvolumes) and their autocorrelations, together with diffusion or tunneling rates, are studied to characterize topology and autocorrelation times on finite lattices [d23365s0p0][d30231s0p0].", "ev": "Lattice tensor representations are used to investigate the lattice Landau gauge gluon propagator for the 4-dimensional pure SU(3) Yang-Mills gauge theory. Due to the different symmetry structure of hypercubic lattices compared to the continuum space-time, lattice correlation functions are described by different tensor structures. Therefore, form factors describing lattice correlation functions have, in principle, non-trivial relations with the continuum counterparts. The use of several tensor bases respecting lattice symmetries, and the analysis of its completeness allows to quantify the deviations of the lattice results from the continuum theory, and also estimate the theoretical uncertainty in the propagator. Furthermore, our analysis tests continuum based relations with the lattice data and shows that the lattice Landau gauge gluon propagator is suitably described by a unique form factor, as in the continuum formulation. Additionally, we identified classes of kinematic configurations where these deviations are minimal and the continuum description of lattice tensors is improved.\n\nSeveral ground state properties of the square-lattice $S=1/2$ Heisenberg antiferromagnet are computed (the energy, order parameter, spin stiffness, spinwave velocity, long-wavelength susceptibility, and staggered susceptibility) using extensive quantum Monte Carlo simulations with the stochastic series expansion method. Moderately sized lattices are studied at temperatures $T$ sufficiently low to realize the $T \\to 0$ limit. Results for periodic $L\\times L$ lattices with $L \\in [6,96]$ are tabulated versus $L$ and extrapolations to infinite system size are carried out. The extrapolated ground state energy density is $e_0=-0.669441857(7)$, which represents an improvement in precision of three orders of magnitude over the previously best result. The leading and subleading finite-size corrections to $e_0$ are in full quantitative agreement with predictions from chiral perturbation theory, thus further supporting the soundness of both the extrapolations and the theory. The extrapolated sublattice magnetization is $m_s=0.307447(2)$, which agrees well with previous estimates but with a much smaller statistical error. The coefficient of the linear in $L^{-1}$ correction to $m^2_s$ agrees with the value from chiral perturbation theory and the presence of a factor $\\ln^\\gamma(L)$ in the second-order correction is also confirmed, with the previously not known value of the exponent being $\\gamma = 0.82(4)$. The finite-size corrections to the staggered susceptibility point to logarithmic corrections also in this quantity. To facilitate benchmarking of methods for which periodic boundary conditions are challenging, results for systems with open and cylindrical boundaries are also listed and their spatially inhomogeneous order parameters are analyzed.\n\nWe present detailed calculations for the partition function and the free energy of the finite two-dimensional square lattice Ising model with periodic and antiperiodic boundary conditions, variable aspect ratio, and anisotropic couplings, as well as for the corresponding universal free energy finite-size scaling functions. Therefore, we review the dimer mapping, as well as the interplay between its topology and the different types of boundary conditions. As a central result, we show how both the finite system as well as the scaling form decay into contributions for the bulk, a characteristic finite-size part, and - if present - the surface tension, which emerges due to at least one antiperiodic boundary in the system. For the scaling limit we extend the proper finite-size scaling theory to the anisotropic case and show how this anisotropy can be absorbed into suitable scaling variables.\n\nWe study the dependence of entropy [per lattice site] of six-vertex model on boundary conditions. We start with lattices of finite size and then proceed to thermodynamic limit. We argue that the six-vertex model with periodic, anti-periodic and mixed boundary conditions produce the same free-energy in the thermodynamic limit. We have found fixed boundary conditions such that the entropy varies continously from zero to its value for periodic boundary condition. We have also shown that the physical quantities of the six-vertex model at the isotropic point does not change in the case of singular toroidal boundary.\n\nWe study the autocorrelations of observables constructed from the topological charge density, such as the topological charge on a time slice or in a subvolume, using a series of hybrid Monte Carlo simulations of pure SU(3) gauge theory with both periodic and open boundary conditions. We show that the autocorrelation functions of these observables obey a simple diffusion equation and we measure the diffusion coefficient, finding that it scales like the square of the lattice spacing. We use this result and measurements of the rate of tunneling between topological charge sectors to calculate the scaling behavior of the autocorrelation times of these observables on periodic and open lattices. There is a characteristic lattice spacing at which open boundary conditions become worthwhile for reducing autocorrelations and we show how this lattice spacing is related to the diffusion coefficient, the tunneling rate, and the lattice Euclidean time extent.\n\nIt is well known that the topology of gauge configurations generated in a Markov Monte-Carlo chain freezes as the continuum limit is approached. The corresponding autocorrelation time increases exponentially with the inverse lattice spacing, affecting the ergodicity of the simulation. In SU(N) gauge theories for large N this problem sets in at much coarser lattice spacings than for N=3. This means that its systematics can be studied on lattices that are smaller in terms of the number of lattice sites. It has been shown that using open boundary conditions in time allows instantons to be created and destroyed, restoring topological mobility and ergodicity. However, with open boundary conditions translational invariance is lost and the influence of spurious states propagating from the boundary into the bulk on physical correlators needs to be carefully evaluated. Moreover, while the total topological charge can be changed, the mobility of instantons across the lattice is still reduced. We consider SU(7) Yang-Mills theory and analyse its topological content in the periodic and open boundary condition cases. We also investigate scalar and pseudo-scalar glueball correlation functions.\n\nWe develop coarse-graining tensor renormalization group algorithms to compute physical properties of two-dimensional lattice models on finite periodic lattices. Two different coarse-graining strategies, one based on the tensor renormalization group and the other based on the higher-order tensor renormalization group, are introduced. In order to optimize the tensor-network model globally, a sweeping scheme is proposed to account for the renormalization effect from the environment tensors under the framework of second renormalization group. We demonstrate the algorithms by the classical Ising model on the square lattice and the Kitaev model on the honeycomb lattice, and show that the finite-size algorithms achieve substantially more accurate results than the corresponding infinite-size ones."}, {"id": "c2v031", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Instance-wise customization of randomized-smoothing noise can significantly improve certified robustness margins such as average certified radius (ACR) and clean accuracy compared to universal-noise approaches [d65747s0p0].", "ev": "Deep neural networks have a clear degradation when applying to the unseen environment due to the covariate shift. Conventional approaches like domain adaptation requires the pre-collected target data for iterative training, which is impractical in real-world applications. In this paper, we propose to adapt the deep models to the novel environment during inference. An previous solution is test time normalization, which substitutes the source statistics in BN layers with the target batch statistics. However, we show that test time normalization may potentially deteriorate the discriminative structures due to the mismatch between target batch statistics and source parameters. To this end, we present a general formulation $\\alpha$-BN to calibrate the batch statistics by mixing up the source and target statistics for both alleviating the domain shift and preserving the discriminative structures. Based on $\\alpha$-BN, we further present a novel loss function to form a unified test time adaptation framework Core, which performs the pairwise class correlation online optimization. Extensive experiments show that our approaches achieve the state-of-the-art performance on total twelve datasets from three topics, including model robustness to corruptions, domain generalization on image classification and semantic segmentation. Particularly, our $\\alpha$-BN improves 28.4\\% to 43.9\\% on GTA5 $\\rightarrow$ Cityscapes without any training, even outperforms the latest source-free domain adaptation method.\n\nRandomized smoothing (RS) is an effective and scalable technique for constructing neural network classifiers that are certifiably robust to adversarial perturbations. Most RS works focus on training a good base model that boosts the certified robustness of the smoothed model. However, existing RS techniques treat every data point the same, i.e., the variance of the Gaussian noise used to form the smoothed model is preset and universal for all training and test data. This preset and universal Gaussian noise variance is suboptimal since different data points have different margins and the local properties of the base model vary across the input examples. In this paper, we examine the impact of customized handling of examples and propose Instance-wise Randomized Smoothing (Insta-RS) -- a multiple-start search algorithm that assigns customized Gaussian variances to test examples. We also design Insta-RS Train -- a novel two-stage training algorithm that adaptively adjusts and customizes the noise level of each training example for training a base model that boosts the certified robustness of the instance-wise Gaussian smoothed model. Through extensive experiments on CIFAR-10 and ImageNet, we show that our method significantly enhances the average certified radius (ACR) as well as the clean data accuracy compared to existing state-of-the-art provably robust classifiers.\n\nRandomized smoothing (RS) is a well known certified defense against adversarial attacks, which creates a smoothed classifier by predicting the most likely class under random noise perturbations of inputs during inference. While initial work focused on robustness to $\\ell_2$ norm perturbations using noise sampled from a Gaussian distribution, subsequent works have shown that different noise distributions can result in robustness to other $\\ell_p$ norm bounds as well. In general, a specific noise distribution is optimal for defending against a given $\\ell_p$ norm based attack. In this work, we aim to improve the certified adversarial robustness against multiple perturbation bounds simultaneously. Towards this, we firstly present a novel \\textit{certification scheme}, that effectively combines the certificates obtained using different noise distributions to obtain optimal results against multiple perturbation bounds. We further propose a novel \\textit{training noise distribution} along with a \\textit{regularized training scheme} to improve the certification within both $\\ell_1$ and $\\ell_2$ perturbation norms simultaneously. Contrary to prior works, we compare the certified robustness of different training algorithms across the same natural (clean) accuracy, rather than across fixed noise levels used for training and certification. We also empirically invalidate the argument that training and certifying the classifier with the same amount of noise gives the best results. The proposed approach achieves improvements on the ACR (Average Certified Radius) metric across both $\\ell_1$ and $\\ell_2$ perturbation bounds.\n\nWe propose a novel receiver for orthogonal frequency division multiplexing (OFDM) transmissions in impulsive noise environments. Impulsive noise arises in many modern wireless and wireline communication systems, such as Wi-Fi and powerline communications, due to uncoordinated interference that is much stronger than thermal noise. We first show that the bit-error-rate optimal receiver jointly estimates the propagation channel coefficients, the noise impulses, the finite-alphabet symbols, and the unknown bits. We then propose a near-optimal yet computationally tractable approach to this joint estimation problem using loopy belief propagation. In particular, we merge the recently proposed \"generalized approximate message passing\" (GAMP) algorithm with the forward-backward algorithm and soft-input soft-output decoding using a \"turbo\" approach. Numerical results indicate that the proposed receiver drastically outperforms existing receivers under impulsive noise and comes within 1 dB of the matched-filter bound. Meanwhile, with N tones, the proposed factor-graph-based receiver has only O(N log N) complexity, and it can be parallelized."}, {"id": "c2v002", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Exiting the NTK/lazy regime into a feature-learning (rich) regime produces a transition to significantly more forgetting, i.e., overparameterization no longer guarantees low forgetting when feature learning is high [d110208s0p0]. [d110208s0p0] shows that increasing model width only helps when it reduces feature learning (laziness), so when training departs from lazy assumptions feature learning can induce substantial catastrophic forgetting.", "ev": "Despite recent efforts, neural networks still struggle to learn in non-stationary environments, and our understanding of catastrophic forgetting (CF) is far from complete. In this work, we perform a systematic study on the impact of model scale and the degree of feature learning in continual learning. We reconcile existing contradictory observations on scale in the literature, by differentiating between lazy and rich training regimes through a variable parameterization of the architecture. We show that increasing model width is only beneficial when it reduces the amount of feature learning, yielding more laziness. Using the framework of dynamical mean field theory, we then study the infinite width dynamics of the model in the feature learning regime and characterize CF, extending prior theoretical results limited to the lazy regime. We study the intricate relationship between feature learning, task non-stationarity, and forgetting, finding that high feature learning is only beneficial with highly similar tasks. We identify a transition modulated by task similarity where the model exits an effectively lazy regime with low forgetting to enter a rich regime with significant forgetting. Finally, our findings reveal that neural networks achieve optimal performance at a critical level of feature learning, which depends on task non-stationarity and transfers across model scales. This work provides a unified perspective on the role of scale and feature learning in continual learning.\n\nOnline continual learning (OCL) requires a learner to acquire a sequence of tasks in a single pass over the data, and catastrophic forgetting of earlier tasks remains its central challenge. Despite the many methods proposed to mitigate forgetting, the theoretical understanding of forgetting in OCL is still limited: existing analyses mostly focus on linear, overparameterized, or neural tangent kernel regimes, and it remains unclear which factors govern forgetting and how they affect it. To fill this gap, we analyze single-pass Shuffle SGD under strongly convex and general convex objectives and derive explicit upper bounds on the expected final forgetting. Further analysis of these bounds shows how the per-task data amount, task similarity, and task ordering enter them, and that their effects can differ across objective classes. Moreover, experiments with neural networks on Split-CIFAR-100 and PMNIST show that the trends suggested by our theory also appear in practice, indicating that these insights extend beyond the convex setting."}, {"id": "c2v027", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Continuous deformations that change the action and gauge symmetries also modify background charges and the form of the effective action or potential, linking deformation parameters to changes in renormalized couplings and symmetry-related terms [d145114s0p0].", "ev": "The calculation of the finite lattice spacing corrections for I=2 pi-pi scattering is carried out for isotropic and anisotropic Wilson lattice actions. Pion masses and decay constants are also determined in this context. These results correct the phase shift calculated from the lattice, which is connected to the scattering length and effective range in this low energy scattering process. When in terms of the lattice-physical parameters for either Wilson action, these lattice spacing effects first appear at the next-to-leading order counter-terms.\n\nWe construct and discuss all background charges and continuous consistent deformations of standard $2d$ gravity theories with scalar matter fields. It turns out that the background charges and those deformations which change nontrivially both the form of the action and of its gauge symmetries are closely linked and exist only if the target space has at least one special (`covariantly constant') Killing vector which must be a null vector in the case of the deformations. The deformed actions provide interesting novel $2d$ gravity models. We argue that some of them lead to non-critical string theories."}, {"id": "c2v017", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Active exploration can be driven by estimating information gain of transitions and using that information gain as an exploration reward to guide data-efficient model learning [d94949s0p0].", "ev": "Efficiently tackling multiple tasks within complex environments, such as those found in robot manipulation, remains an ongoing challenge in robotics and an opportunity for data-driven solutions such as reinforcement learning (RL). The high cost of data gathering in robotics encourages data-efficient approaches such as model-based RL, which builds a dynamic model of the robot to conduct most policy learning on cheaper simulations, while enabling data reuse and transfer between tasks. In this work, we employ Bayesian deep learning (BDL) with a double purpose. First, we increase the model quality by improving its calibration. Second, we improve data efficiency by performing active learning of the dynamic model during a preliminary exploration phase, actively estimating the information gain of each transition and using it as the exploration reward. We compare several BDL methods in a realistic robot manipulation setup. Our experiments show that our approach matches the quality of relevant alternatives with much lower robot execution requirements and, unlike previous studies validated only on standard RL environments, we tackle robotic arm end-tasks on a complete manipulator simulator such as \\texttt{CoppeliaSim}. Code is available at https://github.com/ropertunizar/BayesianActiveExploration.\n\nPolicy-based reinforcement learning algorithms are widely used in various fields. Among them, mainstream policy optimization algorithms such as TRPO and PPO introduce importance sampling into policy iteration, which allows the reuse of historical data. However, this can also lead to a high variance of the surrogate objective and indirectly affects the stability and convergence of the algorithm. In this paper, we first derived an upper bound of the surrogate objective variance, which can grow quadratically with the increase of the surrogate objective. Next, we proposed the dropout technique to avoid the excessive increase of the surrogate objective variance caused by importance sampling. Then, we introduced a general reinforcement learning framework applicable to mainstream policy optimization methods, and applied the dropout technique to the PPO algorithm to obtain the D-PPO variant. Finally, we conduct comparative experiments between D-PPO and PPO algorithms in the Atari 2600 environment, and the results show that D-PPO achieved significant performance improvements compared to PPO, and effectively limited the excessive increase of the surrogate objective variance during training.\n\nProximal Policy Optimization (PPO), a popular on-policy deep reinforcement learning method, employs a stochastic policy for exploration. In this paper, we propose a colored noise-based stochastic policy variant of PPO. Previous research highlighted the importance of temporal correlation in action noise for effective exploration in off-policy reinforcement learning. Building on this, we investigate whether correlated noise can also enhance exploration in on-policy methods like PPO. We discovered that correlated noise for action selection improves learning performance and outperforms the currently popular uncorrelated white noise approach in on-policy methods. Unlike off-policy learning, where pink noise was found to be highly effective, we found that a colored noise, intermediate between white and pink, performed best for on-policy learning in PPO. We examined the impact of varying the amount of data collected for each update by modifying the number of parallel simulation environments for data collection and observed that with a larger number of parallel environments, more strongly correlated noise is beneficial. Due to the significant impact and ease of implementation, we recommend switching to correlated noise as the default noise source in PPO."}, {"id": "c2v007", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Prikry-type and Magidor-like forcings are implicated in producing singular cardinals with controlled stationary reflection and failures of combinatorial principles impacting indescribability in consistency results [d52966s0p0].", "ev": "We generalise Jensen's result on the incompatibility of subcompactness with square. We show that alpha^+-subcompactness of some cardinal less than or equal to alpha precludes square_alpha, but also that square may be forced to hold everywhere where this obstruction is not present. The forcing also preserves other strong large cardinals. Similar results are also given for stationary reflection, with a corresponding strengthening of the large cardinal assumption involved. Finally, we refine the analysis by considering Schimmerling's hierarchy of weak squares, showing which cases are precluded by alpha^+-subcompactness, and again we demonstrate the optimality of our results by forcing the strongest possible squares under these restrictions to hold.\n\nWe construct a variety of inner models exhibiting features usually obtained by forcing over universes with large cardinals. For example, if there is a supercompact cardinal, then there is an inner model with a Laver indestructible supercompact cardinal. If there is a supercompact cardinal, then there is an inner model with a supercompact cardinal \\kappa for which 2^\\kappa=\\kappa^+, another for which 2^\\kappa=\\kappa^++ and another in which the least strongly compact cardinal is supercompact. If there is a strongly compact cardinal, then there is an inner model with a strongly compact cardinal, for which the measurable cardinals are bounded below it and another inner model W with a strongly compact cardinal \\kappa, such that H_{\\kappa^+}^V\\subseteq HOD^W. Similar facts hold for supercompact, measurable and strongly Ramsey cardinals. If a cardinal is supercompact up to a weakly iterable cardinal, then there is an inner model of the Proper Forcing Axiom and another inner model with a supercompact cardinal in which GCH+V=HOD holds. Under the same hypothesis, there is an inner model with level by level equivalence between strong compactness and supercompactness, and indeed, another in which there is level by level inequivalence between strong compactness and supercompactness. If a cardinal is strongly compact up to a weakly iterable cardinal, then there is an inner model in which the least measurable cardinal is strongly compact. If there is a weakly iterable limit \\delta of <\\delta-supercompact cardinals, then there is an inner model with a proper class of Laver-indestructible supercompact cardinals. We describe three general proof methods, which can be used to prove many similar results.\n\nIn this paper we prove that from large cardinals it is consistent that there is a singular strong limit cardinal $\\nu$ such that the singular cardinal hypothesis fails at $\\nu$ and every collection of fewer than $\\mathrm{cf}(\\nu)$ stationary subsets of $\\nu^+$ reflects simultaneously. For $\\mathrm{cf}(\\nu) > \\omega$, this situation was not previously known to be consistent. Using different methods, we reduce the upper bound on the consistency strength of this situation for $\\mathrm{cf}(\\nu) = \\omega$ to below a single partially supercompact cardinal. The previous upper bound of infinitely many supercompact cardinals was due to Sharon.\n\nI analyze the hierarchy of large cardinals between a supercompact cardinal and an almost-huge cardinal. Many of these cardinals are defined by modifying the definition of a high-jump cardinal. A high-jump cardinal is defined as the critical point of an elementary embedding $j: V \\to M$ such that $M$ is closed under sequences of length $\\sup\\set{j(f)(\\kappa) \\st f: \\kappa \\to \\kappa}$. Some of the other cardinals analyzed include the super-high-jump cardinals, almost-high-jump cardinals, Shelah-for-supercompactness cardinals, Woodin-for-supercompactness cardinals, \\Vopenka\\ cardinals, hypercompact cardinals, and enhanced supercompact cardinals. I organize these cardinals in terms of consistency strength and implicational strength. I also analyze the superstrong cardinals, which are weaker than supercompact cardinals but are related to high-jump cardinals. Two of my most important results are as follows. \\begin{itemize} \\item \\Vopenka\\ cardinals are the same as Woodin-for-supercompactness cardinals. \\item There are no excessively hypercompact cardinals. \\end{itemize} Furthermore, I prove some results relating high-jump cardinals to forcing, as well as analyzing Laver functions for super-high-jump cardinals. \\keywords{high-jump cardinals \\and \\Vopenka\\ cardinals \\and Woodin-for-supercompactness cardinals \\and hypercompact cardinals \\and forcing and large cardinals \\and Laver functions}\n\nThis paper contributes to the theory of large cardinals beyond the Kunen inconsistency, or choiceless large cardinal axioms, in the context where the Axiom of Choice is not assumed. The first part of the paper investigates a periodicity phenomenon: assuming choiceless large cardinal axioms, the properties of the cumulative hierarchy turn out to alternate between even and odd ranks. The second part of the paper explores the structure of ultrafilters under choiceless large cardinal axioms, exploiting the fact that these axioms imply a weak form of the author's Ultrapower Axiom. The third and final part of the paper examines the consistency strength of choiceless large cardinals, including a proof that assuming DC, the existence of an elementary embedding from $V_{\\lambda+3}$ to $V_{\\lambda+3}$ implies the consistency of ZFC + $I_0$. By a recent result of Schlutzenberg, an elementary embedding from $V_{\\lambda+2}$ to $V_{\\lambda+2}$ does not suffice."}, {"id": "c2v021", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Search and rescue operations are targeted applications for RL-driven adaptive search algorithms that optimize search trajectories [d51509s0p0].", "ev": "Efficient spatial exploration is a key aspect of search and rescue. In this paper, we present a search algorithm that generates efficient trajectories that optimize the rate at which probability mass is covered by a searcher. This should allow an autonomous vehicle find one or more lost targets as rapidly as possible. We do this by performing non-uniform sampling of the search region. The path generated minimizes the expected time to locate the missing target by visiting high probability regions using non-myopic path generation based on reinforcement learning. We model the target probability distribution using a classic mixture of Gaussians model with means and mixture coefficients tuned according to the location and time of sightings of the lost target. Key features of our search algorithm are the ability to employ a very general non-deterministic action model and the ability to generate action plans for any new probability distribution using the parameters learned on other similar looking distributions. One of the key contributions of this paper is the use of non-uniform state aggregation for policy search in the context of robotics."}, {"id": "c2v039", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Cohomology theories for Hom-Lie and Hom-pre-Lie algebras are formulated with differentials and complexes that depend on the twisting map, and the cohomology framework for Hom-Lie algebras is explicitly used to study Hom-pre-Lie bialgebras [d55626s0p0].", "ev": "In this paper we introduce the notion of Hom-pre-Lie bialgebra in the general framework of the cohomology theory for Hom-Lie algebras. We show that Hom-pre-Lie bialgebras, standard Manin triples for Hom-pre-Lie algebras and certain matched pairs of Hom-pre-Lie algebras are equivalent. Due to the usage of the cohomology theory, it makes us successfully study the coboundary Hom-pre-Lie bialgebras. The notion of Hom-s-matrix is introduced, by which we can construct Hom-pre-Lie bialgebras naturally. Finally we introduce the notions of Hom-O-operators on Hom-pre-Lie algebras and Hom-L-dendriform algebras, by which we construct Hom-s-matrices."}, {"id": "c2v020", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Mean-square error (weighted sum-MSE or max weighted MSE) is a common metric for transceiver optimization performance [d21050s0p0].", "ev": "The OFDM sequences with low correlation sidelobe level (SLCL) is desired in many 5G wireless systems. In this letter, the OFDM sequences and mismatch filter are jointly designed to achieve the SLCL under the constraints of spectra and peak to average power ratio (PAPR). Specifically, we formulate the optimization problem by maximizing the peak side lobe ratio (PSLR) of the cross-correlation between the OFDM sequences and mismatch filter, subject to several practice constraints. To solve the nonconvex problem, an efficient alternating optimization (AltOpt) algorithm is proposed. Numerical simulations are provided to demonstrate the effectiveness of the proposed algorithms.\n\nThis paper addresses the joint transceiver design for downlink multiuser multiple-input multiple-output (MIMO) systems, with imperfect channel state information (CSI) at the base station (BS) and mobile stations (MSs). By incorporating antenna correlation at both ends of the channel and taking channel estimation errors into account, we solve two robust design problems: minimization of the weighted sum mean-square-error (MSE) and minimization of the maximum weighted MSE. These problems are solved as follows: first, we establish three kinds of MSE uplink-downlink duality by transforming only the power allocation matrices from uplink channel to downlink channel and vice versa. Second, in the uplink channel, we formulate the power allocation part of each problem ensuring global optimality. Finally, based on the solution of the uplink power allocation and the MSE duality results, for each problem, we propose an iterative algorithm that performs optimization alternatively between the uplink and downlink channels. Computer simulations verify the robustness of the proposed design compared to the non-robust/naive design.\n\nConstant envelope (CE) precoding is an appealing transmission technique, which enables highly efficient power amplification, and is realizable with a single radio frequency (RF) chain at the multi-antenna transmitter. In this paper, we study the transceiver design for a point-to-point multiple-input multiple-output (MIMO) system with CE precoding. Both single-stream transmission (i.e., beamforming) and multi-stream transmission (i.e., spatial multiplexing) are considered. For single-stream transmission, we optimize the receive beamforming vector to minimize the symbol error rate (SER) for any given channel realization and desired constellation at the combiner output. By reformulating the problem as an equivalent quadratically constrained quadratic program (QCQP), we propose an efficient semi-definite relaxation (SDR) based algorithm to find an approximate solution. Next, for multi-stream transmission, we propose a new scheme based on antenna grouping at the transmitter and minimum mean squared error (MMSE) or zero-forcing (ZF) based beamforming at the receiver. The transmit antenna grouping and receive beamforming vectors are then jointly designed to minimize the maximum SER over all data streams. Finally, the error-rate performance of single- versus multi-stream transmission is compared via simulations under different setups.\n\nThis work investigates the performance of intelligent reflective surfaces (IRSs) assisted uplink non-orthogonal multiple access (NOMA) in energy-constrained networks. Specifically, we formulate and solve two optimization problems; the first aims at minimizing the sum of users' transmit power, while the second targets maximizing the system level energy efficiency (EE). The two problems are solved by jointly optimizing the users' transmit powers and the beamforming coefficients at IRS subject to the users' individual uplink rate and transmit power constraints. A novel and low complexity algorithm is developed to optimize the IRS beamforming coefficients by optimizing the objective function over a \\textit{complex circle manifold} (CCM). To efficiently optimize the IRS phase shifts over the manifold, the optimization problem is reformulated into a feasibility expansion problem which is reduced to a max-min signal-plus-interference-ratio (SINR). Then, with the aid of a smoothing technique, the exact penalty method is applied to transform the problem from constrained to unconstrained. The proposed solution is compared against three semi-definite programming (SDP)-based benchmarks which are semi-definite relaxation (SDR), SDP-difference of convex (SDP-DC) and sequential rank-one constraint relaxation (SROCR). The results show that the manifold algorithm provides better performance than the SDP-based benchmarks, and at a much lower computational complexity for both the transmit power minimization and EE maximization problems. The results also reveal that IRS-NOMA is only superior to orthogonal multiple access (OMA) when the users' target achievable rate requirements are relatively high."}, {"id": "c2v029", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "For advanced LIGO–type detectors, eccentric mergers with initial eccentricity up to e0 ≤ 0.4 at fGW = 10 Hz produce equal or larger SNRs than quasi-circular mergers for comparable masses and mass ratios [d60694s0p0].", "ev": "Orbital eccentricity in compact binary mergers carries crucial information about the binary's formation and environment. There are emerging signs that some of the mergers detected by the LIGO and Virgo gravitational wave detectors could indeed be eccentric. Nevertheless, the identification of eccentricity via gravitational waves remains challenging, to a large extent because of the limited availability of eccentric gravitational waveforms. While multiple suites of eccentric waveforms have recently been developed, they each cover only a part of the binary parameter space. Here we evaluate the sensitivity of LIGO to eccentric waveforms from the SXS and RIT numerical relativity catalogs and the TEOBResumS-Dali waveform model using data from LIGO-Virgo-Kagra's third observing run. The obtained sensitivities, as functions of eccentricity, mass and mass ratio, are important inputs to understanding detection prospects and observational population constrains. In addition, our results enable the comparison of the waveforms to establish their compatibility and applicability for searches and parameter estimation.\n\n[Abridged] We introduce an improved version of the Eccentric, Non-spinning, Inspiral-Gaussian-process Merger Approximant (ENIGMA) waveform model. We find that this ready-to-use model can: (i) produce physically consistent signals when sampling over 1M samples chosen over the $m_{\\{1,\\,2\\}}\\in[5M_{\\odot},\\,50M_{\\odot}]$ parameter space, and the entire range of binary inclination angles; (ii) produce waveforms within 0.04 seconds from an initial gravitational wave frequency $f_{\\textrm{GW}} =15\\,\\textrm{Hz}$ and at a sample rate of 8192 Hz; and (iii) reproduce the physics of quasi-circular mergers. We utilize ENIGMA to compute the expected signal-to-noise ratio (SNR) distributions of eccentric binary black hole mergers assuming the existence of second and third generation gravitational wave detector networks that include the twin LIGO detectors, Virgo, KAGRA, LIGO-India, a LIGO-type detector in Australia, Cosmic Explorer, and the Einstein Telescope. In the context of advanced LIGO-type detectors, we find that the SNR of eccentric mergers is always larger than quasi-circular mergers for systems with $e_0\\leq0.4$ at $f_{\\textrm{GW}} =10\\,\\textrm{Hz}$, even if the timespan of eccentric signals is just a third of quasi-circular systems with identical total mass and mass-ratio. For Cosmic Explorer-type detector networks, we find that eccentric mergers have similar SNRs than quasi-circular systems for $e_0\\leq0.3$ at $f_{\\textrm{GW}} =10\\,\\textrm{Hz}$. Systems with $e_0\\sim0.5$ at $f_{\\textrm{GW}} =10\\,\\textrm{Hz}$ have SNRs that range between 50%-90% of the SNR produced by quasi-circular mergers, even if these eccentric signals are just between a third to a tenth the length of quasi-circular systems. For Einstein Telescope-type detectors, we find that eccentric mergers have similar SNRs than quasi-circular systems for $e_0\\leq0.4$ at $f_{\\textrm{GW}} =5\\,\\textrm{Hz}$."}, {"id": "c2v003", "rules": "지지: 문장의 모든 사실이 근거에 명시돼 있거나 직접 따라 나온다. / 불지지: 사실 중 하나라도 근거에 없거나 어긋난다. 부분 지지도 불지지. / 판단불가: 문장 자체가 모호해 사실을 특정할 수 없을 때만. 근거 부족은 불지지.", "claim": "Deep tactile MPC enabled real-world tactile servoing to reposition objects such as a ball, an analog stick, and a 20-sided die using learned tactile predictive models, demonstrating improved continuous non-prehensile manipulation from touch [d49459s0p0].", "ev": "Contact-rich manipulation is difficult for robots to execute and requires accurate perception of the environment. In some scenarios, vision is occluded. The robot can then no longer obtain real-time scene state information through visual feedback. This is called ``blind manipulation\". In this manuscript, a novel physically-driven contact cognition method, called ``Contact SLAM\", is proposed. It estimates the state of the environment and achieves manipulation using only tactile sensing and prior knowledge of the scene. To maximize exploration efficiency, this manuscript also designs an active exploration policy. The policy gradually reduces uncertainties in the manipulation scene. The experimental results demonstrated the effectiveness and accuracy of the proposed method in several contact-rich tasks, including the difficult and delicate socket assembly task and block-pushing task.\n\nWe present an intelligent interactive nightstand mounted on a mobile robot, to aid the elderly in their homes using physical, tactile and visual percepts. We show the integration of three different sensing modalities for controlling the navigation of a robot mounted nightstand within the constrained environment of a general purpose living room housing a single aging individual in need of assistance and monitoring. A camera mounted on the ceiling of the room, gives a top-down view of the obstacles, the person and the nightstand. Pressure sensors mounted beneath the bed-stand of the individual provide physical perception of the person's state. A proximity IR sensor on the nightstand acts as a tactile interface along with a Wii Nunchuck (Nintendo) to control mundane operations on the nightstand. Intelligence from these three modalities are combined to enable path planning for the nightstand to approach the individual. With growing emphasis on assistive technology for the aging individuals who are increasingly electing to stay in their homes, we show how ubiquitous intelligence can be brought inside homes to help monitor and provide care to an individual. Our approach goes one step towards achieving pervasive intelligence by seamlessly integrating different sensors embedded in the fabric of the environment.\n\nCan a robot grasp an unknown object without seeing it? In this paper, we present a tactile-sensing based approach to this challenging problem of grasping novel objects without prior knowledge of their location or physical properties. Our key idea is to combine touch based object localization with tactile based re-grasping. To train our learning models, we created a large-scale grasping dataset, including more than 30 RGB frames and over 2.8 million tactile samples from 7800 grasp interactions of 52 objects. To learn a representation of tactile signals, we propose an unsupervised auto-encoding scheme, which shows a significant improvement of 4-9% over prior methods on a variety of tactile perception tasks. Our system consists of two steps. First, our touch localization model sequentially 'touch-scans' the workspace and uses a particle filter to aggregate beliefs from multiple hits of the target. It outputs an estimate of the object's location, from which an initial grasp is esta
