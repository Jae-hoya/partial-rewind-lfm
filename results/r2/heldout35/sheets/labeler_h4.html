s began as web novels on user-generated platforms like Shōsetsuka ni Narō?", "ev": "My One-Hit Kill Sister originated as a web novel serialized on Shōsetsuka ni Narō from December 2019 to June 2023. True Love Fades Away When the Contract Ends was serialized on Shōsetsuka ni Narō between May 2020 and July 2021. The White Cat's Revenge as Plotted from the Dragon King's Lap began on Shōsetsuka ni Narō in January 2015 and remained serialized there through March 2024. Roll Over and Die began as a web novel on Shōsetsuka ni Narō in January 2018 before being acquired for print publication. If It's for My Daughter, I'd Even Defeat a Demon Lord began serialization on Shōsetsuka ni Narō in August 2014 before being acquired by Hobby Japan for light-novel publication."}, {"id": "h4011", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What formal changes to party statutes, candidate selection processes, or leadership structures are credited to the politician?", "ev": "In 2018 the politician Uddhav Thackeray oversaw amendments to the Shiv Sena party constitution that were criticised for centralising control of the party and limiting free, fair and transparent elections for party positions. The Election Commission of India deemed those 2018 amendments undemocratic, and this finding further eroded his control over the party."}, {"id": "h4012", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What changes in government funding, grants, or institutional support for disability sport in Australia followed the 1976 Paralympics?", "ev": "In 1980 John Grant wrote to the Minister for Sport, Bob Ellicott, arguing the case for a national policy on sport for people with disabilities. Subsequently the Australian Government established a national advisory committee on sports for disabled persons and John Grant was a member of that committee."}, {"id": "h4013", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "In which year was the Wake Forest player drafted, by which NBA team, and at what draft position?", "ev": "He was selected number one overall by the San Antonio Spurs in the 1997 NBA Draft."}, {"id": "h4014", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What tie-breaking procedures and qualification criteria were specified for advancing between heats, semifinals, and the final?", "ev": "The competition was staged over 12 shows with artists competing independently from songs and composers agreeing that songs could be offered to artists other than the original intended performer. The first show was a non-elimination jubilee concert; the second and third shows each featured ten artists with five eliminated from each show. From the fourth to the tenth shows one artist was eliminated in each show and the remaining three artists advanced in the competition after those shows. Starting from the fifth show the 16 potential Eurovision songs competed weekly and 13 songs were eliminated by the end of the tenth show leaving three songs remaining. The eleventh show (semi-final) selected only the winning song from the remaining three songs. The twelfth show (final) selected the winning artist–song combination from the remaining three artists. Ties in elimination shows and in the semi-final were decided in favour of the entry that received the most public votes, while ties in the final were decided in favour of the entry awarded the most points by the jury."}, {"id": "h4015", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How did his teaching affect the in-ring styles, move sets, or character work of those he trained?", "ev": "George Tragos taught Lou Thesz submission wrestling and how to wrestle from the bottom, shaping his technical foundation. Ad Santel's intensive instruction helped establish Thesz as one of the most dangerous grapplers in the world. Ed \"Strangler\" Lewis taught Thesz extremely painful and potentially crippling submission holds that influenced his in-ring arsenal."}, {"id": "h4016", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What disputes arose over representation of Bosnia's ethnic groups within the national team and football association?", "ev": "Football was divided along ethnic lines during and after the Bosnian War, producing disputes over representation between Bosniaks, Croats and Serbs in national structures and teams. In 1993 Bosnian Croats launched the Football Federation of Herzeg-Bosnia and a Croat-only First League of Herzeg-Bosnia. In the same year Bosnian Serbs organised the First League of the Republika Srpska on territory controlled by the Republika Srpska regime. Competition under the Bosnian FA (N/FSBiH) came largely to a standstill and its competitions reflected a Bosniak majority in that period."}, {"id": "h4017", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What official investigations, charges, or prosecutions have been opened against the politician, and what were their outcomes?", "ev": "Four criminal indictments were filed against Donald Trump in 2023: two state-level (New York in March 2023 and Georgia in August 2023) and two federal (one in Florida and one in the District of Columbia). The March 2023 New York state indictment charged Trump with 34 counts of falsifying business records related to payments to Stormy Daniels; his trial began April 15, 2024, he was found guilty on all 34 counts on May 30, 2024, and he received an unconditional discharge of his sentence on January 10, 2025. The August 14, 2023 Fulton County, Georgia indictment charged Trump and 18 co-defendants under Georgia's RICO statute and with multiple related counts (including plotting fake electors and pressuring Secretary of State Raffensperger); Trump initially faced 13 criminal charges (with five dismissed later) and the case was paused pending a prosecutor issue before ultimately having all remaining charges dropped on November 26, 2025. The two federal indictments were dismissed after Trump won the 2024 election and related developments in the Justice Department; the Supreme Court ruled on July 1, 2024 that presidents have immunity for official acts but not unofficial acts, and the federal cases were later dismissed with additional departures from the investigative teams reported by March 2026."}, {"id": "h4018", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What official adaptations (e.g., illustrated webtoon, print, audio, TV, film) were produced, with release dates and producing companies?", "ev": "The light novel was acquired and began publication under Kodansha Ranobe Books in June 2022. A manga adaptation illustrated by Lee Brocco began serialization on Kodansha's YanMaga Web manga website and app on February 11, 2022 and was transferred to Weekly Young Magazine on September 9, 2024. The manga's chapters have been compiled into seventeen tankōbon volumes as of April 2026 and are published in English on Kodansha's K Manga app, with Seven Seas Entertainment announcing an English license in July 2025. An anime television series adaptation produced by GoHands is set to premiere in July 2026."}, {"id": "h4019", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What formal or informal qualifications, prior experiences, or mentorships prepared him for training and production work?", "ev": "He had a long career as a professional and competitive catch wrestler before transitioning to coaching and promotion, providing practical experience for training and production roles. He served as a promoter, special guest referee, announcer and commissioner, giving him varied industry experience relevant to training and production work. He maintained mentorship and professional relationships with notable figures (including his student Gene LeBell and associations with Gokor Chivichyan and LeBell's Hayastan MMA Academy), which informed his coaching and teaching activities."}, {"id": "h4020", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "Which n                            localStorage.setItem(KEY + "_pos", JSON.stringify([si, i])); } catch (e) {} };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const filled = s => Object.keys(ans[s.id]).filter(k => s.items.some(x => x.id === k)).length;

function renderTabs() {
  const t = document.getElementById("tabs"); t.innerHTML = "";
  SETS.forEach((s, k) => {
    const b = document.createElement("button");
    const n = filled(s);
    b.className = "tab" + (k === si ? " on" : "") + (n === s.items.length ? " full" : "");
    b.innerHTML = esc(s.name) + '<span class="c">' + n + "/" + s.items.length + "</span>";
    b.onclick = () => { si = k; i = 0; const j = s.items.findIndex(x => !ans[s.id][x.id]); if (j >= 0) i = j; render(); };
    t.appendChild(b);
  });
}
function render() {
  const s = SETS[si], it = s.items[i];
  renderTabs();
  document.getElementById("pos").textContent = s.name + "  " + (i + 1) + " / " + s.items.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("h_claim").textContent = s.h_claim;
  document.getElementById("h_ev").textContent = s.h_ev;
  document.getElementById("claim").textContent = it.claim;
  document.getElementById("ev").textContent = it.ev;
  document.getElementById("ev").scrollTop = 0;
  document.querySelectorAll("[data-k]").forEach(b => {
    const v = s.labels[+b.dataset.k];
    b.querySelector("span").textContent = v;
    b.classList.toggle("on", ans[s.id][it.id] === v);
  });
  const tot = SETS.reduce((a, x) => a + x.items.length, 0), got = SETS.reduce((a, x) => a + filled(x), 0);
  document.getElementById("cnt").innerHTML = got === tot
    ? '<span class="done">전부 완료 — CSV 를 내려받으세요</span>' : ("전체 " + got + " / " + tot);
  document.getElementById("pb").style.width = (100 * got / tot) + "%";
  save();
}
function pick(k) {
  const s = SETS[si];
  ans[s.id][s.items[i].id] = s.labels[k]; save();
  if (i < s.items.length - 1) i++;
  render();
}
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pick(+b.dataset.k));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < SETS[si].items.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  for (let d = 0; d < SETS.length; d++) {
    const k = (si + d) % SETS.length, j = SETS[k].items.findIndex(x => !ans[SETS[k].id][x.id]);
    if (j >= 0) { si = k; i = j; render(); return; }
  }
  alert("전부 채웠습니다. CSV 를 내려받으세요.");
};
document.onkeydown = e => {
  if (e.key === "1") pick(0); else if (e.key === "2") pick(1); else if (e.key === "3") pick(2);
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["set", "item_id", "human_label"].join(",")];
  for (const s of SETS) for (const x of s.items) rows.push([q(s.id), q(x.id), q(ans[s.id][x.id] || "")].join(","));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "labels_h4_filled.csv"; a.click();
};
render();
</script></body></html>
