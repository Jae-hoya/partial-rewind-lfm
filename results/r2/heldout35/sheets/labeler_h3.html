<style>
  :root{--bg:#fbfbfa;--fg:#1a1a19;--mut:#6b6b68;--line:#e0e0dc;--acc:#2b5cab;

  @media (prefers-color-scheme:dark){:root{--bg:#17181a;--fg:#e8e8e6;--mut:#9a9a97;
        --line:#31333a;--acc:#7aa2e8;--ok:#5cc38a;--no:#e08b8b;--unk:#d8c07a;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.65 -apple-system,"Segoe UI",Roboto,"Malgun Gothic",sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);
         padding:10px 16px;z-index:5}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .tab{font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1.5px solid var(--line);
       background:transparent;color:var(--fg);cursor:pointer}
  .tab.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:600}
  .tab .c{color:var(--mut);font-weight:400;margin-left:4px}
  .tab.full .c{color:var(--ok);font-weight:600}
  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
  .bar i{display:block;height:100%;background:var(--acc);transition:width .2s}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mut{color:var(--mut);font-size:13px}
  details{margin:10px 0;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
  summary{cursor:pointer;font-weight:600;font-size:13px}
  details p{margin:8px 0 2px;font-size:13.5px}
  h2{font-size:13px;letter-spacing:.04em;color:var(--mut);margin:22px 0 6px}
  .claim{font-size:19px;line-height:1.6;padding:16px 18px;border-radius:10px;
         border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 7%,transparent)}
  .ev{white-space:pre-wrap;font-size:14px;max-height:46vh;overflow:auto;padding:14px 16px;
      border:1px solid var(--line);border-radius:10px;background:color-mix(in srgb,var(--fg) 3%,transparent)}
  footer{position:fixed;left:0;right:0;bottom:0;background:var(--bg);
         border-top:1px solid var(--line);padding:10px 16px}
  .btns{max-width:860px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;padding:11px 16px;border-radius:9px;border:1.5px solid var(--line);
         background:transparent;color:var(--fg);cursor:pointer}
  button:hover{border-color:var(--acc)}
  .b1{border-color:var(--ok);color:var(--ok)} .b2{border-color:var(--no);color:var(--no)}
  .b3{border-color:var(--unk);color:var(--unk)}
  .b1.on{background:var(--ok);color:#fff} .b2.on{background:var(--no);color:#fff}
  .b3.on{background:var(--unk);color:#fff}
  .sp{flex:1} kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
  .done{color:var(--ok);font-weight:600}

ed for driving up housing prices and displacing lower-income residents, contributing to homelessness and gentrification. Homeowners in high-cost neighborhoods have used land-use policies to exclude newcomers and preserve exclusive areas. Efforts to require developers to include affordable units have been politically contentious but were adopted in some places, such as Montgomery County's zoning that required set-asides and took seven years to pass. Zoning laws that limit new housing construction have been linked to reduced affordability and increased racial and economic segregation, fueling controversy over reform."}, {"id": "h3008", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "When did Bosnia and Herzegovina form an independent national men's football team after the breakup of Yugoslavia?", "ev": "A hastily arranged Bosnia-Herzegovina humanitarian team played two friendlies in March 1993 as an initial step toward forming a national side. The Bosnia and Herzegovina national team began playing official matches in late November 1995."}, {"id": "h3009", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "Which authors and series exemplify successful transitions from web novel to multi-media franchise?", "ev": "Kozusu Kobato wrote True Love Fades Away When the Contract Ends, which moved from Shōsetsuka ni Narō to a commercial light novel publication under Micro Magazine's Maple Novels imprint. Kiki wrote Roll Over and Die, which began on Shōsetsuka ni Narō and was acquired by Micro Magazine for release under their GC Novels imprint. Konoe wrote My One-H -Bosnia and a Croat-only league in 1993. The Bosnian Serbs organized the First League of the Republika Srpska on territory held by the Republika Srpska regime in 1993. The Bosnian Football Association (N/FSBiH) operated predominantly under Bosniak-majority institutions during the war period. Competing Serb and Croat nationalist claims affected the broader societal context in which these football divisions occurred."}, {"id": "h3012", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What recurring critical limitations were cited in reviews (e.g., pacing, characterization, artwork quality) across authoritative sources?", "ev": "Reviewers generally praised Hanamori's artwork as delicate and curvy. Publishers Weekly described the first volume as an \"industrial-strength shōjo\" with \"cardboard villains\" and a \"recycled love story\". Anime News Network stated that, for older readers, the story was childish and \"barely coherent\" with confusing narrative gaps. Mania.com scored volumes Cs and below and gave the final volume an F−, calling the characters and storytelling \"offensively stupid\"."}, {"id": "h3013", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What documented factional disputes or leadership challenges have occurred within Welsh Labour in the past twenty years?", "ev": "Welsh Labour went through four leaders in just over two years, including Mark Drakeford, Vaughan Gething and Eluned Morgan, indicating repeated leadership turnover. Vaughan Gething's government lasted only until July 2024 due to two distinct scandals relating to allegations of cronyism and that he had lied about deleting COVID-19 pandemic-related text messages. Eluned Morgan became leader after an uncontested July 2024 election and then failed to win her seat in 2026, prompting her resignation and a new leadership contest. Ken Skates was appointed as interim leader on 9 May 2026 following Morgan's resignation."}, {"id": "h3014", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "Which stylistic features (first-person vs third-person, episodic chapters, author interjections) are common in web-originated isekai works?", "ev": "Web-originated isekai works commonly begin as serialized uploads on platforms like Shōsetsuka ni Narō, producing chapter-by-chapter releases later collected into light novel volumes as with Mushoku Tensei. Serialization across web and comic platforms frequently produces multi-format storytelling, as Solo Leveling moved from web novel to webtoon, collected volumes, and anime seasons. Light novel editions of web serials often add illustrations and organized volume releases, as seen with The White Cat's Revenge moving from web serialization to illustrated light novel volumes."}, {"id": "h3015", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How have military conflicts, border changes, or security policies physically altered the city's infrastructure and territory?", "ev": "Prolonged armed conflict—such as the Turkish-Kurdish insurgency led by the PKK—has been a persistent source of violence affecting border cities in the region. Airstrikes and government bombing campaigns, including use of napalm and attacks on villages, physically destroyed Kurdish villages and infrastructure during conflicts with state forces. Syrian military operations crossed borders into Kurdish areas during campaigns against Kurdish fighters, altering control of towns and border zones."}, {"id": "h3016", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What notable match losses or periods of decline have been reported for the player, including dates and opponents?", "ev": "Khalid Al-Harbi was eliminated from the 2004 Athens Olympics after losing to Serbian player Aleksandar Karakašević in four straight sets. Saudi Arabia's table tennis team, with Khalid Al-Harbi as part of the squad, lost the final match to the Egyptian team at the 2011 Arab Games in Doha."}, {"id": "h3017", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What competing historical narratives or territorial claims exist regarding the city's past and control?", "ev": "The 2017 Kurdistan Region independence referendum was regarded as illegal by the federal government in Baghdad and Iraq's Supreme Federal Court ruled that no province may secede, producing a direct legal challenge to Kurdish territorial claims. The Kurdistan Regional Government announced it would respect the Supreme Federal Court's ruling and called for an inclusive national dialogue between Erbil and Baghdad to resolve disputes over control and status. The Iraqi government carried out ethnic cleansing of Kurdish-populated areas to reduce the size of the autonomous entity, which created contested boundaries and competing claims over territor const KEY = "r2_h3_v1";
let ans = {}; try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
for (const s of SETS) ans[s.id] = ans[s.id] || {};
let si = 0, i = 0;
try { const p = JSON.parse(localStorage.getItem(KEY + "_pos") || "null"); if (p) { si = p[0]; i = p[1]; } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans));
                           localStorage.setItem(KEY + "_pos", JSON.stringify([si, i])); } catch (e) {} };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const filled = s => Object.keys(ans[s.id]).filter(k => s.items.some(x => x.id === k)).length;

function renderTabs() {
  const t = document.getElementById("tabs"); t.innerHTML = "";
  SETS.forEach((s, k) => {
    const b = document.createElement("button");
    const n = filled(s);
    b.className = "tab" + (k === si ? " on" : "") + (n === s.items.length ? " full" : "");
    b.innerHTML = esc(s.name) + '<span class="c">' + n + "/" + s.items.length + "</span>";
    b.onclick = () => { si = k; i = 0; const j = s.items.findIndex(x => !ans[s.id][x.id]); if (j >= 0) i = j; render(); };
    t.appendChild(b);
  });
}
function render() {
  const s = SETS[si], it = s.items[i];
  renderTabs();
  document.getElementById("pos").textContent = s.name + "  " + (i + 1) + " / " + s.items.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("h_claim").textContent = s.h_claim;
  document.getElementById("h_ev").textContent = s.h_ev;
  document.getElementById("claim").textContent = it.claim;
  document.getElementById("ev").textContent = it.ev;
  document.getElementById("ev").scrollTop = 0;
  document.querySelectorAll("[data-k]").forEach(b => {
    const v = s.labels[+b.dataset.k];
    b.querySelector("span").textContent = v;
    b.classList.toggle("on", ans[s.id][it.id] === v);
  });
  const tot = SETS.reduce((a, x) => a + x.items.length, 0), got = SETS.reduce((a, x) => a + filled(x), 0);
  document.getElementById("cnt").innerHTML = got === tot
    ? '<span class="done">전부 완료 — CSV 를 내려받으세요</span>' : ("전체 " + got + " / " + tot);
  document.getElementById("pb").style.width = (100 * got / tot) + "%";
  save();
}
function pick(k) {
  const s = SETS[si];
  ans[s.id][s.items[i].id] = s.labels[k]; save();
  if (i < s.items.length - 1) i++;
  render();
}
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pick(+b.dataset.k));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < SETS[si].items.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  for (let d = 0; d < SETS.length; d++) {
    const k = (si + d) % SETS.length, j = SETS[k].items.findIndex(x => !ans[SETS[k].id][x.id]);
    if (j >= 0) { si = k; i = j; render(); return; }
  }
  alert("전부 채웠습니다. CSV 를 내려받으세요.");
};
document.onkeydown = e => {
  if (e.key === "1") pick(0); else if (e.key === "2") pick(1); else if (e.key === "3") pick(2);
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["set", "item_id", "human_label"].join(",")];
  for (const s of SETS) for (const x of s.items) rows.push([q(s.id), q(x.id), q(ans[s.id][x.id] || "")].join(","));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "labels_h3_filled.csv"; a.click();
};
render();
</script></body></html>
