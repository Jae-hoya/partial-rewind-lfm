e agency's leadership?", "ev": "(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Trinidad and Tobago > Government and politics > Law enforcement and crime) The primary law enforcement agency of Trinidad and Tobago is the Trinidad and Tobago Police Service under the Ministry of Homeland Security. The current minister is Roger Alexander. On June 13, 2025 the House of Representatives approved a government motion for Acting Senior Superintendent of Police Allister Guevarro to be Commissioner of Police (CoP). Another law enforcement agency is the Trinidad and Tobago Municipal Police Service (TTMPS) under the Ministry of Rural Development and Local Government. They work within the various city, borough, and regional corporations. The current minister is Khadijah Ameen with the current administrator of the TTMPS being Assistant Commissioner of Police (ACP) Wayne Mystar Some other law enforcement agencies include:  Ministry of Defence  Ministry of Justice  Ministry of Homeland Security  Ministry of Finance  Ministry of Agriculture, Land and Fisheries  Ministry of Transport and Civil Aviation\n\n(Trinidad and Tobago > Government and politics > Disaster management and response > Local response) The Ministry of Rural Development and Local Government, along with regional and municipal corporations, are the first responders to major disasters. Each corporation maintains a Disaster Management Unit (DMU) responsible for managing all phases of extreme weather events within their local area. In Tobago, the Tobago Emergency Management Agency (TEMA), under the Tobago House of Assembly, handles disaster and emergency management. The Trinidad and Tobago Fire Service acts as the primary emergency response agency.\n\n(Trinidad and Tobago > Economy > Economic diversification) Trinidad and Tobago, in an effort to undergo economic transformation through diversification, formed InvesTT in 2012 to serve as the country's sole investment promotion agency. This agency is aligned to the Ministry of Trade and Industry and is to be the key agent in growing the country's non-oil and gas sectors significantly and sustainably."}, {"id": "h5029", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which tactical systems or strategic innovations have been attributed to the Australian Rollers in competition reports or analyses?", "ev": "(2017 IWBF Asia-Oceania Championships > Abstract) The 2017 Asia Oceania Wheelchair Basketball Championships for men and women were held at the China Disability Sports Training Centre in Beijing, from 23 to 28 October 2017. The men's tournament was won by the Australian Rollers. Iran came second, and Japan overcame Korea in the bronze medal game to come third. In the women's competition, China defeated the Australian Gliders in the gold medal match, while Japan defeated Iran in the bronze medal.\n\n(United States at the 2010 Winter Paralympics > Wheelchair curling) The U.S. team qualified for the 2010 Paralympic wheelchair curling tournament based on their performance in the 2007, 2008, and 2009 World Wheelchair Curling Championships. After two straight losses in the playoff round, the team finished in fourth place.\n\n(Wheelchair tennis at the 2020 Summer Paralympics > Abstract) Wheelchair tennis at the 2020 Summer Paralympics in Tokyo, Japan took place at the Ariake Tennis Park from 27 August to 4 September 2021.  The 2020 Summer Olympic and Paralympic Games were postponed to 2021 due to the COVID-19 pandemic. They kept the 2020 name and were held from 24 August to 5 September 2021.  Patrick Selepe became the first disabled umpire to officiate in a wheelchair Paralympic event.\n\n(Wheelchair tennis at the 1988 Summer Paralympics > Abstract) Wheelchair tennis at the 1988 Summer Paralympics consisted of men's and women's singles events. Despite wheelchair tennis being contested as a demonstration sport, and not an official part of the Paralympic program, medals were awarded and counted for the overall medal list.\n\n(Archery at the 2016 Summer Paralympics > Classification) Paralympic archers are given a classification depending on the type and extent of their disability, allowing them to compete against others with a similar level of function. The categories were reduced from three to two for 2016, with the 'standing' category being replaced with an 'open' category which incorporated wheelchair archers previously classified W2. The W1 classification for wheelchair archers was retained.  The two categories of competition in Paralympic archery in 2016 were:  A third recognised Paralympic archery classification - V1, for visually impaired archers - did not form part of the competition.\n\n(2017 IWBF Asia-Oceania Championships > Venue) The competition was held at the China Disability Sports Training Centre in Beijing. This is a purpose-built centre for disability sports. Opened on 28 June 2007, it was the first facility in China entirely devoted to disability sports training, and is the largest of its kind in the world. The Chinese Paralympic team used it as its training and preparation centre for the 2008 Summer Paralympics in Beijing. The entire complex is wheelchair accessible, with large elevators and wide halls."}, {"id": "h5030", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How does qualification for European competition affect a Belgian club's transfer spending, player recruitment, and market valuation?", "ev": "(2023–24 Royal Antwerp F.C. season > Abstract) The 2023–24 season was Royal Antwerp Sporting Club's 144th season in existence and seventh consecutive in the Belgian Pro League. They also competed in the Belgian Cup and the Belgian Super Cup, as well as the UEFA Champions League for the first time."}, {"id": "h5031", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What criticisms existed about outside campaign spending, political advertising, or independent expenditures affecting Maryland's 2008 election?", "ev": "(2008 United States presidential election in Hawaii > Abstract) The 2008 United States presidential election in Hawaii took place on November 4, 2008, and was part of the 2008 United States presidential election. Voters chose 4 representatives, or electors to the Electoral College, who voted for president and vice president.  Hawaii, Barack Obama 's birth state, gave him 71.9% of the vote with a 45.3% margin of victory in 2008. Prior to the election, all 17 news organizations considered this a state Obama would win, or otherwise considered as a safe blue state. Hawaii has voted Democratic in every presidential election since 1988. Obama's margin of victory in this state is only surpassed by that of the District of Columbia and is the only state that gave either candidate more than 70% of the vote. Turnout in the state was much higher than previous elections.  This remains the second-best performance by any party in a presidential election in Hawaii after Lyndon Johnson's landslide election in 1964.\n\n(2008 United States presidential election in Hawaii > Electors) Technically the voters of Hawaii cast their ballots for electors: representatives to the Electoral College. Hawaii is allocated 4 electors because it has 2 congressional districts and 2 senators. All candidates who appear on the ballot or qualify to receive write-in votes must submit a list of 4 electors, who pledge to vote for their candidate and their running mate. Whoever wins the majority of votes in the state is awarded all 4 electoral votes. Their chosen electors then vote for president and vice president. Although electors are pledged to their candidate and running mate, they are not obligated to vote for them. An elector who votes for someone other than their candidate is known as a faithless elector.  The electors of each state and the District of Columbia met on December 15, 2008, to cast their votes for president and vice president. The Electoral College itself never meets as one body. Instead the electors from each state and the District of Columbia met in their respective capitols.  The following were the members of the Electoral College from the state. All 4 were pledged to Barack Obama and Joe Biden:"}, {"id": "h5032", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Has the politician faced parliamentary sanctions, party disciplinary actions, or loss of immunity; what were the circumstances?", "ev": "(컨텍스트 없음)"}, {"id": "h5033", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What measurable cultural influence did the comic have on subsequent shojo works, academic discourse, or fandom practices?", "ev": "(One Piece > Abstract) One Piece is a Japanese manga series written and illustrated by Eiichiro Oda. It follows the adventures of Monkey D. Luffy and his crew, the Straw Hats, as he searches the mythical treasure known as the \"One Piece\" to become the next King of the Pirates. The manga has been serialized in Shueisha 's shōnen manga magazine Weekly Shōnen Jump since July 1997, with its chapters compiled in 114 tankōbon volumes as of March 2026. It was licensed for an English-language release in North America and the United Kingdom by Viz Media and in Australia by Madman Entertainment.  Becoming a media franchise, it has been adapted into a festival film by Production I.G, and an anime series by Toei Animation, which premiered in October 1999. Additionally, Toei has developed 14 animated feature films and one original video animation (OVA). Several companies have developed various types of merchandising and media, such as a trading card game and video games. Netflix released a live-action TV series adaptation in 2023.  One Piece has received praise for its storytelling, expansive worldbuilding, art, characterization, and humor. It is regarded by critics and readers as one of the greatest manga series of all time. By March 2026, it had over 600 million copies in circulation worldwide, making it the best-selling comic series in volume format and the best-selling manga series ever. It holds various publishing records, including the highest initial print run for any book in Japan. In 2015 and 2022, it set the Guinness world records for \"most copies published for the same comic book series by a single author\". It was the best-selling manga for 11 consecutive years (2008–2018) and remains the only series with over 3 million initial prints for over ten years, as well as the only one with every of its over 100 published tankōbon volumes selling over 1 million copies. Since 2008, it has consistently ranked first in Oricon 's weekly comic chart."}, {"id": "h5034", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented biases, censorship, or political influences affect archival, media, or scholarly sources on the city?", "ev": "(Kurds in Syria > Abstract) The Kurdish population of Syria is the country's largest ethnic minority, usually estimated at 10% of the Syrian population and 9% of the Kurdish population.  The majority of Syrian Kurds are originally Turkish Kurds who have crossed the border during different events in the 20th century. There are three major centers for the Kurdish population in Syrian, the northern part of the Jazira, the central Euphrates Region around Kobanî and in the west the area around Afrin. All of these are on the Syria-Turkey border, and there are also substantial Kurdish communities in Aleppo and Damascus further south.  During Ba'athist rule, human rights organizations accused the Syrian government of routinely discriminating and harassing Syrian Kurds. Many Kurds seek political autonomy for what they regard as Western Kurdistan, similar to the Kurdistan Regional Government in Iraq, or to be part of an independent state of Kurdistan. In the context of the Syrian Civil War, Kurds established the Autonomous Administration of North and East Syria."}, {"id": "h5035", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What strength and conditioning, injury prevention, and sports science services have been integrated into the Giza-based volleyball program?", "ev": "(Abdulrahman Fawzi Hall > Abstract) Abdulrahman Fawzi Hall is a covered sports arena in Cairo, Egypt. The arena opened in 1986. The arena is the home venue of the Zamalek SC Handball team of the Egyptian Handball League, the Zamalek SC Basketball team of the Egyptian Basketball Super League, and the Zamalek SC Volleyball team of the Egyptian Volleyball League. All three teams are departments of Zamalek Sporting Club, which owns and operates the arena.\n\n(2017 FIVB Beach Volleyball World Tour > Abstract) The 2017 FIVB Beach Volleyball World Tour was the global elite professional beach volleyball circuit organized by the Fédération Internationale de Volleyball (FIVB) for the 2017 beach volleyball season. The 2017 FIVB Beach Volleyball World Tour Calendar comprised three FIVB World Tour 5-star tournaments, two 4-star, four 3-star, four 2-star and six 1-star events, the World Championships and the World Tour Finals, all organised by the FIVB.  The 2017 edition of the Swatch Beach Volleyball FIVB World Tour Finals will be held in Hamburg, Germany from 22 to 27 August.\n\n(2018 FIVB Women's Volleyball World Championship qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball World Championship qualification acts as qualifiers for the 2018 FIVB Women's Volleyball World Championship, to be held in Japan, for national teams which are members of the Asian Volleyball Confederation (AVC). A total of 4+1 slots (4 direct slots and 1 host slot) in the final tournament are available for AVC teams.\n\n(2018 FIVB Women's Volleyball Challenger Cup qualification (AVC) > Abstract) The Asian section of the 2018 FIVB Women's Volleyball Challenger Cup qualification acted as the qualifiers section for the 2018 FIVB Women's Volleyball Challenger Cup for national teams that were members of the Asian Volleyball Confederation (AVC). This tournament was held in Almaty, Kazakhstan. The eventual winner earned the right to compete in the 2018 FIVB Women's Volleyball Challenger Cup."}, {"id": "h5036", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How are in-world mechanics such as status screens, skill trees, and leveling systems described and integrated into plot structure?", "ev": "(My One-Hit Kill Sister > Abstract) My One-Hit Kill Sister (異世界ワンターンキル姉さん〜姉同伴の異世界生活はじめました〜, Isekai Wan Tān Kiru Nee-san: Ane Dōhan no Isekai Seikatsu Hajimemashita; \"One Turn Kill Sister in Another World: I Started Living in Another World with My Older Sister\") is a Japanese web novel series written by Konoe. It was serialized online on the user-generated novel publishing website Shōsetsuka ni Narō from December 2019 to June 2023. A manga adaptation, illustrated by Kenji Taguchi, was serialized online via Shogakukan 's Sunday Webry website, as well as the seinen manga magazine Monthly Sunday Gene-X, from March 2020 to July 2023. It chapters were collected in twelve tankōbon volumes. An anime television series adaptation by Gekkou aired from April to June 2023."}, {"id": "h5037", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What swim training components (volume, intensity, interval types) were used in the swimmer's documented programs?", "ev": "(Ben Proud > Abstract) Benjamin Proud (born 21 September 1994) is an English competitive swimmer, who represented Great Britain at the Olympic Games, the FINA World Aquatics Championships and LEN European Aquatics Championships, and England at the Commonwealth Games until August 2025.  Proud specialises in sprint freestyle and butterfly races, specifically the 50-metre distance in both. He is the 2022 World Champion in the 50 metre freestyle, his second long course world title. He is the 2017 world champion in the 50-metre butterfly. He is only the third male swimmer to be simultaneously short-course and long-course World Champion at 50 metre freestyle, after César Cielo and Florent Manaudou. in 2024, at his third attempt he won his first Olympic medal, a silver, in the 50 metre freestyle at the 2024 Summer Olympics in Paris.  Proud holds two British national records, as well as being a double Commonwealth Games champion in both the 50 m butterfly (2014 and 2022) and 50 m freestyle (2014, 2018 and 2022) events. He was European Champion over 50 metres freestyle in 2018 and 2022, and was part of the 4 x 100 medley team from Great Britain which won European gold in 2014.  In 2025, Proud announced his intention to retire permanently from 'traditional' swimming as recognised by World Aquatics, European Aquatics and the International Olympic Committee to take up opportunities at the Enhanced Games, a private sports event that allows doping in its athletes.\n\n(Marie-Thérèse Armentero > Abstract) Marie-Thérèse Armentero (born 13 November 1965) is a Swiss swimmer who won a bronze medal in the 50 m freestyle at the 1986 World Aquatics Championships. She competed at the 1984 and 1988 Summer Olympics with the best achievement of sixth place in the 4 × 100 m medley relay in 1984.  During 1986–88 she was studying and training at the University of Toronto. There she swam the fastest ever 50 m freestyle race in Canada, setting a Canadian Interuniversity Sport (CIS) record that stood for at least 18 years. She also won a silver medal at the 1987 Summer Universiade and nine Ontario Women's Interuniversity Athletic Association (OWIAA) and seven CIS titles. In 1988 she was chosen the CIS Female Swimmer of the Year. After retirement she competed in the masters category and in 2003 set a European record in the 50 m freestyle. In 2006, she was inducted to the University of Toronto Sports Hall of Fame.\n\n(Rick DeMont > Abstract) Richard James DeMont (born April 21, 1956) is an American former competition swimmer, world champion, and former world record-holder in multiple events. Despite placing first in the 400-meter freestyle at the 1972 Summer Olympics, DeMont is remembered for the controversy subsequently arising from his disqualification and being stripped of the 400-meter gold medal after testing positive for a prohibited substance present in his prescription asthma medication. After retiring from his swimming career, where he won gold and silver medals at the World Aquatics and Pan American Championships, DeMont had an accomplished career as a swim team coach with the University of Arizona for thirty years from 1987 to 2017.  DeMont was born in San Francisco, California on April 21, 1956, the oldest of four children to Dr. Willard and Betty DeMont. The family moved to in Mill Valley, California until DeMont was six, when they moved to suburban San Rafael, California, where he attended Terra Linda High School, graduating in 1973. Around the age of seven, he began swimming with two time Olympic medalist Ann Curtis (Cuneo)'s Ann Curtis swim team in Terra Linda, where at ten, he set the AAU National record for the 200-yard freestyle with a time of 2:09.5.\n\n(Barbara Krause > Abstract) Barbara Krause (later Wanja, born on 7 July 1959 in East Berlin) is a former freestyle swimmer from East Germany. She was a three-time Olympic gold medalist and eight-time world record holder. At the 1980 Summer Olympics in Moscow, Krause won gold medals in the 100 m and 200 m freestyle and in the 4×100 m freestyle relay.  Her husband, Lutz Wanja, is also a retired German Olympic swimmer.\n\n(João Aguiar (swimmer) > Abstract) João Carlos da Silva Paquete Aguiar (born September 8, 1983) is an Angolan swimmer, who specialized in sprint freestyle events. He represented Angola, as a 17-year-old, at the 2000 Summer Olympics, and held numerous Angolan titles and meet records in the 50 m freestyle, while playing for August 1 Swimming Club in Luanda.  Aguiar competed only in the men's 50 m freestyle at the 2000 Summer Olympics in Sydney. He received a ticket from FINA, under a Universality program, in an entry time of 24.00. He challenged seven other swimmers in heat three, including two-time Olympians Howard Hinds of the Netherlands Antilles and Emin Guliyev of Azerbaijan. He rounded out the field to last place in 25.70, just 1.7 seconds below his entry standard, and 1.98 behind leader Estebán Blanco of Costa Rica. Aguiar failed to advance into the semifinals, as he placed sixty-third overall in the prelims. He is currently a swimming advisor at Luanda International School. He regularly coaches MiniLiga swim meets.\n\n(Nicolò Martinenghi > Abstract) Nicolò Martinenghi (Italian:; born 1 August 1999) is an Italian swimmer and the reigning Olympic champion in the 100 metre breaststroke event, having won the gold medal at the 2024 Summer Olympics. He is a two-time world record holder in the 4×50 metre medley relay, swimming breaststroke on both relays. He is the Italian record holder in the 50 metre breaststroke and 100 metre breaststroke (both long course and short course).  In the long course 100 metre breaststroke, Martinenghi won the gold medal at the 2022 World Aquatics Championships and the 2022 European Aquatics Championships, as well as the bronze medal at the 2020 Summer Olympics. In the short course version of the event, he was European champion in 2021 and won silver medals at the 2021 and 2022 World Short Course Championships. In the long course 50 metre breaststroke, he was European champion in 2022, World Aquatics Championships silver medalist in 2022, and European Aquatics Championships bronze medalist in 2021. For the short course event, he won a pair of silver medals in 2021 and 2022, one at the 2021 World Short Course Championships and one at the 2022 World Short Course Championships, and a bronze medal in 2021 at the year's European Short Course Championships. He won a gold medal in the 100m breaststroke at Paris 2024.\n\n(Kacper Stokowski > Early life) Stokowski was born in Warsaw, Poland on 6 January 1999, and attended High School No. LIX Mistrzotwa Sportowego.  As a prep school swimmer, he was a silver medalist in the 4 × 100 m freestyle relay, and the 50 backstroke at the World Junior Championships. He set a World Junior Championship record in both the 100 and 50 backstroke. He was a European Junior Champion in four instances, including the 200 freestyle, 100 backstroke, 4x200 relay and 4x100 freestyle relay. Stating his prep school record in greater detail, at the 2017 FINA World Jr. Championships he captured a bronze medal with a time of 25.38 in the 50-meter backstroke and captured a fifth place in the 100 meter backstroke, recording a time of 55.04. At the 2016 European Jr. Swimming Championships, he captured a gold medal in the 200-meter freestyle with a time of 1:48.51.\n\n(Relay race > Relays in swimming) A swimming relay of four swimmers usually follows this strategy: second-fastest, third-fastest, slowest, then fastest (anchor). However, it is not uncommon to see either the slowest swimmer racing in the second slot (creating an order of second-fastest, slowest, third-fastest, and then fastest), or an order from slowest to fastest (an order of slowest, third-fastest, second-fastest, fastest).  FINA rules require that a foot of the second, third or fourth swimmer must be contacting the platform while (and before) the incoming teammate is touching the wall; the starting swimmer may already be in motion, however, which saves 0.6–1.0 seconds compared to a regular start. Besides, many swimmers perform better in a relay than in an individual race owing to a team spirit atmosphere. As a result, relay times are typically 2–3 seconds faster than the sum of best times of individual swimmers.  In medley swimming, each swimmer uses a different stroke (in this order): backstroke, breaststroke, butterfly, and freestyle, with the added limitation that the freestyle swimmer cannot use any of the first three strokes. At competitive levels, essentially all freestyle swimmers use the front crawl. Note that this order is different from that for the individual medley, in which a single swimmer swims butterfly, backstroke, breaststroke, and freestyle in a single race, in that order.  The three standard relays raced at the Olympics are the 4 × 100 m freestyle relay, 4 × 200 m freestyle relay and 4 × 100 m medley relay.  Mixed-gendered relays were introduced at the 2014 FINA World Swimming Championships (25 m) (4 × 50 m freestyle and medley) and the 2015 World Aquatics Championships (4 × 100 m freestyle and medley). The event debuted at the 2020 Summer Olympics (4 × 100 m medley).  In open water swimming, mixed-gendered relays were introduced at the 2011 World Aquatics Championships (4 × 1250 m).\n\n(Libby Trickett > 2005 World Aquatics Championships) In July 2005, at the 2005 World Aquatics Championships in Montreal, Canada, Trickett was one of the form swimmers of the meet. She won the 50-metre freestyle in a time of 24.59 to record her maiden championship at international level. She also achieved a silver medal in the 100-metre butterfly (57.37). She was a member of three relay teams, the 4×100-metre freestyle relay, 4×100-metre medley relay, and the 4×200-metre freestyle relay teams, winning gold (3:37.22), gold (3:57.47) and silver (7:54.00) in the respective events. Fairly new to the 200-metre freestyle event, Trickett got recorded the then fourth fastest time in history clocking 1:57.06 as lead-off swimmer in the final of the 4×200-metre freestyle relay. The time being more than 1.5 seconds faster than the individual gold medallist Solenne Figuès of France (1.58.60). Trickett did not compete in the individual 100-metre freestyle because she placed third in the event at the Australian championship, but her 100-metre freestyle split times were faster than the individual 100-metre freestyle gold medalist and world record holder Jodie Henry, which earned her the honour of swimming in the final of the medley relay. Despite not competing in the individual 100- and 200-metre freestyle, she did finish 2005 ranked number one in the world in both events.  On returning to Australia, Trickett continued her rich vein of form, lowering the 100-metre short course freestyle world record on consecutive nights at the Australian Short Course Championships to 51.70 seconds.  2005 brought a further world record in the short-course 200-metre freestyle at the Sydney, Australia stop of the 2005 FINA World Cup series on 19 November with Trickett recording a time of 1:53.29 to beat the previous record by 0.75 seconds.  However, Trickett regained her 100-metre freestyle world record on 31 January 2006 at the Australian Championships in Melbourne. Her time of 53.42 was 0.1 of a second faster than the previous record held by Henry. On 2 August 2006, German swimmer Britta Steffen broke Trickett's 100-metre freestyle world record at the 2006 European Championships in Budapest, Hungary, with a time of 53.30. Trickett again regained the world record with a time of 52.88 on 27 March 2008 at the 100-metre finals of the Australian Olympic Trials."}, {"id": "h5038", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did public opinion metrics or approval ratings of the leader change over the course of their governance?", "ev": "(Kunduru Jana Reddy > Abstract) Kunduru Jana Reddy (born 20 June 1946) is an Indian politician. He was the leader of opposition in first Telangana Assembly and served as the Minister for Panchayat Raj & Rural Water Supply in the State of Andhra Pradesh during its term from 2009 to 2014. He was among the most prominent cabinet ministers of the ruling Indian National Congress (INC) and served as Minister for Home, Jails, Fire Service, Sainik Welfare, Printing & Stationery in the government led by the late former Chief Minister Dr Y. S. Rajasekhara Reddy from 2004 to 2009. In 2009 elections he won with a margin of 6214 votes against industrialist turned politician of TDP Chinappa Reddy Tera. In 2014 he won with a margin of 16558 votes over Nomula Narsimaiah of BRS in the year where Congress lost the majority vote. He lost the 1994 elections to TDP candidate Gundeboina Rammoorthy Yadav."}, {"id": "h5039", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When was Spirit Hunter: Death Mark first released and on which platforms did it initially launch?", "ev": "(컨텍스트 없음)"}]}];

const filled = s => Object.keys(ans[s.id]).filter(k => s.items.some(x => x.id === k)).length;

function renderTabs() {
  const t = document.getElementById("tabs"); t.innerHTML = "";
  SETS.forEach((s, k) => {
    const b = document.createElement("button");
    const n = filled(s);
    b.className = "tab" + (k === si ? " on" : "") + (n === s.items.length ? " full" : "");
    b.innerHTML = esc(s.name) + '<span class="c">' + n + "/" + s.items.length + "</span>";
    b.onclick = () => { si = k; i = 0; const j = s.items.findIndex(x => !ans[s.id][x.id]); if (j >= 0) i = j; render(); };
    t.appendChild(b);
  });
}
function render() {
  const s = SETS[si], it = s.items[i];
  renderTabs();
  document.getElementById("pos").textContent = s.name + "  " + (i + 1) + " / " + s.items.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("h_claim").textContent = s.h_claim;
  document.getElementById("h_ev").textContent = s.h_ev;
  document.getElementById("claim").textContent = it.claim;
  document.getElementById("ev").textContent = it.ev;
  document.getElementById("ev").scrollTop = 0;
  document.querySelectorAll("[data-k]").forEach(b => {
    const v = s.labels[+b.dataset.k];
    b.querySelector("span").textContent = v;
    b.classList.toggle("on", ans[s.id][it.id] === v);
  });
  const tot = SETS.reduce((a, x) => a + x.items.length, 0), got = SETS.reduce((a, x) => a + filled(x), 0);
  document.getElementById("cnt").innerHTML = got === tot
    ? '<span class="done">전부 완료 — CSV 를 내려받으세요</span>' : ("전체 " + got + " / " + tot);
  document.getElementById("pb").style.width = (100 * got / tot) + "%";
  save();
}
function pick(k) {
  const s = SETS[si];
  ans[s.id][s.items[i].id] = s.labels[k]; save();
  if (i < s.items.length - 1) i++;
  render();
}
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pick(+b.dataset.k));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < SETS[si].items.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  for (let d = 0; d < SETS.length; d++) {
    const k = (si + d) % SETS.length, j = SETS[k].items.findIndex(x => !ans[SETS[k].id][x.id]);
    if (j >= 0) { si = k; i = j; render(); return; }
  }
  alert("전부 채웠습니다. CSV 를 내려받으세요.");
};
document.onkeydown = e => {
  if (e.key === "1") pick(0); else if (e.key === "2") pick(1); else if (e.key === "3") pick(2);
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["set", "item_id", "human_label"].join(",")];
  for (const s of SETS) for (const x of s.items) rows.push([q(s.id), q(x.id), q(ans[s.id][x.id] || "")].join(","));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "labels_h5_filled.csv"; a.click();
};
render();
</script></body></html>
