 with Diana Mocanu (Romania) taking the silver and Antje Buschschulte (Germany) taking the bronze. Coughlin won her silver medal in the women's 4×100-meter medley relay, teaming up with Megan Quann, Mary Descenza, and Erin Phenix; the Australians won the gold (Calub, Jones, Thomas, Ryan). Coughlin won her bronze medal in the 50-meter backstroke; fellow American Haley Cope won gold and Antje Buschschulte won the silver.  At the ninth Pan Pacific Championships in Yokohama, Japan, Coughlin won six medals—four golds and two silvers. Coughlin won one of her gold medals in the women's 100-meter backstroke with a time of 59.72, and another in the women's 100-meter butterfly with a time of 57.88. Coughlin won her third gold medal in the women's 100-meter freestyle with a time of 53.99. She won her fourth gold medal in the women's 4×200-meter freestyle relay with Elizabeth Hill, Diana Munz, and Lindsay Benko. She won her silver medals as a member of the second-place U.S. relay teams in the 4×100-meter freestyle and 4×100-meter medley events.  At the tenth World Aquatics Championships in Barcelona, Spain, Coughlin won two medals, including a gold and a silver. Coughlin won her gold medal in the women's 4×100-meter freestyle relay and a silver medal in the 4×100-medley relay.\n\n(Sport in Serbia > Individual sports > Swimming) Milorad Čavić won a silver medal in swimming (discipline 100 meters butterfly) at the 2008 Olympic Games, and a gold and a silver medal at the 2009 World Championships. He won ten medals at the European Championships. He broke world and European records several times.  Nađa Higl became the world champion in the 200-meter breaststroke in 2009, breaking the European record.  Velimir Stjepanović won gold medals in the 200 m and 400 m freestyle at the European Championships in 50-meter pool, as well as a bronze medal at the World Championships in 25-meter pools in the 400 m freestyle.  Andrej Barna won the bronze medal in 100m freestyle in 2024 European Championships.  Serbian 4x100m freestyle relay team won the gold medal in 2024 European Championships.  Ivan Lenđer, Čaba Silađi, Miroslava Najdanovski and Szebasztián Szabó won medals at the Universiade, the Mediterranean Games, the European Championship in 25-meter pools, and junior championships. The first World Aquatics Championships in water sports was held in Belgrade in 1973.\n\n(Natalie Coughlin > International career > 2007 World Aquatics Championships) At the 2007 World Aquatics Championships, Coughlin won five medals: two gold, two silver, and one bronze. In her first event, the 4×100-meter freestyle relay, Coughlin won a silver medal along with Lacey Nymeyer, Amanda Weir, and Kara Lynn Joyce. The following day, in the 100-meter butterfly, she placed third in the final with a time of 57.34, an American record. In the 100-meter backstroke final, held the following day, she broke her own world record set in 2002 with a time of 59.44. After a day of r"}, {"id": "h5011", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have publishers and studios used web-originated isekai works as pipelines for discovering new intellectual property?", "ev": "(True Love Fades Away When the Contract Ends > Abstract) True Love Fades Away When the Contract Ends (運命の恋人は期限付き, Unmei no Koibito wa Kigen Tsuki) is a Japanese web novel series written by Kozusu Kobato. It was serialized on the user-generated novel publishing website Shōsetsuka ni Narō between May 2020 and July 2021. A manga adaptation illustrated by Murasaki Shido was serialized in Micro Magazine's Comic Ride web manga magazine between July 2021 and January 2023. It was later transferred to the Comic Ride Ivy web manga magazine in March 2023. A light novel version with illustrations by Fumi Takamura began publication under Micro Magazine's Maple Novels imprint in December 2022.\n\n(My One-Hit Kill Sister > Abstract) My One-Hit Kill Sister (異世界ワンターンキル姉さん〜姉同伴の異世界生活はじめました〜, Isekai Wan Tān Kiru Nee-san: Ane Dōhan no Isekai Seikatsu Hajimemashita; \"One Turn Kill Sister in Another World: I Started Living in Another World with My Older Sister\") is a Japanese web novel series written by Konoe. It was serialized online on the user-generated novel publishing website Shōsetsuka ni Narō from December 2019 to June 2023. A manga adaptation, illustrated by Kenji Taguchi, was serialized online via Shogakukan 's Sunday Webry website, as well as the seinen manga magazine Monthly Sunday Gene-X, from March 2020 to July 2023. It chapters were collected in twelve tankōbon volumes. An anime television series adaptation by Gekkou aired from April to June 2023.\n\n(KonoSuba > Abstract) KonoSuba: God's Blessing on This Wonderful World!, often referred to simply as KonoSuba, is a Japanese light novel series written by Natsume Akatsuki and illustrated by Kurone Mishima. The series follows Kazuma Satou, a boy who is sent to a fantasy world with MMORPG elements following his death, where he forms a dysfunctional adventuring party with a goddess, an archmage, and a crusader.  Akatsuki wrote the series with the intention of setting a contrast with typical fantasy tropes. The series was serialized as a web novel on Shōsetsuka ni Narō between December 2012 and October 2013, KonoSuba was published as a printed light novel series by Kadokawa Shoten under the company's Kadokawa Sneaker Bunko imprint from October 2013 to May 2020. The light novel series features a divergent plot.  A manga adaptation, illustrated by Masahito Watari, began serialization in Fujimi Shobo 's Monthly Dragon Age magazine in October 2014. An audio drama CD was released by HobiRecords in March 2015, and an anime television series adaptation produced by Studio Deen aired in Japan between January and March 2016. A second season of the anime aired between January and March 2017. A spin-off light novel series, KonoSuba: An Explosion on This Wonderful World!, was published from July 2014 to June 2015. Both the light novels and the manga are licensed in North America by Yen Press. An anime film adaptation produced by J.C.Staff, titled KonoSuba: God's Blessing on This Wonderful World! Legend of Crimson, premiered on August 30, 2019. An anime television series adaptation of An Explosion on This Wonderful World!, produced by Drive, aired from April to June 2023. A third season, also by Drive, aired from April to June 2024. A fourth season has been announced.  By November 2021, the series had 10 million copies in circulation. The series received positive reception from critics and fans, with both the light novels and the anime adaptation receiving multiple awards. Critics praised the anime for its humor and voice acting, but its animation quality and the fittingness to a comedy series have received mixed reception. The series' characters have also proven to be popular, with Megumin ranking highly in multiple polls and awards."}, {"id": "h5012", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When and how did she begin her career in modeling before entering films?", "ev": "(Fashion show > Models) With the creation of runway shows, the concept of runway modeling was rapidly established with the establishment of agencies and professional modeling careers. Before professional agencies, fashion houses that runway shows often had their own in house models who would specifically be fitted and costumes for each show. By having in house models to present the clothes for runway, the fashion houses could ensure that the clothing was perfectly altered for presentation and bound to sell. However, as the demand for models grew, the modeling agency was established to represent runway models.\n\n(Zaya Wade > Career) After coming out as trans in 2020 at age 12, she started a career in runway modeling and made her runway debut for Miu Miu at Paris Fashion Week in March 2023. She has appeared on the cover of Dazed magazine, and in high fashion campaigns for brands like Tiffany & Co. and Dove. She featured in Puma 's 2023 \"FOREVER. CLASSIC.\" campaign, modeling footwear and designing her own custom pair.\n\n(Pooja Reddy Bora > Career) Pooja Reddy Bora is an Indian actress and model known for her work in Telugu and Kannada cinema. She began her acting career in 2018 with the Kannada film Vedanti, portraying Varsha. She expanded into Telugu cinema with notable roles in Arangetram (2023) and Tatva (2024). Her performance in Odela 2 (2025) further established her presence in the industry.  Beyond films, Pooja Reddy Bora is active in modeling, participating in various fashion events, and photoshoots. She maintains an active presence on Instagram, sharing updates about her work and personal life.\n\n(Virginia Argueta > Career > Modeling and pageantry) Her Miss Guatemala title launched her career in modeling and communication. Following her international representation, she walked at Los Angeles Fashion Week and has appeared in fashion events in Phoenix, New York, Miami, and Los Angeles. She collaborated with the Los Angeles luxury fashion house *For The Stars Fashion House*, known for dressing celebrities such as Nicki Minaj, Paris Hilton, Britney Spears, Christina Aguilera, Gwen Stefani, Thalía, Jennifer Lopez, and Carrie Underwood.  She has also served "}, {"id": "h5013", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When and how did she begin her career in modeling before entering films?", "ev": "(Meghana Lokesh > Early life and career) Meghana Lokesh was born in Mysore, Karnataka. Her father is an engineer and her mother is a Kannada lecturer. She has a brother who is also an engineer. Meghana has been associated with theatre from very young age. She started her theatre at the age of 8 and performed nearly 270 shows till her degree and Mandya Ramesh was her theatre guru. She started her Television career with supporting role in Kannada television soap opera Devi, which aired on Zee Kannada. Meghana's first lead role was in Kannada Television Series Pavitra Bandhana, where she played the role of Pavitra. Following this, She also worked in other Kannada TV Series named Purushottama, which aired on Zee Kannada.  Her big breakthrough was with the Telugu hit series Sasirekha Parinayam which screened on Star Maa from 2013 to 2016. She also acted in the feature film Idhi Ma Prema Katha opposite Anchor Ravi, which received mixed reviews.  In 2017, she acted in two message-oriented Telugu short films named Emotion and Beautiful Life. Later that year, Meghana started a new Zee Telugu series Kalyana Vaibhogam in which she is portraying the dual role of Manga and Nithya. In 2018, She featured in a film called Ameerpet 2 America. Around the time, She was signed to play a lead role in her third Telugu Soap Opera titled, Raktha Sambandham."}, {"id": "h5014", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Are there reported controversies, censorship issues, or public scandals associated with her films or public image?", "ev": "(Lakshmi (actress) > Early life) Lakshmi was born and raised in Chennai, Tamil Nadu. Her mother Kumari Rukmini was a Tamil actress. Her father, Yaragudipati Varada Rao, was a Telugu producer, director, thespian, screenwriter, editor and actor known for his works predominantly in Telugu, Kannada, Malayalam and Tamil Cinema.\n\n(Anjali Devi > Career > As actress) She was a theatre artiste before venturing into movies, her debut film role was as Lohitasva in \" Raja Harishchandra\" in 1936. Her first film as a heroine was Kashtajeevi by L. V. Prasad in 1940, but that film was abandoned after three reels shooting. Later, C.Pullayya discovered her and gave her the opportunity to star as Mohini in Gollabhama (1947). Based on her acting ability and looks, she became a star overnight in 1947. She eventually acted in more than 350 films, majority of them in Telugu and Tamil films and a few in Hindi, Kannada films as the heroine or in character roles.  She acted in Lava Kusa, a milestone film and the first color film in the Telugu film industry in 1963. She is well known for playing Sita in Lava Kusa and her performances in films like Suvarna Sundari and Anarkali were also appreciated. Brundavanam (1992), Anna Vadina (1993) and Police Alludu (1994) were the last few films of her career. In Balaiah's Police Alludu and Anna Vadina she appeared alongside Brahmanandam. She acted in various roles, such as a damsel, an angel, a dancer, a demon, a goddess, a traditional woman and later in mother roles.\n\n(Tulasi (actress) > Career) Tulasi made her debut in the Telugu language when she was three months old in 1967. For a song in a film, a baby was needed and Tulasi was placed in the cradle after actress Savitri had requested Tulasi's mother, who was a friend of her. She was featured in a song when she was 3 + 1 ⁄ 2 years old in Jeevanatarangalu and said that she became a full-fledged actor when she was four.  She got married at age 28 to Kannada director Sivamani. She stated, \"I met him in the morning and by evening we tied the knot\". They have one son, Sai Tarun. Tulasi decided to quit acting after getting married, working only occasionally as a voice actor in Telugu films, including ones by Mani Ratnam. When her son was around six years old, she received several mother character roles. She initially declined them all, but finally signed on one Kannada film, Excuse Me, in which she played mother to Divya Spandana and which became a big hit. After that she was doing three films a year in Kannada.  She began to act mainly in mother roles in Telugu and Tamil film industries. Her notable supporting roles include performances in Sasirekha Parinayam, Mr. Perfect, Darling, Srimanthudu, Iddarammayilatho, Nenu Local, Mahanati & Dear Comrade in Telugu and Pillaiyar Theru Kadaisi Veedu, Easan, Mankatha, Sundarapandian, Aadhalal Kadhal Seiveer and Pandiya Naadu in Tamil. Tulasi has said that Aadhalal Kadhal Seiveer, in which she had played mother to Manisha Yadav 's character, changed her life and brought her an \"identity as a screen mother\". Her portrayal of Chellamma in Pannaiyarum Padminiyum was praised too, with critics stating that she was \"brilliant\", and had given her \"career best performance\".\n\n(Meghana Lokesh > Early life and career) Meghana Lokesh was born in Mysore, Karnataka. Her father is an engineer and her mother is a Kannada lecturer. She has a brother who is also an engineer. Meghana has been associated with theatre from very young age. She started her theatre at the age of 8 and performed nearly 270 shows till her degree and Mandya Ramesh was her theatre guru. She started her Television career with supporting role in Kannada television soap opera Devi, which aired on Zee Kannada. Meghana's first lead role was in Kannada Television Series Pavitra Bandhana, where she played the role of Pavitra. Following this, She also worked in other Kannada TV Series named Purushottama, which aired on Zee Kannada.  Her big breakthrough was with the Telugu hit series Sasirekha Parinayam which screened on Star Maa from 2013 to 2016. She also acted in the feature film Idhi Ma Prema Katha opposite Anchor Ravi, which received mixed reviews.  In 2017, sh"}, {"id": "h5015", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What changes in government funding, grants, or institutional support for disability sport in Australia followed the 1976 Paralympics?", "ev": "(John Grant (neurosurgeon) > Disability sport career) Grant's interest in the role of sport in the rehabilitation for people with spinal injuries can be linked to the work of Sir Ludwig Guttman, neurologist from Stoke Mandeville Hospital. In 1957, he visited the hospital and observed the role of sport in rehabilitation. In 1958, he played a major role in organising the First Royal North Shore Hospital Games for spinal injury patients. The Games were held at the Gore Hill Oval near the hospital. Grant also played a role in including sports in rehabilitation programs at Mount Wilga House. It held annual Sports Days. The Australian Team to the 1960 Rome Paralympics included eight competitors who had been patients at Mt Wilga Rehabilitation Centre and trained by Kevin Betts and Eileen Perrottet.  In 1961, he co-founded with Jack Ferguson the Paraplegic and Quadriplegic Association of New South Wales. He was president from 1968 to 2000. While President of this Association, he was instrumental in establishing the Junior National Wheelchair Games. He was the Medical Officer and Team Manager of the Australian teams that competed at the 1966 and 1970 Commonwealth Paraplegic Games. Grant and compatriate Graham Pryke were founding members of the FESPIC Games. In 1977, he was Chairman of the Organising Committee for the 2nd FESPIC Games held in Sydney.  In 1980, he wrote to the Minister for Sport, Bob Ellicott, stating the case for a national policy on sport for people with disabilities. Subsequently, the Australian Government established a national advisory committee on sports for disabled persons he was a member of. In 1993, he was the Chairman of the Sydney Bid Committee for the 2000 Paralympic Games. The successful bid led to Grant becoming President of the Sydney Paralympic Games Organising Committee 1994–2000.  Grant held leadership positions with several international disability sports organisations: President of International Stoke Mandeville Wheelchair Sports Federation, Chairman of the International Co-ordinating Committee of World Sports for the Disabled, and Member of the International Paralympic Committee.\n\n(Australia at the 1988 Winter Paralympics > Athletes) Hans Hinterholzer and Jamie Milner were the two team coaches for the Australian Alpine skiing events at the Innsbruck Paralympics. Australia was fortunate effort to take 5 Paralympic athletes to represent Australia in the 1988 Games in Innsbruck. Each athlete who competed did not qualify for a medal at these games. Four out of five of the Australian athletes competed in the Men's Downhill, Men's Giant Slalom and Men's Slalom apart from David Munk who only participated in the Men's Giant Slalom and Men's Slalom. Each athlete had different classifications ranging from upper body disabilities to lower body disabilities. All classifications of every athlete competing in the Paralympic Games of any sort are done so by the International Paralympic Committee (IPC).  Michael Collins participated in the Men's Downhill LW6/8, Men's Giant Slalom LW6/8 and Men's Slalom. He was ranked 10 out of 23 athletes with a time of 1:18.86 in the Men's Downhill LW6/8. In the Men's Giant Slalom LW6/8 and the Men's Slalom Collins was unable to finish. Michael Collins was classed as an athlete who had upper extremity issues. This can range from a skier being classified in the LW6/8 category if they have paralysis, motor paresis affecting one arm or a single upper arm amputation.  Kyrra Grunnsund represented Australia in five Paralympics. He was the first Australian to compete at both the Summer and Winter Paralympics. He competed in both the Alpine and Cross-country skiing over the course of his career but in the 1988 Winter Paralympic Games he only competed in the Men's Downhill LW4, Men's Giant Slalom LW4 and Men's Slalom LW4. He ranked 13th out of 14 athletes in the Men's Downhill LW4 with a time of 1:19.78. In the Men's Giant Slalom LW4 and Men's Slalom LW4 he did not finish. Kyrra Grunnsund was classified as an athlete who had a disability in one lower extremity. He is a below-the-knee amputee and classed in the LW4 category for the Paralympics.  Evan Hodge competed in the 1988 men's Downhill LW2, Men's Giant Slalom LW2 and Men's Slalom. All three events he qualified and was ranked into the top 15 athletes. His best time was in the Men's Slalom LW2 with a time of 1:34.05 and was ranked 8th out of 33 competitors. Hodge was classified with having severe disability in a lower limb where an amputation or arthrodesis in the leg and hip. Specific skiing and training techniques have been developed for this LW2 skiers that address their disability type and equipment use. A factoring system is used in both para-alpine and para-Nordic to allow different classes to compete against each other when there are not many competitors in one class in a competition.  Michael Milton grew up in a skiing family. At the age of 9 years old, his left leg was amputated above the knee due to bone cancer. After having an amputation, he was more determined to be able to ski again. Milton debuted in the 1992 Tignes-Albertville Winter Paralympics and has an extensive career in both Summer and Winter Paralympic games. He did compete in the 1988 Innsbruck games but did not qualify for a medal in any of the events he competed in. His best ranked event in the 1988 Paralympics was in the Men's Giant Slalom LW2 where he was ranked 11th out of 33 competitors. Like teammate Hodge, Milton was classed in the LW2 category for the Winter Paralympic games.  David Munk is an Australian Paralympic Alpine sit skier. He debuted in the 1992 Winter Paralympics where he won a bronze medal in the Men's Super-G LW11. At the 1988 Winter Paralympics he was unfortunately disqualified from the Men's Giant Slalom LW10 but was able to rank 13th out of 29 competitors in the Men's Slalom LW10. He was classed in the LW10 category due to the little support he had when sitting up right. The International Paralympic Committee defined this para-alpine classification as; a disability in the lower limbs and no sitting balance. Athletes who were classed in this category were given physical equipment adapted to their specific needs.\n\n(Italy at the Paralympics > Abstract) Italy has sent delegations to the Summer Paralympics since the first games in 1960, and to the Winter Paralympics since 1980.  The Paralympic Games are a multi-sport event for athletes with physical and sensorial disabilities. This includes athletes with mobility disabilities, amputations, blindness, and cerebral palsy. The Paralympic Games are held every four years, following the Olympic Games, and are governed by the International Paralympic Committee (IPC).\n\n(John Grant (neurosurgeon) > Abstract) John MacDonald Falconar Grant, AO, OBE (14 August 1922 – 10 November 2013) was an Australian neurosurgeon and disability sport administrator. He was president of the 2000 Sydney Paralympic Games Organising Committee. He played a leading role in the development of disability sport in Australia.\n\n(Rhodesia at the 1968 Summer Paralympics > Disability classifications) The Paralympics groups athletes' disabilities into one of five disability categories; amputation, the condition may be congenital or sustained through injury or illness; cerebral palsy; wheelchair athletes, there is often overlap between this and other categories; visual impairment, including blindness; Les autres, any physical disability that does not fall strictly under one of the other categories, for example dwarfism or multiple sclerosis. Each Paralympic sport then has its own classifications, dependent on the specific physical demands of competition. Events are given a code, made of numbers and letters, describing the type of event and classification of the athletes competing.\n\n(Malta at the 2008 Summer Paralympics > Disability classification) Every participant at the Paralympics has their disability grouped into one of five disability categories: amputation (congenital or sustained through injury or illness); cerebral palsy; wheelchair athletes (frequently overlapping with other categories); visual impairment, including blindness; and Les autres (physical disabilities that do not fall strictly under one of the other categories, such as dwarfism or multiple sclerosis). Each Paralympic sport then has its own classifications, dependent upon the specific physical demands of competition. Events are given an alphanumeric code describing the type of event and classification of the athletes competing. Some sports, such as athletics, divide athletes by both the category and severity of their disabilities, other sports, such as swimming, group competitors from different categories together, the only separation being based on the severity of the disability.\n\n(Pakistan at the 2016 Summer Paralympics > Disability classifications) Every participant at the Paralympics has their disability grouped into one of five disability categories; amputation, the condition may be congenital or sustained through injury or illness; cerebral palsy; wheelchair athletes, there is often overlap between this and other categories; visual impairment, including blindness; Les autres, any physical disability that does not fall strictly under one of the other categories, for example dwarfism or multiple sclerosis. Each Paralympic sport then has its own classifications, dependent upon the specific physical demands of competition. Events are given a code, made of numbers and letters, describing the type of event and classification of the athletes competing. Some sports, such as athletics, divide athletes by both the category and severity of their disabilities, other sports, for example swimming, group competitors from different categories together, the only separation being based on the severity of the disability."}, {"id": "h5016", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What community outreach, youth development, or local partnership programs has Royal Antwerp implemented and how did success influence them?", "ev": "(2023–24 Royal Antwerp F.C. season > Abstract) The 2023–24 season was Royal Antwerp Sporting Club's 144th season in existence and seventh consecutive in the Belgian Pro League. They also competed in the Belgian Cup and the Belgian Super Cup, as well as the UEFA Champions League for the first time.\n\n(Seol Ki-hyeon > Club career > Career in Belgium) In July 2000, Seol joined a Belgian club Royal Antwerp. He became the second South Korean footballer to score in double figures during a season in Europe, following Cha Bum-kun. After a successful season with Royal Antwerp, Seol moved to Anderlecht in the same league. He scored a hat-trick in the space of 12 minutes in the 2001 Belgian Super Cup. He also became the first South Korean player to score in the qualifying round of the UEFA Champions League. He won the 2003–04 Belgian First Division with Anderlecht.\n\n(Eddy Wauters > Abstract) Eduard Maria Jozef Wauters (12 July 1933 – 24 January 2025) was a Belgian footballer and chairman of Royal Antwerp Football Club. He was a player at the club and was capped four times by the Belgium national team.  Wouters was chairman of Antwerp for 43 years, from 1969 to 2012. Under his leadership, Antwerp achieved several sporting highlights, including winning the Belgian Cup in 1992 and reaching the European Cup Winners' Cup final in 1993.  In addition to his activities in the football world, Wauters also built a career in the banking sector.  Wauters died on 24 January 2025, at the age of 91.\n\n(Jean Butez > Career > Antwerp) On 12 June 2020, it was announced that Butez had signed with Antwerp, where he was set to succeed Sinan Bolat, whose contract was not renewed. The transfer fee was deemed to be around €2 million. Mouscron refused an offer of €1 million not long before.  Butez made his debut for Antwerp on 8 August 2020 in the league match against his former club Mouscron. In January 2021, he was sidelined with an ankle injury, after which he was replaced by first Alireza Beiranvand and since Ortwin De Wolf, who had been loaned during the January transfer window. At the start of the play-offs, however, manager Frank Vercauteren again opted for Butez as the starter.  Under manager Brian Priske, Butez began the 2021–22 season as Antwerp's first-choice goalkeeper. In August 2021, he played a crucial role in the UEFA Europa League play-off round against Omonia, saving penalties from Jan Lecjaks and Panagiotis Zachariou in the shoot-out, which secured Antwerp's place in the group stage. However, the team struggled in the group stage, finishing last in their group with five points from 18 in matches against Eintracht Frankfurt, Fenerbahçe, and Olympiacos.  In the domestic league, Antwerp recovered from a slow start, losing their first two matches, but remained in the top four from the eighth matchday onwards, with Butez's numerous saves contributing significantly to their success.  In the 2022–23 season, under new manager Mark van Bommel, Butez remained the undisputed first-choice goalkeeper, playing every minute. Strengthened by the arrival of Toby Alderweireld, Antwerp's defense improved, and Butez had an outstanding season, recording 27 clean sheets in 52 matches across all competitions. Antwerp achieved a domestic treble, winning the Belgian Pro League, the Belgian Cup, and the Belgian Super Cup.  On 30 March 2024, Butez broke his hand during a match against Anderlecht, requiring surgery that ended his season early. Antwerp reportedly planned to sell him, having already signed Senne Lammens as his replacement, but interested clubs, including Ajax and Anderlecht, did not meet the asking price, and Butez remained at the club.  Under new head coach Jonas De Roeck, Butez lost his starting position to Senne Lammens. Despite his efforts to secure a transfer, no deal was finalized, and he remained at the club. Manager and analyst Hein Vanhaezebrouc\n\n(Royale Union Saint-Gilloise > History > Title contenders and European football > 2022–23: European participation and title contestant) Despite an early exit from the UEFA Champions League at the hands of Rangers after a 2–0 \"home\" win at OH Leuven 's Den Dreef stadium and a 3–0 loss at Ibrox, Union dropped into the UEFA Europa League and won their group, earning four victories from their six games against Union Berlin, Braga and Malmö.  A last-16 reunion with Union Berlin saw the Brussels club draw 3–3 away in Berlin, and win their \"home\" return 3–0 at Anderlecht's Lotto Park. The quarter-finals had them paired with another Bundesliga side in Bayer Leverkusen, who defeated them 5–2 on aggregate (1–1 away, 1–4 home).  Domestically, Union continued their remarkable form from the season before, lying second heading into the final round of the Belgian Pro League regular season and reaching the Belgian Cup semi-finals, only to lose to Royal Antwerp on penalties.  Union reached the final day of the title play-offs in second place on 46 points, with leaders Antwerp also on 46, top by virtue of finishing in first place at the end of the regular season. Third-placers Genk were a point behind on 45. Union would be champions if they won their game against Club Brugge, and Antwerp did not win theirs against Genk. No other scenario would crown Union as champions.  On the final matchday of the Play-offs, Union were leading 1–0 at home against Club Brugge in the 89th minute, and with Racing Genk leading Royal Antwerp 2–1 at the Cegeka Arena, Union were on the way to being champions, with the Pro League trophy being flown via helicopter to the Joseph Marien Stadium.  However, three late goals from Club Brugge - two in stoppage-time - and a late Antwerp equaliser from Toby Alderweireld sent the crown Antwerp's way. Union's second consecutive title-race collapse saw them drop to third place which qualified them to the Europa League play-off round."}, {"id": "h5017", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What variations in character preparation, physical transformation, or stunt/performance demands are recorded across his roles in different languages?", "ev": "(컨텍스트 없음)"}, {"id": "h5018", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "In what formal leadership roles (team captain, veteran mentor) did the player serve during his professional career?", "ev": "(컨텍스트 없음)"}, {"id": "h5019", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What legacy projects, infrastructure uses, or development programs were established in Papua New Guinea following the 2016 event?", "ev": "(2020 OFC U-17 Women's Championship > Abstract) The 2020 OFC U-17 Women's Championship, originally to be held as the 2019 OFC U-16 Women's Championship, was originally to be the 5th edition of the OFC U-16/U-17 Women's Championship, the biennial international youth football championship organised by the Oceania Football Confederation (OFC) for the women's under-16/under-17 national teams of Oceania.  The 2019 OFC U-16 Women's Championship was originally scheduled to be held in New Zealand from 30 September to 12 October 2019. It was later rescheduled to be played in Tahiti from 7 to 20 December 2019. However, the OFC announced on 28 November 2019 that it would be postponed to 2020 due to the measles epidemic in the Pacific region. It was later rescheduled to 6 and 19 April 2020, with the name of the tournament changed from \"2019 OFC U-16 Women's Championship\" to \"2020 OFC U-17 Women's Championship\". However, on 9 March 2020, the OFC announced that all OFC tournaments were postponed until 6 May 2020 due to the COVID-19 pandemic. On 14 May 2020, it was announced that a further decision regarding that tournament would be made on 2 June 2020.  On 5 June 2020, the OFC announced that the tournament would be cancelled due to difficulty in rescheduling the tournament. New Zealand, who were the four-time defending champions, were nominated by the OFC Executive Committee as the OFC representatives for the 2021 FIFA U-17 Women's World Cup (originally 2020 but postponed due to COVID-19 pandemic) in India. However, FIFA announced on 17 November 2020 that this edition of the World Cup would be cancelled.\n\n(2017 OFC U-16 Women's Championship > Abstract) The 2017 OFC U-16 Women's Championship was the 4th edition of the OFC U-16/U-17 Women's Championship, the biennial international youth football championship organised by the Oceania Football Confederation (OFC) for the women's under-16/under-17 national teams of Oceania. The tournament was held in Samoa between 4 and 18 August 2017.  For this tournament the age limit was lowered from under-17 to under-16. The winners of the tournament qualified for the 2018 FIFA U-17 Women's World Cup in Uruguay as the OFC representative.\n\n(Samoa women's national under-17 football team > Competitive record > OFC) The OFC Women's Under 17 Qualifying Tournament is a tournament held once every two years to decide the only qualification spot for Oceania Football Confederation (OFC) and representatives at the FIFA U-17 World Cup.\n\n(OFC U-19 Women's Championship > Abstract) The OFC U-19 Women's Championship (previously the OFC U-20 Women's Championship or OFC Women's Under 20 Qualifying Tournament) is a football tournament held every two years to decide the only qualification spot for the Oceania Football Confederation (OFC) representative at the FIFA U-20 Women's World Cup.  Until 2006 it was an under-19 tournament. The most recent edition for 1 to 15 July 2017 was again an U-19 tournament, and the tournament was called the OFC U-19 Women's Championship.\n\n(1983 OFC U-17 Championship > Abstract) The 1983 OFC U-17 Championship, was the OFC Under 17 Qualifying Tournament, the biennial football championship of Oceania (OFC). It was the 1st edition of the tournament and was held in Auckland, New Zealand from 3 to 10 December 1983. New Zealand qualified for the 1985 FIFA U-16 World Championship, in China.\n\n(2017 OFC U-16 Women's Championship > Teams) All eleven OFC member national teams entered the tournament. It would be the first time in the history of the OFC U-17 Women's Championship that all eleven members of the OFC take part in the tournament. However, Papua New Guinea, Solomon Islands and Vanuatu later withdrew from the tournament, so only eight teams would take part.\n\n(OFC Men's Champions League > Abstract) The OFC Men's Champions League is the premier men's club football competition in Oceania. It is organised by the OFC, Oceania's football governing body. Beginning as the Oceania Club Championship (1987–2006), it has been organised since 2007 under its current format. The first four Club Championship titles were won by Australian clubs. Since 2006, when Australia left the OFC, 16 OFC titles have been won by clubs from New Zealand, one by a Papua New Guinean club and one by a New Caledonian club.  Trophies for OFC tournament winners are made by London-based silversmiths Thomas Lyte. The winning club used to qualify for the FIFA Intercontinental Cup, entering at the African–Asian–Pacific Cup play-off stage. Additionally, the best-ranked champion in a 4-year period, Auckland City FC, qualified for the 2025 edition of the FIFA Club World Cup. Qualifications for those tournaments are now handled by the OFC Professional League."}, {"id": "h5020", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What legal or statutory constraints limited the Secretary of Transportation's ability to implement Foxx's proposed policies?", "ev": "(컨텍스트 없음)"}, {"id": "h5021", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What major championships, titles, or trophies has the club won and in which seasons?", "ev": "(North Hobart Football Club > Abstract) The North Hobart Football Club, nicknamed The Demons, is an Australian rules football club currently competing in the Southern Football League Premier Division. The club was a part of the Tasmanian Football League from the early 1900s until 2001, when it joined the Southern Football League. In 2009, North Hobart was invited into the second reincarnation of the statewide league, where it remained until 2013. After the 2013 season, its position in the league was effectively filled by the Hobart City Football Club. North Hobart returned to the Tasmanian State League in 2018. However, following the cessation of the TSL in 2024, the club rejoined the Southern Football League in 2025  In 2014, the North Hobart Football Club Inc. changed from an incorporated body to a company limited with 100% ownership of the Hobart City Football Club, with the Hobart City Demons now the trading name of North Hobart Football Club Ltd.  On October 9, 2017 the paying members of the Hobart City Demons voted 371-118 in favour of returning the playing name of the club to the North Hobart identity for season 2018 and beyond.  Players to reach Australian Football League level include Paul Williams, Peter 'Percy' Jones, Daryn Cresswell, Chris Bond, James Manson, Jim Wright, Tony Pickett, Colin Garland and several other big names. In total 54 North Hobart players have moved on to play at VFL/AFL level.  In 2005, North Hobart was the first club inducted into the AFL Tasmania Hall of Fame as a Great Club.\n\n(North Hobart Football Club > Famous Matches > 1967 Grand Finals) In 1967 TANFL Season North Hobart went on to win the premiership after winning just once in their first eight games of the season. The team won nine of their last 11 games to finish fourth on the ladder, before going on to beat New Norfolk by 5 points in the Semi-Final, followed by a 9 point victory over an inaccurate Clarence team in the preliminary final. The team then went on the beat Glenorchy by 14 points in front of 17,523 in the TANFL Grand Final.  1967 TANFL Grand Final  Glenorchy 2.5 2.12 3.13 8.16 (64)  North Hobart 3.3 6.5 9.8 11.12 (78)  Result: North Hobart won by 14 points  After winning the TANFL Premiership, the club qualified to compete against NWFU Premiers Wynyard in the 1967 Tasmanian State Premiership Final at West Park Oval in Burnie. The match turned out to be one of the most controversial is Tasmanian football history.  1967 Tasmanian State Premiership Final  Wynard 1.1 9.7 10.9 13.14 (92)  North Hobart 3.8 5.11 11.17 12.19 (91)  Result: No Result  One of the most controversial games in Australian rules football history, the match was declared no result and the premiership was withheld after fans invaded the field and eventually took down the goal posts, preventing North Hobart full-forward David Collins from taking a kick after the siren which would likely have won or tied the game for North Hobart.\n\n(Bellerive Oval > Events) As well as being the home of domestic and international cricket and the Clarence Football Club in the now Tasmanian State League, Bellerive Oval served in 2003 as a home to the Tasmanian Devils in the VFL. The first match attracted the highest VFL roster match crowd since 1986–6,970. The venue also hosted Tasmania's two finals matches, with the elimination win against Geelong (4,800) and 10,073 for a semi-final against Port Melbourne, which was won by Port Melbourne.the venue hosted the BBL 14 Final between the Hobart Hurricanes And the Sydney Thunder with a crowd of 15,706 on the 27 January 2025\n\n(Hobart Town Gazette > Abstract) The Hobart Town Gazette was established in 1816 in Hobart, Van Diemen's Land (known as Tasmania since 1856) as The Hobart Town Gazette and Southern Reporter. In 1821 the name was changed to the Hobart Town Gazette and Van Diemen's Land Advertiser. In 1825 the title was split, with the government authorised publication remaining the Hobart Town Gazette, and the original editor launching the Colonial Times, and Tasmanian Advertiser. From 1882 it was known as the Hobart Gazette and from 1907 as the Tasmanian Government Gazette.\n\n(West Park Oval > History) West Park Oval was also home of the former Cooee Football Club (later renamed Burnie Hawks in 1987 and the former Burnie Tigers Football Club in the North West Football Union (NWFU) and later of the NTFL until both clubs amalgamated in early 1994.  The ground hosted five Tasmanian State Grand Finals between 1961 and 1978, including the final State Premiership decider held in 1978, and was also the site of some of Tasmanian football's most infamous matches.  During an NWFU match in 1936 an extreme storm, described as a hurricane, hit West Park in the final quarter of a match between Burnie Tigers and Penguin, and as players were unable to keep their feet in the blinding rain and wind, many lay flat in the mud as there was great panic in the crowd as the strong winds threatened to demolish the Main Stand. Burnie (finishing the match with eleven men on the field) won 8.10 (58) to Penguin (who fin\n\n(1980 TANFL season > Abstract) The 1980 Tasmanian Australian National Football League (TANFL) premiership season was an Australian rules football competition staged in Hobart, Tasmania over fifteen roster rounds and four finals series matches between 24 May and 20 September 1980.  The season started almost two months later than usual and was shortened by several rounds to accommodate the inaugural Winfield Statewide Cup which was held that season.  The League was known as the Winfield League under a commercial naming-rights sponsorship agreement with the Winfield tobacco company.\n\n(Seth Campbell > Early life and junior football) Campbell was raised in the north-western Tasmanian town of Burnie. He took up football at under 12s level with the Burnie Dockers and went on to play with the club's senior side in 2021. In the same year he played representative under 18 football for the Tasmania Devils in the NAB League and for his state at the AFL Under 17 Championships.  Campbell joined North Launceston in the Tasmanian Football League in 2022, the premier adult men's competition in the state. He scored a 10-goal haul in his third senior game for the club, as part of a 122-victory over North Hobart in mid-August. During the same year he once again played representative under 18 football for the Tasmania Devils in the NAB League, where he kicked 16 goals over 13 matches, including three goals in a win over the NT Thunder in May Campbell also played with the Allies side at the 2022 AFL Under 18 Championships alongside fellow Tasmanian juniors and those from the Australian Capital Territory, New South Wales, Northern Territory and Queensland. He played three matches at the tournament, including a game against South Australia where he recorded 15 disposals and kicked two goals.\n\n(Bellerive Oval > Abstract) Bellerive Oval (known under naming rights as Ninja Stadium) is an Australian rules football and cricket stadium located in the Hobart suburb of Bellerive. With a combination of seating and standing capacity of 20,000, it is the second-largest stadium in Tasmania (behind York Park in Launceston).  The stadium is the only Tasmanian venue that regularly hosts international cricket matches. It serves as the home ground for the Tasmanian Tigers, Tasmania's state cricket team, and the Hobart Hurricanes, a Big Bash League franchise. It has hosted international Test matches since 1989 and One-Day Internationals (ODIs) since 1988.\n\n(Ted Terry > Cananore) Whilst still at school, in April 1922, he was also playing senior football as a wing-man with the Cananore Football Club first XVIII, in the Tasmanian Football League competition.  The team was coached by ex-Carlton and ex-Melbourne player Jack Gardiner who was, no doubt, responsible for teaching Terry the secrets of the stab-pass, and the placement of long torpedo punts and long drop-kicks, that became so much a part of Terry's game.  At that time, Cananore had somewhat of a reputation for selecting young players: Carlton's Fred Pringle played his first senior match with Cananore in 1920, aged 15, and would return to Cananore in 1925, and serve four years as Captain-Coach.  On the verge of his selection for the first match of the season, Terry was described as a schoolboy champion, who had given sufficient proof of his ability for senior distinction, and of whom good things were expected. He played in the first match of the 1922, on 5 May, at the Hobart Cricket Ground. Cananore won the match 8.13 (61) to 7.13 (55). Three months into his first season, football writers were describing him as \"fast and clever\" and speaking of him in the same breath as his legendary teammate, the champion rover Horrie Gorringe.  Terry played his last match for Cananore in the 1922 season on Saturday, 19 August, against North Hobart. He sustained a serious injury (a twisted knee) whilst playing school football for St Virgil's against Hutchins on Saturday, 26 August. As a consequence, was unable to play for either St. Virgil's or Cananore for the remainder of the 1922 season; and, therefore, he did not play for the Cananore first XVIII that won the 1922 TFL Grand Final, 9.12 (66) to North Hobart 's 8.8 (56).  On Saturday, 21 July 1923, he played for the Southern Tasmanian Football League, in its first inter-state match of the season against an Albury and District Football League team at the North Hobart Oval. The Tasmanian team won the match, 9.10 (64) to Albury's 7.15 (57).  He played his last match for Cananore in an irregular, out-of-season match between Cananore and the season's premiers, North Hobart, at the North Hobart Oval, on Saturday, 6 October 1923, which Cananore won by two points, 8.7 (55) to 7.11 (53)."}, {"id": "h5022", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has Welsh Labour engaged with rural and post-industrial communities in policy and campaign messaging?", "ev": "(컨텍스트 없음)"}, {"id": "h5023", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What were her debut film titles and release years in Kannada, Tamil, and Telugu cinema respectively?", "ev": "(Meghana Lokesh > Early life and career) Meghana Lokesh was born in Mysore, Karnataka. Her father is an engineer and her mother is a Kannada lecturer. She has a brother who is also an engineer. Meghana has been associated with theatre from very young age. She started her theatre at the age of 8 and performed nearly 270 shows till her degree and Mandya Ramesh was her theatre guru. She started her Television career with supporting role in Kannada television soap opera Devi, which aired on Zee Kannada. Meghana's first lead role was in Kannada Television Series Pavitra Bandhana, where she played the role of Pavitra. Following this, She also worked in other Kannada TV Series named Purushottama, which aired on Zee Kannada.  Her big breakthrough was with the Telugu hit series Sasirekha Parinayam which screened on Star Maa from 2013 to 2016. She also acted in the feature film Idhi Ma Prema Katha opposite Anchor Ravi, which received mixed reviews.  In 2017, she acted in two message-oriented Telugu short films named Emotion and Beautiful Life. Later that year, Meghana started a new Zee Telugu series Kalyana Vaibhogam in which she is portraying the dual role of Manga and Nithya. In 2018, She featured in a film called Ameerpet 2 America. Around the time, She was signed to play a lead role in her third Telugu Soap Opera titled, Raktha Sambandham.\n\n(Vanisri > Abstract) Vanisri (born Rathna Kumari) is an Indian actress known for her works predominantly in Telugu, Tamil, and Kannada films. In a film career spanning 40 years, she has received three Filmfare Awards South, the Nandi Awards and the Tamil Nadu State Film Award.\n\n(Lakshmi (actress) > Early life) Lakshmi was born and raised in Chennai, Tamil Nadu. Her mother Kumari Rukmini was a Tamil actress. Her father, Yaragudipati Varada Rao, was a Telugu producer, director, thespian, screenwriter, editor and actor known for his works predominantly in Telugu, Kannada, Malayalam and Tamil Cinema.\n\n(Sanjjana > Abstract) Archana Manohar Galrani, known by her stage name as Sanjjana, is an Indian model and actress who predominantly works in Kannada and Telugu films. She made her film debut in the 2005 Telugu film Soggadu. She is known for her role in the Kannada film Ganda Hendathi (2006). She played a supporting role in the 2008 Telugu film Bujjigadu starring Prabhas. In 2017, she played Chandri in the Kannada crime drama Dandupalya 2. In 2025 she participated as a contestant in Telugu reality show Bigg Boss 9 and finished as 4th runner-up of the show."}, {"id": "h5024", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What record label, management, or publishing deals were involved with Monika Liu before and after the selection?", "ev": "(Lithuania in the Eurovision Song Contest 2023 > Before Eurovision > Pabandom iš naujo! 2023 > Shows > Final) The final took place on 18 February 2023 and featured the remaining ten entries that qualified from the semi-finals. The final was the only show in the competition to be broadcast live; all other preceding shows were pre-recorded earlier in the week before their airdates. \"So Low\" performed by Rūta Mur and \" Stay \" performed by Monika Linkytė were tied at 22 points each after the combination of the jury vote and the public vote, but since Linkytė received received the most votes from the jury she was declared the winner. In addition to the competing entries, Ukrainian 2023 representative Tvorchi appeared as guests, while Eurovision Song Contest 2019 winner Duncan Laurence and Lithuanian 2022 representative Monika Liu performed as interval acts.\n\n(Lithuania in the Eurovision Song Contest 2023 > Abstract) Lithuania was represented at the Eurovision Song Contest 2023 with the song \" Stay \" performed by Monika Linkytė. The Lithuanian participating broadcaster, the Lithuanian National Radio and Television (LRT), organised the national final Pabandom iš naujo! 2023 to select its entry for the contest.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 11 May 2023 and was later selected to perform in position 15. At the end of the show, \"Stay\" was announced among the top 10 entries of the second semi-final and hence qualified to compete in the final. It was later revealed that Lithuania placed fourth out of the sixteen participating countries in the semi-final with 110 points. In the final, Lithuania performed in position 22 and placed eleventh out of the 26 participating countries, scoring a total of 127 points.\n\n(Lithuania in the Eurovision Song Contest 2014 > Abstract) Lithuania was represented at the Eurovision Song Contest 2014 with the song \"Attention\", written by Vilija Matačiūnaitė and Viktoras Vaupšas, and performed by Matačiūnaitė herself. The Lithuanian participating broadcaster, Lithuanian National Radio and Television (LRT), organised the national final \"Eurovizijos\" dainų konkurso nacionalinė atranka (Eurovision Song Contest national selection) in order to select its entry for the contest. The national final took place over 12 weeks and involved 20 artists and 16 songs competing in two different competitive streams. The results of each show were determined by the combination of votes from a jury panel and a public vote, and \"Attention\" performed by Vilija eventually emerged as the winner following the final.  Lithuania was drawn to compete in the second semi-final of the Eurovision Song Contest which took place on 8 May 2014. Performing during the show in position 7, \"Attention\" was not announced among the top 10 entries of the second semi-final and therefore did not qualify to compete in the final. It was later revealed that Lithuania placed 11th out of the 15 participating countries in the semi-final with 36 points.\n\n(Lithuania in the Eurovision Song Contest 2023 > Background) Prior to the 2023 contest, the Lithuanian National Radio and Television (LRT) had participated in the Eurovision Song Contest representing Lithuania 22 times since its first entry in 1994. Its best placing in the contest was sixth, which it achieved in 2006 with the song \" We Are the Winners \", performed by LT United. Following the introduction of semi-finals in 2004, Lithuania, to this point, had managed to qualify to the final 11 times. It was represented in 2022 by the song \" Sentimentai \", performed by Monika Liu, who qualified for the final and ended 14th overall with 128 points.  As part of its duties as participating broadcaster, LRT organises the selection of its entry in the Eurovision Song Contest and broadcasts the event in the country. Other than the internal selection of their debut entry in 1994, LRT has selected all of its entries through a national final procedure: \"Eurovizijos\" dainų konkurso nacionalinė atranka between 1999 and 2019, and Pabandom iš naujo! since 2020. LRT confirmed its participation in the Eurovision Song Contest 2023 in 29 July 2022. On 11 October 2022, the broadcaster announced the organization of Pabandom iš naujo!, which would be the national final format to select its entry for Liverpool.\n\n(Lithuania in the Eurovision Song Contest 2014 > At Eurovision > Voting) Voting during the three shows consisted of 50 percent public televoting and 50 percent from a jury deliberation. The jury consisted of five music industry professionals who were citizens of the country they represent, with their names published before the contest to ensure transparency. This jury was asked to judge each contestant based on: vocal capacity; the stage performance; the song's composition and originality; and the overall impression by the act. In addition, no member of a national jury could be related in any way to any of the competing acts in such a way that they cannot vote impartially and independently. The individual rankings of each jury member were released shortly after the final.  Following the release of the full split voting by the EBU after the conclusion of the competition, it was revealed that Lithuania had placed 11th with both the public televote and the jury vote in the second semi-final. In the public vote, Lithuania scored 41 points, while with the jury vote, Lithuania scored 44 points.  Below is a breakdown of points awarded to Lithuania and awarded by Lithuania in the second semi-final and final of the contest, and the breakdown of the jury voting and televoting conducted during the two shows:\n\n(Lithuania in the Eurovision Song Contest 2014 > Background) Prior to the 2014 contest, Lithuania had participated in the Eurovision Song Contest 14 times since its first entry in 1994. The nation’s best placing in the contest was sixth, which it achieved in 2006 with the song \"We Are the Winners\", performed by LT United. Following the introduction of semi-finals in 2004, Lithuania, to this point, had managed to qualify to the final six times. In the 2013 contest, \"Something\" performed by Andrius Pojavis qualified to the final, where the song scored 17 points and placed 22nd.  For the 2014 contest, the Lithuanian national broadcaster, Lithuanian National Radio and Television (LRT), broadcast the event within Lithuania and organised the selection process for the nation's entry. Other than the internal selection of their debut entry in 1994, Lithuania has selected their entry consistently through a national final procedure. LRT confirmed their intentions to participate at the 2014 Eurovision Song Contest on 3 October 2013 and announced the organization of \"Eurovizijos\" dainų konkurso nacionalinė atranka, which would be the national final to select Lithuania's entry for Copenhagen."}, {"id": "h5025", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What major public controversies or scandals have been associated with governance reforms or coalition administrations in Newcastle?", "ev": "(Newcastle Airport Metro station > Abstract) Airport (also known as Newcastle Airport) is a Tyne and Wear Metro station, serving Newcastle International Airport in the English city of Newcastle upon Tyne. It opened as a terminus station in 1991, following the opening of the extension from Bank Foot to Airport.\n\n(2021 Newcastle City Council election > Background > History) The Local Government Act 1972 created a two-tier system of metropolitan counties and districts covering Greater Manchester, Merseyside, South Yorkshire, Tyne and Wear, the West Midlands, and West Yorkshire starting in 1974. Newcastle was a district of the Tyne and Wear metropolitan county. The Local Government Act 1985 abolished the metropolitan counties, with metropolitan districts taking on most of their powers as metropolitan boroughs. The North of Tyne Combined Authority was created in 2018 and began electing the mayor of the North of Tyne from 2019, which was given strategic powers covering a region covering some of the same area as the former Tyne and Wear metropolitan county, as well as Northumberland.  Since its creation, Newcastle has variously been under Labour, Liberal Democrat and Conservative control. The Liberal Democrats held a majority of seats on the council from 2004 until 2011, when Labour gained enough seats to control the council. Nick Forbes became leader of the council. Labour continued to gain seats until the 2019 election, when the party lost two seats but continued to have an overall majority.  The Local Government Boundary Commission for England produced new boundaries for Newcastle ahead of the 2018 election, meaning that the 2018 elections were all-out, with all councillors being elected before returning to electing by thirds. Candidates up for re-election in 2021 are those who came second in each ward in 2018.\n\n(Blaydon railway station > Abstract) Blaydon is a railway station on the Tyne Valley Line, which runs between Newcastle and Carlisle via Hexham. The station, situated 5 miles 39 chains (5.49 mi; 8.83 km) west of Newcastle, serves the town of Blaydon, Gateshead in Tyne and Wear, England. It is owned by Network Rail and managed by Northern Trains.\n\n(North Tyneside Council > Governance) Since 1986 the council has provided both district-level and county-level functions, with some services being provided through joint arrangements with the other Tyne and Wear councils. In 2024 a combined authority was established covering North Tyneside, County Durham, Gateshead, Newcastle upon Tyne, Northumberland, South Tyneside and Sunderland, called the North East Mayoral Combined Authority. It is chaired by the directly elected Mayor of the North East and oversees the delivery of certain strategic functions across the area.\n\n(Burger King > Controversies) Controversies and disputes have arisen with groups such as People for the Ethical Treatment of Animals (PETA), governmental and social agencies, and unions and trade groups over various topics. These situations have touched on legal and moral concepts such as animal rights, corporate responsibility, ethics, and social justice. In many of the cases, the situations raised legal questions, dealt with legal compliance, or resulted in legal remedies such as changes in contractual procedure or binding agreements between parties. The resolutions to these legal matters have often altered the way the company interacts and negotiates contracts with its suppliers and franchisees, or how it does business with the public.  One example is an issue involving members of the Islamic faith over the interpretation of the Muslim version of canon law, Shariah, regarding the promotional artwork on a dessert package in the United Kingdom raised issues of cultural sensitivity, and, with the former example, posed a larger question about what companies must do to ensure the smooth operation of their businesses in the communities they serve.\n\n(2012 English mayoral referendums > Cities > Newcastle upon Tyne) A campaign group advocating a 'yes' vote in the Newcastle referendum was led by Brian Moore, former Chairman of the Newcastle Conservative Party. The idea was backed by Newcastle First, a local political party, and the Conservative Member of Parliament for Hexham.  The local Labour and Liberal Democrat groups had previously expressed their opposition to an elected mayor but both of their group leaders declared their intentions to stand if the position was created.\n\n(Houghton and Sunderland South > Abstract) Houghton and Sunderland South (/ ˈ h oʊ t ən /) is a constituency in Tyne and Wear represented in the House of Commons of the Parliament of the United Kingdom. Since its creation in 2010, the seat has been represented by Bridget Phillipson of the Labour Party, who currently serves as Secretary of State for Education under the government of Keir Starmer.  In the 2010 and 2015 general elections, it was the first constituency to declare its result, continuing the record of its predecessor seat, Sunderland South, in the four general elections from 1992 to 2005. However, in the 2017 and 2019 general elections, it was beaten by Newcastle upon Tyne Central. It regained the position as first constituency to declare in the 2024 election, while Newcastle ruled itself out of being the first prior to the polling date for various reasons.\n\n(Great North Children's Hospital > Abstract) The Great North Children's Hospital (GNCH) is a tertiary referral centre in Newcastle upon Tyne, England. The hospital is managed by the Newcastle upon Tyne Hospitals NHS Foundation Trust and is a teaching hospital for the University of Newcastle upon Tyne. It is one of only 14 such children's hospitals in the United Kingdom.\n\n(Jamie Driscoll > Abstract) Jamie Driscoll (born April 1970) is a British politician who served as the metro mayor of the North of Tyne Combined Authority from 2019 to 2024. He represented Labour until June 2023 and then became an independent. He was previously a Labour councillor on Newcastle City Council for the Monument ward from 2018 to 2019 and has been a Green Party councillor since 2026.  Driscoll founded Majority in 2024. He was one of the directors of Your Party 's operating company, but resigned in October 2025 following a financial dispute amongst the party's founders. He joined the Green Party of England and Wales in December 2025.\n\n(Advance UK > History > Launch) The party was due to hold an official launch event at the Crowne-Plaza Hotel in Newcastle upon Tyne on 27 September. However, after criticism, the hotel management cancelled the booking on health and safety grounds, according to Newcastle City Council. Habib told supporters on Twitter that the party would still launch in Newcastle.  In November 2025, Wootton Bridge Community Centre on the Isle of Wight, where 100 Advance UK supporters had met, was placed under review by the Charity Commission over alleged political activity.  On 4 December 2025, the party was registered with the Electoral Commission to run candidates in Great Britain. Edward Oakenfull, the party's treasurer, was previously the Reform candidate for Derbyshire Dales in 2024; but was dropped over his comments on the IQ of sub-Saharan Africans."}, {"id": "h5026", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have questions of representational legitimacy (e.g., identity, nationality, or community ties) been articulated about the psychologist?", "ev": "(Kuala Lumpur Middle Ring Road 1 > Abstract) Kuala Lumpur Middle Ring Road 1, Federal Route 2 or the stretch of roads including Jalan Tun Razak, Lebuhraya Sultan Iskandar (Lebuhraya Mahameru), Jalan Damansara, Jalan Istana and Jalan Lapangan Terbang is an urban and municipal main ring road in Kuala Lumpur. It is also known as Kuala Lumpur–Petaling Jaya Traffic Dispersal Scheme by the Malaysian Public Works Department (JKR). It is a busy ring road during rush hour time. This ring road is maintained by Dewan Bandaraya Kuala Lumpur or Kuala Lumpur City Hall (DBKL)."}, {"id": "h5027", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the politician's full name, date of birth, and place of origin?", "ev": "(Russian given name > Formal Russian name and its derivative forms > Legal given name) According to Russian naming tradition, people are addressed by their name followed by a patronymic in official speech. In official situations, one's given name is always written or spoken in its legal form (name given at birth and documented in papers like birth certificate and passport).  Prior to October Revolution, canonical form was considered official. It was documented in baptismal register books. However, in birth certificate and other documents a secular form was used. Arising ambiguity was not considered important and did not cause any legal consequences. In baptismal register books, people bearing names Yuriy and Egor appeared as Georgy, but in other documents, they could use the variant they were used to.  After the Revolution, various forms of one's name started being considered as different names. Names from the example above – Georgy, Yegor and Yuriy became legally different names after the Revolution. Generally, names are considered to be different if they acquired significant differences during assimilation, as in following cases:  There are names which, being legally different, are considered the same in common usage and share short forms, like Nataliya and Natalya (short form – Natasha).\n\n(Baby announcement > History and origin) The birth of a child has been celebrated since before records began and many religions have narratives about the birth of their god or spiritual leader. The earliest newspapers carried birth announcements and announcement cards became commercially available in mid-19th century Britain. Traditionally birth announcements give the names of the child, the time and date of birth, the sex and the weight.\n\n(Rwandan names > Abstract) Rwandan names are personal names used in Rwanda. A Rwandan name typically consists of two elements: a given name, usually of Christian, Muslim, or other religious origin; and a surname drawn from Kinyarwanda. Both elements form the person's full legal name and appear on all official records, including the national identity card and the Rwandan passport.  The distinctive feature of the Rwandan system is that the surname is not hereditary. Each Rwandan receives a unique Kinyarwanda surname at birth; siblings do not share a surname, and children do not inherit the surname of either parent. In this respect, the Rwandan system differs from most Western, East Asian, Arabic, and patronymic African naming systems. The same convention is followed in neighbouring Burundi with Kirundi surnames.\n\n(Administrative divisions of Wisconsin > Unincorporated communities) There are numerous examples of unincorporated communities throughout the state. These areas are administered by the town or municipality in which they exist. They serve as useful local reference to specific places and are sometimes included in vital records. Many of these named places contain a small cluster of houses, a church or local business such as store or tavern. Although they do not have any governmental function, most are recognized for the common usage and are marked with official green informational highway signs listing the place name with the word 'Unincorporated' underneath. Many of these named places are also placed on the official Wisconsin state highway maps issued by the Wisconsin Department of Transportation but these names were not listed in the index on the same maps until several years ago. Examples include Frog Station, Poland, and North Leeds.\n\n(Thai calendar > Birthdays) Mundane astrology figures prominently in Thai culture, so modern Thai birth certificates include lunar calendar dates, and the appropriate Chinese calendar zodiacal animal year-name for both Thai Hora (โหราศาสตร์, ho-ra-sat) and Chinese astrology. Thai birth certificates record the date, month and time of birth, followed by the day of the week, lunar date, and the applicable zodiac animal name. Thai traditionally reckon age by the 12-year animal-cycle names, with the twelfth and sixtieth anniversaries being of special significance; but the official calendar determines age at law.  For instance, 12 August 2004 was observed without regard to the lunar date as Queen Sirikit 's birthday, a public holiday also observed as Thai Mother's Day. Her zodiacal animal is the Monkey and her traditionally significant sixtieth anniversary year was 1992. Born on a Friday, her auspicious birthday colour is blue. Thai auspicious colours of the day are given in the table of weekdays, followed below it by a link to the Buddha images for each day of the week.\n\n(Guru Hargobind > Early life > Birth year) Whilst 1595 is the commonly accepted birth year of the guru, some authors and sources, such as Kesar Singh Chhibar and the Bhat Vahis, record his year of birth as being 1590. According to Pashaura Singh, the Bhatt Vahi Multani Sindhi records the date of birth of Guru Hargobind as 19 June 1590 (asar 21 sambat 1647 in the Bikrami calendar). The sources that affirm the 1595 birth year are the Gurbilas Patshahi Chhevin (possibly 1718), Suraj Prakash (1844), and Naveen Panth Prakash (1880), while the Bansavilinama Dasan Patishahian Ka (1769), Rahitname Ate Ardas, and the Bhatt Bahi Multani Sindhi suggest 1590. Pashaura states that the later works copied Gurbilas Patshahi Chhevin's date of birth assertion. In his work, Pashaura Singh uses 1590 as the year of birth for Guru Hargobind.\n\n(Lebanese passport > Physical appearance > Place of birth) Passport applicants may request, in writing, that their Lebanese passport not list the place of birth (city and country) - or simply the country - on their data page. A separate form is available for such a request, on which one must indicate one's awareness that omitting this information could cause one difficulties at international entry points or when applying for visas.  In response to the government of the People's Republic of China's (PRC) modification to the requirements for the issuance of Chinese visas to Lebanese citizens born in Hong Kong, Macau, and Taiwan the PRC will not issue visas to Lebanese passport holders whose place of birth is inscribed as being Hong Kong HKG, Macau MAC or (city name) TWN. Accordingly, passports issued to Lebanese born in Hong Kong, Macau or Taiwan now only list the place of birth, without an accompanying three-letter country code, unless upon request.  Since April 1976, the policy has been that Lebanese citizens born in Jerusalem have their birthplace identified only by the city's name, with no national designation, due to the unresolved legal status of Jerusalem. Lebanese citizens born prior to 1948 may have their birthplace identified as Palestine if they were born in what was the British Mandate of Palestine (including Jerusalem).\n\n(Given name > Legal status) A child's given name or names are usually chosen by the parents soon after birth. If a name is not assigned at birth, one may be given at a naming ceremony, with family and friends in attendance. In most jurisdictions, a child's name at birth is a matter of public record, inscribed on a birth certificate, or its equivalent. In Western cultures, people normally retain the same given name throughout their lives. However, in some cases these names may be changed by following legal processes or by repute. People may also change their names when immigrating from one country to another with different naming conventions.  In certain jurisdictions, a government-appointed registrar of births may refuse to register a name for the reasons that it may cause a child harm, that it is considered offensive, or if it is deemed impractical. In France, the agency can refer the case to a local judge. Some jurisdictions, such as Sweden, restrict the spelling of names. In Denmark, one does not need to register a given name for the child until the child is six months old, and in some cases, one can even wait a little longer than this before the child gets an official name.\n\n(List of Australian composers > Abstract) This is a list of Australian composers of classical music, contemporary music and film soundtracks.  These names are largely drawn from the following:  and various other websites and media sources.  Wherever possible, dates of birth and death are shown. The pseudonyms used by some composers are listed along with a reference back to their legal name. Entries are cross-referenced to one or more sources to provide further information.\n\n(Jacopo d'Angelo > Early life and early education) Jacopo d'Angelo was born in the town of Scarperia, located in the Mugello region of Tuscany, which at the time was part of the Republic of Florence. Legal documents from this time show his full name to be \"Iacobus Angeli Lippi Sostegni\". Sostegni, therefore, was his surname but he went by Angeli. His exact date of birth is not known, but scholars place it around 1360. This date of birth is based on an observation made by d' Angelo's contemporary, Leonardo Bruni. Bruni, who was born in 1369, notes in his Commentarius that d’Angelo was much older than him. Scarperia was a Florentine fortress in the Mugello, a region in northeastern Tuscany. It was a stronghold that protected against the feudal might of the Ubaldini, a powerful family that dominated the area during this time.  There is not much known about d’Angelo's earliest years; this also applies to his family. What is known is that he was quite young when his father, Angelo, died. After his father's death, his mother soon remarried. She relocated to Florence with her new husband and took young d’Angelo with her. It was in Florence where d’Angelo would start his education. There, he would meet two people who would be very influential in his life. The first was Coluccio Salutati, who took an interest in d'Angelo and became his mentor. It was through Salutati's that d'Angelo began his study of the humanities. Also, it is very likely that Salutati advised d'Angelo to start school under the tutelage of Giovanni Malpaghini, a teacher at the Florentine Studio (University).\n\n(Lebanese passport > History > The old burgundy red passport) A 32-page passport with a burgundy red cover, commonly known as the old burgundy style came into use in 1990 under the auspices of the International Civil Aviation Organization (ICAO) with the formation of the Passport Service following international agreement on a standard format for passports, and remained in use until replaced by the modern-style machine-readable navy blue passport on April 12, 2003. As with many documents worldwide and all booklet-format documents, details were handwritten into the passport and (as of 1998) included: number, holder's name, \"accompanied by his wife\" and her maiden name, \"and\" (number) \"children\", national status. For both bearer and wife: profession, place and date of birth, country of residence, height, eye and hair colour, special peculiarities, signature and photograph. Names, birth dates, and sexes of children, list of countries for which valid, issue place and date, expiry date, a page for renewals and, at the back, details of the amount of foreign exchange for travel expenses (a limited amount of sterling, typically the equivalent of £L11,500, but increasing with inflation, could be taken out of the country). The bearer's sex was not explicitly stated, although the name was written in with title (\"Mr\"). Descriptive text was printed in both Arabic, French, and English. (a practice which still continues), e.g. برفقة زوجته / Accompagné de sa femme (Née) / Accompanied by his wife (Maiden name)/. Changed details were struck out and rewritten, with a rubber-stamped note confirming the change.  If details and photograph of a man's wife and details of children were entered (this was not compulsory), the passport could be used by the bearer, wife, and c"}, {"id": "h5028", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have there been documented conflicts of interest, procurement controversies, or nepotism allegations involving th
