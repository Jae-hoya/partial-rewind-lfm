on, New Jersey > Government > Politics) As of March 2011, there were a total of 5,454 registered voters in Harrison, of which 3,207 (58.8%) were registered as Democrats, 312 (5.7%) were registered as Republicans and 1,934 (35.5%) were registered as Unaffiliated. There was one voter registered to another party.  In the 2012 presidential election, Democrat Barack Obama received 78.4% of the vote (2,699 cast), ahead of Republican Mitt Romney with 20.0% (689 votes), and other candidates with 1.6% (54 votes), among the 3,473 ballots cast by the town's 5,940 registered voters (31 ballots were spoiled), for a turnout of 58.5%. In the 2008 presidential election, Democrat Barack Obama received 68.0% of the vote (2,347 cast), ahead of Republican John McCain with 30.0% (1,036 votes) and other candidates with 1.1% (38 votes), among the 3,453 ballots cast by the town's 5,827 registered voters, for a turnout of 59.3%. In the 2004 presidential election, Democrat John Kerry received 64.8% of the vote (2,142 ballots cast), outpolling Republican George W. Bush with 34.1% (1,128 votes) and other candidates with 0.3% (16 votes), among the 3,306 ballots cast by the town's 5,411 registered voters, for a turnout percentage of 61.1.  In the 2013 gubernatorial election, Republican Chris Christie received 53.2% of the vote (896 cast), ahead of Democrat Barbara Buono with 45.2% (762 votes), and other candidates with 1.6% (27 votes), among the 1,718 ballots cast by the town's 6,032 registered voters (33 ballots were spoiled), for a turnout of 28.5%. In the 2009 gubernatorial election, Democrat Jon Corzine received 69.0% of the vote (1,542 ballots cast), ahead of Republican Chris Christie with 24.8% (554 votes), Independent Chris Daggett with 3.9% (87 votes) and other candidates with 1.3% (30 votes), among the 2,234 ballots cast by the town's 5,225 registered voters, yielding a 42.8% turnout.\n\n(East Newark, New Jersey > Government > Politics) As of November 2024, there are a total of 1,105 registered voters in East Newark.  In the 2012 presidential election, Democrat Barack Obama received 82.3% of the vote (400 cast), ahead of Republican Mitt Romney with 16.5% (80 votes), and other candidates with 1.2% (6 votes), among the 492 ballots cast by the borough's 844 registered voters (6 ballots were spoiled), for a turnout of 58.3%. In the 2008 presidential election, Democrat Barack Obama received 76.0% of the vote (414 cast), ahead of Republican John McCain with 22.6% (123 votes) and other candidates with 0.7% (4 votes), among the 545 ballots cast by the borough's 904 registered voters, for a turnout of 60.3%. In the 2004 presidential election, Democrat John Kerry received 71.2% of the vote (337 ballots cast), outpolling Republican George W. Bush with 26.4% (125 votes) and other candidates with 0.8% (6 votes), among the 473 ballots cast by the borough's 800 registered voters, for a turnout percentage of 59.1.  In the 2013 gubernatorial election, Democrat Barbara Buono received 64.9% of the vote (148 cast), ahead of Republican Chris Christie with 32.9% (75 votes), and other candidates with 2.2% (5 votes), among the 232 ballots cast by the borough's 884 registered voters (4 ballots were spoiled), for a turnout of 26.2%. In the 2009 gubernatorial election, Democrat Jon Corzine received 71.8% of the vote (234 ballots cast), ahead of Republican Chris Christie with 21.8% (71 votes) and Independent Chris Daggett with 4.0% (13 votes), among the 326 ballots cast by the borough's 765 registered voters, yielding a 42.6% turnout.\n\n(Butler, New Jersey > Government > Politics) As of March 2011, there were a total of 4,551 registered voters in Butler, of which 863 (19.0%) were registered as Democrats, 1,458 (32.0%) were registered as Republicans and 2,224 (48.9%) were registered as Unaffiliated. There were 6 voters registered as Libertarians or Greens.  In the 2012 presidential election, Republican Mitt Romney received 55.1% of the vote (1,811 cast), ahead of Democrat Barack Obama with 43.5% (1,430 votes), and other candidates with 1.3% (44 votes), among the 3,302 ballots cast by the borough's 4,774 registered voters (17 ballots were spoiled), for a turnout of 69.2%. In the 2008 presidential election, Republican John McCain received 55.1% of the vote (1,968 cast), ahead of Democrat Barack Obama with 43.7% (1,561 votes) and other candidates with 0.9% (32 votes), among the 3,573 ballots cast by the borough's 4,759 registered voters, for a turnout of 75.1%. In the 2004 presidential election, Republican George W. Bush received 57.4% of the vote (1,986 ballots cast), outpolling Democrat John Kerry with 41.4% (1,430 votes) and other candidates with 0.5% (26 votes), among the 3,458 ballots cast by the borough's 4,822 registered voters, for a turnout percentage of 71.7.  In the 2013 gubernatorial election, Republican Chris Christie received 68.9% of the vote (1,320 cast), ahead of Democrat Barbara Buono with 29.8% (571 votes), and other candidates with 1.3% (25 votes), among the 1,949 ballots cast by the borough's 4,723 registered voters (33 ballots were spoiled), for a turnout of 41.3%. In the 2009 gubernatorial election, Republican Chris Christie received 56.9% of the vote (1,286 ballots cast), ahead of Democrat Jon Corzine with 33.4% (755 votes), Independent Chris Daggett with 7.0% (159 votes) and other candidates with 1.5% (33 votes), among the 2,260 ballots cast by the borough's 4,615 registered voters, yielding a 49.0% turnout.\n\n(Hightstown, New Jersey > Government > Politics) As of March 2011, there were a total of 2,891 registered voters in Hightstown, of which 1,105 (38.2%) were registered as Democrats, 542 (18.7%) were registered as Republicans and 1,241 (42.9%) were registered as Unaffiliated. There were 3 voters registered as Libertarians or Greens.  In the 2012 presidential election, Democrat Barack Obama received 64.6% of the vote (1,369 cast), ahead of Republican Mitt Romney with 33.4% (707 votes), and other candidates with 2.0% (42 votes), among the 2,308 ballots cast by the borough's 3,062 registered voters (190 ballots were spoiled), for a turnout of 75.4%. In the 2008 presidential election, Democrat Barack Obama received 66.8% of the vote (1,504 cast), ahead of Republican John McCain with 30.4% (685 votes) and other candidates with 1.6% (36 votes), among the 2,253 ballots cast by the borough's 2,962 registered voters, for a turnout of 76.1%. In the 2004 presidential election, Democrat John Kerry received 59.3% of the vote (1,254 ballots cast), outpolling Republican George W. Bush with 36.4% (771 votes) and other candidates with 0.9% (25 votes), among the 2,116 ballots cast by the borough's 2,776 registered voters, for a turnout percentage of 76.2.  In the 2013 gubernatorial election, Republican Chris Christie received 57.9% of the vote (765 cast), ahead of Democrat Barbara Buono with 38.8% (512 votes), and other candidates with 3.3% (44 votes), among the 1,341 ballots cast by the borough's 2,961 registered voters (20 ballots were spoiled), for a turnout of 45.3%. In the 2009 gubernatorial election, Republican Chris Christie received 46.2% of the vote (700 ballots cast), ahead of Democrat Jon Corzine with 44.8% (679 votes), Independent Chris Daggett with 7.1% (107 votes) and other candidates with 1.1% (16 votes), among the 1,514 ballots cast by the borough's 2,908 registered voters, yielding a 52.1% turnout.\n\n(Belmar, New Jersey > Government > Politics) As of March 2011, there were a total of 3,823 registered voters in Belmar, of which 1,074 (28.1%) were registered as Democrats, 765 (20.0%) were registered as Republicans and 1,982 (51.8%) were registered as Unaffiliated. There were two voters registered as either Libertarians or Greens.  In the 2012 presidential election, Republican Mitt Romney received 51.5% of the vote (1,310 cast), ahead of Democrat Barack Obama with 47.0% (1,196 votes), and other candidates with 1.4% (36 votes), among the 2,584 ballots cast by the borough's 4,011 registered voters (42 ballots were spoiled), for a turnout of 64.4%. In the 2008 presidential election, Republican John McCain received 49.5% of the vote (1,389 cast), ahead of Democrat Barack Obama with 47.4% (1,332 votes) and other candidates with 1.6% (44 votes), among the 2,808 ballots cast by the borough's 3,938 registered voters, for a turnout of 71.3%. In the 2004 presidential election, Republican George W. Bush received 50.4% of the vote (1,394 ballots cast), outpolling Democrat John Kerry with 48.0% (1,327 votes) and other candidates with 0.8% (32 votes), among the 2,764 ballots cast by the borough's 4,014 registered voters, for a turnout percentage of 68.9.  In the 2013 gubernatorial election, Republican Chris Christie received 70.6% of the vote (1,440 cast), ahead of Democrat Barbara Buono with 27.2% (555 votes), and other candidates with 2.2% (45 votes), among the 2,096 ballots cast by the borough's 4,043 registered voters (56 ballots were spoiled), for a turnout of 51.8%. In the 2009 gubernatorial election, Republican Chris Christie received 57.4% of the vote (1,173 ballots cast), ahead of Democrat Jon Corzine with 34.0% (694 votes), Independent Chris Daggett with 6.8% (138 votes) and other candidates with 1.0% (20 votes), among the 2,044 ballots cast by the borough's 3,69"}, {"id": "h5002", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have official audits, parliamentary reviews, or watchdog reports identified governance, financial mismanagement, or accountability issues at the agency?", "ev": "(Office of the Auditor-General (Uganda) > Mandate and functions) The OAG audits and reports to Parliament on the public accounts of central government, local governments, statutory bodies, state enterprises, and projects funded from public resources. It also approves withdrawals from the Consolidated Fund as provided in the national legal framework. The Core work includes financial audits, compliance audits, value for money audits, forensic audits, and IT audits.\n\n(Auditor General of Nova Scotia > Abstract) The auditor general of Nova Scotia is an officer of the Nova Scotia House of Assembly to aid accountability and oversight by conducting independent financial audits of provincial government operations. These audits provide members of the House of the Assembly and the public with objective evidence to help them examine the government's activities and hold it to account.  Kim Adair is the auditor general of Nova Scotia, as of May 3, 2021. She replaced Michael Pickup who became Auditor General of British Columbia.\n\n(Public Accounts Committee (United Kingdom) > Abstract) The Committee of Public Accounts is a select committee of the British House of Commons. It is responsible for overseeing government expenditures, and to ensure they are effective and honest. The committee is seen as a crucial mechanism for ensuring transparency and accountability in government financial operations, having been described by Professor the Lord Hennessy as \"the queen of the select committees... by its very existence exert a cleansing effect in all government departments\".\n\n(Audit committee > Responsibilities > Role in oversight of the external auditor) Audit committees typically approve selection of the external auditor. The external auditor (also called a public accounting firm) reviews the entity's financial statements quarterly, audits the entity's financial statements annually, and issues an opinion providing assurance on the entity's annual financial statements. Changing an external auditor typically also requires audit committee approval. Audit committees also help ensure the external auditor is independent, meaning no conflicts of interest exist that might interfere with the auditor's ability to issue its opinion on the financial statements.\n\n(Canada Infrastructure Bank > Governance > Oversight) The bank is not subject to the Government of Canada's strong accountability and transparency rules, and the Auditor General of Canada has limited oversight over the bank and its projects. Under Ehren Cory, the bank streamlined its approval process. From 2021 onwards, the federal government stopped reviewing individual projects and began approving CIB investments by sector.  In January 2020, following numerous criticism of the bank's operations, the House of Commons commissioned an audit of federal infrastructure projects (worth over $186.7 billion) and a complete review of the bank.  The Parliamentary Budget Office (PBO) reviewed the CIB's announcements as of April 2021, and compared them with the track records of similar institutions. It concluded that the CIB is likely to spend only $16 billion of its $35 billion total budget over the course of its 11-year mandate.  In March 2021, the Canadian House of Commons Standing Committee on Transport, Infrastructure and Communities unanimously requested that the CIB provide the committee with \"all documents detailing the bonus policies and payment of bonuses to executives and the board of directors since the bank's inception\". The bank's 157-page response to this request did not include the details of its executive bonuses, citing \"competitive and privacy considerations\". Opposition members of the committee strongly criticized the bank for this omission.\n\n(Trinidad and Tobago > Economy > Creative industries) The Government of Trinidad and Tobago has recognised the creative industries as a pathway to economic growth and development. It is one of the newest, most dynamic sectors where creativity, knowledge and intangibles serve as the basic productive resource. In 2015, the Trinidad and Tobago Creative Industries Company Limited (CreativeTT) was established as a state agency under the Ministry of Trade and Industry with a mandate to stimulate and facilitate the business development and export activities of the Creative Industries in Trinidad and Tobago to generate national wealth, and, as such, the company is responsible for the strategic and business development of the three niche areas and sub sectors currently under its purview – Music, Film and Fashion. MusicTT, FilmTT and FashionTT are the subsidiaries established to fulfil this mandate.\n\n(Oregon Audits Division > Abstract) The Audits Division is a division of the Oregon Secretary of State of the U.S. state of Oregon which serves as chief auditor of public accounts. The mission of the Audits Division is to protect the public interest while helping improve Oregon government.  Auditors ensure public funds are spent as legally required, used to their best advantage and properly accounted for. Audits are conducted in compliance with stringent professional standards and use analytical tools to examine millions of records and be as meticulous as possible. All reports are publicly available.  The Audits Division administers Municipal Audit Law to ensure local governments comply. Municipal Audit Law (ORS 297.405 to 297.555 and 297.990) requires Oregon’s local governments to submit annual financial reports to the Secretary of State.\n\n(Deborah Glass > Victorian Ombudsman) Deborah Glass served as the Victorian Ombudsman from 2014 to 2024, a decade marked by significant investigations, reform efforts, and challenges within public administration in Victoria.  A champion of human rights and fairness, Glass left an indelible mark on the role of Ombudsman, overseeing investigations that held government agencies accountable and advocating for vulnerable communities. Her legacy is built upon her commitment to transparency, accountability, and justice, even in the face of political challenges and systemic inertia.\n\n(Office of the Auditor-General (Uganda) > Abstract) The Office of the Auditor General of Uganda (OAG) is the Uganda 's supreme audit institution. It audits and reports on the public accounts of Uganda and all public offices and entities that use public resources. This mandate is derived from Article 163 of the Constitution of Uganda and the National Audit Act, 2008, with supporting provisions in the Public Finance Management Act, 2015.\n\n(Controller and Auditor-General of New Zealand > The organisation's structure > Audit New Zealand) Audit New Zealand carries out annual audits allocated by the Auditor-General. It also provides other assurance services to public entities, within the Auditor-General's mandate and in keeping with the Auditor-General's Auditing Standard on the independence of auditors.  Audit New Zealand's auditors examine the financial statements of public entities and handle special governance, risk, and contract and project management assignments. Audit New Zealand has specialist Tax Audit and Information Systems Assurance Audit teams."}, {"id": "h5003", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What documented incidents of fan disorder, racism, or hooliganism have been associated with Royal Antwerp and when did they occur?", "ev": "(2023–24 Royal Antwerp F.C. season > Abstract) The 2023–24 season was Royal Antwerp Sporting Club's 144th season in existence and seventh consecutive in the Belgian Pro League. They also competed in the Belgian Cup and the Belgian Super Cup, as well as the UEFA Champions League for the first time.\n\n(Francis Severeyns > Abstract) Francis Severeyns (born 8 January 1968 in Westmalle), nicknamed Cisse, is a Belgian former professional footballer who played as a striker for Royal Antwerp, Pisa S.C., KV Mechelen, FC Tirol Innsbruck and K.F.C. Germinal Beerschot. He was the Jupiler League top scorer in 1988 with 24 goals. He played seven matches for the Belgium national team. Whilst at Antwerp he helped them to the 1993 European Cup Winners' Cup Final, in which he scored to tie the game at 1–1, although they went on to lose 3–1 to Parma.  He also played for Royal Cappellen in the Third division A. Currently, he plays for KV Westmalle, in the Belgian Provincial leagues.\n\n(Eddy Wauters > Abstract) Eduard Maria Jozef Wauters (12 July 1933 – 24 January 2025) was a Belgian footballer and chairman of Royal Antwerp Football Club. He was a player at the club and was capped four times by the Belgium national team.  Wouters was chairman of Antwerp for 43 years, from 1969 to 2012. Under his leadership, Antwerp achieved several sporting highlights, including winning the Belgian Cup in 1992 and reaching the European Cup Winners' Cup final in 1993.  In addition to his activities in the football world, Wauters also built a career in the banking sector.  Wauters died on 24 January 2025, at the age of 91.\n\n(Seol Ki-hyeon > Club career > Career in Belgium) In July 2000, Seol joined a Belgian club Royal Antwerp. He became the second South Korean footballer to score in double figures during a season in Europe, following Cha Bum-kun. After a successful season with Royal Antwerp, Seol moved to Anderlecht in the same league. He scored a hat-trick in the space of 12 minutes in the 2001 Belgian Super Cup. He also became the first South Korean player to score in the qualifying round of the UEFA Champions League. He won the 2003–04 Belgian First Division with Anderlecht.\n\n(Wim De Coninck > Abstract) Wim De Coninck (born 23 June 1959) is a retired Belgian footballer.  During his career he played for K.S.V. Waregem, Royal Antwerp F.C., K.A.A. Gent, and R.S.C. Anderlecht. He participated in UEFA Euro 1984, but did not earn any senior international caps in his career.\n\n(Jean Butez > Career > Antwerp) On 12 June 2020, it was announced that Butez had signed with Antwerp, where he was set to succeed Sinan Bolat, whose contract was not renewed. The transfer fee was deemed to be around €2 million. Mouscron refused an offer of €1 million not long before.  Butez made his debut for Antwerp on 8 August 2020 in the league match against his former club Mouscron. In January 2021, he was sidelined with an ankle injury, after which he was replaced by first Alireza Beiranvand and since Ortwin De Wolf, who had been loaned during the January transfer window. At the start of the play-offs, however, manager Frank Vercauteren again opted for Butez as the starter.  Under manager Brian Priske, Butez began the 2021–22 season as Antwerp's first-choice goalkeeper. In August 2021, he played a crucial role in the UEFA Europa League play-off round against Omonia, saving penalties from Jan Lecjaks and Panagiotis Zachariou in the shoot-out, which secured Antwerp's place in the group stage. However, the team struggled in the group stage, finishing last in their group with five points from 18 in matches against Eintracht Frankfurt, Fenerbahçe, and Olympiacos.  In the domestic league, Antwerp recovered from a slow start, losing their first two matches, but remained in the top four from the eighth matchday onwards, with Butez's numerous saves contributing significantly to their success.  In the 2022–23 season, under new manager Mark van Bommel, Butez remained the undisputed first-choice goalkeeper, playing every minute. Strengthened by the arrival of Toby Alderweireld, Antwerp's defense improved, and Butez had an outstanding season, recording 27 clean sheets in 52 matches across all competitions. Antwerp achieved a domestic treble, winning the Belgian Pro League, the Belgian Cup, and the Belgian Super Cup.  On 30 March 2024, Butez broke his hand during a match against Anderlecht, requiring surgery that ended his season early. Antwerp reportedly planned to sell him, having already signed Senne Lammens as his replacement, but interested clubs, including Ajax and Anderlecht, did not meet the asking price, and Butez remained at the club.  Under new head coach Jonas De Roeck, Butez lost his starting position to Senne Lammens. Despite his efforts to secure a transfer, no deal was finalized, and he remained at the club. Manager and analyst Hein Vanhaezebrouck described Butez as one of Belgium's top goalkeepers and expressed surprise at his demotion and failure to secure a transfer.\n\n(Royale Union Saint-Gilloise > History > Title contenders and European football > 2022–23: European participation and title contestant) Despite an early exit from the UEFA Champions League at the hands of Rangers after a 2–0 \"home\" win at OH Leuven 's Den Dreef stadium and a 3–0 loss at Ibrox, Union dropped into the UEFA Europa League and won their group, earning four victories from their six games against Union Berlin, Braga and Malmö.  A last-16 reunion with Union Berlin saw the Brussels club draw 3–3 away in Berlin, and win their \"home\" return 3–0 at Anderlecht's Lotto Park. The quarter-finals had them paired with another Bundesliga side in Bayer Leverkusen, who defeated them 5–2 on aggregate (1–1 away, 1–4 home).  Domestically, Union continued their remarkable form from the season before, lying second heading into the final round of the Belgian Pro League regular season and reaching the Belgian Cup semi-finals, only to lose to Royal Antwerp on penalties.  Union reached the final day of the title play-offs in second place on 46 points, with leaders Antwerp also on 46, top by virtue of finishing in first place at the end of the regular season. Third-placers Genk were a point behind on 45. Union would be champions if they won their game against Club Brugge, and Antwerp did not win theirs against Genk. No other scenario would crown Union as champions.  On the final matchday of the Play-offs, Union were leading 1–0 at home against Club Brugge in the 89th minute, and with Racing Genk leading Royal Antwerp 2–1 at the Cegeka Arena, Union were on the way to being champions, with the Pro League trophy being flown via helicopter to the Joseph Marien Stadium.  However, three late goals from Club Brugge - two in stoppage-time - and a late Antwerp equaliser from Toby Alderweireld sent the crown Antwerp's way. Union's second consecutive title-race collapse saw them drop to third place which qualified them to the Europa League play-off round.\n\n(Kōji Miyoshi > Club career > Royal Antwerp) On 20 August 2019, he joined Belgian First Division A side Royal Antwerp on loan for a year from Kawasaki Frontale with an option to make the deal permanent. Upon joining the club, he acknowledged the different atmosphere, playing in Belgium than his home country.  Miyoshi scored on his Royal Antwerp debut, just four minutes after coming on as a substitute, in a 2–1 win against Anderlecht on 15 September 2019. He then made his first start for the club a week later against Lokeren in the sixth round of the Belgium Cup, and scored twice, in a 4–2 win, having played extra time. Since joining Royal Antwerp, Miyoshi found his playing time, coming from the substitute bench. He also faced setbacks with injuries throughout the 2019–20 season. On 6 April 2020, it was announced that the club signed Miyoshi on a permanent basis, signing a three–year contract. He appeared as an unused substitute bench, as Royal Antwerp beat Club Brugge to win the Belgian Cup final. Due to the COVID-19 pandemic which resulted in the cancellation of the league, Miyoshi went on to make fifteen appearances and scoring three times in all competitions.  In the 2020–21 season, Miyoshi continued to fight for his first team place that saw him placed on the substitute bench, having missed the first two league matches of the season due to injury. Between October and January, he was given a number of starts for the club, playing in the right–midfield position, though played as a forward occasionally. He then scored his first goal of the season, in a 4–1 win against K.V. Mechelen on 2 October 2020. His second goal of the season came on 6 December 2020, in a 4–2 lost against Genk; which he later scored against them for the second time this season on 30 April 2021. By mid–January, however, Miyoshi lost his first team place after testing positive for COVID-19 and found his playing time, coming from the substitute bench. At the end of the 2020–21 season, he went on to make thirty–two appearances and scoring three times in all competitions.  At the start of the 2021–22 season, Miyoshi missed the three league matches of the season following his international commitment. He returned to the first team, coming on as a 71st minute substitute, in a 1–1 draw against Charleroi on 13 August 2021. Miyoshi scored in both legs of the UEFA Europa League qualifier rounds against AC Omonia and was one of the three successful Royal Antwerp penalty taker in the penalty shootout following 4–4 draw on aggregate, as the club won 3–2 in the shootout. He then scored his third goal of the season, in a 4–2 win against Genk on 22 September 2021. However, Miyoshi suffered a hamstring injury that saw him sidelined for the rest of the year. He returned to the first team, coming on as a 66th minute substitute, in a 3–0 win against Charleroi on 16 January 2022. In a follow–up match against Oostende, Miyoshi came on as a second half substitute and set up a goal for Michel-Ange Balikwisha, who scored the winning goal, in a 2–1 win. He regained his first team place for the rest of the 2021–22 season and helped Royal Antwerp qualify for the play–off I to finish fourth place and playing in the UEFA Europa Conference League next season. During a 2–1 lost against Anderlecht on 12 May 2022, Miyoshi had his goal disallowed after VAR overturned the goal, prompting criticism from manager Brian Priske. At the end of the 2021–22 season, he went on to make thirty appearances and scoring three times in all competitions.  At the start of the 2022–23 season, Miyoshi became a first team regular for Royal Antwerp, playing in the winger position. In the first leg of the UEFA Europa Conference League against Lillestrøm SK, he set up two goals, as the club won 3–1. Miyoshi then scored his first goal of the season, in a 3–0 win against Westerlo on 4 September 2022. However in a 2–1 lost against Kortrijk on 4 October 2022, he suffered a cruciate ligament tear and was substituted in the 44th minutes. Initially out for a month, his injury was sidelined further for the rest of the 2022–23 season. Despite this, Miyoshi was part of the Royal Antwerp squad that won the club their first league title in 66 years, and Belgian Cup. At the end of 2022–23 season, he went on to make fifteen appearances and scoring once in all competitions. Reflecting on winning the double, Miyoshi said: \"I think I did my best and felt a lot of good atmosphere at the club, especially in the final season. I know the feeling of winning a title. When you win the cup or a title, there is a very good feeling in the team.\" With his contract expiring at the end of the 2022–23 season, there was a slim chance of Royal Antwerp keeping him. It was later confirmed that Miyoshi would be leaving the club on 21 June 2023, ending his three years association with Royal Antwerp."}, {"id": "h5004", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Who was the author/creator of the 1990s shojo comic set in ancient Anatolia and what is their publication biography?", "ev": "(One Piece > Reception > Sales) One Piece is the best-selling manga series in history; in 2012, Oricon, a Japanese company that began its own annual manga sales ranking chart in 2008, reported that the series was the first to sell 100 million copies (the company does not report on sales figures before April 2008). The series had over 300 million copies in circulation by November 2013; over 440 million copies in circulation worldwide by May 2018; 460 million copies by December 2019; 470 million copies by April 2020; and 480 million copies in circulation in forty-three countries worldwide by February 2021. It reached 490 million copies in print worldwide by July 2021. By August 2022, the manga had reached 516.566 million copies in circulation worldwide. By March 2026, it had over 600 million copies in circulation worldwide. By 2004, the brand's merchandise had made more than $1 billion in retail sales in Japan.  One Piece was the best-selling manga series for eleven consecutive years from 2008 until 2018. In 2019, the manga did not top the chart for the first time in twelve years, ranking second in the annual manga sales ranking with over 10.1 million copies sold, although it remained as the best-selling manga by volume in its twelfth consecutive year. It was the third best-selling manga series in 2020, with over 7.7 million copies sold, while volumes 95–97 were the 23rd–25th best-selling manga volumes of 2020, behind the first twenty-two volumes of Demon Slayer: Kimetsu no Yaiba. In 2021, it was the sixth best-selling manga with over 7 million copies sold, while volumes 98, 99, and 100 were the sixth, eighth, and ninth best-selling manga volumes, respectively. It was the fourth best-selling manga series in 2022, with over 10.3 million copies sold; volumes 101–104 were among the 10 best-selling manga volumes of the year. It was the fifth best-selling manga series in the first half of 2023 (period between November 2022 and May 2023), with over 3.5 million copies sold, while volume 105 was the best-selling manga volume from the same period; volume 104 placed nineteenth. Volumes 105–107 were among the best-selling manga volumes of 2023. Volume 108 was Shueisha 's highest first print run manga volume of 2023–2024 (period between April 2023 and March 2024), with 3.2 million copies printed.  Individual volumes of One Piece have broken publishing and sales records in Japan. In 2009, the 56th volume had a print run of 2.85 million, the highest initial print run of any manga by then. The 57th volume had a print run of 3 million in 2010, a record that was broken several times by subsequent volumes. The 60th volume had a first print run of 3.4 million and was the first book to sell over two million copies in its opening week on Oricon book rankings, and later became the first book to sell over three million copies in Oricon's history. In 2012, the 67th volume had an initial print run of 4.05 million, holding the record of the volume with the highest number of copies in the first print. One Piece is the only manga that had an initial print of volumes of above 3 million continuously for more than ten years. In May 2023, it was reported that each of the 105 volumes, published by then, had sold over 1 million copies. Additionally, One Piece is the only work whose volumes have ranked first every year in Oricon's weekly comic chart existence since 2008.  One Piece has also sold well in North America, charting on Publishers Weekly ' s list of best-selling comics for April/May 2007 and numerous times on The New York Times Manga Best Seller list. On ICv2 ' s list of Top 25 Manga Properties Fall 2008 for North America, which is compiled by interviews with retailers and distributors, Nielsen BookScan 's Top 20 Lists of graphic novels and ICv2 ' s own analysis of information provided by Diamond Comic Distributors, One Piece came in fifteenth place. It rose to second place on their Top 25 Manga Properties Q3 2010 list. By August 2022, the manga has sold 2.9 million copies in print in North America (including single volumes and omnibus editions).  In France, One Piece is very popular and has been the best-selling manga since 2011, with over 31.80 million copies sold by August 2022. Its sales alone represented 8.5% of the French manga market by 2021. The first volume had sold more than 1 million copies in France by July 2021. The 100th volume had one of the biggest initial prints ever for a manga in the French market, selling 131,270 copies in just three days, the best-selling manga volume in a week in the country. The manga sold 6,011,536 copies in 2021. This amount represents almost 20% of the total sales in the country; almost one in five volumes of the series was sold in the year.  In Italy, One Piece had 18 million copies in circulation by April 2021, which represents around 22.5% of the series market outside Japan. In September 2021, the limited edition of the ninety-eighth volume ranked first in the best-selling books weekly ranking, marking the first time that a manga reached that achievement.\n\n(Alichino > Publication) Written and illustrated by Kouyu Shurei, Alichino was serialized in Home-sha's shōjo manga magazine Comic Eyes from October 1997 to October 2001, when the magazine ceased its publication; the manga remains unfinished. Shueisha collected its chapters in three wideban volumes, released from November 25, 1998, to May 25, 2001.  The manga was licensed for English release in North America by Tokyopop, who released the three volumes from February 8, 2005, to September 13, 2005. The Tokyopop version of the manga is out of print.\n\n(The Tale of Genji (manga) > Publication) Written and illustrated by Waki Yamato, The Tale of Genji was serialized in Kodansha 's shōjo manga magazines Minmi and Minmi Excellent from 1979 to 1993. Kodansha collected the chapters into 13 tankōbon volumes, released between November 15, 1980, to July 13, 1993.  Kodansha International published four volumes as part of its bilingual manga program from 2000 to 2001. Kodansha USA began publishing the manga digitally, releasing ten volumes from February 26, 2019, to February 4, 2020.\n\n(Naruto > Reception > Sales) The manga has 250 million copies in circulation worldwide, making it one of the best-selling manga series in history. More than half of the total circulation is in Japan, with the remaining circulation being from 46 other countries and regions. It has become one of North American publisher Viz Media's best-selling manga series; their translation of the series appeared on the USA Today and The New York Times bestseller lists several times. It was included in the fiction section of the Teacher Librarian ' s recommended list for 2008, and School Library Journal described it as an essential manga for school libraries. Volume 28 of the manga reached seventeenth place in the USA Today Booklist in its first week of release in March 2008, only two places short of the record for a manga, held by Fruits Basket. The volume had one of the biggest debut weeks of any manga in years, becoming the top-selling manga volume of 2008 and the second best-selling book in North America. In 2010, Viz, the publisher, commented on the loyalty of readers, who reliably continued to buy the manga as the volume count went over 40.\n\n(Eiichiro Oda > Abstract) Eiichiro Oda (Japanese: 尾田 栄一郎, Hepburn: Oda Eiichirō; born January 1, 1975) is a Japanese manga artist and the creator of the series One Piece, the best-selling manga in history and the best-selling comic series printed in volume. With more than 600 million tankōbon copies of One Piece in circulation worldwide, Oda is one of the best-selling fiction authors. The series' popularity resulted in Oda being named one of the artists who changed the history of manga.\n\n(One Piece > Abstract) One Piece is a Japanese manga series written and illustrated by Eiichiro Oda. It follows the adventures of Monkey D. Luffy and his crew, the Straw Hats, as he searches the mythical treasure known as the \"One Piece\" to become the next King of the Pirates. The manga has been serialized in Shueisha 's shōnen manga magazine Weekly Shōnen Jump since July 1997, with its chapters compiled in 114 tankōbon volumes as of March 2026. It was licensed for an English-language release in North America and the United Kingdom by Viz Media and in Australia by Madman Entertainment.  Becoming a media franchise, it has been adapted into a festival film by Production I.G, and an anime series by Toei Animation, which premiered in October 1999. Additionally, Toei has developed 14 animated feature films and one original video animation (OVA). Several companies have developed various types of merchandising and media, such as a trading card game and video games. Netflix released a live-action TV series adaptation in 2023.  One Piece has received praise for its storytelling, expansive worldbuilding, art, characterization, and humor. It is regarded by critics and readers as one of the greatest manga series of all time. By March 2026, it had over 600 million copies in circulation worldwide, making it the best-selling comic series in volume format and the best-selling manga series ever. It holds various publishing records, including the highest initial print run for any book in Japan. In 2015 and 2022, it set the Guinness world records for \"most copies published for the same comic book series by a single author\". It was the best-selling manga for 11 consecutive years (2008–2018) and remains the only series with over 3 million initial prints for over ten years, as well as the only one with every of its over 100 published tankōbon volumes selling over 1 million copies. Since 2008, it has consistently ranked first in Oricon 's weekly comic chart.\n\n(Berserk (manga) > Reception > Sales) From 2008 to 2025, volumes 33–43 of Berserk debuted in the top six on the Oricon weekly manga chart; volumes 34 and 40 debuted first in 2009 and 2018, respectively. By July 2015, the manga had over 27 million copies in circulation in Japan and 8 million worldwide; over 40 million copies in circulation by January 2016; over 50 million copies in circulation (including digital versions) by May 2021; over 55 million copies in circulation (including digital versions) by October 2022; over 60 million copies in circulation (including digital versions) by September 2023; and over 70 million copies in circulation by August 2025.  Berserk received an Excellence Award of Hakusensha's Denshi Shoseki Taishō (E-Book Award) in 2015, which went to the publisher's best-selling digital manga from July 1, 2014, to June 30, 2015; it won the same award in its 2021 edition, which went to the publisher's best-selling digital manga from January 1 to December 31, 2021.  In March 2017, Michael Gombos, Dark Horse Comics' director of international publishing and licensing, reported that Berserk was their best-selling product of all time (not just among manga), dethroning Lone Wolf and Cub, and it had over 2 million copies sold in North America by September 2018. By February 2026, the series had sold over 10 million copies in English. Following the announcement of Miura's death in May 2021, it was reported that the first eight volumes of Dark Horse's deluxe edition of Berserk ranked on Amazon 's top 100 overall best-selling books list. According to ICv2, Berserk was the fourth best-selling manga franchise for the Q4 2021 (September–December) period in the United States, and it was also the tenth \"most efficient manga franchise\" for retailer bookshelves, based on the website's calculations of which manga franchises had the highest sales per volume. The first volume of Dark Horse's deluxe edition was one of the highest-selling manga volumes of 2022; it was also one of the highest-selling manga volumes of 2023."}, {"id": "h5005", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When did Royal Antwerp most recently qualify for European competition and via which route (league position, cup, etc.)?", "ev": "(컨텍스트 없음)"}, {"id": "h5006", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How are Welsh Labour candidates for UK Parliament and the Senedd selected under party rules?", "ev": "(2026 Welsh Labour leadership election > Electoral system) The Leader of Welsh Labour has to be a member of the Senedd. Candidates need nominations from either 20 percent of the party’s Senedd group (equating to two other members), ten percent of Labour MSs (one other member) and 20 percent of Constituency Labour Parties (equivalent to seven CLPs), or ten percent of MSs and three nominations from Welsh Labour affiliated organisations which must include at least two affiliated trade unions.\n\n(2026 Senedd election > Abstract) An election for the Senedd (Welsh Parliament; Welsh: Senedd Cymru) was held on 7 May 2026, to elect all 96 members to the Senedd. It was the seventh devolved general election since the Senedd (formerly the National Assembly for Wales) was established in 1999. It was the first election following numerous reforms: an increase in the size of the Senedd from 60 members to 96, the adoption of party-list proportional representation, the reduction of the number of constituencies to sixteen, and the shortening of its term from five years to four. The election was held on the same day as local elections in England and elections to the Scottish Parliament.  Welsh Labour lost government and its status as the largest party for the first time since devolution began in 1999, ending a winning streak that had lasted since the 1922 United Kingdom general election and resulting in a historic realignment of Welsh politics. Plaid Cymru emerged as the largest party for the first time with 43 seats, while Reform UK secured second place with 34 seats. Labour was reduced to third place with a historic low of 9 seats. The Welsh Conservatives and the Wales Green Party won 7 and 2 seats respectively, with the Greens entering the Senedd for the first time. With her failure to secure a seat in the constituency of Ceredigion Penfro, First Minister Eluned Morgan became the first leader of a government in the UK to lose their seat while in office.  Turnout was 51.72%, the highest ever for a Welsh devolved election.\n\n(2026 Senedd election > Background) In the 2021 Senedd election, Welsh Labour won another government with one seat short of a majority. Shortly after, they entered a co-operation agreement with Plaid Cymru, which fell short of a typical coalition or confidence and supply agreement but represented some degree of policy collaboration. At the 2022 Welsh local elections, the Welsh Conservatives suffered losses to Plaid Cymru and Labour.  In December 2023, Mark Drakeford announced he would stand down as First Minister, following the election of his successor. The ensuing Welsh Labour leadership election was won narrowly by Vaughan Gething. The Gething government lasted only until July 2024 due to two distinct scandals relating to allegations of cronyism and allegations that Gething had lied about deleting text messages relating to the COVID-19 pandemic. During this time, Plaid Cymru left the co-operation agreement.  In the midst of this, at the 2024 United Kingdom general election in Wales, Labour won the most seats and the Conservatives were wiped out: losing all their Welsh seats. Later in July, Gething announced he would stand down after a process to select his successor. The following July 2024 Welsh Labour leadership election was uncontested, with Eluned Morgan being elected.  At the UK-wide level, a number of other factors influenced the election, including various issues relating to the Starmer ministry and the ongoing United Kingdom cost-of-living crisis.  In October 2025, Plaid Cymru won the Caerphilly by-election from Labour, who had held the seat since the Senedd's inception in 1999 and its Westminister counterpart since the seat's creation in 1918.  Since the middle of the Gething Government, and continuing through successive events, Welsh Labour's polling performance had declined. Welsh Labour had previously been the most successful political party in the democratic era, having the longest winning streak of any political party. The 2026 vote is correspondingly considered to be seismic for Welsh politics and was touted as the \"most consequential Senedd election since 1999\". It has also attracted \"unprecedented\" interest internationally in Welsh politics, primarily from other European nations. Polls suggested a close race between Plaid Cymru and Reform UK.  The 2026 Senedd election was the first to feature an online elections information platform, vote.wales, managed by the Electoral Management Board for Wales, part of the Democracy and Boundary Commission Cymru."}, {"id": "h5007", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did the player’s college role and usage rate compare to his role and usage rate during his first ten professional seasons?", "ev": "(Kawhi Leonard > Abstract) Kawhi Anthony Leonard (/ k ə ˈ hw aɪ / kə- WHY; born June 29, 1991) is an American professional basketball player for the Los Angeles Clippers of the National Basketball Association (NBA). A two-time NBA champion and Finals MVP, he is a seven-time All-Star and a six-time member of the All-NBA Team (including three First Team selections). Nicknamed the \" Claw \" or \" Klaw \" for his ball-hawking skills and exceptionally large hands, Leonard is often regarded as one of the greatest two-way players in NBA history, earning seven All-Defensive Team selections and winning Defensive Player of the Year honors in 2015 and 2016. In 2021, he was named to the NBA 75th Anniversary Team.  Leonard played two seasons of college basketball for the San Diego State Aztecs and was named a consensus second-team All-American as a sophomore. He opted to forgo his final two seasons of college eligibility to enter the 2011 NBA draft. He was selected by the Indiana Pacers with the 15th overall pick before being traded to the San Antonio Spurs on draft night.  With the Spurs, Leonard won an NBA championship in 2014, when he was named the Finals Most Valuable Player. After seven seasons with the Spurs, Leonard was traded to the Toronto Raptors in 2018. In his only season with the Raptors in 2019, he led the Raptors to their first NBA championship and won his second Finals MVP award (one of only three players to win Finals MVP with multiple teams, along with Kareem Abdul-Jabbar and LeBron James). He subsequently moved to his hometown of Los Angeles and signed with the Clippers as a free agent in July 2019."}, {"id": "h5008", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did box-office performance and critical reception vary for her films across the three industries?", "ev": "(Ileana D'Cruz > Career > Critical and commercial success in Telugu films (2008–2011)) D'Cruz played a college student in love with her sister's ex-lover in the 2008 film Jalsa, opposite Pawan Kalyan. The film was a box office success and one of the year's highest grosser. She received largely positive remarks, with critics citing that she looked \"pretty\", and \"damn cool\". Her performance won her the Santosham Award for Best Actress alongside her second Filmfare Best Actress – Telugu nomination. Her second release that year Bhale Dongalu opposite Tarun received mixed reviews from critics and audience.  D'Cruz had three film releases in 2009. In her first film Kick, she reunited with Ravi Teja, played a modern girl. It was a commercial success, becoming one of the highest-grossing films of the year. A critic stated: \"Ileana plays her part well. She is still as sexy as ever and the director exploits her charm and sex appeal to the hilt.\" The film earned her third Filmfare Best Actress – Telugu nomination. Her other two releases that year: Rechipo opposite Nithiin and Saleem opposite Vishnu Manchu, performed poorly at the box office.  In 2010, D'Cruz had a special appearance in the Kannada film Huduga Hudugi. D'Cruz appeared in two films in 2011. Her first film that year was Shakthi, opposite Jr. NTR, where she played a minister's daughter. The socio-fantasy film was the costliest Telugu film ever made at ₹ 250,000,000. It became a box office failure. A Rediff.com critic criticised her performance. Her next release Nenu Naa Rakshasi, saw her play a YouTuber and vlogger opposite Rana Daggubati. Though the film was a failure, her performance was received positively by critics; an India Glitz reviewer described her as a \"pleasant surprise in the film\" as she \"cried, smirked, looked hot, grabbed sympathy and made faces that were apt to the scenes\", Despite these failures, D'Cruz continued to be among the highest-paid actresses in South Indian cinema.\n\n(List of highest-grossing Indian films > Overview) Indian films have been screened in markets around the world since the early 20th century. Since 2003, there are markets in over 90 countries where films from India are screened. During the first decade of the 21st century, there was a steady rise in the ticket price, a tripling in the number of theatres and an increase in the number of prints of a film being released, which led to a large increase in the box office collections.  As of 2014, Hindi cinema represents 43% of the net box office revenue in India, while Telugu and Tamil cinema represent 36%, and other industries constitute 21%. As of 2020, the combined revenue of all other language film industries has surpassed that of the Hindi film industry. By 2021, Telugu cinema became the largest film industry of India in terms of box-office. In 2023, the Hindi film industry accounted for 44% of box office revenue, followed by the Telugu industry at 19% and the Tamil industry at 16%. The Kannada (5%), Malayalam (3%), Bengali, Marathi, Odia, Punjabi, Gujarati and Bhojpuri industries contributed to the remainder, while the foreign film industry made up 9% of the total revenue. In 2024, the Hindi and the Telugu film industries accounted for 40% and 20% of the domestic gross box office revenue respectively, followed by Tamil with 15% share and Malayalam with 10% share.\n\n(Mahesh Babu filmography > Abstract) Mahesh Babu is an Indian actor and producer known for his work in Telugu cinema. He first appeared in the 1979 film Needa when he was four years old. He continued to perform as a child actor in several films, most of which featured his father Krishna. Following his role as the titular protagonist in Balachandrudu (1990) while still a child, his career went on hiatus so he could concentrate on his education until taking on his first lead role as an adult in the 1999 film Rajakumarudu, for which he won the Nandi Award for Best Male Debut. Afterwards, his career stagnated until successes like Murari (2001), Okkadu (2003) and Athadu (2005) brought him fame. In 2006, he played a gangster in the Puri Jagannadh -directed action-thriller Pokiri. The film became the highest-grossing Telugu film of all time, and according to Vogue India, cemented Babu's reputation as a \"superstar\".. Pokiri was released on 28 April 2006. The film grossed over ₹ 70 crore worldwide in its initial theatrical run and was declared an Industry Hit while remaining as the highest-grossing Telugu film for three years until it was surpassed by Magadheera in 2009. It also became the highest-grossing South Indian film in its original run, surpassing Chandramukhi, and became the first South Indian film to gross over ₹60 and ₹70 crore in a single language. The film altered the landscape of Telugu commercial cinema. It solidified Mahesh Babu's status as a star, transitioning his image from a charming youth icon\" to a formidable mass hero.  In the wake of the failures of Sainikudu (2006) and Athidhi (2007), Babu took a long-term break from cinema for personal reasons. His next project, the fantasy action film Khaleja, was released in 2010 after significant delays. In 2011, he starred in Dookudu, which became the first Telugu film to gross over ₹ 1 billion. Businessman (2012), his next film, was well received and became one of the year's highest grossing Telugu films at a time that was particularly harsh on other big-budget productions. The following year, Babu co-starred alongside Venkatesh in the critically and commercially acclaimed drama film Seethamma Vakitlo Sirimalle Chettu, which was considered the first Telugu multi-starrer in decades.. Seethamma Vakitlo Sirimalle Chettu netted ₹ 38.75 crore at the AP/Nizam box office during its run, earning a distributor share of ₹ 51 crore at the global box office and declared a commercial success.. He then featured in Sukumar 's 2014 psychological thriller film 1: Nenokkadine. Although Babu's performance as a schizophrenic rock star was lauded by critics, the film itself received mixed reviews and failed to recover its budget. Aagadu, his next release that year, suffered a similar fate,.The film received mixed reviews, with praise directed towards its music, cinematography, action sequences, and Mahesh Babu's performance. However, the complexity of the screenplay and its length garnered criticism. The film eventually became a box office failure. It won three awards from eight nominations at the 4th SIIMA Awards and two awards at the 11th CineMAA Awards. Over time, the film was reevaluated and gained a cult following for its unique narrative, technical finesse and Babu's performance. It was also listed among Film Companion 's \"25 Greatest Telugu Films of the Decade.\" despite the film's opening gross being his highest at the time.  His 2015 action-drama Srimanthudu was a commercial success and earned Babu his fifth Filmfare Award for Best Actor – Telugu as well as his eighth Nandi Award in any category, the most by any individual. The film was also his first as a producer. His subsequent film Brahmotsavam (2016) and his first bilingual film Spyder (2017) under-performed at the box office.. It grossed ₹ 92 – 150 crore against a budget of ₹ 120 crore..The actor's next role was as an inexperienced chief minister in Koratala Siva 's Bharat Ane Nenu (2018). The film was the year's second highest-grossing Telugu production and critics praised Babu's performance.. His following two films, Vamshi Paidipally 's action-drama Maharshi (2019) and Anil Ravipudi 's action-comedy Sarileru Neekevvaru (2020), also made substantial profits despite receiving less favourable reception.. Maharshi By the end of its theatrical run, the film had grossed ₹ 2 billion (US$21 million) worldwide,. Sarileru Neekevvaru collected ₹46.77 crore worldwide. Within three days, the film grossed ₹103 crore, and within 10 days, it reached ₹200 crore.. Babu's 2022 film Sarkaru Vaari Paata also received a mixed response, however, his performance was appreciated by critics.. Sarkaru Vaari Paata grossed ₹185 crores worldwide in its theatrical run and became the third highest-grossing Telugu film of 2022.. In 2024, Babu reunited with Trivikram Srinivas for their third collaboration in the film Guntur Kaaram.. IN 2025, Babu began filming Varanasi, his maiden collaboration with director S. S. Rajamouli.\n\n(Trisha Krishnan > Film career > 2004–2008: Stardom in Telugu and Tamil cinema) In 2004, she debuted in Telugu cinema with M. S. Raju -produced romantic action film Varsham, which turned her into an overnight sensation. Critics lauded her performance as Sailaja, a middle-class girl who becomes a film star on her father's insistence; Jeevi from Idlebrain stated that she was \"beautiful\" and a \"big plus to the film\", labelling her performance as \"natural\", while Sify noted that she had \"transformed herself into a fine actress with immense screen presence\". The film was a major commercial success, running in theatres for over 175 days and becoming one of the highest-grossing films of the year, and was declared a \"sensational hit\". For her role in Varsham, Trisha won her first Filmfare Awards for Best Actress – Telugu award, as well as the Santosham Award for Best Actress.  Later in 2004, she acted as the female lead opposite Vijay in the action comedy film Ghilli. She played the character of Dhanalakshmi, a helpless girl who is protected from a thug by a Kabaddi player. Trisha's portrayal of Dhanalakshmi is considered one of her memorable performances and a standout role in her career, and the film eventually emerged as the highest-grossing Tamil film of the year, celebrating a 175-day run, and was Trisha's biggest commercial success at the time. She next appeared in a small role in Mani Ratnam 's political drama Aayutha Ezhuthu (2004), starring as part of an ensemble cast that included Siddharth, Madhavan and Suriya, despite favourable reviews, the film had an average box office performance.  In the following two years, Trisha had 12 releases overall, where she featured as the female lead. She starred as the leading actress in two action commercial flicks Thirupaachi (2005) and Aaru (2005), directed by Perarasu and Hari respectively. Of these, Thirupaachi became a major commercial success. In her second Telugu project, the romantic drama Nuvvostanante Nenoddantana (2005), she starred alongside Siddharth. The film, being Prabhu Deva 's directorial debut, opened to rave reviews, with Trisha receiving praise for her portrayal as the village girl Siri. This performance earned her several Best Actress awards, including her second consecutive Filmfare Awards for Best Actress – Telugu and her first Nandi Award for Best Actress. Idlebrain noted that she was \"just great. Her tender looks, appearance and Telugu traditional costumes make her a treat to watch\", further labelling her expressions and \"naughty antics\" as excellent, while Sify wrote of Trisha that she was \"amazing as Siri It is her career-best performance and she has excelled throughout.\" The film eventually won eight Filmfare Awards South, the most ever by any Telugu film, while also emerging as a major commercial success at the box office.  Continuing her string of releases in 2005, she then starred alongside Mahesh Babu in the action thriller Athadu, which proved to be a critical and commercial success, and her performance as Poori earned her third nomination for the Filmfare Award for Best Actress – Telugu. Trisha later went on to reprise the role in its Tamil remake, Nandhu, as well. Her subsequent releases, N Lingusamy 's political action film Ji (2005) starred opposite Ajith Kumar was commercially unsuccessful and Aathi (2006), strarred opposite Vijay was an average grosser.  Her next role in Pournami (2006), she played the role of Pournami, a young woman destined to perform a sacred dance ritual was directed by Prabhu Deva, saw her third-consecutive starring role in an "}, {"id": "h5009", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What changes in government funding, grants, or institutional support for disability sport in Australia followed the 1976 Paralympics?", "ev": "(John Grant (neurosurgeon) > Abstract) John MacDonald Falconar Grant, AO, OBE (14 August 1922 – 10 November 2013) was an Australian neurosurgeon and disability sport administrator. He was president of the 2000 Sydney Paralympic Games Organising Committee. He played a leading role in the development of disability sport in Australia.\n\n(Malta at the 2008 Summer Paralympics > Background) Malta made its debut in the Paralympic Games at the first official edition of the event, the 1960 Summer Paralympics. Excepting 1976 and the period between 1988 and 2004, the island country had participated in a total of seven Summer Paralympic Games and medalled a total of seven times in athletics, lawn bowls, snooker and table tennis. The 2008 Summer Paralympics were held in Beijing, China from 6 to 17 September 2008 with a total of 3,951 athletes representing 146 National Paralympic Committees. Runner Antonio Flores was the sole athlete to represent Malta at the Beijing Paralympics; he represented the island nation in the sport of para-athletics and was accompanied by his physiotherapist Nathan Farrugia and sports coordinator Adelaide Silva. Flores travelled to China from Malta on 1 September, and he was selected to be the Maltese flag bearer for the parade of nations during the opening ceremony.\n\n(Para-swimming classification > Classification at the Paralympics) All disability types were eligible to participate at the 1992 Summer Paralympics. The IPC oversaw classification based on functional disability. General and functional classification took place in the Paralympic Village, with functional swimming classification taking place on the same dates at the Piscines Bernat Picronell. The process became a contentious issue at the Paralympics because of on-the-spot reclassifications that resulted in changes to the competition schedule. On-the-spot classification or re-classification was viewed as a negative aspect of the 1996 Summer Paralympics, and the Paralympic movement overall. At the 2000 Summer Paralympics, 54 assessments were conducted, resulting in 13 class changes. There was one Paralympic New Status (PNS) protest and two Paralympic Permanent Status (PPS) protests by a national Paralympic committee, with one classification upheld and two denied. Six classification appeals were lodged for swimming at the 2000 Summer Paralympics involving four athletes, resulting in two class changes. For the 2016 Summer Paralympics in Rio de Janeiro, the IPC had a zero classification at the Games policy. This policy was put into place in 2014, with the goal of avoiding last minute changes in classes that would negatively impact athlete training preparations. All competitors needed to be internationally classified with their classification status confirmed prior to the Games, with exceptions to this policy being dealt with on a case-by-case basis. In case there was a need for classification or reclassification at the Games despite best efforts otherwise, swimming classification was scheduled to take place at the Olympic Aquatics Stadium, with visually impaired swimmers getting classified from September 4 to 6 and all other swimmers being classified from September 3 to 5. For sportspeople with physical or intellectual disabilities going through classification or reclassification in Rio de Janeiro, their in-competition observation event is their first appearance in competition at the Games.\n\n(Australia at the 1988 Winter Paralympics > Athletes) Hans Hinterholzer and Jamie Milner were the two team coaches for the Australian Alpine skiing events at the Innsbruck Paralympics. Australia was fortunate effort to take 5 Paralympic athletes to represent Australia in the 1988 Games in Innsbruck. Each athlete who competed did not qualify for a medal at these games. Four out of five of the Australian athletes competed in the Men's Downhill, Men's Giant Slalom and Men's Slalom apart from David Munk who only participated in the Men's Giant Slalom and Men's Slalom. Each athlete had different classifications ranging from upper body disabilities to lower body disabilities. All classifications of every athlete competing in the Paralympic Games of any sort are done so by the International Paralympic Committee (IPC).  Michael Collins participated in the Men's Downhill LW6/8, Men's Giant Slalom LW6/8 and Men's Slalom. He was ranked 10 out of 23 athletes with a time of 1:18.86 in the Men's Downhill LW6/8. In the Men's Giant Slalom LW6/8 and the Men's Slalom Collins was unable to finish. Michael Collins was classed as an athlete who had upper extremity issues. This can range from a skier being classified in the LW6/8 category if they have paralysis, motor paresis affecting one arm or a single upper arm amputation.  Kyrra Grunnsund represented Australia in five Paralympics. He was the first Australian to compete at both the Summer and Winter Paralympics. He competed in both the Alpine and Cross-country skiing over the course of his career but in the 1988 Winter Paralympic Games he only competed in the Men's Downhill LW4, Men's Giant Slalom LW4 and Men's Slalom LW4. He ranked 13th out of 14 athletes in the Men's Downhill LW4 with a time of 1:19.78. In the Men's Giant Slalom LW4 and Men's Slalom LW4 he did not finish. Kyrra Grunnsund was classified as an athlete who had a disability in one lower extremity. He is a below-the-knee amputee and classed in the LW4 category for the Paralympics.  Evan Hodge competed in the 1988 men's Downhill LW2, Men's Giant Slalom LW2 and Men's Slalom. All three events he qualified and was ranked into the top 15 athletes. His best time was in the Men's Slalom LW2 with a time of 1:34.05 and was ranked 8th out of 33 competitors. Hodge was classified with having severe disability in a lower limb where an amputation or arthrodesis in the leg and hip. Specific skiing and training techniques have been developed for this LW2 skiers that address their disability type and equipment use. A factoring system is used in both para-alpine and para-Nordic to allow different classes to compete against each other when there are not many competitors in one class in a competition.  Michael Milton grew up in a skiing family. At the age of 9 years old, his left leg was amputated above the knee due to bone cancer. After having an amputation, he was more determined to be able to ski again. Milton debuted in the 1992 Tignes-Albertville Winter Paralympics and has an extensive career in both Summer and Winter Paralympic games. He did compete in the 1988 Innsbruck games but did not qualify for a medal in any of the events he competed in. His best ranked event in the 1988 Paralympics was in the Men's Giant Slalom LW2 where he was ranked 11th out of 33 competitors. Like teammate Hodge, Milton was classed in the LW2 category for the Winter Paralympic games.  David Munk is an Australian Paralympic Alpine sit skier. He debuted in the 1992 Winter Paralympics where he won a bronze medal in the Men's Super-G LW11. At the 1988 Winter Paralympics he was unfortunately disqualified from the Men's Giant Slalom LW10 but was able to rank 13th out of 29 competitors in the Men's Slalom LW10. He was classed in the LW10 category due to the little support he had when sitting up right. The International Paralympic Committee defined this para-alpine classification as; a disability in the lower limbs and no sitting balance. Athletes who were classed in this category were given physical equipment adapted to their specific needs.\n\n(John Grant (neurosurgeon) > Disability sport career) Grant's interest in the role of sport in the rehabilitation for people with spinal injuries can be linked to the work of Sir Ludwig Guttman, neurologist from Stoke Mandeville Hospital. In 1957, he visited the hospital and observed the role of sport in rehabilitation. In 1958, he played a major role in organising the First Royal North Shore Hospital Games for spinal injury patients. The Games were held at the Gore Hill Oval near the hospital. Grant also played a role in including sports in rehabilitation programs at Mount Wilga House. It held annual Sports Days. The Australian Team to the 1960 Rome Paralympics included eight competitors who had been patients at Mt Wilga Rehabilitation Centre and trained by Kevin Betts and Eileen Perrottet.  In 1961, he co-founded with Jack Ferguson the Paraplegic and Quadriplegic Association of New South Wales. He was president from 1968 to 2000. While President of this Association, he was instrumental in establishing the Junior National Wheelchair Games. He was the Medical Officer and Team Manager of the Australian teams that competed at the 1966 and 1970 Commonwealth Paraplegic Games. Grant and compatriate Graham Pryke were founding members of the FESPIC Games. In 1977, he was Chairman of the Organising Committee for the 2nd FESPIC Games held in Sydney.  In 1980, he wrote to the Minister for Sport, Bob Ellicott, stating the case for a national policy on sport for people with disabilities. Subsequently, the Australian Government established a national advisory committee on sports for disabled persons he was a member of. In 1993, he was the Chairman of the Sydney Bid Committee for the 2000 Paralympic Games. The successful bid led to Grant becoming President of the Sydney Paralympic Games Organising Committee 1994–2000.  Grant held leadership positions with several international disability sports organisations: President of International Stoke Mandeville Wheelchair Sports Federation, Chairman of the International Co-ordinating Committee of World Sports for the Disabled, and Member of the International Paralympic Committee."}, {"id": "h5010", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which junior national and international titles did the swimmer win, and in what years?", "ev": "(Nicolò Martinenghi > Abstract) Nicolò Martinenghi (Italian:; born 1 August 1999) is an Italian swimmer and the reigning Olympic champion in the 100 metre breaststroke event, having won the gold medal at the 2024 Summer Olympics. He is a two-time world record holder in the 4×50 metre medley relay, swimming breaststroke on both relays. He is the Italian record holder in the 50 metre breaststroke and 100 metre breaststroke (both long course and short course).  In the long course 100 metre breaststroke, Martinenghi won the gold medal at the 2022 World Aquatics Championships and the 2022 European Aquatics Championships, as well as the bronze medal at the 2020 Summer Olympics. In the short course version of the event, he was European champion in 2021 and won silver medals at the 2021 and 2022 World Short Course Championships. In the long course 50 metre breaststroke, he was European champion in 2022, World Aquatics Championships silver medalist in 2022, and European Aquatics Championships bronze medalist in 2021. For the short course event, he won a pair of silver medals in 2021 and 2022, one at the 2021 World Short Course Championships and one at the 2022 World Short Course Championships, and a bronze medal in 2021 at the year's European Short Course Championships. He won a gold medal in the 100m breaststroke at Paris 2024.\n\n(Penny Oleksiak > Abstract) Penelope Oleksiak (born June 13, 2000) is a Canadian competitive swimmer. Nicknamed \"Magic Penny\", she is one of her country's most decorated Olympians. Oleksiak rose to fame during the 2016 Summer Olympics, where she became the first Canadian to win four medals in the same Summer Games, and the country's youngest Olympic champion with her gold medal win in the 100 m freestyle. She was the first athlete born in the 2000s to claim an Olympic gold medal in an individual event. Her success led to her being awarded the 2016 Lou Marsh Trophy as Canada's top athlete, the Bobbie Rosenfeld Award as Canada's top female athlete for 2016, and a member of the Canadian Press team of the year. Five years later she won three additional medals at the 2020 Summer Olympics, breaking the national record for Olympic medals; joined in 2024 by sprinter Andre De Grasse, with seven Olympic medals each.  Widely considered the face of a resurgent Canadian women's swimming team in the 2010s, Oleksiak is also Canada's most decorated athlete at the World Aquatics Championships and a multi-medallist at the World Swimming Championships, World Junior Championships, and Commonwealth Games. She is the current junior world and Canadian record holder in the 100 m freestyle, and formerly held the world junior and Canadian records in the 100 m butterfly, as well as the Olympic record in the 100 m freestyle alongside Simone Manuel.\n\n(Natalie Coughlin > International career > 2005–2006) At the eleventh World Aquatics Championships in Montreal, Quebec, Coughlin won five medals, including a gold and 2 silvers and 2 bronzes. Coughlin won a gold medal in the women's 200 m freestyle relay and silver medals in the 100 meter medley relay and the 100 m freestyle. She also won bronze medals in the 100 m backstroke and the 100m freestyle relay.  Coughlin worked as an in-studio host for MSNBC during the 2006 Winter Olympics in Turin, Italy.\n\n(Roos Vanotterdijk > Career > 2022 > 2022 European Junior Championships) Vanotterdijk won five medals at the 2022 European Junior Swimming Championships, held in Otopeni, Romania in July, including one gold medal, two silver medals, and two bronze medals. Her first medal was a bronze medal in the 50 metre backstroke, where she finished third with a time of 28.62 seconds after setting a new Belgian record in the semifinals with a time of 28.50 seconds. In the 100 metre butterfly, she won the gold medal and European junior title with a Belgian record time of 57.85 seconds, swimming 0.06 seconds faster than the previous mark of 57.91 seconds set by Kimberly Buys. She next won the bronze medal in the 100 metre freestyle with a personal best time of 55.34 seconds to finish within seven-tenths of a second of gold medalist Nikolett Pádár of Hungary. For the 100 metre backstroke, she won the silver medal with a Belgian record time of 1:00.90, finishing just 0.02 seconds behind the gold medalist Dóra Molnár of Hungary. Later in the same finals session as the 100 metre backstroke, she won a second silver medal, this time in the 50 metre butterfly with a time of 26.63 seconds, finishing 0.13 seconds ahead of bronze medalist Jana Pavalić of Croatia.\n\n(Dan Jorgensen (swimmer) > 1992 Barcelona Olympic bronze > International competition highlights) At the World Championships Jorgensen captured a silver medal in the 1991 4x200 relay at the 1991 World Championships. He won three bronze medals in 1986 at the World's in the 4x200 free, the 400 free, and the 1,500 free relay. At the Pan Pacifics, Jorgensen captured gold medals in his signature event, the 4x200 freestyle, in 1989 and 1991. He won individual medals at the Pan Pacifics in various years from 1987-91 in the 1,500 freestyle, 400 freestyle, and 800 freestyle events.\n\n(Roos Vanotterdijk > Career > 2025 > 2025 World Aquatics Championships) Having twice broken her national record in the heats and semi-final of the 100 m butterfly, she finished second in the final, beaten only by the world record holder Gretchen Walsh, setting a new national record for a third time in under two days, winning her nation's first swimming medal at the World Aquatics Championships since Fred Deburghgraeve won the 100m breaststroke in Perth 1998, moving herself up to eighth all-time and the ninth woman to break 56 seconds with a time of 55.84 seconds. She then followed this up with a bronze medal in the 50 m butterfly becoming the first Belgian swimmer to win two medals at the same swimming World Championships.\n\n(Barbara Krause > Abstract) Barbara Krause (later Wanja, born on 7 July 1959 in East Berlin) is a former freestyle swimmer from East Germany. She was a three-time Olympic gold medalist and eight-time world record holder. At the 1980 Summer Olympics in Moscow, Krause won gold medals in the 100 m and 200 m freestyle and in the 4×100 m freestyle relay.  Her husband, Lutz Wanja, is also a retired German Olympic swimmer.\n\n(Libby Trickett > 2005 World Aquatics Championships) In July 2005, at the 2005 World Aquatics Championships in Montreal, Canada, Trickett was one of the form swimmers of the meet. She won the 50-metre freestyle in a time of 24.59 to record her maiden championship at international level. She also achieved a silver medal in the 100-metre butterfly (57.37). She was a member of three relay teams, the 4×100-metre freestyle relay, 4×100-metre medley relay, and the 4×200-metre freestyle relay teams, winning gold (3:37.22), gold (3:57.47) and silver (7:54.00) in the respective events. Fairly new to the 200-metre freestyle event, Trickett got recorded the then fourth fastest time in history clocking 1:57.06 as lead-off swimmer in the final of the 4×200-metre freestyle relay. The time being more than 1.5 seconds faster than the individual gold medallist Solenne Figuès of France (1.58.60). Trickett did not compete in the individual 100-metre freestyle because she placed third in the event at the Australian championship, but her 100-metre freestyle split times were faster than the individual 100-metre freestyle gold medalist and world record holder Jodie Henry, which earned her the honour of swimming in the final of the medley relay. Despite not competing in the individual 100- and 200-metre freestyle, she did finish 2005 ranked number one in the world in both events.  On returning to Australia, Trickett continued her rich vein of form, lowering the 100-metre short course freestyle world record on consecutive nights at the Australian Short Course Championships to 51.70 seconds.  2005 brought a further world record in the short-course 200-metre freestyle at the Sydney, Australia stop of the 2005 FINA World Cup series on 19 November with Trickett recording a time of 1:53.29 to beat the previous record by 0.75 seconds.  However, Trickett regained her 100-metre freestyle world record on 31 January 2006 at the Australian Championships in Melbourne. Her time of 53.42 was 0.1 of a second faster than the previous record held by Henry. On 2 August 2006, German swimmer Britta Steffen broke Trickett's 100-metre freestyle world record at the 2006 European Championships in Budapest, Hungary, with a time of 53.30. Trickett again regained the world record with a time of 52.88 on 27 March 2008 at the 100-metre finals of the Australian Olympic Trials.\n\n(Natalie Coughlin > International career > 2001–2003) At the ninth World Aquatics Championships in Fukuoka, Japan, Coughlin won three medals—one gold, one silver, and one bronze. She won her gold medal in the 100-meter backstroke
