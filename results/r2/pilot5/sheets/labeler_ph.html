e North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing."}, {"id": "pb010", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the documented talent contract types and employment arrangements used by the promotion (e.g., freelancer, exclusive, developmental)?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Kaz Hayashi > Professional wrestling career > World Wrestling Federation (2001–2002)) Hayashi's contract was bought by the World Wrestling Federation (WWF) following their purchase of WCW in early 2001. He was first sent to WWF's developmental territory the Heartland Wrestling Association (HWA) before being moved to the main roster. Hayashi made his WWF main roster debut during the Invasion storyline as a member of The Alliance faction but only made one appearance before returning to HWA and ultimately heading back to Japan.\n\n(WWE LFG > Abstract) WWE LFG (\"Legends & Future Greats\") is an American professional wrestling reality competition series produced by WWE Studios and broadcast by A&E. The series follows up-and-coming wrestlers from WWE 's developmental system, competing for a contract in WWE's NXT division while being mentored by current, veteran, and Hall of Fame talent.\n\n(Total Nonstop Action Wrestling > Abstract) Total Nonstop Action Wrestling (abbreviated as TNA Wrestling or TNA) is an American professional wrestling promotion based in Nashville, Tennessee. It is a subsidiary of Anthem Sports & Entertainment, a Canadian media company owned by businessman Leonard Asper.  Founded by Jeff Jarrett and Jerry Jarrett in 2002, following the end of World Championship Wrestling (WCW) in 2001, the promotion was initially known as NWA: Total Nonstop Action (NWA-TNA) and was affiliated with the National Wrestling Alliance (NWA) governing body. The promotion dropped the \"NWA\" brand from its name in 2004, becoming Total Nonstop Action Wrestling. TNA continued to use the NWA World Heavyweight and World Tag Team championships until this agreement ended in 2007; after which, the company would create its own World Heavyweight and World Tag Team championships. The promotion was purchased by Anthem at the beginning of 2017. In March of that year, it was rebranded to Impact Wrestling after its weekly flagship television show, but returned to the TNA branding in January 2024.  From its inception, TNA had been considered the second-largest promotion in the United States behind WWE, a position it would hold for most of the 2000s and early 2010s. During this time period the promotion was known for featuring former top talent from WCW, WWE, and ECW, such as Raven, Jeff Jarrett, and Sting, free agents that were released from the WWE during the time period such as Kurt Angle, Jeff Hardy, and Mr. Kennedy (who wrestled as Mr. Anderson in TNA), as well as more homegrown wrestlers who had not appeared in WWE yet and mainly performed for the promotion, such as AJ Styles and Samoa Joe, some of whom would later be signed by WWE during the mid to late 2010s, as TNA suffered financial issues. From 2015 to 2017, the promotion was viewed by some to have fallen behind longtime rival Ring of Honor; with the loss of their American television contract with Spike in 2014, as well as monetary and personnel issues, being noted as factors to their decline.  By 2019, the promotion was viewed to have recovered through its sustained international distribution, and the purchase by its parent company of AXS TV; which subsequently began carrying the promotion's programming. TNA is viewed as being the third-largest wrestling promotion in the United States following the establishment of All Elite Wrestling (AEW) in 2019 and its television deals with Warner Bros. Discovery 's TNT and TBS (both of which are seen in more households than AXS). In late 2025, TNA signed a deal with AMC, which is seen in households more similar in numbers to networks such USA, TBS, and TNT, thus giving them more reach and exposure.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance."}, {"id": "pb011", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which colonial-era representative matches or tours involved teams from the Gold Coast, and what were their outcomes?", "ev": "(Yoruba people > Demographics > Ghana) There exists an old and thriving Yoruba community in Ghana tracing back to more than three centuries of establishment. The presence of Yoruba people in Ghana traces back to before the concept of the modern Ghanaian nation and are therefore Ghanaian citizens by law. The Yoruba communities became established through various waves and layers for centuries before the colonial era. The earliest wave were long distance merchants, artisans, labourers and explorers who settled in both southern and northern Ghanaian locales such as Salaga, Sekondi-Takoradi, Kumasi, Accra (Jamestown, Ngleshie Alata, Tudu), Yendi, Tamale, Kintampo, Nandom. In Ngleshie Alata (A corruption of English ' Alata ', the Fante and Ga word for Yoruba people based on the region where the majority came from) and the area around the James Fort, the Yoruba presence dates back to 1673 when they were employed to build the fort and settled in large numbers on the eastern coastal region. It is on record that the first ' Alata Akutso Mantse ' or Alata division head, a Yoruba speaker named Ojo employed by the Royal African Company ascended an Accra royal stool becoming head of the Alata quarter of James Town in 1748, a position his descendants continue to hold to this very day.  In the popular 18th century Gonja Salaga Slave Market, the Yoruba residents of the town would not allow their fellow countrymen captured and brought to the markets to be sold to the Ashantis who would march them to the coast. Rather, they would barter for the release of the Yoruba captives who would in turn work for their benefactors as tradesmen until they earned their release. This earliest wave was followed by an intermediate wave of slave returnees who were predominantly of Yoruba descent like the Taboms/Agudas who settled along the Ghanaian coast. Then came the third wave who came during the Gold Coast colonial period. By this period, they had firmly entrenched themselves in the country's commerce and distribution systems and constituted a substantial percentage of merchants and traders in the country's large markets as proprietors of wholesale enterprises. They were the largest group of immigrants established in the pre-independence Gold Coast. In 1950 they constituted 15% of traders in Accra, 23% in Kumasi, and over a third in Tamale. They were usually referred to in southern Ghana as Yoruba, Lagosian, Alata, or Anago. It was the early stream of this wave in the 1830s that established places like Accra New Town which was previously known as Lagos town and before then as Araromi.  There is no codification for the Yoruba ethnicity in the most recent Ghanaian censuses but in previous ones, they were considered an indigenous Ghanaian group with origins outside modern Ghana. In the 1960 Ghanaian population census, there were 109,090 Yorubas. Of this figure; 100,560 were Yoruba ' proper ' while 8,530 were Atakpame (Ana). This represented 1.6% of the Ghanaian population.\n\n(History of Ghana > British Gold Coast > British rule of the Gold Coast: the colonial era > Economic and social development) The years of British administration of the Gold Coast during the 20th century were an era of significant progress in social, economic, and educational development. Communications and railroads were greatly improved. Poverty fell significantly and Ghanaian peasantry flourished. New crops were introduced. A leading crop that was the result of an introduced crop was coffee. However, most spectacular among these introduced crops was the cocoa tree which had been indigenous to the New World and had been introduced in Africa by the Spanish and Portuguese. Cocoa had been introduced to the Gold Coast in 1879 by Tetteh Quashie. Cocoa tree raising and farming became widely accepted in the eastern part of the Gold Coast. In 1891, the Gold Coast exported 80 lbs of cocoa worth no more than 4 pounds sterling. By the 1920s cocoa exports had passed 200,000 tons and had reached a value of 4.7 million pounds sterling. Cocoa production became a major part of the economy of the Gold coast and later a major part of Ghana's economy.  The colony's earnings increased further from the export of timber and gold. Revenue from export of the colony's natural resources financed internal improvements in infrastructure and social services. The foundation of an educational system more advanced than any other else in West Africa also resulted from mineral export revenue. It was through British-style education that a new Ghanaian elite was created. From beginnings in missionary schools, the early part of the 20th century saw the opening of secondary schools and the country's first institute of higher learning.  Many of the economic and social improvements in the Gold Coast in the early part of the 20th century have been attributed to the Canadian-born Gordon Guggisberg, governor from 1919 to 1927. Within the first six weeks of his governorship, he presented a ten-year development programme to the Legislative Council. He suggested first the improvement of transportation. Then, in order of priority, his prescribed improvements included water supply, drainage, hydroelectric projects, public buildings, town improvements, schools, hospitals, prisons, communication lines, and other services. Guggisberg also set a goal of filling half of the colony's technical positions with Africans as soon as they could be trained. His programme has been described as the most ambitious ever proposed in West Africa up to that time.  The colony assisted Britain in both World War I and World War II. In the ensuing years, however, postwar inflation and instability severely hampered readjustment for returning veterans, who were in the forefront of growing discontent and unrest. Their war service and veterans' associations had broadened their horizons, making it difficult for them to return to the humble and circumscribed positions set aside for Africans by the colonial authorities.\n\n(Ghana Medical Association > History) The earliest medical organisation of medical staff was during the Gold Coast era when the Gold Coast Medical Practitioners Union was formed in 1933. This was founded by three doctors, Frederick Victor Nanka-Bruce who was the president and spokesman, C.E. Reindorf and W.A.C. Nanka-Bruce. J.E. Hutton Mills was the secretary. Following the establishment of an African government under colonial rule in 1951, a Ghana branch of the British Medical Association was formed in January 1953. This also had Nanka-Bruce as its first president. Both associations were merged to form the Ghana Medical Association on 4 January 1958. It was inaugurated by Kwame Nkrumah at the Arden Hall of the Ambassador Hotel in Accra. Charles Easmon was elected as the first president of the GMA.\n\n(History of Ghana > British Gold Coast > Growth of nationalism and the end of colonial rule) As Ghana developed economically, education of the citizenry progressed apace. In 1890 there were only 5 government and 49 \"assisted\" mission schools in the whole of the Gold Coast with a total enrollment of only 5,000. By 1920 there were 20 governmental schools, 188 \"assisted\" mission and 309 \"unassisted\" mission schools with a total enrollment of 43,000 pupils. By 1940, there were 91,000 children attending Gold Coast schools. By 1950, the 279,000 children attending some 3,000 schools in the Gold Coast. This meant that, in 1950, 43.6% of the school-age children in the Gold Coast colony were attending school.  Thus by the end of the Second World War, the Gold Coast colony was the richest and most educated territories in West Africa. Within this educated environment, the focus of government power gradually shifted from the hands of the governor and his officials into those of Ghanaians, themselves. The changes resulted from the gradual development of a strong spirit of nationalism and were to result eventually in independ"}, {"id": "pb012", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What changes in attendance figures, TV/streaming distribution, or merchandise sales correlate with major partnership announcements?", "ev": "(컨텍스트 없음)"}, {"id": "pb013", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the formal corporate or organizational structure of the promotion (parent company, management, and ownership history)?", "ev": "(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance.\n\n(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Hotel manager > Hotel management structure > Example for small/limited service hotel) A typical organizational chart for a small low-rise hotel operation may resemble the following:  Hotel manager reports to regional director and/or ownership/investors  Administrative functions for a small-scale hotel such as accounting, payroll, and human resources may normally be handled by a centralized corporate office or solely by the hotel manager. Additional auxiliary functions such as security may be handled by third-party vendor services contracted by the hotel on an as-needed basis. Hotel management is necessary to implement standard operating procedures and actions as well as handling day-to-day operations.\n\n(Total Nonstop Action Wrestling > Abstract) Total Nonstop Action Wrestling (abbreviated as TNA Wrestling or TNA) is an American professional wrestling promotion based in Nashville, Tennessee. It is a subsidiary of Anthem Sports & Entertainment, a Canadian media company owned by businessman Leonard Asper.  Founded by Jeff Jarrett and Jerry Jarrett in 2002, following the end of World Championship Wrestling (WCW) in 2001, the promotion was initially known as NWA: Total Nonstop Action (NWA-TNA) and was affiliated with the National Wrestling Alliance (NWA) governing body. The promotion dropped the \"NWA\" brand from its name in 2004, becoming Total Nonstop Action Wrestling. TNA continued to use the NWA World Heavyweight and World Tag Team championships until this agreement ended in 2007; after which, the company would create its own World Heavyweight and World Tag Team championships. The promotion was purchased by Anthem at the beginning of 2017. In March of that year, it was rebranded to Impact Wrestling after its weekly flagship television show, but returned to the TNA branding in January 2024.  From its inception, TNA had been considered the second-largest promotion in the United States behind WWE, a position it would hold for most of the 2000s and early 2010s. During this time period the promotion was known for featuring former top talent from WCW, WWE, and ECW, such as Raven, Jeff Jarrett, and Sting, free agents that were released from the WWE during the time period such as Kurt Angle, Jeff Hardy, and Mr. Kennedy (who wrestled as Mr. Anderson in TNA), as well as more homegrown wrestlers who had not appeared in WWE yet and mainly performed for the promotion, such as AJ Styles and Samoa Joe, some of whom would later be signed by WWE during the mid to late 2010s, as TNA suffered financial issues. From 2015 to 2017, the promotion was viewed by some to have fallen behind longtime rival Ring of Honor; with the loss of their American television contract with Spike in 2014, as well as monetary and personnel issues, being noted as factors to their decline.  By 2019, the promotion was viewed to have recovered through its sustained international distribution, and the purchase by its parent company of AXS TV; which subsequently began carrying the promotion's programming. TNA is viewed as being the third-largest wrestling promotion in the United States following the establishment of All Elite Wrestling (AEW) in 2019 and its television deals with Warner Bros. Discovery 's TNT and TBS (both of which are seen in more households than AXS). In late 2025, TNA signed a deal with AMC, which is seen in households more similar in numbers to networks such USA, TBS, and TNT, thus giving them more reach and exposure.\n\n(Intelligence operations using Crypto AG compromised devices > The CIA-BND acquisition (1967-1970) > Ownership structure and management) The ownership of Crypto AG was deliberately concealed behind layers of corporate secrecy. A Liechtenstein-based trust structure held the company's bearer shares, making the true owners untraceable even to most of the firm's own managers. Only a select handful of executives were aware of the intelligence agencies' involvement. Sture Nyberg, to whom Hagelin had entrusted day-to-day management, was the sole board member who knew the truth; he departed in 1976.  A new board of directors, secretly controlled by the CIA and BND, oversaw the company's strategy. Each year, the two agencies split Crypto AG's profits, with the BND handling the accounting and physically delivering the CIA's share in cash in an underground parking garage, according to the German history.  The company projected an image of Swiss neutrality and precision engineering, which became one of its most powerful selling points. As the leaked CIA history noted, Crypto AG's Swiss domicile gave it a cachet of trustworthiness that no American or German firm could have replicated."}, {"id": "pb014", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What is the governance and organizational structure of Ghana's national cricket association and its official roles?", "ev": "(Kweku Baako Jnr > Abstract) Kweku Baako Jnr is a Ghanaian journalist and the editor-in-chief of the New Crusading Guide newspaper he was also the son of Kofi Baako. He is a frequent panelist on radio shows in Ghana, including Peace FM's weekday morning show and Newsfile, a current affairs programme on Joy FM (Ghana). In 1999 he was awarded the Journalist of the Year by the Ghana Journalists Association. He was polled as the 39th most influential Ghanaian in 2014 by ETV.\n\n(David Apasara > Abstract) David Apasera is a Ghanaian politician of the Republic of Ghana. He was the Member of Parliament representing Bolgatanga constituency of the Upper East Region of Ghana in the 4th Parliament of the 4th Republic of Ghana. He is a member of the People's National Convention.\n\n(Otto Addo > Coaching career > Ghana) On 25 September 2021, the Ghana Football Association announced that they had appointed Addo as one of two deputies for the new Ghana coach, Milovan Rajevac. On 9 February 2022, the Ghana Football Association announced that they had appointed Addo as the interim coach for the Ghana national football team ahead of the team's 2022 FIFA World Cup final play-off matches against Nigeria. On 29 March 2022, he qualified Ghana (on away goals) to the 2022 World Cup in Qatar, after drawing 1–1 against the Super Eagles of Nigeria. The Black Stars of Ghana had earlier drawn 0–0 against the Super Eagles on 25 March.  In May 2022, Addo was appointed as the head coach until the end of December 2022 alongside maintaining Chris Hughton as technical advisor and George Boateng and Mas-Ud Didi Dramani as assistant coaches, the same set-up for the 2022 FIFA World Cup final play-off matches against Nigeria. Addo won his first match as manager on 1 June after leading Ghana to a 3–0 victory over Madagascar in a 2023 AFCON qualifiers.  At the 2022 FIFA World Cup tournament, Ghana went on to lose their first match against Portugal by 3–2, however they won their second group game against South Korea by 3–2. Addo became the first Ghanaian to play for and coach the Ghana national team at the FIFA World Cup. That victory also made Addo the first Ghanaian coach to win a match at the FIFA World Cup. Five days later, Ghana lost to Uruguay and were eliminated from the tournament at the group stages. Prior to the start of the World Cup, Addo had hinted that he would be leaving after the world cup regardless of the outcome. Following their last group match, Addo resigned as the head coach of Ghana and would focus on his other role as a talent coach at Borussia Dortmund. Addo revealed the decision to leave the post as the head coach of Ghana Black star indicating the decision was not only in his hand.\n\n(Joseph Odei > Abstract) Brigadier General (rtd) Joseph Odei is a Ghanaian military officer who served in the Ghana Army. He later became a public servant and was the 2nd national coordinator of the National Disaster Management Organization in Ghana."}, {"id": "pb015", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What changes occurred in employment rates and main economic activities in the Northern Province after reconstruction efforts?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors.\n\n(Sri Lankan civil war > End of the war > Protests) Tamil diaspora communities around the world protested the civilian casualties in Northern Province, Sri Lanka and the war in general. Active protests occurred in the major and/or capital cities of India, the United Kingdom, Canada, Australia, Norway, Switzerland, Denmark, Germany and the United States.\n\n(Sri Lankan civil war > Impact > Economic cost) The total economic cost of the 25-year war is estimated at US$200 billion. This is approximately 5 times the GDP of Sri Lanka in 2009. Sri Lanka had spent US$5.5 billion only on Eelam War IV, which saw the end of LTTE. The government had spent US$2.25 billion to develop the Northern Province under the \"Uthuru Wasanthaya\" program after the end of the war. Measuring the opportunity cost of war, a report by Strategic Foresight Group states that Foreign Direct Investment (FDI) remained stagnant during periods of civil war and that net FDI increased during periods of ceasefire.\n\n(Bandaranaike Airport attack > Background) At the time in 2001, Bandaranaike International Airport (BIA) was the sole airport in the island that operated international flights and served as the home port of the national carrier SriLankan Airlines with its fleet of aircraft being serviced and operated from its facilities. It served as the primary airport for commercial air cargo flights to the island. SLAF Katunayake is the largest air base of the Sri Lanka Air Force with two lodger flying squadrons, the No. 10 \"Fighter\" Squadron and the No. 4 Helicopter Squadron were based at the time consisting of fighter, ground attack, trainer jet aircraft and helicopters.  In 1986, a bomb planted in Air Lanka Flight 512 blew up while the flight was on the tarmac killing 21 civilians at BIA, resulting in increased security and classification as a high security zone, while SLAF Katunayake was targeted by the JVP in an attack on 7 June 1987. With key air assets, the two hangars housing the squadrons were classes as V zones within the air base. With the escalation of the Sri Lankan Civil War, the LTTE began planning and executing suicide attacks on key economic targets aimed at destabilizing the economy of Sri Lanka, these include the 1996 Attack on Colombo Harbour and Colombo Central Bank bombing. The SLAF was tasked with providing security for BIA.  In 1999, the LTTE launched a ca"}, {"id": "pb016", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did Randy Johnson's height, arm angle, and delivery mechanics contribute to pitch velocity and movement?", "ev": "(Randy Johnson > Pitching style) In the prime of his career, Johnson's fastball was clocked as high as 102 mph (164 km/h), with a low three-quarters delivery (nearly sidearm). His signature pitch was a slider that broke down and away from left-handed hitters and down and in to right-handed hitters. The effectiveness of the pitch is marked by its velocity being in the low 90s along with tight late break; hitters often believed they were thrown a fastball until the ball broke just before it crossed home plate. Right-handed hitters have swung through and missed sliders that nearly hit their back foot. Johnson dubbed his slider \"Mr. Snappy\". In later years, his fastball declined to the 96 mph (154 km/h) range and his slider clocked at around 87 mph (140 km/h). Johnson also threw a split-finger fastball that behaved like a change-up and a sinker to induce ground balls.  In a 2012 appearance on The Dan Patrick Show, Adam Dunn, a left-handed batter, was asked who the best pitcher he faced was. \"Honestly, Randy Johnson when he was good. It's hopeless. It's like a hopeless feeling. The first time you face him you feel like he's going to hit you right in the back of the neck when he throws it, like every pitch is going to hit you in the back of the neck. And it ends up down and away for a strike and you just have to trust it's going to be a strike, and heaven forbid he doesn't lose one out there and heaven forbid, there goes your cheek,\" Dunn said.\n\n(Randy Johnson > Professional career > Seattle Mariners (1989–1998) > 1996−1998) Johnson was sidelined throughout much of the 1996 season with a back injury but rebounded in 1997 with a 20–4 record, 291 strikeouts, and a 2.28 ERA (his personal best). Between May 1994 and October 1997, Johnson went 53–9, including a 16–0 streak that fell one short of the AL record. Johnson had two 19-strikeout starts in 1997, on June 24 and August 8.  Another colorful All-Star Game moment proceeded in 1997 involving former Expos teammate Larry Walker, then with the Colorado Rockies. When Johnson started a game against the Rockies on June 12, Walker chose not to play, explaining that \"I faced Randy one time in spring training and he almost killed me.\" In the All-Star Game, Walker batted against Johnson, who theatrically threw over his head. Ever adaptable, Walker placed his batting helmet backwards and switched sides in the batters' box to stand right-handed for one pitch. He ended the plate appearance by drawing a walk. The incident momentarily drew mirth and laughter from players in both dugouts, fans, and announcers as well as comparisons to the at bat with Kruk in the 1993 All-Star Game. In spite of garnering a reputation of avoiding Johnson, Walker batted.393 in 28 at bats against him in his career, nearly double the rate of all left-handed batters at.199. When the 1998 season began, Johnson was upset the Mariners would not offer him a contract extension, given his contract was expiring after the season. Though the Mariners initially wanted to keep Johnson, turning down a trade offer from the Los Angeles Dodgers, they fell out of contention, going 8–20 in June. Minutes before the non-waiver trade deadline, on July 31, the Mariners traded Johnson to the Houston Astros for minor leaguers Freddy García, Carlos Guillén, and John Halama. Johnson was a Mariner for nearly nine years, his longest tenure with one team.\n\n(Randy Johnson > Professional career > Arizona Diamondbacks (1999–2004)) Johnson agreed to a four-year contract, with an option for a fifth year, for $52.4 million, with the Arizona Diamondbacks, a second-year franchise, in late 1998. Johnson led the team to the playoffs in 1999 on the strength of a 17–9 record and 2.48 ERA with 364 strikeouts, leading the majors in innings, complete games, and strikeouts. Johnson won the NL Cy Young Award and Warren Spahn Award as the best left-handed pitcher in MLB. Johnson became the third MLB pitcher, after Gaylord Perry and Pedro Martínez, to win the Cy Young Award in both the AL and NL; Martínez won the AL Cy Young in 1999. Johnson finished 2000 with 19 wins, 347 strikeouts and a 2.64 ERA, and won his second consecutive NL Cy Young Award and Warren Spahn Award. The Diamondbacks acquired Curt Schilling from the Phillies in July 2000, and the two aces anchored the Diamondbacks rotation.\n\n(Softball > Pitch) In softball, a pitch is the act of throwing a softball toward home plate to start a play. All pitches are thrown from below the waist in an underhand motion. The phases of throwing include the grip, stance, windup, stride, release and follow through.  Pitchers throw a variety of pitches, each of which has a slightly different velocity, trajectory, movement, hand position, wrist position and/or arm angle. These variations are introduced to confuse the batter in various ways, and ultimately aid the defensive team in getting the batter or baserunners out. To obtain variety, and therefore enhance defensive baseball strategy, the pitcher manipulates the grip on the ball at the point of release. Variations in the grip cause the seams to \"catch\" the air differently, thereby changing the trajectory of the ball, making it harder for the batter to hit.  The selection of which pitch to use can depend on a wide variety of factors including the type of hitter who is being faced; whether there are any base runners; how many outs have been made in the inning; and the current score.\n\n(Bowling form > Other bowling forms > No-thumb delivery) A no-thumb delivery involves inserting only two fingers into the bowling ball, leaving the thumb on the outside of the ball, in an effort to create more revolutions and greater hook. Due to similar ball roll and revolutions to the cranker style, it is sometimes considered a variation of cranking. As the bowler does not use the opposite hand to support the ball (as in the two-handed approach), the wrist is often severely cupped and/or the ball is balanced on the forearm and delivered using a bent elbow throughout the shot. Another variation of this delivery is to palm the ball forcing the thumb to the side of the ball while forcing the elbow to lock so as to keep the arm straight and generate a back-swing. This variation leads to far greater consistency and straightens the ball out when needed. All styles of no-thumbing usually require bowlers to use bowling balls that are generally one to three pounds lighter than their thumb-in counterparts.  This technique is often used by casual or league-level bowlers who have not learned how to hook the ball using one of the more standard, thumb-in grips. It is also prevalent among left-handed bowlers using house balls. A left-handed bowler would have to reverse the ball in order to properly use the holes typically drilled for right-handed bowlers. Notable bowlers to use this technique at the professional level include Mike Miller and Tom Daugherty."}, {"id": "pb017", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How did access to public services such as education and healthcare change in the Northern Province following reconstruction?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors."}, {"id": "pb018", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What controversies or disputes over national team selection, player eligibility, or diaspora player policies have been recorded?", "ev": "(Abdul-Karim Zito > Abstract) Abdul-Karim Zito is a Ghanaian professional football manager and former player who is the technical director of Ghana Premier League club Ashanti Gold. He was previously manager of fellow league clubs Asante Kotoko, Medeama S.C. and Dreams F.C. and also coached the Ghana national under-20 football team.\n\n(Ibrahim Sunday > Abstract) Ibrahim Sunday (born 22 July 1944) is a Ghanaian former professional football player and coach. A midfielder, he played the majority of his career for Ghanaian club Asante Kotoko, and was also a member of the Ghana national team, participating in two Africa Nations Cup tournaments. In 1971, he won the African Footballer of the Year award. He is the first ever African footballer to appear in the Bundesliga.\n\n(NBA G League > Player allocations > Draft) The NBA G League draft occurs each season and is the major source from which teams build their rosters. Team rosters are made up of returning players (players who were on the team during the previous season), players waived by an NBA team who are designated as an ' affiliate player ' to their respective G League affiliate, allocated players (players who have local significance), and drafted players. The eight round draft utilizes a serpentine format, meaning the order alternates in each round; Team A who selected first in Round 1 will select last in Round 2, while Team B who selected last in Round 1 will get the first pick in Round 2. Round 3 was added in 2014.  The league holds an annual Player Invitational, where prospects hope to earn eligibility for the upcoming draft.\n\n(FIBA eligibility rules > Eligibility) Eligibility rules imposed by FIBA on national team players applies to both men and women. A player who seeks to represent a country must hold legal nationality of that country.  In 3x3 basketball, a player is eligible to represent their country if they have the appropriate legal nationality. The eligibility could be proven through a passport obtained at any age.  The method by which a player obtains nationality is generally irrelevant to national team eligibility. The so-called grandparent rule is only used to determine a player's eligibility for a team representing a dependent territory of a sovereign nation, such as Puerto Rico or the US Virgin Islands. In those cases, the player must hold nationality of the applicable sovereign nation, called the \"main territory\" in FIBA regulations (the United States in both named cases), and must have been either:  Addi"}, {"id": "pb019", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have organizers managed low participant numbers, such as combining categories or inviting guest skaters?", "ev": "(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Andris Teikmanis > Abstract) Andris Teikmanis (29 November 1959; Riga, Latvia) is a Latvian lawyer, politician, and diplomat. He served as first post-soviet Mayor of Riga from 1990 to 1994. In September 2016 he was accredited as the Latvian ambassador to the United States. He previously served as Under Secretary in the Ministry of Foreign Affairs in Riga, and as Latvian ambassador to the Council of Europe, to the Russian Federation, to Germany, and to the United Kingdom, and as non-resident ambassador to Australia and New Zealand.Since August 2019 A. Teikmanis is head of the Chancellery of the President of Latvia Egils Levits.\n\n(A9 road (Latvia) > Abstract) The A9 is a national road in Latvia connecting Riga to third largest city of Latvia, Liepāja through Skulte, also known as Liepāja highway in Latvia. The road is part of Latvian TEN-T road network. After Liepāja, the road turns in to Latvian A11. The length of A9 in Latvian territory is 200 kilometers. Currently A9 has 1x1 lanes in all its length. The current speed limit is 90 km/h. It is planned that around year 2020 all at-grade intersections with A9, in the segment from Riga to Jaunbērze, would be removed, and two-level ones would be built instead, with an option to widen the A9 to 2x2 lanes in further future. from Riga until Jaunbērze, The average AADT of A9 in 2025 was 7,310 cars per day.\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved.\n\n(Taipei Mission, Riga > Abstract) The Taipei Mission in the Republic of Latvia (Chinese: 駐拉脫維亞臺北代表團, Latvian: Taipejas Misija Latvijas Republikā) represents the interests of Taiwan in the Republic of Latvia in the absence of formal diplomatic relations, functioning as a de facto embassy. The Mission is located at Ausekļa iela 14 (14 Auseklis Street) in Riga. It promotes Latvia-Taiwan relations as well as Estonia-Taiwan relations."}, {"id": "pb020", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What have been the major venue and touring patterns for the promotion within Japan since 2001?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance."}, {"id": "pb021", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What coaching, umpire development, and youth talent pathways have been established to technicalize cricket development in Ghana?", "ev": "(Agricultural Development Bank of Ghana > Abstract) Agricultural Development Bank of Ghana, commonly known as Agricultural Development Bank or ADB, is a government-owned development and commercial bank in Ghana. The bank is the first development finance institution established by the Government of Ghana. It is the developmental finance institution that provides technical and financial services to agribusiness, farmers, and other enterprises at the rural communities. It is one of the commercial banks licensed by the Bank of Ghana, the national banking regulator.  The main objective of the bank is promoting and financing of agribusiness in the country.\n\n(Otto Pfister > Coaching career > Ghana) Pfister led Ghana to a famous win in the 1991 FIFA U-17 World Championship. The Championship was held in the cities of Florence, Montecatini Terme, Viareggio, Massa, Carrara, and Livorno in Italy between 16 and 31 August 1991. Ghana finished second to Spain in their group and progressed to the Quarter-finals where they beat Brazil 2–1 with goals from Mohammed Gargo and Nii Lamptey. After a 0–0 draw with Qatar in the Semi-finals, Ghana won 4–2 in a penalty shoot-out, lining up a final against Spain. On 31 August 1991, Ghana beat Spain 1–0 in the World Cup final in Florence, Ghana's first title.  The Ghana national team qualified for the 1992 African Cup of Nations after finishing top of their qualifying group. Ghana qualified to the Quarter-finals after two 1–0 victories over Egypt and Zambia in the first round of the final tournament. Ghana beat Congo to take them through to the Semi-finals where they beat Nigeria, 2–1. On 26 January 1992 in Senegal, Ghana played Ivory Coast in the final of the African Cup of Nations. After extra time the final score was 0–0 and the game entered penalties. After a marathon penalty shootout, Ivory Coast finally won 11–10 on penalties. The penalty shootout was significant in that it was the first in the final of a major international tournament that every player on the pitch took a penalty.  During Pfister's time with Ghana, he was observed numerous times not wearing a belt, and thus consequently, he wore his trousers very low. This gave rise to the term \"Otto Pfister\" within Ghanaian popular slang culture. \"Otto Pfister\" in this regard has come to mean someone sagging their trousers in Ghanaian youth fashion.\n\n(Alhassan Suhuyini > Abstract) Alhassan Sayibu Suhuyini (born 12 September 1979) is a Ghanaian broadcast journalist and politician. He belongs to the National Democratic Congress. He is currently a member of the eighth Parliament of the Fourth Republic of Ghana representing Tamale North.  He is a host of two of the station's flagship programs as Ghanaian broadcast journalist who works at Radio Gold in Accra.  He holds a teaching qualification. From Ghana Institute of Management and public Administration He pursued his B.sc. public administration and M.sc. Development Management. He's a Muslim by religion. He also a committee member of land and natural resources. He was member of parliament of the 7th and 8th Republic of Ghana.\n\n(Otto Addo > Coaching career > Ghana) On 25 September 2021, the Ghana Football Association announced that they had appointed Addo as one of two deputies for the new Ghana coach, Milovan Rajevac. On 9 February 2022, the Ghana Football Association announced that they had appointed Addo as the interim coach for the Ghana national football team ahead of the team's 2022 FIFA World Cup final play-off matches against Nigeria. On 29 March 2022, he qualified Ghana (on away goals) to the 2022 World Cup in Qatar, after drawing 1–1 against the Super Eagles of Nigeria. The Black Stars of Ghana had earlier drawn 0–0 against the Super Eagles on 25 March.  In May 2022, Addo was appointed as the head coach until the end of December 2022 alongside maintaining Chris Hughton as technical advisor and George Boateng and Mas-Ud Didi Dramani as assistant coaches, the same set-up for the 2022 FIFA World Cup final play-off matches against Nigeria. Addo won his first match as manager on 1 June after leading Ghana to a 3–0 victory over Madagascar in a 2023 AFCON qualifiers.  At the 2022 FIFA World Cup tournament, Ghana went on to lose their first match against Portugal by 3–2, however they won their second group game against South Korea by 3–2. Addo became the first Ghanaian to play for and coach the Ghana national team at the FIFA World Cup. That victory also made Addo the first Ghanaian coach to win a match at the FIFA World Cup. Five days later, Ghana lost to Uruguay and were eliminated from the tournament at the group stages. Prior to the start of the World Cup, Addo had hinted that he would be leaving after the world cup regardless of the outcome. Following their last group match, Addo resigned as the head coach of Ghana and would focus on his other role as a talent coach at Borussia Dortmund. Addo revealed the decision to leave the post as the head coach of Ghana Black star indicating the decision was not only in his hand."}, {"id": "pb022", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How frequently have the Latvian national figure skating championships been held and have there been any interruptions?", "ev": "(Latvian Museum of National History > Abstract) The Latvian National Museum of History (Latvian: Latvijas Nacionālais vēstures muzejs), is a national history museum in Riga, Latvia.  It was founded in 1869 by the Riga Latvian Society.  Since 1920 it has been located in Riga Castle and in 1924 it attained state museum status. Its mission is \"to collect, preserve, research and popularise spiritual and material culture from Latvia and the world from ancient times until today, which has archaeological, ethnographic, numismatic, historical or artistic significance, in the interests of the Latvian nation and its people\".  After reconstruction and restoration works are finalized at Riga Castle, the museum is scheduled to open in spring of 2026.  The Āraiši Archaeological Park was a part of the LNMH from March 2008 until February 2017. In 2010, the Latvian Culture Museum “Dauderi”, located in a historical villa in Sarkandaugava, Riga, was added to the Museum. In January 2015, the Popular Front Museum with its collection of historical evidence of Latvia’s recent past was added to the LNMH.\n\n(Dutch Figure Skating Championships > Abstract) The Dutch Figure Skating Championships (Dutch: Nederlandse kampioenschappen kunstschaatsen) are an annual figure skating competition organized by the Royal Dutch Skating Federation (Dutch: Koninklijke Nederlandsche Schaatsenrijders Bond) to crown the national champions of the Netherlands. While skating competitions had been held in the Netherlands prior to 1950, official national championships were not held until 1950. Since 2017, the Dutch Championships have been contested as part of the International Challeng\n\n(Football in Latvia > History > Origins in Latvia) Football was first introduced to Latvia through the British, transferring the sport through sailors, civil servants, fairs, and businesses. In 1907, workers from the British metal-working factory Salamandra formed the first football club in Latvia, titled the British Football Club (BFC). The first Latvian football club, Amatieris, was founded in 1912. Between 1906 and 1921, Latvian football became organized by regional leagues, with the Riga Football Cup serving as largest organization nationally between 1910 and 1915. The Riga Football Cup continued to be held intermittently between 1910 and 1936 until it was replaced by the Latvian Football Cup in 1937.  The Latvian Football Union (LFS) was founded in 1921, the same year that Latvia gained independence from Russia following the First World War. Latvia joined FIFA through LFS in 1922. Between 1922 and 1927, LFS organized the Latvian Championship as a qualifier for FIFA, succeeding the Riga Football Cup as the highest championship. In 1927, Virsliga (Premier League) replaced the Latvian Championship.  Between 1922 and 1927, international football matches between Baltic teams led to the formation of the Baltic Cup in 1928. The cup was tri-lateral, held between Latvia, Lithuania, and Estonia, and was intended to improve the union between the Baltic countries. Both Finland and Poland were considered for inclusion, but it was decided to limit those countries to bi-lateral competitions. As part of the cup, a unified Baltic team was also proposed, but was not achieved.\n\n(Nikolaus Mollyn > Works) Only 179 works printed in the presses of Mollyn are known to have been preserved. Many were lost during World War I and particularly World War II, when the city library of Riga, the House of the Blackheads and the provincial museum in Jelgava, that held several works by Mollyn, were all bombed. Most of the preserved works printed by Mollyn are located in the National Library of Latvia and the Academic Library of the University of Latvia. Smaller amounts are also found in collections in Saint Petersburg, Tallinn, Tartu and Helsinki.  Of the 179 works printed by Mollyn, 126 were in Latin, 48 in German, three in Latvian and one each in Swedish and Finnish. In 1615 he was the first to print a Latvian-language book in the present-day territory of Latvia. (The first book in Latvian to be printed at all was printed by Georg Osterberger in Königsberg in 1553.) The range of topics was wide: theology and books for the church, textbooks for the city schools, publications from the city council, but also literary works such as Latin classics and humanistic literature, for example poems by Daniel Hermann. An amount of scientific books and history also left his presses, as well as a detailed copper engraving view of Riga dated 1612."}, {"id": "pb023", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "On what date did Ghana obtain ICC associate membership (or relevant ICC status changes) and what documentation records that?", "ev": "(컨텍스트 없음)"}, {"id": "pb024", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have any government, sporting bodies, or industry organizations issued guidelines or sanctions affecting the promotion's operations?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance."}, {"id": "pb025", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What are the current administrative districts and major urban centers within Sri Lanka's Northern Province?", "ev": "(Vanni Electoral District > Abstract) Vanni Electoral District (Tamil: வன்னி தேர்தல் மாவட்டம்) is one of the 22 multi-member electoral districts of Sri Lanka created by the 1978 Constitution of Sri Lanka. The district covers the administrative districts of Mannar, Mullaitivu and Vavuniya in the Northern province. The district currently elects 6 of the 225 members of the Sri Lankan Parliament and had 253,058 registered electors in 2014. The district is Sri Lanka's Electorate Number 11.\n\n(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors.\n\n(Fortification > History > Indian subcontinent > Sri Lanka) Forts in Sri Lanka date back thousands of years, with many being built by Sri Lankan kings. These include several walled cities. With the outset of colonial rule in the Indian Ocean, Sri Lanka was occupied by several major colonial empires that from time to time became the dominant power in the Indian Ocean. The colonists built several western-style forts, mostly in and around the coast of the island. The first to build colonial forts in Sri Lanka were the Portuguese; these forts were captured and later expanded by the Dutch. The British occupied these Dutch forts during the Napoleonic wars. Most of the colonial forts were garrisoned up until the early 20th century. The coastal forts had coastal artillery manned by the Ceylon Garrison Artillery during the two world wars.Most of these were abandoned by the military but retained civil administrative officers, while others retained military garrisons, which were more administrative than operational. Some were reoccupied by military units with the escalation of the Sri Lankan Civil War; Jaffna fort, for example, came under siege several times.\n\n(Islam in Sri Lanka > Sri Lankan Moors) The Sri Lankan Moors are mostly native speakers of the Tamil language while a few of them speak Sinhala as primary language, and follow Islam as their religion. Sri Lankan Moors comprise 9.30% (2012 Census) of Sri Lanka's population, and constitute the largest ethnic group within the Muslim community in the country.  Islam was spread to Sri Lanka by contacts with the merchant ships operated by the Moor traders between Serendib (Old Persian / Arabic name for Sri Lanka), and various ports in the Arabian Peninsula and North Africa. As per scholars, Sri Lankan Moors are descendant of the Marakkar, Mappilas, Memons and Pathans of South India."}, {"id": "pb026", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What booking philosophy or public statements about match outcomes and storytelling has the promotion used historically?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Junior dos Santos > Professional wrestling career > All Elite Wrestling (2021)) In the summer of 2021, dos Santos began making appearances for the professional wrestling promotion All Elite Wrestling, backing American Top Team head Dan Lambert along with ATT affiliated fighters Andrei Arlovski, Paige VanZant, Austin Vanderford, Dalton Rosta, and Jorge Masvidal. They formed an alliance with Ethan Page and Scorpio Sky, otherwise known as the Men of the Year (both of which have legitimate extensive martial arts backgrounds, with Scorpio Sky having fought in MMA competition). On the 6 October edition of AEW Dynamite, it was announced that Dos Santos would be making his professional wrestling debut on the 15 October edition of AEW Rampage, teaming with Sky and Page to take on Jake Hager, Chris Jericho and Sammy Guevara (The Inner Circle) in a trios match.\n\n(Professional wrestling match types > Weapon-based variations > Kendo Stick match) A kendo stick match (also known as a Singapore cane match or Dueling canes match) is a standard weapons match with a kendo stick being the only legal weapon. Often, the ring will be lined with many kendo sticks for the wrestlers to use. Hardcore wrestling promotion Combat Zone Wrestling has used this match with fluorescent light tubes instead of kendo sticks.\n\n(Professional wrestling match types > Hardcore-based variations > Hardcore match) A standard hardcore match, also known as a Devil's Playground match, a Belfast Brawl match or a Guerrilla Warfare match is a no-disqualification, no-countout, falls count anywhere, one-fall match where the only rule (unless specifically noted) is to achieve a fall by pinning the opponent for a 3-count or making them submit. Otherwise, anything goes: any weapon can be used, any amount of wrestlers who are not booked in the match can be involved, either wrestler booked in the match can be pinned anywhere and any move can be used (except moves banned by the promotion booking the match before-hand). Hardcore matches came to prominence in Japan in the 1970s, and then in the United States in the 1990s in promotions like ECW and later WWE. Blunt objects such as steel chairs, wooden event tables, ladders, wrestling ring stairs, kendo sticks, baseball bats, flour, metal cylindrical trashcans, trashcan lids and road signs are often featured in hardcore matches.  Other common euphemisms for hardcore matches are the No Holds Barred match (which suggests wrestlers are allowed to use any illegal moves), Street Fight (which suggests wrestlers are to dress in normal street clothes), and World Championship Wrestling used the term Raven's rules match for hardcore matches involving the wrestler Raven. They also created their own specific brand of hardcore match, for which bouts were to begin backstage rather than in the ring.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance."}, {"id": "pb027", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Which major infrastructure projects (roads, schools, hospitals) were completed in the Northern Province by 2018?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About
