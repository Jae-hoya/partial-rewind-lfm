<style>

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);

  .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}

  .wrap{max-width:860px;margin:0 auto;padding:0 16px 120px}

  .btns{max-width:860px;margin:0 auto;display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;padding:11px 16px;border-radius:9px;border:1.5px solid var(--line);

만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What injuries or durability concerns affected Randy Johnson and how did they limit his availability or effectiveness?", "ev": "Johnson was sidelined much of the 1996 season with a back injury that limited his availability that year."}, {"id": "pa003", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "For which MLB teams did Randy Johnson play and during which seasons with each team?", "ev": "Johnson played for the Seattle Mariners from 1989 through 1998. Johnson was traded to the Houston Astros on July 31, 1998, during the 1998 season. Johnson played for the Arizona Diamondbacks from 1999 through 2004."}, {"id": "pa004", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What observable effects did Johnson's strikeout ability have on opposing lineups and game strategies?", "ev": "Opposing players sometimes avoided facing Johnson altogether, as exemplified by Larry Walker choosing not to play when scheduled to face him and expressing real concern about facing Johnson’s velocity. Johnson’s exceptional strikeout totals (including seasons of 347, 364 and multiple 300-strikeout campaigns) produced outs via strikeouts at rates that removed balls in play and altered opposing lineup outcomes. Teammates and catchers credited Johnson’s intensity and ‘stuff’ with elevating catcher performance and game preparation, implying his strikeout ability changed in-game dynamics for both teams."}, {"id": "pa005", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What legal instruments, policy plans, or official reconstruction programs governed rebuilding efforts in the Northern Province?", "ev": "The Indo-Sri Lanka Accord of 29 July 1987 established mechanisms for devolution of power and was a formal political instrument affecting provincial governance. The Thirteenth Amendment to the Constitution of Sri Lanka and the Provincial Councils Act No 42 of 1987 were passed to establish a new system of provincial government for devolved authority. The \"Uthuru Wasanthaya\" program was an official government reconstruction and development program for the Northern Province after the war."}, {"id": "pa006", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How many career strikeouts, wins, and Cy Young Awards did Randy Johnson accumulate?", "ev": "Johnson recorded 4,875 career strikeouts. Johnson accumulated 303 career victories. Johnson won the Cy Young Award five times in his career."}, {"id": "pa007", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What role did velocity, release point, and command play in Randy Johnson's ability to generate swings and misses?", "ev": "High velocity on his fastball and mid-to-high velocity on his slider created a perception of a fastball before late breaking action, leading hitters to swing and miss. A late, tight break on his slider produced swing-throughs even when the pitch missed near hitters' back feet, demonstrating how release characteristics and late movement generated misses. Command of the slider to locations down and away to lefties and down and in to righties amplified its effectiveness as a swing-and-miss pitch."}, {"id": "pa008", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How have resource limitations (rinks, funding, coaching availability) impacted staging or competitiveness of Latvian national championships?", "ev": "Latvia has lacked a primary national stadium for many years, causing the national team to play in stadiums that do not meet UEFA/FIFA standards due to low seating capacity. Plans to build a modern 15,000–20,000 seat stadium were put on hold because of unclear funding strategies among investors and governing bodies."}, {"id": "pa009", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How have Japanese media and fan communities criticized the promotion's booking decisions, faction management, or business practices?", "ev": "Journalists condemned the gimmickry of professional wrestling as \"fake\" in the postwar period around 1947."}, {"id": "pa010", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What documented instances of participant shortages, event cancellations, or category omissions have occurred at Latvian championships?", "ev": "The Riga Football Cup was held intermittently between 1910 and 1936, indicating irregular staging of that national competition. The Latvian Football Union organized the Latvian Championship between 1922 and 1927 and it was replaced by Virsliga in 1927, indicating a change in championship structure and categories."}, {"id": "pa011", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What legal instruments, policy plans, or official reconstruction programs governed rebuilding efforts in the Northern Province?", "ev": "The Indo-Sri Lanka Accord established a mechanism for devolution of power to the provinces and led to political arrangements for northern governance. The Thirteenth Amendment to the Constitution and the Provincial Councils Act No 42 of 1987 established a new system of provincial government for devolution. The Sri Lankan government implemented the \"Uthuru Wasanthaya\" program as an official postwar development program for the Northern Province."}, {"id": "pa012", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What are the current administrative districts and major urban centers within Sri Lanka's Northern Province?", "ev": "The Northern Province contains the administrative districts of Mannar, Mullaitivu and Vavuniya. Jaffna is a major urban center in the Northern Province and its fort came under siege several times during the Sri Lankan Civil War. The Vanni Electoral District covering Mannar, Mullaitivu and Vavuniya currently elects six members to Parliament and had 253,058 registered electors in 2014."}, {"id": "pa013", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "Have there been criticisms or external assessments about the competitiveness or international relevance of Latvia's national championships?", "ev": "Both Daugava Stadium and Skonto Stadium do not meet UEFA/FIFA standards, which limits their suitability for major international events. The Latvian Football Federation sought to build a modern 15,000–20,000-seat stadium to attract international events and improve relevance, reflecting concern about current international competitiveness of venues."}, {"id": "pa014", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What injuries or durability concerns affected Randy Johnson and how did they limit his availability or effectiveness?", "ev": "Johnson was sidelined much of the 1996 season with a back injury that limited his availability that year."}, {"id": "pa015", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How have talent exchanges or international tours affected the promotion's roster exposure and wrestler career trajectories?", "ev": "The promotion sent talent to participate in NJPW's Wrestle Kingdom events and accepted NJPW talent for excursions, exemplified by Kazuchika Okada being sent on a training excursion to the promotion before becoming a future IWGP Heavyweight Champion. The promotion’s working agreements have allowed its championships and wrestlers to be defended and appear on partner shows, increasing those wrestlers' visibility across partner promotions' audiences. The promotion’s talent exchange with AAA and Lucha Underground enabled cross-appearances that led to co-promoted supershows and sell-out crowds, widening roster exposure internationally."}, {"id": "pa016", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How are wrestling factions incorporated into match cards, title opportunities, and tournament structures within the promotion?", "ev": "Promotional storylines have integrated allied fighters and managers who back talent on-screen and form named alliances that compete on cards, as when Junior dos Santos backed Dan Lambert and allied fighters to form an alliance with Men of the Year in AEW. Groups can be officially added to a promotion's roster and use interference and assaults to create title opportunities and storyline momentum, as The Academy did in the IWA before being included on the roster and pursuing championships. Factions have been part of multi-person matches and trios bouts on major cards, exemplified by Dos Santos teaming with Scorpio Sky and Ethan Page in a trios match on AEW Rampage."}, {"id": "pa017", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How did Johnson adapt his mechanics or pitch selection over his career in response to aging or injury?", "ev": "Later in his career Johnson's fastball velocity declined from as high as 102 mph to the mid-90s and his slider velocity fell to around 87 mph, reflecting a loss of pure fastball heat with age. He continued to employ offspeed offerings such as a split-finger fastball and a sinker to induce ground balls as his primary pitches slowed. Johnson also underwent back surgery (removal of a disc) and returned to pitch after rehabilitation, including mixing in unorthodox or situational pitches (an eephus was thrown in one game) during later appearances."}, {"id": "pa018", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What criticisms did contemporaries or commentators raise about Johnson's control, temperament, or interactions with hitters?", "ev": "Opponents and observers described Johnson as intimidating, with Larry Walker saying Johnson 'almost killed me' after facing him in spring training and reacting theatrically when Johnson threw over his head in the All-Star Game."}, {"id": "pa019", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "In what ways did Randy Johnson contribute to team win totals, division titles, or postseason appearances during his tenure?", "ev": "Johnson led the Arizona Diamondbacks to the playoffs in 1999 while posting a 17–9 record, a 2.48 ERA and 364 strikeouts that season. Johnson produced high-win seasons that directly increased team win totals, including 19 wins in 2000 and a 24–5 season in 2002. Johnson and Curt Schilling together anchored the Diamondbacks rotation, providing a two-ace core that supported postseason contention. Johnson’s dominant stretches with the Mariners (for example a 20–4 1997 season and a 53–9 run between 1994–1997) also contributed substantially to team success during those years."}, {"id": "pa020", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How did any statistical limitations—such as walk rates, ERA fluctuations, or platoon splits—temper assessments of Johnson's dominance?", "ev": "Johnson's fastball velocity declined in later years from as high as 102 mph to around 96 mph, and his slider also lost velocity, which tempered perceptions of his dominance late in his career. Larry Walker's unusually high success against Johnson, batting.393 in 28 at bats compared with left-handed hitters overall hitting.199, illustrates notable platoon splits that complicated assessments of Johnson's matchup dominance."}, {"id": "pa021", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What major pitching records and milestones did Randy Johnson achieve during his career?", "ev": "Johnson was listed at 6 feet 10 inches tall and was the tallest player in MLB history when he entered the league. Johnson led his league in strikeouts nine times and finished with the second-most strikeouts in MLB history. Johnson recorded six 300-strikeout seasons (a major league record tied with Nolan Ryan) and had a streak of five consecutive 300-strikeout seasons, setting an MLB record. Johnson won four consecutive Cy Young Awards from 1999–2002 and won the pitching Triple Crown in 2002. Johnson threw a perfect game on May 18, 2004, with 13 strikeouts, becoming the oldest pitcher to throw a perfect game."}, {"id": "pa022", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 ndbacks' rotation after the 2000 trade. Johnson was deployed in high-leverage starting roles, including postseason and no-hit/perfect-game caliber outings, with teammates and coaches crediting his intensity and focus for elevating catchers and the pitching staff. His frequent 300-strikeout seasons and status as a dominant starter led teams to build rotations around his availability and heavy workload during peak years."}, {"id": "pa035", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "Were there notable on-field incidents, ejections, or controversies involving Randy Johnson documented in his career?", "ev": "In the 1997 All-Star Game Johnson theatrically threw over Larry Walker's head, an on-field incident that drew widespread reaction and laughter from players and fans."}, {"id": "pa036", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How did any statistical limitations—such as walk rates, ERA fluctuations, or platoon splits—temper assessments of Johnson's dominance?", "ev": "Johnson showed clear platoon variation with Larry Walker batting.393 in 28 career at-bats against him compared with left-handed hitters overall batting.199 against Johnson. The velocity of his fastball and slider declined in later years from as high as 102 mph to around 96 mph for the fastball and about 87 mph for the slider, reflecting a decrease in his raw stuff over time."}, {"id": "pa037", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 team win totals, division titles, or postseason appearances during his tenure?", "ev": "Johnson led the Arizona Diamondbacks to the playoffs in 1999 with a 17–9 record and 2.48 ERA while recording 364 strikeouts and leading the majors in innings, complete games, and strikeouts. Johnson's performance helped the Diamondbacks reach sustained contention, including a 19-win season in 2000 that contributed to postseason competitiveness after the acquisition of Curt Schilling who, with Johnson, anchored the rotation. Johnson's dominance in 2002, including leading the NL in wins, ERA, and strikeouts, coincided with top team performance and individual awards that supported team success."}, {"id": "pa040", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "What pitches composed Randy Johnson's repertoire and which was considered his most effective strikeout pitch?", "ev": "Johnson's repertoire included a high-velocity fastball, a signature slider, a split-finger fastball (changeup-like), and a sinker. His most effective strikeout pitch was his slider, which had tight late break and was thrown in the low 90s, causing hitters to swing through or miss as it broke just before the plate."}, {"id": "pa041", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "Which major infrastructure projects (roads, schools, hospitals) were completed in the Northern Province by 2018?", "ev": "Osmania College in Jaffna was re-opened and began functioning again as a public school for the city's Muslim community."}, {"id": "pa042", "rules": "모델의 답이 질문이 묻는 것에 답하는지만 본다. 답이 사실인지는 따지지 않는다(그건 다른 검사다) / 답함 = 질문이 묻는 대상(수치·시기·원인·비판 등)에 대한 진술이 있다. 여러 개를 묻는 질문이면 하나라도 직접 답하면 답함 / 일부 = 관련은 있으나 묻는 핵심에서 비껴간다(주변 사실, 일반론) / 답안함 = 같은 주제의 다른 이야기만 한다. 질문이 묻는 것에 대한 진술이 없다 / (no answer) 로 보이면 답안함", "claim": "How are wrestling factions incorporated into match cards, title opportunities, and tournament structures within the promotion?", "ev": "Factions and alliances have been presented as on-screen backing groups that accompany talent and influence match outcomes, such as fighters backing a manager and forming an alliance with established wrestlers. Factions have been incorporated directly into match cards via multi-person matches like trios bouts pitting faction members against rival groups. Groups have interfered in title pictures and been formally added to rosters, leading to faction members receiving title opportunities and storyline-driven bookings. Tag-team and multi-team tournament structures have included faction-related stipulations and large-format matches that involve faction participants."}]}, {"id": "ph_b", "name": "세트 2 (B)", "labels": ["답있음", "답없음", "일부"], "h_claim": "질문 (sub-question)", "h_ev": "컨텍스트 — 모델이 받은 이 질문의 검색 청크 (실린 그대로)", "items": [{"id": "pb000", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Have there been notable governance disputes, administrative suspensions, or corruption allegations involving Ghana's cricket administrators?", "ev": "(John Frederick Mensah > Abstract) John Frederick Mensah is a Ghanaian football administrator and a member of the executive committee of the Ghana Football Association. He was one of three football administrators to have rejected bribes in the Number 12 exposé. The others were Kweku Eyiah and Chief Protocol Officer at the Ministry of Youth and Sports, Diana Boateng.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(Ahmadiyya in Ghana > History > Late twentieth century) On August 10, 1974, Abdul Wahab Adam was appointed as the Amir (Head) and missionary-in-charge of the Ahmadiyya Muslim Mission of Ghana by the then caliph of the Ahmadiyya movement, Mirza Nasir Ahmad. Adam was the first indigenous Ghanaian to hold this office. In the early part of his ministry, Adam shifted the headquarters of the Ghanaian Ahmadiyya Muslim Community from Saltpond to the capital of the country, Accra. The move came in response to Accra's growing economic and political influence in the country, which strongly contrasts with Saltpond, a small unknown town in coastal Ghana.  During the late twentieth century, the Ahmadi missionaries increasingly diverted their attention towards the Christian populations of the country. A large number of books, fliers and audio cassettes were published to meet the new objective. Articles published and public preaching sessions included titles such as, \"Jesus Will not Come Again\", \"Jesus:Son of God or God?\" and \"50,000 errors in the Bible\". Perhaps as a result of this, the Ahmadi Muslim teachings, and particularly its eschatological doctrines have been the most difficult theological challenge the Ghanaian Christians may have encountered since the late twentieth century. The Ahmadi Muslim missionaries, often seen as successful preachers by some locals, who adopt the Bible and Quran in their preaching efforts, have resulted in many Christian evangelists to adopt the two books as well. Another notable consequence is that, since 1964, the Christian denominations in Ghana have come to increasingly recognize the presence of Muslims as important and noticeable members of the Ghanaian society.  The Ahmadiyya Muslim Community significantly increased its social and humanitarian efforts in Ghana. Perhaps the most decisive was the visit to the Gambia by the then Caliph Mirza Nasir Ahmad, whose visit in 1970 was instrumental in the launch of the Nusrat Jahan Scheme which has been responsible for the establishment of a number of schools and hospitals all over West Africa. It has also been argued that besides the Nusrat Jahan Scheme, local missionaries and leaders boosted their efforts in humanitarian activities as well, to \"restore the glory of Islam.\" While opening the fourth Ahmadiyya hospital in the country in 1971, at Agona Swedru, Central Region, Basharat Ahmad Bashir, a leading Ahmadiyya missionary stated that, \"opening hospitals and educational facilities in the country was part of the programme of the Movement to regain the lost heritage and glory of Islam.\"\n\n(Abdul Aziz Fatahiya > Abstract) Abdul Aziz Fatahiya (born March 21, 1982) is a Ghanaian politician who is a member of the ninth Parliament of the fourth republic of Ghana representing Savelugu (Ghana parliament constituency) in the Northern Region of Ghana. She is a member of the New Patriotic Party (NPP).  She has been a member of the New Patriotic Party since she was at the age of 18"}, {"id": "pb001", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What typical funding, sponsorship, and resource-allocation mechanisms do Ghana's cricket administrators use to support operations?", "ev": "(Vodafone > Operations > Africa > Ghana) On 3 July 2008, Vodafone agreed to acquire a 70% stake in Ghana Telecom for $900 million. The acquisition was consummated on 17 August 2008. The same group-led consortium won the second fixed-line licence in Qatar on 15 September 2008.  On 15 April 2009, Ghana Telecom, along with its mobile subsidiary OneTouch, was rebranded as Vodafone Ghana.  In February 2023, Vodafone Group has concluded the sale of its 70% stake in Vodafone Ghana to Telecel Group in a bid to streamline its African portfolio, thus exiting the Ghanaian market.\n\n(John Frederick Mensah > Abstract) John Frederick Mensah is a Ghanaian football administrator and a member of the executive committee of the Ghana Football Association. He was one of three football administrators to have rejected bribes in the Number 12 exposé. The others were Kweku Eyiah and Chief Protocol Officer at the Ministry of Youth and Sports, Diana Boateng.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(David Apasara > Abstract) David Apasera is a Ghanaian politician of the Republic of Ghana. He was the Member of Parliament representing Bolgatanga constituency of the Upper East Region of Ghana in the 4th Parliament of the 4th Republic of Ghana. He is a member of the People's National Convention."}, {"id": "pb002", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What measurable effects have infrastructure improvements had on match frequency, training availability, or player development in Ghana?", "ev": "(Otto Addo > Coaching career > Ghana) On 25 September 2021, the Ghana Football Association announced that they had appointed Addo as one of two deputies for the new Ghana coach, Milovan Rajevac. On 9 February 2022, the Ghana Football Association announced that they had appointed Addo as the interim coach for the Ghana national football team ahead of the team's 2022 FIFA World Cup final play-off matches against Nigeria. On 29 March 2022, he qualified Ghana (on away goals) to the 2022 World Cup in Qatar, after drawing 1–1 against the Super Eagles of Nigeria. The Black Stars of Ghana had earlier drawn 0–0 against the Super Eagles on 25 March.  In May 2022, Addo was appointed as the head coach until the end of December 2022 alongside maintaining Chris Hughton as technical advisor and George Boateng and Mas-Ud Didi Dramani as assistant coaches, the same set-up for the 2022 FIFA World Cup final play-off matches against Nigeria. Addo won his first match as manager on 1 June after leading Ghana to a 3–0 victory over Madagascar in a 2023 AFCON qualifiers.  At the 2022 FIFA World Cup tournament, Ghana went on to lose their first match against Portugal by 3–2, however they won their second group game against South Korea by 3–2. Addo became the first Ghanaian to play for and coach the Ghana national team at the FIFA World Cup. That victory also made Addo the first Ghanaian coach to win a match at the FIFA World Cup. Five days later, Ghana lost to Uruguay and were eliminated from the tournament at the group stages. Prior to the start of the World Cup, Addo had hinted that he would be leaving after the world cup regardless of the outcome. Following their last group match, Addo resigned as the head coach of Ghana and would focus on his other role as a talent coach at Borussia Dortmund. Addo revealed the decision to leave the post as the head coach of Ghana Black star indicating the decision was not only in his hand.\n\n(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(Otto Addo > Coaching career > Ghana > Second Spell > 2026 World Cup qualification) In October 2025, under Otto Addo’s management, Ghana secured qualification for the 2026 FIFA World Cup after a 1–0 victory over Comoros in Accra. This made Addo the first coach in Ghanaian history to guide the Black Stars to two separate World Cups. However, some individuals including Felix Kwakye Ofosu, the Minister in Charge of Government Communications has referred to such calls as misplaced and unfortunate.  Ghana finished the qualifiers unbeaten atop Group I with 25 points. After qualification, Addo urged Ghanaian fans to keep expectations realistic heading into the World Cup. The Sports Minister, Kofi Adams, praised Addo’s role in the turnaround and credited him for navigating the team through pressure periods.  On 31 March 2026, Ghana announced that they had parted ways with Addo effective immediately, following a 2–1 defeat to Germany in a friendly match.\n\n(Takoradi Technical University > Corporate Partnerships > TTE Technical Training Group) The TTE Technical Training Group, a UK technical training school in the oil and gas industries, announced a major partnership in Ghana with Tullow Oil to establish a new training centre aimed at equipping local technicians for work in the oil, gas, manufacturing, and mining industries. The Minister of Education, Professor Jane Naana Poku-Agyemang commissioned a $6 million Technical Training Centre in Takoradi Polytechnic to train Ghanaian students in these fields on 21 June 2013. The centre, named \"Jubilee Technical Training Centre\", was co-sponsored by the Oil Jubilee Partners, Tullow Ghana Limited, Anadarko WCTP Company, Kosmos Energy, Ghana National Petroleum Company, and Sabre Oil/Gas Holding Limited. The centre is the first in West Africa to offer diploma-accredited qualifications to support industry and commerce in Ghana."}, {"id": "pb003", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How has the performance of Ghana's men's national team in regional and ICC-sanctioned tournaments changed following development initiatives?", "ev": "(Ibrahim Sunday > Abstract) Ibrahim Sunday (born 22 July 1944) is a Ghanaian former professional football player and coach. A midfielder, he played the majority of his career for Ghanaian club Asante Kotoko, and was also a member of the Ghana national team, participating in tw\n\n(Otto Addo > Coaching career > Ghana) On 25 September 2021, the Ghana Football Association announced that they had appointed Addo as one of two deputies for the new Ghana coach, Milovan Rajevac. On 9 February 2022, the Ghana Football Association announced that they had appointed Addo as the interim coach for the Ghana national football team ahead of the team's 2022 FIFA World Cup final play-off matches against Nigeria. On 29 March 2022, he qualified Ghana (on away goals) to the 2022 World Cup in Qatar, after drawing 1–1 against the Super Eagles of Nigeria. The Black Stars of Ghana had earlier drawn 0–0 against the Super Eagles on 25 March.  In May 2022, Addo was appointed as the head coach until the end of December 2022 alongside maintaining Chris Hughton as technical advisor and George Boateng and Mas-Ud Didi Dramani as assistant coaches, the same set-up for the 2022 FIFA World Cup final play-off matches against Nigeria. Addo won his first match as manager on 1 June after leading Ghana to a 3–0 victory over Madagascar in a 2023 AFCON qualifiers.  At the 2022 FIFA World Cup tournament, Ghana went on to lose their first match against Portugal by 3–2, however they won their second group game against South Korea by 3–2. Addo became the first Ghanaian to play for and coach the Ghana national team at the FIFA World Cup. That victory also made Addo the first Ghanaian coach to win a match at the FIFA World Cup. Five days later, Ghana lost to Uruguay and were eliminated from the tournament at the group stages. Prior to the start of the World Cup, Addo had hinted that he would be leaving after the world cup regardless of the outcome. Following their last group match, Addo resigned as the head coach of Ghana and would focus on his other role as a talent coach at Borussia Dortmund. Addo revealed the decision to leave the post as the head coach of Ghana Black star indicating the decision was not only in his hand."}, {"id": "pb004", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "Were there any legal disputes, labor complaints, or regulatory actions taken against the promotion, and what were the outcomes?", "ev": "(Invention promotion firm > Legal actions against invention promotion firms > Project Mousetrap) In 1997, the United States Federal Trade Commission (FTC) launched \"Project Mousetrap\" to identify, prosecute and fine firms engaged in fraudulent or deceptive practices, in what was alleged as a massive fraud by a significant amount of invention promotion firms.  In 1998 all of the accused parties except one settled with the FTC and a $250,000 redress fund was set up for inventors taken in by the firms. In 2006, judgment was rendered against Davison & Associates. They were fined $US 26 million to be used to compensate defrauded clients. Davison appealed the judgment, and then settled with the FTC for $10.7 million in 2008.\n\n(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Progressive Era > Labor policy and unions) There were many dramatic changes in the condition of American workers from 1915 to 2015.  Labor unions, especially those affiliated with the American Federation of Labor (AFL), grew rapidly in the early 20th century, and had a progressive agenda as well. After experimenting in the early 20th century with cooperation with business in the National Civic Federation, the AFL turned after 1906 to a working political alliance with the Democratic Party. The alliance was especially important in the larger industrial cities. The unions wanted restrictions on judges who intervened in labor disputes, usually on the side of the employer. They finally achieved that goal with the Norris–La Guardia Act of 1932.  In September 1916, the Federal Employees' Compensation Act introduced benefits to workers who are injured or contract illnesses in the workplace. The act established an agency responsible for federal workers' compensation, which was transferred to the Labor Department in the 1940s and has become known as the Office of Workers' Compensation Programs.  Several other laws aimed at helping working people were passed during the course of the Progressive Era.\n\n(Invention promotion firm > Public posting of complaints against invention promotion firms) The United States Patent and Trademark Office (USPTO) posts complaints online from dissatisfied clients of invention promotion firms and provides an opportunity for invention promotion firms to respond to the complaints. The USPTO, however, does not investigate the validity of any of the complaints or responses.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance."}, {"id": "pb005", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What financial challenges, funding shortfalls, or sponsor withdrawals have affected Ghana's cricket programs and operations?", "ev": "(Ghana–Jamaica relations > Abstract) Ghana–Jamaica relations refers to the bilateral relations between Ghana and Jamaica. Both nations are members of the United Nations, however neither country has a resident ambassador.  Ghana and Jamaica have a Joint Permanent Commission, and there are plans for Ghanaian investment in Jamaica.\n\n(Vodafone > Operations > Africa > Ghana) On 3 July 2008, Vodafone agreed to acquire a 70% stake in Ghana Telecom for $900 million. The acquisition was consummated on 17 August 2008. The same group-led consortium won the second fixed-line licence in Qatar on 15 September 2008.  On 15 April 2009, Ghana Telecom, along with its mobile subsidiary OneTouch, was rebranded as Vodafone Ghana.  In February 2023, Vodafone Group has concluded the sale of its 70% stake in Vodafone Ghana to Telecel Group in a bid to streamline its African portfolio, thus exiting the Ghanaian market.\n\n(Alhassan Suhuyini > Abstract) Alhassan Sayibu Suhuyini (born 12 September 1979) is a Ghanaian broadcast journalist and politician. He belongs to the National Democratic Congress. He is currently a member of the eighth Parliament of the Fourth Republic of Ghana representing Tamale North.  He is a host of two of the station's flagship programs as Ghanaian broadcast journalist who works at Radio Gold in Accra.  He holds a teaching qualification. From Ghana Institute of Management and public Administration He pursued his B.sc. public administration and M.sc. Development Management. He's a Muslim by religion. He also a committee member of land and natural resources. He was member of parliament of the 7th and 8th Republic of Ghana.\n\n(Gold Fields Ghana Foundation > Abstract) The Gold Fields Ghana Foundation is the corporate social responsibility (CSR) arm of Gold Fields Ghana Limited, one of the gold mining companies operating in Ghana. The foundation's objective is to improve the socio-economic conditions of communities located around its mining operations through sustainable development programs in education, health, infrastructure, and environmental conservation. Since its establishment, the foundation has allocated more than US$100 million towards development projects and programs in the host communities surrounding the Tarkwa and Damang mines in the Western Region of Ghana."}, {"id": "pb006", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "How have Japanese media and fan communities criticized the promotion's booking decisions, faction management, or business practices?", "ev": "(NWA National Tag Team Championship > Abstract) The NWA National Tag Team Championship was the primary tag team championship in the National Wrestling Alliance (NWA)-affiliated Georgia Championship Wrestling professional wrestling promotion from 1980 until 1986.\n\n(Innovate Pro Wrestling > Abstract) Innovate Pro Wrestling (formerly Championship Wrestling Alliance and NWA Smoky Mountain) is an American independent professional wrestling promotion based in Kingsport, Tennessee. The company was established in 2004 and until 2017 it was associated with the National Wrestling Alliance. During its time in the NWA, NWA Smoky Mountain Wrestling was considered the flagship promotion of the National Wrestling Alliance.\n\n(Paulie Gilmore > Abstract) James E. Allen is an American professional wrestler and promoter, best known by his ringname \"Big\" Paulie Gilmore or Gilmorea, who wrestled on the New England independent circuit for the Century Wrestling Alliance, the National Wrestling Alliance, the Millennium Wrestling Federation and the World Wrestling Alliance during the 1990s and early 2000s. He is also the owner of New World Wrestling, a small promotion based in southeastern Massachusetts, which was formerly associated with NWA New England from 2004 to 2005.  He is best remembered as Trooper Gilmore, a popular super heavyweight \" fan favorite \", in both the original Century Wrestling Alliance and NWA New England where he was a main rival of \"heel\" wrestler Tony Rumble. He also won the NWA New England Tag Team Championship with The Outpatient as Criminally Insane and Corporal Robinson as 5-0. He was an ally of MWF Tag Team Champions Todd Hanson & Beau Douglas during their feud with Ox Baker 's MWF stable Ox's Army and, in NWW, twice won the promotion's tag team titles with Jimmy \"Jact\" Cash and Brutus \"the Barber\" Beefcake. He has also been a frequent opponent of King Kong Bundy and Abdullah the Butcher when touring the Northeastern United States.\n\n(Professional wrestling in the United Kingdom > History > 1930s: All-in wrestling) While various styles of amateur wrestling continued as legitimate sports, grappling as a promotional business did not return to Britain until the beginning of the 1930s when the success of the more worked aspects of professional wrestling in America, like gimmickry and showmanship, were introduced to British wrestling. It was with this revival that the more submission -based Catch As Catch Can wrestling style, which had already replaced Greco Roman wrestling as the dominant style of professional wrestling in the United States back in the 1890s, became the new dominant style in Britain. With Lancashire style catch-as-catch-can already a major amateur sport particularly in Northern England, there existed a ready-made source of potential recruits to professional wrestling.  Amateur wrestler, Sir Atholl Oakeley got together with fellow grappler Henry Irslinger to launch one of the first promotions to employ the new style of wrestling which was coined \"All-in\" wrestling. Though, like many wrestlers throughout the business, Oakeley would claim his wrestling was entirely legitimate, his claim was highly dubious. Under the British Wrestling Association banner, Oakeley's promotion took off with wrestlers such as Tommy Mann, Black Butcher Johnson, Jack Pye, Norman \"the Butcher\" Ansell, \"College Boy\", and Jack Sherry on the roster, while Oakeley himself would win a series of matches to be crowned the first British Heavyweight Champion.  The business was reaching one of its highest points at the time, with the best part of forty regular venues in London alone. The great demand for wrestling, however, meant there were not enough skilled amateurs to go around, and many promoters switched to more violent styles, with weapons and chairshots part of the proceedings. Women wrestlers and mud-filled rings also became common place. In the late 1930s, the London County Council banned professional wrestling, leaving the business in rough shape just before World War II.\n\n(Professional wrestling in the United Kingdom > History > 1940s: Mountevans' committee) After the war, attempts to relaunch the business in 1947 failed to catch on with journalists, who condemned the gimmickry of professional wrestling as \"fake\". The revelation of this, and the general chaos which had surrounded \"All In\" Wrestling prior to the Wa"}, {"id": "pb007", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What was the ethnic composition of Sri Lanka's Northern Province according to the most recent national census?", "ev": "(Sri Lankan Moors > History > Sri Lankan Civil War) The Sri Lankan Civil War was a 26-year conflict fought on the island of Sri Lanka between the government and the separatist Tamil militant Liberation Tigers of Tamil Eelam (LTTE). The LTTE attempted to create an independent Tamil state called Tamil Eelam in northeast Sri Lanka.  Since 1888, under the initiative of Ponnambalam Ramanathan, the Sri Lankan Tamils launched a campaign to classify Tamil-speaking Sri Lankan Moors as Tamils, primarily to bolster their population numbers for the impending transition to democratic rule in Sri Lanka. Their view holds that the Sri Lankan Moors were mainly Tamil converts to Islam. According to some Tamil nationalists, the concept of Arab descent amongst the Tamil-speaking Moors was invented just to keep the community separate from the Tamils, and this 'separate identity' intended to check the latter's demand for the separate state of Tamil Eelam and to flare up hostilities between the two groups in the broader Tamil–Sinhalese conflict.  The expulsion of the Muslims from the Northern Province was an act of ethnic cleansing carried out by the Liberation Tigers of Tamil Eelam in October 1990. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors.\n\n(Islam in Sri Lanka > Sri Lankan Moors) The Sri Lankan Moors are mostly native speakers of the Tamil language while a few of them speak Sinhala as primary language, and follow Islam as their religion. Sri Lankan Moors comprise 9.30% (2012 Census) of Sri Lanka's population, and constitute the largest ethnic group within the Muslim community in the country.  Islam was spread to Sri Lanka by contacts with the merchant ships operated by the Moor traders between Serendib (Old Persian / Arabic name for Sri Lanka), and various ports in the Arabian Peninsula and North Africa. As per scholars, Sri Lankan Moors are descendant of the Marakkar, Mappilas, Memons and Pathans of South India.\n\n(Sri Lankan Moors > Abstract) Sri Lankan Moors (Tamil: இலங்கைச் சோனகர், romanized: Ilaṅkaic Cōṉakar; Arwi: اَیلَیچْ چٗونَكَرْ; Sinhala: ලංකා යෝනක, romanized: Lanka Yonaka; formerly Ceylon Moors; colloquially referred to as Sri Lankan Muslims) are an ethnic minority group in Sri Lanka, comprising 10.5% of the country's total population. Most of them are native speakers of the Tamil language. The majority of Moors who are not native to Sri Lanka's Northern and Eastern provinces also speak Sinhalese as a second language. They are predominantly followers of Sunni Islam as understood by the Shafi'i school of jurisprudence.\n\n(Demographics of Sri Lanka > Ethnicity) The Sinhalese make up 74.9% of the population (according to 2012 census) and are concentrated in the densely populated south-west and central parts of the island.  The Sri Lanka Tamils, who live predominantly in the north and east of the island, form the largest minority group at 11.1% (according to the 2012 census) of the population.  The Moors, descendants of Arab + Indian traders and native Sri Lankan Tamils, form the third largest ethnic group at 9.3% of the population. These Tamil-speaking Muslims are mostly concentrated in urban areas in the southern parts of the island with substantial populations in the Central and Eastern provinces. During times of Portuguese colonization, Moors were persecuted, and many forced to retreat to the central highlands and the eastern coast.  There are also Indian Tamils who form a distinct ethnic group comprising 4.1% of the population. The British brought them to Sri Lanka in the 19th century as tea and rubber plantation workers, and they remain concentrated in the \"tea country\" of south-central Sri Lanka. The Indian Tamils of Sri Lanka were considered to be \"stateless\" as they were denied Ceylonese citizenship and simultaneously stripped of Indian citizenship, with over 300,000 Indian Tamils were deported back to India, due to the agreement between Sri Lanka and India in 1964. Under the pact, India granted citizenship to the remainder, some 200,000 of whom now live in India. Another 75,000 Indian Tamils, who themselves or whose parents once applied for Indian citizenship, now wish to remain in Sri Lanka. The government has stated these Tamils will not be forced to return to India, although they are not technically citizens of Sri Lanka. By the 1990s most Indian Tamils had received Sri Lankan citizenship, and some even were not granted Sri Lankan citizenship until 2003.  Smaller minorities include the Veddas, the indigenous people of Sri Lanka; Malays who descend from Austronesian settlers; the Burghers, who are descendants of European colonists, principally from Portugal, the Netherlands and, the UK; the ethnic Chinese migrants who came to the island in the 18th and 19th centuries; and the Kaffirs, a small population who are descended from Africans."}, {"id": "pb008", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "What evidence exists of cricket contributing to social, educational, or economic outcomes in Ghanaian communities?", "ev": "(Yoruba people > Demographics > Ghana) There exists an old and thriving Yoruba community in Ghana tracing back to more than three centuries of establishment. The presence of Yoruba people in Ghana traces back to before the concept of the modern Ghanaian nation and are therefore Ghanaian citizens by law. The Yoruba communities became established through various waves and layers for centuries before the colonial era. The earliest wave were long distance merchants, artisans, labourers and explorers who settled in both southern and northern Ghanaian locales such as Salaga, Sekondi-Takoradi, Kumasi, Accra (Jamestown, Ngleshie Alata, Tudu), Yendi, Tamale, Kintampo, Nandom. In Ngleshie Alata (A corruption of English ' Alata ', the Fante and Ga word for Yoruba people based on the region where the majority came from) and the area around the James Fort, the Yoruba presence dates back to 1673 when they were employed to build the fort and settled in large numbers on the eastern coastal region. It is on record that the first ' Alata Akutso Mantse ' or Alata division head, a Yoruba speaker named Ojo employed by the Royal African Company ascended an Accra royal stool becoming head of the Alata quarter of James Town in 1748, a position his descendants continue to hold to this very day.  In the popular 18th century Gonja Salaga Slave Market, the Yoruba residents of the town would not allow their fellow countrymen captured and brought to the markets to be sold to the Ashantis who would march them to the coast. Rather, they would barter for the release of the Yoruba captives who would in turn work for their benefactors as tradesmen until they earned their release. This earliest wave was followed by an intermediate wave of slave returnees who were predominantly of Yoruba descent like the Taboms/Agudas who settled along the Ghanaian coast. Then came the third wave who came during the Gold Coast colonial period. By this period, they had firmly entrenched themselves in the country's commerce and distribution systems and constituted a substantial percentage of merchants and traders in the country's large markets as proprietors of wholesale enterprises. They were the largest group of immigrants established in the pre-independence Gold Coast. In 1950 they constituted 15% of traders in Accra, 23% in Kumasi, and over a third in Tamale. They were usually referred to in southern Ghana as Yoruba, Lagosian, Alata, or Anago. It was the early stream of this wave in the 1830s that established places like Accra New Town which was previously known as Lagos town and before then as Araromi.  There is no codification for the Yoruba ethnicity in the most recent Ghanaian censuses but in previous ones, they were considered an indigenous Ghanaian group with origins outside modern Ghana. In the 1960 Ghanaian population census, there were 109,090 Yorubas. Of this figure; 100,560 were Yoruba ' proper ' while 8,530 were Atakpame (Ana). This represented 1.6% of the Ghanaian population."}, {"id": "pb009", "rules": "
