. In Northern Sri Lanka, the LTTE forcibly expelled the Muslim population from the Northern Province at gunpoint and confiscated their properties. Yogi, the LTTE's political spokesman, claimed that this expulsion was carried out in retaliation for atrocities committed against the Tamils in the Eastern Province by Muslims, who were seen by the LTTE as collaborators of the Sri Lankan Army.  Sri Lanka's Muslims still hold a bitter grudge for their forced expulsion from the North by the LTTE. In 2002, LTTE leader Vellupillai Prabhakaran formally apologized for the expulsion of the Muslims from the North. There has been a stream of Muslims travelling in and out of Jaffna since the end of the war. Some families have returned and the re-opened Osmania College, a public school in Jaffna which was once a prominent educational institution for the city's Muslim community. According to a Jaffna Muslim source, there is a floating population of about 2,000 Muslims in Jaffna. Around 1,500 are Jaffna Muslims, while the rest are Muslims from outside of Jaffna. About 10 Muslim shops are functioning and the numbers are slowly growing.\n\n(Fortification > History > Indian subcontinent > Sri Lanka) Forts in Sri Lanka date back thousands of years, with many being built by Sri Lankan kings. These include several walled cities. With the outset of colonial rule in the Indian Ocean, Sri Lanka was occupied by several major colonial empires that from time to time became the dominant power in the Indian Ocean. The colonists built several western-style forts, mostly in and around the coast of the island. The first to build colonial forts in Sri Lanka were the Portuguese; these forts were captured and later expanded by the Dutch. The British occupied these Dutch forts during the Napoleonic wars. Most of the colonial forts were garrisoned up until the early 20th century. The coastal forts had coastal artillery manned by the Ceylon Garrison Artillery during the two world wars.Most of these were abandoned by the military but retained civil administrative officers, while others retained military garrisons, which were more administrative than operational. Some were reoccupied by military units with the escalation of the Sri Lankan Civil War; Jaffna fort, for example, came under siege several times.\n\n(Vanni Electoral District > Abstract) Vanni Electoral District (Tamil: வன்னி தேர்தல் மாவட்டம்) is one of the 22 multi-member electoral districts of Sri Lanka created by the 1978 Constitution of Sri Lanka. The district covers the administrative districts of Mannar, Mullaitivu and Vavuniya in the Northern province. The district currently elects 6 of the 225 members of the Sri Lankan Parliament and had 253,058 registered electors in 2014. The district is Sri Lanka's Electorate Number 11.\n\n(Islam in Sri Lanka > Abstract) Islam is the third largest religion in Sri Lanka, with about 9.7 percent of the total population following the religion. About 1.9 million Sri Lankans adhere to Islam as per the Sri Lanka census of 2012. The majority of Muslims in Sri Lanka are concentrated in the Eastern Province of the island. Other areas containing significant Muslim minorities include the Western, Northwestern, North Central, Central and Sabaragamuwa provinces. Muslims form a large segment of the urban population of Sri Lanka and are mostly concentrated in major cities and large towns in Sri Lanka, like Colombo. Most Sri Lankan Muslims primarily speak Tamil, though it is not uncommon for Sri Lankan Muslims to be fluent in Sinhalese. Sri Lankan Muslims of Pakistani and Indian origin also speak Urdu while Sri Lankan Malays speak the Sri Lankan Malay creole language in addition to Sinhalese and Tamil.  Islam in Sri Lanka traces its origin back to the arrival of Middle Eastern merchants in the Indian Ocean. By the 16th century, Middle Eastern traders' were the main traders of spice in Sri Lanka, with networks extending to the Middle East. The descendants of these merchants are commonly believed to be the Sri Lankan Moors.\n\n(Sri Lankan Moors > Abstract) Sri Lankan Moors (Tamil: இலங்கைச் சோனகர், romanized: Ilaṅkaic Cōṉakar; Arwi: اَیلَیچْ چٗونَكَرْ; Sinhala: ලංකා යෝනක, romanized: Lanka Yonaka; formerly Ceylon Moors; colloquially referred to as Sri Lankan Muslims) are an ethnic minority group in Sri Lanka, comprising 10.5% of the country's total population. Most of them are native speakers of the Tamil language. The majority of Moors who are not native to Sri Lanka's Northern and Eastern provinces also speak Sinhalese as a second language. They are predominantly followers of Sunni Islam as understood by the Shafi'i school of jurisprudence."}, {"id": "pb029", "rules": "아래 컨텍스트만 보고 판단한다. 바깥 지식은 쓰지 않는다 / 답있음 = 질문이 묻는 것에 대한 사실 진술이 컨텍스트에 있다. 일부만 묻는 질문이면 그 일부로 충분 / 일부 = 질문과 관련된 사실은 있으나 묻는 것의 핵심에는 못 미친다 / 답없음 = 질문에 답하는 사실이 없다. 주제만 같고 다른 내용이면 답없음", "claim": "When and how was cricket first introduced and played in the Gold Coast (modern Ghana) during the colonial era?", "ev": "(Yoruba people > Demographics > Ghana) There exists an old and thriving Yoruba community in Ghana tracing back to more than three centuries of establishment. The presence of Yoruba people in Ghana traces back to before the concept of the modern Ghanaian nation and are therefore Ghanaian citizens by law. The Yoruba communities became established through various waves and layers for centuries before the colonial era. The earliest wave were long distance merchants, artisans, labourers and explorers who settled in both southern and northern Ghanaian locales such as Salaga, Sekondi-Takoradi, Kumasi, Accra (Jamestown, Ngleshie Alata, Tudu), Yendi, Tamale, Kintampo, Nandom. In Ngleshie Alata (A corruption of English ' Alata ', the Fante and Ga word for Yoruba people based on the region where the majority came from) and the area around the James Fort, the Yoruba presence dates back to 1673 when they were employed to build the fort and settled in large numbers on the eastern coastal region. It is on record that the first ' Alata Akutso Mantse ' or Alata division head, a Yoruba speaker named Ojo employed by the Royal African Company ascended an Accra royal stool becoming head of the Alata quarter of James Town in 1748, a position his descendants continue to hold to this very day.  In the popular 18th century Gonja Salaga Slave Market, the Yoruba residents of the town would not allow their fellow countrymen captured and brought to the markets to be sold to the Ashantis who would march them to the coast. Rather, they would barter for the release of the Yoruba captives who would in turn work for their benefactors as tradesmen until they earned their release. This earliest wave was followed by an intermediate wave of slave returnees who were predominantly of Yoruba descent like the Taboms/Agudas who settled along the Ghanaian coast. Then came the third wave who came during the Gold Coast colonial period. By this period, they had firmly entrenched themselves in the country's commerce and distribution systems and constituted a substantial percentage of merchants and traders in the country's large markets as proprietors of wholesale enterprises. They were the largest group of immigrants established in the pre-independence Gold Coast. In 1950 they constituted 15% of traders in Accra, 23% in Kumasi, and over a third in Tamale. They were usually referred to in southern Ghana as Yoruba, Lagosian, Alata, or Anago. It was the early stream of this wave in the 1830s that established places like Accra New Town which was previously known as Lagos town and before then as Araromi.  There is no codification for the Yoruba ethnicity in the most recent Ghanaian censuses but in previous ones, they were considered an indigenous Ghanaian group with origins outside modern Ghana. In the 1960 Ghanaian population census, there were 109,090 Yorubas. Of this figure; 100,560 were Yoruba ' proper ' while 8,530 were Atakpame (Ana). This represented 1.6% of the Ghanaian population.\n\n(Ghana Medical Association > History) The earliest medical organisation of medical staff was during the Gold Coast era when the Gold Coast Medical Practitioners Union was formed in 1933. This was founded by three doctors, Frederick Victor Nanka-Bruce who was the president and spokesman, C.E. Reindorf and W.A.C. Nanka-Bruce. J.E. Hutton Mills was the secretary. Following the establishment of an African government under colonial rule in 1951, a Ghana branch of the British Medical Association was formed in January 1953. This also had Nanka-Bruce as its first president. Both associations were merged to form the Ghana Medical Association on 4 January 1958. It was inaugurated by Kwame Nkrumah at the Arden Hall of the Ambassador Hotel in Accra. Charles Easmon was elected as the first president of the GMA.\n\n(History of Ghana > British Gold Coast > British rule of the Gold Coast: the colonial era > Economic and social development) The years of British administration of the Gold Coast during the 20th century were an era of significant progress in social, economic, and educational development. Communications and railroads were greatly improved. Poverty fell significantly and Ghanaian peasantry flourished. New crops were introduced. A leading crop that was the result of an introduced crop was coffee. However, most spectacular among these introduced crops was the cocoa tree which had been indigenous to the New World and had been introduced in Africa by the Spanish and Portuguese. Cocoa had been introduced to the Gold Coast in 1879 by Tetteh Quashie. Cocoa tree raising and farming became widely accepted in the eastern part of the Gold Coast. In 1891, the Gold Coast exported 80 lbs of cocoa worth no more than 4 pounds sterling. By the 1920s cocoa exports had passed 200,000 tons and had reached a value of 4.7 million pounds sterling. Cocoa production became a major part of the economy of the Gold coast and later a major part of Ghana's economy.  The colony's earnings increased further from the export of timber and gold. Revenue from export of the colony's natural resources financed internal improvements in infrastructure and social services. The foundation of an educational system more advanced than any other else in West Africa also resulted from mineral export revenue. It was through British-style education that a new Ghanaian elite was created. From beginnings in missionary schools, the early part of the 20th century saw the opening of secondary schools and the country's first institute of higher learning.  Many of the economic and social improvements in the Gold Coast in the early part of the 20th century have been attributed to the Canadian-born Gordon Guggisberg, governor from 1919 to 1927. Within the first six weeks of his governorship, he presented a ten-year development programme to the Legislative Council. He suggested first the improvement of transportation. Then, in order of priority, his prescribed improvements included water supply, drainage, hydroelectric projects, public buildings, town improvements, schools, hospitals, prisons, communication lines, and other services. Guggisberg also set a goal of filling half of the colony's technical positions with Africans as soon as they could be trained. His programme has been described as the most ambitious ever proposed in West Africa up to that time.  The colony assisted Britain in both World War I and World War II. In the ensuing years, however, postwar inflation and instability severely hampered readjustment for returning veterans, who were in the forefront of growing discontent and unrest. Their war service and veterans' associations had broadened their horizons, making it difficult for them to return to the humble and circumscribed positions set aside for Africans by the colonial authorities.\n\n(Alhassan Andani > Abstract) Alhassan Andani (born 24 November 1960) is a Ghanaian economist and grandson of Naa Andani who ruled Dagbon in the colonial era. He is the founder and chairman of Leadership Vision Strategy Africa. Mr.Andani is a former chief executive director of Stanbic bank. He holds the position of Chairman of Council for Scientific & Industrial Research, Chairman of SOS Children's Villages Ghana and serves on the board of Gold Fields Limited. Alhassan Andani is Independent Non-Executive Director of the company. Mr Andani is a former CEO and executive director of Stanbic Bank Ghana; the board chairperson of the Ghana Council for Scientific and Industrial Research (CSIR), a director of SOS Villages Ghana, and has held other corporate directorships in the past. He holds a BSc in (Agriculture), University of Ghana; MA (Banking and Finance), Finafrica Institute in Italy.\n\n(AJ DaHottest > Abstract) AJ DaHottest (born Augustine Odortey Akrong aka Augustine Jebor) is a Ghanaian-Liberian rapper, singer-songwriter, DJ, and radio personality at YFM Ghana where he hosts the Shouts On Y show. He is recognized in the Ghanaian entertainment industry for his energetic blend of Afropop and hip hop style music played on his shows. Born in Liberia to Ghanaian parents, his family relocated to Ghana when he was young during the peak of the First Liberian Civil War and has since become a versatile entertainer known for his work both behind the microphone and on the airwaves in Ghana."}]}];
const KEY = "r2_ph_v1";
let ans = {}; try { ans = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
for (const s of SETS) ans[s.id] = ans[s.id] || {};
let si = 0, i = 0;
try { const p = JSON.parse(localStorage.getItem(KEY + "_pos") || "null"); if (p) { si = p[0]; i = p[1]; } } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ans));
                           localStorage.setItem(KEY + "_pos", JSON.stringify([si, i])); } catch (e) {} };
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const filled = s => Object.keys(ans[s.id]).filter(k => s.items.some(x => x.id === k)).length;

function renderTabs() {
  const t = document.getElementById("tabs"); t.innerHTML = "";
  SETS.forEach((s, k) => {
    const b = document.createElement("button");
    const n = filled(s);
    b.className = "tab" + (k === si ? " on" : "") + (n === s.items.length ? " full" : "");
    b.innerHTML = esc(s.name) + '<span class="c">' + n + "/" + s.items.length + "</span>";
    b.onclick = () => { si = k; i = 0; const j = s.items.findIndex(x => !ans[s.id][x.id]); if (j >= 0) i = j; render(); };
    t.appendChild(b);
  });
}
function render() {
  const s = SETS[si], it = s.items[i];
  renderTabs();
  document.getElementById("pos").textContent = s.name + "  " + (i + 1) + " / " + s.items.length;
  document.getElementById("idl").textContent = it.id;
  document.getElementById("rulebody").innerHTML =
    it.rules.split(" / ").map(x => "<p>· " + esc(x) + "</p>").join("");
  document.getElementById("h_claim").textContent = s.h_claim;
  document.getElementById("h_ev").textContent = s.h_ev;
  document.getElementById("claim").textContent = it.claim;
  document.getElementById("ev").textContent = it.ev;
  document.getElementById("ev").scrollTop = 0;
  document.querySelectorAll("[data-k]").forEach(b => {
    const v = s.labels[+b.dataset.k];
    b.querySelector("span").textContent = v;
    b.classList.toggle("on", ans[s.id][it.id] === v);
  });
  const tot = SETS.reduce((a, x) => a + x.items.length, 0), got = SETS.reduce((a, x) => a + filled(x), 0);
  document.getElementById("cnt").innerHTML = got === tot
    ? '<span class="done">전부 완료 — CSV 를 내려받으세요</span>' : ("전체 " + got + " / " + tot);
  document.getElementById("pb").style.width = (100 * got / tot) + "%";
  save();
}
function pick(k) {
  const s = SETS[si];
  ans[s.id][s.items[i].id] = s.labels[k]; save();
  if (i < s.items.length - 1) i++;
  render();
}
document.querySelectorAll("[data-k]").forEach(b => b.onclick = () => pick(+b.dataset.k));
document.getElementById("prev").onclick = () => { if (i > 0) { i--; render(); } };
document.getElementById("next").onclick = () => { if (i < SETS[si].items.length - 1) { i++; render(); } };
document.getElementById("jump").onclick = () => {
  for (let d = 0; d < SETS.length; d++) {
    const k = (si + d) % SETS.length, j = SETS[k].items.findIndex(x => !ans[SETS[k].id][x.id]);
    if (j >= 0) { si = k; i = j; render(); return; }
  }
  alert("전부 채웠습니다. CSV 를 내려받으세요.");
};
document.onkeydown = e => {
  if (e.key === "1") pick(0); else if (e.key === "2") pick(1); else if (e.key === "3") pick(2);
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
};
document.getElementById("dl").onclick = () => {
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = [["set", "item_id", "human_label"].join(",")];
  for (const s of SETS) for (const x of s.items) rows.push([q(s.id), q(x.id), q(ans[s.id][x.id] || "")].join(","));
  const blob = new Blob(["\ufeff" + rows.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "labels_ph_filled.csv"; a.click();
};
render();
