# LFM M1 — Test A 설정. 코드에 하드코딩 금지, 모든 파라미터는 여기서 주입한다.
# SPEC_M1_TestA_v1.1.md §7 의 필수 키를 전부 포함한다.

seed: 42

paths:
  data_dir: data
  raw_dir: data/raw
  index_dir: data/index
  results_dir: results
  cache_dir: .cache/llm

data:
  hf_dataset: wikimedia/structured-wikipedia
  hf_config: enwiki_namespace_0   # 영어판 namespace 0. README configs 기준
  hf_revision: 417c267bb457fa645c22eb3b5c77764963194c70   # 스냅샷 고정 (2026-05-19)
  hf_file_glob: enwiki/data/enwiki_namespace_0_*.parquet
  language: en
  max_articles: 150000            # SPEC v1.1 기본값 30000 에서 상향.
                                  # 30000 으로는 교차 도메인 토픽 후보가 28개뿐이었다
                                  # (기준: 관련문서>=30 & infobox 유형>=3). HANDOFF §4 의
                                  # "커버리지 미달이면 max_articles 를 올려 P1 부터 재실행" 경로.
  row_groups_per_shard: 3         # 샤드당 range-read 할 row group 수 (층화 표집 폭)
  min_abstract_chars: 200         # 이보다 짧은 abstract 는 스텁으로 보고 제외
  min_chunks_per_topic: 20
  n_topics: 50

topics:                           # SPEC §2.3 교차 도메인 후보 선별 임계
  min_related_docs: 30            # 코퍼스 내 관련 문서 하한. min_chunks_per_topic 보다 넉넉히
  min_infobox_types: 3            # "서로 다른 3개 이상 하위주제" 의 조작적 정의
  min_term_hits: 2                # 이웃 판정: 변별력 용어 중 몇 개를 담아야 하는가
  n_terms: 5                      # target 당 변별력 용어 수
  df_lo: 20                       # 변별력 용어의 문서빈도 하한 (이웃이 생길 만큼)
  df_hi: 3000                     # 상한 (기능어 배제)
  min_target_abstract_chars: 600  # target 후보의 '두께' 기준
  min_target_section_chars: 6000
  min_target_references: 20
  max_per_infobox_type: 3         # 다양성: 같은 유형이 후보를 독식하지 않게
  n_candidates: 60                # 50개 승인 + 예비
  min_term_len: 4
  batch_size: 10                  # 문구 생성 배치당 후보 수

retrieval:
  backend: bm25s                  # 변경 #5. {bm25s, rank_bm25}
  top_k: 5
  retry_k_multiplier: [1, 2, 3]   # 변경 #1. 라운드별 검색 폭 배수
  max_chunks: 4000000
  chunk_max_tokens: 1200          # 섹션이 이 값을 넘으면 문단 분할

llm:
  provider: openai                # 상용 API 는 OpenAI 만 (CLAUDE.md 모델 정책)
  model: gpt-5-mini
  max_tokens: 2000                # reasoning + 가시 출력의 합산 상한이다 (아래 주석 참고)
  reasoning_effort: low           # gpt-5-mini 는 추론 모델. 기본값(medium)은 출력 토큰의
                                  # 84%를 reasoning 에 쓰고 가시 답안은 630자로 눌린다.
                                  # {minimal, low, medium, high}. null 이면 요청에서 생략.
                                  # 전 시스템 공통 고정 변인이다 — 조건별로 바꾸지 마라.
  temperature: null               # null 이면 요청에서 생략한다 (모델별 지원 차이 회피)
  max_tokens_param: auto          # {auto, max_tokens, max_completion_tokens}
  timeout_s: 120
  max_retries: 4
  cache_enabled: true

perspectives:
  min_sub_questions: 3            # SPEC §3.2 — role 당 3~5개
  max_sub_questions: 5

branch:
  max_context_chars: 12000        # 생성 프롬프트에 싣는 청크 본문 상한
  max_claims: 20
  max_claim_chars: 8000
  truncation_retry_mult: 2        # 응답이 잘리면 max_tokens 를 이 배수로 올려 1회 재시도

nli:
  model: cross-encoder/nli-deberta-v3-base
  device: auto                    # {auto, cuda, cpu}. GPU 없으면 base 강제
  batch_size: 16
  tau_ground: 0.5

verify:
  tau_g_global: 0.80              # 변경 #2 — primary_tau 와 동일하게 고정
  tau_c_global: 0.80

sweep:
  tau: [0.7, 0.8, 0.9]
  primary_tau: 0.8
  bootstrap_n: 1000

max_rounds: 3

retry_directives:                 # 변경 #1. 키는 라운드 번호(int)
  1: "이전 시도는 근거가 부족했다. 다른 하위 질문 각도와 다른 출처를 우선하라."
  2: "앞선 두 시도가 실패했다. 하위 질문을 더 구체적인 사실 단위로 쪼개고 인용을 늘려라."
