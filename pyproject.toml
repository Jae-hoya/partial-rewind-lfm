[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lfm"
version = "0.1.0"
description = "Localize, Freeze, Mutate — M1 Test A (waste-ratio measurement)"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.20",
    "pyarrow>=16",
    "duckdb>=1.0",
    "bm25s>=0.2",
    "rank_bm25>=0.2",
    "transformers>=4.42",
    "torch>=2.3",
    "sentencepiece>=0.2",
    "pyyaml>=6",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["lfm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
